<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — Prime Era</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts.css?v=202610022138">
<link rel="stylesheet" href="assets/pe-core.css?v=202610022138">
<script src="assets/pe-core.js?v=202610022138" data-module="admin"></script>
<style>
  :root{ --ink:var(--pe-ink); --soft:var(--pe-ink-2); --faint:var(--pe-ink-3); --line:var(--pe-line); --bg:var(--pe-bg-2); --card:var(--pe-card); --accent:var(--pe-accent); --accent-t:var(--pe-accent-t); --danger:var(--pe-danger); --ok:var(--pe-ok); --warn:var(--pe-warn); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--pe-font); font-size:14px; -webkit-font-smoothing:antialiased; }
  button,input,select,textarea{ font-family:inherit; }
  .wrap{ max-width:1240px; margin:0 auto; padding:calc(var(--pe-nav-h) + 26px) 24px 60px; }
  @media(max-width:700px){ .wrap{ padding:calc(var(--pe-nav-h) + 16px) 12px 40px; } }
  .head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .head h1{ margin:0; font:300 34px/1.1 var(--pe-font); letter-spacing:-.02em; }
  .head p{ margin:4px 0 0; color:var(--soft); font-size:13.5px; }
  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 14px; min-width:110px; }
  .stat b{ display:block; font-size:20px; }
  .stat span{ font-size:12px; color:var(--soft); }
  .stat.hot{ border-color:var(--pe-warn); background:var(--pe-warn-t); }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs button{ background:none; border:none; border-bottom:2px solid transparent; padding:10px 14px; font:600 11.5px var(--pe-mono); letter-spacing:.05em; text-transform:uppercase; color:var(--soft); cursor:pointer; white-space:nowrap; display:flex; gap:7px; align-items:center; }
  .tabs button:hover{ color:var(--ink); }
  .tabs button.on{ color:var(--ink); border-bottom-color:var(--accent); }
  .tabs .n{ background:var(--danger); color:#fff; font-size:11px; border-radius:999px; min-width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
  .tabs .n.grey{ background:var(--pe-line); color:var(--soft); }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .search{ flex:0 1 280px; min-width:180px; border:1px solid var(--line); border-radius:999px; padding:9px 14px; font-size:14px; background:var(--pe-card); outline:none; }
  .search:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--pe-accent-t); }
  .chip{ border:1px solid var(--line); background:var(--pe-card); border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer; color:var(--soft); display:inline-flex; gap:6px; align-items:center; }
  .chip:hover{ border-color:var(--pe-ink-3); color:var(--ink); }
  .chip.on{ border-color:var(--accent); background:var(--accent-t); color:var(--pe-accent-ink); font-weight:600; }
  .grow{ flex:1; }
  .btn{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--pe-card); border-radius:999px; padding:8px 14px; font:600 11.5px var(--pe-mono); letter-spacing:.04em; text-transform:uppercase; cursor:pointer; color:var(--ink); white-space:nowrap; text-decoration:none; }
  .btn:hover{ border-color:var(--accent); background:var(--pe-accent-t); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--pe-accent-h); }
  .btn.ok{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn.ok:hover{ background:var(--pe-ok); }
  .btn.danger-t{ color:var(--danger); }
  .btn.danger-t:hover{ border-color:var(--danger); background:var(--pe-danger-t); }
  .btn.sm{ padding:5px 11px; font-size:10.5px; }
  .btn:disabled{ opacity:.5; cursor:default; }

  /* заявки */
  .req-list{ display:flex; flex-direction:column; gap:12px; }
  .req{ display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:start; padding:18px; }
  .req h3{ margin:0 0 3px; font-size:16px; }
  .req .meta{ color:var(--soft); font-size:13px; line-height:1.55; }
  .req .meta b{ color:var(--ink); font-weight:600; }
  .req .comment{ margin-top:8px; background:var(--pe-sunk); border-radius:10px; padding:8px 11px; font-size:13.5px; line-height:1.5; }
  .req .mods{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .req .acts{ display:flex; flex-direction:column; gap:6px; }
  .kind{ display:inline-block; font:700 10px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; padding:3px 7px; border-radius:6px; margin-left:6px; vertical-align:2px; }
  .kind.reg{ background:var(--pe-warn-t); color:var(--pe-warn); }
  .kind.acc{ background:var(--pe-accent-t); color:var(--pe-accent-ink); }
  .kind.gst{ background:rgba(124,58,237,.14); color:#8B6CF0; }
  @media(max-width:720px){ .req{ grid-template-columns:auto 1fr; } .req .acts{ grid-column:1 / -1; flex-direction:row; flex-wrap:wrap; } }
  .mod-pill{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:4px 10px 4px 6px; font-size:12.5px; background:var(--pe-card); }
  .mod-pill i{ width:20px; height:20px; border-radius:6px; background:var(--accent-t); color:var(--pe-accent-ink); display:inline-flex; align-items:center; justify-content:center; }
  .empty{ padding:46px 20px; text-align:center; color:var(--soft); }
  .empty b{ display:block; color:var(--ink); font-size:16px; margin-bottom:6px; }

  /* пользователи */
  table.users{ width:100%; border-collapse:collapse; }
  table.users th{ text-align:left; font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.users td{ padding:11px 14px; border-bottom:1px solid var(--pe-line-2); vertical-align:middle; }
  table.users tr:last-child td{ border-bottom:none; }
  table.users tbody tr{ cursor:pointer; transition:background .1s; }
  table.users tbody tr:hover{ background:var(--pe-hover); }
  .who{ display:flex; align-items:center; gap:11px; min-width:0; }
  .who b{ display:block; font-weight:600; }
  .who span{ display:block; font-size:12.5px; color:var(--faint); }
  .st{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .st i{ width:8px; height:8px; border-radius:50%; }
  .st.active i{ background:var(--ok); } .st.pending i{ background:#F59E0B; } .st.blocked i{ background:var(--danger); } .st.rejected i, .st.deleted i{ background:var(--pe-ink-3); }
  .role{ font-size:12.5px; color:var(--soft); white-space:nowrap; }
  .role.owner{ color:var(--pe-warn); font-weight:600; } .role.admin{ color:var(--pe-accent-ink); font-weight:600; } .role.moderator{ color:#8B6CF0; font-weight:600; }

  /* роли и права */
  .roles-intro{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .roles-intro .card{ padding:14px 16px; }
  .roles-intro h3{ margin:0 0 4px; font-size:14px; }
  .roles-intro p{ margin:0; color:var(--soft); font-size:12.5px; line-height:1.5; }
  @media(max-width:900px){ .roles-intro{ grid-template-columns:1fr 1fr; } }
  @media(max-width:560px){ .roles-intro{ grid-template-columns:1fr; } }
  table.perms{ width:100%; border-collapse:collapse; }
  table.perms th, table.perms td{ padding:11px 14px; border-bottom:1px solid var(--pe-line-2); text-align:center; vertical-align:middle; }
  table.perms th:first-child, table.perms td:first-child{ text-align:left; }
  table.perms thead th{ font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }
  table.perms td b{ display:block; font-weight:600; font-size:13.5px; }
  table.perms td small{ display:block; color:var(--soft); font-size:12.5px; margin-top:2px; line-height:1.45; }
  table.perms tr.grp td{ background:var(--pe-hover); font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); padding:8px 14px; }
  .perm-na{ color:var(--pe-ink-3); font-size:12px; }
  .note-box{ background:var(--pe-accent-t); border:1px solid var(--pe-line); border-radius:12px; padding:11px 14px; font-size:13px; line-height:1.55; color:var(--pe-ink); margin:0 0 14px; }
  .role-sel{ border:1px solid var(--line); border-radius:9px; padding:6px 8px; font-size:13px; background:var(--pe-card); }
  .people-roles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:0; }
  .people-roles .pr{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--pe-line-2); }
  .people-roles .pr .who{ flex:1; }

  /* инструменты */
  .tools{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
  .tool{ padding:18px; display:flex; flex-direction:column; gap:10px; }
  .tool-h{ display:flex; gap:12px; align-items:center; }
  .tool-h .ic{ width:40px; height:40px; border-radius:11px; background:var(--accent-t); color:var(--pe-accent-ink); display:flex; align-items:center; justify-content:center; flex:none; }
  .tool h3{ margin:0; font-size:15px; }
  .tool p{ margin:0; color:var(--soft); font-size:13px; line-height:1.5; }
  .tool .who-can{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--soft); }
  .tool .who-can span.r{ border:1px solid var(--line); border-radius:999px; padding:2px 9px; background:var(--pe-card); color:var(--ink); }
  .tool .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; }
  .tool .recent{ border-top:1px solid var(--pe-line-2); padding-top:8px; font-size:12.5px; color:var(--soft); line-height:1.55; }
  .tool .recent div{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acc-icons{ display:flex; gap:4px; flex-wrap:wrap; }
  .acc-icons i, .acc-tg{ width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent;
    background:color-mix(in srgb, var(--mc, var(--pe-accent)) 16%, transparent); color:var(--mc, var(--pe-accent)); padding:0; }
  .acc-icons i.no, .acc-tg.no{ background:var(--pe-sunk); color:var(--pe-ink-3); }
  .acc-tg{ cursor:pointer; transition:transform .12s, border-color .12s; }
  .acc-tg:hover{ border-color:var(--mc, var(--pe-accent)); transform:translateY(-1px); }
  .acc-hint{ font-size:12.5px; color:var(--pe-ink-3); margin:-4px 0 10px; }
  .acc-all{ font-size:12.5px; color:var(--soft); }
  .muted{ color:var(--faint); font-size:13px; }
  .table-wrap{ overflow-x:auto; }
  @media(max-width:860px){
    table.users thead{ display:none; }
    table.users, table.users tbody, table.users tr, table.users td{ display:block; width:100%; }
    table.users tr{ padding:12px 14px; border-bottom:1px solid var(--pe-line-2); }
    table.users td{ padding:3px 0; border:none; }
    table.users td[data-l]::before{ content:attr(data-l)': '; color:var(--faint); font-size:12px; }
  }

  /* матрица доступа */
  table.matrix{ width:100%; border-collapse:collapse; }
  table.matrix th, table.matrix td{ padding:10px 12px; border-bottom:1px solid var(--pe-line-2); text-align:center; }
  table.matrix th:first-child, table.matrix td:first-child{ text-align:left; position:sticky; left:0; background:var(--pe-card); z-index:1; }
  table.matrix thead th{ font-size:12.5px; font-weight:600; vertical-align:bottom; min-width:110px; }
  table.matrix thead th small{ display:block; margin-top:6px; }
  .tgl{ appearance:none; -webkit-appearance:none; width:38px; height:22px; border-radius:999px; background:var(--pe-line); position:relative; cursor:pointer; transition:background .15s; vertical-align:middle; margin:0; }
  .tgl::after{ content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .15s; }
  .tgl:checked{ background:var(--accent); }
  .tgl:checked::after{ transform:translateX(16px); }
  .tgl:disabled{ opacity:.45; cursor:default; }
  .tgl:focus-visible{ outline:3px solid var(--pe-accent-t); outline-offset:2px; }
  .link-btn{ background:none; border:none; color:var(--accent); font-size:11.5px; cursor:pointer; padding:0; }
  .link-btn:hover{ text-decoration:underline; }

  /* модули */
  .mod-row{ display:grid; grid-template-columns:auto 1fr repeat(3, 130px) auto; gap:14px; align-items:center; padding:16px 18px; border-bottom:1px solid var(--pe-line-2); }
  .mod-row:last-child{ border-bottom:none; }
  .mod-row .ic{ width:40px; height:40px; border-radius:11px; background:var(--accent-t); color:var(--pe-accent-ink); display:flex; align-items:center; justify-content:center; }
  .mod-row h3{ margin:0 0 3px; font-size:15px; }
  .mod-row p{ margin:0; color:var(--soft); font-size:13px; line-height:1.45; }
  .mod-row label{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--soft); cursor:pointer; }
  .mod-head{ padding:10px 18px; font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); }
  @media(max-width:860px){ .mod-row{ grid-template-columns:auto 1fr; } .mod-row label, .mod-row .mod-acts{ grid-column:2; } .mod-head{ display:none; } }
  .mod-acts{ display:flex; gap:4px; align-items:center; }
  .mod-row[data-id]{ cursor:grab; } .mod-row[data-id]:active{ cursor:grabbing; }
  .mod-row[data-id] .ic::after{ content:"⠿"; position:absolute; left:-14px; color:var(--pe-ink-3); font-size:14px; }
  .mod-row[data-id] .ic{ position:relative; }
  .mod-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .mod-tags span{ font-size:11.5px; color:var(--warn); background:var(--pe-warn-t); border-radius:6px; padding:2px 7px; }
  .btn.ico{ padding:6px 8px; }

  /* журнал */
  .log-row{ display:grid; grid-template-columns:150px 1fr; gap:14px; padding:10px 16px; border-bottom:1px solid var(--pe-line-2); font-size:13.5px; }
  .log-row:last-child{ border-bottom:none; }
  .log-row time{ color:var(--faint); font-size:12.5px; }
  @media(max-width:600px){ .log-row{ grid-template-columns:1fr; gap:2px; } }

  /* детали пользователя */
  .u-head{ display:flex; gap:14px; align-items:center; margin-bottom:16px; }
  .u-head h2{ margin:0; }
  .u-head span{ color:var(--pe-ink-2); font-size:13px; }
  .sec-t{ font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--pe-ink-2); margin:18px 0 8px; }
  .pass-box{ display:flex; align-items:center; gap:10px; background:var(--pe-accent-t); border:1px dashed var(--pe-accent); border-radius:12px; padding:12px 14px; font:600 16px 'IBM Plex Mono',monospace; margin:10px 0; }
  .pass-box span{ flex:1; word-break:break-all; }
  .danger-zone{ display:flex; gap:8px; flex-wrap:wrap; padding-top:14px; margin-top:6px; border-top:1px solid var(--pe-line-2); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
PE.onReady(function(){
"use strict";
var esc=PE.esc, M=PE.MODULES;
var tab=(location.hash||'').replace('#','') || 'requests';
var q='', stFilter='all', auditCache=null;

function modIcon(m, s){ return '<svg width="'+(s||13)+'" height="'+(s||13)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+m.icon+'</svg>'; }
function modById(id){ return PE.moduleById(id); }
function usersList(){ return Object.keys(PE.users).map(function(k){ return PE.users[k]; }); }
function me(){ return PE.user; }
function P(id){ return PE.perm(id); }
/* с кем можно работать: не с собой и не с владельцем; с админами — только владелец;
   модератор — только с сотрудниками */
function canManage(u){
  var m=me(); if(!u || !m) return false;
  if(u.id===m.id) return false;
  if(u.role==='owner') return false;
  if(u.role==='admin' && !PE.isOwner()) return false;
  if(!PE.isAdmin() && u.role!=='member') return false;
  return true;
}
/* роль выдаёт владелец (любую) и администратор (сотрудник / модератор) */
function roleField(cur){
  if(!PE.isAdmin()) return '';
  var o=[['member','Сотрудник — модули, которые ему открыты'],['moderator','Модератор — часть функций админки (см. «Роли и права»)']];
  if(PE.isOwner()) o.push(['admin','Администратор — управляет пользователями и модулями']);
  return PE.field('Роль','<select name="role">'+o.map(function(x){ return '<option value="'+x[0]+'"'+((cur||'member')===x[0]?' selected':'')+'>'+x[1]+'</option>'; }).join('')+'</select>');
}
function roleSort(a,b){ var o=PE.ROLE_ORDER; return ((o[a.role]!=null?o[a.role]:9)-(o[b.role]!=null?o[b.role]:9)) || PE.fullName(a).localeCompare(PE.fullName(b),'ru'); }
function tabsList(){
  var pu=pendingUsers(), rq=openRequests(), all=usersList().filter(function(u){ return u.status!=='deleted'; });
  return [['requests','Заявки',pu.length+rq.length,false,P('requests')],['users','Пользователи',all.length,true,true],
    ['modules','Модули',0,false,P('modules')],['tools','Инструменты',0,false,true],['roles','Роли и права',0,false,true],['log','Журнал',0,false,P('audit')]].filter(function(t){ return t[4]; });
}
function plural(n,a,b,c){ var x=n%10,h=n%100; if(x===1&&h!==11) return a; if(x>=2&&x<=4&&(h<10||h>=20)) return b; return c; }
function openRequests(){
  var R=PE.requests||{};
  return Object.keys(R).map(function(k){ var r=R[k]; r.id=k; return r; }).filter(function(r){ return r && r.status==='new'; }).sort(function(a,b){ return a.at-b.at; });
}
function pendingUsers(){ return usersList().filter(function(u){ return u.status==='pending'; }).sort(function(a,b){ return a.createdAt-b.createdAt; }); }
function modPills(ids){ return '<div class="mods">'+(ids||[]).map(function(id){ var m=modById(id); return m?'<span class="mod-pill"><i>'+modIcon(m,12)+'</i>'+esc(m.name)+'</span>':''; }).join('')+'</div>'; }
function statusHtml(u){ return '<span class="st '+esc(u.status)+'"><i></i>'+esc(u.status==='deleted'?'Удалён':(PE.STATUS_NAMES[u.status]||u.status))+'</span>'; }
function audit(action, target, details){ PE.audit(action, target, details); auditCache=null; }

function render(){
  var pu=pendingUsers(), rq=openRequests(), all=usersList().filter(function(u){ return u.status!=='deleted'; });
  var active=all.filter(function(u){ return u.status==='active'; }).length;
  var h='<div class="head"><div><h1>Админ-панель</h1><p>Пользователи, заявки и права доступа к модулям экосистемы.'+
    (PE.isOwner()?' <button class="link-btn" data-backup style="font-size:13px">Скачать резервную копию базы</button>':'')+'</p></div>'+
    '<div class="stats"><div class="stat"><b>'+active+'</b><span>активных</span></div>'+
    '<div class="stat'+((pu.length+rq.length)?' hot':'')+'"><b>'+(pu.length+rq.length)+'</b><span>ждут решения</span></div>'+
    '<div class="stat"><b>'+M.filter(function(m){ return PE.modConf(m.id).enabled; }).length+' / '+M.length+'</b><span>модулей включено</span></div></div></div>';
  var tl=tabsList(); if(!tl.some(function(t){ return t[0]===tab; })) tab=tl[0][0];
  h+='<div class="tabs">'+tl.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+(t[2]?'<span class="n'+(t[3]?' grey':'')+'">'+t[2]+'</span>':'')+'</button>';
  }).join('')+'</div>';
  h+='<div id="pane"></div>';
  document.getElementById('app').innerHTML=h;
  renderPane();
}
function renderPane(){
  var el=document.getElementById('pane'); if(!el) return;
  if(tab==='requests') el.innerHTML=requestsHtml();
  else if(tab==='users') el.innerHTML=usersHtml();
  else if(tab==='access') el.innerHTML=matrixHtml();
  else if(tab==='modules') el.innerHTML=modulesHtml();
  else if(tab==='roles') el.innerHTML=rolesHtml();
  else if(tab==='tools'){ el.innerHTML=toolsHtml(null); if(P('audit')) loadAudit().then(function(list){ if(tab==='tools') el.innerHTML=toolsHtml(list); }); }

function fail(){ PE.toast('Не удалось сохранить — нет связи с сервером','err'); }

function resolveRequest(r, status, extra){
  var patch=Object.assign({ status:status, resolvedAt:Date.now(), resolvedBy:me().id }, extra||{});
  var jobs=[PE.fb('PATCH','requests/'+r.id, patch)];
  if(r.uid && PE.userById(r.uid)) jobs.push(PE.fb('PATCH','users/'+r.uid+'/requests/'+r.id, { status:status }));
  return Promise.all(jobs);
}

      (P('users_accounts')&&u.status!=='deleted'?'<button type="button" class="btn sm" data-x="reset">Сбросить пароль</button>':'')+
      (!P('users_block')?'':u.status==='blocked'?'<button type="button" class="btn sm" data-x="unblock">Разблокировать</button>':u.status==='active'?'<button type="button" class="btn sm danger-t" data-x="block">Заблокировать</button>':'')+

  });

function showCreds(u, login, pass, title){

    '<div class="pass-box"><span>'+esc(login)+' / '+esc(pass)+'</span></div>'+
    '<div class="pe2-actions"><button class="pe2-btn" data-copy>Скопировать приглашение</button><button class="pe2-btn primary" data-pe2-close>Готово</button></div>', { sticky:true });
  m.el.querySelector('[data-copy]').onclick=function(){
    var done=function(){ PE.toast('Скопировано'); };
    if(navigator.clipboard) navigator.clipboard.writeText(text).then(done, function(){ prompt('Скопируйте:', text); }); else prompt('Скопируйте:', text);
  };
}

  PE.bindAvatarPicker(m.el);

  lg.addEventListener('input', function(){ touched=true; });

  fn.addEventListener('input', suggest); ln.addEventListener('input', suggest); suggest();
  form.onsubmit=function(e){
    e.preventDefault();
    var p=PE.readProfile(form), login=PE.normLogin(lg.value), pass=form.querySelector('[name="pass"]').value;

    if(pass.length<6) return E('Пароль — минимум 6 символов');
    var acc={}; form.querySelectorAll('input[name="mods"]:checked').forEach(function(c){ acc[c.value]=true; });
    var role=form.querySelector('[name="role"]'); role=role?role.value:'member';
    var id=PE.uid('u'), salt=PE.makeSalt(), n=usersList().length;

    }).then(function(u){

/* журнал: записи старше 3 месяцев удаляются (раз в сутки, при заходе владельца) */
function cleanAudit(){
  if(!PE.isOwner()) return;
  var mark='pe2_auditclean_'+PE.CFG.ROOT, last=0; try{ last=+localStorage.getItem(mark)||0; }catch(e){}
  if(Date.now()-last<86400000) return;
  var edge=Date.now()-90*86400000;
  var q = PE.CFG.MOCK ? PE.fb('GET','audit')
    : fetch(PE.CFG.FB+'/'+PE.CFG.ROOT+'/audit.json?orderBy=%22at%22&endAt='+edge+'&limitToFirst=500').then(function(r){ if(!r.ok) throw 0; return r.json(); });
  q.then(function(d){
    var del={}; Object.keys(d||{}).forEach(function(k){ if(d[k] && d[k].at<edge) del[k]=null; });
    try{ localStorage.setItem(mark, String(Date.now())); }catch(e){}
    if(Object.keys(del).length) return PE.fb('PATCH','audit', del);
  }).catch(function(){});
}

  var b, t;
  if((b=e.target.closest('[data-tab]'))){ tab=b.dataset.tab; history.replaceState(null,'','#'+tab); render(); return; }
  if((b=e.target.closest('[data-st]'))){ stFilter=b.dataset.st; renderPane(); return; }
  if(e.target.closest('[data-add-user]')){ addUserModal(); return; }
  if((b=e.target.closest('[data-backup]'))){ backup(b); return; }
  if((b=e.target.closest('[data-preview]'))){ PE.setPreview(b.dataset.preview); location.href='index.html'; return; }
  if((b=e.target.closest('[data-mod-edit]'))){ if(P('modules')) moduleEditModal(modById(b.dataset.modEdit)); return; }
  if((b=e.target.closest('[data-acc-tg]'))){
    var ap=b.dataset.accTg.split('|'), au=PE.userById(ap[0]), am=modById(ap[1]), on=!(au.access&&au.access[ap[1]]);
    if(!au || !am || !canManage(au) || !P('requests')) return;
    b.disabled=true;
    setAccess(au, ap[1], on).then(function(){ au.access=au.access||{}; if(on) au.access[ap[1]]=true; else delete au.access[ap[1]];
      audit(on?'grant':'revoke', au.id, am.name+' — '+PE.fullName(au)); PE.toast((on?'Открыт':'Закрыт')+' «'+am.name+'» для '+PE.shortName(au)); renderPane(); })
      .catch(function(){ b.disabled=false; fail(); });
    return;
  }
  if((b=e.target.closest('tr[data-user]'))){ userModal(PE.userById(b.dataset.user)); return; }
  if((b=e.target.closest('[data-approve-user]'))){ approveUserModal(PE.userById(b.dataset.approveUser)); return; }
  if((b=e.target.closest('[data-reject-user]'))){ t=PE.userById(b.dataset.rejectUser);
    rejectModal('Отклонить заявку '+PE.fullName(t)+'?', function(reason){ PE.fb('PATCH','users/'+t.id,{ status:'rejected', rejectReason:reason||null, requested:null }).then(function(){ audit('reject', t.id, PE.fullName(t)+(reason?': '+reason:'')); PE.toast('Заявка отклонена'); }).catch(fail); }); return; }
  if((b=e.target.closest('[data-approve-req]'))){ var r=PE.requests[b.dataset.approveReq]; r.id=b.dataset.approveReq; var u=PE.userById(r.uid);
    if(!u){ PE.toast('Пользователь уже удалён','err'); return; }
    var acc={}; (r.modules||[]).forEach(function(k){ acc[k]=true; });
    PE.fb('PATCH','users/'+u.id+'/access', acc).then(function(){ return resolveRequest(r,'approved'); }).then(function(){ audit('req-approve', u.id, PE.fullName(u)+': '+r.modules.map(function(k){ return modById(k)?modById(k).name:k; }).join(', ')); PE.toast('Доступ выдан — у '+PE.shortName(u)+' модули уже открыты'); }).catch(fail); return; }
  if((b=e.target.closest('[data-reject-req]'))){ var r2=PE.requests[b.dataset.rejectReq]; r2.id=b.dataset.rejectReq;
    rejectModal('Отклонить запрос?', function(reason){ resolveRequest(r2,'rejected',{ reason:reason||null }).then(function(){ audit('req-reject', r2.uid||'', (r2.name||'')+(reason?': '+reason:'')); PE.toast('Запрос отклонён'); }).catch(fail); }); return; }
  if((b=e.target.closest('[data-guest-create]'))){ var r3=PE.requests[b.dataset.guestCreate]; r3.id=b.dataset.guestCreate; var parts=(r3.name||'').trim().split(/\s+/);
    addUserModal({ first:parts[0]||'', last:parts.slice(1).join(' '), contact:r3.contact, modules:r3.modules }, r3); return; }
  if((b=e.target.closest('[data-col-all]'))||(t=e.target.closest('[data-col-none]'))){
    var el=b||t, mid=el.dataset.colAll||el.dataset.colNone, on=!!b, mm=modById(mid);
    var targets=usersList().filter(function(u){ return u.status==='active' && canManage(u) && !PE.isAdmin(u) && !!(u.access&&u.access[mid])!==on; });
    if(!targets.length){ PE.toast(on?'У всех уже есть доступ':'Ни у кого нет доступа'); return; }
    PE.confirm((on?'Открыть':'Закрыть')+' «'+mm.name+'» для '+targets.length+' '+plural(targets.length,'человека','человек','человек')+'?', targets.map(PE.fullName).join(', '), on?'Открыть':'Закрыть', !on).then(function(ok){ if(!ok) return;
      Promise.all(targets.map(function(u){ return setAccess(u, mid, on); })).then(function(){ audit(on?'grant':'revoke', '', mm.name+' — '+targets.map(PE.fullName).join(', ')); PE.toast('Готово'); }).catch(fail); });
    return;
  }
});
app.addEventListener('change', function(e){
  var t=e.target;
  if(t.dataset.acc){
    var p=t.dataset.acc.split('|'), u=PE.userById(p[0]), mm=modById(p[1]);
    setAccess(u, p[1], t.checked).then(function(){ audit(t.checked?'grant':'revoke', u.id, mm.name+' — '+PE.fullName(u)); PE.toast((t.checked?'Открыт':'Закрыт')+' «'+mm.name+'» для '+PE.shortName(u)); }).catch(function(){ t.checked=!t.checked; fail(); });
  }
  if(t.dataset.perm){
    var pp=t.dataset.perm.split('|'), role=pp[0], pid=pp[1], pdef=null; PE.PERMS.forEach(function(x){ if(x.id===pid) pdef=x; });
    if(!PE.isOwner() || !pdef){ t.checked=!t.checked; return; }
    var cur=JSON.parse(JSON.stringify(PE.perms||{ moderator:PE.DEFAULT_PERMS.moderator })), o2={}; o2[pid]=t.checked;
    /* если права ещё не записаны в базу — сначала записываем умолчания, чтобы не потерять их */
    (PE.perms ? Promise.resolve() : PE.fb('PATCH','perms', { moderator:PE.DEFAULT_PERMS.moderator })).then(function(){ return PE.fb('PATCH','perms/'+role, o2); }).then(function(){
      cur[role]=Object.assign({}, cur[role]||{}, o2); PE.setPerms(cur);
      audit('perms','', PE.ROLE_NAMES[role]+': «'+pdef.name+'» — '+(t.checked?'можно':'нельзя'));
      PE.toast(PE.ROLE_NAMES[role]+': «'+pdef.name+'» — '+(t.checked?'можно':'нельзя'));
    }).catch(function(){ t.checked=!t.checked; fail(); });
  }
  if(t.dataset.roleOf){
    var tu=PE.userById(t.dataset.roleOf), nr=t.value;
    if(!tu || !canManage(tu) || !PE.isAdmin() || (nr==='admin' && !PE.isOwner())){ t.value=tu?tu.role:''; return; }
    PE.fb('PATCH','users/'+tu.id,{ role:nr }).then(function(){ audit('edit', tu.id, PE.fullName(tu)+': роль — '+PE.ROLE_NAMES[nr]); PE.toast(PE.fullName(tu)+' — '+PE.ROLE_NAMES[nr]); })
      .catch(function(){ t.value=tu.role; fail(); });
  }
  if(t.dataset.mod){
    var q2=t.dataset.mod.split('|'), o={}; o[q2[1]]=t.checked;
    PE.fb('PATCH','modules/'+q2[0], o).then(function(){ audit('module','', modById(q2[0]).name+': '+({ enabled:'включён', guest:'для гостей', byDefault:'по умолчанию' })[q2[1]]+' — '+(t.checked?'да':'нет')); }).catch(function(){ t.checked=!t.checked; fail(); });
  }
});
app.addEventListener('input', function(e){
  if(e.target.id==='u-search'){ q=e.target.value; var pos=e.target.selectionStart; renderPane(); var s=document.getElementById('u-search'); if(s){ s.focus(); s.setSelectionRange(pos,pos); } }
});
/* живые обновления: перерисовываем, но не пока человек печатает в поиске */
var rT=null;
PE.onUsers(function(){ clearTimeout(rT); rT=setTimeout(function(){ if(document.activeElement && document.activeElement.id==='u-search') renderPane(); else render(); }, 60); });
PE.sortable(document.getElementById('app'), { item:'.mod-row[data-id]', enabled:function(){ return tab==='modules' && P('modules'); }, onDrop:function(ids){ PE.saveModuleOrder(ids).then(render); } });
render();
seedPerms(); cleanAudit(); migrateAvatars();
});
</script>
