/* =====================================================================
   Быстрое добавление с разбором: @исполнитель #тег ! сегодня/завтра
   ===================================================================== */
function parseQuick(text){
  var p={ tags:[], assignees:[], urgent:false, end:'', recur:null };
  var title=text.replace(/(^|\s)@([^\s#@!]+)/g, function(m, sp, name){
    var mm=TEAM.filter(function(x){ return x.short.toLowerCase().indexOf(name.toLowerCase())===0 || x.full.toLowerCase().indexOf(name.toLowerCase())===0; })[0];
    if(mm){ if(p.assignees.indexOf(mm.id)<0) p.assignees.push(mm.id); return sp; } return m;
  }).replace(/(^|\s)#([^\s#@!]+)/g, function(m, sp, g){ if(/^\d+$/.test(g)) return m; p.tags.push(g.replace(/_/g,' ')); return sp; })
    .replace(/(^|\s)!(?=\s|$)/g, function(m, sp){ p.urgent=true; return sp; })
    .replace(/(^|\s)(каждый день|ежедневно|по будням|каждую неделю|еженедельно|каждый месяц|ежемесячно)(?=\s|$)/gi, function(m, sp, w){
      w=w.toLowerCase();
      p.recur = /день|ежедн/.test(w) ? { freq:'day', interval:1 } : /будн/.test(w) ? { freq:'week', interval:1, days:[1,2,3,4,5] } : /недел/.test(w) ? { freq:'week', interval:1, days:[isoDow(today())] } : { freq:'month', interval:1, dom:today().getDate() };
      return sp; })
    .replace(/(^|\s)(сегодня|завтра|послезавтра)(?=\s|$)/gi, function(m, sp, w){
      w=w.toLowerCase(); p.end=keyOf(addDays(today(), w==='сегодня'?0:w==='завтра'?1:2)); return sp; })
    .replace(/\s{2,}/g,' ').trim();
  p.title=title;
  return p;
}
function quickCreate(colId, text){
  var p=parseQuick(text); if(!p.title) return;
  if(p.recur && !p.end) p.end=todayKey();
  var t=newTask({ title:p.title, status:colId, tags:p.tags, urgent:p.urgent, end:p.end, start:p.end, recur:p.recur,
    assignees:p.assignees.length?p.assignees:(state.settings.tab==='delegated'?[]:[ME]) });
  if(state.settings.tab==='watched') t.auditors=[ME];
  function go(){ addTask(t); if(t.postpone) t.activity.push({ id:uid('e'), at:Date.now(), author:ME, type:'text', text:'Отложена: '+t.postpone.reason }); p.tags.forEach(tagColor); save(); renderMain(); }
  if(colId==='postponed'){ askPostpone(t, function(){ var qa=$('#qa-input'); if(qa) qa.value=''; go(); }, { isNew:true }); return; }
  go();
}

/* =====================================================================
   Drag & drop карточек
   ===================================================================== */
var dragId=null, dropLine=null;
function clearDrop(){ if(dropLine){ dropLine.remove(); dropLine=null; } $$('.col.drop-target').forEach(function(c){ c.classList.remove('drop-target'); }); }
function dropPosition(colEl, y){
  var cards=$$('.card', colEl).filter(function(c){ return c.dataset.id!==dragId; });
  for(var i=0;i<cards.length;i++){ var r=cards[i].getBoundingClientRect(); if(y<r.top+r.height/2) return { before:cards[i], list:cards, idx:i }; }
  return { before:null, list:cards, idx:cards.length };
}
function bindDnD(){
  var board=$('#board');
  board.addEventListener('dragstart', function(e){
    var c=e.target.closest('.card'); if(!c) return;
    dragId=c.dataset.id; c.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){}
  });
  board.addEventListener('dragend', function(){ dragId=null; clearDrop(); $$('.card.dragging').forEach(function(c){ c.classList.remove('dragging'); }); });
  board.addEventListener('dragover', function(e){
    if(!dragId) return;
    var colEl=e.target.closest('.col'); if(!colEl) return;
    e.preventDefault(); e.dataTransfer.dropEffect='move';
    $$('.col.drop-target').forEach(function(c){ if(c!==colEl) c.classList.remove('drop-target'); });
    colEl.classList.add('drop-target');
    if(colEl.classList.contains('collapsed')) return;
    var pos=dropPosition(colEl, e.clientY);
    if(!dropLine){ dropLine=document.createElement('div'); dropLine.className='drop-line'; }
    var body=colEl.querySelector('.col-body');
    if(pos.before) pos.before.parentNode.insertBefore(dropLine, pos.before);
    else { var more=body.querySelector('.col-more'); body.insertBefore(dropLine, more||null); }
  });
  board.addEventListener('dragleave', function(e){
    var colEl=e.target.closest('.col'); if(colEl && !colEl.contains(e.relatedTarget)){ colEl.classList.remove('drop-target'); if(dropLine && colEl.contains(dropLine)){ dropLine.remove(); dropLine=null; } }
  });
  board.addEventListener('drop', function(e){
    if(!dragId) return;
    var colEl=e.target.closest('.col'); if(!colEl) return;
    e.preventDefault();
    var t=task(dragId), cid=colEl.dataset.col, c=col(cid);
    var pos = colEl.classList.contains('collapsed') ? null : dropPosition(colEl, e.clientY);
    clearDrop();
    var snap=snapshot(), fromStatus=t.status, msg=null;
    if(cid==='postponed' && fromStatus!=='postponed'){
      askPostpone(t, function(){ t.order=minOrder()-1; persist(); if(openId===t.id) renderDrawer(); toast('Отложено: '+t.postpone.reason, 'Отменить', function(){ restore(snap); }); });
      return;
    }
    var sort=cp(c).sort||state.settings.sort;
    if(pos && sort==='manual'){
      var prev=pos.list[pos.idx-1] ? task(pos.list[pos.idx-1].dataset.id) : null;
      var next=pos.list[pos.idx] ? task(pos.list[pos.idx].dataset.id) : null;
      if(cid==='done'){ // в «Завершённых» ручной порядок = по дате завершения, кладём наверх
      } else if(prev && next) t.order=(prev.order+next.order)/2;
      else if(prev) t.order=prev.order+1;
      else if(next) t.order=next.order-1;
    } else if(pos && fromStatus===cid && sort!=='manual'){
      msg='В колонке включена сортировка «'+SORTS[sort]+'» — ручной порядок не применяется';
    }
    if(fromStatus!==cid){
      if(cid==='done' && t.requireReview && t.reporter!==ME){ setStatus(t,'review'); msg='Нужна проверка — задача ушла в «'+col('review').name+'»'; }
      else { setStatus(t, cid); if(cid==='done') msg='Перемещено в «'+c.name+'»'+spawnNote(); }
      if(c.wip && columnTasks(c).length>c.wip) msg='Превышен лимит колонки «'+c.name+'»: '+columnTasks(c).length+' / '+c.wip;
    }
    persist();
    if(openId===t.id) renderDrawer();
    if(fromStatus!==t.status) toast(msg || ('Перемещено в «'+col(t.status).name+'»'), 'Отменить', function(){ restore(snap); });
    else if(msg) toast(msg);
  });
}

function feedHtml(t){

  if(discTab!=='comments') t.activity.forEach(function(e){ items.push({ kind:'a', at:e.at, author:e.author, e:e }); });
  items.sort(function(a,b){ return b.at-a.at; });

      '</div>'+(c.files||[]).map(function(f){ return '<div class="ev-file">'+I('clip',11)+' '+fileLink(f)+' <span style="color:var(--ink-faint)">'+fmtSize(f.size)+'</span></div>'; }).join('')+

function mentionId(name){ name=name.toLowerCase(); var m=TEAM.filter(function(x){ return x.tag.toLowerCase()===name || x.full.toLowerCase()===name; })[0]; return m?m.id:null; }
function mentionsIn(text){ var r=[]; String(text).replace(MENTION_RE, function(_,n){ var id=mentionId(n); if(id && r.indexOf(id)<0) r.push(id); }); return r; }
function mentionify(html){ return html.replace(MENTION_RE, function(all, n){ var id=mentionId(n); return '<span class="mention'+(id===ME?' me':'')+'">@'+esc(member(id).full)+'</span>'; }); }
var mentionPop=null, mentionSel=0, mentionList=[];
function closeMentionPop(){ if(mentionPop){ mentionPop.close(); mentionPop=null; } }
function mentionAutocomplete(ta){
  var before=ta.value.slice(0, ta.selectionStart), m=before.match(/(^|\s)@([а-яёa-z]*)$/i);
  if(!m){ closeMentionPop(); return; }
  var q=m[2].toLowerCase();
  mentionList=TEAM.filter(function(x){ return x.id!==ME && (!q || x.short.toLowerCase().indexOf(q)===0 || x.full.toLowerCase().indexOf(q)===0); });
  if(!mentionList.length){ closeMentionPop(); return; }
  mentionSel=Math.min(mentionSel, mentionList.length-1);
  if(!mentionPop){
    mentionPop=openPop(ta, function(el){ el.classList.add('mention-pop'); el.addEventListener('mousedown', function(e){ e.preventDefault(); var o=e.target.closest('[data-mi]'); if(o){ mentionSel=+o.dataset.mi; insertMention(ta); } }); }, { width:240, stack:true });
    if(mentionPop) mentionPop.onClose=function(){ mentionPop=null; };
  }
  if(!mentionPop) return;
  mentionPop.el.innerHTML='<div class="pop-label">Упомянуть</div>'+mentionList.map(function(x,i){ return '<div class="opt'+(i===mentionSel?' kb':'')+'" data-mi="'+i+'">'+avatar(x.id)+'<span>'+esc(x.full)+'</span><span class="sub">'+esc(x.role)+'</span></div>'; }).join('');
  mentionPop.reposition();
}
function insertMention(ta){
  var m=mentionList[mentionSel]; if(!m) return;
  var pos=ta.selectionStart, before=ta.value.slice(0,pos).replace(/@([а-яёa-z]*)$/i, '@'+m.tag+' ');
  ta.value=before+ta.value.slice(pos); ta.setSelectionRange(before.length, before.length);
  closeMentionPop(); ta.focus();
}
function mentionKey(e){
  var ta=e.target;
  if(e.key==='ArrowDown'){ e.preventDefault(); mentionSel=(mentionSel+1)%mentionList.length; mentionAutocomplete(ta); return true; }
  if(e.key==='ArrowUp'){ e.preventDefault(); mentionSel=(mentionSel-1+mentionList.length)%mentionList.length; mentionAutocomplete(ta); return true; }
  if((e.key==='Enter' && !e.metaKey && !e.ctrlKey) || e.key==='Tab'){ e.preventDefault(); insertMention(ta); return true; }
  if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeMentionPop(); return true; }
  return false;
}

        if(r.freq==='week') h+='<div class="day-chips">'+WD.map(function(w,i){ return '<button class="day-chip'+((r.days||[]).indexOf(i+1)>=0?' sel':'')+'" data-wd="'+(i+1)+'">'+w+'</button>'; }).join('')+'</div>';
        if(r.freq==='month') h+='<div class="pop-row"><span>Число месяца</span><input type="number" min="1" max="31" class="rc-num" id="rc-dom" value="'+(r.dom||bd.getDate())+'"></div>';
        h+='<div class="pop-row"><span>Повторять до</span><input type="date" id="rc-until" value="'+(r.until||'')+'" style="border:1px solid var(--line);border-radius:9px;padding:4px 7px;font-size:.72rem"></div>'+

      }

/* ---------- санитайзер описания ---------- */
var ALLOWED={ B:1, STRONG:1, I:1, EM:1, U:1, CODE:1, BLOCKQUOTE:1, H1:1, H2:1, H3:1, UL:1, OL:1, LI:1, P:1, BR:1, DIV:1, A:1, SPAN:1, PRE:1, S:1 };
function sanitize(html){
  var box=document.createElement('div'); box.innerHTML=html||'';
  (function walk(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(n){
      if(n.nodeType===1){
        if(!ALLOWED[n.tagName]){ if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED)$/.test(n.tagName)){ n.remove(); return; } var frag=document.createDocumentFragment(); while(n.firstChild) frag.appendChild(n.firstChild); n.replaceWith(frag); walk(node); return; }
        Array.prototype.slice.call(n.attributes).forEach(function(a){
          if(n.tagName==='A' && a.name==='href' && /^(https?:|mailto:)/i.test(a.value)) return;
          n.removeAttribute(a.name);
        });
        if(n.tagName==='A'){ n.setAttribute('target','_blank'); n.setAttribute('rel','noopener'); }
        walk(n);
      } else if(n.nodeType!==3) n.remove();
    });
  })(box);
  return box.innerHTML.replace(/\u200B/g,'');
}

/* ---------- файлы ---------- */
var FILE_LIMIT=5*1024*1024;
var fileTarget=null;   // 'task' | 'comment'
var pendingCommentFiles=[];
function readFiles(list, cb){
  var out=[], n=list.length, big=0; if(!n) return cb(out);
  Array.prototype.forEach.call(list, function(f){
    var rec={ id:uid('f'), name:f.name, size:f.size, type:f.type, data:null, at:Date.now() };
    if(f.size>FILE_LIMIT){ big++; out.push(rec); if(!--n) done(); return; }
    var r=new FileReader(); r.onload=function(){ rec.data=r.result; out.push(rec); if(!--n) done(); }; r.onerror=function(){ out.push(rec); if(!--n) done(); }; r.readAsDataURL(f);
  });
  function done(){ if(big) toast('Файлы больше 5 МБ сохранены только по имени — крупное прикладывайте ссылкой (Google Диск, Figma)'); cb(out); }
}
function addFilesToTask(t, files){

function edCmd(cmd){
  var area=$('#ed-area'); if(!area) return; area.focus();
  if(cmd==='bold') document.execCommand('bold');
  else if(cmd==='italic') document.execCommand('italic');
  else if(cmd==='ul') document.execCommand('insertUnorderedList');
  else if(cmd==='ol') document.execCommand('insertOrderedList');
  else if(cmd==='quote') toggleBlock('blockquote');
  else if(cmd==='h2') toggleBlock('h2');
  else if(cmd==='code') toggleCode();
  else if(cmd==='link'){
    var s=window.getSelection(), range=s&&s.rangeCount?s.getRangeAt(0).cloneRange():null;
    openPop($('[data-cmd="link"]'), function(el, api){
      el.innerHTML='<div class="pop-title">Ссылка</div><input class="pop-input" id="lnk" placeholder="https://…" autofocus><div class="pop-actions"><button class="btn btn-primary btn-sm" id="lnk-ok">Вставить</button></div>';
      function go(){ var u=$('#lnk').value.trim(); if(!u) return api.close(); if(!/^(https?:|mailto:)/i.test(u)) u='https://'+u; api.close();
        area.focus(); if(range){ var ss=window.getSelection(); ss.removeAllRanges(); ss.addRange(range); }
        if(range && !range.collapsed) document.execCommand('createLink', false, u); else document.execCommand('insertHTML', false, '<a href="'+esc(u)+'">'+esc(u)+'</a>&nbsp;');
        var t=cur(); t.description=sanitize(area.innerHTML); commitField(); }
      $('#lnk-ok').onclick=go; $('#lnk').onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } };
    }, { width:300 });
    return;
  }
  var t=cur(); t.description=sanitize(area.innerHTML); if(!draft) save();
}

/* ---------- выход из «кода», цитаты и заголовка ----------
   Кнопка работает как переключатель: второе нажатие выключает режим.
   Enter внутри кода / на пустой строке цитаты или заголовка — тоже выходит. */
function edAncestor(tag){
  var sel=window.getSelection(); if(!sel.rangeCount) return null;
  var n=sel.anchorNode, area=$('#ed-area');
  while(n && n!==area){ if(n.nodeType===1 && n.tagName===tag) return n; n=n.parentNode; }
  return null;
}
function caretAfter(node){
  // пустой символ после элемента, чтобы дальнейший ввод шёл уже обычным текстом
  var t=document.createTextNode('​');
  node.parentNode.insertBefore(t, node.nextSibling);
  var r=document.createRange(); r.setStart(t, 1); r.collapse(true);
  var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
function toggleCode(){
  var sel=window.getSelection(), inCode=edAncestor('CODE');
  if(inCode){
    if(sel.isCollapsed){ caretAfter(inCode); }              // курсор в коде → просто выходим из него
    else { var txt=document.createTextNode(inCode.textContent); inCode.replaceWith(txt); } // выделен код → снимаем
    return;
  }
  if(!sel.rangeCount) return;
  var range=sel.getRangeAt(0), code=document.createElement('code');
  if(range.collapsed){ code.textContent='​'; range.insertNode(code); var r=document.createRange(); r.setStart(code.firstChild, 1); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); }
  else { code.textContent=range.toString(); range.deleteContents(); range.insertNode(code); caretAfter(code); }
}
function toggleBlock(tag){
  if(edAncestor(tag.toUpperCase())) document.execCommand('formatBlock', false, 'div');
  else document.execCommand('formatBlock', false, tag);
}
function edExitKeys(e){
  if(e.key!=='Enter' || e.shiftKey || e.metaKey || e.ctrlKey) return;
  var code=edAncestor('CODE');
  if(code){ e.preventDefault(); caretAfter(code); return; }
  var blk=edAncestor('BLOCKQUOTE')||edAncestor('H1')||edAncestor('H2')||edAncestor('H3');
  if(!blk) return;
  var sel=window.getSelection(), n=sel.anchorNode;
  var line=(n && n.nodeType===3 ? n.parentNode : n);
  var empty=!(line && line.textContent.replace(/​/g,'').trim());
  if(blk.tagName!=='BLOCKQUOTE' || empty){
    e.preventDefault();
    var p=document.createElement('div'); p.appendChild(document.createElement('br'));
    if(blk.tagName==='BLOCKQUOTE' && empty && line===blk) blk.replaceWith(p);
    else { if(blk.tagName==='BLOCKQUOTE' && empty) line.remove(); blk.parentNode.insertBefore(p, blk.nextSibling); }
    var r=document.createRange(); r.setStart(p,0); r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
    var t=cur(); if(t){ t.description=sanitize($('#ed-area').innerHTML); if(!draft) save(); }
  }
}

function sendComment(t){
  var ta=$('#composer'); var v=ta.value.trim();
  if(!v && !pendingCommentFiles.length) return;
  t.comments.push({ id:uid('m'), author:ME, text:v, at:Date.now(), files:pendingCommentFiles });
  // упомянутые попадают в аудиторы, чтобы видеть задачу во «Отслеживаемых»
  var added=[];
  mentionsIn(v).forEach(function(id){
    if(id===ME || t.assignees.indexOf(id)>=0 || t.reporter===id || t.auditors.indexOf(id)>=0) return;
    t.auditors.push(id); added.push(member(id).full);
  });
  if(added.length){ log(t,'field',{ label:'Аудиторы', to:t.auditors.map(function(x){ return member(x).full; }).join(', ') }); toast('Упомянуты и добавлены в аудиторы: '+added.join(', ')); }
  closeMentionPop();
  pendingCommentFiles=[];
  if(discTab==='history') discTab='all';
  commitField(); renderDrawer();
  var c=$('#composer'); if(c) c.focus();
}
function createDraft(){
  var t=draft; if(!t) return;
  if(!t.title.trim()){ var el=$('#dr-title'); el.focus(); el.placeholder='Введите название — без него задачу не создать'; el.style.outline='2px solid var(--danger-bright)'; return; }

  var a=$('#ed-area'); if(a) t.description=sanitize(a.innerHTML);
  draft=null;
  addTask(t, true);

  $('#drawer-root').innerHTML=''; openId=null;
  try{ history.replaceState(null,'', location.pathname+location.search); }catch(e){}
  var visible=matches(t);
  toast('Задача #'+t.num+' создана'+(visible?'':' (скрыта текущими фильтрами)'), 'Открыть', function(){ openTask(t.id); }, 6000);
}
function copyText(txt, msg){
  var ok=function(){ toast(msg); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  function fallback(){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('Не удалось скопировать'); } ta.remove(); }
}

/* ---------- обязательная причина при откладывании ----------
   Вызывается при любом переносе в «Отложенные»: перетаскивание на доске и в списке,
   смена статуса в карточке и в списке, быстрое добавление в колонку. Без причины перенос не происходит. */
var PP_REASONS=['Ждём ответа клиента','Ждём оплату','Нет ресурсов сейчас','Низкий приоритет','Ждём другую задачу','Перенесли сроки'];
function askPostpone(t, onDone, opts){
  opts=opts||{};
  closePops();
  var cur0=t.postpone||{}, until=cur0.until||'';
  var back=document.createElement('div'); back.className='modal-back';
  back.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="pp-h">'+
    '<h2 id="pp-h">'+(opts.edit?'Причина откладывания':'Почему откладываем?')+'</h2>'+
    '<div class="sub">'+(t.num?'#'+t.num+' · ':'')+esc(t.title||'Новая задача')+'</div>'+
    '<div class="lab">Причина — обязательно</div>'+
    '<div class="chips">'+PP_REASONS.map(function(r){ return '<button class="chip" data-r="'+esc(r)+'">'+esc(r)+'</button>'; }).join('')+'</div>'+
    '<textarea id="pp-reason" rows="2" placeholder="Коротко: что должно произойти, чтобы вернуться к задаче">'+esc(cur0.reason||'')+'</textarea>'+
    '<div class="err-msg" id="pp-err"></div>'+
    '<div class="lab" style="margin-top:10px">Когда вернуться <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-faint)">— придёт напоминание</span></div>'+
    '<div class="chips" id="pp-until">'+[['7','Через неделю'],['14','Через 2 недели'],['30','Через месяц'],['','Без даты']].map(function(q){ return '<button class="chip" data-u="'+q[0]+'">'+q[1]+'</button>'; }).join('')+
      '<input type="date" id="pp-date" value="'+until+'" min="'+todayKey()+'"></div>'+
    '<div class="actions"><span class="hint">Ctrl+Enter — отложить · Esc — отмена</span><button class="btn" data-cancel>Отмена</button><button class="btn btn-primary" data-ok>'+(opts.edit?'Сохранить':'Отложить')+'</button></div>'+
  '</div>';
  document.body.appendChild(back);
  var ta=$('#pp-reason', back), dt=$('#pp-date', back);
  function markUntil(){ var v=dt.value; $$('[data-u]', back).forEach(function(b){ var on = b.dataset.u==='' ? !v : v===keyOf(addDays(today(), +b.dataset.u)); b.classList.toggle('on', on); }); }
  function markReason(){ $$('[data-r]', back).forEach(function(b){ b.classList.toggle('on', ta.value.trim()===b.dataset.r); }); }
  markUntil(); markReason();
  setTimeout(function(){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 20);
  function close(){ back.remove(); document.removeEventListener('keydown', onKey, true); }
  function ok(){
    var r=ta.value.trim();
    if(!r){ ta.classList.add('err'); $('#pp-err', back).textContent='Без причины задачу отложить нельзя — выберите вариант или напишите свой.'; ta.focus(); return; }
    var before=t.postpone;
    t.postpone={ reason:r, until:dt.value||'', by:(before&&opts.edit)?before.by:ME, at:(before&&opts.edit)?before.at:Date.now() };
    if(t.status!=='postponed') setStatus(t,'postponed');
    if(!opts.isNew) log(t,'text',{ text:(opts.edit?'Причина откладывания: ':'Отложена: ')+r+(t.postpone.until?' · вернуться '+fmtDay(t.postpone.until):'') });
    close(); onDone && onDone();
  }
  function onKey(e){
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
    else if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); ok(); }
    else if(e.key==='Enter' && e.target===ta && !e.shiftKey){ e.preventDefault(); ok(); }
  }
  document.addEventListener('keydown', onKey, true);
  ta.addEventListener('input', function(){ ta.classList.remove('err'); $('#pp-err', back).textContent=''; markReason(); });
  dt.addEventListener('change', markUntil);
  back.addEventListener('mousedown', function(e){ if(e.target===back) close(); });
  back.addEventListener('click', function(e){
    var b;
    if((b=e.target.closest('[data-r]'))){ ta.value=b.dataset.r; ta.classList.remove('err'); $('#pp-err', back).textContent=''; markReason(); ta.focus(); return; }
    if((b=e.target.closest('[data-u]'))){ dt.value = b.dataset.u==='' ? '' : keyOf(addDays(today(), +b.dataset.u)); markUntil(); return; }
    if(e.target.closest('[data-cancel]')){ close(); return; }
    if(e.target.closest('[data-ok]')) ok();
  });
}

/* ---------- выбор сроков ---------- */
function openDatePop(anchor, t){
  var s=t.start||'', e=t.end||'', ts=t.time||'', te=t.timeEnd||'';
  if(s && !e) e=s; if(e && !s) s=e;
  var pickingEnd=false;
  var base=s? parseKey(s) : today(); var vy=base.getFullYear(), vm=base.getMonth();
  openPop(anchor, function(el, api){
    function apply(ns, ne, nts, nte){
      var before=dateLabel(t);
      t.start=ns||''; t.end=ne||ns||''; t.time=nts||''; t.timeEnd=nte||'';
      if(!t.start){ t.end=''; t.time=''; t.timeEnd=''; }
      var after=dateLabel(t);
      if(before!==after) log(t,'field',{ label:'Срок', from:before, to:after||'без срока' });
      commitField(); renderDrawer();
    }
    function draw(){
      var first=new Date(vy, vm, 1), off=(first.getDay()+6)%7, start=addDays(first,-off), tk=todayKey();
      var days='';
      for(var i=0;i<42;i++){
        var d=addDays(start,i), k=keyOf(d), cls='dp-day';
        if(d.getMonth()!==vm) cls+=' o'; if(k===tk) cls+=' t';
        if(s && k===s) cls+=' s'; if(e && k===e) cls+=' e';
        if(s && e && k>s && k<e) cls+=' in';
        days+='<div class="'+cls+'" data-d="'+k+'">'+d.getDate()+'</div>';
      }
      var sum = !s ? 'Срок не задан' : (s===e ? 'Срок: '+fmtDay(s) : fmtDay(s)+' → '+fmtDay(e)) + (pickingEnd?' · выберите конец':'');
      el.innerHTML='<div class="dp">'+
        '<div class="dp-quick">'+[['0','Сегодня'],['1','Завтра'],['fri','Пятница'],['7','Через неделю']].map(function(q){ return '<button class="chip" data-q="'+q[0]+'">'+q[1]+'</button>'; }).join('')+'</div>'+
        '<div class="dp-head"><button class="dp-nav" data-nav="-1">'+I('chevL',12,2)+'</button><span class="dp-label">'+MONTHS[vm]+' '+vy+'</span><button class="dp-nav" data-nav="1">'+I('chevR',12,2)+'</button></div>'+
        '<div class="dp-wd">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(function(w){ return '<span>'+w+'</span>'; }).join('')+'</div>'+
        '<div class="dp-grid">'+days+'</div>'+
        '<div class="dp-times"><div><label>Время начала</label><input type="time" id="dp-ts" value="'+ts+'"></div><div><label>Время конца</label><input type="time" id="dp-te" value="'+te+'"></div></div>'+
        '<div class="dp-summary">'+sum+'. Клик — день, второй клик — конец периода.</div>'+
        '<div class="pop-actions"><button class="btn btn-sm" data-clear>Без срока</button><button class="btn btn-primary btn-sm" data-ok>Готово</button></div></div>';
    }
    draw();
    el.addEventListener('click', function(ev){
      var d=ev.target.closest('[data-d]');
      if(d){
        var k=d.dataset.d;
        if(!pickingEnd || !s){ s=k; e=k; pickingEnd=true; }
        else { if(k<s){ e=s; s=k; } else e=k; pickingEnd=false; }
        ts=$('#dp-ts').value; te=$('#dp-te').value; draw(); return;
      }
      var n=ev.target.closest('[data-nav]'); if(n){ vm+=+n.dataset.nav; if(vm<0){ vm=11; vy--; } if(vm>11){ vm=0; vy++; } ts=$('#dp-ts').value; te=$('#dp-te').value; draw(); return; }
      var q=ev.target.closest('[data-q]');
      if(q){ var dd; if(q.dataset.q==='fri'){ var t0=today(); dd=addDays(t0, (5-t0.getDay()+7)%7 || 7); } else dd=addDays(today(), +q.dataset.q);
             api.close(); apply(keyOf(dd), keyOf(dd), $('#dp-ts').value, $('#dp-te').value); return; }
      if(ev.target.closest('[data-clear]')){ api.close(); apply('', '', '', ''); return; }
      if(ev.target.closest('[data-ok]')){ var a=$('#dp-ts').value, b=$('#dp-te').value; api.close(); apply(s, e, a, b); return; }
    });
    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter' && ev.target.type==='time'){ var a=$('#dp-ts').value, b=$('#dp-te').value; api.close(); apply(s,e,a,b); } });
  }, { width:292 });
}

/* =====================================================================
   УЧЁТ ВРЕМЕНИ — всё, что было в «Хронометраже», теперь внутри задачника:
   таймер с этапами, пауза, ручное добавление, правка записей, отчёт «Время»,
   плашка «идёт запись» и список всех таймеров команды.
   ===================================================================== */
var tv = { period:'week', offset:0, who:'me', group:'tag', open:{} };
var IDLE_LIMIT = 3*3600e3;   // через сколько спросить «ты ещё работаешь?»

function fmtDur(ms){
  var m=Math.round(ms/60000); if(m<1) return ms>0?'<1 мин':'0';
  var h=Math.floor(m/60), mm=m%60;
  return (h? h+' ч':'')+(h&&mm?' ':'')+(mm? mm+' мин':'');
}
function fmtClock(ms){ var s=Math.floor(ms/1000); var h=Math.floor(s/3600); return (h? h+':':'')+pad(Math.floor(s%3600/60))+':'+pad(s%60); }
function hm(ts){ var d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function stageChip(s, attrs){ var c=stageColor(s); return '<span class="stg"'+(attrs||'')+'><i style="background:'+c+'"></i>'+esc(s)+'</span>'; }
function entryProject(e){ var t=e.taskId?task(e.taskId):null; return t ? (t.tags[0]||'Без клиента') : (e.tag||'Без клиента'); }
function entryTitle(e){ var t=e.taskId?task(e.taskId):null; return t ? t.title : (e.title||'Без задачи'); }

/* ---------- действия таймера (общие для карточки, панели, плашки) ---------- */
function tAction(kind, t, arg){
  var tm=state.timer, prevTask=tm && tm.taskId!==(t&&t.id) ? task(tm.taskId) : null;
  if(kind==='play'){
    if(isPaused(t)) resumeTimer(); else startTimer(t, arg);
    if(prevTask && prevTask.id!==t.id) toast('Таймер «'+prevTask.title+'» остановлен и сохранён');
  }
  else if(kind==='pause') pauseTimer();
  else if(kind==='stop'){ var ms=sessionMs(); var tt=task(state.timer.taskId); stopTimer(); toast('Сохранено: '+fmtDur(ms)+(tt?' — '+tt.title:'')); }
  else if(kind==='stage') switchStage(arg);
  save(); renderMain(); if(openId) renderDrawer(); renderTimerPill();
}

/* ---------- плашка в тулбаре ---------- */
function renderTimerPill(){
  var b=$('#timers-btn'); if(!b) return;
  var tm=state.timer, t=tm?task(tm.taskId):null;
  var mine=state.timer?1:0, team=teamTimers().length;
  if(t){
    b.className='timer-pill '+(tm.paused?'paused':'rec');

/* ---------- «Ты ещё работаешь?» ---------- */
function checkIdle(){
  var tm=state.timer; if(!tm || tm.paused || !tm.since || document.querySelector('.modal-back')) return;
  var now=Date.now(), long=now-tm.since>=IDLE_LIMIT, overnight=keyOf(new Date(tm.since))!==todayKey();
  if(!(long||overnight)) return;
  if(tm.askedAt && now-tm.askedAt<IDLE_LIMIT && !overnight) return;
  if(tm.askedAt && overnight && keyOf(new Date(tm.askedAt))===todayKey()) return;
  var t=task(tm.taskId); tm.askedAt=now; save();
  var back=document.createElement('div'); back.className='modal-back';
  var defEnd=hm(Math.min(now, tm.since+IDLE_LIMIT));
  back.innerHTML='<div class="modal"><h2>Ты ещё работаешь?</h2><div class="sub">Таймер «'+esc(t?t.title:'задача')+'» идёт '+fmtDur(now-tm.since)+(overnight?', с '+fmtDay(keyOf(new Date(tm.since)))+' '+hm(tm.since):' без перерыва')+'. Если забыли выключить — укажите, когда закончили.</div>'+
    '<div class="lab">Закончил(а) в</div><div style="display:flex;gap:8px;align-items:center"><input type="time" id="idle-end" value="'+defEnd+'" class="pop-input" style="width:130px">'+(overnight?'<span class="sub" style="margin:0">'+fmtDay(keyOf(new Date(tm.since)))+'</span>':'')+'</div>'+
    '<div class="actions"><button class="btn" data-cont>Да, продолжаю</button><button class="btn btn-primary" data-stop>Остановить в это время</button></div></div>';
  document.body.appendChild(back);
  back.addEventListener('click', function(e){
    if(e.target.closest('[data-cont]')){ back.remove(); return; }
    if(e.target.closest('[data-stop]')){
      var v=$('#idle-end', back).value.split(':'), d=new Date(tm.since); d.setHours(+v[0], +v[1], 0, 0);
      var end=Math.max(tm.since+60000, Math.min(Date.now(), d.getTime()));
      var st0=tm.since; stopTimer(end); back.remove(); save(); refreshTimeViews(); toast('Таймер остановлен, записано '+fmtDur(end-st0));
    }
  });
}

/* =====================================================================
   Вид «Время» — отчёт (замена страницы Хронометража)
   ===================================================================== */
function tvRange(){
  var t0=today(), from, to, label;
  if(tv.period==='day'){ from=addDays(t0, tv.offset); to=from; label = tv.offset===0?'Сегодня':tv.offset===-1?'Вчера':fmtDay(keyOf(from)); }
  else if(tv.period==='week'){ from=addDays(mondayOf(t0), tv.offset*7); to=addDays(from,6); label = (tv.offset===0?'Эта неделя · ':tv.offset===-1?'Прошлая неделя · ':'')+fmtDay(keyOf(from))+' – '+fmtDay(keyOf(to)); }
  else { from=new Date(t0.getFullYear(), t0.getMonth()+tv.offset, 1); to=new Date(from.getFullYear(), from.getMonth()+1, 0); label=MONTHS[from.getMonth()]+' '+from.getFullYear(); label=label.charAt(0).toUpperCase()+label.slice(1); }
  return { from:keyOf(from), to:keyOf(to), fromD:from, toD:to, label:label };
}
function tvEntries(){
  var r=tvRange();

function makeDemoEntries(tasks){

  var out=[], rnd=(function(){ var s=7; return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; })();
  var plan=[ ['d7',L,['Вёрстка','Вёрстка','Правки']], ['d1',N,['Анализ','Дизайн']], ['d8',ME,['Дизайн','Вёрстка']], ['d9',ME,['Анализ','Работа']],
    ['d10',A,['Созвон','Созвон']], ['d11',N,['Дизайн','Дизайн','Правки']], ['d12',ME,['Вёрстка','Тестирование']], ['d2',ME,['Созвон']], ['d3',ME,['Анализ','Прототип']], ['d16',ME,['Анализ']], ['d15',ME,['Созвон']] ];

      var st=p[2][Math.floor(rnd()*p[2].length)], h=9+Math.floor(rnd()*8), m=Math.floor(rnd()*4)*15, dur=(20+Math.floor(rnd()*95))*60;

/* =====================================================================
   КАЛЕНДАРЬ — бывший «Планировщик» внутри задачника.
   Та же задача, что на доске: полоски по датам start..end, перенос и
   растягивание мышью, выделение дней = новая задача, «Без даты» слева
   перетаскивается на день, недельная сетка по часам с фактом из таймера.
   ===================================================================== */

function taskColor(t){ if(t.tags[0]) return tagColor(t.tags[0]); return cat(t.category).color; }
function tSpan(t){ var s=t.start||t.end, e=t.end||t.start; if(e<s){ var x=s; s=e; e=x; } return [s,e]; }
function calTasks(from, to){
  return state.tasks.filter(function(t){ if(!t.start && !t.end) return false; var sp=tSpan(t); return sp[0]<=to && sp[1]>=from && matches(t); });
}
/* будущие повторы — «призраки»: карточка появится, когда выполнят текущую */
function calGhosts(from, to){
  var out=[];
  state.tasks.forEach(function(t){
    if(!t.recur || isDone(t) || t.recurNext || (!t.start && !t.end) || !matches(t)) return;
    var sp=tSpan(t), len=Math.round((parseKey(sp[1])-parseKey(sp[0]))/864e5), base=sp[1], n=0;
    while(n<40){
      var nd=keyOf(nextRecurDate(base, t.recur)); n++;
      if(t.recur.until && nd>t.recur.until) break;
      if(nd>to) break;
      var s=keyOf(addDays(parseKey(nd), -len));
      if(nd>=from) out.push({ ghost:true, id:t.id+'@'+nd, src:t, title:t.title, start:s, end:nd, time:t.time, timeEnd:t.timeEnd, tags:t.tags, category:t.category });
      base=nd;
    }
  });
  return out;
}

function monthHtml(){
  var first=new Date(cal.y, cal.m, 1), gs=mondayOf(first), last=new Date(cal.y, cal.m+1, 0), ge=addDays(mondayOf(last),6);
  var from=keyOf(gs), to=keyOf(ge), tk=todayKey();

  items.sort(function(a,b){ var A=tSpan(a), B=tSpan(b); if(A[0]!==B[0]) return A[0]<B[0]?-1:1; var la=A[1]>B[1]?-1:A[1]<B[1]?1:0; if(la) return la; return (a.time||'99')<(b.time||'99')?-1:1; });
  var weeks=Math.round((ge-gs)/864e5+1)/7, h='<div class="weekday-row">'+WD_SHORT.map(function(w,i){ return '<span class="'+(i>4?'is-weekend':'')+'">'+w+'</span>'; }).join('')+'</div><div class="cal-grid" id="cal-grid">';
  for(var w=0; w<weeks; w++){

var teamView={ showDone:{} };
function teamPool(){
  var f=filters(), q=search.trim();
  return state.tasks.filter(function(t){
    for(var i=0;i<f.length;i++){ if(f[i].field==='assignee') continue; var d=FILTER_FIELDS[f[i].field]; if(d && !d.test(t, f[i].values)) return false; }
    return matchesSearch(t, q);
  });
}
var STATUS_ORDER={ progress:0, review:1, new:2, postponed:3, done:4 };
function teamSort(a,b){
  var oa=dueState(a)==='overdue'?0:1, ob=dueState(b)==='overdue'?0:1; if(oa!==ob) return oa-ob;
  if(!!a.urgent!==!!b.urgent) return a.urgent?-1:1;
  var sa=STATUS_ORDER[a.status]!=null?STATUS_ORDER[a.status]:2, sb=STATUS_ORDER[b.status]!=null?STATUS_ORDER[b.status]:2; if(sa!==sb) return sa-sb;
  var x=dueDate(a), y=dueDate(b); if(x&&y) return x-y; if(x) return -1; if(y) return 1; return a.order-b.order;
}
function teamCard(t, pid){

  return '<div class="tm-card'+(ds==='overdue'?' overdue':'')+(isDone(t)?' done':'')+'" draggable="'+(isDone(t)?'false':'true')+'" data-tm-id="'+t.id+'" data-tm-from="'+esc(pid)+'">'+

      (t.reporter && t.reporter!==pid?'<span title="Постановщик">от '+esc(member(t.reporter).short||member(t.reporter).full)+'</span>':'')+
      (isRunning(t)||(state.timers[pid]&&state.timers[pid].taskId===t.id&&state.timers[pid].since)?'<span style="color:var(--ok);font-weight:700">● идёт таймер</span>':'')+
    '</div></div>';
}
function renderTeam(){

  var people=TEAM.map(function(m){ return m; });

  Object.keys(extra).forEach(function(id){ people.push(member(id)); });
  var cols=people.map(function(m){ return { m:m, list:pool.filter(function(t){ return t.assignees.indexOf(m.id)>=0; }) }; });
  var none=pool.filter(function(t){ return !t.assignees.length; });

        (prog?'<span title="В работе">в работе '+prog+'</span>':'')+
        (over?'<span class="bad" title="Просрочено">просрочено '+over+'</span>':'')+
        (rev?'<span class="rev" title="Ждут проверки">на проверке '+rev+'</span>':'')+
        (pid!=='_none'?'<span title="Записано времени за эту неделю'+(plan?' · план открытых задач: '+fmtMin(plan):'')+'">неделя '+fmtDur(ms)+'</span>':'')+
        (runT && !tm.paused?'<span class="run" title="Сейчас работает над: '+esc(runT.title)+'">● '+esc(runT.title.length>22?runT.title.slice(0,22)+'…':runT.title)+'</span>':'')+

      if(sd) h+=doneWeek.map(function(t){ return teamCard(t, pid); }).join('');
    }
    return h+'</div></section>';
  }).join('');
  wrap.innerHTML='<div class="tm-summary">'+
      '<div class="kp"><b>'+cols.filter(function(c){ return c.m.id!=='_none'; }).length+'</b>сотрудников</div>'+
      '<div class="kp"><b>'+tot.open+'</b>открытых задач</div>'+
      '<div class="kp'+(tot.over?' bad':'')+'"><b>'+tot.over+'</b>просрочено</div>'+
      '<div class="kp"><b>'+tot.review+'</b>на проверке</div>'+

function reassign(t, from, to){

  var snap=snapshot(), before=t.assignees.map(function(x){ return member(x).full; }).join(', ');

  if(to!=='_none' && a.indexOf(to)<0) a.unshift(to);
  t.assignees=a;
  if(to!=='_none'){ var r=member(to).role; if(r) t.position=r; }
  log(t,'field',{ label:'Исполнители', from:before, to:a.map(function(x){ return member(x).full; }).join(', ')||'—' });
  persist(); if(openId===t.id) renderDrawer();
  toast(to==='_none' ? 'Исполнитель снят: «'+t.title+'»' : 'Переназначено на '+member(to).full, 'Отменить', function(){ restore(snap); });
}
function bindTeam(){

    if((b=e.target.closest('[data-tm-new]'))){ openNew({ assignees:[b.dataset.tmNew], reporter:ME }); return; }
    if((b=e.target.closest('[data-tm-board]'))){ state.settings.tab='all'; setFilterValues('assignee',[b.dataset.tmBoard]); state.settings.view='board'; save(); renderMain(); toast('Доска: '+member(b.dataset.tmBoard).full+' — фильтр «Исполнитель» можно снять сверху'); return; }
    if((b=e.target.closest('[data-tm-id]'))){ openTask(b.dataset.tmId); return; }
  });
  wrap.addEventListener('dragstart', function(e){ var c=e.target.closest && e.target.closest('.tm-card'); if(!c) return; drag={ id:c.dataset.tmId, from:c.dataset.tmFrom }; c.classList.add('dragging'); try{ e.dataTransfer.setData('text/plain', drag.id); }catch(_){} e.dataTransfer.effectAllowed='move'; });
  wrap.addEventListener('dragend', function(){ drag=null; $$('.tm-card.dragging, .tm-col.drop-target').forEach(function(x){ x.classList.remove('dragging','drop-target'); }); });
  wrap.addEventListener('dragover', function(e){ if(!drag) return; var c=e.target.closest('.tm-col'); if(!c) return; e.preventDefault(); $$('.tm-col.drop-target').forEach(function(x){ if(x!==c) x.classList.remove('drop-target'); }); c.classList.add('drop-target'); });

    if(e.key==='Escape'){ sInp.value=''; search=''; renderMain(); sInp.blur(); }
    if(e.key==='Enter'){ var first=state.tasks.filter(function(t){ return matches(t); }); first=sortTasks(first,'manual').sort(function(a,b){ return (isDone(a)?1:0)-(isDone(b)?1:0); })[0]; if(first) openTask(first.id); else toast('Ничего не найдено в «'+tabById(state.settings.tab).name+'». Попробуйте вкладку «Все».'); }
  });
  $('#search-clear').onclick=function(){ sInp.value=''; search=''; renderMain(); sInp.focus(); };

  $('#toolbar').addEventListener('click', function(e){
    var el;
    if((el=e.target.closest('[data-quick]'))){ var q=QUICK[+el.dataset.quick], f=getFilter(q.field); var on=f && f.values.length===1 && f.values[0]===q.value; setFilterValues(q.field, on?[]:[q.value]); save(); renderMain(); return; }
    if((el=e.target.closest('[data-rm-filter]'))){ setFilterValues(el.dataset.rmFilter, []); save(); renderMain(); return; }
    if(e.target.closest('[data-clear-all]')){ state.settings.filters=[]; state.settings.savedId=null; search=''; sInp.value=''; save(); renderMain(); return; }
    if(e.target.closest('[data-saved-chip]')){ state.settings.savedId=null; save(); renderMain(); return; }
    if((el=e.target.closest('[data-edit-filter]'))){ openFilterValues(el, el.dataset.editFilter); return; }
    if((el=e.target.closest('#add-filter-btn'))){ openAddFilter(el); return; }
    if((el=e.target.closest('#timers-btn'))){ openTimersPop(el); return; }
    if((el=e.target.closest('#saved-btn'))){ openSaved(el); return; }
    if((el=e.target.closest('#notif-btn'))){ openNotifs(el); return; }
    if((el=e.target.closest('#viewcfg-btn'))){ openViewCfg(el); return; }
    if((el=e.target.closest('#more-btn'))){ openMore(el); return; }
    if(e.target.closest('#add-btn')){ openNew(); return; }
  });

  $('#board').addEventListener('click', function(e){
    var el;
    if((el=e.target.closest('[data-ob]'))){ var k=el.dataset.ob; if(k==='new') openNew(); else if(k==='planner') importPlanner(); else if(k==='allplanners') importAllPlanners(); else if(k==='chrono') importChrono(); else if(k==='demo') loadDemo(); return; }
    if((el=e.target.closest('[data-check]'))){ e.stopPropagation(); var t=task(el.dataset.check); isDone(t) ? reopen(t) : complete(t); return; }
    if((el=e.target.closest('[data-tplay]'))){ e.stopPropagation(); var tp0=task(el.dataset.tplay); tAction(isRunning(tp0)?'pause':'play', tp0); return; }
    if((el=e.target.closest('[data-pp-add]'))){ e.stopPropagation(); var tp=task(el.dataset.ppAdd); askPostpone(tp, function(){ persist(); }, { edit:true }); return; }
    if((el=e.target.closest('[data-accept]'))){ var ta=task(el.dataset.accept), snap=snapshot(); setStatus(ta,'done'); log(ta,'text',{ text:'Проверка пройдена ✓' }); ta.order=minOrder()-1; persist(); toast('Принято: #'+ta.num+spawnNote(),'Отменить',function(){ restore(snap); }); return; }
    if((el=e.target.closest('[data-return]'))){ var tr=task(el.dataset.return), snap2=snapshot(); setStatus(tr,'progress'); log(tr,'text',{ text:'Возвращено на доработку' }); persist(); toast('Возвращено на доработку: #'+tr.num,'Написать комментарий',function(){ openTask(tr.id); setTimeout(function(){ var c=$('#composer'); if(c){ c.focus(); c.scrollIntoView({block:'center'}); } },60); }); return; }
    if((el=e.target.closest('[data-col-new]'))){ openNew({ status:el.dataset.colNew }); return; }
    if((el=e.target.closest('[data-col-group]'))){ openColGroup(el, col(el.dataset.colGroup)); return; }
    if((el=e.target.closest('[data-col-menu]'))){ openColMenu(el, col(el.dataset.colMenu)); return; }
    if((el=e.target.closest('[data-quick-add]'))){ quickAddCol=el.dataset.quickAdd; renderBoard(); return; }
    if((el=e.target.closest('[data-group]'))){ var k=el.dataset.group; state.settings.collapsedGroups[k]=!state.settings.collapsedGroups[k]; save(); renderBoard(); return; }
    if(e.target.closest('[data-show-done]')){ showAllDone=!showAllDone; renderBoard(); return; }
    if((el=e.target.closest('.col.collapsed'))){ cp(col(el.dataset.col)).collapsed=false; save(); renderBoard(); return; }
    if((el=e.target.closest('.card'))){ openTask(el.dataset.id); return; }
  });
  $('#board').addEventListener('keydown', function(e){
    if(e.target.id==='qa-input'){
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); var v=e.target.value.trim(); if(v){ quickCreate(quickAddCol, v); } else { quickAddCol=null; renderBoard(); } }
      if(e.key==='Escape'){ e.stopPropagation(); quickAddCol=null; renderBoard(); }
      return;
    }
    var c=e.target.closest('.card'); if(c && e.key==='Enter') openTask(c.dataset.id);
    if(c && e.key===' '){ e.preventDefault(); var tq=task(c.dataset.id); if(!isDone(tq)) tAction(isRunning(tq)?'pause':'play', tq); }
  });
  $('#board').addEventListener('focusout', function(e){
    if(e.target.id==='qa-input'){ setTimeout(function(){ var qa=$('#qa-input'); if(qa && !qa.value.trim() && document.activeElement!==qa){ quickAddCol=null; renderBoard(); } }, 150); }
  });

  $('#list-wrap').addEventListener('click', function(e){
    var el;
    if((el=e.target.closest('[data-lcheck]'))){ e.stopPropagation(); var t=task(el.dataset.lcheck); isDone(t) ? reopen(t) : complete(t); return; }
    if((el=e.target.closest('[data-lstatus]'))){ e.stopPropagation(); var ts=task(el.dataset.lstatus); statusMenuList(el, ts); return; }
    if((el=e.target.closest('[data-lgrp]'))){ listCollapsed[el.dataset.lgrp]=!listCollapsed[el.dataset.lgrp]; renderList(); return; }
    if((el=e.target.closest('tr.row'))){ openTask(el.dataset.id); }
  });

  $('#import-input').addEventListener('change', function(){
    var f=this.files[0]; if(!f || !IS_ADMIN) return; var r=new FileReader();
    r.onload=function(){ var s; try{ s=JSON.parse(r.result); if(!s.tasks) throw 0; }catch(e){ toast('Не похоже на файл задачника'); return; }
      PE.confirm('Заменить доску?', 'Все текущие задачи ('+state.tasks.length+') заменятся задачами из файла ('+s.tasks.length+') — у всей команды.', 'Заменить', true).then(function(ok){ if(!ok) return;
        var snap=snapshot(); var n=normalizeState(s); state.tasks=n.tasks; state.entries=n.entries; state.columns=n.columns; state.tagColors=n.tagColors; state.positions=n.positions; state.seq=Math.max(state.seq, n.seq); closeDrawer(); persist(); toast('Импортировано задач: '+state.tasks.length,'Отменить',function(){ restore(snap); }, 10000); }); };
    r.readAsText(f); this.value='';
  });

  document.addEventListener('keydown', function(e){
    var tag=(e.target.tagName||'').toLowerCase(), typing = tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
    if(e.key==='Escape'){
      if(pops.length){ closePops(); return; }
      if(typing && e.target.id!=='search'){ e.target.blur(); return; }
      if($('.drawer')){ closeDrawer(); return; }
      return;
    }
    if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.code==='KeyN'){ e.preventDefault(); openNew(); }
    else if(e.key==='/' || e.code==='Slash'){ e.preventDefault(); sInp.focus(); sInp.select(); }
    else if(e.code==='KeyB' && !$('.drawer')){ state.settings.view='board'; save(); renderMain(); }
    else if(e.code==='KeyL' && !$('.drawer')){ state.settings.view='list'; save(); renderMain(); }
    else if(e.code==='KeyT' && !$('.drawer')){ state.settings.view='time'; save(); renderMain(); }
    else if(e.code==='KeyC' && !$('.drawer')){ state.settings.view='cal'; save(); renderMain(); }
    else if(e.code==='KeyK' && !$('.drawer') && IS_ADMIN){ state.settings.view='team'; save(); renderMain(); }
    else if(state.settings.view==='cal' && !$('.drawer') && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ calNav(e.key==='ArrowLeft'?-1:1); }
  });

  setTimeout(checkReminders, 1200);
  setInterval(checkReminders, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkReminders(); });
  window.addEventListener('hashchange', openFromHash);
  openFromHash();

  // тик таймера и «относительного времени»
  setInterval(function(){
    tickLive();
  }, 1000);
  setInterval(function(){ if(!$('.drawer') && !pops.length && document.activeElement===document.body) renderMain(); }, 60000);
}
/* =====================================================================
   Уведомления и напоминания (логика из планера + центр уведомлений)
   Работают, пока вкладка открыта. Уже показанные не повторяются после перезагрузки.
   ===================================================================== */
var NT_ICON={ overdue:'clock', soon:'timer', today:'cal', mention:'at', assign:'user', review:'eye' };
function myTask(t){ return t.assignees.indexOf(ME)>=0 || t.reporter===ME; }
function atKey(k, hm){ var d=parseKey(k); if(hm){ var p=hm.split(':'); d.setHours(+p[0], +p[1], 0, 0); } return d; }
function checkReminders(){
  var N=state.settings.notif, now=new Date(), tk=todayKey(), fresh=[], since=state.settings.notifSince||0;
  var mp=(N.morning||'09:00').split(':'), morning=new Date(); morning.setHours(+mp[0], +mp[1], 0, 0);
  function push(key, type, t, title, text){
    if(state.notified[key]) return;
    state.notified[key]=Date.now();
    var n={ id:uid('n'), at:Date.now(), type:type, taskId:t.id, title:title, text:text, read:false };
    state.notifications.unshift(n); fresh.push(n);
    if(N.browser && 'Notification' in window && Notification.permission==='granted'){
      try{ var nn=new Notification(title+': '+t.title, { body:text, tag:key }); nn.onclick=function(){ window.focus(); openTask(t.id); nn.close(); }; }catch(e){}
    }
  }
  state.tasks.forEach(function(t){
    if(isDone(t)) return;
    if(N.mentions) t.activity.forEach(function(a){
      if(a.author===ME || !a.at || a.at<since) return;
      var me=member(ME).full;
      if(a.type==='created' && t.assignees.indexOf(ME)>=0) push('assign|'+a.id, 'assign', t, member(a.author).full+' '+gv(a.author,'поставил','поставила')+' вам задачу', t.title);
      else if(a.type==='field' && a.label==='Исполнители' && t.assignees.indexOf(ME)>=0 && String(a.to||'').indexOf(me)>=0 && String(a.from||'').indexOf(me)<0) push('assign|'+a.id, 'assign', t, member(a.author).full+' '+gv(a.author,'назначил','назначила')+' вас исполнителем', t.title);
      else if(a.type==='status' && a.to==='review' && t.reporter===ME && t.status==='review') push('review|'+a.id, 'review', t, member(a.author).full+' '+gv(a.author,'отправил','отправила')+' на проверку', t.title);
    });
    if(N.mentions) t.comments.forEach(function(c){
      if(c.author!==ME && (c.at||0)>=since && mentionsIn(c.text).indexOf(ME)>=0) push('mention|'+c.id, 'mention', t, member(c.author).full+' '+gv(c.author,'упомянул','упомянула')+' вас', c.text.slice(0,120));
    });
    if(t.status==='postponed'){
      if(t.postpone && t.postpone.until && t.postpone.until<=tk && now>=morning && myTask(t)) push('back|'+t.id+'|'+t.postpone.until, 'today', t, 'Пора вернуться к отложенной', 'Причина была: '+t.postpone.reason);
      return;
    }
    if(!myTask(t) || t.remind==='off' || (!t.end && !t.start)) return;
    var ds=dueState(t), dk=t.end||t.start;
    if(N.overdue && ds==='overdue'){ push('overdue|'+t.id+'|'+dk+(t.timeEnd||t.time), 'overdue', t, 'Просрочено', 'Срок был: '+dateLabel(t)); return; }
    var lead = t.remind==='default' ? N.lead : +t.remind;
    // момент для «скоро»: время начала (встреча) или время дедлайна
    var moment = t.time ? atKey(t.start||dk, t.time) : (t.timeEnd ? atKey(dk, t.timeEnd) : null);
    if(moment){
      var diff=Math.round((moment-now)/60000);
      if(diff>=0 && diff<=lead) push('soon|'+t.id+'|'+moment.getTime(), 'soon', t, diff<=1?'Начинается сейчас':'Через '+(diff<60?diff+' мин':Math.round(diff/60)+' ч'), dateLabel(t));
    }
    if(t.remind==='1440' && dk===keyOf(addDays(today(),1)) && now>=morning) push('tomorrow|'+t.id+'|'+dk, 'soon', t, 'Завтра срок', dateLabel(t));
    if(N.today && dk===tk && now>=morning && !moment) push('today|'+t.id+'|'+dk, 'today', t, 'Сегодня срок', dateLabel(t));
  });
  // чистим историю: старше 30 дней и больше 80 записей
  var lim=Date.now()-30*864e5;
  Object.keys(state.notified).forEach(function(k){ if(state.notified[k]<lim) delete state.notified[k]; });
  state.notifications=state.notifications.filter(function(n){ return n.at>=lim && task(n.taskId); }).slice(0,80);
  if(fresh.length){
    save(); renderNotifBadge();
    if(fresh.length===1){ var f=fresh[0], ft=task(f.taskId); toast(f.title+': '+ft.title, 'Открыть', function(){ markRead(f); openTask(ft.id); }, 7000); }
    else toast('Новых напоминаний: '+fresh.length, 'Показать', function(){ openNotifs($('#notif-btn')); }, 7000);
  }
}
function markRead(n){ n.read=true; save(); renderNotifBadge(); }
function renderNotifBadge(){
  var n=state.notifications.filter(function(x){ return !x.read; }).length, b=$('#notif-badge');
  if(!b) return; b.textContent=n>9?'9+':n; b.classList.toggle('hidden', !n);
  $('#notif-btn').classList.toggle('on', !!state.settings.notif.browser);
}
function openNotifs(anchor){
  openPop(anchor, function(el, api){
    var tab='list';
    function draw(){
      var N=state.settings.notif, L=state.notifications, unread=L.filter(function(x){ return !x.read; }).length;
      var h='<div class="pop-title" style="justify-content:space-between"><span>'+(tab==='list'?'Уведомления':'Напоминания')+'</span><span class="seg" style="padding:2px"><button data-nt="list" class="'+(tab==='list'?'active':'')+'">Лента'+(unread?' '+unread:'')+'</button><button data-nt="cfg" class="'+(tab==='cfg'?'active':'')+'">'+I('gear',12)+'</button></span></div>';
      if(tab==='list'){
        if(!L.length) h+='<div class="pop-hint" style="padding:14px 8px;text-align:center">Всё спокойно — нет просроченных задач, сроков на сегодня и упоминаний.</div>';
        else {
          h+=L.slice(0,40).map(function(n){ var t=task(n.taskId); if(!t) return '';
            var done=isDone(t);
            return '<div class="nt-item'+(n.read?'':' unread')+'" data-nt-open="'+n.id+'"><span class="nt-ico '+n.type+'">'+I(NT_ICON[n.type]||'bell',14)+'</span><div class="nt-body"><div class="t" style="'+(done?'text-decoration:line-through;color:var(--ink-faint)':'')+'">'+esc(t.title)+'</div><div class="s">'+esc(n.title)+(n.type==='mention'?' · «'+esc(n.text)+'»':' · '+esc(n.text))+'</div><div class="s" style="color:var(--ink-faint)">'+relTime(n.at)+'</div></div></div>';
          }).join('');
          h+='<div class="pop-actions">'+(unread?'<button class="btn btn-sm" data-nt-readall>Прочитать все</button>':'')+'<button class="btn btn-sm" data-nt-clear>Очистить</button></div>';
        }
      } else {
        var perm = 'Notification' in window ? Notification.permission : 'unsupported';
        h+='<label class="pop-row" style="cursor:pointer"><span>Уведомления браузера'+(perm==='denied'?'<br><span style="font-size:.64rem;color:var(--danger)">запрещены в настройках браузера</span>':'')+'</span><input type="checkbox" class="toggle" data-nc="browser"'+(N.browser&&perm==='granted'?' checked':'')+'></label>'+
          '<div class="pop-label">Предупреждать заранее</div><div class="lead-row">'+[5,10,15,30,60,180].map(function(m){ return '<button class="lead-chip'+(N.lead===m?' sel':'')+'" data-lead="'+m+'">'+(m<60?m+' мин':(m/60)+' ч')+'</button>'; }).join('')+'</div>'+
          '<label class="pop-row" style="cursor:pointer"><span>О просроченных задачах</span><input type="checkbox" class="toggle" data-nc="overdue"'+(N.overdue?' checked':'')+'></label>'+
          '<label class="pop-row" style="cursor:pointer"><span>Утром — о сроках на сегодня</span><input type="checkbox" class="toggle" data-nc="today"'+(N.today?' checked':'')+'></label>'+
          '<div class="pop-row"><span style="color:var(--ink-soft)">Время утреннего напоминания</span><input type="time" id="nc-morning" value="'+esc(N.morning)+'" style="border:1px solid var(--line);border-radius:9px;padding:4px 7px;font-size:.72rem"></div>'+
          '<label class="pop-row" style="cursor:pointer"><span>Упоминания, задачи мне и проверки</span><input type="checkbox" class="toggle" data-nc="mentions"'+(N.mentions?' checked':'')+'></label>'+
          '<div class="pop-hint" style="padding-top:6px">Напоминания приходят по задачам, где вы исполнитель или постановщик, пока задачник открыт во вкладке. Для отдельной задачи время можно поменять в поле «Напоминание».</div>';
      }
      el.innerHTML=h; api.reposition();
    }
    draw();
    el.addEventListener('click', function(e){
      var b;
      if((b=e.target.closest('[data-nt]'))){ tab=b.dataset.nt; draw(); return; }
      if((b=e.target.closest('[data-nt-open]'))){ var n=state.notifications.filter(function(x){ return x.id===b.dataset.ntOpen; })[0]; if(n){ markRead(n); api.close(); openTask(n.taskId); } return; }
      if(e.target.closest('[data-nt-readall]')){ state.notifications.forEach(function(x){ x.read=true; }); save(); renderNotifBadge(); draw(); return; }
      if(e.target.closest('[data-nt-clear]')){ state.notifications=[]; save(); renderNotifBadge(); draw(); return; }
      if((b=e.target.closest('[data-lead]'))){ state.settings.notif.lead=+b.dataset.lead; save(); draw(); return; }
    });
    el.addEventListener('change', function(e){
      var N=state.settings.notif, t=e.target;
      if(t.id==='nc-morning'){ N.morning=t.value||'09:00'; save(); return; }
      var k=t.dataset.nc; if(!k) return;
      if(k==='browser' && t.checked){
        if(!('Notification' in window)){ toast('Браузер не поддерживает уведомления'); t.checked=false; return; }
        Notification.requestPermission().then(function(p){ N.browser = p==='granted'; save(); renderNotifBadge(); draw(); if(p!=='granted') toast('Разрешение на уведомления не выдано'); else { toast('Уведомления браузера включены'); checkReminders(); } });
        return;
      }
      N[k]=t.checked; save(); renderNotifBadge(); if(t.checked) checkReminders();
    });
  }, { width:360, alignRight:true });
}

function openColGroup(anchor, c){
  var g=state.settings.group;
  openMenu(anchor, [{ header:'Группировка в «'+c.name+'»' },
    { label:'Как на всей доске', val:GROUPS[g], sel:!cp(c).group, action:function(){ cp(c).group=null; save(); renderMain(); } },
    { sep:true }].concat(Object.keys(GROUPS).map(function(k){
      return { label:GROUPS[k], icon:k==='none'?'x':'group', sel:cp(c).group===k, action:function(){ cp(c).group=k; save(); renderMain(); } };
    })).concat([{ sep:true }, { label:'Группировка для всей доски…', icon:'gear', action:function(){ openViewCfg($('#viewcfg-btn')); } }]));
}
function statusMenuList(anchor, t){
  openMenu(anchor, state.columns.map(function(c){
    return { label:c.name, dot:colDot(c), sel:t.status===c.id, action:function(){ if(t.status===c.id) return; if(c.id==='done'){ complete(t); return; } if(c.id==='postponed'){ var snp=snapshot(); askPostpone(t, function(){ persist(); toast('Отложено: '+t.postpone.reason,'Отменить',function(){ restore(snp); }); }); return; } setStatus(t,c.id); persist(); } };
  }));
}
function openFromHash(){
  var m=location.hash.match(/^#task-(\d+)$/); if(!m) return;
  var t=taskByNum(+m[1]); if(t && openId!==t.id) openTask(t.id);
}

init();
});
</script>
