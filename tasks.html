<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/pe-core.css?v=20260927c">
<script src="assets/pe-core.js?v=20260927c" data-module="tasks"></script>
<style>
  /* ===== Токены — 1:1 из planner.html ===== */
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF;
    --ink:#121212; --ink-soft:#7A7A7A; --ink-faint:#ABABAB;
    --line:#E4E4E4; --line-soft:#EEEEEE; --divider-strong:#D6D6D6;
    --accent:#2563EB; --accent-tint:#E9F0FE; --accent-dark:#1d4fc4;
    --today-ring:#2563EB;
    --danger:#A8402F; --danger-tint:#FBEAE7; --danger-bright:#DC2626;
    --ok:#1A8A4B; --ok-tint:#E3F6E9;
    --warn:#B45309; --warn-tint:#FEF3E2;
    --radius:18px;
    --nav-h:var(--pe-nav-h, 0px); /* высота общей навигации экосистемы (pe-core.css) */
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Mono', monospace; font-size:14px;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--nav-h);
  }
  button,input,textarea,select{ font-family:inherit; color:inherit; }
  .hidden{ display:none !important; }
  svg{ flex:none; }

  .app{ display:flex; flex-direction:column; height:calc(100vh - var(--nav-h)); height:calc(100dvh - var(--nav-h)); padding:22px 32px 0; max-width:1900px; margin:0 auto; }
  @media (max-width:880px){ .app{ padding:16px 16px 0; } }

  /* ===== Шапка страницы ===== */
  .page-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .page-left{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; min-width:0; }
  .page-title{ font-size:1.5rem; font-weight:700; text-transform:uppercase; letter-spacing:.01em; margin:0; }
  .page-title::before{ content:"/ "; color:var(--ink-faint); font-weight:400; }
  .tabs{ display:flex; gap:4px; border:1px solid var(--line); border-radius:999px; padding:4px; overflow-x:auto; max-width:100%; }
  .tab{ border:none; background:none; cursor:pointer; font-size:.76rem; font-weight:600; color:var(--ink-soft);
        padding:7px 14px; border-radius:999px; white-space:nowrap; display:flex; gap:7px; align-items:center; }
  .tab:hover{ color:var(--ink); }
  .tab.active{ background:var(--accent-tint); color:var(--accent); }
  .tab .n{ font-size:.68rem; font-weight:700; opacity:.7; }

  /* ===== Кнопки ===== */
  .btn{ border:1px solid var(--line); background:var(--surface); padding:8px 15px; border-radius:999px;
        font-size:.76rem; font-weight:600; text-transform:uppercase; letter-spacing:.03em; cursor:pointer;
        display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:background .12s, border-color .12s; }
  .btn:hover{ background:var(--accent-tint); border-color:var(--accent); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-dark); border-color:var(--accent-dark); }
  .btn-sm{ padding:5px 11px; font-size:.68rem; }
  .btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn .kbd{ font-size:.62rem; opacity:.7; border:1px solid rgba(255,255,255,.5); border-radius:4px; padding:0 4px; font-weight:500; }
  .icon-btn{ width:32px; height:32px; border-radius:999px; border:none; background:transparent; cursor:pointer;
             display:inline-flex; align-items:center; justify-content:center; color:var(--ink); position:relative; transition:background .12s; flex:none; }
  .icon-btn:hover{ background:var(--accent-tint); }
  .icon-btn.bordered{ border:1px solid var(--line); }
  .icon-btn.sm{ width:26px; height:26px; }
  .icon-btn.on{ background:var(--accent-tint); color:var(--accent); }
  .icon-badge{ position:absolute; top:-3px; right:-3px; background:var(--accent); color:#fff; font-size:.6rem; font-weight:700;
               min-width:15px; height:15px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .seg{ display:flex; gap:2px; border:1px solid var(--line); border-radius:999px; padding:3px; }
  .seg button{ border:none; background:none; border-radius:999px; padding:6px 13px; font-size:.7rem; font-weight:600;
               text-transform:uppercase; letter-spacing:.03em; cursor:pointer; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .seg button.active{ background:var(--ink); color:#fff; }

  /* ===== Тулбар: поиск + фильтры + добавить ===== */
  .toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .search-wrap{ position:relative; flex:0 1 250px; min-width:170px; }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; }
  .search-wrap input{ width:100%; padding:8px 30px 8px 31px; border:1px solid var(--line); border-radius:999px; font-size:.8rem; background:#fff; }
  .search-wrap input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .search-wrap .kbd-hint{ position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:.64rem; color:var(--ink-faint);
                          border:1px solid var(--line); border-radius:5px; padding:0 5px; pointer-events:none; }
  .search-wrap .clear{ position:absolute; right:6px; top:50%; transform:translateY(-50%); }
  .tb-sep{ width:1px; height:22px; background:var(--line); margin:0 2px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:#fff; border-radius:999px;
         padding:5px 11px; font-size:.72rem; cursor:pointer; white-space:nowrap; transition:border-color .12s, background .12s; }
  .chip:hover{ border-color:var(--accent); }
  .chip.on{ border-color:var(--accent); background:var(--accent-tint); color:var(--accent); font-weight:600; }
  .chip .x{ opacity:.55; display:inline-flex; margin-right:-3px; }
  .chip .x:hover{ opacity:1; }
  .chip .dot{ width:8px; height:8px; border-radius:50%; }
  .chip-filter{ background:var(--accent-tint); border-color:#C9D8FB; }
  .chip-filter b{ font-weight:700; }
  .chip-add{ border-style:dashed; color:var(--ink-soft); }
  .tb-spacer{ flex:1 1 auto; }
  .toolbar-scroll{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

  /* ===== Доска ===== */
  .board-wrap{ flex:1 1 auto; min-height:0; overflow-x:auto; overflow-y:hidden; margin:0 -32px; padding:0 32px 18px; }
  @media (max-width:880px){ .board-wrap{ margin:0 -16px; padding:0 16px 16px; } }
  .board{ display:flex; gap:14px; height:100%; align-items:flex-start; }
  /* центрирование через auto-поля: при нехватке места не обрезает левую колонку */
  .board > .col:first-child{ margin-left:auto; }
  .board::after{ content:""; flex:0 0 1px; margin-right:auto; }
  .col{ flex:1 1 0; min-width:260px; max-width:420px; max-height:100%; display:flex; flex-direction:column; border-radius:var(--radius);
        background:var(--col-bg, #F4F4F5); padding:8px; transition:box-shadow .12s; }
  .col.drop-target{ box-shadow:0 0 0 2px var(--accent) inset; }
  .col-head{ display:flex; align-items:center; gap:6px; padding:4px 4px 8px 6px; }
  .col-title{ font-size:.76rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .col-count{ font-size:.68rem; font-weight:700; color:var(--ink-soft); background:rgba(255,255,255,.75); border-radius:999px; padding:2px 8px; }
  .col-count.over{ background:var(--danger); color:#fff; }
  .col-head .grow{ flex:1; }
  .col-head .icon-btn{ width:26px; height:26px; color:var(--ink-soft); }
  .col-head .icon-btn:hover{ background:rgba(255,255,255,.8); color:var(--ink); }
  .col-head .col-grp{ width:24px; height:24px; opacity:0; }
  .col-head:hover .col-grp, .col-head .col-grp:focus-visible, .col-head .col-grp.on{ opacity:1; }
  .col-head .col-grp.on{ color:var(--accent); background:rgba(255,255,255,.75); }
  .col-body{ overflow-y:auto; min-height:8px; padding:2px 2px 2px; margin:0 -2px; display:flex; flex-direction:column; gap:7px; }
  .col-body::-webkit-scrollbar{ width:6px; } .col-body::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.12); border-radius:9px; }
  .col.collapsed{ flex:none; min-width:0; width:48px; padding:8px 4px; cursor:pointer; }
  .col.collapsed .col-head{ flex-direction:column; padding:4px 0; gap:10px; }
  .col.collapsed .col-title{ writing-mode:vertical-rl; transform:rotate(180deg); overflow:visible; }
  .col-add{ border:none; background:rgba(255,255,255,.55); border-radius:12px; padding:9px; font-size:.74rem; color:var(--ink-soft);
            cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; margin-top:7px; flex:none; }
  .col-add:hover{ background:#fff; color:var(--ink); }
  .quick-add{ background:#fff; border:1.5px solid var(--accent); border-radius:12px; padding:9px 11px; margin-top:7px; }
  .quick-add textarea{ width:100%; border:none; outline:none; resize:none; font-size:.82rem; line-height:1.35; padding:0; min-height:20px; }
  .quick-add .qa-hint{ font-size:.64rem; color:var(--ink-faint); margin-top:4px; }
  .col-more{ border:none; background:none; font-size:.7rem; color:var(--ink-soft); cursor:pointer; padding:6px; text-decoration:underline; }
  .group-head{ display:flex; align-items:center; gap:6px; font-size:.7rem; font-weight:600; color:var(--ink-soft); cursor:pointer;
               padding:4px 4px 0; user-select:none; text-transform:uppercase; letter-spacing:.03em; }
  .group-head .chev{ transition:transform .15s; }
  .group-head.closed .chev{ transform:rotate(-90deg); }
  .group-head .n{ color:var(--ink-faint); }
  .add-col{ width:220px; flex:none; border:1.5px dashed var(--line); border-radius:var(--radius); padding:12px; background:none; cursor:pointer;
            font-size:.74rem; color:var(--ink-soft); text-transform:uppercase; font-weight:600; letter-spacing:.03em; }
  .add-col:hover{ border-color:var(--accent); color:var(--accent); }

  /* ===== Карточка ===== */
  .card{ background:#fff; border:1px solid rgba(0,0,0,.06); border-radius:12px; padding:10px 11px 9px; cursor:pointer; position:relative;
         box-shadow:0 1px 2px rgba(0,0,0,.05); transition:box-shadow .12s, transform .12s; }
  .card:hover{ box-shadow:0 4px 14px rgba(0,0,0,.09); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .card.dragging{ opacity:.35; }
  .card.is-hit{ box-shadow:0 0 0 2px var(--accent); }
  .card-title{ font-size:.82rem; line-height:1.38; font-weight:500; padding-right:22px; overflow-wrap:anywhere; display:flex; gap:6px; align-items:flex-start; }
  .card-title .urg{ color:var(--danger-bright); margin-top:2px; }
  .card.is-done .card-title{ color:var(--ink-faint); text-decoration:line-through; }
  .card-parent{ font-size:.64rem; color:var(--ink-faint); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-row{ display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; align-items:center; }
  .date-chip{ display:inline-flex; align-items:center; gap:5px; font-size:.67rem; border-radius:6px; padding:2px 7px;
              background:var(--line-soft); color:var(--ink-soft); white-space:nowrap; border:1px solid transparent; }
  .date-chip.overdue{ background:var(--danger-tint); color:var(--danger-bright); border-color:#F3C3BB; }
  .date-chip.today{ background:var(--accent-tint); color:var(--accent); }
  .date-chip.soon{ background:var(--warn-tint); color:var(--warn); }
  .tag{ font-size:.64rem; border-radius:6px; padding:2px 7px; white-space:nowrap; font-weight:600; }
  .cat-pill{ font-size:.64rem; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px; }
  .cat-pill i{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .card-foot{ display:flex; align-items:center; gap:10px; margin-top:8px; font-size:.68rem; color:var(--ink-soft); }
  .card-foot .m{ display:inline-flex; align-items:center; gap:3px; }
  .card-foot .m.full{ color:var(--ok); }
  .card-foot .grow{ flex:1; }
  .card-progress{ height:3px; background:var(--line-soft); border-radius:3px; margin-top:8px; overflow:hidden; }
  .card-progress i{ display:block; height:100%; background:var(--ok); border-radius:3px; }
  .card-check{ position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--divider-strong);
               background:#fff; display:flex; align-items:center; justify-content:center; opacity:0; cursor:pointer; color:transparent; transition:opacity .1s; }
  .card:hover .card-check, .card-check:focus-visible{ opacity:1; }
  .card-check:hover{ border-color:var(--ok); color:var(--ok); }
  .card.is-done .card-check{ opacity:1; border-color:#9ED9B4; color:var(--ok); background:var(--ok-tint); }
  .card.is-done .card-check:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-tint); }
  .review-actions{ display:flex; gap:6px; margin-top:8px; }
  .review-actions button{ flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:.66rem; padding:5px; cursor:pointer; font-weight:600; }
  .review-actions .ok:hover{ border-color:var(--ok); color:var(--ok); background:var(--ok-tint); }
  .review-actions .back:hover{ border-color:var(--warn); color:var(--warn); background:var(--warn-tint); }
  .drop-line{ height:3px; border-radius:3px; background:var(--accent); margin:-2px 4px; flex:none; }
  .col-empty{ font-size:.72rem; color:var(--ink-faint); text-align:center; padding:14px 6px; font-style:italic; }

  /* ===== Аватары ===== */
  .av{ width:22px; height:22px; border-radius:50%; color:#fff; font-size:.6rem; font-weight:700; display:inline-flex; align-items:center;
       justify-content:center; flex:none; border:2px solid #fff; }
  .av.lg{ width:26px; height:26px; font-size:.66rem; }
  .avs{ display:inline-flex; align-items:center; }
  .avs .av + .av{ margin-left:-7px; }
  .avs .arrow{ color:var(--ink-faint); margin:0 2px; }

  /* ===== Список ===== */
  .list-wrap{ flex:1 1 auto; overflow:auto; padding-bottom:30px; }
  .lst{ width:100%; border-collapse:separate; border-spacing:0; font-size:.78rem; min-width:780px; }
  .lst th{ text-align:left; font-size:.64rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700;
           padding:8px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:1; }
  .lst td{ padding:8px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  .lst tr.row{ cursor:pointer; } .lst tr.row:hover td{ background:#FAFAFA; }
  .lst tr.grp td{ background:var(--col-bg); font-weight:700; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; border-bottom:none; }
  .lst tr.grp td:first-child{ border-radius:10px 0 0 10px; } .lst tr.grp td:last-child{ border-radius:0 10px 10px 0; }
  .lst .t-done{ color:var(--ink-faint); text-decoration:line-through; }
  .row-check{ appearance:none; -webkit-appearance:none; width:16px; height:16px; border:1.5px solid var(--ink-faint); border-radius:5px;
              cursor:pointer; position:relative; flex:none; margin:0; vertical-align:middle; background:#fff; }
  .row-check:checked{ background:var(--accent); border-color:var(--accent); }
  .row-check:checked::after{ content:""; position:absolute; left:4.5px; top:1px; width:4px; height:7px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(40deg); }
  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:.68rem; border-radius:999px; padding:3px 10px; font-weight:600; white-space:nowrap; }

  /* ===== Поповеры и меню ===== */
  .pop{ position:fixed; z-index:300; background:var(--surface); border:1px solid var(--line); border-radius:16px;
        box-shadow:0 14px 34px rgba(0,0,0,.16); padding:8px; min-width:200px; max-width:min(360px, calc(100vw - 20px));
        max-height:min(70vh, 560px); overflow-y:auto; animation:pop-in .12s ease; }
  @keyframes pop-in{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
  .pop-label{ font-size:.62rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; padding:6px 8px 4px; font-weight:600; }
  .pop-title{ font-size:.8rem; font-weight:700; padding:4px 8px 8px; display:flex; align-items:center; gap:6px; }
  .pop-hint{ font-size:.7rem; color:var(--ink-soft); padding:0 8px 8px; line-height:1.45; }
  .mi{ display:flex; align-items:center; gap:9px; width:100%; border:none; background:none; text-align:left; padding:7px 9px; border-radius:9px;
       font-size:.76rem; cursor:pointer; color:var(--ink); }
  .mi:hover, .mi.kb{ background:var(--accent-tint); }
  .mi .ico{ color:var(--ink-soft); display:inline-flex; width:16px; justify-content:center; }
  .mi .val{ margin-left:auto; color:var(--ink-faint); font-size:.68rem; }
  .mi.danger{ color:var(--danger); } .mi.danger .ico{ color:var(--danger); }
  .mi.sel{ font-weight:600; } .mi.sel .check{ color:var(--accent); }
  .mi .check{ margin-left:auto; }
  .mi[disabled]{ opacity:.45; cursor:not-allowed; }
  .pop-sep{ height:1px; background:var(--line-soft); margin:6px 4px; }
  .pop-input{ width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:10px; font-size:.78rem; background:#fff; }
  .pop-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .pop-actions{ display:flex; justify-content:flex-end; gap:6px; padding:8px 4px 2px; }
  .opt{ display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:9px; cursor:pointer; font-size:.76rem; }
  .opt:hover{ background:var(--accent-tint); }
  .opt .sub{ margin-left:auto; font-size:.66rem; color:var(--ink-faint); }
  .pop-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 8px; font-size:.76rem; }
  .pop-row select{ border:1px solid var(--line); border-radius:9px; padding:5px 8px; font-size:.72rem; background:#fff; max-width:170px; }
  .sw-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; padding:4px 8px; }
  .sw{ aspect-ratio:1/1; border-radius:8px; cursor:pointer; border:1.5px solid rgba(0,0,0,.06); }
  .sw.sel{ border-color:var(--ink); }
  .toggle{ appearance:none; -webkit-appearance:none; width:30px; height:18px; border-radius:999px; background:var(--divider-strong); position:relative; cursor:pointer; flex:none; margin:0; transition:background .15s; }
  .toggle::after{ content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .toggle:checked{ background:var(--accent); } .toggle:checked::after{ transform:translateX(12px); }

  /* календарь в поповере — стиль date-popover из планера */
  .dp{ width:268px; padding:4px; }
  .dp-quick{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; }
  .dp-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .dp-label{ font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.02em; }
  .dp-nav{ width:24px; height:24px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .dp-nav:hover{ background:var(--accent-tint); }
  .dp-wd{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:3px; }
  .dp-wd span{ text-align:center; font-size:.6rem; color:var(--ink-soft); text-transform:uppercase; }
  .dp-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px 0; }
  .dp-day{ aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:.74rem; cursor:pointer; border-radius:8px; }
  .dp-day:hover{ background:var(--accent-tint); }
  .dp-day.o{ color:var(--ink-faint); }
  .dp-day.t{ font-weight:700; color:var(--today-ring); }
  .dp-day.in{ background:var(--accent-tint); border-radius:0; }
  .dp-day.s, .dp-day.e{ background:var(--accent); color:#fff; font-weight:700; }
  .dp-day.s{ border-radius:8px 0 0 8px; } .dp-day.e{ border-radius:0 8px 8px 0; } .dp-day.s.e{ border-radius:8px; }
  .dp-times{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .dp-times label{ font-size:.62rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:3px; }
  .dp-times input{ width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:9px; font-size:.76rem; }
  .dp-summary{ font-size:.7rem; color:var(--ink-soft); margin-top:9px; min-height:1em; }

  /* ===== Панель задачи (drawer) ===== */

  .files{ display:flex; flex-direction:column; gap:4px; margin-top:8px; }

  /* ===== Тост ===== */

          border-radius:14px; font-size:.78rem; display:flex; align-items:center; gap:14px; box-shadow:0 10px 26px rgba(0,0,0,.28); z-index:400; max-width:90vw; animation:pop-in .15s ease; }

  /* ===== Просроченная карточка — целиком красная, как в планере ===== */
  @keyframes pulse-red{ 0%{ background:#FF4433; } 100%{ background:#C81E1E; } }

  .card.is-overdue .card-parent{ color:rgba(255,255,255,.75); }

  .overdue-label{ font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; background:rgba(0,0,0,.18); border-radius:5px; padding:1px 6px; }
  .lst .lgrip{ color:var(--ink-faint); cursor:grab; padding-right:0; }

  .modal-back{ position:fixed; inset:0; background:rgba(30,30,25,.35); z-index:350; display:flex; align-items:center; justify-content:center; padding:20px; animation:fade .12s ease; }
  .modal{ background:var(--surface); border:1px solid var(--line); border-radius:22px; width:100%; max-width:480px; padding:22px 22px 18px; box-shadow:0 20px 50px rgba(0,0,0,.2); animation:pop-in .15s ease; max-height:92vh; overflow-y:auto; }

  .modal input[type=date]{ border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:.72rem; }
  .modal .actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; align-items:center; }
  .modal .actions .hint{ margin-right:auto; font-size:.64rem; color:var(--ink-faint); }

  .wv-adcol{ border-left:1px solid var(--line-soft); padding:3px; display:flex; flex-direction:column; gap:0; min-width:0; }
  .wv-adcol.is-weekend{ background:#F2F2F3; }
  .wv-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; }
  .wv-grid{ display:grid; grid-template-columns:52px repeat(7,1fr); position:relative; }
  .wv-hl{ position:absolute; right:6px; font-size:.6rem; color:var(--ink-faint); transform:translateY(-6px); }
  .wv-col{ position:relative; border-left:1px solid var(--line-soft); cursor:cell; }
  .wv-col.is-weekend{ background:#F7F7F8; }
  .wv-col.drop-hi, .wv-adcol.drop-hi{ background:rgba(37,99,235,.10); }
  .wv-line{ position:absolute; left:0; right:0; border-top:1px solid var(--line-soft); pointer-events:none; }
  .wv-now{ position:absolute; left:0; right:0; border-top:2px solid #FF3B30; z-index:6; pointer-events:none; }
  .wv-now::before{ content:""; position:absolute; left:-4px; top:-5px; width:8px; height:8px; border-radius:50%; background:#FF3B30; }
  .wv-block{ position:absolute; border-radius:7px; padding:3px 7px; color:#fff; font-size:.68rem; line-height:1.25; overflow:hidden; cursor:grab; background:var(--c); box-shadow:0 1px 3px rgba(0,0,0,.18); z-index:2; touch-action:none; }
  .wv-block.is-done{ opacity:.45; } .wv-block.is-done .wv-bt{ text-decoration:line-through; }
  .wv-block.ghost{ background:rgba(255,255,255,.7); color:var(--c); border:1.5px dashed var(--c); box-shadow:none; cursor:pointer; }
  .wv-block.is-overdue{ background:#E0352B; }
  .wv-block.is-rec{ box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ok); }
  .wv-block.is-dragging-source{ opacity:.85; z-index:10; }
  .wv-bt{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wv-btime{ font-size:.6rem; opacity:.85; white-space:nowrap; }
  .wv-resize{ position:absolute; left:0; right:0; bottom:0; height:7px; cursor:ns-resize; }
  .wv-fact{ position:absolute; right:2px; width:calc(22% - 4px); border-radius:4px; z-index:3; background:repeating-linear-gradient(135deg, var(--c) 0 3px, color-mix(in srgb, var(--c) 45%, #fff) 3px 6px); opacity:.85; }
  .wv-fact.live{ animation:recblink 1.6s ease-in-out infinite; }
  .wv-sel{ position:absolute; left:2px; right:2px; background:rgba(37,99,235,.18); border:1.5px solid var(--accent); border-radius:7px; font-size:.64rem; color:var(--accent); font-weight:700; padding:2px 6px; z-index:4; pointer-events:none; }

  .empty-state{ margin:40px auto; text-align:center; color:var(--ink-soft); font-size:.8rem; line-height:1.6; }
  .empty-state b{ display:block; color:var(--ink); font-size:.9rem; margin-bottom:4px; text-transform:uppercase; }

  /* ===== v2: слои поверх общей навигации экосистемы ===== */
  .drawer-back{ top:var(--nav-h); z-index:940; }
  .drawer{ top:var(--nav-h); z-index:950; }
  .pop{ z-index:1000; }
  .modal-back{ z-index:1050; }
  .toast{ z-index:1100; }
  .viz-tip{ z-index:1150; }
  .drag-ghost{ z-index:1200; }
  @media (max-width:980px){
    .cal-layout .cal-side{ overflow:visible; }
    .cal-layout .cal-main{ min-height:auto; }
    .cal-layout .cal-grid{ flex:none; overflow:visible; }
    .cal-layout .cal-week{ min-height:96px; }
    .cal-layout .week-view{ height:560px; }
  }
  @media (pointer:coarse){ .wv-block, .bar, .bk-item{ touch-action:auto; } .cal-hint{ display:none; } }
  /* ===== v2: режим «Команда» (руководитель видит и правит задачи всех) ===== */
  body.view-team #tabs{ display:none; }
  .team-wrap{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:12px; }
  .tm-summary{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tm-summary .kp{ border:1px solid var(--line); border-radius:12px; padding:7px 12px; background:#fff; font-size:.7rem; color:var(--ink-soft); }
  .tm-summary .kp b{ display:block; font-size:1rem; color:var(--ink); }
  .tm-summary .kp.bad b{ color:var(--danger-bright); }
  .tm-summary .hint{ font-size:.68rem; color:var(--ink-faint); max-width:520px; line-height:1.5; margin-left:auto; }
  .tm-grid{ flex:1 1 auto; min-height:0; display:flex; gap:14px; overflow-x:auto; align-items:flex-start; margin:0 -32px; padding:0 32px 18px; }
  @media (max-width:880px){ .tm-grid{ margin:0 -16px; padding:0 16px 16px; } }
  .tm-col{ flex:0 0 300px; max-height:100%; display:flex; flex-direction:column; background:#F5F5F7; border-radius:var(--radius); padding:10px; transition:box-shadow .12s; }
  .tm-col.drop-target{ box-shadow:0 0 0 2px var(--accent) inset; }
  .tm-head{ display:flex; gap:10px; align-items:center; padding:4px 4px 8px; }
  .tm-head .av{ width:38px; height:38px; font-size:.9rem; border:none; }
  .tm-head .nm{ flex:1; min-width:0; }
  .tm-head .nm b{ display:block; font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tm-head .nm span{ display:block; font-size:.64rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tm-stats{ display:flex; flex-wrap:wrap; gap:4px; padding:0 4px 8px; }
  .tm-stats span{ font-size:.62rem; font-weight:600; border-radius:999px; padding:3px 8px; background:#fff; color:var(--ink-soft); }
  .tm-stats span.bad{ background:var(--danger-tint); color:var(--danger); }
  .tm-stats span.rev{ background:#F3EEFD; color:#6D28D9; }
  .tm-stats span.run{ background:var(--ok-tint); color:var(--ok); }
  .tm-body{ overflow-y:auto; display:flex; flex-direction:column; gap:6px; min-height:40px; padding:2px; }
  .tm-card{ background:#fff; border-radius:12px; padding:9px 10px; box-shadow:0 1px 2px rgba(0,0,0,.06); cursor:pointer; border:1px solid transparent; }
  .tm-card:hover{ border-color:var(--accent); }
  .tm-card.overdue{ border-color:#F3C3BB; background:#FFF8F7; }

  .tm-card .tt{ font-size:.74rem; font-weight:600; line-height:1.35; display:flex; gap:6px; }
  .tm-card .mt{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-top:6px; font-size:.62rem; color:var(--ink-soft); }
  .tm-card .st{ display:inline-flex; align-items:center; gap:4px; }
  .tm-card .st i{ width:7px; height:7px; border-radius:50%; }
  .tm-card.dragging{ opacity:.4; }
  .tm-more{ border:none; background:none; font-size:.66rem; color:var(--ink-soft); cursor:pointer; padding:6px; text-align:left; }
  .tm-more:hover{ color:var(--accent); }
  .tm-empty{ font-size:.68rem; color:var(--ink-faint); font-style:italic; padding:10px 6px; text-align:center; }
  /* ===== v2: общая доска, аватарки, статус синхронизации, мобильная шапка ===== */
  .av{ overflow:hidden; }
  .av img{ width:100%; height:100%; object-fit:cover; display:block; }
  .sync-state{ display:inline-flex; align-items:center; gap:6px; font-size:.66rem; font-weight:600; color:var(--ink-soft); border:1px solid var(--line); border-radius:999px; padding:4px 10px; white-space:nowrap; cursor:default; }
  .sync-state i{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
  .sync-state.saving i, .sync-state.loading i{ background:var(--accent); animation:syncp 1s infinite; }
  .sync-state.loading i{ background:var(--ink-faint); }
  .sync-state.offline{ color:var(--warn); border-color:#F3D9B1; background:var(--warn-tint); }
  .sync-state.offline i{ background:var(--warn); }
  @keyframes syncp{ 50%{ opacity:.25; } }
  .onboard{ margin:auto; max-width:560px; text-align:center; padding:40px 24px; border:1.5px dashed var(--line); border-radius:var(--radius); background:#FCFCFD; }
  .onboard h2{ margin:0 0 8px; font-size:1.05rem; text-transform:uppercase; letter-spacing:.02em; }
  .onboard p{ margin:0 0 18px; color:var(--ink-soft); font-size:.8rem; line-height:1.6; }
  .onboard .acts{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .onboard .hint{ margin-top:16px; font-size:.68rem; color:var(--ink-faint); }
  @media (max-width:700px){
    .page-head{ gap:10px; margin-bottom:10px; }
    .page-left{ gap:10px; }
    .page-title{ font-size:1.1rem; }
    .toolbar{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -16px 10px; padding:2px 16px 4px; }
    .toolbar::-webkit-scrollbar{ display:none; }
    .toolbar > *, .toolbar-scroll > *{ flex-shrink:0; }
    .tabs{ scrollbar-width:none; }
    .tabs::-webkit-scrollbar{ display:none; }
    .timer-pill .tp-stage, .timer-pill .tp-title{ display:none; }
    .toolbar .search-wrap{ flex:0 0 180px; }
    .toolbar-scroll{ flex-wrap:nowrap; }
    .kbd-hint, .btn .kbd{ display:none; }
    .tb-spacer{ display:none; }
    #view-seg{ width:100%; }
    #view-seg button{ flex:1; justify-content:center; padding:7px 6px; }
    .sync-state span{ display:none; }
    .sync-state{ padding:6px; }
  }
</style>
</head>

   ЗАДАЧНИК — модуль экосистемы v2 (общая доска команды).
   Модель задачи совместима с planner.html (month-planner-v4):
   id, title, description, start, end, time, timeEnd, category, tag, done, order
   + поля задачника: status, num, assignees, reporter, auditors, tags[], urgent,
     fav, result, plannedMin, actualMs, timerStart, requireReview, checklist[],
     comments[], activity[], files[], parent, links[], createdAt, doneAt
   ===================================================================== */

var STORAGE_KEY = 'task-board-v2';   /* личное: вид, фильтры, уведомления — у каждого своё */
var ME = PE.user.id;                  /* id пользователя из экосистемы */
var IS_ADMIN = PE.isAdmin();
/* команда — все, у кого есть доступ к «Задачам»; имена, должности и аватарки — из профилей */
var TEAM = [], MENTION_RE = /(?!)/g;
function reEsc(x){ return String(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function buildTeam(){
  TEAM = PE.team('tasks').map(function(u){ return { id:u.id, full:PE.fullName(u), short:PE.shortName(u), color:u.color||'#6B7280', role:u.position||'', avatar:u.avatar||'' }; });
  var cnt={}; TEAM.forEach(function(m){ var k=m.short.toLowerCase(); cnt[k]=(cnt[k]||0)+1; });
  TEAM.forEach(function(m){ m.tag = cnt[m.short.toLowerCase()]>1 ? m.full : m.short; });   /* @Имя, а при тёзках — @Имя Фамилия */
  var names=[]; TEAM.forEach(function(m){ names.push(m.full); if(m.tag!==m.full) names.push(m.tag); });
  names.sort(function(a,b){ return b.length-a.length; });
  MENTION_RE = names.length ? new RegExp('@('+names.map(reEsc).join('|')+')(?![а-яёa-z0-9])', 'gi') : /(?!)/g;
}
buildTeam();

};
var CARD_FIELD_LABELS = { date:'Срок', people:'Исполнитель', tags:'Теги', category:'Категория', position:'Должность', recur:'Повтор', comments:'Комментарии', checklist:'Чек-лист', subtasks:'Подзадачи', files:'Вложения', parent:'Родительская задача' };

/* ---------------- иконки ---------------- */
var ICONS = {
  plus:'<path d="M12 5v14M5 12h14"/>',

/* ---------------- утилиты ---------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ var p=k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function today(){ var d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayKey(){ return keyOf(today()); }
function uid(p){ return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function stripHtml(h){ var d=document.createElement('div'); d.innerHTML=h||''; return d.textContent||''; }
function hexA(hex, a){
  var h=(hex||'#888888').replace('#',''); if(h.length===3) h=h.split('').map(function(c){return c+c;}).join('');
  var n=parseInt(h,16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function darken(hex, k){
  var h=(hex||'#888888').replace('#',''); var n=parseInt(h,16);
  var r=Math.round(((n>>16)&255)*k), g=Math.round(((n>>8)&255)*k), b=Math.round((n&255)*k);
  return '#'+[r,g,b].map(function(v){ var s=v.toString(16); return s.length<2?'0'+s:s; }).join('');
}
function fmtSize(b){ if(b<1024) return b+' Б'; if(b<1048576) return (b/1024).toFixed(1)+' КБ'; return (b/1048576).toFixed(1)+' МБ'; }
function plural(n, a, b, c){ var m=n%10, h=n%100; if(m===1&&h!==11) return a; if(m>=2&&m<=4&&(h<10||h>=20)) return b; return c; }
function relTime(ts){
  var s=Math.round((Date.now()-ts)/1000);
  if(s<45) return 'только что';
  var m=Math.round(s/60); if(m<60) return m+' мин назад';
  var h=Math.round(m/60); if(h<24) return h+' '+plural(h,'час','часа','часов')+' назад';
  var d=Math.floor((today()-new Date(new Date(ts).getFullYear(), new Date(ts).getMonth(), new Date(ts).getDate()))/864e5);
  if(d<=1) return 'вчера';
  if(d<30) return d+' '+plural(d,'день','дня','дней')+' назад';
  var dt=new Date(ts); return dt.getDate()+' '+MONTHS_G[dt.getMonth()]+(dt.getFullYear()!==new Date().getFullYear()?' '+dt.getFullYear():'');
}
function fmtDay(k){ var d=parseKey(k); var s=d.getDate()+' '+MONTHS_G[d.getMonth()]; if(d.getFullYear()!==new Date().getFullYear()) s+=' '+d.getFullYear(); return s; }
function fmtMin(m){ if(!m) return '0'; var h=Math.floor(m/60), mm=m%60; return (h? h+' ч':'')+(h&&mm?' ':'')+(mm? mm+' мин':''); }
function fmtMs(ms){ var s=Math.floor(ms/1000); return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60); }
function parseDuration(str){
  str=String(str||'').trim().toLowerCase().replace(',','.'); if(!str) return 0;
  var m=str.match(/^(\d+):(\d{1,2})$/); if(m) return (+m[1])*60+(+m[2]);
  var total=0, found=false;
  str.replace(/(\d+(?:\.\d+)?)\s*(ч|h|час\w*)/g, function(_,n){ total+=parseFloat(n)*60; found=true; });
  str.replace(/(\d+)\s*(м|m|мин\w*)/g, function(_,n){ total+=parseInt(n,10); found=true; });
  if(!found && /^\d+(\.\d+)?$/.test(str)) total=parseFloat(str)*60;
  return Math.round(total);
}

/* =====================================================================
   ОБЩАЯ ДОСКА — синхронизация через Firebase (ядро PE).
   В v1 доска жила в localStorage каждого сотрудника отдельно: задача,
   переданная Лине, у Лины просто не появлялась. Теперь:
     tasks/items/{id}    — задачи (комментарии и история — по id, чтобы
                           одновременные комментарии двух людей не терялись)
     tasks/entries/{id}  — записи времени
     tasks/meta          — колонки, цвета тегов, должности, счётчик номеров
     tasks/timers/{uid}  — идущие таймеры (видно, кто над чем работает)
     taskfiles/{id}      — содержимое вложений (отдельно от доски, грузится по клику)
   Правки уходят по полям: если двое одновременно меняют разные поля одной
   задачи — сохраняются обе правки. Офлайн-правки копятся и уходят позже.
   Личное (вид, фильтры, уведомления) хранится отдельно у каждого.
   ===================================================================== */
var KEYED = { comments:1, activity:1 };
function canon(v){
  if(v===null || v===undefined) return undefined;
  if(Array.isArray(v)){ var a=v.map(canon).filter(function(x){ return x!==undefined; }); return a.length ? a : undefined; }
  if(typeof v==='object'){
    var o={}, any=false;
    Object.keys(v).sort().forEach(function(k){ if(k.charAt(0)==='_') return; var x=canon(v[k]); if(x!==undefined){ o[k]=x; any=true; } });
    return any ? o : undefined;
  }
  return v;
}
function sig(v){ var c=canon(v); return c===undefined ? '' : JSON.stringify(c); }
function listToMap(list){ var m={}; (list||[]).forEach(function(x){ if(x && x.id) m[x.id]=x; }); return m; }
function mapToList(m){ return Object.keys(m||{}).map(function(k){ return m[k]; }).filter(Boolean).sort(function(a,b){ return (a.at||0)-(b.at||0); }); }
function stripFiles(files){ return (files||[]).map(function(f){ var c=Object.assign({}, f); delete c.data; return c; }); }
/* локальная форма задачи → форма для Firebase */
function taskToRemote(t){
  var r=canon(t)||{};
  delete r.done; delete r.tag;
  Object.keys(KEYED).forEach(function(k){ if(t[k]) r[k]=canon(listToMap(t[k].map(function(x){ return x.files ? Object.assign({}, x, { files:stripFiles(x.files) }) : x; }))); });
  if(t.files) r.files=canon(stripFiles(t.files));
  return r;
}
function taskFromRemote(r){
  var t=clone(r);
  Object.keys(KEYED).forEach(function(k){ if(t[k] && !Array.isArray(t[k])) t[k]=mapToList(t[k]); });
  normalize(t);
  return t;
}
/* 3-стороннее слияние: base — последняя известная серверная версия,
   local — наша, remote — новая серверная. Меняем только то, что поменял
   коллега и не трогали мы. */
function merge3(base, local, remote){
  var out=clone(local), keys={};
  [base||{}, local||{}, remote||{}].forEach(function(o){ Object.keys(o).forEach(function(k){ keys[k]=1; }); });
  Object.keys(keys).forEach(function(k){
    if(k.charAt(0)==='_') return;
    if(KEYED[k]){
      var B=listToMap(base&&base[k]), L=listToMap(local[k]), Rm=listToMap(remote[k]), ids={}, res={};
      [B,L,Rm].forEach(function(o){ Object.keys(o).forEach(function(i){ ids[i]=1; }); });
      Object.keys(ids).forEach(function(i){
        var b=sig(B[i]), l=sig(L[i]), r=sig(Rm[i]);
        var pick = (r!==b && l===b) ? Rm[i] : L[i];
        if(pick) res[i]=pick;
      });
      out[k]=mapToList(res);
      return;
    }
    var b=sig(base&&base[k]), l=sig(local[k]), r=sig(remote[k]);
    if(r!==b && l===b){ if(remote[k]===undefined || remote[k]===null) delete out[k]; else out[k]=clone(remote[k]); }
  });
  return out;
}
function diffOps(base, cur){
  var ops={}, keys={};
  [base||{}, cur||{}].forEach(function(o){ Object.keys(o).forEach(function(k){ keys[k]=1; }); });
  Object.keys(keys).forEach(function(k){
    if(k.charAt(0)==='_' || k==='done' || k==='tag') return;
    if(KEYED[k]){
      var B=listToMap(base[k]), C=listToMap(cur[k]), ids={};
      [B,C].forEach(function(o){ Object.keys(o).forEach(function(i){ ids[i]=1; }); });
      Object.keys(ids).forEach(function(i){ if(sig(B[i])!==sig(C[i])) ops[k+'/'+i]= C[i] ? (canon(C[i].files?Object.assign({}, C[i], { files:stripFiles(C[i].files) }):C[i])||null) : null; });
      return;
    }
    if(sig(base[k])!==sig(cur[k])){ var v=k==='files' ? canon(stripFiles(cur[k])) : canon(cur[k]); ops[k]= v===undefined ? null : v; }
  });
  return ops;
}

var CACHE_KEY='task-board-v2-cache';
var Sync={
  ready:{ items:false, entries:false, meta:false, timers:false },
  base:{ items:{}, entries:{}, meta:null, timer:null },   // последние известные серверные версии (локальная форма)
  touched:{}, status:'loading', pushing:false, again:false, retryT:null, renderT:null, drawerStale:false
};
function syncReady(){ return Sync.ready.items && Sync.ready.entries && Sync.ready.meta && Sync.ready.timers; }
function metaOf(s){ var tc={}; Object.keys(s.tagColors||{}).forEach(function(k){ tc[k]=s.tagColors[k]; }); return { columns:s.columns, tagColors:tc, positions:s.positions }; }
function metaToRemote(m){ var r=canon(m)||{}; if(m.tagColors){ var tc={}; Object.keys(m.tagColors).forEach(function(k){ tc[PE.encKey(k)]=m.tagColors[k]; }); r.tagColors=tc; } return r; }
function metaFromRemote(r){ r=r||{}; var tc={}; Object.keys(r.tagColors||{}).forEach(function(k){ tc[PE.decKey(k)]=r.tagColors[k]; }); return { columns:r.columns?arr(r.columns):null, tagColors:tc, positions:r.positions?arr(r.positions):null }; }

function saveCache(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      tasks:state.tasks.map(function(t){ return Object.assign({}, t, { files:stripFiles(t.files), comments:t.comments.map(function(c){ return c.files?Object.assign({}, c, { files:stripFiles(c.files) }):c; }) }); }),
      entries:state.entries, columns:state.columns, tagColors:state.tagColors, positions:state.positions, seq:state.seq, timers:state.timers, timer:state.timer,
      base:Sync.base
    }));
  }catch(e){}
}
function setSyncStatus(s){
  Sync.status=s;
  var el=document.getElementById('sync-state'); if(!el) return;
  var map={ loading:['Загрузка…','Подключаюсь к общей доске'], ok:['Сохранено','Все изменения на сервере — их видит команда'], saving:['Сохраняю…','Отправляю изменения'], offline:['Нет связи','Изменения сохранены на этом устройстве и уйдут на сервер, как только появится интернет'] };
  var m=map[s]||map.ok;
  el.className='sync-state '+s; el.innerHTML='<i></i><span>'+m[0]+'</span>'; el.title=m[1];
}

/* ---------- отправка ---------- */
function uploadFiles(t){
  var jobs=[];
  function up(f){ if(!f || !f.data) return; var data=f.data; jobs.push(PE.fb('PUT','taskfiles/'+f.id, { data:data, name:f.name, type:f.type||'', at:Date.now(), by:ME }).then(function(){ FILE_CACHE[f.id]=data; delete f.data; f.stored=true; })); }
  (t.files||[]).forEach(up);
  (t.comments||[]).forEach(function(c){ (c.files||[]).forEach(up); });
  return jobs;
}
function pushNow(){
  if(!syncReady()){ return; }
  if(Sync.pushing){ Sync.again=true; return; }
  var ops={}, eops={}, fileJobs=[], newTasks=[], now=Date.now(), any=false;
  var cur={};
  state.tasks.forEach(function(t){
    cur[t.id]=t;
    fileJobs=fileJobs.concat(uploadFiles(t));
  });
  if(fileJobs.length){
    Sync.pushing=true; setSyncStatus('saving');
    Promise.all(fileJobs).then(function(){ Sync.pushing=false; pushNow(); }, function(){ Sync.pushing=false; offline(); });
    return;
  }
  state.tasks.forEach(function(t){
    var b=Sync.base.items[t.id];
    if(!b){ t.updatedAt=now; t.updatedBy=ME; ops[t.id]=taskToRemote(t); newTasks.push(t); any=true; return; }
    var d=diffOps(b, t);
    if(Object.keys(d).length){ t.updatedAt=now; t.updatedBy=ME; d.updatedAt=now; d.updatedBy=ME; Object.keys(d).forEach(function(k){ ops[t.id+'/'+k]=d[k]; }); any=true; }
  });
  Object.keys(Sync.base.items).forEach(function(id){ if(!cur[id]){ ops[id]=null; any=true; } });
  var curE={};
  state.entries.forEach(function(e){ curE[e.id]=e; if(sig(Sync.base.entries[e.id])!==sig(e)){ eops[e.id]=canon(e)||null; any=true; } });
  Object.keys(Sync.base.entries).forEach(function(id){ if(!curE[id]){ eops[id]=null; any=true; } });
  var meta=metaOf(state), metaChanged=sig(meta)!==sig(Sync.base.meta);
  var timerChanged=sig(state.timer)!==sig(Sync.base.timer);
  if(metaChanged || timerChanged) any=true;
  if(!any){ saveCache(); if(Sync.status!=='offline') setSyncStatus('ok'); return; }

  Sync.pushing=true; setSyncStatus('saving');
  var snapBase={ items:{}, entries:{} };
  state.tasks.forEach(function(t){ snapBase.items[t.id]=clone(t); });
  state.entries.forEach(function(e){ snapBase.entries[e.id]=clone(e); });
  var metaSnap=clone(meta), timerSnap=clone(state.timer);
  var jobs=[];
  if(Object.keys(ops).length) jobs.push(PE.fb('PATCH','tasks/items', ops));
  if(Object.keys(eops).length) jobs.push(PE.fb('PATCH','tasks/entries', eops));
  if(metaChanged) jobs.push(PE.fb('PATCH','tasks/meta', metaToRemote(meta)));
  if(timerChanged) jobs.push(state.timer ? PE.fb('PUT','tasks/timers/'+ME, canon(state.timer)) : PE.fb('DELETE','tasks/timers/'+ME));
  Promise.all(jobs).then(function(){
    Object.keys(ops).forEach(function(k){ var id=k.split('/')[0]; if(ops[k]===null && k.indexOf('/')<0) delete Sync.base.items[id]; else if(snapBase.items[id]) Sync.base.items[id]=snapBase.items[id]; });
    Object.keys(eops).forEach(function(id){ if(eops[id]===null) delete Sync.base.entries[id]; else Sync.base.entries[id]=snapBase.entries[id]; });
    if(metaChanged) Sync.base.meta=metaSnap;
    if(timerChanged) Sync.base.timer=timerSnap;
    Sync.pushing=false; clearTimeout(Sync.retryT);
    saveCache();
    reserveNums(newTasks);
    if(Sync.again){ Sync.again=false; pushNow(); } else setSyncStatus('ok');
  }, function(){ Sync.pushing=false; offline(); });
}
function offline(){
  setSyncStatus('offline'); saveCache();
  clearTimeout(Sync.retryT); Sync.retryT=setTimeout(pushNow, 8000);
}
window.addEventListener('online', function(){ pushNow(); });

/* номера задач уникальны на всю команду: резервируем через транзакцию */
function reserveNums(list){
  list=list.filter(function(t){ return !t.numOk && task(t.id); }).sort(function(a,b){ return a.num-b.num; });
  if(!list.length) return;
  var t=list.shift();
  var want=t.num;
  PE.tx('tasks/meta/seq', function(cur){ cur=+cur||0; return cur<want ? want : cur+1; }).then(function(r){
    var got=r.value;
    if(got!==t.num){
      var old=t.num; t.num=got; log(t,'text',{ text:'Номер изменён с #'+old+' на #'+got+' — одновременно с вами кто-то создал задачу с тем же номером' });
      if(openId===t.id){ try{ history.replaceState(null,'','#task-'+got); }catch(e){} }
      toast('Задаче «'+t.title+'» присвоен номер #'+got);
    }
    state.seq=Math.max(state.seq, got); t.numOk=true;
    save(); renderMain(); if(openId===t.id) renderDrawer();
    reserveNums(list);
  }).catch(function(){ /* повторим при следующей отправке */ });
}

/* ---------- приём ---------- */
function onRemoteItems(tree){
  tree=tree||{};
  var changed=false;
  Object.keys(tree).forEach(function(id){
    var r=taskFromRemote(tree[id]), b=Sync.base.items[id], l=task(id);
    if(l===draft) l=null;
    if(b && sig(r)===sig(b)) return;
    if(!l){
      /* была у нас и пропала локально — это наше удаление, оно уйдёт при отправке */
      if(b){ Sync.base.items[id]=clone(r); return; }
      state.tasks.push(r); Sync.base.items[id]=clone(r); Sync.touched[id]=Date.now(); changed=true;
      return;
    }
    var merged=merge3(b, l, r);
    Sync.base.items[id]=clone(r);
    if(sig(merged)!==sig(l)){
      Object.keys(l).forEach(function(k){ if(k.charAt(0)!=='_' && !(k in merged)) delete l[k]; });
      Object.assign(l, merged); normalize(l);
      Sync.touched[id]=Date.now(); changed=true;
      if(openId===id) Sync.drawerStale=true;
    }
  });
  Object.keys(Sync.base.items).forEach(function(id){
    if(tree[id]) return;
    var l=task(id), b=Sync.base.items[id];
    delete Sync.base.items[id];
    if(l && sig(l)===sig(b)){ state.tasks=state.tasks.filter(function(x){ return x.id!==id; }); if(openId===id && !draft) closeDrawer(); if(state.timer && state.timer.taskId===id) stopTimer(); changed=true; }
  });
  state.seq=Math.max(state.seq, state.tasks.reduce(function(m,t){ return Math.max(m, t.num||0); }, 0));
  Sync.ready.items=true;
  afterRemote(changed);
}
function onRemoteEntries(tree){
  tree=tree||{};
  var changed=false, idx={};
  state.entries.forEach(function(e, i){ idx[e.id]=i; });
  Object.keys(tree).forEach(function(id){
    var r=clone(tree[id]), b=Sync.base.entries[id], i=idx[id];
    if(r.owner) r.owner=legacyUid(r.owner);
    if(b && sig(r)===sig(b)) return;
    if(i==null){ state.entries.push(r); }
    else if(!b || sig(state.entries[i])===sig(b)){ state.entries[i]=r; }
    Sync.base.entries[id]=clone(r); Sync.touched['e:'+id]=Date.now(); changed=true;
  });
  Object.keys(Sync.base.entries).forEach(function(id){
    if(tree[id]) return;
    var i=idx[id], b=Sync.base.entries[id]; delete Sync.base.entries[id];
    if(i!=null && sig(state.entries[i])===sig(b)){ state.entries=state.entries.filter(function(e){ return e.id!==id; }); changed=true; }
  });
  Sync.ready.entries=true;
  afterRemote(changed);
}
function onRemoteMeta(tree){
  var r=metaFromRemote(tree), b=Sync.base.meta, l=metaOf(state), changed=false;
  if(sig(r)!==sig(b)){
    var m=merge3(b||{}, l, r);
    if(m.columns) state.columns=m.columns;
    state.tagColors=m.tagColors||{};
    if(m.positions) state.positions=m.positions;
    Sync.base.meta=clone(r); changed=true;
  }
  if(tree && tree.seq) state.seq=Math.max(state.seq, +tree.seq||0);
  Sync.ready.meta=true;
  afterRemote(changed);
}
function onRemoteTimers(tree){
  tree=tree||{};
  var mine=tree[ME]||null, changed=false;
  if(sig(mine)!==sig(Sync.base.timer)){
    if(sig(state.timer)===sig(Sync.base.timer)){ state.timer=mine?clone(mine):null; changed=true; }
    Sync.base.timer=mine?clone(mine):null;
  }
  var others={}; Object.keys(tree).forEach(function(k){ if(k!==ME) others[k]=tree[k]; });
  if(sig(others)!==sig(state.timers)){ state.timers=others; changed=true; }
  Sync.ready.timers=true;
  afterRemote(changed);
}
function afterRemote(changed){
  if(!syncReady()) return;
  if(Sync.status==='loading') setSyncStatus('ok');
  if(!Sync.shown){ Sync.shown=true; changed=true; }   // первая загрузка — перерисовать в любом случае
  pushNow();                      // наши несинхронизированные правки (в т.ч. офлайн)
  if(!changed){ saveCache(); return; }
  clearTimeout(Sync.renderT);
  Sync.renderT=setTimeout(function(){
    saveCache();
    renderMain();
    refreshDrawerIfSafe();
    checkReminders();
  }, 120);
}
function drawerBusy(){
  var a=document.activeElement, root=document.getElementById('drawer-root');
  return !!(a && root && root.contains(a) && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.isContentEditable));
}
function refreshDrawerIfSafe(){
  if(!openId || draft) return;
  if(!task(openId)){ closeDrawer(); toast('Задачу удалили'); return; }
  if(!Sync.drawerStale) return;
  if(drawerBusy() || pops.length) return;          // не мешаем печатать — обновим, когда уйдёт фокус
  Sync.drawerStale=false; renderDrawer();
}
document.addEventListener('focusout', function(){ setTimeout(function(){ if(Sync.drawerStale) refreshDrawerIfSafe(); }, 200); });

/* одна подписка на всю доску (а не четыре): у браузера лимит 6 соединений на сервер */
function startSync(){
  PE.stream('tasks', function(tree, ev){
    tree=tree||{};
    var seg=(ev && ev.path && ev.path!=='/') ? ev.path.split('/')[1] : '';
    if(!seg || seg==='items') onRemoteItems(tree.items);
    if(!seg || seg==='entries') onRemoteEntries(tree.entries);
    if(!seg || seg==='meta') onRemoteMeta(tree.meta);
    if(!seg || seg==='timers') onRemoteTimers(tree.timers);
  });
}

function legacyUid(name){

var state = load();
var draft = null;            // задача в режиме создания (ещё не в state)
var openId = null;           // открытая в панели задача
var drawerWide = false;
var search = '';
var discTab = 'all';
var editingCommentId = null;
var quickAddCol = null;

function load(){
  var p=null, c=null;
  try{ p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); }catch(e){}
  try{ c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
  if(c && c.base) Sync.base=c.base;
  var s=Object.assign({ tasks:[], entries:[] }, c||{});
  delete s.base;
  if(p){ s.settings=p.settings; s.savedFilters=p.savedFilters; s.notifications=p.notifications; s.notified=p.notified; }
  if(s.timer===undefined) s.timer=Sync.base.timer||null;
  return hydrate(s);
}
function hydrate(s){
  s.tasks = arr(s.tasks); s.entries = arr(s.entries);
  s.entries.forEach(function(e){ if(e.owner) e.owner=legacyUid(e.owner); });
  if(s.columns) s.columns = arr(s.columns);
  if(s.positions) s.positions = arr(s.positions);
  if(s.savedFilters) s.savedFilters = arr(s.savedFilters);
  s.columns = s.columns || clone(DEFAULT_COLUMNS);
  s.tagColors = s.tagColors || {};
  s.savedFilters = s.savedFilters || [];
  s.positions = s.positions || DEFAULT_POSITIONS.slice();
  s.notifications = s.notifications || [];
  s.notified = s.notified || {};
  s.settings = Object.assign(clone(DEFAULT_SETTINGS), s.settings||{});
  s.settings.cardFields = Object.assign(clone(DEFAULT_SETTINGS.cardFields), s.settings.cardFields||{});
  s.settings.notif = Object.assign(clone(DEFAULT_SETTINGS.notif), s.settings.notif||{});
  s.settings.panelFields = Object.assign(clone(DEFAULT_SETTINGS.panelFields), s.settings.panelFields||{});
  s.seq = s.seq || s.tasks.reduce(function(m,t){ return Math.max(m, t.num||0); }, 0);
  s.entries = s.entries || [];
  s.timer = s.timer || null;
  s.timers = s.timers || {};
  if(!s.settings.notifSince) s.settings.notifSince = (PE.user && (PE.user.approvedAt || PE.user.createdAt)) || Date.now();   /* уведомляем только о том, что случилось после первого входа */
  s.settings.colPrefs = s.settings.colPrefs || {};
  s.tasks.forEach(normalize);
  // перенос старого «фактического времени» (одна сумма) в записи учёта времени
  s.tasks.forEach(function(t){
    if(t.actualMs>0 && !s.entries.some(function(e){ return e.taskId===t.id; })){
      var d=new Date(t.createdAt||Date.now());
      s.entries.push({ id:uid('w'), taskId:t.id, title:t.title, tag:t.tags[0]||'', owner:t.assignees[0]||ME, stage:'Работа', start:d.getTime(), end:d.getTime()+t.actualMs, seconds:Math.round(t.actualMs/1000), date:keyOf(d), manual:true, note:'перенесено из прежнего таймера' });
    }
    if(t.timerStart && !s.timer) s.timer={ taskId:t.id, stage:'Работа', since:t.timerStart, owner:ME, paused:false };
    delete t.actualMs; delete t.timerStart;
  });
  return s;
}
/* Firebase хранит массивы как объекты {0:…,1:…}, а пустые — выбрасывает. Приводим обратно. */
function arr(v){
  if(Array.isArray(v)) return v.filter(function(x){ return x!=null; });
  if(v && typeof v==='object') return Object.keys(v).sort(function(a,b){ return (+a)-(+b); }).map(function(k){ return v[k]; }).filter(function(x){ return x!=null; });
  return [];
}
function normalize(t){
  t.assignees=arr(t.assignees).map(legacyUid); if(t.reporter) t.reporter=legacyUid(t.reporter);
  t.auditors=arr(t.auditors).map(legacyUid); t.tags=arr(t.tags); t.checklist=arr(t.checklist);
  t.comments=arr(t.comments); t.activity=arr(t.activity); t.files=arr(t.files); t.links=arr(t.links);
  t.comments.forEach(function(c){ c.files=arr(c.files); });
  if(t.recur && t.recur.days) t.recur.days=arr(t.recur.days);
  t.status=t.status||(t.done?'done':'new'); t.done = t.status==='done';
  t.category=t.category||'other'; t.description=t.description||''; t.result=t.result||'';
  t.plannedMin=t.plannedMin||0;
  if(t.position==null) t.position = t.assignees[0] ? (member(t.assignees[0]).role||'') : '';
  t.recur=t.recur||null; t.remind=t.remind||'default';
  t.tag = t.tags[0]||'';          // совместимость с планером
  if(t.order==null) t.order=0;
}
var saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ settings:state.settings, savedFilters:state.savedFilters, notifications:state.notifications, notified:state.notified })); }catch(e){}
    pushNow();

function task(id){ for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i]; return draft && draft.id===id ? draft : null; }
function taskByNum(n){ for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].num===n) return state.tasks[i]; return null; }
function col(id){ for(var i=0;i<state.columns.length;i++) if(state.columns[i].id===id) return state.columns[i]; return state.columns[0]; }
function cat(id){ for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].id===id) return CATEGORIES[i]; return CATEGORIES[CATEGORIES.length-1]; }
function member(id){
  for(var i=0;i<TEAM.length;i++) if(TEAM[i].id===id) return TEAM[i];
  var u=PE.userById(id) || PE.userById(legacyUid(id));   /* нет доступа к задачам / удалён / старое имя из v1 */
  if(u) return { id:u.id, full:PE.fullName(u)+(u.status==='deleted'?' (удалён)':''), short:PE.shortName(u), tag:PE.shortName(u), color:u.color||'#9A9CA3', role:u.position||'', avatar:u.avatar||'' };
  return { id:id, full:id||'—', short:id||'—', tag:id||'', color:'#9A9CA3', role:'' };
}
/* «упомянул / упомянула» — по полу из профиля */
function gv(id, m, f){ var u=PE.userById(id)||PE.userById(legacyUid(id)); return u && u.gender==='f' ? f : m; }
function cp(c){ var P=state.settings.colPrefs||(state.settings.colPrefs={}); return P[c.id]||(P[c.id]={}); }   /* свёрнута/группировка/сортировка колонки — личная настройка */
function colDot(c){ return c.dot || darken(c.color, .55); }
function tagColor(name){
  if(!state.tagColors[name]){ state.tagColors[name] = TAG_COLORS[Object.keys(state.tagColors).length % TAG_COLORS.length]; }
  return state.tagColors[name];
}
function allTags(){ var m={}; Object.keys(state.tagColors).forEach(function(k){ m[k]=1; }); state.tasks.forEach(function(t){ t.tags.forEach(function(g){ m[g]=1; }); }); return Object.keys(m).sort(); }
function children(id){ return state.tasks.filter(function(t){ return t.parent===id; }); }
function isDone(t){ return t.status==='done'; }
function minOrder(){ return state.tasks.reduce(function(m,t){ return Math.min(m,t.order); }, 0); }
function maxOrder(){ return state.tasks.reduce(function(m,t){ return Math.max(m,t.order); }, 0); }

/* ---------------- сроки ---------------- */
function dueDate(t){
  var k=t.end||t.start; if(!k) return null;
  var d=parseKey(k); var tm = (t.end ? (t.timeEnd||'') : '') || t.time || '';
  if(tm){ var p=tm.split(':'); d.setHours(+p[0], +p[1]); } else d.setHours(23,59,59);
  return d;
}
function dueState(t){
  if(!t.end && !t.start) return 'none';
  if(isDone(t)) return 'done';
  var d=dueDate(t), now=new Date();
  if(d<now) return t.status==='postponed' ? 'paused' : 'overdue';   // отложенные не «горят»
  var k=t.end||t.start;
  if(k===todayKey()) return 'today';
  if(d-now < 2*864e5) return 'soon';
  return 'later';
}
function dateLabel(t){
  var s=t.start, e=t.end;
  if(!s && !e) return '';
  var ts=t.time, te=t.timeEnd;
  if(s && e && s!==e) return fmtDay(s)+(ts?' '+ts:'')+' – '+fmtDay(e)+(te?' '+te:'');
  var k=e||s;
  if(ts && te) return fmtDay(k)+', '+ts+' – '+te;
  if(ts||te) return fmtDay(k)+', '+(ts||te);
  var d=parseKey(k), tk=today();
  if(k===keyOf(tk)) return 'Сегодня';
  if(k===keyOf(addDays(tk,1))) return 'Завтра';
  if(k===keyOf(addDays(tk,-1))) return 'Вчера';
  return fmtDay(k);
}

/* ---------------- журнал ---------------- */
function log(t, type, data){

/* ---------------- операции ---------------- */
function persist(){ save(); renderMain(); }

function setStatus(t, status, silent){
  if(t.status===status) return;
  var from=t.status;
  if(status==='done'){ t.prevStatus = from; t.doneAt=Date.now(); if(state.timer && state.timer.taskId===t.id) stopTimer(); if(t.recur && !t.recurNext && t!==draft) spawnNext(t); }
  else if(from==='done'){ t.doneAt=null; }
  if(from==='postponed' && status!=='postponed'){ if(t.postpone) log(t,'text',{ text:'Возвращена из отложенных' }); t.postpone=null; }
  t.status=status; t.done = status==='done';
  if(!silent) log(t,'status',{ from:from, to:status });
}
/* «Выполнить»: если нужна проверка и я не постановщик — уходит на проверку */
function complete(t){
  var snap=snapshot();
  var msg;
  if(t.requireReview && t.reporter!==ME && t.status!=='review'){
    setStatus(t,'review'); msg='Отправлено на проверку: '+member(t.reporter).full;
  } else {
    setStatus(t,'done'); t.order=minOrder()-1; msg='Задача завершена'+spawnNote();
  }
  persist(); if(openId===t.id) renderDrawer();
  toast(msg, 'Отменить', function(){ restore(snap); });
}
function reopen(t){
  var snap=snapshot();
  var back = (t.prevStatus && t.prevStatus!=='done') ? t.prevStatus : 'progress';
  setStatus(t, back); persist(); if(openId===t.id) renderDrawer();
  toast('Возвращена в «'+col(back).name+'»', 'Отменить', function(){ restore(snap); });
}
/* ---------------- повторяющиеся задачи ----------------
   recur = { freq:'day'|'week'|'month', interval:N, days:[1..7] (Пн=1), until:'YYYY-MM-DD'|'' }
   Следующая задача серии создаётся в момент выполнения текущей — так серия не плодит
   дубли, если предыдущую не успели закрыть. */
var WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function isoDow(d){ return (d.getDay()+6)%7+1; }
function mondayOf(d){ return addDays(d, -(isoDow(d)-1)); }
function recurText(r){
  if(!r) return 'Не повторяется';
  var n=r.interval||1, s;
  if(r.freq==='day') s = n===1 ? 'Каждый день' : 'Каждые '+n+' '+plural(n,'день','дня','дней');
  else if(r.freq==='week'){
    var d=(r.days||[]).slice().sort();
    if(n===1 && d.join()==='1,2,3,4,5') s='По будням';
    else s=(n===1?'Каждую неделю':'Каждые '+n+' '+plural(n,'неделю','недели','недель'))+(d.length?': '+d.map(function(x){ return WD[x-1]; }).join(', '):'');
  }

var pops=[], lastToggled={ el:null, at:0 };

  if(!opts.stack) closePops();
  var el=document.createElement('div'); el.className='pop'+(opts.cls?' '+opts.cls:'');
  if(opts.width) el.style.width=opts.width+'px';
  document.body.appendChild(el);
  var api={ el:el, anchor:anchor, close:function(){ closePop(api); }, reposition:function(){ place(el, anchor, opts); } };
  pops.push(api);

  place(el, anchor, opts);

  return api;
}
function place(el, anchor, opts){

  if(r.width===0 && r.height===0 && opts._rect) r=opts._rect;
  opts._rect=r;
  var w=el.offsetWidth, h=el.offsetHeight, vw=window.innerWidth, vh=window.innerHeight;
  var left = opts.alignRight ? r.right-w : r.left;
  if(left+w>vw-10) left=vw-w-10; if(left<10) left=10;
  var top = r.bottom+6;
  if(top+h>vh-10){ top = r.top-h-6 >= 10 ? r.top-h-6 : Math.max(10, vh-h-10); }
  el.style.left=left+'px'; el.style.top=top+'px';
}

  if(!pops.length) return;
  for(var i=pops.length-1;i>=0;i--){
    if(pops[i].el.contains(e.target)) { if(i<pops.length-1) closePop(pops[i+1]); return; }
    if(pops[i].anchor && pops[i].anchor.contains && pops[i].anchor.contains(e.target)) { lastToggled={ el:pops[i].anchor, at:Date.now() }; closePop(pops[i]); return; }

}, true);

var toastTimer=null;
function toast(msg, actionLabel, fn, ms){
  var root=$('#toast-root'); clearTimeout(toastTimer);
  root.innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(actionLabel?'<button data-a>'+esc(actionLabel)+'</button>':'')+'<button class="tx" data-x title="Закрыть">'+I('x',13)+'</button></div>';

}

function columnTasks(c){

}
function onboardHtml(){
  if(Sync.status==='loading' && !syncReady()) return '<div class="onboard" style="border-style:solid"><h2>Загружаю доску…</h2><p>Подключаюсь к общей доске команды.</p></div>';
  return '<div class="onboard"><h2>Общая доска пока пуста</h2><p>Здесь вся команда видит задачи друг друга: ставьте задачи коллегам, отправляйте на проверку, следите за сроками и временем. Всё сохраняется на сервере и доступно с любого устройства.</p>'+
    '<div class="acts"><button class="btn btn-primary" data-ob="new">'+I('plus',12,2.4)+'Первая задача</button></div>'+
    '<div class="hint">Быстро: клавиша N — новая задача. В названии понимаются @имя, #тег, ! (срочно), «завтра».</div></div>';

function renderBoard(){
  var board=$('#board');
  if(!state.tasks.length){ board.innerHTML=onboardHtml(); return; }
  var scrolls={}; $$('.col', board).forEach(function(el){ var b=el.querySelector('.col-body'); if(b) scrolls[el.dataset.col]=b.scrollTop; });
  var html='';
  var totalVisible=0;
  visibleColumns().forEach(function(c){
    var list=columnTasks(c); totalVisible+=list.length;
    var style='--col-bg:'+c.color;
    if(cp(c).collapsed){
      html+='<div class="col collapsed" data-col="'+c.id+'" style="'+style+'" title="Развернуть «'+esc(c.name)+'»"><div class="col-head"><span class="col-count">'+list.length+'</span><span class="col-title">'+esc(c.name)+'</span></div></div>';
      return;
    }
    var sort=cp(c).sort||state.settings.sort, group=cp(c).group||state.settings.group;
    list=sortTasks(list, sort);
    var total=list.length, cut=false;
    if(c.id==='done'){
      list=list.slice().sort(function(a,b){ return sort==='manual' ? (b.doneAt||0)-(a.doneAt||0) : 0; });
      if(!showAllDone && list.length>state.settings.doneLimit){ list=list.slice(0, state.settings.doneLimit); cut=true; }
    }
    var over = c.wip && total>c.wip;
    html+='<section class="col" data-col="'+c.id+'" style="'+style+'" aria-label="'+esc(c.name)+'">'+
      '<div class="col-head">'+
        '<span class="col-title" title="'+esc(c.name)+'">'+esc(c.name)+'</span>'+
        '<span class="col-count'+(over?' over':'')+'" title="'+(c.wip?'Лимит задач в работе: '+c.wip:'')+'">'+total+(c.wip?' / '+c.wip:'')+'</span>'+
        '<button class="icon-btn col-grp'+(group!=='none'?' on':'')+'" data-col-group="'+c.id+'" title="'+(group!=='none'?'Группировка: '+GROUPS[group].toLowerCase()+' — нажмите, чтобы изменить':'Сгруппировать задачи в колонке')+'">'+I('group',13)+'</button>'+
        '<span class="grow"></span>'+
        '<button class="icon-btn" data-col-new="'+c.id+'" title="Новая задача в «'+esc(c.name)+'» (с карточкой)">'+I('plus',15,2)+'</button>'+
        '<button class="icon-btn" data-col-menu="'+c.id+'" title="Настройки колонки">'+I('dots',15)+'</button>'+
      '</div>'+
      '<div class="col-body" data-body="'+c.id+'">';
    if(!list.length && quickAddCol!==c.id){
      html+='<div class="col-empty">'+(filters().length||search ? 'Нет задач по фильтру' : 'Пусто')+'</div>';
    }
    if(group==='none'){
      list.forEach(function(t){ html+=cardHtml(t,c); });
    } else {
      var groups=[], map={};
      list.forEach(function(t){ var k=groupKeyLabel(t, group); if(!map[k[0]]){ map[k[0]]={ key:k[0], name:k[1], color:k[2], items:[] }; groups.push(map[k[0]]); } map[k[0]].items.push(t); });
      groups.forEach(function(g){
        var gk=c.id+'|'+group+'|'+g.key, closed=!!state.settings.collapsedGroups[gk];
        html+='<div class="group-head'+(closed?' closed':'')+'" data-group="'+esc(gk)+'"><span class="chev">'+I('chev',12,2)+'</span>'+
          (g.color?'<i style="width:7px;height:7px;border-radius:50%;background:'+g.color+'"></i>':'')+esc(g.name)+' <span class="n">'+g.items.length+'</span></div>';
        if(!closed) g.items.forEach(function(t){ html+=cardHtml(t,c); });
      });
    }
    if(cut) html+='<button class="col-more" data-show-done>Показать все '+total+'</button>';
    else if(c.id==='done' && showAllDone && total>state.settings.doneLimit) html+='<button class="col-more" data-show-done>Свернуть до '+state.settings.doneLimit+'</button>';
    html+='</div>';
    if(quickAddCol===c.id){
      html+='<div class="quick-add"><textarea rows="1" id="qa-input" placeholder="Название задачи…"></textarea>'+
        '<div class="qa-hint">Enter — создать · Esc — закрыть · <b>@имя</b> <b>#тег</b> <b>!</b> срочно, <b>завтра</b></div></div>';
    } else if(c.id!=='done'){
      html+='<button class="col-add" data-quick-add="'+c.id+'">'+I('plus',13,2)+'Добавить задачу</button>';
    }
    html+='</section>';
  });
  board.innerHTML=html;
  $$('.col', board).forEach(function(el){ var b=el.querySelector('.col-body'); if(b && scrolls[el.dataset.col]!=null) b.scrollTop=scrolls[el.dataset.col]; });
  var qa=$('#qa-input'); if(qa){ qa.focus(); qa.scrollIntoView({ block:'nearest' }); }
}

function cardHtml(t, c){
  var F=state.settings.cardFields, ds=dueState(t);
  var cl=t.checklist, clDone=cl.filter(function(i){ return i.done; }).length;
  var subs=children(t.id), subsDone=subs.filter(isDone).length;
  var parent=t.parent ? task(t.parent) : null;
  var blocked=isBlocked(t);
  var h='<article class="card'+(isDone(t)?' is-done':'')+(ds==='overdue'?' is-overdue':'')+(isRunning(t)?' is-running':isPaused(t)?' is-paused':'')+(search && matchesSearch(t, search.trim()) && search.trim().length>1?' is-hit':'')+'" draggable="true" data-id="'+t.id+'" tabindex="0">';
  h+='<button class="card-check" data-check="'+t.id+'" title="'+(isDone(t)?'Вернуть в работу':(t.requireReview&&t.reporter!==ME?'Выполнить и отправить на проверку':'Отметить выполненной'))+'">'+I(isDone(t)?'back':'check',13,2.4)+'</button>';
  if(!isDone(t)) h+='<button class="card-play'+(isRunning(t)?' on':'')+'" data-tplay="'+t.id+'" title="'+(isRunning(t)?'Пауза':isPaused(t)?'Продолжить таймер':'Запустить таймер')+'">'+I(isRunning(t)?'pause':'play',11,2)+'</button>';
  if(F.parent && parent) h+='<div class="card-parent">↑ #'+parent.num+' '+esc(parent.title)+'</div>';
  h+='<div class="card-title">'+(t.urgent?'<span class="urg" title="Срочная">'+I('urgent',14,2)+'</span>':'')+(blocked?'<span style="color:var(--warn);margin-top:2px" title="Ждёт другую задачу">'+I('block',13,2)+'</span>':'')+'<span>'+esc(t.title||'Без названия')+'</span></div>';
  var row='';
  if(F.date && (t.start||t.end)) row+='<span class="date-chip '+(ds==='overdue'?'overdue':ds==='today'?'today':ds==='soon'?'soon':'')+'">'+I('cal',11)+esc(dateLabel(t))+'</span>';
  if(F.tags) t.tags.forEach(function(g){ row+=tagHtml(g); });
  if(F.position && t.position) row+='<span class="pos-pill">'+I('briefcase',11)+esc(t.position)+'</span>';
  if(F.category && t.category!=='other'){ var ct=cat(t.category); row+='<span class="cat-pill"><i style="background:'+ct.color+'"></i>'+esc(ct.name)+'</span>'; }
  if(row) h+='<div class="card-row">'+row+'</div>';
  var foot='';
  if(F.comments && t.comments.length) foot+='<span class="m" title="Комментарии">'+I('chat',12)+t.comments.length+'</span>';
  if(F.checklist && cl.length) foot+='<span class="m'+(clDone===cl.length?' full':'')+'" title="Чек-лист">'+I('list',12)+clDone+'/'+cl.length+'</span>';
  if(F.subtasks && subs.length) foot+='<span class="m'+(subsDone===subs.length?' full':'')+'" title="Подзадачи">'+I('sub',12)+subsDone+'/'+subs.length+'</span>';
  if(F.files && t.files.length) foot+='<span class="m" title="Вложения">'+I('clip',12)+t.files.length+'</span>';
  if(F.recur && t.recur) foot+='<span class="m" title="'+esc(recurText(t.recur))+'">'+I('repeat',12)+'</span>';
  if(isRunning(t)) foot+='<span class="m live-rec" title="Идёт запись: '+esc(state.timer.stage)+'"><span class="rec-dot"></span><span data-live-card>'+fmtClock(sessionMs())+'</span></span>';
  else if(isPaused(t)) foot+='<span class="m" style="color:var(--warn)" title="Таймер на паузе">'+I('pause',11)+'пауза</span>';
  else { var tms=timerMs(t); if(tms>=60000 && F.checklist) foot+='<span class="m" title="Записано времени'+(t.plannedMin?' из '+fmtMin(t.plannedMin):'')+'">'+I('timer',12)+fmtDur(tms)+'</span>'; }
  var people='';
  if(F.people){
    var showReporter = t.reporter && t.assignees.indexOf(t.reporter)<0;
    var others = t.assignees.filter(function(a){ return a!==ME; });
    // «свои» задачи без делегирования не шумят аватаркой
    if(showReporter || others.length || t.assignees.length>1){
      people='<span class="avs">'+(showReporter? avatar(t.reporter)+'<span class="arrow">›</span>' : '')+t.assignees.slice(0,3).map(function(a){ return avatar(a); }).join('')+'</span>';
    }
  }
  if(foot||people) h+='<div class="card-foot">'+foot+'<span class="grow"></span>'+people+'</div>';
  if(t.status==='postponed'){
    if(t.postpone){
      var until=t.postpone.until, due=until && until<=todayKey();
      h+='<div class="pp-note"><span class="pp-ico">'+I('pause',11)+'</span><span><b>Отложено:</b> '+esc(t.postpone.reason)+
        (until?'<span class="pp-until'+(due?' due':'')+'">'+(due?'↩ Пора вернуться (с '+fmtDay(until)+')':'↩ Вернуться '+fmtDay(until))+'</span>':'')+'</span></div>';
    } else h+='<div class="pp-note missing" data-pp-add="'+t.id+'"><span class="pp-ico" style="color:inherit">'+I('pause',11)+'</span><span>Причина не указана — добавить</span></div>';
  }
  if(t.status==='review' && (t.reporter===ME || t.auditors.indexOf(ME)>=0))
    h+='<div class="review-actions"><button class="ok" data-accept="'+t.id+'">✓ Принять</button><button class="back" data-return="'+t.id+'">↺ Вернуть</button></div>';
  h+='</article>';
  return h;
}

/* перетаскивание в режиме списка: порядок внутри статуса + смена статуса */
var lDragId=null;
function lClear(){ $$('#list-wrap .drop-before, #list-wrap .drop-after, #list-wrap .drop-into').forEach(function(r){ r.classList.remove('drop-before','drop-after','drop-into'); }); }
function bindListDnD(){
  var wrap=$('#list-wrap');
  wrap.addEventListener('dragstart', function(e){
    var r=e.target.closest && e.target.closest('tr.row'); if(!r) return;
    lDragId=r.dataset.id; r.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain', lDragId); }catch(_){}
  });
  wrap.addEventListener('dragend', function(){ lDragId=null; lClear(); $$('#list-wrap tr.dragging').forEach(function(r){ r.classList.remove('dragging'); }); });
  wrap.addEventListener('dragover', function(e){
    if(!lDragId) return;
    var r=e.target.closest('tr.row, tr.grp, tr.lempty'); if(!r) return;
    e.preventDefault(); lClear();
    if(r.classList.contains('row')){
      if(r.dataset.id===lDragId) return;
      var rc=r.getBoundingClientRect(); r.classList.add(e.clientY<rc.top+rc.height/2 ? 'drop-before' : 'drop-after');
    } else r.classList.add('drop-into');
  });
  wrap.addEventListener('drop', function(e){
    if(!lDragId) return;
    var r=e.target.closest('tr.row, tr.grp, tr.lempty'); if(!r){ lClear(); return; }
    e.preventDefault();
    var t=task(lDragId), snap=snapshot(), from=t.status, msg=null, target, prev=null, next=null;
    if(r.classList.contains('row')){
      if(r.dataset.id===lDragId){ lClear(); return; }
      target=r.dataset.status;
      var rows=$$('#list-wrap tr.row[data-status="'+target+'"]').filter(function(x){ return x.dataset.id!==lDragId; });
      var idx=rows.indexOf(r), before=r.classList.contains('drop-before');
      prev = before ? rows[idx-1] : r; next = before ? r : rows[idx+1];
      prev = prev ? task(prev.dataset.id) : null; next = next ? task(next.dataset.id) : null;
    } else {
      target = r.dataset.lgrp || r.dataset.lempty;
      var first=$('#list-wrap tr.row[data-status="'+target+'"]');
      next = first && first.dataset.id!==lDragId ? task(first.dataset.id) : null;
    }
    lClear();
    if(target==='postponed' && from!=='postponed'){
      askPostpone(t, function(){ t.order=minOrder()-1; persist(); toast('Отложено: '+t.postpone.reason, 'Отменить', function(){ restore(snap); }); });
      return;
    }
    var c=col(target), sort=cp(c).sort||state.settings.sort;
    if(sort==='manual' && target!=='done'){
      if(prev && next) t.order=(prev.order+next.order)/2; else if(prev) t.order=prev.order+1; else if(next) t.order=next.order-1;
    } else if(from===target) msg='Включена сортировка «'+SORTS[sort]+'» — ручной порядок не применяется';
    if(from!==target){
      if(target==='done' && t.requireReview && t.reporter!==ME){ setStatus(t,'review'); msg='Нужна проверка — задача ушла в «'+col('review').name+'»'; }
      else { setStatus(t, target); if(target==='done'){ t.order=minOrder()-1; msg='Перемещено в «'+c.name+'»'+spawnNote(); } }
    }
    persist();
    if(from!==t.status) toast(msg || ('Перемещено в «'+col(t.status).name+'»'), 'Отменить', function(){ restore(snap); });
    else if(msg) toast(msg);
  });
}
