ят:</p>\n<ul><li>Да, у нас, конечно, дорого. — Да, вы правы, цены сейчас завышены. — Понимаю вас, у конкурентов получается выгоднее.</li>\n</ul>\nВместо этого возьмите какую-то часть высказывания, которая не связана лично с вами или с вашим продуктом, а представляет собой неоспоримый факт, и согласитесь с этим.\n<p>Когда клиент услышит, что вы его в чем-то поддерживаете, он с большей охотой и доверием примет аргументы, которые вы приведете.</p>\n<p>Например, покупатель говорит: — У вас завышенные цены, у конкурентов на 10 тысяч дешевле.</p>\n<p>Вариант ответа номер один: — 10 тысяч рублей — это существенная разница, согласен с Вами. При этом...</p>\n<p>Факт, с которым вы согласились, никак не ухудшает ваше положение, вы лишь подтвердили, что 10 тысяч рублей — это существенная разница.</p>\n<p>Или: — Понимаю, вопрос цены важен при выборе товара. Именно поэтому... Такую тактику я называю обезоруживающим присоединением.</p>\n<p>Проговаривая переживания покупателя, вы проявляете эмпатию. И когда следом звучит «при этом» или «именно поэтому», клиент готов уделить внимание. Такого эффекта вы должны добиться — когда вы становитесь не просто продавцом, а человеком, мнение которого интересно выслушать.</p>\n<p>На этом этапе многие совершают большую ошибку: используют союзы противопоставления «но» и «однако», которые сразу же перечеркивают ваше согласие. Взгляните на примеры правильных и неправильных присоединений.</p>\n<p>Возражение клиента - Неправильное присоединение - Правильное присоединение. «У конкурентов в два раза дешевле» - Да, у них выгоднее, НО...Понимаю, что цена важна, НО... - Понимаю, разница в цене в два раза очень существенная. Именно поэтому давайте внимательно сравним функционал и... «Срок монтажа в другой компании быстрее на 10 дней» - Понимаю, что в вашей ситуации сроки поджимают, HO... - 10 дней — это довольно большая разница при запуске такого сложного оборудования. Именно поэтому давайте посмотрим нюансы... «Я хотел уложиться в 50 тысяч рублей, а у вас дороже» - Да, наш продукт дороже, НО... - Хорошо, что у вас есть четкий бюджет на покупку. Именно поэтому давайте отталкиваться от него и попробуем подобрать вариант, который.. «О» — ответить. Именно с этого у большинства менеджеров начинается отработка возражений. Предыдущие этапы обычно упускаются, и взаимодействие строится по принципу «возражение — ответ (аргумент)», а не «возражение — встречный вопрос, присоединение и ответ (аргумент)».</p>\n<p>Показатель вашего профессионализма — умение приводить доводы в тот момент, когда клиент готов их воспринимать.</p>\n<p>А это возможно только после прояснения ситуации и вашего присоединения. У каждого из вас своя специфика и свой уникальный опыт. И я уверен, что есть много причин для сотрудничества именно с вами. Сейчас самое время рассказать клиенту об этом.</p>\n<p>Я рекомендую использовать комбинацию аргументов: два логических и один эмоциональный. Такая связка, по моему опыту, помогает снять все остальные возражения клиента.</p>", "level": 3}, {"title": "ПРИМЕРЫ КОМБИНАЦИЙ АРГУМЕНТОВ", "html": "<p>Возражение клиента - Логические аргументы - Эмоциональные аргументы. «У конкурентов это дешевле в два раза» - Мы используем современные технологии, которые служат в два раза дольше. Мы даем гарантию пять лет, а не один год, что снижает расходы на сервис и замену. - Вы уже так много сил и средств вложили в проект, зачем вам связываться с дешевыми производителями на данном этапе? Ведь это может испортить впечатление о проекте в целом. «Срок монтажа в другой компании быстрее на 10 дней» - Мы проводим дополнительные проверки на каждом этапе, чтобы обеспечить соответствие высшим стандартам. Монтажом занимаются только сертифицированные специалисты, график которых расписан на неделю вперед, поэтому возможно ожидание. - Вы устанавливаете оборудование, которое будет работать на вас годами. И сейчас главное смонтировать его правильно, чтобы потом получать удовольствие, а не проблемы от упущений при монтаже.</p>\n<p>Большинство возражений можно отработать с помощью правильной комбинации аргументов. В следующем разделе мы с вами рассмотрим готовые тактики работы с некоторыми из них. «Р» — резюмировать. После того как вы привели убедительные доводы, самое время резюмировать то, что вы проговорили, и помочь клиенту решиться на следующий шаг.</p>\n<p>Для этого запросите обратную связь у вашего собеседника, узнайте, остались ли у него вопросы, и готов ли он дальше передать заявку или согласиться на встречу. «Б». Мягкий знак означает, что вся работа с возражениями проводится мягко, без конфликта. Не относитесь к сомнениям клиента как к нападкам и спору, а, наоборот, обрабатывайте несогласие аккуратно и тактично, и тогда у вас все получится. «У меня клиент только что дополнительно оформил карту!» — радостно, подбежав ко мне, сказала Эля, проходившая стажировку в отделе продаж. Самое интересное, что несколько минут назад этот же покупатель говорил: — Мне ничего не надо! — Понимаю, что вам ничего не надо, — ответила ему Эля. — Именно поэтому предлагаю только попробовать.</p>\n<p>И получила ответ: — Hy ладно, давайте оформим. Эля так поступила не потому, что классно владела техниками продаж. Наоборот, она запуталась в скриптах, разволновалась и, вспомнив только, что нельзя спорить, пошла по заученному алгоритму: сначала присоединиться к клиенту, а потом попытаться отработать возражение. И это сработало!</p>\n<p>Никаких аргументов, споров и навязывания. Даже бывалые менеджеры удивленно ухмыльнулись: «Да ладно, вот так Эля!»</p>\n<p>Этот пример показывает, что иногда важны не доводы, а сам факт присоединения и попытка продолжить взаимодействие. Многие опытные продавцы забывают как раз об этих двух вещах. Они пытаются сразу накидать покупателю аргументы и доказать, почему ему нужна услуга или продукт. Это приводит к конфликту или тому, что человек молча слушает менеджера, а потом навсегда вычеркивает компанию из своей жизни.</p>\n<p>Поэтому, когда вам в следующий раз захочется поспорить с клиентом, вспомните эту историю и добавьте к вашим техникам присоединение и призыв к целевому действию по алгоритму «НЕ СПОРЬ». 1000 И 1 ОТВЕТ Невозможно иметь готовые ответы на все возражения, но вы можете добавить в свою работу инструмент, который я называю «Банк возражений: стратегии работы и готовые ответы». Этот метод я внедряю практически в каждом отделе продаж, и он помогает сотрудникам продавать больше. Вы тоже можете создать свою базу, которая будет включать 1000 и более ответов на реплики клиента в любой ситуации.</p>\n<p>Как создать банк возражений? Для начала выпишите возражения, с которыми вы чаще всего сталкиваетесь, с учетом вашей специфики, опыта, продукта, региона и так далее.</p>\n<p>Рядом с каждым возражением запишите не конкретную фразу, а стратегию работы с ним. То есть ваша цель — в первую очередь проработать логику общения с клиентом в целом, а после этого — подобрать формулировки для ответов.</p>\n<p>Рассмотрим основные группы возражений, которые встречаются в работе каждого менеджера, и проработаем их.</p>\n<p>Тактика - Ответ - Пояснение. Первая группа возражений: по конкурентам. Например, ваш потенциальный клиент говорит: «А я уже работаю с другими». Варианты ответа.</p>\n<p>Заменить текущего поставщика — Вы принципиально только с этим поставщиком планируете работать или, если наши условия и подходы будут в целом выгоднее для вас, готовы рассмотреть их? - С помощью вопроса вы прощупываете почву, готов ли клиент в принципе отказаться от текущего поставщика и начать сотрудничать с вами.</p>\n<p>Улучшить то, что у клиента есть, без прекращения отношений с прежним поставщиком - — Я понимаю, что основной поставщик у вас уже есть, при этом всякое бывает: товар некстати закончился, цены на определенную группу товаров взлетели...</p>\n<p>Мы как раз предлагаем вам не отказываться от основного поставщика, а иметь альтернативу, запасной вариант. Вы работаете с поставщиком по товару А, а товар Б и В планируете заказывать? - Стратегия, при которой вы даете клиенту попробовать альтернативу без резкого отказа от того продукта, которым он пользуется сейчас.</p>\n<p>На такое предложение гораздо легче согласиться. Предложить сравнить - Да, я знаю, что вы уже работаете с другими поставщиками, и у вас уже многое отлажено.</p>\n<p>Именно поэтому хотел с вами связаться, чтобы детально все сравнить и посмотреть, какие могут быть выгоды от работы с нами. И, кстати, такое сравнение в любом случае полезно.</p>\n<p>Потому что некоторые клиенты на основании нашего расчета получают скидки у действующих поставщиков. Вы же с ними давно работаете? - Вы не предлагаете что-то менять и улучшать, а предлагаете сравнить два варианта и после сделать вывод.</p>\n<p>В этом случае клиент понимает, что ничего не теряет. И вот тут — ваш выход на сцену. Расскажите преимущества вашего решения так, чтобы им захотелось воспользоваться.</p>\n<p>Вторая группа возражений: по цене и условиям продукта. Например, клиент говорит: «У вас дороже» или «У вас дольше сроки поставки». Какие могут быть стратегии?</p>\n<p>Проверить на истинность озвученное возражение— Давайте обсудим цену буквально через несколько минут, а сейчас скажите, в остальном все ли подходит, все ли нравится, все ли устраивает по комплектации, по цвету и так далее?... - Иногда за возражением стоит банальное незнание, что включено в стоимость товара или услуги. И когда вы начинаете проговаривать это, клиент понимает, что на самом деле продукт или товар стоят своих денег.</p>\n<p>Сравнение — Понимаю, условия могут отличаться у разных поставщиков. Давайте проверим, что именно включено... давайте сравним более детально... посмотрим, какие есть нюансы. - Если клиенту нужно купить товар не в конкретном месте, а просто потому, что у него в нем есть потребность, конечно, он захочет сравнить предложения. И вы, как эксперт, подкованный в нюансах своего продукта, можете помочь ему сделать лучший выбор. Это очень хорошая стратегия, чтобы перейти к следующему целевому действию.</p>\n<p>Обоснованный торг — Давайте посмотрим, что можно сделать в этой ситуации, попробуем подобрать лучший вариант для вас. - Обоснованный торг - это не когда вы даете клиенту скидку, чтобы уравнять ваши цены с конкурентом. Категорически нет! Вы просто переходите в зону торга, при этом не обещаете, что дадите скидку. Может быть, это будет что-то другое, например, хороший бонус.</p>\n<p>Третья группа возражений — когда у клиента нет потребности в вашем продукте. «Мне ничего не надо». Что в этой ситуации можно сделать?</p>\n<p>Уточнить информацию по срокам у клиента — Не нужно именно сейчас или вы в принципе пластиковые окна на даче ставить не планируете? - Здесь самая лучшая стратегия это альтернативный вопрос. Если клиент говорит, что сейчас не нужно, вы можете маневрировать и предполагать, что позже продукт может все же понадобиться.</p>\n<p>Уточнить информацию по продуктам или услугам - Сориентируйте, не нужен именно этот товар? А вообще, направление может быть актуально? - С помощью этого приема вы от частного переходите к общему, чтобы с помощью вопросов выйти на новое частное — тот продукт, который будет закрывать потребности клиента. «Сейчас нет, потом да&quot; — Скажите, вы же продаете в сегменте B2В и у вас есть отдел продаж? Да? Значит, вопрос о скриптах или вопрос об усилении отдела все равно рано или поздно появится, верно? - Здесь важно грамотно присоединиться к возражению и перевести фокус внимания на будущие перспективы в обсуждаемом вопросе. Таким образом вы ловко уходите от возражения и перехватываете инициативу, и всё это выглядит красиво, легко и абсолютно адекватно.</p>\n<p>Четвертая группа возражений — по принятию решения. Думаю, каждый из вас сталкивался с ними и произносил их сам. Например: «Я подумаю..» Разберемся, как отвечать.</p>\n<p>Вопрос об актуальности плюс привлекательная альтернатива - — Я правильно понимаю, что в целом вопрос увеличения продаж в отделе для вас актуальный, верно?</p>\n<ul><li>Да.</li>\n</ul>\n<ul><li>Тогда давайте поступим так: мы сделаем бесплатный аудит вашего отдела продаж, посмотрим, что у вас работает, а что нет, и уже после этого, если вас все устроит, согласуем возможный план действий, хорошо? - Вы задаете вопросы, клиент подтверждает, что для него это актуально, и вы предлагаете другое целевое действие. Если это привлекательная альтернатива, особого смысла отказываться от такого предложения не будет. Поэтому всегда имейте в запасе несколько вариантов.</li>\n</ul>\nГлобальная совместимость - Клиент говорит: Я буду думать, какой компьютер выбрать...\n<p>Вы можете ответить: Понятно, что по конкретной конфигурации нужно будет определиться. Скажите, а в целом как вам эта модель? - Вопросы, которые вы задаете, используя стратегию глобальной совместимости, помогают получить подтверждение, что в целом ваше решение клиенту подходит, нужно лишь согласовать детали. «Такое чувство, что...» - Клиент говорит: — Ладно,я буду думать. Вы отвечаете: — Конечно,я понимаю, проект не простой, все нужно взвесить... Только у меня такое чувство, что вас все таки како то нюанс смущает. - Эта стратегия хорошо работает, когда установлен крепкий эмоциональный контакт с клиентом. Когда вы говорите, что чувствуете сомнения, у вас есть шанс услышать истинное опасение покупателя по поводу вашего продукта и предложить эффективное решение.</p>\n<p>Подведем итог этой главы. Не бойтесь возражений, не боритесь с ними, а пытайтесь предвосхитить. Если не получилось, попробуйте не просто обработать реакции клиента, а копнуть чуть глубже — понять, что стоит за ними? Слушайте покупателя внимательно, выясняйте, что именно ему не подходит, и имейте в арсенале много разных стратегий взаимодействия. Когда вы с блеском справитесь с этим шагом, останется только одно — закрыть сделку.</p>\n<p>Как понять, что клиент готов сотрудничать с вами? Есть ли идеальная модель закрытия сделки? Можно ли подтолкнуть человека к тому, чтобы он сказал вашему предложению «да»? Ответы на эти и другие важные вопросы, посвященные финальному этапу в продаже, вы найдете в следующей главе! Вперед!</p>", "level": 3}, {"title": "НАВЫК ЗАКРЫТИЯ", "html": "", "level": 3}, {"title": "СДЕЛКИ", "html": "", "level": 3}, {"title": "Практический инструмент: Клиенто-ориентированные фразы", "html": "<p>Слово не воробей: вылетит – не поймаешь.</p>\n<p>Некоторые слова и фразы задевают клиентов, снижают их лояльность и ваши продажи.</p>\n<p>Старайтесь не использовать «неудачные фразы». Вот таблица с примерами, как из</p>\n<p>неудачных фраз сделать клиенто-ориентированные.</p>\n<p>Неудачные фразы заменяем на - Альтернативные фразы:</p>\n<p>Вы меня не поняли! - Позвольте, я объясню еще раз, чтобы мы разобрались во всех нюансах.</p>\n<p>Я вас вообще не понимаю! - То есть вы хотели бы…? Так?</p>\n<p>Сейчас такого оборудования нет! -  Я сейчас сориентирую вас по возможным поставкам оборудования.</p>\n<p>Это не ко мне! Не мой вопрос! - Я уточню, кто может помочь в этом вопросе, и скажу вам.</p>\n<p>Ничего не могу обещать! - Я сделаю все от меня зависящее и буду держать на контроле этот вопрос.</p>\n<p>Я не знаю (нет информации по этому вопросу) - Сейчас я попробую выяснить и сообщу вам до ХХ часов.</p>\n<p>Вы не правы! - Понимаю, такой вариант бывает, при этом в вашей ситуации.</p>\n<p>Ничего непонятно (из того, что объяснил клиент) - Давайте вместе попробуем разобраться</p>\n<hr>", "level": 4}, {"title": "Практический инструмент: Фразы для продаж, повышающие конверсию", "html": "<p>&quot; В любом случае есть гарантия... - Фраза повышает уверенность клиента в предложенном решении / продукте / услуге, снимает возможные страхи.</p>\n<p>&quot; ИО, есть несколько вариантов... - Предлагая выбор из нескольких вариантов, Вы показываете экспертность, повышаете вероятность закрытия сделки.</p>\n<p>&quot; Попробуйте, это бесплатно... - Подумайте, что можете дать клиенту бесплатно: тест, образец, пробник, встречу, расчет. Предлагайте прогресс, как в видео.</p>\n<p>&quot; Если подойдет – будем работать, если нет – рассмотрим еще варианты... - Вы демонстрируете адекватность (что предложение 1 может не подойти клиенту), готовность к обсуждению альтернатив.</p>\n<p>&quot; ИО, это окупится за... - Всегда говорите про окупаемость решения, приводите примеры, расчеты. Клиент должен понять, что это не расходы, а инвестиции.</p>\n<p>&quot; Планируем? Оформляем? Бронируем? - Побуждайте к целевому действию. Используйте вопросы или призыв. Не ждите, пока клиент «закроет сам себя»</p>\n<p>&quot; Понял ситуацию. Есть такое решение… - Фраза демонстрирует клиенту, что Вы его услышали, поняли ситуацию и готовы предложить подходящее решение.</p>\n<p>&quot; В целом все подходит? Все важные моменты учли? - Вы получаете от клиента «глобальное» согласие, показываете, что услышали его пожелания и готовы двигаться дальше.</p>\n<p>&quot; В таких ситуациях хорошо работает / обычно делают... - Этой фразой Вы показываете, что знакомы с подобными ситуациями, знаете, какие есть варианты решения. Повышаете доверие.</p>\n<hr>\n<hr>", "level": 4}]}, {"id": 9, "part": "ЧАСТЬ II. 8 НАВЫКОВ РЕКОРДНЫХ ПРОДАЖ", "partIdx": 1, "title": "Глава 9. Навык 6: Отработка возражений", "bodyHtml": "", "sections": [{"title": "Практический инструмент: Памятка по работе с возражениями", "html": "<p>ВОЗРАЖЕНИЕ «Я ПОДУМАЮ» - ТОП-5 техник с примерами.</p>\n<p>Техника «Вопрос об актуальности +альтернатива»</p>\n<p>-ИО, в целом для Вас это актуальный вопрос? Тогда</p>\n<p>давайте попробуем [альтернатива ] (продвижение</p>\n<p>вперед).</p>\n<p>-ИО, Вы же все равно планируете / закупаете</p>\n<p>стройматериалы сейчас? Давайте просто посчитаем,</p>\n<p>сравним, чтобы…</p>\n<p>Техника «Глобальная совместимость»</p>\n<p>-ИО, а в целом подходит / нравится предложение, или есть моменты, которые смущают?</p>\n<p>-Детали нужно обдумать, а в целом – как Вам?</p>\n<p>Техника «Есть нюанс, иначе – риск », повышаем экспертность.</p>\n<p>-Кстати, если Вы будете сравнивать (для полноты картины), еще такой момент надо учесть….</p>\n<p>-Конечно, подумайте. Единственный нюанс – возможно, при обдумывании встанет вопрос по датам / окончательным ценам…</p>\n<p>-А другие варианты уже смотрели? (ответ) Кстати, есть нюанс, иначе – риск (негатив)</p>\n<p>-Кстати, ИО, многие компании, которым нужно (для которых важно) _____, уделяют особое внимание __, потому что_____.</p>\n<p>Техника «Потерянное время».</p>\n<p>-Если бы месяц назад мы начали работать, уже бы сейчас у Вас [результат клиента]</p>\n<p>-Можно и позже начать, но, если честно, здесь есть некоторые риски. Смотрите…</p>\n<p>Техника «Такое чувство, что…» (когда уровень доверия высок).</p>\n<p>-Конечно, надо все взвесить. Только у меня такое чувство (ощущение), что Вас что-то смущает. Что мы можем что-то изменить, добавить, улучшить?</p>\n<p>ПОЧЕМУ КЛИЕНТЫ ГОВОРЯТ «Я ПОДУМАЮ»?</p>\n<ul><li><strong>1.</strong> Хотят вежливо отказаться от Вашего предложения (нет потребности, нет мотивации здесь и сейчас (ЗС) ,финансовые возможности).</li>\n</ul>\n<ul><li><strong>2.</strong> Хотят посоветоваться с кем-то (коллеги, друзья, члены семьи).</li>\n</ul>\n<ul><li><strong>3.</strong> Хотят сравнить Ваше предложения с другими.</li>\n</ul>\n<ul><li><strong>4.</strong> Испытывают 1 из 4 страхов клиента.</li>\n</ul>\n---", "level": 4}, {"title": "Банк возражений: 275 готовых ответов", "html": "", "level": 4}, {"title": "Раздел: Возражения по цене", "html": "", "level": 3}, {"title": "Полезные советы", "html": "<p>Возражение «Дорого» намного проще предотвратить (принцип «Пятна на рубашке» из «Школы личных продаж: система КЛОУЗЕР»), чем потом пытаться переубедить клиента.</p>\n<p>Часто я рекомендую не ждать, пока клиент озвучит возражение, а действовать на опережение — Вы можете сами озвучить наиболее вероятное будущее возражение клиента и сразу дать аргументированный ответ.</p>\n<p>Если не получилось предотвратить, используйте предложенные варианты ответов.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У Вас дорого!»", "html": "<p>«[Имя Отчество], я назвал примерную цену. А вообще по цене могут быть варианты разные, в зависимости от наполнения / комплектации. Например, есть такой вариант (презентуем альтернативы)»</p>\n<p>«[Имя Отчество], &quot;дорого&quot; по сравнению с другими аналогичными предложениями или вообще за эту услугу?»</p>\n<p>«Цена — вопрос важный. При этом не самый главный, т. к. по цене мы с клиентами почти всегда договариваемся. Скажите, в целом Вам продукт / решение подходит?»</p>\n<p>«Цену устанавливает производитель / разработчик. Поэтому она не будет существенно отличаться у других продавцов. Или для Вас такая цена в принципе высокая и нужно рассмотреть другие варианты?»</p>\n<p>«[Имя Отчество], конечно, такая услуга в такой комплектации стоит денег. При этом, чтобы Вы понимали, за что именно Вы платите, смотрите (кратко презентуем наполнение и результаты). Как видите, то, что Вы получите в итоге, перекрывает инвестиции»</p>\n<p>«Сейчас, возможно, есть единоразовая трата. Но давайте посчитаем, сколько получится сэкономить за год? А за три? Если сотрудники будут работать без чёткой системы, сколько можете потерять?»</p>\n<p>«[Имя Отчество], в нашей ситуации, наверное, главный вопрос не &quot;Сколько стоит?&quot;, а &quot;Стоит ли это того?&quot;. Давайте ещё раз посмотрим, как быстро это должно окупиться»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Я отношусь к возражениям как к «звоночку» — скорее всего, на предыдущих этапах взаимодействия с клиентом менеджер сделал что-то не так.</p>\n<p>Не прояснил до конца ситуацию клиента, не установил с ним контакт, не смог убедительно выступить в роли эксперта, да и презентация его была не на высоте.</p>\n<p>Хорошая новость в том, что критических возражений, способных на корню срубить сделку, не больше десятка. И если вы научитесь грамотно с ними работать, то сможете в большинстве случаев выходить на закрытие сделки.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Это высокая цена. В рекламе была меньше!»", "html": "<p>«Действительно, цена в рекламе является базовой, и некоторые клиенты приобретают наш продукт именно за такую цену. Тут важно определиться по функционалу, что Вам действительно нужно. И насколько базовый комплект Вам подходит. Скажите, как...»</p>\n<p>«Да, такой вариант тоже есть / возможен. Как правило, мы с клиентами обсуждаем различные варианты и выбираем уже тот, который клиенту удобнее и (в итоге) выгоднее»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Нет денег»", "html": "<p>«Нет денег в этом месяце или вообще пока не видите смысла покупать этот продукт?»</p>\n<p>«Вопрос с оплатой мы с клиентами обычно решаем, договариваемся. Сейчас важно понять, нужна ли Вам вообще эта услуга или пока нет?»</p>\n<p>«Да, сейчас такое время)) Давайте определимся, а нужен ли Вам этот продукт вообще»</p>\n<p>«[Имя Отчество], а вообще деньги в этом направлении периодически выделяете (на рекламу, на обучение сотрудников и т. д.)? В таком случае мы можем так поступить: сделать пилотный проект и оценить, насколько работа с нами будет выгодна, сколько Вы сможете заработать, сэкономить? А потом будем принимать решение»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Смотрели фильм «Волк с Уолл-Стрит» с Леонардо Ди Каприо? В основе этого фильма лежит история Джордана Белфорта, который заработал состояние на продаже по телефону акций дешёвых компаний.</p>\n<p>Мне очень запомнилась фраза с тренинга Джордана Белфорта: «Продажи — это процесс передачи Вашей веры в продукт Вашему клиенту».</p>\n<p>А Вы верите в свой продукт? Сможете передать веру клиенту? Если да, Вы легко будете справляться с любыми возражениями и отговорками.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У Вас подозрительно дёшево»", "html": "<p>«[Имя Отчество], после первых сделок наши клиенты обычно говорят: &quot;Спасибо! А мы думали, такой продукт стоит гораздо дороже!&quot;. Мы знаем, как выстроить процесс, чтобы избавить Вас от ненужных переплат. При этом у нас есть гарантия, и Вы можете быть уверены в...»</p>\n<p>«Вы правильно заметили, что наши цены ниже среднерыночных, и вот почему: (большие корпоративные скидки, прямые поставки, надёжные партнёры и т. д.)»</p>\n<p>«А какая цена была бы для Вас оптимальной? Уверен, тут я смогу договориться со своим руководством))»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У Вас нет отсрочки платежа»", "html": "<p>«Действительно, базовые условия её не предполагают. Скажите, насколько для Вас это принципиальный момент?»</p>\n<p>«Чем именно Вам это неудобно? Какую отсрочку Вы бы сами хотели?»</p>\n<p>«Мы готовы сделать Вам отсрочку, при условии (большого заказа, либо своевременной оплаты 3 заказов и т. д.), готовы так работать?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Я всегда стараюсь передавать менеджерам такую мысль — при работе с ценой помните, что большинство клиентов не хотят самых дешёвых вещей. Они хотят получить максимально выгодную сделку с учётом всех параметров, а не только цены.</p>\n<p>Вот Вы хотите «самое дешёвое»? Телефон и часы подешёвле? Автомобиль подешёвле или туфли? Разве Вы выбираете по принципу самое дешёвое?</p>\n<p>Уверен, что нет. Так и клиенты. Не спешите сразу предлагать самое дешёвое, давать скидки и т. д. Продавать можно и без скидок.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я не готов платить до оказания услуги / поставки продукта»", "html": "<p>«Вы рассматриваете оплату после поставки, потому что сейчас нет возможности сделать предоплату или потому что хотите сначала убедиться, что товар качественный, и сразу после этого оплатить?»</p>\n<p>«Понимаю, что важно подобрать комфортную форму расчёта. Почему для Вас именно постоплата важна?»</p>\n<p>«Мы знаем, что постоплата удобна многим нашим клиентам, поэтому работаем в таком формате после первых 3-х заказов. Это предусмотрено у нас программой лояльности. Давайте сделаем расчёт...»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Дайте мне скидку 20%»", "html": "<p>«Мы можем обсуждать индивидуальные условия в каждом проекте. Давайте посмотрим, за счёт чего можно снизить стоимость в нашей ситуации (смотрим наполнение, показываем ценность и обоснованность цены. Часто клиенты передумывают просить скидку и покупают по полной цене)»</p>\n<p>«Почему именно 20%? У Вас есть жёсткий бюджет или Вы ориентируетесь на какой-то вариант конкурентов?»</p>\n<p>«У Вас есть жёсткое ограничение по бюджету? Давайте посмотрим другие тарифы, чтобы выбрать лучший вариант в рамках существующего бюджета, хорошо?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Когда клиент спрашивает: &quot;Сколько стоит?&quot;, недостаточно просто назвать цену.</p>\n<p>Цену нужно не называть, а презентовать. Презентовать — это прежде всего донести ценность предложения, показать окупаемость Вашего решения и дать клиенту чёткую причину, почему именно у Вас ему выгоднее покупать.</p>\n<p>Если Вы будете презентовать цену — Вы легко предвосхитите возражения по цене.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я буду искать более низкую цену на рынке»", "html": "<p>«Понимаю. По цене на рынке есть много предложений. А что для Вас важно при выборе этого продукта помимо цены?»</p>\n<p>«У Вас есть какой-то строгий бюджет или Вы планируете в целом оценить рынок и найти более выгодный вариант?»</p>\n<p>«Если составить список из 3-х важнейших для Вас критериев при покупке этого продукта, в эту тройку точно войдёт цена, правильно понимаю? И что ещё, кроме цены?»</p>\n<p>«Сориентируйте, а в какие сроки Вам важно, чтобы всё было готово (установлено, настроено, работало на Вас)? Уже смотрели какие-то варианты по цене? Какие там плюсы / минусы?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Подожду, пока у Вас будет акция»", "html": "<p>«То есть Вы уже точно понимаете, что именно этот вариант подходит лучше всего, и хочется дождаться более выгодных условий? Сейчас я расскажу, как можно получить бонусы / подарки сегодня...»</p>\n<p>«Акции у нас бывают, при этом довольно редко. А почему для Вас важно акции дождаться? Часто бывает, что клиентам выгоднее уже сейчас купить и начать пользоваться, чем ждать акций и терять время. Вы когда планируете начать использовать?»</p>\n<p>«Иногда у нас бывают акции, которые позволяют получить дополнительные бонусы, подарки или небольшие скидки. Вы хотели бы скидку или бонус получить?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Главное правило при работе со скидками звучит очень просто — не давайте скидок просто так.</p>\n<p>Да, клиенты могут спрашивать &quot;А есть ли у Вас скидки?&quot;, но это не означает, что такие скидки нужно сразу давать. Это не означает, что клиент не готов купить по полной цене.</p>\n<p>Можно ли давать клиентам скидки? Можно, но не просто так. Понимаете?</p>\n<p>Как только клиент поймёт, что любая скидка должна быть обоснованной, Ваше предложение в его глазах будет выглядеть ещё сильнее.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я рассчитывал на более низкую цену»", "html": "<p>«У Вас есть жёсткий бюджет, в который нужно уложиться, или просто рассчитывали, что такие услуги должны стоить дешевле?»</p>\n<p>«Вы уже смотрели аналогичные варианты по ценам, функционалу? Какие преимущества видите в нашем предложении?»</p>\n<p>«По цене у нас есть несколько вариантов. Давайте обсудим их через пару минут. А сейчас по функционалу / наполнению — скажите, это то, что Вам нужно?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «А скидки есть какие-нибудь?»", "html": "<p>«У нас есть система лояльности, которая предусматривает бонусы, подарки и скидки при определённых условиях. Например, на каждый второй заказ мы предоставляем...»</p>\n<p>«Да, у нас есть скидки при определённых условиях: например, полная предоплата в течение 2 дней или заказ 3-х и более услуг. Скажите, пожалуйста, у Вас бывают в бизнесе... (перечисляем ситуации, в которых могут быть нужны наши доп. услуги. Повышаем средний чек)»</p>\n<p>«Данный продукт является премиальным, поэтому скидок на него не предоставляем. Наоборот — цены периодически повышаются. Давайте оценим, насколько это окупается и выгодно для Вас на текущих условиях?»</p>\n<hr>", "level": 3}, {"title": "Раздел: Возражения по продукту", "html": "", "level": 3}, {"title": "Полезные советы", "html": "<p>Задавайте вовлекающий вопрос после озвучивания цены.</p>\n<p>Например, Вы озвучили клиенту, что кондиционер, который ему понравился, стоит 100 000 рублей, тут же продолжите: «Сейчас в наличии на складе 5 штук. Вы сейчас просто присматриваетесь или уже хотели бы установить в ближайшее время?».</p>\n<p>Такой подход позволяет не оставить продажу после озвучивания цены, а продолжить диалог и с большей вероятностью закрыть сделку.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У Вас очень неудобные сроки поставки (функционал и т.д.)»", "html": "<p>«Расскажите, какие сроки были бы для Вас приемлемы? Подумаем, что можно сделать»</p>\n<p>«Скажите, в чём именно для Вас неудобство наших сроков? Давайте попробуем построить работу так, чтобы решить этот вопрос»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Вашу программу / услугу слишком долго настраивать»", "html": "<p>«Настройка и интеграция действительно очень важны. Поэтому мы продумали её до мельчайших шагов. Скажите, в какие сроки хотели бы уложиться? Подумаем, что можно сделать»</p>\n<p>«Скажите, если обучение и интеграцию мы полностью возьмём на себя, от Вас только принципиальное согласие, так подойдёт?»</p>\n<p>«Другими словами, Вас смущает технический момент, связанный с интеграцией. Это единственное, что останавливает?»</p>\n<p>«Скажите, Вас тут что больше смущает: собственные усилия или время на интеграцию? Тут фактически всё зависит от нас с Вами, насколько мы точно оценим ресурсы на старте и договоримся. И хорошо, что мы это сейчас можем с Вами открыто обсуждать. Давайте посмотрим наше предложение по настройке»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Что значит работать с возражениями? Если вы хотите продавать больше, Вам нужно освоить две вещи.</p>\n<p>Первое — предвосхищать возражения. То есть выстраивать продажу так, чтобы возражения вообще не появлялись.</p>\n<p>И второй момент — использовать проверенные стратегии и речевые приёмы для эффективной обработки возражений, которые всё же возникли во время разговора с клиентом.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Ваш продукт нам не подходит (нужен другой формат, функционал)»", "html": "<p>«Понял, а какой для Вас идеальный вариант? У нас есть разные варианты комплектации / наполнения, поэтому мы можем подобрать тот вариант, который подойдёт именно Вам»</p>\n<p>«Расскажите, пожалуйста, какой формат или функционал Вам нужен? Возможно, у нас получится максимально адаптировать под Вас этот продукт или подобрать альтернативу»</p>\n<p>«Вы имеете в виду, что функционал избыточный для Вашей ситуации, или наоборот, чего-то не хватает?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Ваш продукт быстро устаревает, мне нужно всё новое!»", "html": "<p>«Сейчас рынок меняется очень быстро, согласен с Вами. Именно поэтому у нас есть регулярные обновления продукта. Смотрите, как это выглядит...»</p>\n<p>«Согласен, что в этой сфере всё очень быстро меняется. Поэтому наш продукт создан так, чтобы долгое время выполнять главные задачи и давать вам результат. Я же правильно понимаю, что текущая версия продукта решает Ваши задачи?»</p>\n<p>«Хорошо, что Вы следите за новинками. Наш продукт действительно может не быть последней моделью через год, но мы гарантируем его актуальность и эффективность на протяжении всего срока службы. У нас предусмотрены регулярные обновления, вот пример...»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Используйте технику «АнтиСПАМ». Забудьте о банальных и набивших всем оскомину формулировках.</p>\n<p>Услышав такие сочетания, как «хорошее предложение», «взаимовыгодное сотрудничество» или «стратегическое партнёрство», секретарь или ЛПР отмахнётся от вас, как от назойливой мухи: «Спасибо, я подумаю, вышлите коммерческое предложение...».</p>\n<p>Исключите из своей речи банальные СПАМ-слова, и клиенты чаще будут говорить вам &quot;Да!&quot;</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Ваше оборудование очень дорогое в обслуживании»", "html": "<p>«Я понимаю, насколько важно, чтобы оборудование работало бесперебойно, без простоев. Именно поэтому мы особое внимание уделяем обслуживанию, регулярным проверкам и быстрому устранению любых проблем. Именно такое обслуживание даёт максимальную окупаемость в короткие сроки. Давайте посчитаем...»</p>\n<p>«Вы сравниваете с каким-то конкретным оборудованием или в целом рассчитывали на меньшую стоимость обслуживания?»</p>\n<p>«Да, обслуживание стоит денег, при этом стоимость обслуживания составляет всего несколько процентов от стоимости самого оборудования, и самое главное — за счёт грамотного обслуживания оборудование окупается за счёт долговечности и стабильной работы. В итоге это приносит гораздо больше денег»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я не чувствую, что Ваше предложение — лучшее для меня»", "html": "<p>«Понятно, что хочется выбрать самое выгодное. А что именно вызывает сомнения? Давайте посмотрим, что можно сделать лучше»</p>\n<p>«Если по 10-балльной шкале оценить наше предложение, сколько бы Вы поставили? Почему именно такой балл? Что больше всего нравится и что хотели бы улучшить?»</p>", "level": 3}, {"title": "Раздел: Возражения по продукту (продолжение)", "html": "", "level": 3}, {"title": "Полезные советы", "html": "<p>Используйте позитивные формулировки во время презентации. Я часто вижу, как продавцы сами притягивают возражения, когда рассказывают о продукте.</p>\n<p>Например, «доставка этого товара возможна, но будет через 3 логистических центра и может занять 2 недели...».</p>\n<p>Даже эта вырванная из контекста фраза заставляет клиента напрячься и провоцирует на возражения. А ведь продавец мог использовать позитивную формулировку: «Доставка этого товара возможна, уже через 2 недели будет у Вас. Это самый быстрый способ на сегодняшний день».</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Ваш продукт не учитывает нашу специфику»", "html": "<p>«Согласен, что в каждом проекте есть специфика. Поэтому у нас есть опыт адаптации нашего продукта под разные задачи. Расскажите, какая у Вас специфика, и мы найдём решение»</p>\n<p>«Вы имеете в виду региональную специфику, отраслевую или ...? Расскажите, пожалуйста, это важный момент — мы всегда учитываем специфику каждого проекта, так как это прямо влияет на результат»</p>\n<p>«Мы знаем, насколько важно учитывать специфику в каждом проекте. Поэтому наша работа начинается с анализа Вашей ситуации. У нас есть отраслевой опросник для выявления всех нюансов, который помогает грамотно выстроить работу. Кстати, из Вашей отрасли у нас также есть кейсы. Хотите посмотреть?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Мне не нравится Ваш функционал / дизайн / материалы / состав»", "html": "<p>«Да, понял, дизайн / доп. функционал можем обсудить отдельно, это решаемый вопрос. Главное понять, а в целом этот продукт решает Ваши главные задачи?»</p>\n<p>«Скажите, а что бы Вы хотели увидеть в идеале? Есть примеры, как это может выглядеть?»</p>\n<hr>", "level": 3}, {"title": "Раздел: Возражения при отсутствии потребности", "html": "", "level": 3}, {"title": "Полезные советы", "html": "<p>На мой взгляд, для преодоления такого возражения важно понять, что за ним стоит: клиент работает с другими и не хочет ничего менять, его всё устраивает, и он не планирует пользоваться таким продуктом; для него это не актуально именно в данный момент, а в будущем потребность может появиться и т. д.</p>\n<p>Именно поэтому я предлагаю варианты ответов, направленные на прояснение ситуации. Как только Вы поймёте, по какой причине предложение неактуально, Вы сможете преодолеть это возражение.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Нам неинтересно, не актуально»", "html": "<p>«Вам это не нужно сейчас, или Вы вообще не пользуетесь такими услугами?»</p>\n<p>«Вы уже всё купили, или у Вас израсходован бюджет? Вы имеете в виду, что работаете уже с другими или сейчас у Вас несезон?..»</p>\n<p>«Возможно, Вам ничего не нужно сейчас, при этом, учитывая, что Ваша компания постоянно развивается и растёт, наше предложение может быть очень актуально уже в ближайшее время. Скажите, у Вас бывает такое (вопрос по ситуации клиента с целью вовлечения)?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Нам ничего не нужно»", "html": "<p>«Не нужно, потому что уже работаете с другими или потому что вообще не пользуетесь такими услугами?»</p>\n<p>«Не нужно именно сейчас или вообще не планируете развивать это направление?»</p>\n<p>«Скажите, а у Вас бывают такие ситуации, когда [проблема]?»</p>\n<p>«Я согласен, что если нет выгоды, то нет и смысла пользоваться сервисом / продуктом. [Имя Отчество], я же правильно понимаю, что у Вас есть менеджеры в отделе продаж? По нашему опыту, менеджеры начинают продавать больше при использовании скриптов продаж. Я хотел показать Вам варианты скриптов для Вашей ситуации. Когда будет удобно обсудить?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Как думаете, что может означать фраза «Замолчи! И начни, наконец, продавать!»?</p>\n<p>Многие думают, что хорошие продавцы много и красиво говорят. Это не совсем так.</p>\n<p>Да, в некоторые моменты действительно нужно красиво говорить. Но лишь в некоторые моменты. А в остальное время нужно слушать. Задавать вопросы и снова слушать. Если клиент озвучивает негатив, делится прошлым опытом, не спешите говорить: «А у нас по-другому!». Просто послушайте клиента и покажите, что услышали его.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я не пользуюсь этим принципиально»", "html": "<p>«Вы имеете в виду нашу компанию, или Вы вообще не пользуетесь такими услугами?»</p>\n<p>«[Имя Отчество], скажите, пожалуйста, не нужно, потому что Вы этим вообще не пользуетесь или потому что работаете с другими поставщиками?»</p>\n<p>«[Имя Отчество], а Вы пробовали раньше пользоваться этим? Как результаты?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Мы уже пробовали. Не понравилось»", "html": "<p>«Не понравилась работа поставщика или сам продукт не дал нужного эффекта?»</p>\n<p>«О! А что случилось? Можете рассказать подробности? А если бы не этот момент, в остальном Вам как?»</p>\n<p>«Скажите, а как давно это было? Для чего покупали, какие задачи были?»</p>\n<p>«Знаете, по опыту, внедрение чего-то нового редко на старте делает всех довольными и счастливыми. Понятно, что это проект, с планируемыми преимуществами и выгодой, но, как правило, через какое-то время. Давайте попробуем прояснить, где в прошлый раз возникли сложности и как заранее обойти этот момент»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Однажды мой сотрудник делал звонок в компанию, чтобы пригласить менеджеров на обучение в школу продаж. Ответ руководителя был очень суровым и категоричным: «Зачем их обучать? Они сами кого хочешь могут обучить! До свидания!».</p>\n<p>И клиентов с таким мышлением немало. Мы всё знаем. Мы всё умеем. Мы всё сделаем сами. В большинстве случаев, как Вы понимаете, это просто слова человека, не погружённого в детали, которому кажется, что всё просто и легко.</p>\n<p>Погружайте клиента в детали проекта, показывайте экспертность и сложность, чтобы они поняли: без Вас — никак!</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Мне уже предлагали это. Я отказался (по телефону)»", "html": "<p>«А для чего рассматривали покупку? Почему решили отказаться? Смотрите, время идёт, ситуация меняется, продукт сам по себе тоже реагирует на рынок. Я предлагаю обсудить детали и оценить, насколько в текущей ситуации это может Вам подойти»</p>\n<p>«[Имя Отчество], понимаю, что Вы уже рассматривали ранее такую услугу. При этом многое уже поменялось. Причём в лучшую сторону. Смотрите, какие появились возможности»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я лучше сделаю это своими силами (сайт, обучение сотрудников, настройка CRM и т.д.)»", "html": "<p>«[Имя Отчество], понятно, что многое можно сделать самому, погрузившись в тему, изучив и разобравшись, как это делается. Попробовав раз-два, с третьего-то что-то выйдет. Вопрос в другом: сколько времени это займёт, и какие есть риски?»</p>\n<p>«Хорошо, [Имя Отчество], когда планируете этим заняться? Спрашиваю, потому что, как говорится, время — деньги. Может быть, с нами Вы сделаете быстрее и уже через месяц получите первые результаты. Давайте посчитаем?»</p>\n<p>«[Имя Отчество], кстати, Ваш вклад здесь в любом случае нужен, даже если Вы закажете услугу у нас. Смотрите, как выглядит процесс и какие моменты важно учесть»</p>\n<p>«&quot;Лучше своими силами?&quot; А почему лучше? Это качественнее, быстрее? Или вопрос в цене?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>По моему опыту, слово «кризис» часто используется менеджерами и руководителями, чтобы оправдать падение продаж, невыполнение планов, и, самое главное, отсутствие чёткой стратегии развития компании в период спада экономики страны / мира.</p>\n<p>Да, в кризис рынок сужается во многих отраслях, но значит ли это, что клиенты вообще перестают покупать? Конечно, нет.</p>\n<p>Клиентам нужен товар, который Вы реализуете. Вопрос лишь в том, купят ли они у Вас или у тех, кто лучше подготовился к кризису и разработал «антикризисные предложения», от которых глупо отказываться.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Сейчас кризис, надо экономить и затянуть пояса, не покупать лишнего»", "html": "<p>«Согласен, [Имя Отчество], что кризис лучше переждать. Особенно если знать, когда и чем он закончится . А учитывая, что мы этого не знаем, давайте посмотрим, как в условиях кризиса можно улучшить процессы благодаря нашему продукту...»</p>\n<p>«[Имя Отчество], есть мнение, что кризис лучше переждать не высовываясь, в режиме максимального сохранения энергии. Если бы только знать точно, когда он закончится. А поскольку мы с Вами не знаем, когда он закончится и чем закончится, важно принимать взвешенные решения»</p>\n<p>«Насчёт экономии согласен с Вами. Именно это я и хотел обсудить, так как по нашему опыту внедрив продукт / сервис, Вы будете экономить 20% расходов на рекламу. Какой у Вас примерный бюджет на рекламу?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Когда будет нужно — сам обращусь к Вам»", "html": "<p>«[Имя Отчество], скажите, а сейчас как решаете эту [проблему]?»</p>\n<p>«[Имя Отчество], хорошо, отметил себе. Кстати, чтобы у Вас было представление, что это даст в Вашей ситуации и сколько может стоить, давайте сделаем [бесплатный первый шаг]»</p>\n<p>«А вообще у Вас бывают сейчас такие ситуации, когда [ситуация, в которой возникает потребность в Вашем продукте]...?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Я помню, как читал отчёт тайного покупателя и прослушивал записи переговоров, и в строке «Как менеджер ответил на возражения» было написано следующее: никак.</p>\n<p>Менеджер проигнорировал возражения клиента, оставил без ответа.</p>\n<p>Такое бывает, когда у сотрудника нет аргументов для ответа. Это говорит о слабой подготовке эксперта.</p>\n<p>Ни одно из возражений клиента не должно остаться незамеченным. Это правило.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Мы решим эту задачу другим способом, без Вашего продукта»", "html": "<p>«Вы имеете в виду &quot;своими силами&quot; или &quot;с другой компанией&quot;? Да, есть разные способы решения, давайте оценим плюсы и минусы каждого...»</p>\n<p>«Понимаю. Клиенты часто рассматривают минимум 3 варианта решения, поэтому я подготовил сравнительную таблицу с нюансами. Давайте посмотрим...»</p>\n<p>«А почему решили рассматривать альтернативы? Как Вам наш продукт по функционалу? По цене?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «В моей ситуации это не сработает!»", "html": "<p>«Я понимаю, что есть сомнения. А какие нюансы видите именно в Вашей ситуации? Что важно учесть, чтобы всё сработало, на Ваш взгляд?»</p>\n<p>«А какое идеальное решение видите с учётом Вашего опыта и специфики ситуации?»</p>\n<p>«У нас были случаи, когда люди думали так же при обсуждении условий проекта. При этом, когда мы разработали детальный план проекта, мы согласовали все детали и успешно реализовали проект»</p>\n<p>«Чтобы всё прошло успешно, очень важен Ваш настрой. Я дам Вам контакты наших клиентов из такой же сферы — обсудите с ними, как это сработало. И если Ваш настрой изменится — согласуем детали проекта. Как считаете?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Большая ошибка — обесценить позицию клиента фразами «Вы не правы, я лучше знаю, Вы просто не разбираетесь...».</p>\n<p>Даже если менеджер найдёт сильный аргумент в свою пользу и приведёт его клиенту, как думаете, как отреагирует последний? Скажет ли он: «Ну точно, так и есть, согласен с Вами!»? Это большая редкость.</p>\n<p>Никто не любит быть побеждённым в споре. Поэтому, скорее всего, покупатель скажет: «Ну не знаю. Ладно, спасибо, всего доброго».</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Спасибо, я просто смотрю! Покупать пока не планирую»", "html": "<p>«Да, пожалуйста. У нас есть бесплатный каталог с обзором всей продукции / услуг для разных ситуаций, выслать Вам в мессенджер или на e-mail?»</p>\n<p>«Понимаю, поэтому буду рад ответить на вопросы, если они появятся, и рассказать про актуальные акции, хорошо?»</p>\n<p>«Хорошо! Пока Вы смотрите основное, я сейчас покажу Вам некоторые новинки и предложение месяца, чтобы у Вас было полное представление...»</p>\n<hr>", "level": 3}, {"title": "Раздел: Возражения из-за сомнений, недоверия", "html": "", "level": 3}, {"title": "Полезные советы", "html": "<p>Представьте ситуацию: клиент выдаёт какое-то возражение, менеджер как настоящий профи легко на него отвечает, а потом замолкает и просто смотрит на покупателя. Менеджеры думают, что клиенту ничего не остаётся, как ответить: «Да, я покупаю». Но этого не происходит.</p>\n<p>Цель продавца — не просто ответить, а добиться прогресса в сделке. Поэтому спросите клиента, остались ли ещё какие-то вопросы, и предложите ему следующий шаг.</p>\n<p>Не допускайте выхода клиента из разговора, когда он скажет, что всё понял и будет думать.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я хотел бы работать с более надёжной компанией»", "html": "<p>«[Имя Отчество], понимаю, надёжность сейчас для многих компаний важнее, чем цена. Скажите, какие гарантии мы можем дать дополнительно, чтобы работать с Вами?»</p>\n<p>«А Вы рассматриваете рекомендации (наших клиентов, или компаний из той же отрасли)?»</p>\n<p>«[Имя Отчество], по опыту, когда клиенты говорят о надёжности, очень часто имеют в виду наш опыт, реализованные проекты и отзывы от клиентов. А что для вас было бы важно, чтобы убедиться, что наша компания — это серьёзный партнёр, с которым можно и нужно работать?»</p>\n<p>«[Имя Отчество], надёжность контрагентов очень важна, мы это понимаем, поэтому со своей стороны готовы предоставить все необходимые материалы. Что могло бы Вам помочь в принятии решения?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У Вас много негативных отзывов»", "html": "<p>«А какие именно отзывы Вы имеете в виду? [Имя Отчество], мы же с Вами понимаем, кто и зачем может быть заинтересован в такой информации о крупной и давно работающей компании (на высококонкурентном рынке)»</p>\n<p>«Да, я тоже сталкивался с негативными оценками. И, к сожалению, люди пишут негативные отзывы гораздо легче, чем положительные. Тут важно понимать, что у компании много клиентов и много отзывов. И отзывов разных. Готов Вас познакомить с благодарственными письмами и рекомендациями от клиентов»</p>\n<p>«[Имя Отчество], репутация в наше время — это всё. Поэтому мы особое внимание уделяем тому, чтобы клиенты получали то, что хотели. Какие отзывы Вы имеете в виду? Давайте разберёмся»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Можно ли научиться продавать или это врождённый навык: кому-то дано, кому-то — нет?</p>\n<p>Я искренне считаю, что продажи — это навык, который развивается. Когда-то я сам думал, что в силу своего характера я никогда не смогу продавать, а тем более продавать на «холодных звонках». А сегодня мои видео с холодными звонками являются наиболее просматриваемыми на Youtube.</p>\n<p>Более того, я считаю навык продаж важнейшим в повседневной жизни: ведь мы продаём наши навыки и опыт работодателям, продаём идеи друзьям, коллегам и руководству, продаём товары, услуги, бизнес. Этот навык напрямую влияет на наш доход! Развитые навыки продаж помогают нам убеждать людей и добиваться гораздо большего практически в любых проектах. Прокачивайте свои навыки продаж!</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Никогда раньше о Вас не слышал»", "html": "<p>«С большинством наших клиентов мы начинали сотрудничать ровно с этой же фразы, давайте смотреть друг на друга в деле»</p>\n<p>«Да, есть компании, которые у многих на слуху, рекламируются по ТВ и радио. Мы из другой ниши, долгое время специализировались на услугах для государственных корпораций и крупных компаний и хорошо себя в этом зарекомендовали, на текущий момент прорабатываем новые ниши, в связи с чем активно работаем с предпринимателями и готовы давать более выгодные условия»</p>\n<p>«Скорее всего, Вы слышали о наших проектах (перечисляем). Ранее работали только с крупными заказчиками и застройщиками (например, ___), с этого года развиваем новое / розничное направление»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У Вас мало опыта! Вы молодая компания!»", "html": "<p>«Если смотреть на саму компанию, то да — нам всего 1–2 года. При этом если посмотреть на опыт и реализованные проекты наших сотрудников, видно, что команда готова справиться с большинством задач. Давайте посмотрим по Вашей ситуации»</p>\n<p>«[Имя Отчество], мы молодая компания, это так. При этом наши специалисты имеют суммарный опыт в сфере более 20 лет. И что ещё важно — мы понимаем, что нам для развития нужны Ваши положительные отзывы и результаты. Мы сделаем всё, чтобы Вы получили результат. Попробуем?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Как создать банк возражений? Для начала выпишите все возражения, с которыми Вы чаще всего сталкиваетесь при общении с клиентами, с учётом вашей специфики, опыта, продукта, региона и так далее.</p>\n<p>Рядом с каждым возражением запишите не конкретный ответ, а стратегию работы с ним. То есть, Ваша цель — в первую очередь проработать логику общения с клиентом в целом, а после этого — подобрать конкретные формулировки для ответов на возражения.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У Вас нет кейсов с моей спецификой / Вы не разбираетесь в моём бизнесе»", "html": "<p>«Действительно, именно с таким бизнесом мы не работали. При этом мы работали уже со 100+ разными бизнесами, в каждом есть своя специфика, и мы понимаем, насколько важно это учитывать для эффективной работы. Вы продаёте услуги / товары, а мы работали с десятками компаний, которые тоже продают услуги / товары. Давайте рассмотрим специфику Вашего проекта и согласуем план работы с учётом всех нюансов»</p>\n<p>«Конечно, мы не разбираемся в Вашем продукте так глубоко, как Вы. При этом мы разбираемся в своей области. И когда мы запускаем проект, мы всегда проводим встречи с Вами, чтобы разобраться в специфике и учесть все нюансы. Например, у нас есть похожие кейсы из других сфер, смотрите...»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Слишком хорошо, чтобы быть правдой. В чём подвох?»", "html": "<p>«Предложение действительно выгодное. Мы даже проводили опросы покупателей, чтобы разработать именно такой продукт. Кстати, Вы уже видели кейсы наших клиентов?»</p>\n<p>«Спасибо, что так оценили. Мы изучили рынок, конкурентов, спрос покупателей, что позволило нам организовать работу ещё лучше и сделать такое предложение. Давайте обсудим план проекта в деталях?»</p>", "level": 3}, {"title": "Раздел: Возражения из-за сомнений, недоверия (продолжение)", "html": "", "level": 3}, {"title": "Полезные советы", "html": "<p>Никогда не притворяйтесь, что что-то знаете, если Вы этого не знаете.</p>\n<p>Это особенно касается новичков, которые хотят впечатлить клиента своей «экспертностью».</p>\n<p>Если не знаете ответ на сложный вопрос, лучше сказать честно: «Пока затрудняюсь ответить, но я уточню информацию по этому вопросу и обязательно свяжусь с Вами». Ничего в этом страшного нет.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я покупал такое раньше — это не работает! Пустая трата денег!»", "html": "<p>«Жаль слышать, что так вышло. Что именно Вы покупали? Это вообще не сработало или какой-то эффект все-таки был?»</p>\n<p>«Понял Вас. Я знаю нескольких клиентов, которые раньше уже пробовали это у других поставщиков, но эффекта не было. Когда мы с ними погружались в детали — сразу понимали причину. Давайте разберем Вашу ситуацию?»</p>\n<p>«Я знаю, насколько важно, чтобы Ваши инвестиции окупились. Поэтому у нас есть таблица для расчета окупаемости и детальная схема работы с учетом Вашей специфики. Давайте посмотрим, чтобы избежать ошибок и получить нужный результат»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У Вас нет гарантии результатов!»", "html": "<p>«Да, гарантии важны, и хочется быть уверенным, что результат точно будет. При этом мы всегда говорим клиентам, что на конечный результат влияет не только наш продукт, но и то, как сам клиент это внедряет, использует, соблюдает инструкции и так далее. Мы гарантируем качество продукта и не даем ложных обещаний по результатам клиента»</p>\n<p>«У нас есть гарантии качества продукта (услуги) и репутация на рынке — за 10 лет мы реализовали сотни проектов. Такая репутация формируется годами, поэтому мы не даем тех гарантий, которые звучат красиво, но юридически нереализуемы. Вы же согласны, что для результата Вам самостоятельно нужно грамотно использовать продукт и выполнять конкретные задачи?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Не искажайте факты и не преувеличивайте.</p>\n<p>Если продукт не обладает каким-то свойством или на его доставку требуется больше времени, так и скажите.</p>\n<p>Вводить клиента в заблуждение — это краткосрочная выгода, которая в конечном итоге только навредит Вашей репутации.</p>\n<p>Предупреждайте о возможных рисках. Это показывает не только Вашу осведомленность в теме и экспертность, но и демонстрирует искреннее желание провести сделку максимально открыто и честно.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я сейчас оплачу, а вдруг потом результата не будет / не буду это использовать в работе»", "html": "<p>«Вы же все равно планируете в этом направлении развиваться? И наш продукт поможет Вам быстрее получить результат. Это подтверждают многие кейсы. Давайте согласуем план проекта, чтобы понять, что Вам точно это будет полезно, хорошо?»</p>\n<p>«Если Вы не будете это использовать, то, конечно, это отразится на результатах. Поэтому перед покупкой важно определиться, точно ли это нужно именно сейчас и закрывает ли это Ваши задачи. Давайте сверимся...»</p>\n<p>«Давайте просчитаем потенциальный эффект от внедрения для Вашей ситуации? Если увидим, что есть смысл — то Вы запланируете оплату, как считаете?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «О Вас нет отрицательных отзывов! Это подозрительно — Вы их удаляете!»", "html": "<p>«Мы не удаляем отзывы, просто стараемся работать так, чтобы клиенты оставались довольны. Показать Вам примеры сложных ситуаций, которые мы успешно решили?»</p>\n<p>«У нас действительно положительная репутация, потому что мы на каждом этапе работы собираем обратную связь клиентов. И если видим, что что-то может пойти не так — оперативно реагируем. Это позволяет нам не получать негативных отзывов»</p>\n<p>«Понимаю, почему это может казаться странным. Негативных отзывов нет, потому что мы работаем над тем, чтобы каждый клиент был счастлив. Это главное для нас»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Обещайте меньше, делайте больше. Не наоборот.</p>\n<p>Это формирует долгосрочное доверие и лояльность, делая Вас надежным партнёром в глазах клиента.</p>\n<p>Многие продавцы в погоне за разовыми сделками склонны обещать слишком много, лишь бы закрыть сделку.</p>\n<p>Такой подход дает лишь временный эффект и быстро портит Вашу репутацию на рынке. Вы перечеркиваете свои отношения с клиентами. Репутация сегодня — это все!</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Это Китай! Не доверяю этой продукции!»", "html": "<p>«К производству в Китае действительно раньше было много вопросов. При этом сейчас даже многие известные бренды производят свои товары там и контролируют качество на каждом этапе. У нас тоже есть несколько этапов контроля качества, благодаря чему вопросов по качеству не возникает. Видели отзывы наших клиентов?»</p>\n<p>«Для нас качество сборки очень важно, так как это напрямую влияет на нашу репутацию. Именно поэтому мы регулярно выезжаем на производство в Китай, обсуждаем стандарты качества. Плюс у нас есть свой отдел контроля на территории производителя — это позволяет каждый день держать руку на пульсе, оценивать качество и внедрять пожелания наших клиентов»</p>\n<p>«Не доверяете из-за страны производства или из-за конкретного бренда / производителя данной продукции?»</p>\n<hr>", "level": 3}, {"title": "Раздел: Возражения по конкурентам", "html": "", "level": 3}, {"title": "Полезные советы", "html": "<p>У клиента уже есть поставщик — это хорошо или плохо для Вас?</p>\n<p>В начале своей карьеры менеджера я думал, что это очень плохо. Ведь клиент сразу говорит, что его все устраивает, и менять он ничего не будет. Практически безвыходная ситуация.</p>\n<p>На самом деле нет. Выход есть. Более того, когда клиент уже покупает аналогичный товар у конкурента, с ним еще легче вести переговоры. У него уже сформирована потребность, ему нужен Ваш товар. Убедите клиента работать с Вами с помощью приема «Вы все равно это делаете» из курса «Клоузер».</p>\n<hr>", "level": 3}, {"title": "Экскурсия в ПРОКАЧКУ с ИИ", "html": "<p>За ~60 минут я покажу, как сотни компаний прямо сейчас закрывают больше сделок — и что конкретно нужно изменить в вашей системе продаж.</p>\n<p>[Смотреть экскурсию]</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Мы уже работаем с другими (уже есть поставщик)»", "html": "<p>«Отлично. Именно поэтому я Вам и позвонил. Мы как раз в приоритете начинаем работать с теми компаниями, которые уже имеют опыт подобного сотрудничества. Скажите, Вы принципиально работаете только с этим поставщиком, или готовы рассматривать другие варианты?»</p>\n<p>«ИО, скажите, Вы только с этим поставщиком планируете работать, или можете рассмотреть и другие предложения, если они будут более интересные?»</p>\n<p>«ИО, как Вы смотрите на то, чтобы просто сравнить условия Вашего поставщика с нашими? Ведь для бизнеса такое сравнение может быть полезно, так ведь?»</p>\n<p>«ИО, когда я первый раз общаюсь с руководителем компании, я часто слышу, что поставщики есть, и схема работы отлажена. При этом, когда мы делаем сравнение, часто видим, что есть моменты, которые можно улучшить. Именно поэтому я не предлагаю сразу ничего менять, я предлагаю сравнить то, что у Вас есть, с нашими условиями. Если увидим зоны роста, будем двигаться дальше. Что скажете?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Все устраивает. Менять ничего не буду»", "html": "<p>«Конечно, какой смысл менять что-то, если не видна выгода. Я просто хотел понять, если мы сейчас увидим, что у нас будет ощутимо выгоднее для Вас, можем обсуждать дальше?»</p>\n<p>«Скажите, а Вы у этого поставщика заказываете и ТОВАР А, и ТОВАР Б и С? Бывает такое, что у нас намного выгоднее заказывать, к примеру, ТОВАР Б. Вы его используете?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Представьте, что Вы продаете огнетушитель. Как думаете, какой клиент купит быстрее всего и даже не будет сравнивать Вас с конкурентами?</p>\n<p>Правильно! Быстрее купит клиент, у которого шляпа горит! Ему нужно настолько быстро избавиться от проблемы, что времени на сравнение практически нет. Он купит сразу же!</p>\n<p>А какие клиенты готовы максимально быстро купить Ваш продукт? Вы знаете где их искать или продаете всем подряд?</p>\n<p>Продумайте стратегию продаж и Вы удивитесь, как снизится количество возражений.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У конкурентов дешевле»", "html": "<p>«Бывает такое, что цена на некоторые услуги отличается. Давайте сравним стоимость и функционал. Скажите, а у них данная опция есть? Это сильно влияет на цену. Без этого у нас не 90, а 85»</p>\n<p>«А комплектация такая же? А сроки? А сервис какой предлагают? Гарантия тоже 1 год? Производитель? Очень подозрительно, ведь цена ниже рынка. У меня был клиент, который... (история)»</p>\n<p>«Вы знаете, как это бывает, каждая компания делает на чем-то акцент и может предложить по определенной категории цену ниже, а по другим — наоборот все будет дороже. Давайте сравним в целом стоимость проекта»</p>\n<p>«Я знаю, что некоторые конкуренты заявляют более низкую цену, и вот почему: 1) ___, 2) ___»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У конкурентов условия лучше (поставки, сроки)»", "html": "<p>«Скажите, пожалуйста, на какие варианты ориентируетесь?»</p>\n<p>«ИО, учитывая, что условий в целом много, скажите, какие из них для Вас самые важные: сроки, цена, поддержка, гарантия?»</p>\n<p>«ИО, я понимаю, что сроки очень важны, иногда даже важнее, чем остальные условия по продукту... Именно поэтому я со своей стороны сделаю все возможное, чтобы сократить сроки и, кроме этого, я буду держать Вас в курсе работы над Вашей заявкой. Я знаю, что это для Вас важно, и мы это учтем в работе»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>«Я работаю со СБЕРом и буду век ему верна» — дословный ответ потенциального клиента на мое предложение работать с другим банком.</p>\n<p>Такие преданные клиенты не редкость на рынке B2B и B2C услуг. Как быть?</p>\n<p>Прежде всего отметьте такую преданность. Говорите не о продукте, не переубеждайте клиента. Для начала просто скажите о человеческих качествах. Ведь такая преданность — это очень ценно.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Мы работаем с постоянным поставщиком уже 10 лет!»", "html": "<p>«Я знаю, что Вы давно на рынке. За это время Вы же хотя бы одного поставщика или партнера поменяли? Потому что Вам это было выгоднее. Сейчас я не предлагаю менять, я предлагаю сравнить и сделать выводы»</p>\n<p>«ИО, именно поэтому я сразу ничего не стал предлагать. Я понимаю, что в такой ситуации должна быть существенная выгода, чтобы Вы решили сменить поставщика. Давайте обсудим»</p>\n<p>«Очень Вас понимаю, сами ценим постоянных партнеров, с которыми нас уже многое связывает. При этом рынок меняется и сейчас такое время, когда полезно иметь несколько вариантов: можно не только сэкономить, но и подстраховаться»</p>\n<p>«Понимаю, поэтому не предлагаю отказываться от проверенного временем поставщика. Мы можем просто сравнить тарифы поставщика с нашими. И если увидим существенную экономию, Вы можете либо получить скидку у существующего поставщика, либо начать работать с нами по некоторым направлениям»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Другие компании работают быстрее Вас!»", "html": "<p>«Скажите пожалуйста, а с какими компаниями Вы сравниваете? Какие именно работы обещают сделать в такие сроки?»</p>\n<p>«Скажите, а на какие сроки ориентируетесь?»</p>\n<p>«Да, мы знаем, что есть компании, которые делают это быстрее, при этом мы до сих пор говорим клиентам, что сделаем это за неделю. А знаете почему? (рассказываем подробно о плане работы по продукту)»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Клиенты скептически относятся к продуктам, в которых «все гладко и сладко».</p>\n<p>Сразу хочется найти какой-то подвох, согласны?</p>\n<p>Чтобы показать, что Ваше предложение реальное, а не из рубрики «фантастика», разбавьте плюсы продукта парой несущественных недостатков, которые не умаляют основных преимуществ.</p>\n<p>Такие мини-недостатки демонстрируют вашу честность, снимают напряжение у клиента, который пытается найти минусы в Вашем предложении.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У конкурентов доставка / поддержка бесплатно, а у вас нет!»", "html": "<p>«Поддержка и доставка, конечно, влияют на Ваши расходы. Поэтому давайте комплексно оценим все плюсы и минусы. Многие клиенты после сравнения видят, что несмотря на то, что у нас доставка и поддержка не бесплатные — с нами в итоге получается выгоднее. Посчитаем?»</p>\n<p>«У нас есть разные варианты сотрудничества, в том числе и с бесплатной доставкой / поддержкой. Давайте выберем лучший тариф для Вас...»</p>\n<p>«Да, я знаю, что некоторые компании закладывают стоимость &quot;доставки и поддержки&quot; в стоимость продукта, и говорят, что они &quot;бесплатные&quot;. Мы так не делаем и сообщаем клиенту только стоимость продукта. Остальное Вы можете докупить самостоятельно: например, воспользоваться своей службой доставки. Давайте в целом оценим, насколько наше предложение выгодное...»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Как стать для клиента своим?</p>\n<p>Ваша задача как человека, который продает, найти хоть что-то, что вас может связать с клиентом.</p>\n<p>Даже если на первый взгляд кажется, что между вашими интересами пропасть. Это может быть общий знакомый, чья-то рекомендация или какой-то другой фактор, создающий связь между вами. Искать общее — тоже навык.</p>\n<p>Не всегда точки соприкосновения лежат на поверхности, но если вы их найдете, расположите этим к себе потенциального покупателя еще больше.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «У конкурентов дороже, но у них больше кейсов!»", "html": "<p>«Понятно, что кейсы важны. При этом важно, чтобы кейсы были достоверными и подтверждали ту экспертность, которая нужна именно в Вашей ситуации. Давайте я покажу конкретные кейсы, и Вы увидите, как качественно мы прорабатываем все ситуации. Кстати, так как у нас все кейсы подтвержденные, я смогу по согласованию с клиентом дать Вам его контакт, чтобы Вы напрямую уточнили все вопросы, как Вам?»</p>\n<p>«Мы моложе, чем конкуренты, при этом сейчас хорошо растем и особое внимание уделяем кейсам. У нас есть подборка кейсов с таким запросом, как у Вас — давайте посмотрим их. Если у Вас останутся вопросы по нашей экспертности, я с удовольствием дам Вам дополнительную информацию»</p>\n<p>«Я понимаю, что Вы сравниваете разные варианты. Не могу ничего сказать про кейсы конкурентов. Я готов показать Вам наши кейсы в аналогичных проектах, и Вы увидите, насколько качественно мы прорабатываем все ситуации. Также давайте составим конкретный план действий по Вашему проекту, и, если Вас все устроит, начнем работу»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>При звонке в стоматологическую клинику можно сказать: «Звоню Вам, так как у нас есть успешный опыт работы с клиниками Вашего профиля, включая проекты, реализованные в нашем и соседних регионах».</p>\n<p>Получается интересный заход, когда контакт вроде холодный, но Вы создаете впечатление, что не только знакомы со спецификой клиента, но и имеете конкретные достижения в его сфере.</p>\n<p>И с Вами уже интереснее разговаривать. Естественно, всё вышеперечисленное работает, когда это действительно так.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Мои знакомые покупали у Ваших конкурентов и рекомендуют их»", "html": "<p>«Понятно, что мнения друзей важны. А Вы уже смотрели предложения конкурентов? Как Вы лично оцениваете их?»</p>\n<p>«Понимаю Вас. А что для них было самое ценное? Почему рекомендуют их? А что им не понравилось?»</p>\n<p>«Я сам часто прислушиваюсь к рекомендациям. При этом бывают ситуации, когда важно непредвзято оценить все предложения. Ведь, если мы еще не работали с Вашим знакомым, это не значит, что у нас предложение и продукт хуже. Давайте взвесим все &quot;за и против&quot;...»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я сначала соберу все варианты от конкурентов, а потом решу. Вы не одни!»", "html": "<p>«Хорошо, мне приятно, что мое предложение тоже будете рассматривать. Скажите, пожалуйста, а какие у Вас основные параметры при выборе, чтобы я сделал на этом акцент в предложении?»</p>\n<p>«Понимаю, а что для Вас ключевое при выборе? А что помимо цены?»</p>\n<p>«При сборе предложений в нашей сфере можно столкнуться с тем, что довольно сложно объективно их сравнить. Не все поставщики раскрывают в предложении все условия. Давайте я сразу выделю то, что для Вас наиболее важно. Расскажите, на что будете в первую очередь смотреть (помимо цены)?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Продавать — это не про подвешенный язык, как многие считают, и не про впаривание, а про умение слушать других и понимать, что они хотят.</p>\n<p>С самого начала работы в продажах я внимательно относился к клиентам и вел учет отношений с каждым из них в CRM-системе (специальной программе, в которой менеджер может посмотреть всю историю взаимодействия с клиентом).</p>\n<p>Эта программа была моим главным активом. В карточках клиентов я указывал телефоны, адреса электронной почты, историю и анализ проведенных сделок. Даже дни рождения клиентов записывал.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я покупаю только у компаний из ТОП-3 — Вы не подходите!»", "html": "<p>«Да, ТОП-3 — это компании лидеры рынка. А по каким рейтингам или критериям будет ТОП-3?»</p>\n<p>«Хорошо. А какие еще параметры, кроме &quot;ТОП-3&quot;, для Вас важны? Сроки? Гарантия? Цена? Мы подготовим бесплатно продуманный вариант реализации Вашего проекта с учетом специфики. В любом случае наше предложение усилит Ваши позиции в переговорах с ТОП-3...»</p>\n<p>«Вы имеете в виду работу по всем проектам или есть какие-то направления, где &quot;ТОП-3&quot; не является категоричным параметром, и Вы можете рассматривать более выгодные варианты?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Уже выбрали другого поставщика, спасибо!»", "html": "<p>«Хорошо, спасибо за честность. Дайте, пожалуйста, обратную связь, как наше предложение смотрелось на фоне другого? Чего не хватило? Будем учитывать это в будущем!»</p>\n<p>«Ок, понял! То есть уже подписали договор и сделали оплату, или только планируете это делать?»</p>\n<p>«То есть Вы определились с услугами по настройке CRM у этого поставщика? А по подбору команды менеджеров ОП что думаете? У нас сейчас есть в базе несколько кандидатов с опытом в Вашей сфере, посмотрим их?»</p>\n<p>«Понял вас. Спасибо, что рассматривали нас. Давайте будем на связи — я Вам вышлю подарок по теме...»</p>", "level": 3}, {"title": "Раздел: Возражения по полномочиям решения", "html": "", "level": 3}, {"title": "Полезные советы", "html": "<p>Если окончательное решение принимает руководитель / Москва / комитет, это не значит, что тот сотрудник, который нам озвучивает это возражение, не может влиять на решение руководства.</p>\n<p>Не спешите брать контакты руководства (хотя, конечно, это нужно сделать) и завершать разговор. Попробуйте узнать подробности у этого сотрудника, поинтересуйтесь его мнением и в идеале, добейтесь того, чтобы этот сотрудник стал Вашим сторонником. Это не просто, но возможно!</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я не решаю (решает руководство, головной офис)»", "html": "<p>«А лично Вам как? Какой вариант / формат работы больше подходит?»</p>\n<p>«Скажите, а на Ваш взгляд, это вообще может быть интересно Вашему руководству? Такая проблема бывает? Если мы сейчас обсудим и увидим, что это Вам в целом полезно, Вы сможете дать обратную связь руководству?»</p>\n<p>«Конечно, в любом случае принимает решение руководитель. При этом, очень часто он обращается к своим сотрудникам при принятии решения. Как Вам наше предложение? Что можно улучшить, чтобы Вы могли нас порекомендовать?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Нужно посоветоваться»", "html": "<p>«Конечно, советуйтесь. А Вас лично продукт сейчас полностью устраивает или что-то не подходит?»</p>\n<p>«Я понимаю, что в компании, скорее всего, решение по таким вопросам принимает несколько человек. Но я слышал (мне сказали), что для начала важно с Вами определиться, подходит это Вам или нет (повышаем статус клиента)»</p>\n<p>«Опыт показывает, что 70 % продуманных предложений профессиональное руководство одобряет. Давайте вместе встретимся с Вашим директором, чтобы обсудить детали»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Работая руководителем блока продаж, я пытался договориться о сотрудничестве с руководителем крупного автосалона в течение 5-ти месяцев! Я постоянно напоминал о себе, и почти каждую неделю слышал «Думаю», «Рассматриваю», «Советуемся».</p>\n<p>Если бы я продолжал использовать банальные подходы («Посмотрели?», «Надумали?»), это бы вряд ли привело к успеху.</p>\n<p>Действуйте нестандартно: используйте разные каналы связи и разные предлоги к возобновлению диалога (новости из сферы клиента, полезные материалы, приглашения на мероприятия и т.д.)</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Поговорите для начала с...»", "html": "<p>«А они сами эти вопросы решают, или все же вместе с Вами?»</p>\n<p>«Я понимаю, что Вы цените свое время. Именно поэтому я хотел у Вас, как у руководителя, сразу уточнить, что для Вас является наиболее важным при выборе компании?»</p>\n<p>«ИО, конечно, давайте запишу контакт. Скажите, а для Вас, как для руководителя, что наиболее важно при работе с такими компаниями?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Мне нужно получить одобрение специалиста (подчиненного), чтобы перейти к договору и оплате»", "html": "<p>«Понимаю, что детали нужно согласовать с ответственным специалистом, но сама идея этого продукта / проекта – как Вам, как руководителю?»</p>\n<p>«Да, сейчас у нас стратегическая встреча, чтобы понять, насколько это вписывается в развитие Вашей компании. Если да, то детали мы можем обсудить и согласовать со специалистом и потом вернуться к Вам для финального утверждения, хорошо?»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>До любой презентации узнавайте ситуацию клиента.</p>\n<p>Говорите меньше, больше слушайте. В ответах покупателя будет все то, на чем вы позже построите грамотное предложение.</p>\n<p>Первое, о чем вы должны поинтересоваться: зачем вообще человеку этот продукт? Какие потребности он хочет закрыть этой покупкой?</p>\n<p>Ваша задача не просто продать, а стать стратегом, вникающим в самую суть потребностей клиента — вот главный навык любого продавца.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Мы должны провести совещание с командой и обсудить Ваше предложение»", "html": "<p>«Понимаю, совещание с командой позволяет всесторонне обсудить предложение. Обычно мы тоже к таким встречам подключаемся и сразу даем необходимую информацию всем участникам (по ИТ, безопасности, юристам и т.д.). Когда планируете такую встречу провести?»</p>\n<p>«Это отлично. Давайте, чтобы сэкономить время команды, я отправлю Вам тезисы для обсуждения и сам презентую эту программу – у нас есть буквально 3 слайда как раз для командных встреч. После этого смогу ответить на вопросы команды. Что думаете?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я просто собираю предложения от разных компаний, чтобы передать руководителю»", "html": "<p>«Хорошо. А я могу у Вас предварительно несколько вопросов уточнить по ситуации, чтобы подготовить для Вашего руководства конкретное предложение? Можем с Вами обсудить или напрямую связаться с руководителем?»</p>\n<p>«О, понимаю. Раз Вы занимаетесь этим вопросом, скорее всего, знаете, какие критерии наиболее важны для руководителя, помимо цены?»</p>\n<p>«Да, сейчас Вы просто собираете предложения, но потом руководитель может столкнуться с проблемой – довольно сложно будет объективно сравнить предложения разных поставщиков, так как многие не прописывают нюансы в предложении. Давайте подготовим максимально конкретный расчет, хорошо? Есть несколько вопросов...»</p>\n<hr>", "level": 3}, {"title": "Полезные советы", "html": "<p>Многие менеджеры не задают вопросы клиенту, потому что думают, что и так знают, что ему нужно.</p>\n<p>А потом в компанию приходит новичок и «уделывает» более опытных коллег по количеству закрытых сделок.</p>\n<p>«Новичкам везет!» — оправдывают свои промахи продавцы-неудачники. Но дело не в везении, а в том, что многие новички стараются соблюдать стандарты продаж и поэтому задают больше вопросов клиентам. Больше вопросов – лучше понимание ситуации клиента. А значит более сильная презентация и рост закрытых сделок.</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Как скажет мой специалист (ИТ, бухгалтер, юрист и тд) – так я и сделаю. Не хочу погружаться в детали Вашего предложения»", "html": "<p>«Согласен, что это зона ответственности специалиста. При этом, так как это влияет на деньги компании, я хотел в первую очередь уточнить у Вас, готовы Вы ли стратегически этот вопрос обсуждать? Если да, то детали обсужу со специалистом, и мы вернемся к Вам за финальным подтверждением...»</p>\n<p>«Давайте я Вам вышлю тезисы – это информация именно для руководителя. А детали обсужу с Вашим специалистом, хорошо?»</p>\n<hr>", "level": 3}, {"title": "Отработка возражения: «Я передал счет в бухгалтерию на оплату. Скоро должны оплатить»", "html": "<p>«Рад, что процесс запущен. Как мне связаться с бухгалтерией для подтверждения платежа и подготовки документооборота?»</p>\n<p>«Хорошо. А для Вас важно в какие даты стартовать проект? Я свяжусь с бухгалтером,
