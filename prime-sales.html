 сделать — мнения расходятся.</p>\n<p>Что же значит «установить доверие в продажах»? Я люблю конкретику и организованность, поэтому даже к такому размытому и максимально обобщенному слову «доверие» хочу добавить формулу, которая поможет вам в любых продажах и станет пошаговым планом.</p>\n<p>Перед тем, как мы разберем формулу доверия, давайте посмотрим, какие уровни этого понятия существуют?</p>\n<p>Уровень бренда. Например, ваша компания предлагает продукцию Apple — бренда, который завоевал сердца многих покупателей. Людям все равно, где покупать новую модель телефона — в фирменном бутике или в магазине партнеров.</p>\n<p>Если перед ними iPhone, они не задумываются — их выбор уже сделан. Уровень компании. Используем тот же пример. Допустим, покупатель любит «яблочные» гаджеты, но приобретает их исключительно в М.Видео, а не в официальных точках Apple. Почему? Потому что уже имел положительный опыт обращения в этот магазин: к нему тепло отнеслись, дали исчерпывающую консультацию по продукту и помогли выбрать оптимальную модель девайса. Так же и в вашей сфере: ВОЗМОЖНО, Вы продаете товары разных брендов, но важно сделать так, чтобы клиент доверял именно вам.</p>\n<p>Уровень эксперта. Именно менеджер играет центральную роль в продажах. Его личные качества, способность слышать и понимать влияют на восприятие всей компании или бренда. Именно он может сделать продукт желанным и незаменимым для клиента.</p>\n<p>В каждом бизнесе важно понимать, на каком уровне формируется доверие. Давайте рассмотрим несколько примеров ниже.</p>\n<p>Агент по продаже недвижимости Уровень доверия - Комментарий. Доверие к застройщику - Если застройщик известен качеством, надежностью, соблюдением сроков сдачи объектов, это вызывает доверие к объекту недвижимости.</p>\n<p>Доверие к агентству недвижимости - Клиенты доверяют агентству за качество обслуживания, высокие стандарты работы, эксклюзивные предложения от проверенных застройщиков.</p>\n<p>Доверие лично к агенту - Личное доверие к агенту, его опыту, способности понять потребности клиента и предложить лучшее решение.</p>\n<p>Самозанятый дизайнер Уровень доверия - Комментарий. Доверие лично к дизайнеру - Личное доверие к дизайнеру основано на его портфолио, рекомендациях клиентов и личных качествах (коммуникабельность, профессионализм).</p>\n<p>Менеджер по продаже автомобилей BMW Уровень доверия - Комментарий. Доверие к бренду BMW - BMW ассоциируется с качеством, инновациями и престижем, что привлекает клиентов.</p>\n<p>Доверие к дилерскому центру - Клиенты возвращаются в дилерский центр благодаря отличному сервису, удобному местоположению и выгодным условиям.</p>\n<p>Доверие лично к продавцу - Доверие к продавцу основано на его профессионализме, способности понимать потребности клиента и предлагать подходящие решения.</p>\n<p>В каждой конкретной сфере можно выделить свои уровни, но, если мы посмотрим внимательно на приведенные примеры, то увидим кое-что общее — доверие лично к продавцу всегда имеет значение. Даже при продаже известных брендов с вековой историей и репутацией.</p>\n<p>Вам, как эксперту, который нацелен на рекордные продажи, важно взять это за основу — именно вы своими действиями влияете на доверие клиента. Да, на каких-то уровнях это воздействие может быть сильнее, например, то, как вы расположите покупателя лично к себе. На отношение к компании и бренду ваше влияние будет слабее, но тем не менее в ваших силах повысить уверенность клиента в организации за счет грамотного позиционирования и стратегического мышления.</p>\n<p>Формулу доверия мы рассмотрим с вами дальше, а сейчас я хочу, чтобы вы вспомнили формулу 100% закрытия сделки: П = ФВ x ОП х Д х ЛПР х ЗС Обратите внимание, где находится доверие? Верно, в самой середине. То есть в сердце любой продажи стоит убежденность клиента в вашей искренности.</p>\n<p>Это ключевой компонент формулы. Без него никакой сделки не будет. На каждом этапе ваша задача — поддерживать доверительные отношения. Каждым своим действием вызывать ощущение «Вот этому специалисту я бы доверился». Делайте мощную презентацию, задавайте суперэкспертные вопросы, проявляйте заботу и эмпатию, мягко работайте с возражениями — тогда человек проникнется к вам и захочет работать дальше.</p>", "sections": [{"title": "ФОРМУЛА ДОВЕРИЯ", "html": "<p>Чтобы при общении с клиентом вы могли осознанно, а не интуитивно, повышать уровень доверия, давайте разберем конкретную формулу. Она состоит из четырех компонентов: Д (Доверие) = Э (Эмпатия) + Э (Экспертность) + Ч (Честность) + О (Общее, контакты, связи) Э — эмпатия или забота. Это ваша способность разделять чувства клиента, понимать его страхи, сомнения. Если он ощутит вашу заботу, поймет, что для вас он не просто очередной покупатель, доверие к вам возрастет.</p>\n<p>Э — экспертность. Если вы демонстрируете глубокие знания в своей области и понимаете запрос клиента, уверенно отвечаете на сложные вопросы, покупатели видят перед собой эксперта и понимают, что могут на вас рассчитывать. Но если вы покажетесь некомпетентным продавцом, готовьтесь к тому, что с вами даже общаться не захотят.</p>\n<p>Ч — честность или искренность. Если кто-то будет впаривать вам товар, чересчур приукрашивая его ценность и приписывая несуществующие качества, что вы почувствуете?</p>\n<p>Недоверие и разочарование. Купите? Явно нет. Поэтому и сами всегда будьте честны с клиентами.</p>\n<p>О — общее. То, что связывает вас с клиентом. Если вы находите общий язык, схожие интересы и другие точки соприкосновения, это мгновенно повышает уровень взаимопонимания между вами.</p>\n<p>Работа по этой формуле возможна не только в процессе личного общения с клиентом, но и до/после встречи в том числе.</p>", "level": 3}, {"title": "ПОНЯТЬ И ПРОДАТЬ", "html": "<p>Как часто вы сталкивались с ситуацией, когда хотели что-то приобрести и, одолеваемые муками выбора, просили совета у специалиста, на что вам с совершенно равнодушным видом отвечали: «Дело ваше. Берите что хотите»?</p>\n<p>Недавно я покупал горнолыжное снаряжение в Сочи. Спрашиваю у менеджера: «Чем отличаются эти два шлема?»</p>\n<p>Делайте ставки, что я услышал в ответ?</p>\n<ul><li><strong>1.</strong> «Ничем не отличаются, только ценой».</li>\n</ul>\n<ul><li><strong>2.</strong> «Только цветом».</li>\n</ul>\n<ul><li><strong>3.</strong> «Только производителем». На самом деле, ничего из перечисленного. Представьте себе: крупный сетевой магазин, в котором представлены довольно известные бренды. Заинтересованный покупатель (это я), которому нужен шлем, очки, горные лыжи, чехлы и другие спортивные аксессуары (сумма покупок, как вы понимаете, немаленькая). И безразличный продавец, который, находясь в полутора метрах от меня, почти все время смотрел в телефон. — Чем отличаются эти два шлема?</li>\n</ul>\nПродавец молчит. И только звуки взрывающихся цветных шариков на экране смартфона дают понять, что вызывает у него настоящий интерес.\n<p>Я многое видел за годы работы. Сотни тренингов и тысячи тайных покупателей в отделах продаж разного уровня, но такого не встречал никогда — продавец, не стесняясь клиента и даже не включив беззвучный режим, продолжает играть.</p>\n<p>Как такое возможно? Или это специфика продаж в Сочи? А если серьезно разобрать эту ситуацию, можно увидеть большие потери: менеджеры упускают целевых клиентов, потому что не проявляют элементарного интереса к их ситуации. Они не просто не продают, они даже не могут грамотно «отпустить товар».</p>\n<p>Потребители чутко улавливают равнодушие продавца. А что делает человек, который видит, что вы не заинтересованы в поиске лучшего решения для него? Правильно! Идет к другому специалисту, который уделяет больше внимания к его ситуации. Или, минуя равнодушных людей, предпочитает заказывать у чат-ботов с искусственным интеллектом, которые уже сегодня могут общаться намного эффективнее, чем неподготовленные менеджеры по продажам.</p>\n<p>Не удивлюсь, если в течение нескольких лет консультантов с их «Да мне все равно, что вы купите» полностью заменят роботы — последним точно не составит труда сказать: «Спасибо», «Пожалуйста» и «Я постараюсь сделать все, чтобы решить вашу проблему!».</p>\n<p>Что такое эмпатия? Эмпатия — это искусство понимания. Не просто способность поддерживать диалог, но и умение вникнуть в ситуацию клиента, сочувствовать. А не предлагать поспешные решения. Это, кстати, распространенная ошибка не только в продажах, но и в общении с близкими.</p>\n<p>Например, друг или родственник делится проблемами, а вы, вместо того чтобы выразить поддержку, торопитесь с советами, о которых вас даже не просили.</p>\n<p>Важно научиться не только слушать собеседника, но и показывать, что вы действительно понимаете его.</p>\n<p>Если после общения с вами у потенциального покупателя появится мысль: «А ведь этому человеку и правда не все равно», значит вы на верном пути по завоеванию его доверия.</p>\n<p>Размышляя о том, как показать эмпатию, я столкнулся с утверждением руководителя одного банка: «Эмпатия либо есть от природы, либо ее нет. Если ее нет, вы не сможете продавать. И продавать в принципе умеют не все люди».</p>\n<p>Это вызвало мое любопытство, и я начал изучать эту тему глубже. Мой вывод был таким — этот навык можно развивать.</p>\n<p>Конечно, невозможно проявлять участие ко всем и каждому, особенно если через вас проходят сотни человек в день.</p>\n<p>Но можно научиться использовать специальные алгоритмы для демонстрации неравнодушия, и это уже будет шагом к установлению контакта между вами и клиентом. Пусть это и не глубокое взаимопонимание, это все равно лучше, чем даже не пытаться проникнуться ситуацией клиента.</p>\n<p>Расширенный алгоритм демонстрации эмпатии подойдет не только для продаж, но и для сложных жизненных ситуаций.</p>\n<p>А. Когда кто-то делится с вами проблемой или сомнениями, начните с вопросов. Задавайте их с искренним интересом.</p>\n<p>Это уже даст вам преимущество, так как вы покажете внимание к ситуации клиента. Б. Далее перефразируйте факты изложенной ситуации своими словами. Это покажет, что вы внимательно слушали человека.</p>\n<p>В. После можно попробовать выразить возможные чувства от услышанного. Важно показать само желание разобраться.</p>\n<p>Г. Наконец, поделитесь, как бы вы поступили в таких обстоятельствах — это объединит вас и перенесет на новый уровень доверия и взаимопонимания.</p>\n<p>Давайте разберем пример. Клиент говорит: «О вашей компании негативно отзываются». Неподготовленные менеджеры воспринимают эту фразу в штыки. Они начинают оправдываться, говорить, что у них все нормально, а плохие оценки — это происки конкурентов. Начинается словесная перепалка.</p>\n<p>Но можно повести себя по-другому и пойти по пути эмпатии. Сначала уточните, о каких именно отзывах идет речь, а потом покажите, что знакомы с ситуацией. Выразите свои чувства по этому поводу: — Если бы я увидел такой отзыв, у меня бы тоже появились сомнения.</p>\n<p>И наконец, поделитесь, как бы вы поступили на месте клиента, предлагая решение. — На вашем месте я бы тоже поднял этот вопрос. Выбор поставщика и репутация — это важно. Давайте я вам все подробнее расскажу, и мы вместе разберемся.</p>\n<p>Эмпатия также помогает при работе с возражениями. Этот подход минимизирует конфликты, так как вы сосредоточиваетесь не на том, чтобы переспорить клиента, а на том, чтобы увидеть проблему его глазами и предложить оптимальное решение.</p>\n<p>Рассмотрим пример, когда клиент возмущенно заявляет: «Вы обещали доставку за два дня, а товара до сих пор нет!» Как поступить? Можно, конечно, использовать первый алгоритм: задать вопросы, обсудить факты, проговорить чувства. Но если таких — десятки в день? Вникать в каждую историю будет слишком утомительно, да и затратно по времени.</p>\n<p>Для таких ситуаций используйте упрощенный алгоритм:</p>\n<ul><li><strong>1.</strong> Помощь. Не перекладывайте ответственность на других сотрудников или самого клиента, покажите, что вы готовы помочь. Например, вместо того чтобы говорить: «Вся информация есть на сайте», — скажите: «Давайте я уточню и попробую уладить этот вопрос».</li>\n</ul>\n<ul><li><strong>2.</strong> Ясность. Определите четкие временные рамки для следующего шага. Например: «Я уточню этот вопрос и свяжусь с вами в течение трех часов». Эта простая фраза успокаивает заказчика и показывает, что вы искренне заботитесь о решении его проблемы.</li>\n</ul>\nОба описанных алгоритма прекрасно работают в различных контекстах и помогают налаживать взаимопонимание и доверие с клиентами. Если вы проявляете эмпатию, расположение человека к вам растет.\n<p>Есть прекрасная фраза: «Клиент забудет характеристики вашего продукта, но не забудет, что он чувствовал, когда общался с вами». Подумайте, что испытывают покупатели, когда вы беседуете с ними: разочарование, усталость и негатив или «Ого! Меня понимают и слышат!». Вы вызвали у человека улыбку? Или он напрягся в очередной раз после разговора? Дали вы ему что-то ценное или, наоборот, попытались забрать время и деньги? Подумайте, какие мысли остаются после общения с вами, и поймите одну важную вещь — то, что чувствует клиент, — это не случайность и не стечение обстоятельств, это результат вашего решения построить с ним взаимодействие именно так.</p>\n<p>Демонстрируйте эмпатию, покажите, что вам не все равно, и вы сделаете неоценимый вклад в развитие доверительных отношений с клиентом.</p>", "level": 3}, {"title": "КОПАЙ ГЛУБЖЕ", "html": "<p>Второй компонент из формулы доверия — это экспертность. Людям важно, у кого они покупают товар или услугу.</p>\n<p>И свои деньги они скорее понесут не дилетанту, а эксперту в своем деле. Как говорил писатель Чак Паланик: «Если вы сами начнете вести себя как профессионал, то обнаружите, что и другие вокруг совершенно точно проявят куда больше желания сотрудничать».</p>\n<p>Но что, если вы прекрасно разбираетесь во всех тонкостях работы, но заказов у вас так и нет? Значит, пришло время продемонстрировать вашу экспертность, чтобы повысить уровень доверия покупателей и количество закрытых сделок.</p>\n<p>Что значит продемонстрировать экспертность? Показать, как хорошо вы знаете свой продукт? Нет, это не главное.</p>\n<p>Намного важнее убедить клиента, что именно вы, как эксперт, можете предложить для его ситуации лучшее решение с учетом всех нюансов.</p>\n<p>Когда я работал руководителем отдела продаж, то приехал в крупную компанию на встречу с генеральным и финансовым директорами. Мне было 23 года, выглядел я очень молодо — буквально вчерашний студент. В начале совещания клиенты были настроены скептически: «Серьезно? Этот новичок нам сейчас будет что-то рассказывать? Он вообще понимает, на сколько миллионов мы планируем заключить сделку?» Некоторые из них не стеснялись и прямо задавали вопрос: «Молодой человек, а сколько вам вообще лет?»</p>\n<p>Представляете, переговоры по существу еще не начались, а я уже в проигрышной позиции, потому что во мне не видят профессионала, с которым можно обсуждать сложные финансовые вопросы на крупные суммы. Но видели бы вы их лица, когда я вместо рассказов о продукте начинал задавать точные вопросы по бизнесу, четко понимал «боли», приводил примеры из практики и давал рекомендации по оптимизации кредитной нагрузки компании. Все были поражены моей опытностью в таком молодом возрасте, и, конечно, уровень доверия, который изначально был нулевым, моментально взлетел. Со мной были готовы общаться дальше.</p>\n<p>Кому-то из вас точно повезло больше — глядя на вас, клиент изначально видит специалиста и готов общаться на равных. У меня был более сложный путь — мне предстояло научиться демонстрировать экспертность клиенту в первые минуты общения. Я хочу это подчеркнуть — мне недостаточно просто разбираться в условиях продукта. Важно подать клиенту такие сигналы, которые сформировали бы у него однозначное понимание, что перед ним не «малоопытный молодой стажер», а человек, к советам которого нужно прислушиваться внимательно и, возможно, даже конспектировать их. Как вам задача? Я понимал, что, если не научусь показывать это, клиенты не будут доверять мне.</p>\n<p>Я исследовал тему и выделил для себя шесть важнейших шагов, которые помогали мне подтвердить компетентность в любой ситуации. Чтобы повысить свою экспертность и эффективно продемонстрировать ее клиенту, выполните следующие шесть шагов.</p>\n<p>Шаг 1. Изучите свой рынок</p>\n<ul><li><strong>1.</strong> Запомните ключевые характеристики своего продукта или услуги. Создайте удобные памятки, у вас под рукой должны быть данные: особенностей может быть множество, важно быстро найти нужную информацию. Помните о фишках товара. Если вы не можете мгновенно объяснить, чем он выгодно отличается от миллиона подобных на рынке, уделите этому вопросу внимание.</li>\n</ul>\n<ul><li><strong>2.</strong> Сформируйте три уровня аргументации: о компании, о продукте и о мотиваторах. Это критически важно для повышения эффективности ваших предложений. Необходимо детально понимать, какую пользу принесет заказчику сотрудничество с вашей компанией и ваш продукт. Добавьте мотиваторы — то, что побуждает клиента действовать прямо сейчас. Это могут быть акции, дефицит, ажиотаж и даже внешние обстоятельства, которые мы с вами разберем в главе по закрытию сделок. Все это влияет на доверие и мотивирует принимать решение быстро.</li>\n</ul>\n<ul><li><strong>3.</strong> Создайте перечень ситуаций, которые возникают в бизнесе клиента, и по каждой напишите свое решение. Помните, как я готовил предложение для агентств недвижимости в прошлой главе?</li>\n</ul>\nКроме вас на рынке есть и другие участники. Кто они, что продают, в чем их специфика? Изучение предложений конкурентов — это второй важный элемент, который необходимо рассмотреть. Хотите выделяться среди других компаний? Регулярно смотрите на продажи глазами клиента. о чем он думает, когда выбирает того, с кем хочет работать?\n<p>Какие потребности ему нужно закрыть, какие варианты он рассматривает? Попытайтесь разобраться, что предлагают ваши конкуренты, и как ваши условия смотрятся на их фоне.</p>\n<p>Такой подход позволит вам грамотно выстраивать стратегию продаж, определять преимущества продукта и лучше аргументировать свою позицию в разговоре с клиентом.</p>\n<p>Общие тенденции. Оцените текущее состояние вашего рынка: наблюдается рост или спад? Если вы продаете недвижимость, то должны знать все текущие тренды: динамику цен за квадратный метр, перспективы развития отрасли, влияние глобальных мировых событий и так далее. Клиенты мгновенно ощутят вашу осведомленность. Они захотят узнать подробности, понимая, что вы — профессионал, который досконально разбирается в своей области.</p>\n<p>Специфика вашего региона. Проанализируйте специфику бизнеса в вашем регионе, найдите особенности. Хотя общая аналитика по России важна, знание локальных нюансов ценится гораздо выше. Если в разговоре с клиентом вы начнете говорить о специфике местных предложений, это моментально поднимет вашу ценность как специалиста.</p>\n<p>Не ограничивайтесь только своим регионом, изучите информацию о соседних областях. Такой подход делает вас не просто продавцом, а настоящим профессионалом, способным предложить релевантные решения, которые, несомненно, оценят.</p>\n<p>Шаг Nº 2. Изучите клиента Изучите сферу клиента, узнайте типичные проблемы, с которыми он сталкивается. В бизнесе множество трудностей: от бухгалтерских и налоговых вопросов до сложностей в управлении персоналом. Сосредоточьтесь на тех аспектах, где ваш продукт может быть максимально полезен.</p>\n<p>Например, в области продаж клиенты могут сталкиваться с высокой текучкой кадров, низкой конверсией в закрытие сделки, проблемами мотивации команды.</p>\n<p>Первое, что важно понимать про клиента — это его боли. Помните, что люди всегда покупают от боли, и только иногда — для удовольствия. Если вы сейчас не понимаете потребности ваших целевых клиентов, у меня для вас плохие новости — вы очень далеки от рекордов. Первое, что нужно сделать — выписать ключевые проблемы, которые ваши потенциальные заказчики уже устали терпеть. Есть что-то, что им не просто не нравится, а жутко раздражает в текущей ситуации? Что им так мешает, что они хотят при первой возможности исправить? Выпишите боли ваших целевых клиентов, и вы прокачаете свою экспертность — это почувствуют уже на ближайшей встрече с вами!</p>\n<p>Допустим, вы занимаетесь продажей веб-сайтов и встречаетесь с клиентом, торгующим загородными домами в Сочи. Ваша экспертность для клиента заключается не в умении создать HTML-код и вставить его на страницу сайта, а в понимании того, как ваш продукт сможет оптимизировать его бизнесзадачи. Клиент не покупает у вас сайт, он покупает решение своих проблем: увеличение трафика, привлечение целевых покупателей, повышение числа заявок и продаж. Чтобы ставить рекорды, нужно говорить не о сайте, а о тех болях, которые закроет клиент благодаря вашему предложению.</p>\n<p>Например, предприниматель может сталкиваться с тем, что его текущий сайт недостаточно привлекателен или медленно загружается, что отпугивает потенциальных покупателей. Возможно, проблемы с тем, что сайт не отображается корректно на мобильных устройствах, а это критично для современного пользователя. Или же сайт не конвертирует посетителей в лиды, и продажи страдают. Ваша задача — понять, где именно самая слабая точка, и сформировать решение, которое поможет ее устранить.</p>\n<p>Ваше предложение должно строиться вокруг глубокой проработки болей и желаний клиента. Если вы начинаете разговор с пониманием его проблем и предлагаете конкретные действия, то сразу выделяетесь среди конкурентов.</p>\n<p>Заказчик почувствует, что вы знаете его бизнес, его рынок и понимаете его боли — и именно это станет решающим фактором выбора в вашу пользу.</p>\n<p>Шаг Nº 3. Задавайте точные вопросы Приведу простой пример, как точные вопросы позволяют продемонстрировать мою экспертность за секунды.</p>\n<p>Представим, что я продаю свою программу «Отдел рекордных продаж по системе АКВАРИУМ». Я созваниваюсь с клиентом, чтобы обсудить детали. И тут может быть два варианта развития событий. В первом случае я задаю вопрос: «Скажите, ваши сотрудники используют скрипты продаж при общении с клиентами?» Человек отвечает: «Да», — и я просто перехожу к следующей теме, которая уже не связана со скриптами.</p>\n<p>А теперь представьте, что при ответе «Да» я начинаю уточнять: «Как сейчас реализованы скрипты? Это документ или сервис? Кто их разрабатывал, был ли проведен полноценный тренинг или просто инструктаж?» Вдобавок после каждого уточняющего вопроса я комментирую, как эта информация поможет подобрать наилучшее решение ситуации. Думаю, тут не нужны разъяснения, в каком случае во мне увидят более компетентного специалиста.</p>\n<p>Я называю этот принцип «Копайте глубже». Ключ в том, чтобы задавать не просто один вопрос, а продолжать погружаться, раскрывая детали и нюансы. Каждое уточнение позволяет вам лучше понять ситуацию, а клиент видит, насколько вы внимательны к мелочам и осведомлены</p>\n<ul><li>сфере его интересов. Это демонстрирует вашу глубокую экспертность, в отличие от поверхностного подхода других менеджеров.</li>\n</ul>\nКлиент оставил заявку на ППМ (программа увеличения продаж). Первое общение Вариант 1 - Скажите, используют ли сотрудники скрипты при общении с клиентами? - Да-Спасибо! -Нет-Спасибо!\n<p>Вариант 2- Скажите, используют ли сотрудники скрипты при общении с клиентами? - Да - А как сейчас реализованы скрипты? Это текстовый документ или какой-то сервис?</p>\n<p>Разрабатывали сами или заказывали? Как давно? Когда внедряли, был тренинг полноценный или инструктаж по скрипту? -Нет - Ранее пробовали внедрять?</p>\n<p>Как обучаете менеджеров грамотно общаться с клиентами? Активно задавайте точные вопросы и погружайтесь в контекст проблемы клиента — это значительно усилит вашу позицию как эксперта и поможет построить доверие.</p>\n<p>Шаг Nº 4. Используйте цифры, примеры, ссылки Цифры. Включайте их в разговор с клиентом умеренно, но убедительно. Например, при обсуждении окупаемости продукта используйте конкретные цифры, которые особенно ценятся в сегменте B2B. Например: «Иван Иванович, при вашем среднем чеке в 70 тысяч рублей это окупается уже после первой сделки».</p>\n<p>Примеры. Рассказывайте клиенту о подобных случаях, с которыми вы уже сталкивались: «Иван Иванович, мы недавно работали с банком, и у них была похожая ситуация...</p>\n<p>Мы решили ее так...» Кейсы гораздо нагляднее демонстрируют ваш опыт, чем теоретические рассуждения.</p>\n<p>Ссылки. Используйте авторитетные источники для подкрепления своих слов: исследования, отчеты, статьи. Фразы вроде «Согласно последнему исследованию.», «Как показывают отчеты аналитиков...», «По статистике..» повышают доверие к вашим словам и подчеркивают вашу экспертность.</p>\n<p>Шаг Nº 5. Открыто говорите о рисках Многие продавцы опасаются обсуждения рисков, но я всегда предупреждаю клиентов о потенциальных проблемах.</p>\n<p>Рассмотрим пример, который можно использовать при продаже сайта. Вы говорите заказчику: — Иван Иванович, согласно статистике Google, в вашей отрасли до 80% посетителей заходят на сайты с мобильных устройств. Поэтому крайне важно оптимизировать его под смартфоны. Если это не учесть, вы рискуете потерять до 80% потенциальных заявок из-за неудобства пользования сервисом с телефона.</p>\n<p>Такие утверждения можно включить в вашу презентацию, даже если клиент сам не поднимал вопрос о мобильной версии. Вы можете заметить: — Учитывая, что многие покупатели вашей отрасли активно используют мобильные устройства, это может значительно повлиять на конверсию. Важно это учесть заранее.</p>\n<p>То есть вы показываете закзчику, что хотите подобрать оптимальное для него решение, чтобы он избежал возможных ошибок, и его это цепляет.</p>\n<p>У Нила Рекхэма, автора методики СПИН-продаж, есть на этот счет замечательная фраза: «Сейчас в мире очень много продавцов, которые помогут клиенту выбраться из ямы.</p>\n<p>Но лишь единицы помогут клиенту не оказаться в этой яме. И вот такие продавцы ценятся выше всего». Мой подход — помогать клиенту избегать ошибок.</p>\n<p>Шаг Nº 6. Покажите схему работы Этот шаг особенно эффективен, когда вы уже приближаетесь к закрытию сделки: представьте заказчику план работы. Но не простенькую схему, наспех нарисованную на первой попавшейся бумажке, а детально проработанный документ, где ясно обозначены этапы, конкретные задачи, сроки выполнения. Покажите подробную дорожную карту вашего движения к результату. Когда клиент видит такой документ, он думает: «Ничего себе, вот это профессионал!</p>\n<p>Как у него все продумано!» И доверие к вам сразу повышается. Когда вы демонстрируете экспертность, клиенты получают пользу от самого факта общения с вами.</p>\n<p>С экспертами хочется общаться. К ним хочется обращаться за советом. Золотое правило создания доверительных отношений с клиентом — при каждом взаимодействии давайте ему пользу.</p>\n<p>Многие этот момент упускают, сосредоточиваясь исключительно на продаже. Но что ощущает человек, когда при очередном звонке его снова дергают вопросом, подумал ли он и какое решение принял? Не более чем раздражение от чрезмерного давления. Поэтому перед каждым контактом спрашивайте себя: какую пользу клиент получит от вас в этот раз? Будет ли у него чувство, что только что он общался по делу? Если вам нечего добавить по самому предложению, найдите классный инфоповод, обсудите интересную статью или последние новости по теме бизнеса заказчика.</p>\n<p>В конце концов, всегда можно поднять настроение шуткой. Главное — делать это с умом и чувством меры.</p>", "level": 3}, {"title": "БЕЗ ОБМАНА", "html": "<p>Честность в продажах ценится даже выше компетентности. Потому что, если человек поймет, что вы его обманываете за счет своей экспертности, доверие будет безвозвратно утрачено. У меня были такие случаи, когда я общался с менеджерами, которые вроде бы и были специалистами, но их рассказы не выдерживали проверки.</p>\n<p>К нечестности в продажах могут прибегать начинающие продавцы. В погоне за сделкой они преувеличивают и обещают то, что будут не в силах выполнить. Например, клиент спрашивает: — За неделю сделаем ремонт?</p>\n<p>Продавец, зная, что работа займет не меньше месяца, отвечает. — Конечно, сделаем.</p>\n<p>Но зачем идти на такой обман? Может быть, заказчика устроил бы и месячный срок. Эксперт по продажам мог бы ответить: — У вас жесткие ограничения по срокам или вы уточняете, чтобы в целом иметь представление о сроках такого ремонта? За неделю будет выполнена часть отделки. При этом для завершения с учетом всех нюансов понадобится месяц. Посмотрим план работ?</p>\n<p>И клиент скажет: — Ну хорошо, месяц так месяц. То есть здесь даже больше не в честности дело, а в неумении коммуницировать. Из-за этого новичкам приходится приукрашивать. Это не только губит репутацию продавцов, но и негативно сказывается на их самочувствии. Работать в обмане — это вечный стресс.</p>\n<p>Ложь можно почувствовать не только по словам, которые вы говорите клиенту, но и вашей интонации, темпу речи, громкости голоса. Согласитесь, даже если вы не понимаете язык, по тону можно понять эмоции иностранного собеседника. Даже простое «Да» может быть сказано таким количеством оттенков, что каждый из них будет нести совершенно разный смысл.</p>\n<p>Внешний вид, жесты, мимика также могут выдать вашу нечестность. Представьте: вы говорите, что крутой эксперт, но ваше тело напряжено, а голос звучит неуверенно — это не убедит клиента. Или, например, вы утверждаете, что ваша цена абсолютно обоснована, и при этом опускаете взгляд и поджимаете губы, всем видом показывая, что сами не уверены в справедливости своих слов. Это обязательно заметят. Так быть не должно. Убедитесь, что ваш внешний вид и манера говорить отражают смысл ваших слов.</p>\n<p>Общение по телефону имеет свои особенности. Тут невербалика отсутствует, и акцент смещается на характеристики голоса. И уже то, как вы произнесете «Добрый день» формирует в голове клиента образ: руководитель вы или простой менеджер, с ценным предложением или обыкновенный спамер.</p>\n<p>КАКИЕ БЫВАЮТ ВИДЫ ОБМАНА? Менеджер приукрашивает характеристики продукта: описывает товар как более качественный, надежный или функциональный, чем он есть на самом деле.</p>\n<p>Пример: продавец знает, что сроки доставки будут минимум 21 день, но в желании закрыть сделку обещает клиенту доставку за 10 дней.</p>\n<ul><li><strong>1.</strong> Менеджер наделяет продукт несуществующими характеристиками: утверждает, что товар имеет особенности или возможности, которых на самом деле нет.</li>\n</ul>\nПример: продавец знает, что в районе еще нет садика и школы, но он утверждает, что они уже строятся.\n<ul><li><strong>2.</strong> Менеджер дает невыполнимые гарантии или обещает сверхрезультаты: продвигает результаты от использования товара, которые невозможно контролировать.</li>\n</ul>\nПример: вы точно похудеете на 20 кг, если в течение двух месяцев будете ежедневно пить наши биологически активные добавки.\n<ul><li><strong>3.</strong> Менеджер говорит, что приобретение товара возможно только в комплекте (навязывание). Помню, хотел купить ремешок Hermès на Apple Watch, и мне не продавали его отдельно. Продавец говорил, что покупка возможно только с часами. Такие ситуации часто возникают в период ажиотажа на какой-то товар. Это тоже обман. Не путайте навязывание с предложением дополнительных услуг. Предлагать уместные доппродукты — хорошо. А отказывать в покупке только потому, что клиент не готов купить больше, — ПЛОХО.</li>\n</ul>\n<ul><li><strong>4.</strong> Менеджер использует поддельные рекомендации: представляет ненастоящие положительные отзывы, чтобы убедить в качестве товара.</li>\n</ul>\nТакие ситуации неприемлемы в работе экспертов. Да, эти приемы могут помочь закрыть какие-то разовые сделки, но что в итоге? Вы получите негативные отзывы, будете испытывать ежедневный стресс и трудиться с ощущением, что постоянно врете людям.\n<p>Обманывая клиентов, вы раз и навсегда разрушаете отношения и перечеркиваете любое развитие в сфере продаж.</p>\n<p>Есть еще один вид обмана. Он не настолько очевидный, но встречается довольно часто — «обман самого себя».</p>\n<p>Если вы сами не верите в то, что говорите, ваш продукт не заинтересует клиента. Буквально недавно мне позвонил менеджер, который испытывал проблемы с продажами. — Здравствуйте, Не могу продать рекламу в справочнике: клиенты не верят, что это работает.</p>\n<p>Когда я услышал такую фразу, я задал один вопрос. Просто уточнил: — Скажите, а вы сами верите?</p>\n<p>И получил такой ответ: — Ну, я не знаю, сейчас такое время, может быть, не лучшее... — Видите, проблема не в том, что клиенты не верят.</p>\n<p>Вы сами не верите — и получается, вы с ними не честны. Когда вы сами не верите в предложение, попытки убедить клиента в его эффективности часто оборачиваются неудачей.</p>\n<p>Недостаток искренности мгновенно ощущается. Это не только затрудняет продажи, но и порождает внутренний конфликт, потому что при каждой попытке закрыть сделку вы словно переступаете через себя. Чтобы этого избежать, пересмотрите свой взгляд на товар. Найдите, в каких ситуациях и кому он действительно может быть полезен? Ответ поможет вам лучше понять потенциальных покупателей И не нужно будет ломать себя об колено, предлагая продукт всем и каждому.</p>\n<p>Помню, как однажды в одном из региональных офисов управляющий банком заявил мне: «Продажи — это всегда обман». Это вызвало у меня шок и недоумение. Как руководитель такого уровня может допускать такую мысль?</p>\n<p>Я даже задумался о его профессиональной пригодности. Как этот человек вообще заключает сделки? Я убежден, что продажи — это не обман. Работая в различных компаниях, я всегда стремился быть честным с клиентами. Конечно, в каждом предложении есть свои преимущества и недостатки.</p>\n<p>Но истинное мастерство продаж не в том, чтобы обсуждать характеристики продукта, а в том, чтобы подобрать для клиента решение, которые закроет его потребности и задачи наилучшим образом. И если вы сфокусируетесь на этом, у вас даже мысли не будет обманывать клиента и вводить его в заблуждение.</p>\n<p>КАК ПРОДАВАТЬ ЧЕСТНО И СТАВИТЬ РЕКОРДЫ? Правило 1. Никогда не притворяйтесь, что что-то знаете, если вы этого не знаете. Особенно это касается новичков, которые хотят впечатлить клиента своей «экспертностью».</p>\n<p>Если не уверены в ответе на сложный вопрос, лучше сказать честно: «Пока затрудняюсь ответить, но я уточню информацию и обязательно свяжусь с вами». Ничего в этом страшного нет.</p>\n<p>Правило 2. Не искажайте факты и не преувеличивайте. Если продукт не обладает каким-то свойством или на его доставку требуется больше времени, так и скажите. Вводить клиента в заблуждение — краткосрочная выгода, которая в конечном итоге только навредит вашей репутации.</p>\n<p>Правило 3. Делайте больше искренних комплиментов. Меньше заученных фальшивых фраз. Произносите приятные слова от сердца и в подходящий момент — это создает позитивную атмосферу и укрепляет связь с клиентом.</p>\n<p>Правило 4. Предупреждайте о возможных рисках. Это показывает не только вашу осведомленность в теме и профессионализм, но и демонстрирует искреннее желание провести сделку максимально открыто и честно.</p>\n<p>Правило 5. Обещайте меньше, делайте больше. Не наоборот. Это формирует долгосрочное доверие и лояльность, делая вас надежным партнером в глазах клиента.</p>\n<p>Еще один лайфхак, который повысит к вам доверие и создаст правдивое представление о вашем товаре — упоминание мини-недостатков. Клиенты скептически относятся к услугам, в которых «все гладко и сладко». Сразу хочется найти какой-то подвох, согласны?</p>\n<p>Чтобы показать, что ваше предложение реальное, а не из рубрики «фантастика», разбавьте плюсы парой несущественных недостатков, которые не умаляют основных преимуществ.</p>\n<p>Скажите, что у вас классный продукт, выгодная цена на фоне конкурентов, нет перебоев со сроками поставки и тут же добавьте: «Единственное, мы находимся в самом центре города, там не всегда удобно с парковкой. Чтобы не тратить время на поиск, позвоните, пожалуйста, заранее, и мы договоримся по поводу места для вас». У клиента в этой ситуации в голове складывается картинка, что все в целом хорошо. Да, есть какие-то нюансы, которые не связаны с качеством вашей работы, но они не существенны.</p>\n<p>Такие мини-недостатки демонстрируют вашу честность, снимают напряжение у заказчика, который пытается найти минусы в вашем предложении. Используйте эту технику, чтобы ваша презентация звучала максимально естественно и убедительно.</p>\n<p>Еще один шаг к завоеванию доверия — конкретное обещание. Фраза «В любом случае есть гарантия..» кратно повышает ваши шансы на закрытие сделки, каким бы бизнесом вы ни занимались. Это подкрепляет ваши слова о качестве продукта. Не просто обещание, а ваше обязательство перед клиентом, которое укрепляет доверие.</p>\n<p>Приведите примеры: «Если возникнут проблемы, вот наши шаги по их устранению... И вот так вы можете претендовать на гарантию». Это снижает риски для покупателя и подчеркивает вашу ответственность. Если вы ведете себя открыто и показываете, что даже с юридической точки зрения у вас все прописано, это сразу дает вам дополнительные очки.</p>\n<p>Также вам доверятся быстрее, если использовать в коммуникации разные каналы передачи информации. Если вы все время переписываетесь с покупателем, иногда полезно созвониться по телефону и использовать голос, чтобы усилить контакт. Говорите уверенно и четко, чтобы даже на том конце провода человек почувствовал, что вы сейчас не зажаты, а раскованно сидите в кресле и предлагаете самый лучший продукт в компании. Но, даже если вы общаетесь только по переписке, сделать текст более живым помогут эмодзи, картинки или видео. Важно умело сочетать все способы общения, чтобы максимально расположить к себе клиента.</p>", "level": 3}, {"title": "ТОЧКИ СОПРИКОСНОВЕНИЯ", "html": "<p>Точки соприкосновения — последний компонент формулы доверия в продажах. Чем больше у вас общего с человеком, тем сильнее и быстрее формируется подсознательная связь между вами. Это может быть что угодно: одинаковые хобби и интересы или даже просто схожие жизненные обстоятельства. Смотрите по сторонам, отмечайте детали: например, на столе у клиента стоит статуэтка слона из Таиланда или маленькая фигурка Марадоны — вот вам и повод обсудить футбол или поделиться впечатлениями о последнем путешествии. Это сближает и создает ощущение единодушия.</p>\n<p>В бизнес-контексте точка соприкосновения может выглядеть так: «Мы работаем в этом районе Москвы более 10 лет, и мне приятно, что вы открываете свое представительство рядом с нами». Или вы вдруг выясняете, что выступали участниками на одном форуме, публиковались в одном журнале или давали рекламу на одних и тех же площадках. То есть какие-то факты, которые вроде бы существенного влияния на сделку не имеют, но очень полезны с точки зрения системы распознавания — «свой-чужой». Если покупатель определяет, что вы свой, доверие к вам сразу повышается.</p>\n<p>Если вы все еще чужой — его придется завоевывать.</p>", "level": 3}, {"title": "ТЕХНИКА «ПТС»", "html": "<p>Как стать для клиента своим? Ваша задача как человека, который продает, найти хоть что-то, что вас может связать.</p>\n<p>Даже если на первый взгляд кажется, что между вашими интересами пропасть. Это может быть один знакомый, чья-то рекомендация или какой-то другой фактор, создающий мостик между вами. Искать общее — тоже навык.</p>\n<p>Не всегда точки соприкосновения лежат на поверхности, но, если вы их найдете, расположите к себе потенциального покупателя еще больше.</p>\n<p>В моей копилке методик продаж есть уникальная техника, которая называется «ПТС» — «Покажите точки соприкосновения». Я разработал ее в начале 2010-х в рамках курса «10 звонков — 10 продаж». Мне нужно было выяснить, почему одни звонки становятся эффективными, а другие — нет.</p>\n<p>Мой вывод был неожиданным: когда в разговоре с «холодными» клиентами появляется точка соприкосновения, конверсия заметно возрастает. Подборку этих точек соприкосновения я упаковал в технику «ПТС».</p>\n<p>Первая точка — сфера бизнеса клиента. При первом контакте можете сказать: «Звоню вам, потому что вы занимаетесь таким-то бизнесом, а мы как раз с ними работаем». Первая фраза — о покупателе, вторая — о вас, и делаете вывод, что есть определенная связь.</p>\n<p>Вторая — сайт компании. Начните телефонный разговор или переписку с фразы: «Я сейчас нахожусь на вашем сайте, у вас очень крутые рейтинги, вы быстро растете, мы тоже этому уделяем внимание..» Такой заход мгновенно создает более теплую атмосферу, так как клиент видит, что вы уже вовлечены в его бизнес и потрудились узнать о нем больше.</p>\n<p>А раз вы «в гостях», то и выгонять вас сразу будет уже некультурно, и собеседник с большей вероятностью идет на контакт.</p>\n<p>Третья — упоминания в СМИ. Если вы наткнулись на статью о компании клиента или на их рекламу, это станет отличным поводом для начала разговора. Можно сказать: «На глаза попалась ваша статья, меня так зацепили изложенные мысли, что я решил тут же с вами связаться». Или при встрече упомянуть: «Хорошо, что получилось лично встретиться. Как раз недавно о вас читал..» Это сближает и демонстрирует вашу заинтересованность в деятельности клиента.</p>\n<p>Четвертая — изменения в жизни компании. Если вы заметили какие-то важные перемены в компании, например, открытие нового офиса или обновление автопарка, используйте это как стартовую точку для диалога.</p>\n<p>Пятая — рекомендации. Они могут быть как внешними, так и внутренними. Внешние рекомендации исходят от партнеров или контрагентов. Зайти можно с такой фразы: «Звоню по рекомендации наших партнеров, они убеждены, что наше предложение будет вам интересно». Внутренние рекомендации — это когда вы ссылаетесь на какого-то сотрудника компании. Например: «Я только что общался с вашим коллегой, он посоветовал обратиться именно к вам..» В этой ситуации вы уже не просто незнакомец с улицы, а человек, имеющий связи внутри коллектива, что автоматически повышает к вам доверие.</p>\n<p>Шестая — успешный опыт работы с данным сегментом (в своем регионе и других). Например, при звонке в стоматологическую клинику можно сказать: «Звоню вам, так как у нас есть успешный опыт работы с учреждениями вашего профиля, включая проекты, реализованные в нашем и соседних регионах». Получается интересный заход, когда контакт вроде холодный, но вы создаете впечатление, что не только знакомы со спецификой бизнеса клиента, но и имеете конкретные достижения в этой сфере. И с вами уже интереснее разговаривать. Естественно, все вышеперечисленное работает, когда это действительно так. Если у вас нет успешных проектов, не надо их придумывать!</p>\n<p>Седьмая — актуальные изменения в законодательстве также могут стать отличным поводом для связи с клиентом.</p>\n<p>Вы можете позвонить и напомнить о правках в действующих законах, а после предложить обсудить это.</p>\n<p>Восьмая — «Я сам ваш клиент». Если вы действительно клиент какого-то ресторана или фитнес-клуба и решили с ними поработать, то эту точку соприкосновения тоже можно использовать как весомый аргумент при установлении бизнес-контакта. В этом случае можно сказать: «Как ваш постоянный клиент, я хотел бы обсудить...» Это не только создает ощущение доверия, но и показывает вашу личную заинтересованность в услугах потенциального покупателя.</p>\n<p>Помню историю моего ученика Дмитрия, который продавал оборудование для управления вентиляционными системами через холодные звонки. За несколько месяцев работы по системе он привлек 30 новых клиентов на 10 миллионов рублей. Дмитрий проработал свои страхи общения с незнакомцами, стал в начале диалога уверенно применять технику «ПТС» и задавать грамотные вовлекающие вопросы.</p>\n<p>Выбирайте для себя наиболее оптимальные точки соприкосновения, адаптируйте под любой способ общения — технику «ПТС» можно использовать не только в холодных звонках, но и в переписке, и при живых встречах — и укрепляйте вашу связь с клиентом еще больше.</p>", "level": 3}, {"title": "ТЕХНИКА «АЙСБЕРГ»", "html": "<p>Техника, которая предлагает выйти за пределы обычного делового общения с клиентом и открыть новый уровень взаимодействия. Это похоже на погружение в невидимую часть айсберга, где скрыто то, что человек не показывает при первой встрече: например, интересы и увлечения. для большего контакта с потенциальным покупателем задавайте ему вопросы, касающиеся не только работы, но и более личных тем, например, отпуска, планов на выходные, спортивных интересов. Конечно, делать это нужно аккуратно, если он готов обсуждать с вами подобные темы, и не выходя за рамки приличия.</p>\n<p>Продавать — это не про подвешенный язык, как многие считают, и не про впаривание, а про умение слушать других и понимать, что они хотят.</p>\n<p>С самого начала работы в продажах я внимательно относился к клиентам и вел учет отношений с каждым из них в CRM-системе!. Эта программа была моим главным активом. В карточках я указывал телефоны, адреса электронной почты, историю и анализ проведенных сделок. Даже дни рождения записывал. Так вот, каждое утро, перед тем как приступить к рабочим делам, я открывал календарь в CRM и смотрел, кто из клиентов сегодня именинник. Однажды в окошке с датой появилось имя главного бухгалтера одной компании, которая на тот момент сотрудничала с другим банком. Представьте, каково было удивление женщины, с которой мы виделись всего-то раз, когда я ее поздравил с днем 1 Специальная программа, в которой менеджер может посмотреть всю историю взаимодействия с клиентом. — Прим. ред. рождения. То, что она была в шоке — это ничего не сказать!</p>\n<p>Даже банк, с которым они сотрудничают, не поздравил ее, а я, посторонний человек, позвонил и сказал пару теплых пожеланий. После этого у нас сложились рабочие отношения, а я сделал из такого подхода к общению с клиентами свою фишку.</p>\n<p>Профессиональные праздники, дни рождения, важные даты — когда вы проявляете интерес к жизни человека, это выделяет вас на фоне других. А еще позвонить и поздравить</p>\n<ul><li>лишний повод напомнить о себе. Делитесь личным и сами, тогда вы станете не просто менеджером компании, который предлагает какой-то продукт, а тем «классным парнем, который собирался отдыхать с семьей на море и болеет за ЦСКА». Чем больше клиент знает о вас, тем больше вам доверяет.</li>\n</ul>\nСледующий прием, направленный на усиление связи между продавцом и покупателем — это подстройка. Не будем рассматривать подстройку по языку тела, голосу и модальностям: об этом полно информации в интернете. Гораздо важнее подключиться к психотипу клиента. Все люди разные: кто-то лучше воспринимает цифры, а кого-то они раздражают, и им проще поговорить на отвлеченные темы. А бывает, что сразу настроены общаться по существу.\n<p>Главное — с самого начала контакта с человеком распознать его тип характера и адаптировать дальнейшее общение именно под него. Тогда клиенту будет проще усвоить информацию, и он с большей вероятностью согласится на сделку с вами.</p>\n<p>Помните, что доверие устанавливается не только в процессе общения, но и до общения с вами, и после. В зависимости от специфики бизнеса и вашей роли в компании вы можете влиять на разные этапы формирования уверенности в вас.</p>\n<p>Первый этап — до встречи. Раньше, в эпоху без интернета, представление о продавце складывалось в процессе непосредственного общения. Сегодня клиенты не ждут момента Х, а сами ищут информацию о компании или эксперте, читают отзывы и на основе этого формируют свое мнение.</p>\n<p>Положительные комментарии и отклики повышают доверие, негативные - снижают или полностью разрушают.</p>\n<p>Второй этап — в процессе общения. Здесь все зависит от того, насколько умело вы применяете свои навыки коммуникации. Каждое ваше слово, каждое действие имеет значение.</p>\n<p>Бывает так, что менеджер, сильно желая понравиться клиенту, начинает заискивать, натянуто улыбаться, демонстративно повторять жесты и позы собеседника. А представьте, если он — еще и взрослый мужчина 45 лет? Конечно, выглядит нелепо и комично. Никакое доверие в такой ситуации не появится.</p>\n<p>И третий этап — после встречи. Клиенты часто проводят собственное расследование о вас — оценивают надежность и умение держать слово. Бывает, что вы обещали перезвонить или отправить коммерческое предложение... и забыли. Уровень доверия сразу падает. Ваши микродействия крайне важны для развития и укрепления доверия. Их выполнение делает вашу репутацию неуязвимой, а пренебрежение ими — хрупкой.</p>\n<p>Подумайте о ваших текущих клиентах. Продолжаете ли вы выстраивать отношения после первой сделки или же ставите галочку в базе и спокойно забываете о них?</p>\n<p>Ваша цель — не просто завоевать доверие, но и удерживать его. От того, как вы работаете сейчас, как вы относитесь к покупателям, какие касания делаете, будут зависеть ваши будущие продажи. Сохранять и развивать отношения с клиентом после сделки — отдельный навык, который мы прокачаем в конце книги, в главе «Мы вместе надолго».</p>\n<p>А как у вас с доверием? Помогает ли вам этот навык продавать больше? Проведите небольшой аудит вашей работы, основываясь на принципах, раскрытых в этой главе, и двигайтесь дальше. В следующей главе вы узнаете, почему люди вообще покупают, научитесь разгадывать ключевые потребности клиентов и познакомитесь с воронками вопросов, которые плавно подведут к успешному закрытию сделки.</p>", "level": 3}, {"title": "НАВЫК ПРОЯСНЕНИЯ", "html": "", "level": 3}, {"title": "СИТУАЦИИ", "html": "", "level": 3}, {"title": "Практический инструмент: Личная упаковка менеджера", "html": "<ul><li><strong>1.</strong> Внешний вид: Прическа, одежда, аксессуары, запах. Это поможет создать доверие на этапе первого впечатления, чтобы клиент с радостью обращался к вам.</li>\n</ul>\n<ul><li><strong>2.</strong> Соцсети: Соцсети помогают искать новых клиентов и формировать доверие, продавать свою экспертность за счет фото, видео, полезных постов и т.д.</li>\n</ul>\n+Фото профиля и истории\n<p>+Описание профиля</p>\n<p>+Актуальные истории про продукты</p>\n<p>+Посты с полезной информацией для</p>\n<p>клиентов (решение их проблем,</p>\n<p>интересные кейсы, советы)</p>\n<p>Профиль должен выглядеть профессионально.</p>\n<ul><li><strong>3.</strong> Мессенджеры: Все чаще общение с клиентами проходит в мессенджере. Самая частая ошибка новичков — отсутствие профессиональной упаковки профиля (Личный профиль без фото или с фото «на кухне» — плохо. Хорошо —профессиональный, с деловыми фото).</li>\n</ul>\n+Делайте деловые фото профиля.\n<p>+Начните проверять сообщения перед отправкой, исправлять опечатки.</p>\n<p>+Делите текст на абзацы, пункты.</p>\n<p>+Добавляйте эмоции с помощью смайлов.</p>\n<p>+Используйте не только текст, но и фото, видео, созванивайтесь для важных вопросов.</p>\n<p>4 E-mail: E-mail до сих пор является рабочим способом коммуникации. Пишите письма аккуратно, добавьте цепляющую внимание тему и продающую подпись.(Плохо — просто текст. Хорошо — структурированный текст).</p>\n<p>+ Тема.</p>\n<p>+Абзацы и заголовки для каждого абзаца.</p>\n<p>+Обращение по имени.</p>\n<p>+Подпись с дополнительной информацией о себе, фото.</p>\n<hr>\n<hr>", "level": 4}]}, {"id": 7, "part": "ЧАСТЬ II. 8 НАВЫКОВ РЕКОРДНЫХ ПРОДАЖ", "partIdx": 1, "title": "Глава 7. Навык 4: Прояснение ситуации", "bodyHtml": "<p>Однажды я и сам участвовал в тренинге. Известный бизнескоуч приехал провести обучение среди сотрудников нашего филиала. И первое упражнение досталось мне: продать зарплатный проект руководителю компании за пять минут.</p>\n<p>Это определенно был вызов — обычно мои встречи с клиенТОм ДЛЯтСя окоЛо 40 минут, но никак не пять. Тем не менее я не сомневался, что если увеличу скорость презентации, то на раз справлюсь с поставленной задачей. Я начал без остановки шпарить про преимущества продукта. Говорил и говорил, с полной уверенностью, что все отлично получается. Под конец речи я уже ждал ободряющих комментариев и довольной улыбки тренера, но его лицо оставалось непроницаемым.</p>\n<p>Более того, он хитро ухмыльнулся и произнес: «Ты, конечно, молодец, расхвалил предложение со всех сторон, но давай посмотрим, что чувствовал клиент, пока ты с ним общался?»</p>\n<p>И дальше пошел полный разнос моего выступления. Как сейчас помню неутешительное резюме: «Пер как танк».</p>\n<p>За те пять минут, которые мне были отведены, я так хотел выдать максимум информации про зарплатный проект, что совсем забыл про собеседника. За все время нашего взаимодействия даже ни разу не дал ему вставить хоть какое-то слово. Тогда я понял, что выбрал ошибочную тактику поведения, а фраза тренера «пер как танк» оказалась правдива.</p>\n<p>Я действительно давил и был сконцентрирован на желании продать, а надо было три минуты из пяти посвятить клиенту, внимательно выслушать, что он хочет, и ответить на все интересующие его вопросы. И только в две оставшиеся минуты уложить рассказ о предлагаемом продукте.</p>\n<p>Уверен, вы периодически сталкиваетесь с ситуацией, когда на ваш вопрос о товаре или услуге продавец тут же начинает выдавать все, что знает. Тараторит без остановки, как будто от количества информации зависит ваше решение о покупке.</p>\n<p>Многие менеджеры из-за неопытности и непонимания технологии продаж убеждены, что «рассказ о продукте» — ЭтО решающий этап для закрытия сделки.</p>\n<p>Когда я начинал свой путь в этой сфере и готовился ко встречам, то всегда думал о том, что буду рассказывать клиенту, чтобы он купил мой продукт. Но чем опытнее становился, тем сильнее смещался фокус моего внимания в процессе подготовки. Со временем я стал думать не о том, что расскажу, а о том, что спрошу, чтобы наверняка закрыть сделку.</p>\n<p>Вопросы в продажах обладают огромной силой. Они позволяют сосредоточиться не на продукте, а на клиенте и его потребностях. Если вы будете задавать грамотные вопросы и внимательно слушать ответы, то без труда поймете, что нужно сказать в презентации, чтобы человек купил без возражений.</p>\n<p>Какие потребности бывают у клиентов и как научиться их определять? Давайте разберемся.</p>\n<p>ЧЕГО НА САМОМ ДЕЛЕ ХОТЯТ КЛИЕНТЫ? Чтобы понять, чего на самом деле хотят покупатели, нужно сделать всего три шага:</p>\n<ul><li><strong>1.</strong> Разобраться, какие потребности бывают у клиентов. Я выделяю шесть основных.</li>\n</ul>\n<ul><li><strong>2.</strong> Задать правильные вопросы, которые помогут определить, какие потребности основные.</li>\n</ul>\n<ul><li><strong>3.</strong> Суметь внимательно выслушать клиента и выделить в его словах ключевые смыслы. Сейчас мы разберем каждый пункт подробнее, и уже в конце этой главы у вас будет мощнейший инструмент для понимания потребностей других людей.</li>\n</ul>\nПервый шаг. Чтобы понимать, потребности конкретного клиента, нужно понять, а какие потребности в принципе бывают у людей.", "sections": [{"title": "ТЕХНИКА «У БЭ П ПГ Н»", "html": "<p>Представьте, вы в мире шифров: каждый клиент — это код, который нужно разгадать. Предлагаю воспользоваться классификацией «У Б Э П ПГ Н», которую мои ученики в шутку расшифровывают как «управление по борьбе с экономическими преступлениями». Я познакомился с этой системой, когда начал работать тренером по продажам и учился в корпоративном университете. На одном из занятий преподаватель дал нам эту аббревиатуру и сказал, что каждая буква обозначает ту или иную потребность потенциального покупателя.</p>\n<p>У — удобство. Клиенту важно, чтобы ваше предложение было легким в использовании. Взял и применил. Без заморочек.</p>\n<p>Б — безопасность. Клиенту важны гарантии, дополнительные документы, чтобы не было причин волноваться, что он чем-то рискует.</p>\n<ul><li>— экономия. Предложение должно вписываться в бюджет клиента и желательно не тратить много времени на реализацию.</li>\n</ul>\nП — престиж. Клиент выберет ваш товар или услугу, потому что ему важно подчеркнуть ими свой статус. Почти все премиальные бренды делают на это ставку.\n<p>ПГ — принадлежность к группе. Клиенты, которым это важно, спрашивают: «А что другие обычно выбирают?» Вспомните раздел «Отзывы» — каждый из нас иногда заглядывает узнать, что думают о товаре другие покупатели. Все люди ориентируются на общественное мнение — кто-то больше, кто-то меньше.</p>\n<p>H — новизна. Для многих это принципиальная потребность: испытать новые ощущения, попробовать что-то необычное, небанальное, чего еще ни у кого не было.</p>\n<p>Разберем каждую потребность на примере. Вспомните, в каком магазине вы покупали продукты последний раз?</p>\n<p>Почему именно там? Может быть, он был рядом с домом? Или там была выгодная акция «1+1»? А может потому, что там всегда свежие продукты? У каждого из вас свои причины покупки, и за каждой из них стоит одна или несколько потребностей из «У Б Э П ПГ Н».</p>\n<p>Ниже описаны: Причина покупки именно в этом супермаркете - Потребность по «УБЭППГН»</p>\n<p>Рядом с домом, быстрое обслуживание - У — удобство Свежие натуральные продукты - Б - безопасность Выгодные цены, распродажа, акции - Э - экономия Эксклюзивные товары, лучший сервис - П — престиж Магазин поддерживает социальные проекты, программа лояльности для держателей карт - ПГ — принадлежность к группе Новые группы товаров - Н - новизна Это работает во всех сферах. Например, компания продает окна в розницу. Если клиент хочет, чтобы окно удобно открывалось, обеспечивало шумоизоляцию и легко монтировалось — это потребность в удобстве. Клиент спросил: «А можно добавить замки, чтобы дети не могли открыть?» — добавляйте в список потребностей безопасность. Если хочет, чтобы цена не била по карману, это про экономию. Обязательно нужны окна определенного бренда, да еще и панорамные? Тогда речь идет о престиже. Если вдобавок спросит: «Что чаще берут другие? » — это о принадлежности к группе. А если человек интересуется, есть ли окна с дистанционным управлением или датчиками, регулирующими положение в зависимости от погодных условий, то это новизна.</p>\n<p>Каждый продукт можно разложить на эти шесть ключевых пунктов. Даже если вы продаете в сегменте B2B, помните, что в итоге решение о сделке принимает человек, и он будет исходить из своих потребностей.</p>\n<p>Научитесь читать между строк и углубляться в истинные мотивы своих клиентов, тогда начнете продавать эффективнее и больше.</p>\n<p>Теперь, когда вы знаете, какие вообще существуют потребности, важно понять как распознавать их у каждого конкретного клиента. Что самое значимое для человека при покупке? Нехватку чего он стремится закрыть в первую очередь? Ответив на эти вопросы, вы узнаете ключевую потребность покупателя. Ее я называю «красной кнопкой».</p>\n<p>Почему профессионалы продают очень легко и уверенно? Потому что быстро распознают «красную кнопку» клиента и в процессе презентации постоянно давят на нее, показывая, что понимают его уникальные желания. Покупатель чувствует, что ваша цель не просто реализовать продукт, а предложить решение, идеально подходящее его ситуации.</p>", "level": 3}, {"title": "ВОПРОСЫ НА МИЛЛИОН", "html": "<p>Второй шаг — разобраться, какие именно вопросы нужно задавать, чтобы понять ключевые потребности клиента.</p>\n<p>Многие менеджеры совершают грубейшие ошибки в коммуникации и в итоге срывают большинство сделок. Освоение искусства правильно задавать вопросы может радикально изменить исход ваших взаимодействий с покупателями и повысить эффективность продаж. Рассмотрим ТОП-3 ошибок.</p>\n<ul><li><strong>1.</strong> Эксперт вообще не задает вопросов. Многие после приветствия клиента сразу переходят к презентации. Например, покупатель заходит в ваш магазин за новым электрическим чайником и спрашивает: — Расскажите, какие чайники у вас есть?</li>\n</ul>\nИ вы тут же начинаете выдавать сведения по всем моделям, что есть в наличии, даже не поинтересовавшись желаниями клиента. В итоге человек походит-посмотрит и уйдет без покупки, потому что останется еще в большем замешательстве от чрезмерного и сбивающего с толку потока информации.\n<p>Также часто бывает, что продавец считает, что и так понятно, «что нужно клиенту», и делает презентацию на основе собственных предпочтений. Например, презентует самую дешевую модель чайника с акцентом на экономию: — Вот этот вариант сейчас по акции, выйдет подешевле.</p>\n<p>Но при этом менеджер не спросил, а есть ли необходимость в экономии у клиента. Если бы он задал правильные вопросы, то узнал, что на самом деле человек хотел купить дорогой брендовый чайник, который идеально подойдет к его новой кухне из премиальных материалов. Надавив на «красную кнопку» — потребность в престиже — продавец закрыл бы сделку. Но что произошло в итоге? Покупатель вежливо поблагодарил и пошел в соседний магазин за тем чайником, который ему нужен. Такие ошибки не только уменьшают средний чек, но и часто срывают сделки даже с теплыми клиентами.</p>\n<p>Задавайте вопросы! Они помогают быстро докопаться до сути проблемы, не создавая при этом ощущения давления. Вдобавок ваша сделка может стать намного выгоднее.</p>\n<p>Как сейчас помню продажу своего первого крупного проекта по консалтингу, которым занимался в свободное от работы время. В удовольствие, без планов и целей, просто потому что мне нравилось этим заниматься. Соответственно, досконально рынок я не знал, у меня не было продуманных тарифов за работу. И тут я получил запрос на усиление отдела продаж. Когда заказчик спросил, сколько стоят мои услуги по доработке скриптов и воронки, в голове проскочила мысль: «Ну, тысяч за 30 помогу, задач-то немного, и для меня совсем не сложно!»</p>\n<p>Но перед тем, как называть цену, я решил уточнить у клиента его ожидания по бюджету. Тот без запинки ответил: «Готов заплатить 100 тысяч». Вот это да! За эти деньги в то время я мог не только усилить скрипты и воронки, но и построить отдел продаж с нуля. Благодаря грамотным и своевременно заданным вопросам я смог лучше понять ситуацию покупателя, его ожидания и предложить полноценное решение в рамках комфортной для него суммы.</p>\n<p>Задавать правильные вопросы, которые помогают «распаковать» ситуацию клиента, довольно сложно. Этому нужно учиться. У меня самого не все получалось с первого раза.</p>\n<p>Я так боялся упустить какой-то из вопросов, что заучивал их. Иногда настолько концентрировался на том, какой задать дальше, что не слушал собеседника. Спрашивал о чем-то, а оказывалось, что человек уже предоставил эту информацию. Очень неловкие моменты.</p>\n<ul><li><strong>2.</strong> Эксперт задает слишком много вопросов Бесконечный поток уточнений может вызывать ощущение допроса. Покупатель отстранится и начнет отвечать сжато и неохотно, а вы, в свою очередь, можете упустить важные детали. Чтобы такого не произошло, очень важно получить право спрашивать. Как это сделать? Можно воспользоваться приемом «Программирование» (о котором я впервые узнал от Сергея Азимова), суть в том, что вы проговариваете сценарий вашей встречи или разговора. Например, можно сказать: «Чтобы подобрать для вас лучший вариант, я задам несколько вопросов. Затем предложу возможные решения вашей ситуации, и, если они вас устроят, мы обсудим следующие шаги, хорошо? »</li>\n</ul>\nПрограммирование устанавливает четкий план , и, если клиент этот план принимает, можете спокойно переходить к вопросам — вы получили на это право.\n<p>Используйте эту технику не только на первой встрече, но и во время каждой последующей — людям проще настроиться на контакт, когда им обозначают четкую последовательность действий. Программирование особенно эффективно в теплых звонках и переписке. В холодных звонках оно тоже актуально, но здесь требуется больше такта и осторожности.</p>\n<ul><li><strong>3.</strong> Эксперт задает только технические вопросы (не продающие) Технические вопросы помогают нам понять размеры, габариты, город доставки, наличие на складе и так далее. Они не вызывают сложностей, и менеджеры охотно их задают. — Какого размера вам нужны окна? — Сколько менеджеров планируете обучить в «Школе личных продаж»? — В какой город планируете доставку?</li>\n</ul>\nДа, эти уточнения необходимы, но только для базовых расчетов. Понять истинные потребности клиента, сформировать его доверие и закрыть сделку они не помогут. Вы можете составить смету проекта, но клиент скажет: «Все хорошо, я пока подумаю».\n<p>Иногда технические вопросы становятся показателем неклиентоориентированности, так как покупатель может просто не владеть терминами, которые вы используете.</p>\n<p>Однажды я пришел на почту за доставкой. Подал оператору извещение и спросил: «Могу я получить посылку?»</p>\n<p>Сотрудник почты долго ее искал, перебирал отправления в коробках, а потом, наконец, нашел и с недовольным видом заявил: «Так у вас не посылка, а мелкий пакет». Совсем не клиентоориентированный подход, согласны? Последнее, что мне хотелось узнать — это технические нюансы почтовой классификации. Эта ситуация иллюстрирует общую проблему в клиентском обслуживании: часто специалисты настолько погружены в технические детали своей работы, что забывают о главном — потребностях человека, которые желательно удовлетворить максимально быстро, просто и понятно.</p>\n<p>Все вопросы в продажах можно разделить на несколько типов по форме и по смыслу. По форме они бывают открытыми, закрытыми и альтернативными.</p>\n<p>Открытые вопросы. Зачем? Почему? Как? То есть вопросы, которые подразумевают развернутый ответ. Задавая их, вы приглашаете поделиться своими мыслями и переживаниями, что позволяет вам лучше понять ситуацию. Однако следует помнить, что не каждый клиент будет разговорчив.</p>\n<p>Закрытые вопросы. Предполагают ответ «да» или «нет». Такие вопросы — отличный способ быстро получить конкретный ответ или уточнить неясный момент.</p>\n<p>Альтернативные вопросы. Предполагают выбор ответа из нескольких альтернатив («или»). Дают клиенту чувство контроля над ситуацией, предоставляя ему самому решить, что выбрать из предложенных условий или опций. Помогают выявить скрытые желания и предпочтения.</p>\n<p>Как этим пользоваться на практике? Важно понять, что любой вопрос вы можете упаковать в нужную форму. Из закрытого сделать открытый и получить более развернутый ответ. И наоборот.</p>\n<p>Хотите в начале встречи узнать больше информации от клиента — дайте возможность ему говорить, задавая открытые вопросы.</p>\n<p>Закрытый - Вы используете сахар при производстве печенья? Альтернативный - вы используете сахар или заменитель сахара при производстве печенья?</p>\n<p>Открытый - Какие ингредиенты вы используете при производстве печенья? Я почти не умел задавать вопросы, которые развивают и углубляют беседу. Мои диалоги с клиентами напоминали игру в одни ворота, где каждое сухое «Да» или «Нет» все больше уводило от завершения сделки. Это проблема многих менеджеров по продажам. В то время мне в руки попала книга, которая и помогла разобраться — «Искусство задавать вопросы» Веры Биркенбиль. Надеюсь, она поможет и вам.</p>\n<p>И, хотя форма вопроса важна, но это не самое главное в продажах. Чтобы ставить рекорды, нужно уметь задавать вопросы, разные по смыслу. Именно смысл делает разговор продающим — это повышает доверие, показывает вашу экспертность и, самое главное, позволяет понять реальные потребности ваших клиентов.</p>\n<p>Для подготовки вопросов с разными смыслами я использую технику «СОПРАНО».</p>", "level": 3}, {"title": "ТЕХНИКА «СОПРАНО»", "html": "<p>С этой техникой у вас больше никогда не будет ощущения, что вы не знаете, что спросить у клиента! Вы сможете умело сочетать разные типы вопросов, будете интересным собеседником и, самое главное, сможете понять, что действительно важно для покупателя.</p>\n<p>Наталья в 32 года ушла из найма и начала с нуля продавать медицинское оборудование. «Заявок было мало, и я не понимала, почему клиенты не покупают. Я стала работать по системе и горжусь тем, что теперь на этапе переговоров не задаю банальные вопросы, а пытаюсь докопаться до самой сути.</p>\n<p>У меня есть подборка вопросов по СОПРАНО. Я полностью пересмотрела свое общение с клиентами, стала более внимательна к ним. Сейчас я открыла ИП и работаю сама на себя!</p>\n<p>Мой доход вырос в два раза, и я съездила на море с ребенком первый раз в жизни!» — это прекрасные результаты, которые наглядно показывают, что вопросы обладают огромной силой и в буквальном смысле влияют на качество нашей жизни.</p>\n<p>Каждая буква аббревиатуры СОПРАНО подразумевает определенный тип вопроса, который нужно задать клиенту для прояснения ситуации.</p>\n<p>С — ситуационные вопросы. Сюда относятся все технические и квалификационные вопросы, которые менеджер задает, чтобы выяснить, что конкретно нужно покупателю в его обстоятельствах.</p>\n<p>Примеры таких вопросов: — Для скольких помещений вашего бизнес-центра нужно разработать дизайн? — На какой адрес оформить доставку? — Сколько сотрудников работает в вашем отделе продаж?</p>\n<p>О — опыт. Вопросы о предыдущем опыте клиента: какими товарами или услугами он пользовался и насколько удачно.</p>\n<p>Примеры таких вопросов: — Ранее заказывали тренинги для менеджеров? — Что хотели бы учесть на основе опыта прошлых проектов? — Вы уже рассматривали другие предложения?</p>\n<p>Если вы поймете, на что человек ориентируется при выборе продукта и как принимает решения, вы сможете легко адаптировать презентацию под его потребности. Вдобавок этот тип вопросов поможет предугадать возможные возражения и заранее подготовиться к правильным ответам на них.</p>\n<p>П - принципы. Эти вопросы нацелены на выяснение принципов и предпочтений клиента.</p>\n<p>Примеры таких вопросов: — Что для вас важно при выборе SMM-специалиста? — На какие критерии опираетесь при оценке дизайна? — У вас есть какие-то особые пожелания по продукту?</p>\n<p>Последний вопрос, кстати, очень мощный. Он помогает вам максимально раскрыть запрос покупателя. В такие моменты человек вспоминает то, что для него наиболее весомо при выборе товара или услуги. Даже если он ответит вам: «Нет, пожеланий нет, все хорошо», — сам факт, что вы проявили внимательность, продемонстрирует вашу экспертность и повысит лояльность.</p>\n<p>Р — решение. Эти вопросы дают ключ к пониманию, общаетесь ли вы с тем, кто действительно принимает решения, или ваш собеседник — один из множества участников процесса.</p>\n<p>Примеры таких вопросов: — Сколько времени обычно занимает процедура согласования договора? — Какие этапы согласования нам с вами необходимо пройти перед началом работы? — Если по условиям договоримся, какие будут дальнейшие шаги для начала работы?</p>\n<p>Представьте: менеджер звонит клиенту и, даже не определив, общается ли он с ЛПР, начинает углубляться в вопросы по разъяснению ситуации. Почему так происходит? Потому что продавец додумывает, с кем он говорит. Также не стоит идти напролом и прямо интересоваться: «Вы принимаете решение в компании?» Иногда такой подход срабатывает, но чаще бьет по самолюбию клиента, заставляя последнего уходить от прямого ответа. Переговоры полны тонкостей, поэтому лучше задавать нейтральные вопросы, которые не вызывают напряжения.</p>\n<p>А — аналоги. Это ваш шанс узнать, насколько клиент открыт для альтернативных предложений и готов ли рассматривать другие варианты решения его ситуации.</p>\n<p>Примеры таких вопросов: — Вы принципиально работаете только с агентством «А» или, если мы подберем более выгодные условия, готовы их рассмотреть? — Какие варианты вы еще рассматриваете или планируете рассмотреть?</p>\n<p>Бывает, что покупатель звонит и говорит, что хочет товар «А». Неопытный менеджер в большинстве случаев просто проверит наличие товара на складе, и если его нет, то, значит, и сделки нет. А что сделает в этой ситуации опытный эксперт в продажах? Начнет копать глубже и через вопросы об аналогичных продуктах постарается заинтересовать чем-то еще.</p>\n<p>Вопрос о готовности рассмотреть варианты эффективен даже в холодных звонках. Он позволяет ловко обходить возражения — даже не нужно аргументы приводить. В этом отличие профессионального продавца от новичка — он всегда проверит, насколько клиент открыт к альтернативным вариантам.</p>\n<p>H — нежелательное. Эта категория вопросов помогает вам узнать, чего в вашем предложении не должно быть ни в коем случае.</p>\n<p>Примеры таких вопросов: — Чего точно вам не хотелось бы видеть на тренинге? Есть моменты, которые не нравятся? — С чем вам не хотелось бы столкнуться? — Чего хотелось бы избежать в дизайн-проекте?</p>\n<p>Решение этих вопросов позволят вам снять все страхи и опасения клиента, установить с ним доверительные отношения и предложить проект, максимально адаптированный к его потребностям.</p>\n<p>О — ограничивающие. Позволяют определить срок заключения сделки, а также выявить, какие препятствия есть при покупке вашего товара или услуги. Например, по срокам или каким-то техническим моментам.</p>\n<p>Примеры таких вопросов: — Когда должна быть первая поставка? — Когда планируете начать разработку дизайна первых помещений? — В какие сроки все должно быть готово?</p>\n<p>Задавая вопросы по СОПРАНО, вы максимально полно проясняете ситуацию клиента, повышаете уровень доверия к вам и получаете ценную информацию для проведения убедительной презентации.</p>\n<p>Еще один совет: не старайтесь придерживаться той последовательности, которая указана в методике. Чередуйте их и, в зависимости от того, как развивается диалог, подбирайте разные типы вопросов.</p>\n<p>Есть и другие техники выявления потребностей клиентов. Например, всем известные СПИН-продажи от Нила Рекхэма, о которых более подробно вы можете почитать в одноименной книге автора.</p>\n<p>Третий шаг. Внимательно слушать ответы клиента и грамотно их использовать в вашей последующей презентации.</p>\n<p>Когда вы задаете точные вопросы, клиент начинает открываться вам, дает ценную информацию. И все, что вам нужно в момент, когда человек делится значимыми для него потребностями — стать самым внимательным собеседником. Не только слушать клиента, но и слышать его.</p>\n<p>Это непросто, но этому можно и нужно учиться. Не зря же говорят: «В жизни несколько лет дается человеку, чтобы научиться говорить, и вся жизнь - чтобы научиться слушать».</p>\n<p>ТАК КАК ЖЕ СЛУШАТЬ ПРАВИЛЬНО?</p>\n<ul><li><strong>1.</strong> Использовать техники активного слушания:</li>\n</ul>\n<ul><li>ага/угу реагирование (сюда же относятся и кивки головой);</li>\n</ul>\n<ul><li>эхо (буквально повторение последней фразы клиента, которое позволяет ему убедиться в том, что вы его понимаете);</li>\n</ul>\n<ul><li>парафраз («другими словами...», «то есть...», «получается, что..»);</li>\n</ul>\n<ul><li>уточняющие вопросы.</li>\n</ul>\n<ul><li><strong>2.</strong> Не обрывать клиента на полуслове (даже если вам вдруг стало все понятно).</li>\n</ul>\n<ul><li><strong>3.</strong> Не давать поспешных советов и рекомендаций (помните про эмпатию?) и избегать оценочных суждений.</li>\n</ul>\nИменно такая связка «грамотные вопросы + правильное слушание» даст вам полное понимание потребностей и возможность провести wow-презентацию, после которой клиент захочет купить именно у вас!", "level": 3}, {"title": "НАВЫК", "html": "", "level": 3}, {"title": "ПРЕЗЕНТАЦИИ", "html": "", "level": 3}, {"title": "РЕШЕНИЯ", "html": "", "level": 3}, {"title": "Практический инструмент: DISC — типология клиентов", "html": "<p>| | D - Dominance | I - Inducement | S - Steadiness | C - Compliance | | --- | --- | --- | --- | --- | | Описание | Доминирование, ведущий стиль | Влияние, экспрессивный стиль | Постоянство, мягкий стиль | Соответствие, аналитический стиль | | Сильные стороны | энергичный решительный волевой целеустремленный демонстрирует свой статус | позитивный  доброжелательный креативный нестандартный умеет убеждать | надежный внимательный постоянный аккуратный любит рутинную работу | сдержанный ориентирован на результат точный методичный аккуратный | | Слабые стороны | вспыльчивый резкий невнимательный к деталям торопливый агрессивный | эмоциональный импульсивный неорганизованный непунктуальный не любит письменное общение | уступчивый зависимый боится перемен обидчивый скрытный | склонен к осуждению замкнутый критичный не любит ошибки не гибкий | | Типичные высказвания | «Давайте помнить об основном, мы слишком углубляемся в детали…»  «Давайте уж делом займемся»  «Мы потеряем время, если станем…» «Да хватит воду лить, задача ясна» «Отлично, мы сможем работать быстрее, вести больше клиентов и получать больше прибыли». | «Великолепная идея!»  «Думаю, что я легко смогу его уговорить…» «Не беспокойтесь, это я точно смогу сделать. Я же профи!»  «Я знаю кое-кого, кто может оценить данную работу по достоинству» «Почти все крупные компании работают с этим продуктом. Нам нужно держать марку и тоже внедрять его у себя» | «Давайте выслушаем мнение всех сотрудников» «Думаю, что это не стоит того, чтобы затевать спор»  «Если вас это устраивает, то устраивает и меня» «Я полностью поддерживаю политику компании» «Продукт достаточно простой и понятный, думаю, мы с коллегами быстро привыкнем к работе с ним». | «В рамках нашего бюджета мы могли бы достичь только ...» «Давайте я еще раз проверю расчеты»  «Вы просто меняете сроки и говорите, что все получится»  «Это кто-то проверял?» «Стоимость продукта столько-то рублей. Значит, если производительность повысится на 15%, она окупится через полгода. Но есть риск...». | | Мотиватор/ демотиватор | Ключевой мотиватор «D» – победа, демотиватор – поражение. | Главный мотиватор «I» – признание. Им важно внимание и одобрение других людей. | Главный мотиватор «S» – предсказуемость, демотиватор – перемены. | Главный мотиватор «С» – желание быть правым. Более всего они боятся ошибиться. | | Характерные представители | классические образы Петра Первого и Екатерины Великой, Тимур из «Тимура и его команды», Бывалый (герой Моргунова), Жуков в исполнении Меньшова в сериале «Ликвидация», Д&#x27;Артаньян | Тигра из сказки про Винни-Пуха, принц Флоризель из одноименного фильма, герой Миронова из фильма «Бриллиантовая рука», Арамис | Семен Семеныч из «Бриллиантовой Руки», герой Басилашвили из фильма «Осенний марафон», Пятачок из сказки про Винни-Пуха, Портос | Штирлиц, Шерлок Холмс, Сова из сказки про Винни-Пуха, Атос | | Установление контакта | Он нетерпим к банальностям и неискренности. Если вы хотите похвалить, то найдите что-то, что действительно достойно похвалы. | Он любит, когда о нем говорят, его хвалят. Его умение выделяться из толпы, оставаясь при этом естественным и гармоничным, достойно искреннего одобрения. | Он очень чуток к фальши, даже не пытайтесь быть неискренним. Ему будет очень приятно услышать вопрос об их семье, друзьях, коллективе. Похвалите уют и порядок на его рабочем месте. | Он любой комплимент будет воспринимать скептически. Можно похвалить составленный им отчет или план, но только в контексте беседы. Возможно, стоит вообще пропустить эту часть. | | Презентация предложения | Должна быть четкой, динамичной, уверенной. Лучше сконцентрироваться на минимальном количестве самых сильных аргументов. Решение он принимает довольно быстро. Основное правило – главные аргументы в начале презентации. | Должна быть визуально насыщенной, яркой и образной. Избегайте чрезмерного количества цифр и расчетов. Эффективнее «нарисовать картину будущего», где он с помощью вашего продукта уже получает «всеобщее признание». | Должна быть понятной, логичной и спокойной. Просто расскажите ему, что вы предлагаете, простым человеческим языком, покажите слайды или документы, подкрепляющие вашу презентацию. Расскажите о том, что уже было внедрено и эффективность чего уже подтверждена. | Презентация требует особо тщательной подготовки. Перепроверьте все цифры и расчеты. Соберите как можно больше материалов, подкрепляющих ваше предложение, подготовьте все это в письменной форме в нескольких экземплярах без опечаток, с аккуратным оформлением. | | Работа с возражениями | Может приводить возражения, чтобы проверить вашу позицию. Прежде всего ни в коем случае не поддавайтесь на провокацию. Оптимальная форма общения – спокойно, но жестко. | Может приводить возражения не из-за того, что его что-то не устраивает, а чтобы привлечь внимание к своей персоне. Обратитесь к личности потенциального покупателя и к его эмоциям. | Возражения для начала еще придется из него вытянуть. Озвучивать свои возражения он, скорее всего, будет в мягкой вопросительной форме. Но это не значит, что эти возражения легко преодолеть или
