елание больше не отвечать на ваши звонки и сообщения?</p>\n<p>В следующих главах мы детальнее разберем, как построить коммуникацию с клиентом, чтобы давать ему максимальную выгоду и при этом быстрее закрывать сделки.</p>\n<p>Какой из всего вышесказанного можно сделать вывод? Вера в пользу собственного предложения влияет на наш эмоциональный настрой и становится фундаментом для роста в продажах.</p>\n<p>Потому что всегда хочется покупать у продавца, который излучает позитив и с энтузиазмом говорит о своем продукте.</p>\n<p>Принцип 3. Ассоциируйте себя с продажами Многие люди относятся к продажам как к чему-то негативному, а некоторые менеджеры иногда даже стесняются говорить, кем работают. Это сигнал того, что человек, осознанно или нет, считает, что продажи — это плохо. Такие эксперты не идентифицируют себя как часть этой сферы. Но рекорды возможны только если вы ассоциируете себя с тем, что делаете. Я видел много предпринимателей, которые считали продвижение товаров и услуг чем-то постыдным и были уверены, что хорошее предложение говорит само за себя.</p>\n<p>Когда я был в Италии, то заметил, что многие официанты — мужчины средних лет. Меня это удивило, потому что у нас в кафе и ресторанах в основном работает молодежь. Но еще сильнее меня поразил тот факт, что эти люди не стесняются своей профессии, более того — гордятся ею. С достоинством носят униформу, всегда улыбаются и воодушевленно рассказывают, что работают на этой должности уже много лет.</p>\n<p>Со стороны очень заметно, что они получают удовольствие от своей работы. Если вы хотите ставить рекорды, измените свое отношение. Перестаньте избегать продаж, прячась за оправданиями вроде: «Продажи — это навязывание» или «Я эксперт, и мой товар сам себя продаст».</p>\n<p>Нет, не продаст. Какой бы гениальный продукт вы ни создали, если вы не умеете его продавать, результатов не будет. Мир полон отличных идей, которые так и остались невостребованными, потому что авторы считали, что торговать ими — это «ниже их достоинства». Перестаньте смотреть на продажи как на неприятную обязанность. Это искусство коммуникации, ВОЗМОЖНоСтЬ вЛиЯть, вдохновлять, менять жизни клиентов.</p>\n<p>Чем быстрее вы начнете ассоциировать себя с этой сферой, тем быстрее ваш бизнес выйдет на новый уровень.</p>\n<p>Принцип 4. Продажа через ценность, а не через скидки Один из принципов рекордных продаж — реализовывать продукт через его ценность, а не через скидки. Конечно, всегда есть соблазн уступить клиенту в цене, чтобы он быстрее и с большей вероятностью согласился на покупку.</p>\n<p>Но этот подход имеет мало перспектив. Скидки — это ловушка: привлекают внимание, но не гарантируют уважение к вашему продукту. Они могут заманить покупателей, охотящихся за низкими прайсами, но не заставят их признать уникальность того, что вы продаете.</p>\n<p>Именно поэтому сначала нужно обозначить значимость продукта и только потом обсуждать его стоимость и возможные скидки. Если вы продадите ценность товара или услуги, у целевых клиентов найдутся деньги.</p>\n<p>Принцип 5. Отказы — это часть вашего развития Знаете, что общего у продавцов-новичков и прокачанных экспертов? Все сталкиваются с отказами регулярно. Абсолютно все.</p>\n<p>Но что кардинально отличает опытных менеджеров от тех, кто начал продавать недавно, - это отношение к отказам.</p>\n<p>Для одних — это причина выгорания, неуверенности и желания бросить работу в продажах. А для других — возможность развития, уроки, которые помогают находить новые подходы и улучшать свои навыки. Компетентные продавцы видят в отказах не катастрофу, а шанс научиться чему-то новому и стать сильнее. Они понимают, что каждое «нет» приближает их к следующему рекорду, и используют это как топливо для роста и совершенствования.</p>\n<p>Принцип 6. Осознанная реакция вместо импульсивной В продажах бывает все: клиенты срывают встречи, меняют решения в последний момент, не выходят на связь. Кто-то обещает оплату сегодня, а потом бесследно исчезает.</p>\n<p>Кто-то во всем соглашается, а потом внезапно покупает у конкурента. Это реальность, с которой сталкивается каждый.</p>\n<p>Ключевой момент — как вы на это реагируете. Представьте: вы подготовились к важной встрече, продумали презентацию, вложили много сил в эту сделку... но за пять минут до начала клиент пишет, что не придет. Или, что еще хуже, просто не отвечает. Первая реакция? Раздражение, злость, разочарование. «Опять зря потратил время! Почему люди так себя ведут?» Вы закипаете, на чинаете жаловаться коллегам, переживаете из-за потери покупателя.</p>\n<p>Но поможет ли эта реакция? Нет. Встреча уже сорвалась. Но у вас есть выбор — восстановить контроль над ситуацией или уйти в эмоции и потерять энергию впустую.</p>\n<p>Здесь работает правило четырех секунд. Оно простое: перед тем как действовать, сделайте паузу. Всего четырех секунд нашему мозгу достаточно, чтобы переключиться с импульсивной реакции на осознанную.</p>\n<p>Теперь спросите себя: как я могу сохранить контакт с клиентом? Как извлечь пользу из этой ситуации?</p>\n<p>Вы можете спокойно написать и предложить перенести встречу. Показать, что гибкость — ваша сильная сторона.</p>\n<p>Или использовать освободившееся время на то, что действительно продвинет вас вперед: улучшить презентацию, проанализировать переговоры, подготовиться к следующей сделке.</p>\n<p>В продажах всегда будут неожиданные повороты. Разница между средними и высокими результатами — в вашей способности управлять собой в такие моменты.</p>\n<p>Помните правило «10 на 90»: 10% нашей жизни — это события, которые происходят. 90% — это ваша реакция на них. Научившись выбирать осознанную реакцию вместо импульсивной, вы получите мощное конкурентное преимущество. Это не просто навык, а фундаментальный принцип рекордных продаж.</p>\n<p>Принцип 7. Вы — пример и авторитет для коллег и клиентов Очень сильно на ваше состояние и эмоциональный настрой в продажах влияет то, кем вы себя ощущаете: неуверенным новичком или сильным экспертом.</p>\n<p>Подумайте, как вы выглядите прямо сейчас в глазах клиентов, коллег, партнеров? Видят ли они в вас человека, который добился успеха в продажах? Начните обращать внимание на детали своего поведения: ваш стиль общения, внешний вид, тон голоса. Отбросьте в сторону неуверенность и синдром самозванца. Представьте, что у вас за плечами много сделок, и вы можете решить любой клиентский вопрос.</p>\n<p>Эксперты продаж именно так себя ощущают. Принцип 8. Вызов для обычного продавца — стресс, вызов для эксперта продаж — стиль жизни Я считаю, что посредственных продавцов от лучших в своем деле отличает отношение к челленджам. Челлендж — это вызов. Это готовность в сложных ситуациях искать возможности, а не оправдания. Это готовность к новым рекордам.</p>\n<p>Для одних задача «Заключить за месяц в два раза больше сделок» — источник стресса, который заставляет их чувствовать себя подавленными и неуверенными. Они воспринимают этот вызов как угрозу и непреодолимое препятствие.</p>\n<p>Для других челлендж — мощный заряд энергии, вдохновение на покорение новых высот. Сильные эксперты не только не боятся сложных задач, они скучают без них. Они недополучают энергию, если работают с посредственными целями.</p>\n<p>Когда я провожу собеседования на должности руководителей отделов продаж и менеджеров, то обязательно оцениваю отношение кандидатов к челленджам с помощью специальных вопросов и упражнений. Для меня это индикатор потенциала в работе. Сильный эксперт, нацеленный на рекорды, бросает вызов самому себе и готов брать недостижимую ранее планку. Это отличает его от продавцов, которые не развиваются, не пытаются чего-то добиться в продажах и воспринимают любой вызов как стресс и то, от чего нужно бежать.</p>", "level": 3}, {"title": "ПРОДАВАТЬ И НЕ ВЫГОРАТЬ", "html": "<p>«Я устал, я больше ничего не хочу, продажи - это не мое...» такие мысли неизбежно возникают на пути к серьезной цели. Когда-нибудь говорили себе такое? Не сомневаюсь, что да. Значит, самое время поработать с выгоранием и найти мотивацию двигаться дальше.</p>\n<p>Я сам сталкивался с эмоциональным истощением. Работая в банке, я иногда задавался вопросом, а на своем ли я месте?</p>\n<p>Я смотрел на коллег и думал, ну вот же — у людей нормальная работа. Клиенты к ним сами идут, а мне приходится организовывать встречи, уговаривать, звонить, писать в надежде выполнить план продаж. И каждый месяц — все заново.</p>\n<p>Это замкнутый круг! В такие моменты я испытывал чувства, знакомые многим:</p>\n<ul><li>устал и ничего не хочу;</li>\n</ul>\n<ul><li>рутина, надоело однообразие;</li>\n</ul>\n<ul><li>постоянные отказы, негатив;</li>\n</ul>\n<ul><li>разочарование в компании, в продукте, в отношении начальства к вам;</li>\n</ul>\n<ul><li>перегрузка, работа в надрыве;</li>\n</ul>\n<ul><li>опускаются руки;</li>\n</ul>\n<ul><li>перспективы в компании непонятны, отсутствие развития или карьерного роста;</li>\n</ul>\n<ul><li>раздражительность, нежелание брать новые задачи;</li>\n</ul>\n<ul><li>потеря мотивации, снижение работоспособности. Выгорание лишает внутренних ресурсов: вам больше не хочется делать НИ-ЧЕ-ГО. Какие планы, какие задачи? Тут бы отсидеть рабочие часы и скорее сбежать из ненавистного офиса. У человека в таком состоянии даже голос меняется: с клиентами он начинает говорить вяло и безэмоционально.</li>\n</ul>\nЛюди это чувствуют и меньше покупают. Хочу предложить вам несколько способов помочь себе получить заряд положительных эмоций и мотивацию двигаться дальше.\n<p>Проведите вашу личную стратегическую сессию. В суете дней вам может показаться, что вы топчетесь на месте.</p>\n<p>Но если посмотрите внимательнее, то увидите, как много шагов уже сделали к вашей мечте и новым рекордам. Такой аудит очень бодрит и вдохновляет на активные действия.</p>\n<p>Установите награду за цель. Придумайте вознаграждение, которое будет вас мотивировать: небольшое промежуточное поощрение, которое даст стимул двигаться дальше. Например, установите приз за выполненный план по продажам за неделю, месяц, квартал, год. От небольшого подарка вроде классной ручки или нового гаджета до более весомых: обучения, о котором давно мечтали, или путешествия. И не откладывайте заслуженный бонус. Бывает такое, что мы выкладываемся на полную и совсем забываем себя порадовать. Если мозг поймет, что вы работаете на износ, но не получаете материального результата, он просто даст в определенный момент сигнал организму, что хватит, пора остановиться.</p>\n<p>Переключайтесь! Не упахивайтесь до изнеможения. Старайтесь сбалансировать вашу неделю и найти время на какие-то занятия, кроме рабочих задач. Они помогут вам переключить внимание и получить положительные эмоции. Спорт, танцы, йога — у каждого из нас свои батарейки и то, что заряжает именно нас.</p>\n<p>Создайте место силы. Подумайте, что вас вдохновляет, и создайте пространство, которое будет наполнять вас энергией в моменты выгорания. Например, заведите электронную папку «Место силы» и сохраняйте туда картинки или тексты, которые воодушевляют и вселяют в вас уверенность. Я сделал так с отзывами клиентов: копировал из электронных писем или соцсетей и сохранял в отдельный файл. Когда мне нужна дополнительная энергия или мотивация, я беру паузу и открываю этот файл.</p>\n<p>Помню, как забрал свою первую зарплату, когда работал по программе Work and travel в Америке. Я разложил деньги на полу своей комнаты и сфотографировал. На память. Получить кругленькую сумму баксов в сравнении со скромной стипендией в 1470 рублей было для меня не меньше, чем сорвать джекпот.</p>\n<p>Еще больше меня воодушевляют мои визитки со всех мест, где я работал. Если сложить их в ряд, можно увидеть, какой путь я прошел, от обычного продавца-консультанта до регионального бизнес-тренера и основателя собственной школы продаж с аудиторией более 300 тысяч человек. Это очень вдохновляет.</p>\n<p>Используйте инструменты, которые вас заряжают. Это могут быть гаджеты, канцелярские принадлежности, различные программы или приложения, которые вы приобретаете для выполнения задач. Купили новый компьютерный стол, ноутбук или планшет — и получили мотивацию для достижения новых целей. Таких случаев масса — я помню, как покупка вебкамеры или гарнитуры мотивировала менеджеров проводить больше Zoom-встреч с клиентами. Новые вещи дают комфорт в работе.</p>\n<p>Теперь вы точно подкованы в техниках работы с эмоциями и знаете, как относиться к продажам. В следующей главе разберемся, как организовать рабочее время и пространство, и что делать, чтобы быстро выходить на рекордные результаты.</p>", "level": 3}, {"title": "Самоорганизация «снаружи»", "html": "<p>снаружи Я всегда считал себя организованным. Родители в детстве научили меня дисциплине и принципу: «Учись хорошо — все получится». Я занимался на двух факультетах одновременно, успевал сдавать сессии и работать. Все делал правильно.</p>\n<p>После университета устроился в банк — стабильная работа, четкий график, деловой стиль, понятный карьерный рост. Работал с утра до вечера, старался соответствовать стандартам компании, и у меня получалось. Казалось бы, все идет как надо.</p>\n<p>Но что-то внутри не давало покоя. ДЛЯ КУРСКА — ЭТО НОРМАЛЬНО! Я жил в Курске, вся моя жизнь была в Курске, и на мое мышление влияло то, что считалось там «нормальным». 15 000 рублей — это нормально для Курска.</p>\n<p>Старая иномарка с литровым двигателем — нормально для Курска. Квартира на окраине с простеньким ремонтом от застройщика — это тоже нормально.</p>\n<p>И я действительно считал, что живу хорошо. Ведь мне удалось устроиться на работу после университета, когда многие друзья еще искали себя.</p>\n<p>Но однажды я сел и прикинул, чего хочу в ближайшие ГОДЫ:</p>\n<ul><li>Хочу ли зарабатывать больше? Да.</li>\n</ul>\n<ul><li>Хочу ли путешествовать чаще, чем раз в год? Да.</li>\n</ul>\n<ul><li>Хочу ли покупать дорогие вещи без рассрочек и кредитов? Да. Тогда я сделал простое упражнение: посчитал, сколько мне нужно зарабатывать, чтобы жить так, как хочу, а не так, как «нормально».</li>\n</ul>\nИ тут пришло осознание. 15 000 рублей? Мне нужно хотя бы 150 000. А это в 10 раз больше того, что считалось «нормой» в моем окружении в то время.\n<p>Тогда мой мир перевернулся. Я понял, что все эти годы в основе моего планирования лежало представление «это нормально для Курска». Я сам ставил себе ограничения и занижал цели, так как в моей картине мира не было других примеров нормальности.</p>\n<p>Самоорганизация «снаружи» начинается с честного взгляда на свою точку «А» и точку «Б».</p>\n<p>Вот три ключевых шага:</p>\n<ul><li><strong>1.</strong> Определите свою точку «А». Посмотрите на свою ситуацию без оправданий: что у вас есть сейчас, что вас устраивает, а что — нет?</li>\n</ul>\n<ul><li><strong>2.</strong> Сформулируйте точку «Б». Опишите, как вы хотите жить, а не как «принято и нормально».</li>\n</ul>\n<ul><li><strong>3.</strong> Сделайте декомпозицию. Большая цель пугает, но если разложить ее на конкретные шаги — появляется понятный план.</li>\n</ul>\nКогда я впервые сделал декомпозицию дохода, я наконец увидел путь, а не тупик. Именно поэтому точка «А» и точка «Б» — это основа самоорганизации «снаружи». Если их не определить, вы будете топтаться на месте, год за годом оставаясь в той же «норме».\n<p>Самоорганизация — это не просто умение разбирать список задач. Это умение видеть масштабную картину. Можно быть идеально организованным в маленькой комнате и даже не подозревать, что за стенами - целый дом.</p>\n<p>С обозначением точки «Б» у многих могут возникнуть трудности. Часто у людей нет четкого понимания, к каким результатам они хотят прийти, либо их цели слишком расплывчатые. Например: «Хочу больше денег!» Кажется, что все правильно, есть желание и стремление к нему. Но когда начинаешь уточнять, оказывается, что человек даже не представляет, сколько именно хочет зарабатывать. Немного подумав, он добавляет: «Хочу получать 300 тысяч рублей со следующего месяца!» Эта цель лучше, но и она неполная. Если вы сейчас зарабатываете 30 тысяч, то вероятность того, что в следующем месяце увеличите доход в 10 раз — низкая.</p>\n<p>Но что, если вы сформулируете так: «Моя задача — через новый скрипт продаж и коммерческое предложение привлечь 10 новых клиентов и заработать 100 000 рублей в январе»?</p>\n<p>Теперь это уже не просто фантазия, а план действий для достижения цели. Рекомендую выписать ваши точки «А» и «Б» по следующим критериям (лучше сделать в формате таблицы):</p>\n<ul><li>уровень развития каждого из восьми навыков рекордных продаж по шкале от 0 до 10;</li>\n</ul>\n<ul><li>уровень дохода;</li>\n</ul>\n<ul><li>должность или уровень признания (какие награды хотите получить);</li>\n</ul>\n<ul><li>город, в котором проживаете;</li>\n</ul>\n<ul><li>текущие эмоции — это может быть стресс, подавленность или, наоборот, полное удовлетворение жизнью;</li>\n</ul>\n<ul><li>образ жизни. Возможно, у вас хороший доход, но деньги не приносят вам счастье, и вы, скорее, предпочтете более низкую зарплату, но при этом спокойную комфортную жизнь, чем богатство и бешеную гонку за ним;</li>\n</ul>\n<ul><li>размер клиентской базы. В постановке целей может помочь всем известная методика SMART. Не будем заострять на ней внимание — есть много книг, в которых вы сможете почитать об этом подробнее.</li>\n</ul>\nЗдесь же мне хочется поделиться с вами своими идеями, которые помогают мне в работе уже не один год.\n<p>Можно в качестве цели ставить увеличение дохода. Когда я получал в автосалоне 7500 рублей в месяц, то мечтал о 15 тысячах. Казалось, это будет идеально. Достигнув этой отметки, моя цель выросла до 30 тысяч рублей, и я думал, что этого будет более чем достаточно. Когда амбиции увеличились до 50 тысяч, а затем до 100 тысяч рублей, я стал задумываться о том, какие компетенции и навыки мне нужны для этого. После я нацелился на 300 тысяч, на миллион рублей, на 5 миллионов. Как видите, изначально моей точкой «Б» был не миллионный доход, скорее, целью было самосовершествование — мне хотелось понять, что нужно сделать, чтобы зарабатывать еще больше.</p>\n<p>Но не всем важен доход — для кого-то предпочтительнее реализовать уникальный проект, гордо добавить его в портфолио и получить признание. К примеру, когда я работал менеджером по продажам, моей целью было стать начальником отдела в банке. И, поверьте, желание увидеть на визитке новую должность рядом с моей фамилией мотивировало меня даже больше, чем повышение зарплаты.</p>\n<p>Некоторые точкой «Б» могут назвать спокойное эмоциональное состояние и душевный комфорт. Это люди, которые хотят трудиться в условиях, где нет давления и стресса, и можно без проблем совмещать работу и личную жизнь.</p>\n<p>Например, человек выбирает работать меньше, чтобы проводить время с семьей, путешествовать, заниматься спортом и хобби.</p>\n<p>Одни могут стремиться заполучить определенное количество клиентов в портфель. Другие хотят прокачать свои навыки и стать лучшим в профессии. Могут быть и материальные цели: автомобиль, хорошая техника или роскошный отдых - на все это нужно заработать.</p>\n<p>Ваша точка «Б» не должна опираться на одобрение окружающих. Я видел много людей с огромным потенциалом роста, но они не развивались, потому что оказывались в ловушке мнения других людей: «У тебя и так все круто! Зачем рисковать!</p>\n<p>Работай здесь и дальше. Для Курска — это нормально». Возможно, то, что у вас есть сейчас — это предел мечтаний ваших друзей, родственников или коллег. Это их точка «Б».</p>\n<p>Но не ваша. Подумайте прямо сейчас, что вас зажигает и драйвит? Это и будет вашей точкой «Б».</p>\n<p>Хочу, чтобы вы обратили внимание, что к точке «Б» важно относиться не просто как к желанию или мечте, а как к проекту, где вы планируете каждый аспект. Предположим, ваш проект — «Повышение на работе». Перед вами стоит задача все продумать: понять, какими компетенциями нужно для этого владеть; определить время, за которое вы сможете подтянуть свои знания; подготовиться к разговору с руководителем и так далее. Эти действия — ступеньки к осуществлению мечты.</p>\n<p>И даже если на пути вы столкнетесь с отказами, страхами, выгоранием и другими препятствиями, продолжайте идти к своей точке «Б» несмотря ни на что. Набирайтесь опыта, развивайтесь, и вы увидите, что исполнение желания не заставит себя ждать.</p>\n<p>У меня тоже была мечта. После защиты диплома в 2008 году я собирался устроиться в банк, но как туда попасть молодому специалисту без опыта работы? В главном банке страны я не прошел жесткую систему тестирования. Кто бы знал, что через 10 лет их головной офис будет покупать мой консалтинг по продажам, а сотрудники из разных городов будут проходить мои тренинги.</p>\n<p>Тогда я был в начале профессионального пути, но, получив первый отказ, не остановился — пошел стажером в учреждение поменьше. Местом моей новой работы стало отделение на окраине города. Людей там практически не было, так, редкие бабушки, которые приходили за пенсией. Чтобы совсем не зачахнуть от скуки, я заходил в ближайшие к офису дома и раскидывал по почтовым ящикам листовки с информацией, что в нашем банке можно оплачивать коммунальные услуги.</p>\n<p>Новые клиенты приходили, но их все равно было очень мало. Тогда я вышел на управляющие компании: «Отправляйте всех ваших жильцов к нам в офис. Мы согласуем спецкомиссию, сделаем привлекательные тарифы». Думаете, УК с радостью согласились? Как бы не так! Меня чуть ли не посылали при каждом обращении, не забывая в конце разговора вставить: «Какой-какой банк? Вы что, мы с таким не работаем!» Несколько месяцев я краснел на планерках из-за низких показателей продаж, но не отказывался от своей цели. Звонил, искал клиентов, продавал. Постепенно люди стали чаще к нам заходить, а казавшийся безнадежным офис раскручивался.</p>\n<p>Это отметило руководство, и вот уже на мое место взяли нового стажера, а меня позвали работать в центральный офис.</p>\n<p>Я был самым молодым в коллективе — 21 год. Мне выделили стол и посадили на холодные звонки: «Ты пришел сюда привлекать клиентов, вот и звони».</p>\n<p>Я смотрел по сторонам, прислушиваясь к разговорам коллег: вдруг у них можно научиться холодным продажам?</p>\n<p>Но в ответ — тишина, менеджеры сидели, уткнувшись в компьютеры. Я остался один на один со своими неуклюжими попытками связать слова в предложение. Но все равно звонил: заикался, краснел и продолжал проговаривать скрипт.</p>\n<p>А когда разговор заканчивался, кто-то в офисе обязательно цокал: «Да успокойся, никого ты не привлечешь, рынок давно поделен. Работай потихонечку, не суетись, и все будет нормально. Каких-нибудь клиентов найдешь. А вот так в холодную звонить — бесполезно».</p>\n<p>Но я не сдавался. Назначал встречи, ездил по офисам, предлагал компаниям и юридическим лицам стандартные банковские продукты. Я чувствовал себя в коллективе белой вороной. Когда у меня срывались сделки, коллеги не забывали вставить свои пять копеек: «Вот видишь, я ж говорил.</p>\n<p>Выше головы не прыгнешь!» Когда я слышал это, то задумывался, а может, и правда, я делаю все не так? Может, продажи — вообще не мое? Тогда я открывал сайт по поиску работы и видел в рекомендациях вакансии, о которых мог только мечтать. Начальник отдела в банке — это же сказка! Но одновременно это была моя точка «Б», и я понимал, что достигнуть ее можно только последовательными шагами. Что я делал? Распечатывал самые топовые экземпляры вакансий и прикалывал на видное место. Списки требований к кандидатам были неким маршрутом, путеводной картой к тем знаниям и умениям, которые мне предстояло прокачать. Эти простые действия помогли мне проще относиться к советам коллег «успокоиться». Как можно получить активную клиентскую базу, если не звонить и не ходить на встречи? Никак! Как получить опыт ведения переговоров с руководителями компаний? Как научиться продавать? Все эти вопросы мотивировали меня просто делать. Я был уверен, что если подтяну свои навыки, то без труда пройду собеседование на интересующую меня должность. В итоге так и вышло, и даже лучше, чем я мечтал.</p>\n<p>Чтобы выполнить работу по самоорганизации качественно, используйте ежедневный отчет (челлендж-доску) или трекер формирования привычек. Это поможет поддерживать дисциплину и быстрее добиваться своих рекордов. Если каждый день делать шаг в сторону точки «Б» и при этом не тратить драгоценное время на лишние действия, вы непременно доберетесь до конечной цели.</p>\n<p>ЧТО СЧИТАЕШЬ, ТО И РАСТЕТ Одно из моих любимых правил звучит так: «Что считаем, то и растет». Регулярно вспоминайте его в своей работе.</p>\n<p>Не нужно рассеивать внимание на все подряд. Концентрируясь на чем-то одном, вы ускорите рост показателя.</p>\n<p>Поэтому предлагаю перейти к ежедневному учету выполненных задач — как именно вы продвигаетесь к точке «Б».</p>\n<p>Вот несколько инструментов и принципов для достижения цели. Определите, какие действия дают результат и профессиональный рост Правильная организация рабочего процесса и места напрямую влияет на ваш доход. Например, офисная классика — вместо того чтобы активно общаться с клиентом, доносить до него ценность продукта, проводить презентации, менеджеры просто перекладывают стопки договоров. Сама система работы внутри компании часто выстроена так, что менеджеры тонут в бумажной волоките вместо того, чтобы продавать. Но ведь их главная задача как раз продажи!</p>\n<p>Хотите закрывать больше сделок? Честно спросите себя: действительно ли все, что я делаю в течение дня, приносит пользу в достижении цели? Если ответ «нет», самое время определить, что конкретно нужно делать, чтобы двигаться в нужном направлении, и сосредоточить все свое внимание на этом.</p>\n<p>Если у вас в расписании нет времени даже на короткий разговор с клиентом, и вы заняты кучей других «важных» дел, новых сделок не будет. Проблема не в том, что вы не умеете продавать, а в неэффективной организации вашего рабочего дня. Отсутствие хотя бы десяти минут для нового звонка — это не просто упущение, а пропасть, отделяющая вас от успеха.</p>\n<p>Помню, как я только-только прошел стажировку в автосалоне. Мы стояли с коллегами на парковке, и кто-то невзначай обмолвился: «А вот Лена получает больше 200 тысяч рублей в месяц». Я был в шоке! Мои родители зарабатывали тысяч 20-25, а здесь 200! Даже сейчас эта сумма в разы выше средней зарплаты, а в то время казалась просто космической.</p>\n<p>Но как? Почему кто-то за месяц имеет больше, чем другие за год? Лена ведь работает в той же компании, в той же должности и столько же часов в день, что и я! Как она научилась продавать намного больше других? Я прокручивал эти мысли в голове и не мог понять, в чем секрет таких высоких результатов. Секрет раскрылся чуть позже.</p>\n<p>Спустя время один из продавцов подогнал на выдачу новенький автомобиль:</p>\n<ul><li>у тебя сегодня я. — Поздравляю! продажа была? 一 спросил — Не, не у меня! Это для клиента Лены! — Подожди, а почему ты перегоняешь авто для клиента Лены? — Ну ей же нельзя. Она новую машину поцарапала один раз, и теперь ей только общаться с клиентами можно, а перегонять машины нельзя.</li>\n</ul>\nВот это да! Руководство запретило Лене перегонять автомобили. И несмотря на то что ребята посмеивались над этим, для нее это было вовсе не наказание. Именно этот запрет помог сосредоточиться на тех задачах, которые действительно важны и прямо влияют на уровень дохода. То есть у Лены не было волшебного скрипта продаж. Говорила она клиентам то же самое, что и остальные продавцы. Разница лишь в том, что теперь она не отвлекалась на технические моменты и все внимание уделяла общению с клиентами! Именно это взаимодействие, а не перегон автомобиля на мойку и обратно стало тем, что больше всего влияло на высокий заработок.\n<p>Секрет Лены оказался очень прост: чем больше времени вы занимаетесь «денежными делами», тем больше ваш доход.</p>\n<p>Посмотрите на свой план работы и определите, что именно влияет на ваш рост, а что — лишь создает нагрузку.</p>\n<p>Именно это мы часто упускаем из виду: у каждого из нас есть одинаковые восемь рабочих часов, и очень важно, на что мы их тратим. Уверен, в жизни были ситуации, когда вы ломали голову, почему коллега успел выполнить проект раньше или продать больше, хотя вы начали в одно и то же время.</p>\n<p>Недавно я взялся за перестройку работы отдела продаж компании, которая составляет родословные для VIP-клиентов: звездных футболистов, политиков, блогеров с миллионами подписчиков. И все бы хорошо — в отделе трудятся целых пять менеджеров. Но все они занимаются активными продажами в лучшем случае полчаса в день. Остальное время работают в архивах и теряют бесценное время на составление и распечатку документов. В результате из полных восьми рабочих часов на фактические продажи уходит 30 минут.</p>\n<p>Что можно успеть за это время? Максимум — обработать одну заявку. Представляете, какой потенциал роста у этой команды, если они начнут заниматься «денежными делами»?</p>\n<p>Мой клиент Владимир, руководитель отдела продаж в компании по производству мороженого и полуфабрикатв, рассказывал: «У меня в компании произошли массовые кадровые изменения. С некоторыми назначениями я был крайне не согласен.</p>\n<p>Нервничал. Оспаривал. Испытывал сильный стресс, выгорание, желание бросить эту работу. Мой доход упал до 100 тысяч рублей, и тогда я понял, что мне нужно меняться. Изменюсь сам — изменится ситуация вокруг меня.</p>\n<p>Я начал с анализа продукта: сильные, слабые стороны. В дальнейшем проанализировал воронку продаж, конверсии на разных этапах — здесь тоже были сложности. Проработали с командой, и сразу пошел эффект! Я стал больше слушать команду, клиентов и в целом работать по системе рекордных продаж. У нас вырос средний чек. В июле я превысил все свои ожидания и вышел на доход в 240 тысяч рублей».</p>\n<p>Этот пример показывает, что путь к рекордам начинается с анализа. Давайте посмотрим на схеме, а также по ссылке ниже, что нужно анализировать в продажах, чтобы быстро расти.</p>\n<p>ЧТО АНАЛИЗИРОВАТЬ, ЧТОБЫ БЫСТРО РАСТИ В ПРОДАЖАХ?</p>\n<ul><li><strong>1.</strong> Клиентскую базу и ассортимент:</li>\n</ul>\n<ul><li>ABCXYZ анализ по выручке;</li>\n</ul>\n<ul><li>ABCXYZ анализ по прибыли;</li>\n</ul>\n<ul><li>ABCXYZ анализ по продукту;</li>\n</ul>\n<ul><li>20/80.</li>\n</ul>\n<ul><li><strong>2.</strong> Свои цели по доходу и продажам:</li>\n</ul>\n<ul><li>декомпозиция;</li>\n</ul>\n<ul><li>SWOT-анализ.</li>\n</ul>\n<ul><li><strong>3.</strong> Конкурентов:</li>\n</ul>\n<ul><li>идеи по системе продаж;</li>\n</ul>\n<ul><li>идеи по сценариям общения;</li>\n</ul>\n<ul><li>идеи по продуктам и сервису.</li>\n</ul>\n<ul><li><strong>4.</strong> Воронку продаж и конверсии</li>\n</ul>\n<ul><li><strong>5.</strong> Рабочее время и процессы</li>\n</ul>\n<ul><li><strong>6.</strong> Коммуникации с клиентами:</li>\n</ul>\n<ul><li>собственные сделки (зависшие, отказники, успешные). Самоорганизация — это не только про планирование рабочего дня, это про способность анализировать ваши ресурсы, окружение и принимать решения, которые приведут к рекордам.</li>\n</ul>\nПосле того как вы выявили действия, приводящие к рекордам продаж, сформируйте челлендж-доску Когда я работал менеджером, все свое время разгребал ворох вопросов и проблем. Думаете, в конце месяца я радовался итогам? Если бы! У меня было ощущение, что я топчусь на месте, излишне суечусь и зря растрачиваю свои ресурсы. Что я тогда сделал? Изменил подход к работе — выделил главные задачи в течение дня и стал их ежедневно фиксировать в челлендж-доске. Общался с клиентами.\n<p>Записывал количество встреч. Делал звонки. Я все фиксировал, и в итоге эти цифры начали увеличиваться. Для меня это стало самым настоящим инсайтом — это же так просто, почему я не делал этого раньше?! «Что считаешь, то и растет» стал одним из моих основных принципов как в личных продажах, так и при построении отделов продаж для клиентов. Он действительно работает в любой сфере!</p>\n<p>Сконцентрируйте внимание на нужных вам показателях, и они будут уверенно расти. Соблюдение этого правила помогает в целом повысить дисциплину и быстрее добиться рекордов в продажах.</p>\n<p>Работа с челлендж-доской отлично помогает внедрить системный подход. Это неизбежно приведет вас к прогрессу уже в ближайшие недели.</p>\n<p>На доску я рекомендую добавлять не только задачи по бизнесу. Несколько лет назад мы с учениками заметили, что даже если у вас будут зафиксированы планы по спорту, изучению иностранных языков или по каким-то домашним делам, это тоже поможет вам в продажах. «Но как это связано?» — возможно, удивитесь вы. Очень просто! Даже небольшие ежедневные цели (например, десятиминутная зарядка по утрам или прослушивание подкаста на английском языке) формируют вашу дисциплину. Вы становитесь более организованным не только в домашних делах и повседневных привычках, но и в продажах. Вы получаете больше энергии от завершенных задач, и эта энергия работает на ваши рекорды!</p>", "level": 3}, {"title": "ВНЕДРЯЙ БЫСТРО", "html": "<p>Возможно, многие из вас, кто сейчас прочитал весь этот огромный блок практических советов и рекомендаций, скажут: «О, классные идеи! Попробую внедрить как-нибудь потом». Но потом — это когда?</p>\n<p>Мы живем в мире, где постоянно что-то меняется. Чуть ли не каждый день появляются новые технологии: роботы, нейросети, 3D-принтеры, беспилотные такси. И если вы хотите добиться успеха в своей области, не забывайте про быструю адаптацию к новым условиям.</p>\n<p>Вспомните двух гигантов: Kodak и Nokia. Первый — лидер в области фотоаппаратов, второй — неубиваемых сотовых телефонов. И где они сейчас? Обе компании не смогли приспособиться к изменениям на рынке, переориентировать производство на более современную продукцию и в итоге прекратили свою деятельность.</p>\n<p>Или таксисты у вокзалов. Они упорно продолжают ловить клиентов на улице, хотя все уже давно заказывают машины через мобильное приложение. Эти водители недоумевают, почему их старомодные методы привлечения клиентов не приносят привычного дохода. Яркий пример того, как отказ от нововведений и привязанность к прошлому может оставить без гроша в кармане.</p>\n<p>Что же поджидает вас в сфере продаж? Кризисы, голосовые роботы, искусственный интеллект, изменение законодательства, появление новых конкурентов, новой продукции и технологий, которые непременно будут оказывать влияние на вашу работу. Изменения неизбежны! Но как к ним относиться?</p>\n<p>Есть два пути: реактивное поведение, когда вы реагируете на случившееся событие, и проактивное поведение, когда вы предугадываете изменения и предпринимаете какие-то действия. Люди, для которых характерно реактивное поведение, продают слабо. Они не любят погружать себя в среду, где нужно много работать и все время что-то внедрять. А те, кто проактивен, идут и делают, даже если сами только-только узнали о каких-то методиках и инструментах. Они могут прийти в любую компанию и сказать: «Я прокачал навыки продаж и знаю, как добиться результата именно в вашей ситуации».</p>\n<p>Многие предпочитают ждать подходящего случая или лучшего дня недели, чтобы начать применять новые идеи.</p>\n<p>А вы не ждите! Каким бы умным вы ни были, сколько бы материалов по продажам ни изучали и сколько бы техник ни знали, если вы не реагируете быстро, результаты будут невысокими.</p>\n<p>Выработайте навык быстрого внедрения, и тогда продажи вырастут. Что еще поможет вырасти в профессиональных достижениях и доходе?</p>\n<p>Создайте правильный информационный поток. Ваши результаты — это отражение вашего мышления. А оно, в свою очередь, формируется из информации, которую вы потребляете ежедневно.</p>\n<p>Проведите ревизию информационного пространства, в котором живете: какие книги читаете, какие подкасты и видео слушаете в машине, какие новости автоматически загружаете в голову с утра. Сведения, которыми вы себя окружаете, либо усиливают вас, либо тянут вниз.</p>\n<p>Отфильтруйте контент, который дает только поверхностные советы, сеет панику или создает ощущение, что все серо и мрачно. Вам нужен поток, который заряжает уверенностью, расширяет кругозор и предлагает работающие инструменты.</p>\n<p>Пересмотрите свои подписки: выбирайте тех, кто вам близок по стилю, у кого вы видите не просто теорию, а живую практику, подкрепленную результатами.</p>\n<p>Собирайте информацию, которая делает вас сильнее, подсказывает новые идеи и помогает выходить на рекордные результаты.</p>\n<p>Регулярное обучение. Посещайте тренинги, семинары и конференции. Такие мероприятия полезны не только из-за содержания, но и из-за вдохновения и мотивации, которые там можно получить. А еще из-за крутых спикеров, которые заряжают своей харизмой и умением вести себя на сцене.</p>\n<p>Система заметок. Очень важно не просто читать профессиональную литературу, но и сразу выписывать мысли, которые вам откликнулись. Не полагайтесь только на память — она может подвести. Суть заметок даже не в том, чтобы запомнить, а чтобы внедрить в вашу систему работы. Например, можно выделять в книге цитаты и сразу переносить их в приложение, так интересные идеи всегда будут перед глазами.</p>\n<p>Наставник. Подумайте, кто мог бы вам помочь достичь вашей точки «Б». Наставником может стать человек, который уже достиг того, к чему вы только стремитесь. Используйте его опыт и рекомендации, адаптируя под свои задачи, и вы удивитесь, насколько быстро начнете продвигаться к своим амбициозным целям.</p>\n<p>Челлендж. Бросьте себе вызов! Это не просто ускоритель для применения навыков, но стиль жизни человека, который занимается продажами. Когда вы работаете через поставленный себе вызов, вы достигаете целей, которые другим кажутся недостижимыми. Пробуйте внедрять одну идею в день или хотя бы в неделю. За год наберется 50 техник, которые вы протестируете или внедрите.</p>\n<p>ПОДКОВЕРНЫЕ ИГРЫ, ИЛИ САМОЕ ПРОВАЛЬНОЕ РЕШЕНИЕ Моя карьера не состояла только из взлетов. Были провалы, и работа в страховой компании как раз один из них.</p>\n<p>Я перешел в новую компанию на должность руководителя блока продаж, ничего толком не узнав о коллективе. Если бы мне сказали, что там вместо реальных результатов будут больше цениться корпоративные интриги, публичные унижения и не относящиеся к работе традиции, то я бы, наверное, 10 раз подумал, прежде чем соглашаться на это место.</p>\n<p>Помню, как вернулся со встречи в офисе и сильно удивился, что работа парализована. Оказывается, был день ангела нашего руководителя. Полдня сотрудники обсуждали, что дарить, готовили речь, заказывали еду в офис. Для меня как человека, который несколько лет работал на результат в динамичной системе и привык ценить каждую минуту, узнать, что можно отмечать день ангела (даже не день рождения!) с таким размахом, было шоком.</p>\n<p>Именно тогда, я понял, как сильно окружение влияет на рекорды в продажах. И что бывают такие ситуации, когда навыки не помогают, а наоборот, весь твой опыт и успехи жестко обесцениваются.</p>\n<p>В тот момент мне казалось, что прийти на эту вакансию было самым провальным решением в моей жизни. Но, как говорится, нет худа без добра. Эта работа меня многому научила. Я понял, как сильно недооценивал роль коллектива.</p>\n<p>Я думал, что, если умею показывать результат, это будет цениться везде. Но есть компании, где результат вторичен (к счастью, их не так много). Поэтому если вы хотите добиваться высот в своем деле, важно внимательно и осознанно относиться к выбору окружения.</p>\n<p>Если вокруг вас токсичные пессимисты и скептики, вам будет сложно расти в продажах. Любые ваши идеи будут саботироваться, а вместо поддержки вы будете получать очередную порцию зависти, раздражения и злорадства.</p>\n<p>Многое зависит от руководителя. Как он выстраивает отношения в коллективе и какие ценности закладывает своей команде: сплетни, интриги и токсичность или поддержка, развитие и целеустремленность.</p>\n<p>Берите мои методы прокачки эмоционального настроя и начинайте внедрять их в свои продажи уже сегодня. В следующей главе мы поговорим, где искать новых клиентов и как выходить в холодных звонках на лицо, принимающее решение. А еще рассмотрим много фишек нетворкинга.</p>\n<p>Не переключайтесь!</p>", "level": 3}, {"title": "НАВЫК ПОИСКА", "html": "", "level": 3}, {"title": "КЛИЕНТОВ", "html": "", "level": 3}, {"title": "Дополнение: «Продажи — не мое». ТОП-5 приемов", "html": "<p>Идея 1: Обучай клиента – и тебе не придется продавать. - Не просто рассказывай о продукте, а научи клиента правильно выбирать ваш продукт.</p>\n<ul><li>Вы впервые покупаете? Давайте я покажу, на что в первую очередь обращать внимание, чтобы правильно выбрать…</li>\n</ul>\n<ul><li>Так как вы планируете заказывать оборудование, давайте сразу обсудим все нюансы, которые впервую очередь важно учитывать…</li>\n</ul>\nИдея 2. Задавай правильные вопросы – и тебе не придется продавать. - Правильные вопросы раскрывают и формируют потребность. Задавай правильные вопросы клиентам – и они будут покупать быстрее.\n<p>Идея 3. Говори о результатах клиента – и тебе не придется продавать.</p>\n<ul><li><strong>1.</strong> Презентуй результат, а не продукт.</li>\n</ul>\n<ul><li><strong>2.</strong> Говорите языком выгод для клиента (замени “я”, “мы” на “вы.. сможете/ получите / для вас это означает и тд).</li>\n</ul>\nИдея 4. Правильно называй цену – и тебе не придется продавать.\n<ul><li><strong>1.</strong> Сначала презентация, потом – цена,</li>\n</ul>\n<ul><li><strong>2.</strong> Всегда предлагай несколько вариантов,</li>\n</ul>\n<ul><li><strong>3.</strong> Говорите о цене легко, уверенно.</li>\n</ul>\nИдея 5. Не навязывайся, будь интересным – и тебе не придется продавать.\n<ul><li><strong>1.</strong> Каждое касание в звонке, переписке, встрече делай экспертным и эмоциональным (это методика ЭЭ).</li>\n</ul>\n<ul><li><strong>2.</strong> Давай пользу в каждом касании.</li>\n</ul>\n---\n<hr>", "level": 4}]}, {"id": 5, "part": "ЧАСТЬ II. 8 НАВЫКОВ РЕКОРДНЫХ ПРОДАЖ", "partIdx": 1, "title": "Глава 5. Навык 2: Поиск клиентов", "bodyHtml": "<p>«К сожалению, я не готов взять этот проект в работу, — ответил я владельцу медицинской компании, который хотел с моей помощью увеличить доход. — Понимаете, у вас и так достаточно высокая конверсия клиентов в сделки, а значит, с отделом продаж проблем нет. Даже если мы непосильным трудом повысим этот показатель еще на 10%, это не даст кратного роста и не приведет к цели. Все, что нужно сейчас, — привлекать больше заказчиков. Чтобы о вас узнало как можно больше людей. Именно это будет первым шагом к рекордам!»</p>\n<p>А сколько клиентов знают о вас? О том, что продаете и какие услуги оказываете? Неважно, кто вы — менеджер в найме или предприниматель со своим отделом продаж. Главный вопрос: «Как сделать так, чтобы обо мне, моей компании, продукте, предложении узнало как можно больше людей?»</p>\n<p>Одни запускают сарафанное радио, другие выступают на конференциях, третьи записывают экспертные reels — каждый ищет свой путь.</p>\n<p>Даже если вы будете подкованным в техниках продаж, разберетесь с самоорганизацией и поставите себе грандиозную цель, пока потенциальные клиенты не узнают о вас — мечты о новых финансовых высотах так и останутся всего лишь мечтами. Поэтому первое, чем нужно заняться, — создать клиентопоток.</p>\n<p>Как это сделать, если вы, например, только начинаете свой путь в сфере продаж? Прежде всего вспомните про эмоциональный настрой. Нет заказов? Это не повод впадать в уныние или винить всех вокруг. Привлекать клиентов несложно, если работать по системе.</p>\n<p>Когда я еще учился в университете, пошел подрабатывать страховым агентом в одну из топовых компаний. Я прошел пару лекций по продукту, но у меня не было ни одного клиента, которому можно предложить свои услуги.</p>\n<p>Я не работал в офисе, куда бы приходили люди с желанием оформить страховку. Как тогда создавать клиентопоток?</p>\n<p>Первые недели я вообще не понимал, как действовать. Руководители видели мои неудачные попытки и предложили простую схему привлечения первых клиентов — выдали наклейки на машины и отправили «ловить» клиентов на АЗС. Пока люди заливают бензин, мне нужно было успеть предложить им наклеить на заднее стекло большой стикер с названием страховой компании. За это клиенты получали скидку 5% на полис ОСАГО.</p>\n<p>Как думаете, как реагировали люди? Если вы смотрели ролики, где активисты наклеивают стикеры на лобовые стекла неправильно припаркованных автомобилей, то можете представить, как это выглядело со стороны: «Да вы что, не надо мне ничего клеить! Отойдите от машины подальше!».</p>\n<p>Но были и те, кто соглашался. Знали бы вы, с каким чувством победы я разглаживал наклейку на стекле — будто закрыл сделку на миллион Работая страховым агентом, я научился собирать лиды (данные клиентов) и вести клиентскую базу. Заниматься этим на заправке, конечно, было изнурительно. Стоишь по полдня, раздаешь наклейки, собираешь контакты тех, чей полис заканчивается через три-шесть месяцев, чтобы потом предложить его продлить, а толку ноль.</p>\n<p>То, что я делал, казалось бессмысленным, ежедневная рутина утомляла. Но со временем я заметил, что моя записная книжка наполнилась десятками контактов, и процент от этих сделок принес мне полторы тысячи рублей - небольшую, но прибыль. Эта ситуация в самом начале моей карьеры подсветила важнейший момент: в продажах важно уметь создавать клиентопоток. Да, возможно, заработанная сумма была несопоставима с усилиями, которые я потратил, работая на заправке, но выводы из этой ситуации имели огромное значение для моих будущих рекордов.</p>\n<p>Во-первых, необычные способы продвижения могут помочь создать клиентскую базу с нуля. А во-вторых, вполне нормально, что на это уходит не один день. Формирование потока заказчиков не быстрый процесс, но он стратегически важен. Накапливая данные, вы создаете актив, который будет приносить вам деньги. Даже если начинаете вот с такими наклейками на заправке.</p>", "sections": [{"title": "ТОЧНО В ЦЕЛЬ", "html": "<p>Однажды, когда я работал в банке, меня отправили в головной офис в Москву. Мои результаты выглядели лучше, чем у менеджеров других филиалов, и это придавало мне уверенности в общении с высшим руководством. Поэтому я решил не молчать и рассказать о проблеме. — Я стараюсь продавать каждому клиенту! Каждому! — с уверенностью в собственной правоте сказал я директору департамента. Даже мысли не допускал, что в этом может быть моя главная ошибка... — В этом и есть ошибка. Именно поэтому тебе так тяжело. Не нужно цепляться за каждого, кто вошел в отделение банка или позвонил. Нужно продавать только тогда, когда ты понимаешь, что перед тобой целевой клиент, — ответил он.</p>\n<p>Я тратил много энергии, рассказывая о преимуществах продукта, но большинство клиентов обесценивали мои слова: «Это очень дорого!», «Мы вашими услугами пользоваться не будем!». Добиться результата было довольно тяжело — приходилось работать без выходных и прикладывать много усилий, чтобы заключить сделку. То, что услышал от руководителя, стало для меня большой неожиданностью. — Как это перестать продавать нецелевым клиентам?</p>\n<p>То есть даже время свое не тратить на общение с ними? — Именно. Работа с такими людьми — неблагодарное дело. Они постоянно возражают, обесценивают и забирают много энергии. В продажах важно уметь определять целевых клиентов, и тогда сделки будут закрываться легко и в удовольствие.</p>\n<p>Продажи нецелевым клиентам — путь в никуда. Это как попытка презентовать роскошную недвижимость тем, кому она не по карману. Вместо «Как оплатить?» вы можете услышать: «Кому вообще нужны такие дорогие квартиры? Только риелторам, чтобы обогащаться за наш счет!</p>\n<p>Думаете, я не понимаю, что это все обман и она не может столько стоить?» Обозначим основные минусы работы с нецелевыми клиентами:</p>\n<ul><li><strong>1.</strong> Очень низкая либо нулевая конверсия в покупку. Вы сталкиваетесь с замкнутым кругом неудач, где каждая провальная сделка усиливает ощущение тупика.</li>\n</ul>\n<ul><li><strong>2.</strong> Много негатива от клиентов. Возможно, причина не в вашем предложении, а в том, что вы метите не туда.</li>\n</ul>\nСнова и снова нарываетесь на отказ и грубость, потому что игнорируете ключевую цель — фокус на правильных клиентах.\n<ul><li><strong>3.</strong> Быстрое выгорание. Этот пункт вытекает из предыдущего. Отсутствие результатов, огромное количество слитых ресурсов и энергии — и вот, вам уже хочется бросить продажи и заняться чем-то еще.</li>\n</ul>\n<ul><li><strong>4.</strong> Непонимание со стороны клиента и обесценивание вашего предложения. Особенно это заметно при презентации премиальных продуктов, таких как элитная недвижимость или дорогие автомобили. Например, панорамные окна, уютные дворы с ландшафтным дизайном, подземный паркинг — для нецелевого клиента все это будет не триггерами для покупки, а дорогими опциями, без которых можно обойтись. Так же и с марками машин — зачем переплачивать за бренд, когда можно найти авто подешевле и на тех же четырех колесах доехать куда нужно?</li>\n</ul>\nНе каждый клиент - ваш клиент. Но этот принцип не должен стать удобным оправданием для упущенных сделок. Некоторые эксперты, говоря «это не мой целевой клиент», банально скрывают свое нежелание работать и неумение общаться с людьми.\n<p>Я часто был свидетелем ситуаций, когда менеджер упускал продажу, потому что не установил контакт, не задавал вопросы, не вник в ситуацию покупателя, да еще и не перезвонил после встречи, как обещал. И вместо того, чтобы признать свой просчет, говорил, что сразу понял, что клиент «не его».</p>\n<p>Поэтому крайне важно не спешить с выводами о нецелевом клиенте. Сначала собственными действиями проверьте это на практике.</p>\n<p>Тогда кто целевой клиент? Целевой клиент — это покупатель, потребности которого вы можете удовлетворить максимально полно, следуя при этом стратегии, где предложение выгодно не только вам, но и потребителю. Тот, кто понимает ценность вашего продукта и готов за него заплатить.</p>\n<p>Чтобы понять, есть ли среди вашего окружения целевые клиенты, ответьте на следующие вопросы:</p>\n<ul><li>Кому реально полезен ваш продукт?</li>\n</ul>\n<ul><li>Кто уже его покупает и доволен?</li>\n</ul>\n<ul><li>Как найти контакты похожих клиентов? Есть прекрасная фраза: «Выбирая клиентов, вы выбираете свое будущее». Отдавайте предпочтение тем людям, с которыми работа идет легко и приятно и которые ценят вас и ваш продукт.</li>\n</ul>\nЦелевых клиентов можно условно разделить на несколько групп. Это похоже на мишень с секторами. Когда вы попадаете в «яблочко», то получаете максимальное количество сделок, а если «бьете» только по краям, то и продаете по минимуму.\n<p>Рассмотрим этот метод подробнее.</p>", "level": 3}, {"title": "ТЕХНИКА «МИШЕНЬ»", "html": "<p>Мишень — это не просто метафора, а удобная стратегия работы с целевой аудиторией. Представляя целевую аудиторию как мишень, можно разделить ее на сегменты по степени готовности клиентов к покупке.</p>\n<p>В центре мишени — самые горячие клиенты. Клиенты мечты! Они могут и хотят купить у вас сейчас. У них есть и деньги, и желание.</p>\n<p>Чем дальше от центра мишени — тем ниже готовность к покупке. Второй круг — это клиенты, которые могут и хотят купить у вас, но не уверены, сейчас или позже. Дайте им чуть больше мотивации, и сделка будет закрыта.</p>\n<p>Третий круг — те, кто может и хочет купить, но пока не определились, где и когда. Например, вы продаете станки, другие пять конкурентов — тоже, и клиент пока не знает, у кого он будет заказывать и когда. В этом случае ваша задача — убедить его, что выгоднее всего взять этот станок именно у вас и именно сейчас.</p>\n<p>Другие круги, мы для удобства отразим в таблице. Понимание, в каком секторе мишени находится ваш покупатель, позволяет максимально эффективно настраивать стратегию продаж и предлагать правильные целевые действия — те, которые будут мотивировать к сотрудничеству с вами, постепенно подогревая интерес к вашему продукту.</p>\n<p>Давайте рассмотрим это на конкретных примерах ниже. Ситуация клиента - Тактика работы с сегментом.</p>\n<p>Хочу и могу купить товар А у вас прямо сейчас. - Клиент уже готов купить у вас. Ваша задача — профессионально закрыть сделку, предложить кросс-продукт (если это уместно и отвечает потребностям клиента).</p>\n<p>Хочу и могу купить товар А у вас (пока не знаю когда).- Использовать мотиваторы для закрытия сделки здесьи сейчас (см. Главу 9 — там десятки техник закрытия сделок).</p>\n<p>Хочу купить товар А (пока не знаю, где и когда). - Донести до клиента преимущества работы именно с вами, а не с конкурентами. После этого использовать мотиваторы для закрытия сделки сейчас.</p>\n<p>Хочу купить то, что решит проблему (пока не знаю, что именно, где и когда). - На этом этапе клиент осознает проблему, но пока не знает, как именно ее решать. Например, человек хочет повысить продажи в бизнесе, но пока не знает, какое решение выбрать: настроить маркетинг, обучить отдел продаж, открыть новый филиал и т. д. В этой ситуации важно показать клиенту преимущества именно вашего решения (например, почему именно обучение отдела продаж — лучший выбор в текущей ситуации), а затем перейти на уровень 3 и 2 (почему именно у вас лучше заказать обучение отдела продаж и почему это выгодно делать именно сейчас).</p>\n<p>Не задумываюсь о решении проблемы и покупке чего-либо. - Эти клиенты не имеют сформированной потребности в ваших услугах, так как еще не осознают свою проблему. Задача эксперта в этой ситуации — сформировать потребность в том решении, которое вы предлагаете.</p>\n<p>Здесь очень важно понять: продукт, который вы предлагаете, основной или второстепенный? Например, если вы продаете муку для пекарни, у клиента не возникает вопросов, нужна она ему или нет. Это основной продукт, без которого работа остановится. Все, что вам нужно сделать в этом случае — убедить покупать именно у вас.</p>\n<p>Но возьмем ситуацию, когда вы продаете не муку, а ведение соцсетей или создание сайта для пекарни. Это второстепенный продукт — клиенту непонятно, нужна ему эта услуга или нет. Здесь основная задача эксперта — показать, что присутствие в онлайн-пространстве так же важно для прибыли, как и покупка муки. Главное — не наделять предложение несуществующими свойствами и не давать ложных обещаний по гарантированному увеличению дохода. Лучше честно скажите, что на окупаемость влияют многие факторы. И покажите на реальных примерах, как сайт и соцсети влияют на количество заказов и выручку компании.</p>", "level": 3}, {"title": "ТЕХНИКА «ЗВЕЗДА»", "html": "<p>Когда вы знаете, кто ваш целевой клиент, перед вами встает вопрос, а как привлечь именно его. Нужно звонить в холодную или разместить объявление и ждать входящие заявки?</p>\n<p>Ответ на этот вопрос определяет, как быстро вы достигнете своих рекордов в продажах. Когда я только начинал, единственным источником поиска клиентов были холодные звонки. У меня не было знакомых, рекомендаций, входящих заявок. Но я, к счастью, быстро осознал, что использовать только этот метод — значит оставаться с посредственными результатами.</p>\n<p>А как еще можно найти покупателей? Я стал собирать способы привлечения — их оказалось так много, что я точно понял: без клиентов не останусь!</p>\n<p>Мне очень нравится фраза: «Я не знаю какого-то одного способа, который точно увеличит продажи в два раза.</p>\n<p>Но я знаю 100 разных способов, каждый из которых увеличит продажи хотя бы на 1%». Это же гениально!</p>\n<p>Чтобы создать системный поток, например пять человек в неделю, мне нельзя надеяться только на холодные звонки.</p>\n<p>Нужно найти пять разных источников , каждый из которых будет давать хотя бы одну заявку в неделю.</p>\n<p>Я обратил внимание на то, как привлекают клиентов лучшие продавцы — «звезды продаж»: им звонят по рекомендациям, обращаются партнеры, кто-то приходит с сайта, а кто-то — с выставки. Так родилась техника «Звезда», суть которой в том, чтобы использовать не один-два канала для поиска и привлечения клиентов, а минимум пять или шесть.</p>\n<p>Как начать использовать эту технику? В первую очередь, сделайте «посев», чтобы время работало на вас. Это схоже с посадкой картофеля. Вы кинули в яму клубни, засыпали землей и пошли заниматься своими делами, а ваш будущий урожай уже начал прорастать. Неплохо, правда? Так и в продажах: приложенные на старте усилия могут принести значительные плоды с минимальными затратами времени в перспективе.</p>\n<p>В чем идея «посева»? В том, чтобы проработать те направления, которые в будущем дадут вам в клиентов автоматически.</p>\n<p>Пример эффективного применения этой техники — работа с партнерскими каналами. Вначале вы активно формируете и развиваете отношения с ними, затем предлагаете привлекательные условия сотрудничества, которые приводят к автоматическому притоку заказов каждый месяц.</p>\n<p>Вот наглядный пример «посева» таким способом. Когда я работал в банке, то всего за 14 дней, будучи зеленым новичком, привлек более 50 агентств недвижимости. Как это получилось? Я отказался от банального метода предлагать все подряд, а сосредоточился на конкретных проблемах этой сферы и составил таблицу. В левом столбце написал типовые рабочие ситуации, справа — варианты решения этих ситуаций с помощью банковских продуктов.</p>\n<p>Ниже Типовая ситуация в агентстве недвижимости - Решение. У вашего клиента не хватает денег на покупку объекта недвижимости. - Клиент может оформить кредит по выгодным условиям, с низкой процентной ставкой, без залога и поручителей взять недостающую сумму.</p>\n<p>Ваши клиенты купили недвижимость,где предстоит делать ремонт. - Эксклюзивная программа кредитования ремонта, быстрое решение и бонусом — бесплатный расчет!</p>\n<p>У вас намечается сделка, клиент хранит деньги в валюте, а вам нужно провести ее в рублях. -  Мы согласуем для вас обмен по индивидуальному курсу, максимально приближенному к биржевому и выгодному обеим сторонам.</p>\n<p>У меня получилось не просто коммерческое предложение, а объемная памятка с решениями сложных ситуаций, которую я разослал или лично презентовал агентствам недвижимости.</p>\n<p>И это сработало: заявки стали стабильно приходить. Вы можете сделать то же самое. Найдите компании, которые будут о вас активно рассказывать своим клиентам на взаимовыгодных условиях: это могут быть вознаграждения, обоюдные рекомендации и так далее. Затем погрузитесь в боли вашего целевого потребителя и найдите среди продуктов то, что действительно сработает в его ситуации.</p>\n<p>Если вы научитесь это делать, сможете регулярно получать новые заказы без особых затрат, и ваши доходы улетят в космос!</p>\n<p>Однако помните, что «посев» в большинстве случаев требует терпения. У меня были случаи, когда клиент только через полгода вспоминал о разговоре и просил назначить встречу, чтобы обсудить детали. Однажды я оставил листовку с коммерческим предложением по зарплатному проекту руководителю филиала одного крупного университета. Клиент не перезвонил, и я, как и многие начинающие менеджеры, подумал, что презентация полетела в мусорную корзину. Мне тогда казалось, что если человек не связался сразу, то сделка сорвалась. Через полгода в моем офисе раздался звонок — это был тот самый руководитель филиала, который интересовался моим проектом. Получается, та листовка, которую я оставил, все это время лежала у него на столе. И теперь, когда возникла необходимость перейти в другой банк, человек вспомнил о моем предложении.</p>\n<p>К чему этот пример? Иногда менеджерам кажется, что «посев» не сработает. Дни идут — а клиенты и партнеры молчат. Но это не означает, что вы все делаете зря. На самом деле время работает на вас! Вы можете получить результат неожиданно, и это будет для вас приятным сюрпризом.</p>\n<p>Поэтому распространяйте информацию как можно раньше во всех каналах, где это возможно.</p>\n<p>Где еще можно искать клиентов? На выставках и конференциях. Этот канал тоже может приводить новых заказчиков, если грамотно использовать техники нетворкинга.</p>\n<p>То есть вы активно работаете над тем, чтобы у вас были полезные знакомства, и вы с помощью них могли легко выйти на человека, который вам нужен.</p>\n<p>Давайте разберем конкретный алгоритм, по которому вы уже сейчас можете начать строить свою сеть полезных контактов: Определите места, где вы можете знакомиться:</p>\n<ul><li>соцсети — ваше цифровое поле для нетворкинга;</li>\n</ul>\n<ul><li>фитнес-клубы — используйте тему спорта для общения,</li>\n</ul>\n<ul><li>конференции — идеальное место для налаживания профессиональных связей;</li>\n</ul>\n<ul><li>бизнес-завтраки и праздничные мероприятия. Придерживайтесь алгоритма нетворкинга:</li>\n</ul>\nШаг 1. Вступите в контакт Не думайте много, прежде чем подойти, и не оправдывайтесь тем, что у вас сегодня нет настроения для знакомства.\n<p>Надевайте улыбку и вперед! Вот несколько поводов начать диалог:</p>\n<ul><li><strong>1.</strong> Обратитесь за помощью: «Подскажите, как правильно это включить, открыть, использовать?» Это располагает собеседника.</li>\n</ul>\n<ul><li><strong>2.</strong> Задайте вопрос: «Подскажите, как долго продлится мероприятие?» Контекст события поможет найти точки соприкосновения с собеседником.</li>\n</ul>\n<ul><li><strong>3.</strong> Поделитесь впечатлениями. Например, если, слушая спикера, вы вдохновились какой-то его мыслью, выразите свое восхищение: «Отличная идея, надо попробовать!» Это может привести к интересному обмену мнениями. Помните, что разговор должен быть живым, избегайте односложных скучных ответов.</li>\n</ul>\nШаг 2. Будьте кратки Дайте собеседнику пообщаться и с другими участниками мероприятия. Хороший нетворкер знает, как сделать диалог интересным и незатянутым. За 15 минут, которые отводятся на кофе-брейк, вы должны успеть побеседовать с несколькими людьми, еще и чай попить.\n<p>Для первого разговора хорошо подойдет заготовка Elevator Pitch — мини-самопрезентация. Представьте: человек, с которым вы мечтали пообщаться, вдруг спрашивает: «Да, очень интересно, согласен с вами, а чем вы занимаетесь?» И у вас есть только 30-60 секунд, чтобы рассказать о себе.</p>\n<p>Точно так же в 20-е годы прошлого столетия делали молодые американские предприниматели. Это была эпоха интенсивного строительства небоскребов, и некоторые умелые и харизматичные стартаперы пытались зажечь искру интереса у потенциального инвестора прямо в лифте. У них было всего 30-60 секунд, пока кабина поднималась или опускалась на нужный этаж, чтобы озвучить свои идеи и убедить в необходимости финансирования. И кому-то это удавалось!</p>\n<p>За короткий разговор вы должны зацепить собеседника. Даже если у него будут еще десятки встреч, ваша презентация должна произвести такое яркое впечатление, чтобы среди всех участников он выделил именно вас.</p>\n<p>Самое главное в Elevator Pitch — коротко и ясно объяснить, чем вы занимаетесь. Не пытайтесь что-то продать!</p>\n<p>Как думаете, какое впечатление сложится у собеседника, если вы в лоб скажете: «Я делаю классные сайты! Вам, случайно, сайт не нужен?» Покажите, что с вами может быть интересно поговорить. Не затягивайте следующую встречу: уточните свободные даты и предложите удобное место, например, недалеко от офиса клиента. Если у вас это получится, считайте — ваш питчинг удался!</p>\n<p>Шаг 3. Согласуйте способ связи Это должно быть что-то максимально ненавязчивое. Например, предложите обмен номерами, чтобы позже списаться в мессенджере.</p>\n<p>Шаг 4. Используйте правило «3 за 30» В течение месяца свяжитесь с потенциальным клиентом хотя бы три раза и используйте разные каналы коммуникации. Это позволит укрепить связь и установить доверительные отношения, превращая случайное знакомство в ценное бизнес-партнерство.</p>\n<p>Следующий источник пополнения базы клиентов — рекомендации. Разумеется те, кому нравится ваш продукт, и так посоветуют его другим, но для устойчивого успеха этого недостаточно. Важно стимулировать клиентов активно рассказывать о вас и постоянно просить их поделиться, кому также может быть полезно это предложение. Часть клиентов точно даст рекламу знакомым, и вы регулярно будете получать определенный приток заказов по этому каналу.</p>\n<p>Дальше идет теплая база. Это те, кто уже знаком с вашей компанией и продуктом. Они сами оставляли свои контакты, обращались к вам и в перспективе готовы купить. Эти клиенты лояльны и покупают довольно часто.</p>\n<p>И наконец — холодные звонки. Хотите продавать больше и постоянно находить новых покупателей, независимо от поступающих заявок? Тогда холодные звонки — ваш надежный инструмент. Однако они требуют смелости, харизмы, умения быстро налаживать контакт и убеждать.</p>\n<p>Возможно, кто-то из вас спросит: «А что, холодные звонки работают до сих пор? Это же технология 90-х? Неужели в эпоху TikTok, Instagram&#x27; и других соцсетей это уместно?»</p>\n<p>На самом деле, да! Холодные звонки все еще позволяют привлекать заказчиков и ставить рекорды во многих сферах продаж (не во всех!), если их грамотно внедрить. К примеру, однажды я увеличил клиентскую базу для пекарни. Взял телефон, открыл интернет и за 30 минут привлек несколько человек с нуля. И здесь нет никакого секрета — только умение правильно выстраивать диалог. Поэтому я могу ответить всем скептикам: «Холодные звонки не работают только у тех, кто не знает, как их делать!»</p>\n<p>Помните, что техника «Звезда» подразумевает системную работу не по одному-двум направлениям, а по пяти-шести— стабильный поток клиентов зависит только от вашего усердия и настойчивости.</p>\n<p>Далее мы разберемся с холодными звонками подробнее, а пока подумайте, какие каналы привлечения клиентов вы можете использовать.</p>", "level": 3}, {"title": "ЗА КУЛИСАМИ ХОЛОДНЫХ ЗВОНКОВ", "html": "<p>Сразу хочу обозначить, что под холодными звонками я не подразумеваю спам физическим лицам. Более того, я категорически этого не приемлю и не провожу никаких тренингов на эту тему. В этом разделе мы сфокусируемся на холодных звонках в компании. И неважно, крупная или нет, звонок в любую из них может стать хорошим источником новых клиентов.</p>\n<p>Эта тема довольно обширна, и ей можно посвятить целую книгу, но я хочу дать вам самое необходимое. Несколько рекомендаций, чтобы вы смогли привлечь новых покупателей уже в ближайшие недели.</p>\n<p>Известный руководитель, председатель правления банка и наставник, с которым мне посчастливилось работать, однажды сказал фразу, которая изменила мое восприятие: «Холодные звонки — школа будущих топ-менеджеров.</p>\n<p>Это работа в тяжелых психологических условиях страха и отказов, это умение убеждать, заинтересовывать клиента, удерживать его внимание, обрабатывать возражения! Через это нужно пройти!»</p>\n<p>Потому даже если вы не планируете регулярно привлекать клиентов таким способом, важно понять, что это мощная прокачка ваших навыков. Техники из этой главы помогут проработать ваши внутренние страхи и неуверенность в себе, а также ускорят ваше развитие в сфере продаж. и Многие избегают холодных звонков, как только могут. причина этого — страхи. Надеюсь, вы выявили свои в прошлой главе и поработали над ними. Да, звонить незнакомым людям, сталкиваться с отказами, недовольством и даже грубостью — это вызов, но именно здесь скрывается ваш потенциал для роста. Кто-то может послать вас матом, кто-то выдаст неадекватную реакцию. Однажды я позвонил в компанию, чтобы предложить на рассмотрение наш банковский продукт, и женщина, с которой я общался, добавила к своему ответу цитату из «Евгения Онегина»: «Но я Сбербанку отдана и буду век ему верна!» Думаю, в этом случае даже работа с возражениями не помогла бы.</p>\n<p>Если вы сумеете правильно настроиться на разговор и научитесь грамотно использовать техники выхода на лицо, принимающее решение (ЛПР), то результаты обзвона будут абсолютно другими.</p>\n<p>Помните, что каждый холодный звонок начинается с минусовой позиции:</p>\n<ul><li><strong>1.</strong> Клиент вас не ждет, не лоялен к вам и, может быть, раздражен очередным звонком. Ваша задача перевернуть ситуацию и вызвать интерес.</li>\n</ul>\n<ul><li><strong>2.</strong> Клиент будет возражать, может резко оборвать разговор. Особенно если вы действуете неграмотно.</li>\n</ul>\n<ul><li><strong>3.</strong> Цикл сделки длиннее. Особенно когда пытаетесь выйти на ЛПР.</li>\n</ul>\n<ul><li><strong>4.</strong> Узкая направленность. Холодные звонки хорошо подходят для B2B-сегмента. Запомните это правило и больше не мучайте физических лиц. Вспомните себя, когда вам звонит неизвестно кто и предлагает неизвестно что. Хочется поскорее сбросить вызов. Я даже тренингов не провожу по этой теме, потому что считаю, что для привлечения клиентов-физлиц есть масса других способов, например, таргетированная реклама и реализация продукта через соцсети.</li>\n</ul>\nВсе это, конечно, убивает мотивацию. Но если вы посмотрите на ситуацию с другой стороны, то поймете, что, справившись с таким испытанием, другие способы общения с клиентом дадутся вам в разы легче. Вот почему я рекомендую всем, кто мечтает стать мастером продаж, не бояться холодных звонков, а, наоборот, воспринимать их как вызов и возможность научиться чему-то новому. Все зависит от умения эмоционально настроиться на предстоящий разговор.\n<p>Если вы читали предыдущую главу, то уже владеете всеми техниками преодоления страха и неуверенности в себе.</p>\n<p>Помню историю моего ученика Дмитрия, который продавал оборудование для управления вентиляционными системами через холодные звонки. За несколько месяцев работы по системе он перестал бояться и привлек 30 новых клиентов на 10 миллионов рублей. Дмитрий проработал свои страхи общения с незнакомцами, стал в начале диалога уверенно применять технику «ПТС» (покажите точки соприкосновения) и задавать грамотные вовлекающие вопросы. Его пример изменил у некоторых скептиков отношение к холодным звонкам — в сегменте корпоративных продаж они работают даже сегодня, если грамотно выстроить свою работу!</p>\n<p>Если вы хотите эффективно внедрить в работу холодные звонки, прежде всего нужно понять, с кем вам предстоит общаться. Очень важно собрать информацию о компании и тех, кто в ней работает. Конечно, если вы обзваниваете десятки компаний в день, углубиться в подробности не получится. Но если перед вами стоит задача точечного обзвона, где каждый номер — шанс на крупную сделку, подготовка должна быть максимально тщательной. Нужно учитывать все нюансы, чтобы войти в компанию грамотно. Изучите, какие там есть отделы и чем они занимаются, узнайте имена руководителей — секретари ценят, когда вы знаете, с кем хотите говорить.</p>\n<p>Итак, вы готовы к звонку. Следующий шаг — выйти на ЛПР. Понимание того, кто принимает решения в компании, может кардинально изменить ваш подход к продажам.</p>\n<p>Многие ошибочно считают, что ключевая фигура, закрывающая сделку — генеральный директор. Однако это далеко не всегда так. Да, он, возможно, поставит последнюю подпись, но вопрос о сотрудничестве зачастую рассматривается на другом уровне.</p>\n<p>Ваша задача — установить, кто именно влияет на процесс принятия решений в каждом конкретном случае. Это может быть кто угодно, от главного инженера до главного бухгалтера. Главное — найти этого человека и убедить его в ценности вашего предложения.</p>\n<p>Попасть на аудиенцию к ЛПР — вот что часто становится самой большой проблемой в холодных звонках. Кажется, все просто: позвонил и попросил соединить. Но никто не ждет вас в компании с распростертыми объятиями. Более того, на пути вам обязательно встретится бдительный секретарь, который предложит прислать ваше коммерческое предложение на электронную почту. А оттуда оно, почти со 100%-й вероятностью, отправится в корзину, и вы так и не поговорите с клиентом. Как быть? Ловко «обойти» секретаря.</p>\n<p>Есть несколько типов секретарей, и с каждым нужно применять особые приемы общения. Рассмотрим их все.</p>\n<ul><li><strong>1.</strong> «Секретарь-негативщик» не соединяет с руководителем ни при каких условиях. Его боссу может дозвониться только узкий круг людей. И вы не один из них.</li>\n</ul>\n<ul><li><strong>2.</strong> «Секретарь-ангел» без проблем переключает на ЛПР. Редкий вид. Встретить его — особое удовольствие.</li>\n</ul>\n<ul><li><strong>3.</strong> «Секретарь-фильтр» задает много уточняющих вопросов и только потом решает, соединять вас или нет.</li>\n</ul>\nПервые два типа встречаются не так часто. Большинство (около 80%) — это секретари-фильтры. Если вы научитесь проходить через них, ваша конверсия выхода на ЛПР возрастет до 90%!\n<p>Кого же соединяет «фильтр» с руководителем? Как правило, такие секретари пропускают два типа звонков:</p>\n<ul><li><strong>1.</strong> важный звонок;</li>\n</ul>\n<ul><li><strong>2.</strong> звонок от знакомого. Звонки с невнятными запросами о сотрудничестве или коммерческими предложениями, скорее всего, будут отсеяны.</li>\n</ul>\nДавайте проверим ваши скрипты на убедительность. Если вы скажете: «Звоню вам по сотрудничеству» или «У меня коммерческое предложение», — сразу будет ясно, что звонит явно незнакомый и точно не важный человек — можно класть трубку. А вот если вы скажете: «У меня важный вопрос по сертификации оборудования», - секретарь не сможет сходу определить в вас «чужака-продажника».\n<p>Возможно, даже встревожится, что не передаст руководителю что-то срочное. Это как раз то, что вам нужно! Дальше могут пойти уточняющие вопросы, но первый фильтр вы уже прошли.</p>\n<p>Техники, которые я дам вам ниже, как раз направлены на то, чтобы дать «фильтру» почувствовать, что на ваш звонок нужно обратить внимание.</p>\n<p>Техника Nº 1. «Передайте, что...» Вы звоните в компанию и просите: «Будьте добры, соедините с Иваном Ивановичем». Секретарь пока не понимает, с кем говорит, поэтому спрашивает, по какому вы вопросу.</p>\n<p>Уверенно ответьте: «Передайте, что звонит..» и назовите ваше имя. Можно добавить весомости: «По поводу поставки материалов в апреле». Эти слова заставят секретаря действовать. Если бы вы ответили: «Я по поводу сотрудничества», — вас бы сразу записали в ряды спамеров и завернули на электронную почту.</p>\n<p>Техника Nº 2. «Двусмысленность» Суть в том, чтобы ответить на вопрос о цели звонка неоднозначно, например: «По поводу работы сайта». То есть вы не говорите прямо, что продаете сайт, но, возможно, подтолкнете секретаря к мыслям, что с текущим сайтом компании какие-то неполадки. Главное здесь — не переходить границу обмана, а использовать неопределенные формулировки, оставляя место для интерпретации. Используйте вариации вроде: «По поводу обновления каталога» или «По поводу отгрузки новой запчасти». Ваша задача — не вдаваясь в детали вашего предложения, заставить секретаря сделать выводы самостоятельно.</p>\n<p>Техника Nº 3. «Сложная терминология» В этой технике ключевой элемент — использование терминологии, которая выходит за рамки понимания обычного сотрудника. Секретари обычно избегают глубоких погружений в незнакомые темы. Их миссия — быстро определить, кто вы и стоит ли вас переключать на начальника.</p>\n<p>Например, в банковской сфере мы часто использовали фразу: «По федеральной программе финансовой санации».</p>\n<p>Если сказать: «Я звоню по программе кредитования малого бизнеса», — то ответ будет: «Высылайте коммерческое предложение». Используйте такие фразы, как «изменения в последнем письме от Минфина», чтобы подчеркнуть серьезность вашего звонка. Это увеличит ваши шансы на успешное соединение с ЛПР.</p>\n<p>Техника Nº 4. «Ой, ошибся» Используйте хитрость, чтобы создать эффект неожиданности. Начните с запроса: «Пожалуйста, с Александром соедините по поставкам». Когда секретарь ответит, что такого сотрудника нет, воспользуйтесь моментом сбивчивости: «Странно, возможно, я неправильно записал. А кто у вас занимается этим?» Этот метод основан на «непреднамеренной» ошибке и внезапном переходе к реальному запросу. Вы называете популярное имя, создавая иллюзию знакомства, а затем быстро переключаетесь на цель вашего звонка. Это вызывает у секретаря легкое замешательство и инстинктивное желание помочь найти нужного человека.</p>\n<p>Техника Nº 5. «Пришел запрос» Можно пробудить любопытство и желание сотрудничать следующим образом: «Здравствуйте, коллеги сообщили о вопросе по поставкам. Не подскажете, кто у вас отвечает за это?» Этот подход создает впечатление, что запрос уже был сделан, и ваш звонок — лишь продолжение общения.</p>\n<p>Секретарь может предположить, какой это отдел, и соединить вас с ними. Да, в некоторых случаях этот прием не работает, но чаще собеседник предпочитает не вникать в сложность темы и соединяет вас с компетентным сотрудником.</p>\n<p>Техника Nº 6. «Обход секретаря» Начните со звонка не в приемную, а в другой отдел. Например, в бухгалтерию: часто на сайте компании есть прямые номера. Умышленно задайте сотруднику вопрос, который не в его компетенции: «Добрый день, мне нужно обсудить с вами выставление счета за наши услуги...» Ответ, скорее всего, будет: «Ну что ж вы мне звоните, я таких решений не принимаю, вам нужно к руководителю». И далее вас либо напрямую соединят с ЛПР, либо отправят к его секретарю.</p>\n<p>И вот теперь-то вы смело говорите: «Здравствуйте, я только что обсуждал вопросы по счету с вашим главным бухгалтером, она посоветовала связаться с руководителем». В этом случае ваш звонок с большой долей вероятности переведут. Такой подход вызывает доверие, вы кажетесь не посторонним, а участником внутренних процессов компании, что автоматически увеличивает вероятность достижения цели — связи с ЛПР.</p>\n<p>Хорошо, вы вышли на ЛПР, что дальше? Вдруг этот человек, даже не дослушав вас, свернет разговор и бросит трубку?</p>\n<p>Я проанализировал тысячи успешных звонков из совершенно различных сфер и пришел к выводу, что дольше поддерживать диалог с ЛПР и, соответственно, продавать больше, получается у тех, кто умеет утеплять контакт. Возникает вопрос: как это сделать? Предлагаю вам познакомиться с моей авторской техникой «ПТС», которую успешно используют уже сотни тысяч менеджеров и экспертов по всему миру.</p>\n<p>Более подробноо «ПТС», а также других методиках, помогающих установить теплый доверительный контакт даже с незнакомым человеком, мы поговорим в следующей главе.</p>", "level": 3}, {"title": "НАВЫК", "html": "", "level": 3}, {"title": "УСТАНОВЛЕНИЯ", "html": "", "level": 3}, {"title": "КОНТАКТА", "html": "", "level": 3}, {"title": "И ФОРМИРОВАНИЯ", "html": "", "level": 3}, {"title": "ДОВЕРИЯ", "html": "<hr>", "level": 3}]}, {"id": 6, "part": "ЧАСТЬ II. 8 НАВЫКОВ РЕКОРДНЫХ ПРОДАЖ", "partIdx": 1, "title": "Глава 6. Навык 3: Формирование доверия", "bodyHtml": "<p>«Они сомневаются. Им надо все обдумать, посоветоваться с женами или зубной феей. На самом деле неважно, что они говорят. Главная причина их сомнений в том, что они вам не доверяют! Ну и правильно делают: вы в зеркало себя видели? »</p>\n<p>Помните эти слова Белфорта, которого сыграл Леонардо ДиКаприо в «Волк с Уолл-стрит»? Можно по-разному относиться к фильму, но там прозвучала очень важная мысль.</p>\n<p>Доверие клиента — это ключ к большим продажам в любой сфере. У человека могут быть деньги, осознанная потребность в вашем продукте или услуге, но вы не сможете закрыть сделку, если он не уверен лично в вас.</p>\n<p>Марк Стивенс верно заметил: «Люди покупают доверие прежде, чем они покупают товары». Перед тем как что-то приобрести, покупатель сначала решает, может ли вам верить. Этот момент — краеугольный камень ваших продаж.</p>\n<p>Огромное количество сделок не закрывается именно из-за отсутствия расположения. И речь даже не о финальной подписи в договоре. Клиент может «сорваться» на любом этапе переговоров. Например, после созвона вы сразу предлагаете встретиться, чтобы провести презентацию продукта. Если вам не доверяют, то ни о какой встрече не может быть и речи.</p>\n<p>Как повысить доверие? Вечная загадка в мире продаж. Я задавал этот вопрос на своих тренингах тысячам участников, и убеждался, что ни у кого нет системы. Все действуют интуитивно и хаотично. Кто-то скажет, что клиенту нужно улыбаться, кто-то предлагает просто не спорить с ним.</p>\n<p>Одни утверждают, что нужно хорошо знать продукт и быть экспертом в своем деле, другие, что достаточно включить личное обаяние. Все эти советы звучат неплохо, и с первого взгляда кажутся довольно полезными, но без системного подхода остаются лишь беспорядочным набором тактик.</p>\n<p>Все без исключения говорят о важности взаимопонимания с клиентом, но, когда дело доходит до конкретных шагов, которые нужно
