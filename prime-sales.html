можно просто игнорировать. | Очень въедливый, приведет тысячу возражений по самым незначительным вопросам. Главное в общении с ним держать себя в руках, не дать вывести вас из себя, отвечать терпеливо и уверенно. | | Письменное общение | важно для закрепления устных договоренностей | стоит свести к минимуму | может замедлить решение вопроса | письменное общение является приоритетной и наиболее комфортной формой общения |</p>\n<hr>\n<hr>", "level": 4}]}, {"id": 8, "part": "ЧАСТЬ II. 8 НАВЫКОВ РЕКОРДНЫХ ПРОДАЖ", "partIdx": 1, "title": "Глава 8. Навык 5: Презентация решения", "bodyHtml": "<p>Часто на тренингах по продажам я задаю участникам вопрос: «Какая основная цель презентации?» Ответы разнятся: заинтересовать покупателя, дать ценность решения, понравиться собеседнику и найти общий язык, но самый частый ответ — рассказать о продукте. «Хорошо, — отвечаю я. — А ваша зарплата в этом случае, наверное, будет зависеть от того, сколько раз вы выступите с докладом по продукту?» И тогда правильный ответ приходит сам собой: главное в презентации — не отчеканить без запинки все характеристики вашей услуги или товара, а побудить клиента сделать следующий шаг.</p>\n<p>Например, оставить заявку на выполнение замеров, получить реквизиты для выставления счета или согласовать встречу офлайн или в Zoom. И масса других вариантов целевого действия! Необязательно все сразу сводить к закрытию сделки «здесь и сейчас». Сделка — это ваша главная цель, но идти к ней нужно постепенно, небольшими шагами. Что должно быть в вашей презентации продукта, чтобы клиент сделал этот шаг? Давайте разбираться.</p>\n<p>Вспомните рекламу автомобилей премиум-класса. Есть ли хоть один бренд, который тратит минутный ролик на перечисление технических характеристик авто? Никогда! Скорее, вы увидите, как машина мчит по черной ленте дороги, отполированный корпус поблескивает на солнце, а довольный водитель сидит в кожаном салоне и сосредоточенно смотрит на дорогу. Уголки его губ трогает легкая улыбка. Исполнение мечты, удовольствие обладать престижным автомобилем — вот что будет в основе продающей презентации, а не расход топлива и объем двигателя.</p>\n<p>Если вы хотите, чтобы ваша презентация была продающей, никогда не фокусируйтесь на свойствах продукта или услуги. Всегда презентуйте результаты, которые получит ваш клиент. Именно готовое решение клиенты покупают гораздо быстрее и платят за это в разы больше.</p>\n<p>Помню, как-то ко мне за продающим скриптом обратился клиент из сферы промышленных запчастей для оборудования. Я предложил ему вариант за 30 тысяч рублей. Заказчику такая цена показалась слишком высокой. Что стали бы делать в такой ситуации большинство менеджеров? Скорее всего, они кинулись бы предлагать скидку или что-то убирать из предложения, чтобы снизить цену. Но я в тот момент решил действовать по-другому и сказал: — Слушайте, а зачем вам вообще отдельно скрипт? Чтобы продажи росли, вам нужно все в связке: и скрипт, и шаблоны писем, и продающие коммерческие предложения, и правильная модель продаж, и настроенная CRM, и обученные менеджеры. Именно такой набор должен быть в основе вашей системы, чтобы вы получили результат.</p>\n<p>Клиент задумался, и в разговоре повисла небольшая пауза. Тогда я сказал, что это можно сделать за 300 тысяч рублей в месяц. — А на два платежа можно разбить? Я готов!</p>\n<p>Представляете, минуту назад этот человек говорил, что 30 тысяч рублей для него дорого, а теперь готов платить в 10 раз больше?!</p>\n<p>Этот пример очень показательный. Вместо того чтобы додумывать, что у покупателя нет денег, и искать для него более доступные варианты, я предложил работающую концепцию, которая всего за месяц принесла бы гораздо больший результат, чем если бы он купил только один скрипт. И за это клиент готов был платить деньги. Попробуйте так же!</p>\n<p>Концентрируйтесь во время презентации не на продукте, а на тех результатах, которые можно получить.</p>\n<p>Продавайте концепцию. Уверен, вы удивитесь, как вырастут ваши продажи с таким подходом.</p>\n<p>В этой главе мы разберем приемы и техники, которые сделают презентацию продающей, помогут донести до клиентов преимущества и будут мотивировать их покупать быстрее и без скидок.</p>", "sections": [{"title": "ФАТАЛЬНЫЕ ОШИБКИ", "html": "<p>Для начала разберем, какие ошибки чаще всего допускают эксперты и менеджеры в презентации.</p>\n<p>Первая ошибка: перечислять свойства продукта. Что происходит, когда вы загружаете клиента специальными терминами или перечисляете слишком сложные характеристики, не называя конкретных выгод для покупателя? Плюс ко всему прочему говорите монотонно и без каких-либо эмоций. Во-первых, покупателю становится скучно. Во-вторых, ему будет неловко, и, чтобы не показаться невежественным и глупым, он будет согласно кивать вам в ответ, но в итоге так ничего и не купит. И какой тогда смысл в вашей суперподготовленной речи, нашпигованной разными умными словами? Вспомните, когда я устраивался в дилерский центр, другим соискателям это не помогло.</p>\n<p>Тогда я так и не понял, по какому принципу отбирали участников, и подумал, что мне просто повезло. Это звучит странно, но мне помогло то, что я не знал продукт и технические свойства. Я не мог поддерживать диалог о характеристиках машины, поэтому чтобы заполнить паузу мне пришлось говорить о клиенте. Вместо того чтобы рассказывать про тип двигателя, я описывал, как покупатель едет по бездорожью на самые рыболовные места. Как он уверенно идет на обгон и какое удовольствие получает от любимой музыки в красивом салоне. Я сконцентрировался на покупателе и его эмоциях, а не на технических характеристиках автомобиля, и это стало решающим в моей презентации.</p>\n<p>Вторая ошибка: вести длинный монолог без вовлечения. Я не раз видел ситуации, когда менеджер рассказывает, рассказывает, рассказывает о своем продукте, а потом, словно финишировав в марафоне, выдыхает: «Вроде все». Человек терпеливо ждал, пока продавец завершит монолог, но значит ли это, что после такой презентации захотел купить?</p>\n<p>Конечно, нет. В продажах есть простое правило: когда ваши клиенты разговаривают — они покупают.</p>\n<p>Презентация - это не монолог продавца, а диалог с клиентом, во время которого он постепенно приходит к осознанию: «Ага, вот оно, решение моих проблем!»</p>\n<p>Третья ошибка: не говорить о преимуществах, которые важны клиенту. Хуже того — говорить о том, что сами считаете важным, то есть не учитывать, что у клиента может быть другой жизненный опыт, статус, финансовые возможности. Если вы грамотно провели этап выяснения ситуации, такой ошибки быть не должно.</p>\n<p>Однажды я анализировал отдел продаж одного крупного застройщика. Когда прослушивал первый звонок, был крайне удивлен: специалист так хорошо рассказывал об объекте, о концепции ЖК и инфраструктуре района, что у меня появились сомнения: а им точно нужно обучение? Все же отлично! Я продолжил слушать другие звонки. Второй, третий... И тогда все встало на свои места. Да, презентация была шикарная, но она была одинаковой для всех! В этом и заключалась большая ошибка менеджеров того застройщика.</p>\n<p>Они не чувствовали запрос клиента, не понимали его потребностей. И для инвесторов, и для семьи с детьми сотрудники заученно повторяли один и тот же шаблон скрипта. Но разве это допустимо при продаже недвижимости премиум-класса?</p>\n<p>А что нужно было сделать в этом случае? Создать условные аватары всех типов клиентов и прописать под каждый из них аргументы, почему они должны купить именно у вас. Например, инвестору вы можете сказать, что район довольно перспективный, в нем высокий спрос на аренду.</p>\n<p>Квартиру можно сдавать и получать неплохой пассивный доход, а позже выгодно перепродать, так как в этом районе недвижимость разбирают как горячие пирожки. Ему важна доходность и ликвидность объекта, а не наличие консьержа в подъезде. Если ваш покупатель — семья из четырех человек, расскажите о преимуществах проживания в этом доме: безопасный двор, развитая инфраструктура, близость садиков, школ, торгово-развлекательных центров.</p>\n<p>Смысл продаж не в том, чтобы заваливать клиента бесчисленными достоинствами и характеристиками продукта, а в том, чтобы презентовать его по-разному, с прицелом на закрытие потребностей того или иного человека. И так в каждом бизнесе, на самом деле. Всегда отталкивайтесь от запроса.</p>\n<p>Четвертая ошибка: не призывать к целевому действию. Это встречается довольно часто: после презентации вместо призыва не следующий шаг — тишина. Да, эксперты и менеджеры рассказывают о продукте, а потом... замолкают и ждут, что клиент закроет сделку сам. Такой сценарий точно не приведет вас к рекордным продажам. Когда вы не призываете к целевому действию, собеседник после небольшой паузы говорит: «Понял, спасибо, буду думать». Помните, что цель презентации — побудить человека к действию. И этот призыв должен звучать максимально четко.</p>\n<p>Пятая ошибка: пытаться закрыть клиента на сотрудничество с первой попытки. Представьте ситуацию, вы вхолодную звоните клиенту и говорите: «Здравствуйте, хочу предложить вам взаимовыгодное сотрудничество». А он первый раз о вас слышит. Для него это все равно что встреча с незнакомцем, который встал на одно колено и достал кольцо.</p>\n<p>Между вами еще нет никакого доверия — о каком сотрудничестве речь? Такая тактика выглядит довольно агрессивно, мало кто после этого захочет продолжать общение. Но, если попробуете начать контакт не с «глобального партнерства», а с приятного комплимента — вы удивитесь, как быстро и легко приблизитесь к сделке.</p>\n<p>Я работал над выстраиванием отдела продаж с I1-компанией, которая делает отчеты с анализом фармацевтического рынка. Эта система — их собственная уникальная разработка, над которой трудились десятки талантливых специалистов, и без преувеличения настоящий клад для производителей лекарств по всей стране. Когда я анализировал показатели продаж, моему удивлению не было предела — менеджеры работали только со старыми клиентами по инерции, а привлекать новых не получалось. Знаете, в чем была проблема?</p>\n<p>Эти ребята пытались найти новые заказы с помощью предложения о сотрудничестве. Но с таким банальным подходом в крупные компании не зайдешь! Неудивительно, что дальше секретаря их предложения не проходили. «С такой тактикой вы не договоритесь даже о встрече.</p>\n<p>Давайте попробуем по-другому, — предложил я. — Вы же говорите, что ваш анализ лучше, чем у конкурентов? Тогда отправьте клиенту часть: например, не по всему рынку, а по одному препарату. И, если его устроит уровень детализации, и он захочет получить аналитику рынка, предложите встретиться и показать полный отчет бесплатно».</p>\n<p>Такой подход перевернул работу отдела продаж. Менеджеры не могли поверить, что руководители из крупнейших компаний могут перезванивать сами и подтверждать встречи.</p>\n<p>А ведь для этого нужно было всего лишь вместо глобального сотрудничества предложить несколько промежуточных шагов, от которых целевым клиентам невозможно отказаться.</p>\n<p>А вы все еще сразу делаете предложение о сотрудничестве и оплате ваших услуг? Если да, то меняйте тактику.</p>\n<p>Лучше предложите небольшое, но полезное действие с вашей стороны, на которое клиент легко согласится.</p>\n<p>НЕ ВПАРИВАЙ, ВДОХНОВЛЯЙ Вы уже знаете, что текущие проблемы и потребности клиента — это его точка «А». Теперь важно презентовать решение ситуации так, чтобы оно было максимально удобным, выгодным и простым в исполнении. Другими словами, покажите конкретные шаги, с помощью которых покупатель достигнет своей точки «Б».</p>\n<p>Какие задачи вы поможете решить с помощью вашего продукта? Что вы сделаете, чтобы клиент получил нужный результат? Как он выиграет в деньгах, если воспользуется вашим предложением? Возможно, выручка его бизнеса увеличится, или снизятся издержки производства. Если вы сумеете показать выгоду, у покупателя просто не будет смысла отказываться.</p>\n<p>У Филипа Котлера есть прекрасный пример про дырки и дрели. Когда люди покупают дрель, им нужна не сама дрель, а дырки в стене, куда они вставят дюбели и на них повесят рамки с картинами или фотографиями. То есть клиенту изначально нужна не дрель — а картина на стене. К чему этот пример? К истории, о которой расскажу дальше.</p>\n<p>Однажды я покупал онлайн-курс, который стоил более 300 тысяч рублей. В то время это было для меня довольно серьезной инвестицией. Я долго смотрел страницу с описанием курса, кейсы, программу обучения и думал, а стоит ли это своих денег? Когда мне позвонил менеджер, я не удержался и сказал: «У вас в курсе не так много уроков, почему он стоит так дорого?»</p>\n<p>Консультант задал мне всего один вопрос, после которого я тут же оплатил заказ: — Вам нужно, чтооы уроков оыло как можно оольше, ил результат за меньшее количество уроков Это была очень действенная формулировка, которая заставила меня изменить свое отношение к предлагаемому продукту.</p>\n<p>Продавайте продукт — и вы заработаете тысячи. Продавайте результат — и вы заработаете сотни тысяч. Продавайте «результаты результатов» — и вы заработаете миллионы.</p>\n<p>Давайте разберемся, что такое «результаты результатов» и поможем клиенту добраться до заветной точки «Б». Предлагаю воспользоваться формулой «ФХВЭ», где: Ф — факт клиента Х — характеристики продукта В - выгоды для клиента Э — эмоции В чем суть этой формулы? На классических тренингах по продажам учат сначала приводить характеристики продукта, а затем преобразовывать их в выгоду для покупателя. Считаю, такая схема больше не эффективна, так как не всегда особенности предложения попадают в потребности клиента. Секретные ингредиенты моей формулы успешной презентации — факты о клиенте и его эмоции. Давайте разберем каждый компонент подробнее.</p>\n<p>Первое: факт клиента. Покажите с первых фраз, что ваша презентация опирается на ситуацию человека.</p>\n<p>Вы сказали... В вашей ситуации... Понял ситуацию, есть такое решение... Получается, У вас..</p>\n<p>Всего несколько простых фраз в начале вашей презентации показывают заказчику, что вы его услышали, и все ваши дальнейшие слова опираются на его обстоятельства.</p>\n<p>На втором и третьем шаге воспользуйтесь лайфхаком, который опытные продавцы часто применяют автоматически: совместите свойства предложения и выгоду, которую они дают.</p>\n<p>Прежде чем мы разберем конкретный пример, я хочу, чтобы вы зафиксировали важнейший момент — если вы хотите ставить рекорды в продажах, важно уметь любую характеристику продукта или услуги переводить в выгоду для клиента. Представим, что вы предлагаете услуги фотографа. «Я использую камеру Sony Alpha a7 IV с полнокадровой матрицей, делаю ретушь 20 фото, у меня есть время для выездной фотосессии с пяти до шести вечера». Все это характеристики. Есть ли в этой презентации что-то о потребителе? Нет, конечно — только «я» и «у меня». Да это и презентацией сложно назвать! Хотя такие предложения встречаются сплошь и рядом в самых разных сферах бизнеса: станки, насосное оборудование, услуги дизайнера — все описывают однотипно, без какой-либо пользы для клиента.</p>\n<p>Но давайте презентуем то же самое предложение фотографа на языке выгоды: «Выбрав меня в качестве вашего фотографа, вы получите первоклассные снимки с использованием полнокадровой камеры Sony a7 IV, которая известна превосходным качеством изображения. Уже на следующий день вы сможете скачать 20 профессионально обработанных фотографий — каждый снимок будет выглядеть безупречно и для соцсетей, и для фотоальбома. Время фотосессии с пяти до шести вечера — идеально для съемки с мягким закатным светом, который добавит особую атмосферу каждому вашему снимку».</p>\n<p>Почувствовали разницу? В этом варианте мы опирались на те же самые свойства продукта, но говорили не о себе и не о своей технике, а о клиенте: «вы получаете», «вы сможете» — и предложение звучит абсолютно по-другому.</p>\n<p>За каждой характеристикой стоит выгода для потребителя. Это может быть очевидно для вас как для эксперта в своей отрасли, но не очевидно для клиентов, которые, возможно, первый раз в жизни обращаются за такими услугами.</p>\n<p>Легко связать характеристики и выгоды вам помогут такие фразы-мостики: «благодаря этому вы сможете...», «Это позволит..», «это дает вам...», «в вашей ситуации это означает...» , «поэтому..».</p>\n<p>Характеристика продукта / услуги - Фраза-связка - Выгода клиента. Высота потолков в этой квартире 4 метра, - благодаря этому - в квартире будет больше естественного света и ощущение простора.</p>\n<p>Автоматическая коробка передач в автомобиле - позволит вам - легко и комфортно управлять автомобилем даже в условиях городских пробок.</p>\n<p>Низкое энергопотребление бытовой техники - дает вам - экономию на счетах за электроэнергию и уменьшение воздействия на окружающую среду.</p>\n<p>Наличие круглосуточной поддержки - означает, что - вы можете рассчитывать на помощь в любое время, спокойно и уверенно разобраться в продукте даже ночью и в праздничные дни.</p>\n<p>Мой ученик Георгий, который торговал запчастями для вилочных погрузчиков, в конце обучения в школе продаж сказал: «Самым ценным для меня стал навык презентации на языке выгоды. В марте моя выручка составляла 47 тысяч долларов, в июне — уже 106 тысяч. Мы купили супруге машину, и еще остались средства на отпуск!»</p>\n<p>Язык выгоды — это мощнейший усилитель продаж в любой сфере. Многим этого достаточно, чтобы показывать стабильно хорошие результаты. Но раз вы читаете эту книгу, я уверен, что вам недостаточно быть «середнячком» в своем деле.</p>\n<p>Вам нужны рекорды и лучшие показатели. Поэтому я дам технологию, которая поможет вашей презентации завоевать сердца многих клиентов.</p>\n<p>Даже если у вашего предложения всего одно преимущестВо, оно может закрыть разные нужды потребителя. Это очевидно не для всех продавцов, но вызывает wow-эффект у покупателей и заставляет их слушать вас с упоением. Какие запросы есть у клиентов? Вспомните классификацию « У Б ЭП ПГ Н». Представляете, одна характеристика может закрыть все эти потребности, и только от вас, как от профессионала, зависит, на что сделать упор. к примеру, вы предлагаете заказчику сделать ремонт в его новой квартире. Одна из характеристик вашей услуги — «срок выполнения проекта: четыре месяца». Давайте пройдемся по всем ключевым потребностям покупателя и посмотрим, как можно подать эту особенность, чтобы покупатель подумал: «Это то, что нужно!»</p>\n<p>Ниже: Потребность - Выгода для клиента Удобство - Мы предлагаем такой срок, потому что не хотим, чтобы вы отвлекались на задачи по закупке и доставке материалов для ремонта. Мы все сделаем сами, а вам останется только принять готовую работу.</p>\n<p>Безопасность - Такой срок необходим, чтобы соблюсти все необходимые требования безопасности. Нам важно, чтобы работа была выполнена качественно, и у вас не возникло никаких нареканий.</p>\n<p>Экономия - За счет такого срока мы сможем оптимизировать бюджет и сократить стоимость всего проекта. Это оптимальный вариант по соотношению «цена — качество».</p>\n<p>Престиж - За этот срок дизайнер сможет реализовать в ремонте все ваши задумки, а мы, в свою очередь, успеем организовать всю работу на самом высоком уровне.</p>\n<p>Принадлежность к группе - Мы сможем найти наиболее качественные материалы проверенных брендов, которые выбирают большинство покупателей на объектах такого уровня.</p>\n<p>Новизна - Такой срок позволит нам реализовать нестандартный инновационный подход в проекте, включая продуманный функционал умного дома.</p>\n<p>Если вы на этапе прояснения ситуации внимательно слушали заказчика и поняли, какая потребность для него ключевая, то сможете так подобрать характеристики предложения и презентовать их, что покупатель поймет - это точно про меня, это мне подходит наилучшим образом. Ваша презентация будет бить точно в цель — в потребности клиента, в то, что для него действительно важно.</p>\n<p>В демонстрации продукта самое важное — быстро адаптироваться под ситуацию и подавать характеристики вашего товара или услуги таким образом, чтобы человек видел в них идеальную возможность закрыть его потребности с максимальной выгодой.</p>\n<p>Наконец, перейдем к последнему компоненту в формуле убедительной презентации — эмоциям. Именно они побуждают клиента не откладывать решение на потом, а действовать прямо сейчас. Как вызвать эмоции?</p>\n<p>Давайте покупателю эмоциональные примеры. Опишите, как выглядит ваш продукт, расскажите про случай из практики, погрузите собеседника в историю так, чтобы в голове у него возникли живые образы. Характеристики продукта забудутся, а вот те чувства, которые клиент испытал, когда вы описывали яркую картинку, запомнятся. И самое главное - именно на этом этапе крайне важно презентовать «результаты результатов».</p>\n<p>Вернемся к примеру с ремонтом. Сделайте так, чтобы человек представил не просто квартиру с хорошей отделкой («результат»), а почувствовал то, ради чего он делает этот ремонт («результат результатов») — как просыпается на огромной мягкой кровати, как босиком проходит по теплому полу, ощущая, что здесь все создано для него. Как вечером он опускается в любимое кресло, включает мягкий рассеянный свет и наслаждается пространством, в котором хочется Жить, мечтать и достигать.</p>\n<p>Также можно воспользоваться визуализацией. Рисуйте схемы и графики на флипчарте в процессе общения с покупателем, показывайте заготовленные иллюстрации. Главное, чтобы наглядные материалы не были перегружены информацией, иначе клиент не будет слушать вас и читать слайды тоже не станет.</p>\n<p>Помню, как отрабатывал с руководителями подразделений крупнейшего банка страны навыки визуализации в процессе презентации: участники тренировались во время онлайнвстреч рисовать на слайдах, расставлять акценты и буквально управлялть вниманием клиента.</p>\n<p>Используете запоминающиеся формулировки. Создавайте яркие образы, подбирайте интересные сравнения и метафоры, которые помогут быстрее уловить смысл картинки или слайда из вашей презентации. Сравните два примера.</p>\n<p>Один человек скажет: «Я съел лимон», а другой — «Я взял сочный лимон, острым ножом отрезал тоненькую дольку — от брызнувшего сока свело скулы». В каком случае вы испытаете более сильные эмоции? Думаю, ответ очевиден.</p>\n<p>СНАЧАЛА ЦЕННОСТЬ, ПОТОМ ЦЕНА В каждой сделке наступает момент, когда нужно назвать цену. Для многих экспертов это очень волнительно, так как они понимают, что это не просто объявление стоимости, а тест на соответствие ценности продукта ожиданиям клиента. К сожалению, не все справляются: «Называю цену, и клиенты пропадают! Почему?» Сейчас мы разберемся с этим вопросом.</p>\n<p>Презентация цены — это умение показать покупателю не просто стоимость услуги, а ценность предложения, за которое он собирается заплатить. У спешная презентация цены, это когда человек в конце разговора говорит: «Супер, беру», а не «Что-то дороговато, надо подумать».</p>\n<p>Для начала разберем ошибки, как нельзя отвечать на прямой вопрос клиента о стоимости ваших услуг.</p>\n<p>Первая ошибка: сразу называете цену: «50 тысяч рублей». Да, вы указали стоимость, но не провели презентацию ценности. Если клиент не понимает, за что он платит, любая сумма будет для него большой. Поэтому сначала показывайте ценность и только потом расскажите, сколько это стоит.</p>\n<p>Вторая ошибка: вы вообще не называете цену, а говорите, что вышлете всю информацию в КП. Один из моих клиентов до работы со мной как раз использовал такую тактику. А он, к слову, продавал оборудование, которое стоило миллионы рублей. Когда покупатель в телефонном разговоре спрашивал о стоимости, продавец говорил, что по телефону такое не озвучивают, и высылал коммерческое предложение. Как думаете, что было дальше? Клиенты переставали выходить на связь. Почему так происходит? Потому что человек, увидев сумму в КП, уже сделал для себя выводы и понял, что ваш продукт ему не подходит. Нет смысла больше общаться с вами и тратить время. В таком сценарии у менеджера даже нет возможности грамотно презентовать цену, показать преимущества или предложить альтернативы.</p>\n<p>Именно поэтому очень важно не прятать цену в КП, а открыто и легко обсуждать с клиентом разные варианты по телефону или на встрече. Вы сможете получить мгновенную обратную связь, вовремя скорректировать предложение, удачно отстроиться от конкурентов. И уже после этого можно добавить, что всю информацию, которую вы сейчас обсудите и согласуете, вы зафиксируете и отправите в подробнейшем коммерческом предложении. Только такой подход к проведению презентации даст вам максимальную конверсию.</p>\n<p>Третья ошибка: вы испытываете внутренний дискомфорт при озвучивании стоимости. Это бывает, когда вы не уверены в адекватности цены за продукт и в глубине души считаете ее завышенной. Если вы называете сумму с таким чувством, не надейтесь на рекордные продажи. Клиент мгновенно считает вашу неуверенность. Жесты, односложные ответы, дрожащий голос, паузы в разговоре, извинения — покупатель моментально догадается, что вы не верите в свой товар.</p>\n<p>Представьте, что менеджер из автосалона BMW ездит на отечественном авто. Как ему без дискомфорта предлагать купить диски за 500 тысяч рублей, когда это половина стоимости его собственной машины? И вроде говорит он все по стандарту продаж, но без энтузиазма, без энергии, без задора. Так, будто про себя смеется над клиентом: «Ну и дурак!</p>\n<p>Зачем переплачивать, когда на рынке за углом такие же диски можно взять за 100 тысяч!»</p>\n<p>Но клиент как раз далеко не дурак. Он понимает ценность такой покупки. Ему нужен классный сервис: хочется быстро решить задачу и дальше наслаждаться комфортной ездой на крутой тачке. Вместо того чтобы бегать по сомнительным магазинам в поисках дешевой резины и качественной шимононтажки, за сэкономленное время он заработает гораздо больше денег, чем потратит на покупку и установку дорогих дисков. И разница здесь между клиентом и менеджером в том, что первый осознает это, а второй - нет.</p>\n<p>Поэтому очень важно прокачивать понимание ценности того, продукта, который вы продаете. Я рекомендую классное упражнение, которое поможет вам почувствовать значимость предложения и, если нужно, поднять на него цену. Пройдитесь по списку ваших клиентов и выберите самых лояльных к вам, вашей компании или вашему продукту. Позвоните им и спросите, почему они с вами работают? Что для них самое важное в работе с вами? Вы удивитесь, но большинство аргументов не будет связано с низкой стоимостью услуг. Возможно, скажут, что вы всегда на связи или что у вас продукция всегда в наличии. А может, у вас хорошо продумана логистика, и вы без проблем можете сделать обмен товара или провести бонусную онлайн-встречу. Когда вы увидите, что клиенты ценят сотрудничество с вами, а не дешевизну продукта, ваша собственная вера в достоинства продукта вырастет автоматически.</p>\n<p>Так же и в примере с автосалоном. Когда менеджер понимает ценность товара, ему легче продавать. Но тут важно не скатиться в излишнее высокомерие и не отвечать односложно: «Да, дорого, это же BMW, что вы хотели? » Покупатель действительно может не понимать, из чего складывается высокая цена на товар. И ваша задача — развернуто обосновать высокую стоимость. А для этого нужно самому осознавать, что продукт крутой и стоит своих денег.</p>\n<p>Четвертая ошибка: вы сразу предлагаете скидку. Например, покупатель задал вопрос о снижении стоимости, и вы тут же говорите: «Да, могу скинуть 10%». Так вы обесценили собственное предложение. У клиента возникает мысль: «А если бы я не спросил скидку? Что там за продукт, раз так легко снижают цену?» Не раздавайте скидки направо и налево, они подрывают доверие к вашему продукту.</p>\n<p>Другой вариант — когда вы в надежде поскорее закрыть сделку озвучиваете скидку, даже если человек о ней не спрашивал. Я слышал звонки, которые начинались с фразы: «Здравствуйте, у нас сейчас проходит акция — минус 50% на все программы». Но клиенту вообще не понятно, что это за программы и зачем они ему нужны. В его голове мгновенно возникает мысль: «Это что, очередной ловкий ход? Сначала завысили цену вдвое, а теперь делают вид, что дарят скидку».</p>\n<p>Так вы не только не привлечете покупателя, но и заставите его усомниться в вашей честности.</p>\n<p>Не спешите сбивать стоимость. Любая скидка должна быть обоснованной и предоставляться только в том случае, когда клиент понимает ценность вашего продукта или услуги.</p>\n<p>Обозначение цены — это некий «фильтр», отсеивающий потребителей, которым принципиально не подходит ваше предложение. Вот несколько правил, которые помогут презентовать стоимость продукта, чтобы она не показалась высокой.</p>\n<p>Первый прием — правильные слова. Избегайте формулировок с негативной коннотацией: «потратить», «заплатить», «дешевый», «дорогой», «расходы». Лучше замените их на «приобрести», «инвестировать», «получить», «стать обладателем», «доступный», «оптимальный». Например: «оптимальное соотношение цены и качества», «доступная цена», «окупаемость инвестиций составит...».</p>\n<p>Второй прием — дробление цены. Например, вы предлагаете подписку на какой-то сервис. Сумма за год может показаться довольно большой. Но если вы скажете: «Всего 1000 рублей в месяц» — это уже вполне посильно для клиента.</p>\n<p>Третий прием — «за сотрудника». Представьте: клиент хочет, чтобы вы установили годовой доступ к CRM-системе всему его отделу продаж, а это 20 человек. Опять же полная сумма может напугать. Гораздо эффективнее сказать, что стоимость вашей услуги — всего 1000 рублей за сотрудника в месяц. Можно добавить, что вложения могут окупиться уже в первые месяцы — CRM-система позволит менеджерам работать продуктивнее и закрывать больше сделок.</p>\n<p>Четвертый прием — привязка к результатам клиента. Представим, что ваша услуга «Разработка 20 сценариев коротких видео» стоит 100 тысяч рублей. Если презентовать ее как несколько листов с какими-то фразами, цена может показаться довольно высокой. А если пойти другим путем и показать возможный результат и окупаемость (например, опираясь на прошлый опыт и кейсы), эта стоимость будет восприниматься совершенно иначе. «С учетом вашего среднего чека, даже если одним видео сможем привлечь хотя бы одного заказчика, стоимость услуг по разработке уже окупится».</p>\n<p>Однажды я анализировал конкурента своего клиента, который продавал дорогие станки, и обнаружил довольно умный ход в его стратегии продаж. Чтобы убедить покупателей в выгоде такого приобретения, он объяснял, что, хотя оборудование и дорогое, но оно изнашивается медленнее, и после использования его можно отреставрировать и перепродать.</p>\n<p>Поэтому вложение окупается не только его долговечностью, но и возможностью сбыта, в отличие от бюджетных моделей, которые быстрее устаревают и теряют в цене. Гениально!</p>\n<p>КАК ПОКАЗАТЬ КЛИЕНТУ ОКУПАЕМОСТЬ ВАШЕГО ПРОДУКТА?</p>\n<ul><li><strong>1.</strong> Сделайте расчет вместе с клиентом. «По аналитике Яндекса, &quot;пекарня в Сочи&quot; ищет 1400 человек в месяц. Если создать сайт и грамотно его настроить, то около 1000 пользователей в месяц будут видеть ваше предложение. Даже один привлеченный таким способом клиент (например, офис, который ежедневно будет закупать выпечку для сотрудников) за месяц окупит ваши вложения в сайт».</li>\n</ul>\n<ul><li><strong>2.</strong> Покажите подобные кейсы из вашей практики. «Мы уже работали с компаниями из вашей сферы... Окупаемость их вложений была такой-то и зависела от таких-то факторов. Но могу сказать, что и при минимальной конверсии сайт окупится и положительно повлияет на репутацию компании». Такой прием показывает клиенту, что у вас есть опыт и вам можно доверять.</li>\n</ul>\nПятый прием — сравнение с понятными бытовыми вещами. Забавно видеть ситуации, когда клиент говорит «Дорого» на услугу за 100 тысяч рублей, а следом выкладывает в соцсетях отдых на Мальдивах или ужин в Мишленовском ресторане. Я помню, как предприниматель, который интересовался разработкой алгоритмов продаж, прямо спросил у меня: «Почему я должен купить ваш продукт, а не новый телефон?\n<p>Стоят они одинаково». В этом случае вашим конкурентом становится конкретная вещь, и тогда ваша задача — объяснить человеку, что с эффективными скриптами он сможет купить себе несколько таких телефонов. Бытовая вещь — приятный пассив, на нем не заработаешь, в то время как скрипты — инструмент, который приносит реальные деньги.</p>\n<p>Шестой прием — сравнение со стоимостью исправления ошибок. Если заказчик спрашивает, почему ваша разработка дизайн-проекта стоит 100 000 рублей, когда можно купить за 10 000, ответьте ему, что, конечно, можно и сэкономить.</p>\n<p>При этом есть риск ошибиться со специалистом и потерять сотни тысяч рублей на переделке ремонта и выборе новых материалов. Покажите во время презентации, что ваш продукт недешевый, но и цена исправления ошибок может встать в копеечку. Поэтому лучше заплатить чуть больше, но на выходе получить качественный продукт.</p>\n<p>Седьмой прием — «Вам с этим жить». Используйте этот прием, когда клиент покупает ваш продукт на долгосрочный период. Вы можете сказать так: «Вы сейчас поставите эти итальянские дверные ручки, а потом на протяжении многих лет будете браться за них и испытывать самые приятные ощущения. Посмотрите, из какого материала они сделаны!» — и дальше пройдитесь по всем ключевым потребностям заказчика. «Они очень крепкие, надежные, стильные, подходят к любому современному интерьеру, это выбор тех, кто ценит качество. Еще никто не возвращал эти ручки и не было ни одной жалобы на брак».</p>\n<p>Восьмой прием — тестируйте ценовой диапазон и восприятие клиентами разных цен. Например, покупатель спрашивает: «Сколько стоит ваш проект?» Вы можете ответить, что цены за такую услугу варьируются от 10 000 до 500 000 рублей — все зависит от комплекса задач, которые нужно решить. И после этого уже согласовывайте форматы работы по бюджету.</p>\n<p>Девятый прием — давайте клиенту два-три варианта цены, когда вы уже согласовали формат работы. Сократите диапазон цен до конкретной вилки, где за вариант с одним наполнением заказчик платит одну сумму, а за вариант с расширенным наполнением — другую. В случае с расширенным предложением можно сказать: «Есть еще один вариант, который включает все, что входит в первый, плюс несколько дополнительных опций. Какой вам сейчас больше подходит по бюджету?»</p>\n<p>Десятый прием — задавайте вовлекающий вопрос после озвучивания цены. Цель такого вопроса — перевести фокус внимания в сторону и дать «переварить» озвученную цену. Например, вы озвучили покупателю, что кондиционер, который ему понравился, стоит 100 000 рублей, тут же продолжите: «Сейчас в наличии на складе пять штук. К какому времени хотели бы установить кондиционер? » То есть вы не пытаетесь сразу закрыть сделку, а продолжаете вовлекать клиента в разговор. 480 РУБЛЕЙ = 480 000 РУБЛЕЙ Возможно, вы удивитесь, но такое странное на первый взгляд уравнение остается одним из моих главных правил продаж уже многие годы.</p>\n<p>Моя первая небольшая книга-сборник «165 готовых ответов на возражения клиентов» продавалась на сайте за 480 рублей. Сборник покупали тысячи людей, среди которых предприниматели, менеджеры, руководители отделов.</p>\n<p>Все они хотели решить свои проблемы, связанные с продажами: лучше работать с возражениями и закрывать больше сделок.</p>\n<p>У ловите эту мысль — клиентам нужна была не книга, а решение их задачи. Мы с командой звонили всем, кто покупал книги, благодарили за покупку, доверие и уточняли несколько вопросов по их ситуации. Часто оказывалось, что предприниматель брал сборник для своих менеджеров, которые продавали очень слабо. Когда человек узнавал, что можно еще и организовать корпоративный тренинг отдела продаж с моим личным выездом, он сразу бронировал дату и подписывал договор на 480 000 рублей (в то время столько стоил проект с моим участием).</p>\n<p>Для кого-то из вас, возможно, это очень неожиданно, но реальность такова — многие клиенты готовы покупать у вас больше услуг, если вы будете правильно их предлагать. Предложение дополнительных продуктов называется кросс-продажами, и это один из самых простых способов добиться рекордов.</p>\n<p>Все, что вам нужно сделать — это добавить несколько уместных фраз в вашу презентацию, и покупатели с удовольствием согласятся, еще и спасибо вам скажут. Но проблема в том, что многие продавцы, особенно неподготовленные, непрофессионалы, даже не пробуют продавать дополнительные продукты.</p>\n<p>Давайте посмотрим, по каким причинам менеджеры не используют в работе кросс-продажи.</p>\n<ul><li><strong>1.</strong> Неправильный эмоциональный настрой. Сотрудники относятся негативно к кросс-продажам, так как считают их банальным впариванием. Они уверены: если клиент не спрашивает о дополнительных товарах, то они ему не нужны.</li>\n</ul>\nКак решить эту проблему? Во-первых, поменяйте свое отношение. Относитесь к этому методу не как к навязыванию, а как к выгодному и полезному предложению.\n<p>Во-вторых, не додумывайте за покупателя и не говорите за него «Нет». Представьте, что он просто не знает о вашем крутом предложении, и только в ваших силах подсказать решение его задачи. Да так, чтобы клиент остался максимально доволен!</p>\n<ul><li><strong>2.</strong> Отсутствие навыка анализа ситуации клиента и корректировки предложения именно под его ситуацию. То есть менеджеры не знают, что и кому предлагать.</li>\n</ul>\nЗдесь я рекомендую посмотреть, какие продукты уже покупают ваши заказчики и в каком объеме. Наверняка в линейке ваших услуг есть то, что еще может их заинтересовать. Далее можно проанализировать типовые задачи, с которыми к вам приходят. Допустим, у вас есть три-четыре основных запроса: пропишите к каждому из них дополнительные продукты, которые можете предложить, и которые идеально подойдут к ситуации клиента.\n<ul><li><strong>3.</strong> Отсутствие плана кросс-продаж. У менеджера просто нет стимула думать, как продавать дополнительные товары — ему достаточно, что клиент покупает что-то одно.</li>\n</ul>\nПлан кросс-продаж стимулирует мозг работать и находить между продуктами логические связи. И вот вы уже предлагаете не один товар, а начинаете думать, как добавить что-то еще. Один, два, три, четыре нужных и полезных клиенту продукта.\n<ul><li><strong>4.</strong> Незнание техник кросс-продаж. Менеджеры не умеют вставлять в диалог вопросы-зацепки и фразы-связки, чтобы грамотно, а главное, красиво и легко перейти от основного продукта к дополнительному.</li>\n</ul>\nДавайте разберемся, какие виды кросс-продаж существуют и как вы можете использовать их в своем бизнесе.\n<p>Upsell — когда вы предлагаете клиенту купить продукт той же категории, но за большую сумму. Здесь важно презентовать более дорогое предложение так, чтобы покупатель осознал, что оно гораздо эффективнее решит его задачи и потребности, чем дешевый аналог, на который он смотрел изначально. Например, вы рекомендуете стандартный кофе вместо маленького.</p>\n<p>Cross-sell — здесь вы к основному товару предлагаете еще один, который идеально его дополняет. Покажите клиенту, что он только выигрывает от такой перекрестной покупки.</p>\n<p>Например, к кофе вы советуете взять свежий хрустящий круассан по выгодной цене. Down-sell — когда вы не проходите по бюджету, именно эта техника становится спасательным кругом. Чтобы сделка не сорвалась, лучше сделать понижающее предложение, которое хоть как-то сможет закрыть задачи клиента. Да, вы упадете в цене, но сохраните заказ. Down-sell выгодно предлагать вместо скидок на основной продукт: это позволяет покупателю уложиться в имеющуюся сумму, а вы при этом не даете необоснованных скидок на более дорогие варианты.</p>\n<p>Например, вместо стандартного стаканчика, вы продаете напиток меньшего объема. Это лучше, чем вообще уйти без кофе, согласны?</p>\n<p>Какой бы подход вы ни выбрали — всегда помните об уместности вашего предложения. Дополнительный продукт обязан помогать клиенту решить его задачи. Он должен быть логичным продолжением основной покупки.</p>\n<p>Если вы на экскурсии в горах берете бутылку воды, а продавец советует купить еще утюг, это вызовет недоумение, согласны? С таким сотрудником больше не захочется общаться. А вот если бы он предложил небольшой перекус в виде орешков или других снеков, это смотрелось бы уместнее.</p>\n<p>Кросс-продажи должны быть максимально заточены под потребности клиента и грамотно, лаконично презентованы. «В торговле я была более пяти лет, но про техники кросспродаж вообще ничего не слышала. У нас в интернет-магазине заявки входящие — и мы никогда не предлагали сопутствующие товары», — рассказывала мне Ирина, выпускница «Школы продаж». «Сейчас мы уделяем этому отдельное внимание — запустили матрицу кросс-продажи, внедрили вопросы-зацепки и фразы-мостики. Это очень хорошо повышает средний чек! Продажи выросли, и я достигла наконец цель в личном доходе — 100 тысяч рублей! Ура!»</p>\n<p>KAK ПРАВИЛЬНО ДЕЛАТЬ КРОСС-ПРОДАЖУ? Есть четыре шага, чтобы перейти от основного продукта к кросс-продаже и успешно ее закрыть.</p>\n<p>Первый шаг — добраться от основного продукта к дополнительному через фразу-мостик или вопрос-зацепку.</p>\n<p>Фразы-мостики помогают перейти от продажи одного продукта к дополнительному, который связан с основным.</p>\n<p>Несколько фраз-мостиков: — «С этим продуктом часто покупают вот это..» — «Кстати, этот продукт есть еще в комплекте с..» — «На этой неделе действует акция: при покупке этого продукта, вот этот идет со скидкой...»</p>\n<p>Вопросы-зацепки помогают перейти от продажи одного продукта к дополнительному, который, на первый взгляд, не очень связан с основным.</p>\n<p>Несколько вопросов-зацепок: — «Вы уже слышали про акцию месяца?» — «Что еще может понадобиться для ремонта/рисования/ похода? »</p>\n<p>Когда вы пользуетесь этими инструментами, то демонстрируете клиентоориентированность. Вы не тот продавец-ждун, который только отпускает покупателю выбранный товар, а эксперт, который подбирает оптимальное полезное решение. Как итог — лояльность к вам повышается, чеки растут.</p>\n<p>Второй шаг — сделать мини-презентацию сопутствующего товара. Здесь советую показать, как дополнительный продукт позволит клиенту добраться до его точки «Б». Мини-презентация проводится по формуле ФХВЭ, которую мы с вами разбирали ранее.</p>\n<p>Третий шаг — отработать возражения. Тут все просто. При продаже дополнительных продуктов используйте те же алгоритмы работы с возражениями, что и по основному. Эти методики мы разберем уже в следующей главе!</p>\n<p>Четвертый шаг — закрыть сделку. Здесь тоже ничего сложного — у вас обязательно должна быть хотя бы одна попытка привлечения на следующий шаг после предложения нового продукта.</p>\n<p>Техники кросс-продаж можно комбинировать. Главное, чтобы ваше предложение идеально вписывалось в ситуацию клиента. Если вы понимаете, что покупатель заинтересован вашим продуктом, смело действуйте.</p>\n<p>ФАКТЫ ГОВОРЯТ, ИСТОРИИ ПРОДАЮТ Однажды я был на встрече с клиентом, который хотел создать отдел продаж для своей медицинской компании. — У нас отраслевая специфика. Вы выстраивали до этого отделы продаж в медицинских компаниях? — спросил у меня заказчик.</p>\n<p>Я начал рассказ. — Несколько лет назад ко мне обратился предприниматель из Подмосковья, который продает аналогичное оборудование. Он тащил компанию на себе, и менеджеры постоянно засыпали его вопросами, не давая ни расслабиться, ни заняться стратегическими задачами. В какой-то момент понял, что идет на поводу у сотрудников. Те ставили ему условия, требовали повышение зарплаты, и он вынужденно платил больше. Более того — под влиянием семьи ему пришлось взять в отдел родственника, который не выполнял план и вдобавок создавал токсичную атмосферу в коллективе.</p>\n<p>Ситуация была плачевная. Мы начали работать. Оцифровали активность продавцов, внедрили КРІ и поняли, что из-за слабой организации отдела продаж предприниматель значительно переплачивал посредственным специалистам. Мы нашли сделки, в которых компания потеряла миллионы из-за слабых навыков команды. Изменения были необходимы. Уже после первого обучения несколько человек покинули штат. Они поняли, что не смогут работать эффективно. Мы подобрали новых.</p>\n<p>Это дало мощный импульс развитию и позволило руководителю задышать полной грудью. Ему так понравилась созданная система в отделе продаж, что он начал внедрять КРІ и системы управления в других подразделениях, включая технических специалистов по оборудованию.</p>\n<p>Спустя несколько месяцев его доходы достигли рекордных показателей. Но самое главное — теперь он мог уделять время важным задачам и перестал быть заложником «вечных проблем» своих сотрудников. «Хотите, я покажу вам его отзыв на бланке компании и дам контакт, чтобы вы могли напрямую обсудить все вопросы?» — закончил я свой рассказ и вопросительно посмотрел на собеседника. — Нет-нет, этого достаточно. — улыбнулся клиент, и еще до того, как он спросил: «Когда сможем начать работу?» — я знал, что он готов купить мой продукт.</p>\n<p>Почему истории работают? Потому что они создают эмоциональную связь между продавцом и покупателем. Когда вы рассказываете о каком-то кейсе, ваш заказчик сопереживает герою истории, ставит себя на его место и проводит параллели со своей ситуацией. Это дает возможность почувствовать выгоду от приобретения продукта и мотивирует быстрее совершить покупку. Факты и цифры важны, но именно истории убеждают и вдохновляют.</p>\n<p>КАК ИСПОЛЬЗОВАТЬ ИСТОРИИ В ПРОДАЖАХ? Личный опыт: делитесь своими успехами и ситуациями, когда продукт изменил вашу жизнь.</p>\n<p>Истории клиентов: рассказывайте реальные кейсы заказчиков, которые добились успеха благодаря вашему продукту.</p>\n<p>Эмоциональный аспект: включайте в истории эмоции и чувства, чтобы клиент мог сопереживать и представлять себя на месте героев истории.</p>\n<p>Используйте истории, чтобы вдохновлять и убеждать. Они сделают ваши проекты не просто успешными, но и запоминающимися. Как сказал один гениальный маркетолог Брайан Айзенберг: «Факты говорят, а истории продают».</p>\n<p>Это действительно так. Вы мощно усилите презентацию, если добавите в нее продающие истории. Почему это так важно?</p>\n<p>Первое: истории запоминаются. Сухая статистика и голые технические характеристики вашего продукта никому не интересны. Клиент с большей вероятностью запомнит эмоциональную историю: с сюжетом, героями, завязкой, кульминацией и развязкой.</p>\n<p>Второе: истории помогают вам нешаблонно презентовать основные преимущества вашего предложения. Вы не просто перечисляете плюсы, но подаете их покупателю через конкретные рабочие ситуации.</p>\n<p>Третье: истории удерживают внимание. Даже если вы будете представлять особенности продукта через выгоды, монотонное перечисление рано или поздно утомит любого слушателя. Но вовремя вставленная в презентацию живая история вернет внимание человека к вашей презентации.</p>\n<p>Четвертое: истории помогают работать с убеждениями. Представьте, что ваш клиент предприниматель, который обжегся на кредитовании малого бизнеса и теперь считает, что кредиты — это зло. Но если вы на реальном примере покажете удачную историю финансирования, есть вероятность, что ваш заказчик хотя бы задумается, что может быть по-другому.</p>\n<p>Пятое: запуск сарафанного радио. Если ваша история живая и яркая, клиент с большой вероятностью поделится впечатлениями с кем-то еще. Этот прием хорошо срабатывает внутри большой компании, когда решение по сделке принимается кругом лиц. Заинтересуйте одного из них, и он обязательно перескажет вашу историю другому.</p>\n<p>ПО КАКИМ ПРАВИЛАМ СТРОЯТСЯ ПРОДАЮЩИЕ ИСТОРИИ?</p>\n<ul><li><strong>1.</strong> История должна быть правдивой. Реальный кейс из вашей практики или ситуация, которая случалась в вашей компании. Если вы будете выдумывать на ходу, клиент это сразу почувствует и перестанет вам доверять.</li>\n</ul>\n<ul><li><strong>2.</strong> Опускайте реальные имена участников истории, названия фирм и компаний. Придерживайтесь правил конфиденциальности, главное — передать идею, а не персональные данные.</li>\n</ul>\n<ul><li><strong>3.</strong> Ваша история не должна повторять ситуацию клиента. Когда вы подбираете ситуацию точь-в-точь как у покупателя, он может уловить в этом неискренность. Лучше привести в качестве примера историю, которая начиналась гораздо хуже. Это послужит отличным фоном, который покажет, что если в тот раз сработало, то и здесь поможет.</li>\n</ul>\n<ul><li><strong>4.</strong> История не должна быть слишком длинной. Однойтрех минут достаточно, чтобы снять какой-то страх или возражение клиента. Не заставляйте его думать: «Когда же это закончится!» В конце обязательно сделайте вывод: чтобы человек вместе с вами зафиксировал основную мысль.</li>\n</ul>\nКОГДА УМЕСТНО ДОБАВИТЬ ПРОДАЮЩУЮ ИСТОРИЮ?\n<ul><li><strong>1.</strong> Когда нужно надавить на «красную кнопку». Покажите с помощью истории, что вы поняли ситуацию клиента и что у вас есть вполне рабочие инструменты для того, чтобы закрыть важные для него потребности.</li>\n</ul>\n<ul><li><strong>2.</strong> В качестве реакции на ответ клиента. Например, вы спрашиваете: «Какой у вас бизнес?» Собеседник отвечает, что у него собственная типография. Можете тут же обыграть: «Здорово! А у нас как раз есть несколько интересных проектов с типографиями, где мы получили классные результаты». Такие короткие диалоги сближают. И позже, когда вы начнете задавать клиенту вопросы, он будет охотнее на них отвечать.</li>\n</ul>\n<ul><li><strong>3.</strong> История может стать ответом на вопрос клиента «А вы уже работали с такими компаниями, как моя?»</li>\n</ul>\nНи в коем случае не отвечайте «Нет» или «Да, но сейчас точно не вспомню». Найдите историю, которая может подойти под ситуацию, перечислите, какие проекты вы реализовали из этой же или похожей сферы, это также повысит уровень доверия к вам и к вашему продукту.\n<p>ОСНОВНЫЕ ОШИБКИ, КОТОРЫЕ БЫВАЮТ ПРИ РАССКАЗЫВАНИИ ИСТОРИИ:</p>\n<ul><li><strong>1.</strong> У эксперта нет готовых историй. Да, возможно, вы совсем недавно в продажах, и у вас мало удачно закрытых сделок. Есть несколько источников, где вы можете брать истории: из опыта ваших коллег или тех, кто работал в компании до вас (на сайте компаний почти всегда есть раздел «Кейсы»). Также можно привести в качестве примера клиента, у которого был неудачный опыт работы с другой фирмой, а потом он пришел к вам.</li>\n</ul>\n<ul><li><strong>2.</strong> Менеджер не умеет рассказывать истории. Все они звучат слишком заученно и рекламно. Здесь вам поможет знание структуры.</li>\n</ul>\nХорошая история начинается с цепляющего вступления. Далее вы показываете героя с его проблемой. Рассказываете, как помогали ее решить, и завершаете успешным результатом и ценным выводом. Вот пример.\n<p>Пару месяцев назад мне написал клиент: «я не знаю, как еще искать сильных менеджеров по продажам? Я уже и подборщиков нанимал — за полгода заплатил им 700 тысяч рублей, а толку ноль! В моем регионе специалисты приходят слабые и надолго в компании не задерживаются...»</p>\n<p>Вот как мы с заказчиком решили действовать в сложившейся ситуации. Мы не стали искать сотрудников в офис, а набрали менеджеров на удаленную стажировку.</p>\n<p>Сделать это было намного проще, да и выбор среди желающих работать онлайн огромный! Внедрили новые сценарии взаимодействия и систему адаптации. Благодаря скриптам и настроенной CRM каждый из стажеров вышел на показатель больше 50 контактов в день, и уже через месяц они преодолели планку продаж в 2 миллиона рублей. И самое главное — предприниматель получил систему, которая легко масштабируется!</p>\n<ul><li><strong>3.</strong> Менеджер, пытаясь вспомнить какой-нибудь свой кейс, чересчур затягивает паузу в разговоре. Неумение сразу выдать хоть какую-то информацию показывает вашу неопытность. Воспользуйтесь приемом обобщения и расскажите историю не про конкретный проект, а про вашу работу с похожим сегментом.</li>\n</ul>\nЧтобы быстро и легко ориентироваться в кейсах, рекомендую составить таблицу: сгруппируйте всех своих клиентов по сегментам и продукту или услуге. И когда потенциальный покупатель спросит, работали ли вы с определенным направлением, у вас под рукой будет нужный пример.\n<p>Люди обожают истории. Правильно подобранные сравнения помогают клиентам быстрее понимать всю ценность работы именно с вами и мотивируют их переходить на следующий шаг!</p>", "level": 3}, {"title": "МАКСИМАЛЬНЫЙ ПРОГРЕСС", "html": "<p>Когда я работал с банками, которые продавали корпоративным клиентам кредиты для малого и среднего бизнеса, то замечал, что большинство встреч с предпринимателями заканчивались фразами: «Спасибо, будем иметь в виду».</p>\n<p>Почему так происходило? Потому что решиться на оформление займа многим очень непросто: это волнительное, стрессовое, иногда стратегическое решение для владельцев.</p>\n<p>Нужно все рассчитать, оценить свои возможности. Именно поэтому важно не давить на клиентов, а помочь им плавно и комфортно подойти к заключению договора.</p>\n<p>Как это сделать? Нужно грамотно озвучить следующий шаг. Помочь в этом может мощный инструмент — «Польза от прогресса». Для начала давайте разберемся в этом понятии, а потом научимся показывать выгоду от него. Прогресс — это продвижение вперед, к сделке. Задача эксперта в продажах — каждый раз при общении с клиентом добиваться максимально возможного прогресса.</p>\n<p>Да, бывает так, что уже при первом контакте покупатель готов оплачивать счет — тогда никакие промежуточные шаги вам не нужны. Но чаще клиент не готов подписывать договор, какую бы продающую презентацию вы ни сделали. В таких случаях задавайте себе вопрос: какой максимальный прогресс возможен в этой ситуации? Может быть, это проект договора, предварительный расчет, бронирование времени для замера, проведение личной встречи или договоренность о следующем звонке.</p>\n<p>Все эти варианты — ваши шаги к закрытой сделке. И задача эксперта предлагать клиентам максимальный прогресс из всех возможных.</p>", "level": 3}, {"title": "ПРИМЕРЫ ПРОГРЕССОВ ИЗ РАЗНЫХ СФЕР: Недвижимость:", "html": "<ul><li>встреча для просмотра объекта;</li>\n</ul>\n<ul><li>подача заявки в банк для финансирования сделки;</li>\n</ul>\n<ul><li>подготовка проекта договора купли-продажи;</li>\n</ul>\n<ul><li>выставление счета на оплату для подтверждения бронирования объекта. Продажа сантехники оптом:</li>\n</ul>\n<ul><li>встреча для обсуждения условий сделки;</li>\n</ul>\n<ul><li>приглашение в шоурум или на выставку;</li>\n</ul>\n<ul><li>подготовка коммерческого предложения, расчета;</li>\n</ul>\n<ul><li>подготовка проекта договора. Дизайн интерьера:</li>\n</ul>\n<ul><li>договоренность о предоставлении плана помещения;</li>\n</ul>\n<ul><li>презентация эскизов и типовых дизайн-решений;</li>\n</ul>\n<ul><li>подготовка сметы;</li>\n</ul>\n<ul><li>назначение встречи для обсуждения деталей по стилю и материалам;</li>\n</ul>\n<ul><li>подготовка договора оказания услуг. Продажа автомобилей:</li>\n</ul>\n<ul><li>запись на тест-драйв;</li>\n</ul>\n<ul><li>подготовка расчета стоимости конкретной комплектации;</li>\n</ul>\n<ul><li>обсуждение условий кредитования;</li>\n</ul>\n<ul><li>подготовка договора купли-продажи;</li>\n</ul>\n<ul><li>внесение предоплаты для бронирования автомобиля. КАКИЕ ОШИБКИ ЗДЕСЬ БЫВАЮТ? Первая ошибка: у эксперта только один вариант прогресса — это глобальное сотрудничество. Если клиент не готов сразу начать совместную работу, продавец теряется и не предлагает других вариантов взаимодействия.</li>\n</ul>\nВторая ошибка: у эксперта есть варианты прогресса, но он не продает их пользу, продолжая продвигать глобальное партнерство. «Мы классно поработаем, вам понравится, у нас есть хорошие скидки». Правильнее было бы сказать: «Давайте встретимся для того, чтобы..» — и развернуть ценность следующего контакта.\n<p>Чтобы клиенты чаще соглашались на предложенный вами вариант развития событий, важно понять простую вещь — «польза от прогресса» и «польза от продукта» — это не одно и то же.</p>\n<p>Польза от прогресса — это выгода не от сотрудничества в целом, а всего лишь от следующего шага. Зачем продавать сразу кредит, если можно предложить оставить бесплатный запрос? Всего лишь узнать предварительные условия, одобрит ли банк заявку или нет, рассчитать конкретный платеж. И уже с полным пониманием и спокойствием оформлять кредит, если он действительно будет подходить бизнесу. Согласитесь, такой вариант вызывает меньше тревоги? А значит, и клиенту будет проще на него согласиться.</p>", "level": 3}, {"title": "ПРИМЕРЫ «ПОЛЬЗЫ ОТ ПРОГРЕССА»: Продукт - Польза от продукта", "html": "<p>Недвижимость - Удовлетворение всех требований клиента, инвестиционная ценность. Вариант прогресса:</p>\n<ul><li><strong>1.</strong> Просмотр объекта. Польза от прогресса - Оценить инфраструктуру, качество отделки, вид из окна И т. Д.</li>\n</ul>\n<ul><li><strong>2.</strong> Подача заявки в банк для финансирования сделки. Польза от прогресса - Получить понимание по сумме одобрения, чтобы выбрать лучший объект и быстрее провести сделку.</li>\n</ul>\nПродажа сантехники оптом - Качественная сантехника, которая удовлетворяет потребности бизнеса клиента.\n<p>Вариант прогресса:</p>\n<ul><li><strong>1.</strong> Посещение шоурума. Польза от прогресса. Польза от прогресса - Возможность увидеть и оценить качество товаров, определиться с лучшим выбором.</li>\n</ul>\n<ul><li><strong>2.</strong> Подготовка коммерческого предложения. Польза от прогресса - Сделать конкретный расчет, зафиксировать цены и наличие на складе.</li>\n</ul>\nДизайн интерьера - Улучшение функциональности и эстетики помещения. Вариант прогресса:\n<ul><li><strong>1.</strong> Договоренность о предоставлении плана помещения. Польза от прогресса - Создать конкретный проект для помещения с учетом всех нюансов, рассмотреть концепцию дизайн-решений.</li>\n</ul>\n<ul><li><strong>2.</strong> Презентация эскизов и типовых дизайн-решений. Польза от прогресса - Возможность увидеть продуманные решения в аналогичных ситуациях, быстрее определиться с выбором.</li>\n</ul>\nАвтомобиль - Надежность, безопасность и комфорт. Вариант прогресса:\n<ul><li><strong>1.</strong> Проведение тест-драйва. Польза от прогресса - Возможность ощутить комфорт и управляемость автомобиля, определиться с выбором модели.</li>\n</ul>\n<ul><li><strong>2.</strong> Внесение предоплаты. Польза от прогресса - Возможность забронировать автомобиль именно этого цвета и такой комплектации.</li>\n</ul>\nКредит для бизнеса - Увеличение оборотных средств и возможностей для развития бизнеса.\n<p>Вариант прогресса:</p>\n<ul><li><strong>1.</strong> Бесплатная заявка. Польза от прогресса - Узнать, одобрит ли банк заявку, рассчитать конкретный платеж и уже с полным пониманием и спокойствием оформлять кредит.</li>\n</ul>\nЧтобы вам было проще показать клиенту пользу от прогресса, используйте формулу ДЧЕТ — она легко внедряется в бизнес и помогает повысить конверсию в закрытие на следующий шаг.\n<p>Д — давайте. Прогресс должен начинаться с побуждения совершить какое-либо действие: «Давайте проведем аудит отдела продаж».</p>\n<p>Ч — чтобы. Покажите пользу прогресса. «Давайте проведем аудит отдела продаж, чтобы определить, какие есть точки роста в вашей ситуации».</p>\n<p>Е — если. Добавьте условие, при котором клиенту будет выгодно переходить на следующий этап: «Если вам все подойдет по условиям, и вы увидите, что это выгодно для вас, то...»</p>\n<p>Именно эта фраза уменьшает стресс заказчика, которому сложно сразу решиться на покупку. Кстати, вы можете усилить формулировку, добавив срочность: «Если до четверга успеем провести аудит, то уже в пятницу вышлем отчет с первой аналитикой». Когда ваш покупатель слышит такой призыв к действию, он уже мысленно получает этот отчет на свой e-mail и начинает воплощать в жизнь новую схему увеличения продаж.</p>\n<p>Т — то. Покажите клиенту, что будет дальше. Это может быть сделка, либо следующий вариант прогресса. «Давайте оформим бесплатную заявку на расчет, чтобы узнать точный размер платежа и все условия финансирования. Если вам все подойдет, и вы увидите, что это в целом выгодно для вас, то будем планировать выдачу кредита. Попробуем?»</p>\n<p>По этой формуле вы можете делать прогресс на каждом этапе взаимодействия. Чем больше пользы вы предлагаете, тем меньше у клиента поводов отклонить ваше предложение.</p>\n<p>Формула «ДЧЕТ» помогает красиво, без давления и навязывания завершить презентацию и обозначить следующий шаг, на который покупатель легко решится. Например, если вы предлагали пластиковые окна и прогрессом будет замер, то ваша закрывающая фраза по формуле «ДЧЕТ» может звучать так: — Давайте запишу вас на бесплатный замер, чтобы было понимание итоговой суммы. Если вам подойдет наш расчет, то запланируем установку окон.</p>\n<p>Или: — Давайте выставлю вам счет, чтобы забронировать текущие условия и обезопасить вас от изменения цены и от валютных рисков. Если вы согласуете счет в течение трех дней, то гарантированно сможете оплатить его по текущим договоренностям.</p>\n<p>Каждая ваша презентация должна заканчиваться закрытием на максимально возможный прогресс. Для этого показывайте клиенту пользу от взаимодействия и используйте формулу «ДЧЕТ».</p>\n<p>Итак, вы научились убедительно презентовать продукт, давать в качестве примера сильные кейсы и побуждать сделать следующий шаг. Но даже после этого клиент может вдруг внезапно возразить: «Да, все супер, но что если...»</p>\n<p>О том, как предвосхищать возражения и отрабатывать их, поговорим на следующих страницах.</p>", "level": 3}, {"title": "НАВЫК РАБОТЫ", "html": "", "level": 3}, {"title": "С ВОЗРАЖЕНИЯМИ", "html": "", "level": 3}, {"title": "ГЛАВА 8", "html": "<p>Нет, нет и... да! Думаю, многие из вас слышали выражение: «Настоящая продажа начинается только, когда клиент сказал &quot;Нет!&quot;».</p>\n<p>Я с этим не согласен и придерживаюсь другого подхода в работе. Настоящее мастерство продаж не в том, чтобы с легкостью отбиваться от возражений, а в том, чтобы их вообще не допускать. Если вы нашли целевого клиента, тщательно изучили его ситуацию и потребности, сделали яркую презентацию и с блеском ответили на все вопросы, то никаких споров не будет.</p>\n<p>Чтобы добиваться высоких результатов, 80% усилий должны быть направлены на то, чтобы закрывать сделки без любых возражений.</p>\n<p>Я помню, как в одном из банковских проектов передо мной стояла задача привлечь как можно больше организаций малого бизнеса на обслуживание. Естественно, никто из клиентов не сидел и не думал: «Вот бы нам кто-то позвонил сейчас и предложил открыть счет». У всех давно уже были договоры в других банках. Вероятность нарваться на возражение в таком случае — почти 100%.</p>\n<p>Что сделали менеджеры моего отдела? Стали использовать технику предвосхищения возражений. То есть, не ждали, пока клиент скажет, что работает с другим банком, а говорили это сами. — Здравствуйте, у вас такой-то бизнес, да? У вас уже все отлажено и есть расчетный счет в другом банке, правильно понимаю? — Да, все верно. — Именно поэтому решил с вами связаться.</p>\n<p>Вы заметили, как поменялся сценарий разговора? Теперь ситуация «Я уже работаю с другим банком» не стопор в продаже, а наоборот — причина для продолжения диалога. Продавцу остается лишь привести аргументы в пользу следующего шага, используя приемы «сравнение» или «дополнение», которые мы с вами разберем в этой главе.</p>\n<p>А сейчас представьте, что чувствует человек, когда вы предвосхищаете возражение? До вас ему позвонили 50 ваших конкурентов с предложением о сотрудничестве, и он устал говорить «Я уже работаю с другими...». Ваша фраза «Я понимаю, что вы уже с кем-то работаете» — как бальзам на душу. Клиент даже не успевает возразить. Он видит вашу адекватность, понимание его ситуации, а значит, шансы на закрытие сделки растут!</p>\n<p>Заметьте, никто из наших менеджеров не сказал: «Вы уже сотрудничаете с другими? Ну ладно тогда, извините».</p>\n<p>И в этом было их преимущественное отличие. Более того, через неделю применения этой техники конверсия по назначенным встречам увеличилась в семь раз. Круто, правда?</p>\n<p>Всего одна фраза — и ваши продажи бьют все рекорды! Но если вы все же услышали «Нет», «Мне нужно подумать», «В другой компании дешевле», «Не уверен, что мне это нужно», читайте дальше — будем разбираться, как реагировать на отказы и превращать их в уверенное «Да».</p>\n<p>Прежде всего нужно понять, как относиться к возражениям? Хорошо, что они возникают или плохо? Когда я задаю на тренингах этот вопрос, мнения участников обычно разделяются.</p>\n<p>Одни говорят, что возражения — это хорошо, потому что диалог с клиентом продолжается, и есть шанс перевести сомнения в убедительные аргументы и закрыть сделку. Гораздо хуже, когда клиент просто кладет трубку или выходит из переписки. Другие утверждают, что возражения — это плохо. Если бы их не было, менеджеры продавали бы больше.</p>\n<p>Я отношусь к возражениям как к «звоночку» — скорее всего, на предыдущих этапах переговоров эксперт сделал что-то не так. Не прояснил до конца ситуацию клиента, не установил с ним контакт, не смог убедить в своей компетентности, да и презентация его была не на высоте.</p>\n<p>Хорошая новость в том, что критических возражений, способных на корню погубить сделку, не больше десятка.</p>\n<p>И если вы научитесь грамотно с ними работать, то сможете в большинстве случаев выходить на подписание договора.</p>\n<p>Что значит работать с возражениями? Если вы хотите продавать больше, вам нужно освоить два навыка. Первый — предвосхищать. То есть выстраивать взаимодействие так, чтобы сомнения вообще не появлялись. И второй: использовать проверенные стратегии и речевые приемы для эффективной обработки возражений, которые все же возникли во время разговора с клиентом.</p>", "level": 3}, {"title": "НЕЗАПЯТНАННЫЙ РАЗГОВОР", "html": "<p>«У меня был страх перед возражениями», — рассказывала мне участница тренинга Ксения из Волгограда, которая продавала ивент-услуги. «Меня не устраивал доход в 45 тысяч рублей, и я чувствовала, что выгораю из-за постоянных отказов... Когда я стала работать по системе рекордных продаж и внедрила техники предвосхищения и обработки возражений &quot;НЕ СПОРЬ&quot; — стало намного спокойнее. Я не нервничаю, когда заказчик со мной не соглашается. Количество закрытых сделок выросло почти в два раза!» Ксении удалось снизить стресс от работы с клиентами, потому что она стала осознанно готовиться к большинству реплик и использовать один из мощнейших принципов продаж на данном этапе — принцип «Пятна на рубашке».</p>\n<p>Работу этого принципа мы с вами рассмотрим на бытовом примере. Каждый из нас попадал в ситуацию, когда во время приема пищи случайно испачкался. Неловко? Очень. Особенно если после обеда у вас важная встреча или живое выступление. Большинство людей в панике попытаются оттереть злосчастное пятно. Но что сделает человек, который думает на два шага вперед? Правильно! Не допустит этот неприятный инцидент с пятном на рубашке — будет есть над тарелкой, а на колени постелет салфетку. В продажах то же самое. Куда проще предотвратить возражения, чем пытаться справиться с ними.</p>\n<p>КАК ПРЕДВОСХИТИТЬ ВОЗРАЖЕНИЕ? Первое и самое главное — работайте по системе рекордных продаж! Продавайте целевым клиентам по технике «Мишень». Выстраивайте взаимодействие по формуле 100% закрытия сделки. Грамотно устанавливайте контакт и доверие по формуле: Доверие = Экспертность + Эмпатия +Честность + Общее с клиентов Задавайте экспертные вопросы по «СОПРАНО» и презентуйте клиенту по «ФХВЭ» то решение, которое ему действительно подходит. Помните, что возражения в большинстве случаев — это индикатор того, что вы что-то делаете неэффективно на предыдущих этапах.</p>\n<p>Второе. Уже на этапе подготовки презентации выделите потенциально «опасные моменты», где могут возникнуть противоречия, и подготовьте возможные модули ответов в такой ситуации.</p>\n<p>Например, вы понимаете, что покупатель рано или поздно спросит о цене. Не ждите этого момента, поднимите тему первым: «Хотел обсудить предварительную стоимость нашего проекта. Наверняка, у вас есть такой вопрос. Дело в том, что итоговая сумма зависит от..» Такой маневр снижает напряжение: человек сразу поймет, что вы адекватно понимаете его ситуацию и стараетесь подобрать для него оптимальный вариант работы.</p>\n<p>Третье. Используйте технику «АнтиСПАМ». Забудьте о банальных и набивших оскомину формулировках. Услышав такие сочетания, как «взаимовыгодное сотрудничество» или «стратегическое партнерство», секретарь или ЛПР отмахнется от вас, как от назойливой мухи: «Спасибо, я подумаю, вышлите коммерческое предложение..»</p>\n<p>Общайтесь живо и человечно, а не как голосовой помощник. Бывает, с одним и тем же скриптом два менеджера работают по-разному. Один — говорит естественно, с правильными паузами и хорошей интонацией. А другой — бубнит что-то нечленораздельное по бумажке. Захочется вам продолжать общение с таким? Тут не возражать, а даже слушать нет желания.</p>\n<p>Чтобы не звучать как «спам», не забывайте фильтровать клиентов. Если вы будете продавать тем, кому не нужен ваш продукт, ждите возражений.</p>\n<p>Представьте, что мы с вами прямо сейчас, пока вы проходите эту главу, созвонились, и я предлагаю купить мобильный телефон. «Что? Зачем мне телефон? У меня уже есть — вы же мне как-то звоните?!» — возмутитесь вы.</p>\n<p>Но если я скажу, что прямо сейчас вы как читатель можете эксклюзивно приобрести свежий экземпляр моей новой книги «275 готовых ответов на возражения», — вы скорее согласитесь, чем откажетесь.</p>\n<p>Четвертое. Используйте позитивные формулировки во время презентации. Я часто вижу, как продавцы сами притягивают возражения, когда рассказывают о продукте. Например, «доставка этого товара возможна, но будет через три логистических центра и может занять две недели..». Даже эта вырванная из контекста фраза заставляет напрячься и провоцирует. А ведь менеджер мог использовать позитивную формулировку: «Доставка этого товара возможна, уже через две недели будет у вас. Это самый быстрый способ на сегодняшний день». Или вместо «Дом находится у сквера, но далеко от остановки, идти придется 10-15 минут» можно сказать: «Между остановкой и вашим домом есть небольшой уютный сквер, по которому можно прогуляться. 10-15 минут — и вы дома!»</p>\n<p>Если после общения с вами у клиентов возникают вопросы и сомнения, проанализируйте каждый этап своей работы и выявите, где вы «не дожимаете». А после направьте фокус именно на эти слабые места, а не на борьбу с возражениями.</p>\n<p>Эксперт, играющий на опережение, закрывает больше сделок. Прежде чем мы перейдем к разбору конкретных примеров, мне хочется еще раз подчеркнуть эту важную мысль: 80% ваших усилий в процессе продажи должны быть направлены на предвосхищение возражений, и только 20% на их отработку.</p>", "level": 3}, {"title": "ПОВОРОТ НЕ ТУДА", "html": "<p>Давайте возьмем несколько вариантов возражений и посмотрим, как на них отреагирует неподготовленный специалист? — У вас дорого! — Нам ничего не надо. — Всем продавцам лишь бы что-то впарить. — Я уже работаю с другими.</p>\n<p>Первая реакция — проигнорировать. Менеджер ведет себя так, будто не замечает слов покупателя. В воздухе повисает неловкая тишина, а потом, продавец неуверенно пытается продолжить разговор. Возможно, вы сейчас недоуменно вскинете брови: как это проигнорировать? Я помню, как читал отчет тайного покупателя и прослушивал записи переговоров, и в строке «Как менеджер ответил на возражения» было написано следующее: «Никак. Менеджер проигнорировал возражения клиента, оставил без комментария». Такое бывает, когда у сотрудника нет аргументов для ответа. Это говорит о его слабой подготовке. Ни одна из реплик клиента не должна остаться незамеченной. Это правило.</p>\n<p>Вторая реакция — завершить разговор. Клиент говорит: «Ой, вы знаете, наверное, нам пока не актуально» или «Спасибо, я подумаю». И менеджер, не пытаясь отработать этот отказ, просто говорит: «Да, конечно, всего доброго, спасибо, хорошего дня». Или додумывает за покупателя: «Ну, раз ему нужно время, зачем я буду лезть сейчас». Не сделать хотя бы одной попытки обработать возражение - большая ошибка. Как показывает практика, если клиенту грамотно ответить в такой ситуации и задать встречный вопрос, то часто он готов идти на контакт и продолжать общение, особенно если между вами уже есть доверие.</p>\n<p>Третья реакция — дать неуместный ответ на возражение. Клиент говорит: «Я подумаю» — и менеджер отзывается: «Давайте вместе подумаем» или «Над чем именно вы хотите думать?». Слышали такие ответы? Они не несут никакой ценности и не вызывают желания продолжать разговор. Или покупатель говорит, что уже работает с другими, на что менеджер спрашивает: «А с кем, если не секрет?»</p>\n<p>Это тоже не очень адекватный отклик. Человек будет чувствовать, что из него вытягивают информацию. И вместо того, чтобы идти на контакт, начнет еще больше возражать и закрываться.</p>\n<p>Четвертая реакция — оказывать давление на клиента. Например, когда клиент еще не особо готов делать расчет или изучать коммерческое предложение, а менеджер ему: «Давайте я вам все равно отправлю К, и вы посмотрите, может, передумаете..» Кажется, что такая настойчивость — залог успеха, но часто она имеет противоположный эффект.</p>\n<p>Покупатель чувствует себя загнанным в угол и старается быстрее закончить диалог. А после и вовсе пропадает с радаров, потому что осознает, что с такой компанией (а менеджер - это лицо компании, как вы помните) ему не по пути. Слишком сильное давление порождает дополнительное сопротивление. Человек будет согласен на целевое действие только тогда, когда он к этому готов.</p>\n<p>Пятая реакция — обесценить позицию клиента фразами «Вы не правы», «Я лучше знаю», «Вы просто не разбираетесь...». Такие ситуации возникают, когда специалист воспринимает возражения, как повод начать спор. Но это изначально проигрышная ситуация для продавца — даже если он найдет сильный аргумент в пользу своей точки зрения, как, думаете, отреагирует клиент? Скажет ли он: «Ну точно, так и есть, согласен с вами!» Это вряд ли. Никто не любит быть побежденным в споре. Поэтому, скорее всего, покупатель скажет: «Ну не знаю. Ладно, спасибо, всего доброго».</p>\n<p>А потом пойдет в другую компанию и купит у них точно такой же продукт из принципа.</p>\n<p>Шестая реакция — обидеться на возражение. Такое бывает, когда менеджер считает, что, раз он старался, рассказывал обо всех преимуществах продукта, покупатель обязан был согласиться. Что же, он зря тратил время? Никогда не принимайте возражения на свой счет. Относитесь к ним как к части процесса сделки, не более.</p>\n<p>Седьмая реакция — замолчать после ответа на возражение. Представьте ситуацию: клиент выдает какое-то возражение, продавец как настоящий профи легко на него отвечает, а потом замолкает и просто смотрит. В такие моменты у многих экспертов на лице видно полное удовлетворение своим ответом. Они чувствуют, что были настолько хороши в своих аргументах, что собеседнику ничего не остается, как ответить: «Да, я покупаю». Менеджеры ждут, что клиент закроет сам себя на эту сделку. Но этого не происходит. Что здесь не так? Цель — не просто ответить, а добиться прогресса в переговорах. Поэтому спросите покупателя, остались ли еще какие-то вопросы, и предложите ему следующий шаг.</p>\n<p>Не допускайте выхода клиента из разговора, когда он скажет, что все понял и будет думать. «HE СПОРЬ»</p>\n<p>Я создал алгоритм работы с возражениями и назвал его «НЕ СПОРЬ». Мне хотелось, чтобы аббревиатура легко запоминалась и отражала суть метода. Каждая буква— шаг по преодолению возражения. Но если читать как слово ЭТО совет, который должен стать нерушимым правилом для всех экспертов в продажах — не спорить с клиентом ни при каких обстоятельствах. «Возражения вгоняли меня в тоску», — рассказывала мне еще одна ученица, Алина из Армавира, которая продавала онлайн-курсы. «Благодаря техникам &quot;НЕ СПОРЬ&quot; я смогла выйти на доход более 3 миллионов рублей по продажам только одного продукта. Впервые за два года съездила в отпуск на заработанные деньги! Смогла купить MaBook, и это облегчило мою работу! Я безумно счастлива, что мне все это удалось!» Алина в свои 24 года показала, как, работая по системе рекордных продаж, можно достигать впечатляющих результатов.</p>\n<p>Давайте рассмотрим, как расшифровывается мой авторский алгоритм «НЕ СПОРЬ», который позволяет добиваться своих целей. «НЕ» в аббревиатуре означает — «не перебивайте». Например, когда клиент озвучивает какое-то возражение, вы так спешите ответить, что просто не даете договорить: «Да-да, я понял уже... Все совсем не так, как вы подумали..» — и дальше пытаетесь переубедить. Дайте человеку высказаться. Его что-то волнует, он в чем-то не уверен, а вы своим резким ответом показываете, что вам плевать на его чувства. Кому это понравится?</p>\n<p>Ваша цель номер один — внимательно выслушать покупателя. Именно в возражении, как вы помните, можно услышать истинные страхи клиента. Он озвучивает то, что мешает ему купить. Также иногда полезно посмотреть со стороны, как вы разговариваете с собеседниками. Раньше я записывал свои звонки, переслушивал и анализировал. Вы удивитесь, обнаружив, что часто тоже перебиваете и не даете закончить мысль. «С» — спросить. Это довольно сложный шаг. После того как вы выслушали клиента, у вас наверняка появились доводы, которые не терпится высказать. Не спешите с аргументами.</p>\n<p>На этом этапе они нужны меньше всего. В действительности покупателю нужен ваш искренний интерес к его ситуации и понимание, что его точно услышали. Поэтому я рекомендую в ответ на возражения клиента задавать встречный вопрос.</p>\n<p>Что это дает и почему это важно? Благодаря встречному вопросу вы получаете максимальную конкретику и понимаете истинную причину недовольства. Большинство возражений оказываются общими, довольно размытыми, а иногда и вовсе ложными. И, отрабатывая их в первоначальном виде, вы не продвигаетесь к сделке, а просто тратите свое время и силы.</p>\n<p>Например, за возражением «Дорого» может стоять неСколько смыслов:</p>\n<ul><li>Клиент не понимает, зачем платить за продукт или услугу так много, потому что в его картине мира это стоит дешевле.</li>\n</ul>\n<ul><li>Клиент сравнивает вашу цену с аналогичными предложениями конкурентов.</li>\n</ul>\n<ul><li>Продукт действительно дорогой для конкретного клиента, у него просто нет денег. Возможно, это не ваша целевая аудитория.</li>\n</ul>\n<ul><li>Своим заявлением клиент «прощупывает» вас на скидку. Видите? За одним коротким словом «дорого» может стоять минимум четыре больших смысла. И преодолеть это возражение получится лишь в том случае, если ваши аргументы будут точно подходить под ситуацию конкретного человека.</li>\n</ul>\nИменно поэтому важно уточнять. Также благодаря встречному вопросу вы показываете интерес к ситуации клиента, его сомнениям и переживаниям. Как ваша эмпатия отражается на уровне доверия к вам вы уже знаете.\n<p>И, конечно, дополнительный вопрос позволяет вам избежать спора с покупателем, потому что вы не сразу озвучиваете свои аргументы, а углубляетесь в ситуацию.</p>\n<p>Например, вам говорят: — Дорого. Ответьте следующим образом: — Дорого по сравнению с аналогами или в принципе за эту услугу?</p>\n<p>Это позволяет понять, что конкретно вкладывает клиент в свои слова, и вы сможете на следующих шагах подобрать сильные аргументы.</p>\n<p>Вот еще пример реакции на возражение: «Дорого». — Цена — важный аспект. При этом не самый главный, так как по стоимости мы всегда готовы договориться с покупателем. Скажите, если смотреть в целом, этот продукт (решение) вам подходит?</p>\n<p>Как видите, вы задаете вопрос, чтобы получить больше информации и понять причину сопротивления. «П» — присоединиться. После того как вы конкретизировали суть возражения клиента, снова не спешите с ответом.</p>\n<p>Для начала попробуйте присоединиться — то есть найти в его словах то, с чем вы можете согласиться не в ущерб своей позиции.</p>\n<p>Здесь продавцы допускают две ошибки. Первая — сразу пытаются переубедить. В такой ситуации собеседник не воспринимает аргументы, потому что не готов слушать. У него одна позиция, у эксперта другая — происходит банальный спор. Вторая ошибка — менеджеры, наоборот, со всем соглашаются. Например, на возражение «Дорого!» говор
