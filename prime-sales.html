<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Система продаж Прайм — Полная база знаний</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/remote-sync.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232736;
    --border: #2e3348;
    --text: #e2e4ed;
    --text2: #8b90a5;
    --accent: #6c8cff;
    --accent2: #4a6adf;
    --accent-glow: rgba(108,140,255,.12);
    --green: #4ade80;
    --orange: #f59e0b;
    --red: #ef4444;
    --cyan: #22d3ee;
    --purple: #a78bfa;
    --pink: #f472b6;
    --radius: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { 
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.6; font-size: 15px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .header p { color: var(--text2); font-size: 13px; margin-top: 4px; }

  /* Tab switcher */
  .tabs {
    display: flex; padding: 0 24px; gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .tab {
    padding: 12px 20px; font-size: 13px; font-weight: 500;
    cursor: pointer; color: var(--text2);
    border-bottom: 2px solid transparent;
    transition: all .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Breadcrumb */
  .breadcrumb {
    padding: 10px 24px; font-size: 13px; color: var(--text2);
    border-bottom: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .breadcrumb span { cursor: pointer; color: var(--accent); }
  .breadcrumb span:hover { text-decoration: underline; }
  .breadcrumb .sep { color: var(--text2); cursor: default; }
  .breadcrumb .current { color: var(--text); cursor: default; }

  .content { max-width: 920px; margin: 0 auto; padding: 24px; }

  /* ══════ MIND MAP ══════ */
  .mindmap { padding: 24px; max-width: 1100px; margin: 0 auto; }
  
  .pipeline {
    display: flex; flex-direction: column; gap: 0;
    position: relative;
  }
  .pipeline::before {
    content: ''; position: absolute;
    left: 28px; top: 40px; bottom: 40px;
    width: 2px; background: var(--border);
  }
  
  .stage {
    display: flex; align-items: flex-start; gap: 16px;
    position: relative; z-index: 1;
    padding: 8px 0;
  }
  .stage-dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid; flex-shrink: 0;
    margin-top: 14px; margin-left: 20px;
    position: relative; z-index: 2;
    background: var(--bg);
  }
  .stage-connector {
    width: 20px; border-top: 2px dashed var(--border);
    margin-top: 23px; flex-shrink: 0;
  }
  
  .stage-card {
    flex: 1; background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    cursor: pointer; transition: all .15s;
  }
  .stage-card:hover {
    border-color: var(--accent);
    transform: translateX(4px);
    background: var(--accent-glow);
  }
  .stage-card .stage-label {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.2px; font-weight: 600;
    margin-bottom: 4px;
  }
  .stage-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .stage-card .stage-desc { font-size: 13px; color: var(--text2); line-height: 1.5; }
  .stage-card .stage-tools {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
  }
  .tool-tag {
    font-size: 11px; padding: 3px 10px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; color: var(--text2);
    cursor: pointer; transition: all .12s;
  }
  .tool-tag:hover { border-color: var(--accent); color: var(--accent); }
  
  /* Foundation block at top */
  .foundation {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 32px;
  }
  .foundation h2 { font-size: 18px; margin-bottom: 12px; }
  .foundation .formula {
    font-size: 20px; font-weight: 700; text-align: center;
    padding: 16px; background: var(--surface2);
    border-radius: 8px; margin: 12px 0;
    color: var(--accent); letter-spacing: 1px;
  }
  .foundation .fnd-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin-top: 12px;
  }
  .fnd-item {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
    cursor: pointer; transition: all .12s; text-align: center;
  }
  .fnd-item:hover { border-color: var(--accent); transform: translateY(-2px); }
  .fnd-item .fnd-num { font-size: 20px; font-weight: 700; color: var(--accent); }
  .fnd-item .fnd-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
  
  /* OP section */
  .op-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 24px; margin-top: 32px;
  }
  .op-section h3 { font-size: 16px; margin-bottom: 12px; }
  .op-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 8px;
  }
  .op-item {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    cursor: pointer; transition: all .12s;
  }
  .op-item:hover { border-color: var(--accent); transform: translateY(-2px); }
  .op-item .op-title { font-size: 14px; font-weight: 500; }
  .op-item .op-desc { font-size: 12px; color: var(--text2); margin-top: 4px; }

  /* ══════ LIST VIEW (original) ══════ */
  .part-card { margin-bottom: 28px; }
  .part-title {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--accent);
    margin-bottom: 10px;
  }
  .ch-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px; margin-bottom: 8px;
    cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: space-between;
  }
  .ch-card:hover { border-color: var(--accent); background: var(--accent-glow); transform: translateX(4px); }
  .ch-card .ch-num { color: var(--accent); font-weight: 700; font-size: 14px; min-width: 28px; }
  .ch-card .ch-title { flex: 1; font-weight: 500; font-size: 15px; }
  .ch-card .ch-count { color: var(--text2); font-size: 12px; background: var(--surface2); padding: 3px 10px; border-radius: 20px; }
  .ch-card .arrow { color: var(--text2); margin-left: 12px; font-size: 18px; }
  
  .sec-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px; margin-bottom: 6px;
    cursor: pointer; transition: all .15s;
    display: flex; align-items: center; gap: 12px;
  }
  .sec-card:hover { border-color: var(--accent); background: var(--accent-glow); transform: translateX(4px); }
  .sec-card .sec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .sec-card.level-4 .sec-dot { background: var(--green); }
  .sec-card .sec-title { font-size: 14px; }
  .sec-card .arrow { color: var(--text2); margin-left: auto; font-size: 16px; }

  .text-content {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 24px; margin-top: 16px;
  }
  .text-content p { margin-bottom: 14px; line-height: 1.75; }
  .text-content ul { padding-left: 20px; margin-bottom: 14px; }
  .text-content li { margin-bottom: 6px; line-height: 1.65; }
  .text-content strong { color: var(--accent); font-weight: 600; }
  .text-content hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .text-content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--text2); margin: 16px 0; }

  .ch-intro {
    background: var(--surface2); border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px;
    font-size: 14px; color: var(--text2);
    max-height: 200px; overflow: hidden; position: relative;
  }
  .ch-intro.expanded { max-height: none; }
  .ch-intro .fade { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(transparent, var(--surface2)); }
  .ch-intro.expanded .fade { display: none; }

  .search-box { margin: 16px 24px 0; }
  .search-box input {
    width: 100%; padding: 10px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-size: 14px; outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text2); }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent); font-size: 13px; cursor: pointer;
    margin-bottom: 16px; padding: 6px 0;
  }
  .back-btn:hover { text-decoration: underline; }
  
  @media (max-width: 600px) {
    .fnd-grid { grid-template-columns: repeat(3, 1fr); }
    .op-grid { grid-template-columns: 1fr; }
    .stage-connector { width: 10px; }
  }
</style>
</head>

<script>
const DATA = [{"id": 1, "part": "ЧАСТЬ I. ФУНДАМЕНТ СИСТЕМЫ ПРОДАЖ", "partIdx": 0, "title": "Глава 1. Формула 100% закрытия сделки", "bodyHtml": "<p>«Спасибо! Как оплатить?» — фраза, которую мечтает услышать каждый продавец. Я не был исключением. С самого начала своей карьеры я ждал торжественного момента, когда клиент скажет эти слова. Но чаще всего слышал совсем другое: «Я подумаю», «Дайте мне время», «Вернусь к вам позже».</p>\n<p>Каждый раз, сталкиваясь с такими ответами, я искренне не понимал, что делаю не так. Проходил тренинги, читал обучающие книги, следовал традиционной схеме классической школы с простым подходом: «5 шагов — сделка твоя». Ее описывали в каждом учебнике и озвучивали все эксперты: следуй этому плану, и все сработает.</p>\n<p>Но у меня не срабатывало. Я бесконечно искал ошибки в своих действиях, пробовал различные техники, экспериментировал с фразами, но результат оставался прежним — клиенты не были готовы покупать «сейчас». И вот тогда я задал себе важный вопрос, который перевернул мое понимание продаж.</p>\n<p>Что нужно сделать для клиента прямо сейчас, чтобы он сказал: «Я покупаю»? К каким результатам должно привести наше общение?</p>\n<p>Это полностью изменило мое мышление. Я сместил фокус внимания с продукта, который презентую, на клиента, которому продаю. Что должно происходить в его голове? Что он должен почувствовать, понять и узнать, чтобы принять решение здесь и сейчас? Это открыло для меня совершенно новый подход к продажам. Я больше не зацикливался на том, чтобы просто следовать заученному скрипту. Понял: все мои действия должны быть нацелены на клиента и его готовность совершить покупку.</p>\n<p>Так я пришел к созданию Формулы 100% закрытия сделки. Она дает точный ответ на главный вопрос: «Какие условия должны быть выполнены, чтобы клиент гарантированно купил здесь и сейчас?»</p>\n<p>В тот момент я даже представить не мог, что через несколько лет крупнейшие компании страны будут заказывать у меня консультации по внедрению формулы в свои отделы продаж. Эту технику используют в CRM-системах, в отчетах, она переходит между менеджерами. Иногда я получаю сообщения от знакомых: «Смотри, в нашем отделе теперь используют твою формулу».</p>\n<p>То, что когда-то стало спасением для меня, теперь помогает тысячам экспертов и предпринимателей достигать рекордных показателей.</p>\n<p>Продажи перестанут быть для вас лотереей с неизвестным исходом и станут четко отстроенной системой, где каждое действие приводит к результату.</p>\n<p>Итак, что же это за формула? Как работает и почему она такая эффективная? Выглядит она так: П = ФВ × ОП × Д × ЛПР × ЗС Это 5 ключевых критериев, которые определяют моментальное решение о покупке (П), где:</p>\n<ul><li>ФВ — финансовая возможность покупателя. Представьте клиента, который хочет купить квартиру.</li>\n</ul>\nОн готов рассматривать варианты, посещает показы, консультируется с агентами, но у него нет возможности получить ипотеку или внести необходимый аванс. В таком случае сделка просто не состоится. Как бы вы ни старались, денежные ресурсы покупателя — это основа, без которой ничего не получится. Или возьмем пример из бизнеса: вы предлагаете компании новую систему автоматизации. Клиент заинтересован, но бюджет ограничен, и они просто не могут позволить себе внедрение прямо сейчас. Без финансовой возможности все остальные шаги теряют смысл.\n<ul><li>ОП — осознанная потребность. Наличие средств для покупки ничего не значит, если человек не осознает, что ему нужен ваш продукт. В случае с недвижимостью: клиент может позволить себе квартиру, но еще не готов совершить покупку, потому что не видит необходимости менять текущее жилье. Или пример из бизнеса: компания может позволить себе вашу систему автоматизации, но пока справляется без нее. Они не видят, как ваше предложение решает их проблемы. Осознание потребности — это ключевой момент, без которого сделка останется на паузе.</li>\n</ul>\n<ul><li>Д— доверие. Даже если у клиента есть деньги, и он осознает необходимость в покупке, договор не будет подписан без доверия. Возвращаемся к примеру с квартирой: клиент может бояться, что агент или застройщик — ненадежные партнеры.</li>\n</ul>\nОн начнет сомневаться в вашей компетенции или честности, что сведет на нет все усилия. В бизнесе это работает так же: компания может иметь бюджет и осознавать важность вашего продукта, но, если нет доверия к вам как поставщику, они не станут вкладываться.\n<ul><li>ЛПР — лицо, принимающее решение. Часто эксперты ошибочно предполагают, что общаются с тем, кто будет заключать сделку. Но на практике реальный ЛПР может оказаться совсем неожиданным. Вот пример: вы продаете квартиру молодой паре. Проводите все переговоры с мужем, который активно интересуется планировкой, ценой и ипотечными условиями. Вроде бы все понятно — именно он принимает решение. Но неожиданно выясняется, что за покупку квартиры отвечает... тесть. Именно он выделяет деньги на первый взнос и будет одобрять финальный выбор. И если тесть не убедится, что это выгодное вложение, продажа может сорваться.</li>\n</ul>\nДругой пример — вы продаете систему автоматизации крупной компании и ведете переговоры с IT-директором.\n<p>Он задает вопросы, анализирует технические параметры системы и выражает заинтересованность. Но решение все равно не принимается. Почему? Оказывается, финальное слово за директором по безопасности. Хотя автоматизация напрямую не касается его сферы, именно он отвечает за то, как внедрение новой системы повлияет на информационную безопасность компании. И если его опасения по поводу рисков не будут сняты, продажа не состоится. Таким образом, пока вы не поймете, кто на самом деле ЛПР, вы рискуете потерять сделку.</p>\n<ul><li>ЗС — здесь и сейчас. Даже если человек готов купить, осознает потребность и доверяет вам, покупка может не состояться, если нет причин для немедленных действий. Например, клиент решает подождать, потому что не видит разницы, купит ли он квартиру сейчас или через три месяца.</li>\n</ul>\nВ бизнесе это происходит, когда компания решает отложить внедрение продукта до следующего года. Ваша задача — показать, почему действие необходимо прямо сейчас.\n<p>В этом вам помогут мотиваторы клиентов и десятки техник закрытия сделок, которые мы разберем чуть позже.</p>\n<p>Каждый из этих критериев может быть либо равен единице, либо нулю:</p>\n<ul><li>1 — критерий выполнен,</li>\n</ul>\n<ul><li>О — критерий не выполнен. Если хотя бы один из критериев равен нулю, сделка не состоится.</li>\n</ul>\nЭта формула универсальна и применима в любой сфере — будь то покупка квартиры, щебня или услуги по построению отдела продаж. Теперь любая сделка, зависшая на неопределенное время или та, с которой вы только начинаете работу, может быть разобрана детально. Все как на ладони: вы точно понимаете, какой критерий нужно улучшить, чтобы закрыть клиента.\n<p>Формула 100% закрытия сделки — это только один элемент системы, которая помогает вам стабильно закрывать сделки и достигать результатов. Впереди самое интересное — полное раскрытие комплекса из 8 ключевых навыков, которые сделают ваши продажи рекордными.</p>\n<p>В следующей главе мы разберем каждый и посмотрим, как они работают вместе, чтобы вывести вас на новый уровень.</p>", "sections": [{"title": "СИСТЕМА РЕКОРДНЫХ ПРОДАЖ", "html": "<p>Мы с командой анализировали результаты выпускников школы продаж, которые после обучения резко вырастали в показателях. Нам нужно было определить, что именно люди начинали делать по-другому, чтобы зарабатывать больше в разы. Не на 10-30% процентов, а в 2-10 раз! Выводы, к которым мы пришли, разрушали все стереотипные схемы увеличения продаж. Ни в одном кейсе успех не был связан с чистой коммуникацией и пятью шагами классической методики. Ежегодно многие компании тратят миллионы рублей на обучение сотрудников этим техникам в надежде выйти на новый уровень, но для рекордного роста им нужно делать совершенно другое!</p>\n<p>Те, кто получил кратный рост в продажах, проявили совсем другие навыки:</p>\n<ul><li><strong>1)</strong> Глубокий анализ ситуации для принятия ключевых решений: таблицы для анализа клиентской базы abcxyzанализ, swot-анализ, работа с цифрами, умение задавать правильные вопросы и принимать точные решения.</li>\n</ul>\n<ul><li><strong>2)</strong> Самоорганизация и управление эмоциями: использование приложений, чек-листов и системы планирования, дисциплина, управление временем и эмоциями.</li>\n</ul>\n<ul><li><strong>3)</strong> Развитие и поддержание отношений с клиентами: использование принципа «семьи», замер лояльности NPS, умение превосходить ожидания клиентов и вызывать «wow-эффект».</li>\n</ul>\nБезусловно, многие отмечали, что им помогали и навыки коммуникации, и работа с возражениями, и кросс-продажи, и правильные вопросы. Но когда речь шла о кратном росте, эти умения были не самыми главными критериями успеха.\n<p>Такие выводы наверняка подтолкнут вас к осознанию, что «волшебные фразы и скрипты», которые ищут большинство новичков, — это не то, что нужно для рекордов. Вам нужна система.</p>\n<p>Это комбинация 8 ключевых навыков. Если у вас сейчас невысокие продажи, значит, верхняя диаграмма про вас. Слабые навыки продаж и работа не по системе — вот главная причина низких показателей. Дело не в клиентах, не в продукте и не в экономической ситуации в стране. Дело в вас и вашей подготовке. Все, что отделяет вас от высоких результатов, — это 8 навыков.</p>\n<p>Хорошая новость в том, что все эти способности можно прокачать — есть конкретные приемы, техники, упражнения, которые сделают вас мастером продаж. Прежде чем я поделюсь с вами инструментами по каждому навыку, давайте посмотрим на эту диаграмму внимательнее и разберемся, как работает система.</p>\n<p>НАВЫК 1. САМООРГАНИЗАЦИЯ В ПРОДАЖАХ Если ваш список задач растет быстрее, чем вы успеваете его разбирать, важные дела откладываются «на потом», а рабочий день заканчивается ощущением, что вы были заняты, но не продвинулись ни на шаг — значит у вас слабо развит навык самоорганизации. Постоянный хаос в планах отражается не только на вашей продуктивности, но и на внутреннем состоянии: растет тревожность, копится усталость, а мысли о выгорании становятся все навязчивее.</p>\n<p>Самоорганизация — это не просто грамотное управление временем, но и умение управлять собой. Внешняя структура (четкое планирование, контроль задач, дисциплина) дает результат только в сочетании с внутренней устойчивостью: способностью работать без перегрузки, не зацикливаться на страхах и не разрываться между десятками мелких дел.</p>\n<p>Навык самоорганизации дает вам четкое понимание, какие действия приносят результат, а какие — просто создают видимость занятости. Вы планируете день так, чтобы ключевые задачи выполнялись в первую очередь, снижаете уровень стресса и увеличиваете свои продажи без авралов.</p>\n<p>Вы определяете точку «Б», делаете декомпозицию целей и внедряете инструменты, которые помогают вам эффективно управлять своим временем и энергией. Вы спокойно работаете по «карте дня» и добиваетесь результатов.</p>\n<p>В следующей главе вы узнаете, как развить навык самоорганизации «внутри» и «снаружи», чтобы достигать рекордных продаж без выгорания.</p>\n<p>НАВЫК 2. ПОИСК КЛИЕНТОВ Если постоянный страх остаться без новых клиентов преследует вас, вы зависите от случайных рекомендаций и контактов, а каждая продажа кажется удачей — значит, у вас слабо развит навык поиска клиентов. Вы пытаетесь продавать всем подряд, что только увеличивает количество отказов и добавляет стресса.</p>\n<p>Развитый навык поиска клиентов позволяет вам точно определять, кто является вашей целевой аудиторией, и выстраивать системный подход к привлечению покупателей.</p>\n<p>Вы больше не гонитесь за каждым встречным, а целенаправленно работаете с техникой «Мишень», чтобы привлекать нужных людей, и техникой «Звезда», чтобы получать стабильный поток новых заказов. Вы становитесь мастером нетворкинга, умеете находить контакт с ЛПР в компаниях разного уровня, и люди сами заинтересованы в общении с вами.</p>\n<p>В главе 4 «Не каждый клиент — мой клиент» вы узнаете, как развить навык поиска клиентов и построить систему привлечения, которая стабильно приносит результат.</p>\n<p>НАВЫК 3. ФОРМИРОВАНИЕ ДОВЕРИЯ Если клиенты сомневаются, откладывают покупку или уходят к конкурентам, значит, уровень доверия к вам низкий. Вы замечаете это, но не понимаете, как изменить ситуацию и показать себя надежным партнером, у которого захотят покупать.</p>\n<p>Развитый навык формирования доверия позволяет вам сразу же вызывать у покупателей ощущение, что с вами можно и нужно работать. Вы применяете формулу из 4 компонентов, точно понимаете, какие шаги усиливают уверенность в вас, а какие — разрушают ее. Вы не просто заявляете о своей экспертности, а демонстрируете ее через действия и общение. В результате охотнее покупают именно у вас, а не у конкурентов.</p>\n<p>В главе 5 «Доверься мне» вы узнаете, как повысить уровень лояльности клиентов на каждом этапе продажи.</p>\n<p>НАВЫК 4. ПРОЯСНЕНИЕ СИТУАЦИИ Если на встречах вы чувствуете, что общаетесь вслепую не знаете, какие вопросы задать, сталкиваетесь с односложными ответами и неловкими паузами, — значит, у вас слабо развит навык прояснения ситуации. Вы рассказываете о продукте, но клиенту это не интересно, потому что вы не понимаете, что для него действительно важно.</p>\n<p>Развитый навык прояснения ситуации позволяет вам точно уловить то, что для собеседника является самым важным при покупке. Вы задаете вопросы по «СОПРАНО» для понимания ситуации покупателя, определяете его потребности по формуле «У Б ЭП ПГ Н», владеете техниками активного слушания и умеете задавать продающие вопросы, которые направляют диалог к сделке.</p>\n<p>В главе 6 «Говори меньше — продавай больше» вы узнаете, как взаимодействовать с клиентом и определять его боли, чтобы продажи стали легкими и естественными.</p>\n<p>НАВЫК 5. ПРЕЗЕНТАЦИЯ РЕШЕНИЯ Если во время переговоров клиенты отвлекаются, зевают или смотрят на телефон, а после остаются равнодушными — значит, ваш навык презентации решения очень слабый. Вы рассказываете о продукте, но не видите вовлеченности, не уверены, что человек понял ценность вашего предложения, и в итоге встреча превращается в пустую формальность.</p>\n<p>Развитый навык презентации позволяет вам преподносить информацию так, чтобы клиент захотел действовать сразу. Вы используете формулу ФХВЭ, чтобы показать, как продукт решает конкретные задачи. Применяете техники «Польза от прогресса» и «ДЧЕТ», чтобы повысить ценность предложения, и рассказываете продающие истории, которые вызывают эмоции и формируют желание купить.</p>\n<p>В главе 7 «Покажи и убеди» вы узнаете, как превратить презентацию из скучного доклада в мощный инструмент, который приводит к закрытию сделки.</p>\n<p>НАВЫК 6. ОТРАБОТКА ВОЗРАЖЕНИЙ Если каждое «Я подумаю» или «Мне пока ничего не нужно» выбивает вас из колеи, а сомнения клиентов кажутся окончательным отказом — значит, у вас слабо развит навык работы с возражениями. Вы боитесь услышать негативную реакцию, чувствуете себя загнанным в угол и воспринимаете несогласие как спор, в котором чаще всего проигрываете.</p>\n<p>Развитый навык отработки возражений позволяет вам спокойно и уверенно реагировать на любое сопротивление.</p>\n<p>Вы используете технику «НЕ СПОРЬ», грамотно аргументируете свою позицию, усиливаете ценность предложения и ведете клиента к покупке без давления и конфликтов.</p>\n<p>Меньше возражений — больше закрытых сделок! В главе 8 «Нет, нет и... да!» вы узнаете, как прокачать этот навык и превращать сомневающихся клиентов в лояльных покупателей.</p>\n<p>НАВЫК 7. ЗАКРЫТИЕ СДЕЛКИ Если у вас скопилось много зависших договоров, заказчики говорят, что им все нравится, но так и не покупают — значит, у вас слабо развит навык закрытия сделки.</p>\n<p>Вы не знаете, как правильно напомнить о себе, боитесь показаться назойливым и в итоге теряете клиентов, которые были практически готовы к покупке.</p>\n<p>Развитый навык закрытия сделки позволяет вам точно понимать, когда и как подвести покупателя к решению без давления. Вы используете формулу, применяете более 20 техник закрытия, умеете грамотно работать с зависшими клиентами и не даете покупке бесконечно откладываться «на потом». В результате сомнения исчезают, количество продаж растет.</p>\n<p>В главе 9 «Гранд-финал» вы узнаете, как уверенно доводить переговоры до логического завершения без навязчивости.</p>\n<p>НАВЫК 8. РАЗВИТИЕ ОТНОШЕНИЙ C КЛИЕНТОМ Если после первой сделки клиенты исчезают, и даже самые лояльные из них со временем уходят к конкурентам — значит, у вас слабый навык развития отношений после продажи. Вы не знаете, как выстраивать долгосрочные связи, а покупатели чувствуют себя брошенными. В результате ваш бизнес не растет, а каждый заказчик покупает лишь один раз.</p>\n<p>Навык развития отношений позволяет вам выстраивать взаимодействие, при котором человек не только возвращается, но и рекомендует вас другим. У вас есть четкий план работы после закрытия сделки, вы понимаете, как оставаться в поле зрения и напоминать о себе правильно, без навязчивости. Большинство клиентов не принимают решение о повторной покупке сразу, и важно вовремя появляться в их жизни с полезными касаниями.</p>\n<p>В главе 10 «Мы вместе надолго» вы узнаете, как сделать покупателей постоянными и создать систему, в которой продажи растут за счет доверия и рекомендаций.</p>\n<p>Эти 8 навыков — ключевые элементы системы рекордных продаж. Только вместе они дают максимальный результат.</p>\n<p>Даже одно упущение в этом списке будет сильно тормозить ваше продвижение к цели. У каждого из вас уровень этих навыков разный. Кто-то силен в презентации продукта, но испытывает трудности с самоорганизацией. Кто-то хорошо работает с возражениями, но абсолютно не умеет привлекать целевых клиентов.</p>\n<p>Чтобы было проще понять, на каких навыках вам стоит сделать акцент при чтении этой книги, я предлагаю оценить свои навыки по чек-листу.</p>", "level": 3}, {"title": "НАВЫК", "html": "", "level": 3}, {"title": "САМООРГАНИЗАЦИИ", "html": "", "level": 3}, {"title": "Практический инструмент: Таблица для анализа сделок по формуле 100%", "html": "<p>| Таблица для анализа сделок по формуле 100% сделки | | --- | | № | Клиент  | ФВ | ОП | Д | ЛПР | ЗС | Дальнейшие действия для закрытия сделки | | 1 | Компания 1 | 0 | 1 | 0 | 1 | 1 | | | 2 | Компания 2 | 1 | 0 | 1 | 0 | 1 | | | 3 | Компания 3 | 1 | 1 | 0 | 0 | 1 | | | 4 | | | | | | | |</p>\n<hr>\n<hr>", "level": 4}]}, {"id": 2, "part": "ЧАСТЬ I. ФУНДАМЕНТ СИСТЕМЫ ПРОДАЖ", "partIdx": 0, "title": "Глава 2. Система рекордных продаж: 8 ключевых навыков", "bodyHtml": "<p>Мы с командой анализировали результаты выпускников школы продаж, которые после обучения резко вырастали в показателях. Нам нужно было определить, что именно люди начинали делать по-другому, чтобы зарабатывать больше в разы. Не на 10-30% процентов, а в 2-10 раз! Выводы, к которым мы пришли, разрушали все стереотипные схемы увеличения продаж. Ни в одном кейсе успех не был связан с чистой коммуникацией и пятью шагами классической методики. Ежегодно многие компании тратят миллионы рублей на обучение сотрудников этим техникам в надежде выйти на новый уровень, но для рекордного роста им нужно делать совершенно другое!</p>\n<p>Те, кто получил кратный рост в продажах, проявили совсем другие навыки:</p>\n<ul><li><strong>1)</strong> Глубокий анализ ситуации для принятия ключевых решений: таблицы для анализа клиентской базы abcxyzанализ, swot-анализ, работа с цифрами, умение задавать правильные вопросы и принимать точные решения.</li>\n</ul>\n<ul><li><strong>2)</strong> Самоорганизация и управление эмоциями: использование приложений, чек-листов и системы планирования, дисциплина, управление временем и эмоциями.</li>\n</ul>\n<ul><li><strong>3)</strong> Развитие и поддержание отношений с клиентами: использование принципа «семьи», замер лояльности NPS, умение превосходить ожидания клиентов и вызывать «wow-эффект».</li>\n</ul>\nБезусловно, многие отмечали, что им помогали и навыки коммуникации, и работа с возражениями, и кросс-продажи, и правильные вопросы. Но когда речь шла о кратном росте, эти умения были не самыми главными критериями успеха.\n<p>Такие выводы наверняка подтолкнут вас к осознанию, что «волшебные фразы и скрипты», которые ищут большинство новичков, — это не то, что нужно для рекордов. Вам нужна система.</p>\n<p>Это комбинация 8 ключевых навыков. Если у вас сейчас невысокие продажи, значит, верхняя диаграмма про вас. Слабые навыки продаж и работа не по системе — вот главная причина низких показателей. Дело не в клиентах, не в продукте и не в экономической ситуации в стране. Дело в вас и вашей подготовке. Все, что отделяет вас от высоких результатов, — это 8 навыков.</p>\n<p>Хорошая новость в том, что все эти способности можно прокачать — есть конкретные приемы, техники, упражнения, которые сделают вас мастером продаж. Прежде чем я поделюсь с вами инструментами по каждому навыку, давайте посмотрим на эту диаграмму внимательнее и разберемся, как работает система.</p>\n<p>НАВЫК 1. САМООРГАНИЗАЦИЯ В ПРОДАЖАХ Если ваш список задач растет быстрее, чем вы успеваете его разбирать, важные дела откладываются «на потом», а рабочий день заканчивается ощущением, что вы были заняты, но не продвинулись ни на шаг — значит у вас слабо развит навык самоорганизации. Постоянный хаос в планах отражается не только на вашей продуктивности, но и на внутреннем состоянии: растет тревожность, копится усталость, а мысли о выгорании становятся все навязчивее.</p>\n<p>Самоорганизация — это не просто грамотное управление временем, но и умение управлять собой. Внешняя структура (четкое планирование, контроль задач, дисциплина) дает результат только в сочетании с внутренней устойчивостью: способностью работать без перегрузки, не зацикливаться на страхах и не разрываться между десятками мелких дел.</p>\n<p>Навык самоорганизации дает вам четкое понимание, какие действия приносят результат, а какие — просто создают видимость занятости. Вы планируете день так, чтобы ключевые задачи выполнялись в первую очередь, снижаете уровень стресса и увеличиваете свои продажи без авралов.</p>\n<p>Вы определяете точку «Б», делаете декомпозицию целей и внедряете инструменты, которые помогают вам эффективно управлять своим временем и энергией. Вы спокойно работаете по «карте дня» и добиваетесь результатов.</p>\n<p>В следующей главе вы узнаете, как развить навык самоорганизации «внутри» и «снаружи», чтобы достигать рекордных продаж без выгорания.</p>\n<p>НАВЫК 2. ПОИСК КЛИЕНТОВ Если постоянный страх остаться без новых клиентов преследует вас, вы зависите от случайных рекомендаций и контактов, а каждая продажа кажется удачей — значит, у вас слабо развит навык поиска клиентов. Вы пытаетесь продавать всем подряд, что только увеличивает количество отказов и добавляет стресса.</p>\n<p>Развитый навык поиска клиентов позволяет вам точно определять, кто является вашей целевой аудиторией, и выстраивать системный подход к привлечению покупателей.</p>\n<p>Вы больше не гонитесь за каждым встречным, а целенаправленно работаете с техникой «Мишень», чтобы привлекать нужных людей, и техникой «Звезда», чтобы получать стабильный поток новых заказов. Вы становитесь мастером нетворкинга, умеете находить контакт с ЛПР в компаниях разного уровня, и люди сами заинтересованы в общении с вами.</p>\n<p>В главе 4 «Не каждый клиент — мой клиент» вы узнаете, как развить навык поиска клиентов и построить систему привлечения, которая стабильно приносит результат.</p>\n<p>НАВЫК 3. ФОРМИРОВАНИЕ ДОВЕРИЯ Если клиенты сомневаются, откладывают покупку или уходят к конкурентам, значит, уровень доверия к вам низкий. Вы замечаете это, но не понимаете, как изменить ситуацию и показать себя надежным партнером, у которого захотят покупать.</p>\n<p>Развитый навык формирования доверия позволяет вам сразу же вызывать у покупателей ощущение, что с вами можно и нужно работать. Вы применяете формулу из 4 компонентов, точно понимаете, какие шаги усиливают уверенность в вас, а какие — разрушают ее. Вы не просто заявляете о своей экспертности, а демонстрируете ее через действия и общение. В результате охотнее покупают именно у вас, а не у конкурентов.</p>\n<p>В главе 5 «Доверься мне» вы узнаете, как повысить уровень лояльности клиентов на каждом этапе продажи.</p>\n<p>НАВЫК 4. ПРОЯСНЕНИЕ СИТУАЦИИ Если на встречах вы чувствуете, что общаетесь вслепую не знаете, какие вопросы задать, сталкиваетесь с односложными ответами и неловкими паузами, — значит, у вас слабо развит навык прояснения ситуации. Вы рассказываете о продукте, но клиенту это не интересно, потому что вы не понимаете, что для него действительно важно.</p>\n<p>Развитый навык прояснения ситуации позволяет вам точно уловить то, что для собеседника является самым важным при покупке. Вы задаете вопросы по «СОПРАНО» для понимания ситуации покупателя, определяете его потребности по формуле «У Б ЭП ПГ Н», владеете техниками активного слушания и умеете задавать продающие вопросы, которые направляют диалог к сделке.</p>\n<p>В главе 6 «Говори меньше — продавай больше» вы узнаете, как взаимодействовать с клиентом и определять его боли, чтобы продажи стали легкими и естественными.</p>\n<p>НАВЫК 5. ПРЕЗЕНТАЦИЯ РЕШЕНИЯ Если во время переговоров клиенты отвлекаются, зевают или смотрят на телефон, а после остаются равнодушными — значит, ваш навык презентации решения очень слабый. Вы рассказываете о продукте, но не видите вовлеченности, не уверены, что человек понял ценность вашего предложения, и в итоге встреча превращается в пустую формальность.</p>\n<p>Развитый навык презентации позволяет вам преподносить информацию так, чтобы клиент захотел действовать сразу. Вы используете формулу ФХВЭ, чтобы показать, как продукт решает конкретные задачи. Применяете техники «Польза от прогресса» и «ДЧЕТ», чтобы повысить ценность предложения, и рассказываете продающие истории, которые вызывают эмоции и формируют желание купить.</p>\n<p>В главе 7 «Покажи и убеди» вы узнаете, как превратить презентацию из скучного доклада в мощный инструмент, который приводит к закрытию сделки.</p>\n<p>НАВЫК 6. ОТРАБОТКА ВОЗРАЖЕНИЙ Если каждое «Я подумаю» или «Мне пока ничего не нужно» выбивает вас из колеи, а сомнения клиентов кажутся окончательным отказом — значит, у вас слабо развит навык работы с возражениями. Вы боитесь услышать негативную реакцию, чувствуете себя загнанным в угол и воспринимаете несогласие как спор, в котором чаще всего проигрываете.</p>\n<p>Развитый навык отработки возражений позволяет вам спокойно и уверенно реагировать на любое сопротивление.</p>\n<p>Вы используете технику «НЕ СПОРЬ», грамотно аргументируете свою позицию, усиливаете ценность предложения и ведете клиента к покупке без давления и конфликтов.</p>\n<p>Меньше возражений — больше закрытых сделок! В главе 8 «Нет, нет и... да!» вы узнаете, как прокачать этот навык и превращать сомневающихся клиентов в лояльных покупателей.</p>\n<p>НАВЫК 7. ЗАКРЫТИЕ СДЕЛКИ Если у вас скопилось много зависших договоров, заказчики говорят, что им все нравится, но так и не покупают — значит, у вас слабо развит навык закрытия сделки.</p>\n<p>Вы не знаете, как правильно напомнить о себе, боитесь показаться назойливым и в итоге теряете клиентов, которые были практически готовы к покупке.</p>\n<p>Развитый навык закрытия сделки позволяет вам точно понимать, когда и как подвести покупателя к решению без давления. Вы используете формулу, применяете более 20 техник закрытия, умеете грамотно работать с зависшими клиентами и не даете покупке бесконечно откладываться «на потом». В результате сомнения исчезают, количество продаж растет.</p>\n<p>В главе 9 «Гранд-финал» вы узнаете, как уверенно доводить переговоры до логического завершения без навязчивости.</p>\n<p>НАВЫК 8. РАЗВИТИЕ ОТНОШЕНИЙ C КЛИЕНТОМ Если после первой сделки клиенты исчезают, и даже самые лояльные из них со временем уходят к конкурентам — значит, у вас слабый навык развития отношений после продажи. Вы не знаете, как выстраивать долгосрочные связи, а покупатели чувствуют себя брошенными. В результате ваш бизнес не растет, а каждый заказчик покупает лишь один раз.</p>\n<p>Навык развития отношений позволяет вам выстраивать взаимодействие, при котором человек не только возвращается, но и рекомендует вас другим. У вас есть четкий план работы после закрытия сделки, вы понимаете, как оставаться в поле зрения и напоминать о себе правильно, без навязчивости. Большинство клиентов не принимают решение о повторной покупке сразу, и важно вовремя появляться в их жизни с полезными касаниями.</p>\n<p>В главе 10 «Мы вместе надолго» вы узнаете, как сделать покупателей постоянными и создать систему, в которой продажи растут за счет доверия и рекомендаций.</p>\n<p>Эти 8 навыков — ключевые элементы системы рекордных продаж. Только вместе они дают максимальный результат.</p>\n<p>Даже одно упущение в этом списке будет сильно тормозить ваше продвижение к цели. У каждого из вас уровень этих навыков разный. Кто-то силен в презентации продукта, но испытывает трудности с самоорганизацией. Кто-то хорошо работает с возражениями, но абсолютно не умеет привлекать целевых клиентов.</p>\n<p>Чтобы было проще понять, на каких навыках вам стоит сделать акцент при чтении этой книги, я предлагаю оценить свои навыки по чек-листу.</p>", "sections": [{"title": "14 инструментов, которые влияют на продажи", "html": "<p>14 инструментов, которые сильнее всего влияют</p>\n<p>на продажи в 2026 году</p>\n<p>Дело не в кризисе и не в продукте — дело в системе продаж.</p>\n<p>«Часто предприниматели с сильным продуктом, менеджеры,</p>\n<p>которые хорошо знают свой продукт, эксперты — не могут</p>\n<p>донести главные смыслы до клиентов».</p>\n<p>14 инструментов, которые нужно внедрить в систему продаж:</p>\n<ul><li><strong>1.</strong> ВОРОНКА ПРОДАЖ - Сильный конвертер в воронке Воронка — это последовательность этапов, которые проходит клиент. В её основе должен быть сильный конвертер: событие, на которое клиенты легко соглашаются и после которого легко покупают, а не просто отправка КП.</li>\n</ul>\n<ul><li><strong>2.</strong> ОФФЕР - Сильный оффер на конвертер и на продукт Оффер это предложение, благодаря которому клиент откликается и покупает. Нужно 2 оффера: один на сильный конвертер (например, диагностику или расчёт), второй на сам продукт.</li>\n</ul>\n<ul><li><strong>3.</strong> ФОРМУЛА 100% - Формула 100% закрытия сделки Авторская формула: сделка закрывается, когда одновременно выполняются 5 критериев — финансовая возможность, осознанная потребность, доверие, ЛПР и «здесь и сейчас». Не хватает хотя бы одного — сделки не будет.</li>\n</ul>\n<ul><li><strong>4.</strong> СКРИПТЫ - Сценарий диалога из 15–17 продающих блоков Скрипт это не дословное чтение по тексту, а грамотный сценарий общения: какие вопросы задать, как презентовать, как отвечать на возражения. Диалог делится на этапы — от открытия и утепления до закрытия.</li>\n</ul>\n<ul><li><strong>5.</strong> ПРОДАЖИ В ПЕРЕПИСКЕ  - Сильные сообщения вместо  шаблонных ответов Пример из практики: клиент с потенциальным чеком в 500 тысяч рублей написал вопрос про рыбалку — и получил в ответ шаблон без единого встречного вопроса. Без уточняющих вопросов и цепочки касаний переписка не продаёт.</li>\n</ul>\n<ul><li><strong>6.</strong> КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ - 9 продающих блоков вместо шаблона Типичные ошибки КП: заголовок «Коммерческое предложение» вместо оффера, ноль персонализации, рассказ о себе вместо выгод клиента, нет усилителей доверия и призыва к действию. В сильном КП 9 обязательных блоков, которые помогают продавать.</li>\n</ul>\n<ul><li><strong>7.</strong> ЦЕПОЧКА КАСАНИЙ - Касания до оплаты по фильтру ЭЭ После КП и счёта менеджеры часто просто ждут и боятся показаться навязчивыми — клиент уходит к другим. Каждое касание проверяйте фильтром: оно экспертное или эмоциональное? Если нет — не отправляйте.</li>\n</ul>\n<ul><li><strong>8.</strong> ОТСТРОЙКА ОТ КОНКУРЕНТОВ - Техника «в отличие от…» При высокой конкуренции клиенту сложно выбрать. Не нужно поливать конкурентов грязью — используйте фразу «в отличие от…» в презентациях, переписках и на встречах — она показывает, чем вы отличаетесь от конкурентов.</li>\n</ul>\n<ul><li><strong>9.</strong> УСИЛИТЕЛИ ДОВЕРИЯ - Доказательства везде: сайт, КП, переписка, встречи Усилители доверия — кейсы, реальные фотографии рабочего процесса, оборудования, доказательства — должны быть осознанно встроены во все точки контакта с клиентом, а не только в презентацию.</li>\n</ul>\n<ul><li><strong>10.</strong> СРЕДНИЙ ЧЕК - Апсейлы, VIP-тариф и работа со скидками Кросс-продажи, дополнительный премиум-тариф и грамотная работа со скидками поднимают средний чек. Скидка в 200 рублей с чека в 1000 — это уже минус 20% к среднему чеку.</li>\n</ul>\n<ul><li><strong>11.</strong> БАНК ВОЗРАЖЕНИЙ - Принцип «пятна на рубашке» Возражение проще предвосхитить, чем потом отрабатывать. Для этого есть обученный ИИ-агент «Мастер возражений»: за 5–10 минут собирает топ-3 способа предвосхитить частые возражения и топ-10 ответов на остальные.</li>\n</ul>\n<ul><li><strong>12.</strong> БАЗА КЛИЕНТОВ - Из архива — в актив В базе часто тысячи контактов, с которыми никто не работает. Формула: сначала получить отклик и понять ситуацию клиента, и только потом делать предложение — без «вы у нас давно не покупали» и рассылок в лоб.</li>\n</ul>\n<ul><li><strong>13.</strong> ОТКАЗНИКИ И ЗАВИСШИЕ -  Заходы к сделкам, которые «зависли» на годы Есть воронки, где сделки висят с 2015 года. Работать с ними нужно по той же формуле 5 критериев: определить, чего конкретно не хватает — доверия, ЛПР, финансовой возможности, — и закрыть именно это.</li>\n</ul>\n<ul><li><strong>14.</strong> ПОВТОРНЫЕ ПРОДАЖИ - Своевременное касание с теми, кто уже покупал Лояльность у клиентов, которые уже купили и остались довольны продуктом, выше, чем у новых. Здесь важно вовремя и правильно к ним зайти.</li>\n</ul>\n---", "level": 4}, {"title": "Чек-лист оценки 8 навыков", "html": "<p>===================================================== 8 КЛЮЧЕВЫХ НАВЫКОВ РЕКОРДНЫХ ПРОДАЖ (для книги «РЕКОРДЫ ПРОДАЖ») Оцените свои 8 навыков личных продаж самостоятельно по чек-листу.</p>\n<p>По каждому пункту можно поставить: 0 (не выполняется), 1 (частично выполняется), 2 (полностью выполняется) — и в конце суммировать баллы по каждому навыку, нарисовать диаграмму (шаблон в конце документа).</p>\n<p>Оценку делают на старте изучения книги «РЕКОРДЫ ПРОДАЖ» и после прочтения и внедрения. ---</p>\n<ul><li><strong>1.</strong> НАВЫК САМООРГАНИЗАЦИИ («ВНУТРИ» И «СНАРУЖИ») ☐ У вас есть четкое понимание, как организовать и планировать свой рост в продажах, вы грамотно определили цели и провели декомпозицию, внедрили системные инструменты для достижения целей ☐ У вас есть система быстрого внедрения новых инструментов. Вы открыты новому и действуете быстрее конкурентов. Передовые инструменты продаж работают на вас ☐ Мои цели по доходу и продажам разбиты на этапы. Сделана декомпозиция ☐ Вы можете адекватно и объективно оценить текущую ситуацию, поведение клиента, статус сделки, свои реакции и эмоции. Это поможет принимать правильные решения и в разы ускорит ваш рост ☐ Вы проработали свои страхи в продажах, научились с помощью специальных приемов быть в нужном эмоциональном состоянии, овладели техниками реагирования на сложности и изменения. Вы чувствуете прилив сил и желание развиваться в области продаж, готовы продавать больше!</li>\n</ul>\nИтого баллов – ___ из 10\n<ul><li><strong>2.</strong> НАВЫК ПОИСКА КЛИЕНТОВ ☐ Я не пытаюсь продавать всем клиентам без разбору (соблюдается принцип «не каждый клиент – ваш клиент»). У меня чётко описана целевая аудитория и сегменты клиентов по технике «Мишень» ☐ У вас есть система выхода на ЛПР через холодные контакты, я использую техники обхода секретарей ☐ У меня есть система создания полезных контактов (нетворкинг, соцсети) ☐ Я использую Elevator Pitch (мини-самопрезентации) при знакомстве ☐ Не боюсь «холодных» касаний и инициирую их каждую неделю Итого баллов – ___ из 10</li>\n</ul>\n<ul><li><strong>3.</strong> НАВЫК УСТАНОВЛЕНИЯ КОНТАКТА И ФОРМИРОВАНИЯ ДОВЕРИЯ ☐ Я работаю по формуле доверия Д=Э+Э+Ч+О ☐ Клиенты ощущают мою эмпатию и искренний интерес ☐ Демонстрирую экспертность кейсами, фактами, отзывами ☐ Соблюдаю договорённости и открыто говорю о рисках для клиента ☐ Легко нахожу «общие точки» с помощью техники «ПТС» (покажите точки соприкосновения) Итого баллов – ___ из 10</li>\n</ul>\n<ul><li><strong>4.</strong> НАВЫК ПРОЯСНЕНИЯ СИТУАЦИИ ☐ Проясняю ситуацию о клиенте до встречи, чтобы на встрече показать высокий уровень подготовки ☐ Применяю структуру «СОПРАНО» для выявления потребностей ☐ Умею слушать клиента и понимать ключевые потребности УБЭППГН ☐ На встрече говорю меньше, чем клиент; активно слушаю ☐ Фиксирую информацию (даже мелочи) и возвращаюсь к ней на следующих этапах, вызывая ВАУ-эффект у клиента Итого баллов – ___ из 10</li>\n</ul>\n<ul><li><strong>5.</strong> НАВЫК ПРЕЗЕНТАЦИИ РЕШЕНИЯ ☐ Не приступаю к презентации, пока не понял ключевые боли, задачи, мотивацию клиента ☐ Связываю характеристики продукта с выгодами и эмоциями (формула «Ф-Х-В-Э») ☐ Использую истории/визуал, чтобы вызвать у клиента желание «хочу» ☐ Презентую не продукт и его свойства, а концепцию / результаты клиента ☐ В конце презентации озвучиваю предложение по формуле «ДЧЕТ», клиент чётко понимает следующий шаг Итого баллов – ___ из 10</li>\n</ul>\n<ul><li><strong>6.</strong> НАВЫК РАБОТЫ С ВОЗРАЖЕНИЯМИ ☐ Использую технику «НЕ СПОРЬ» для работы с возражениями. Выбираю правильную реакцию ☐ Не использую банальные ответы на возражения («Я подумаю!» – «А над чем именно будете думать?» / «Что вас смущает?» / «Сколько вам нужно времени?» и т.д.) ☐ Применяю техники предвосхищения часто встречающихся возражений (принцип «Пятна на рубашке») ☐ Использую банк возражений («возражение – тактика – речевой модуль») ☐ После отработки возражений делаю призыв к действию для перехода на следующий шаг Итого баллов – ___ из 10</li>\n</ul>\n<ul><li><strong>7.</strong> НАВЫК ЗАКРЫТИЯ СДЕЛКИ ☐ Улавливаю сигналы готовности клиента купить и своевременно перехожу к закрытию сделки ☐ Использую разнообразные техники закрытия (подталкиватели, формирователи, доверители, мотиваторы) ☐ Всегда договариваюсь о чётком следующем действии и сроке ☐ Делаю цепочку экспертных касаний для доведения до оплаты ☐ Закрываю сделки без давления, сохраняя доверие и отношения Итого баллов – ___ из 10</li>\n</ul>\n<ul><li><strong>8.</strong> НАВЫК РАЗВИТИЯ ОТНОШЕНИЙ ☐ После сделки работаю с клиентом по формуле развития отношений (ПС + NPS + WOW + M) ☐ Регулярно измеряю NPS, собираю обратную связь и работаю над повышением лояльности ☐ Предлагаю клиенту дополнительные ценности после сделки ☐ Значительная доля продаж приходит от повторных покупок или рекомендаций ☐ Системно собираю отзывы и рекомендации Итого баллов – ___ из 10 ---</li>\n</ul>\n<hr>", "level": 4}]}, {"id": 3, "part": "ЧАСТЬ I. ФУНДАМЕНТ СИСТЕМЫ ПРОДАЖ", "partIdx": 0, "title": "Глава 3. Техника «ТРУБА» для рекордов в бизнесе", "bodyHtml": "<p>=====================================================</p>\n<hr>\n<ul><li><strong>1.</strong> РЕКОРДНЫЙ Я</li>\n</ul>\nЭто состояние и мышление предпринимателя. Рекорды начинаются с тебя — с твоих действий, энергии, календаря, фокуса и смелости принимать решения.\n<p>Действия:</p>\n<ul><li><strong>1)</strong> Перестать делать 80% действий по инерции – они не ведут к рекордам</li>\n</ul>\n<ul><li><strong>2)</strong> Изменить календарь предпринимателя по КОМПАСу</li>\n</ul>\n---\n<ul><li><strong>2.</strong> РЕКОРДНЫЙ ПРОДУКТ</li>\n</ul>\nПродукт — это то, за что тебе платят. Он должен быть востребован, понятен, иметь внятную юнит-экономику и вызывать у клиента эффект «вау».\n<p>Действия:</p>\n<ul><li><strong>3)</strong> Находить то, за что клиенты готовы платить больше</li>\n</ul>\n<ul><li><strong>4)</strong> Добавить премиальный продукт для повышения среднего чека</li>\n</ul>\n---\n<ul><li><strong>3.</strong> РЕКОРДНАЯ КОМАНДА</li>\n</ul>\nБез команды невозможно расти. Здесь важно, кто рядом с тобой, кто реализует продукт, кто ведёт клиента. И есть ли у команды энергия, цели, структура.\n<p>Действия:</p>\n<ul><li><strong>5)</strong> Нанимать людей, которые уже делали нужный результат</li>\n</ul>\n<ul><li><strong>6)</strong> Сформулировать и транслировать видение бизнеса</li>\n</ul>\n---\n<ul><li><strong>4.</strong> РЕКОРДНЫЙ ПОТОК КЛИЕНТОВ</li>\n</ul>\nДаже крутой продукт не взлетит, если о нем никто не знает. Поток — это маркетинг, сарафан, органика, партнёрства.\n<p>Действия:</p>\n<ul><li><strong>7)</strong> Сделать посев для создания входящего потока клиентов</li>\n</ul>\n<ul><li><strong>8)</strong> Прокачивать личный бренд предпринимателя</li>\n</ul>\n---\n<ul><li><strong>5.</strong> РЕКОРДНЫЕ ПРОДАЖИ</li>\n</ul>\nПродажи — это твоя способность превращать поток в деньги. Скрипты, ключевые этапы воронки, касания, возражения, дедлайны. Это точность и регулярность.\n<p>Действия:</p>\n<ul><li><strong>9)</strong> Выделить сильный КЭВ, который даст рекордную конверсию</li>\n</ul>\n<ul><li><strong>10)</strong> Внедрить усилители конверсии для роста</li>\n</ul>\n---", "sections": [{"title": "Чек-лист «Техника ТРУБА»", "html": "<hr>\n<ul><li><strong>1.</strong> «РЕКОРДНЫЙ Я»</li>\n</ul>\n<ul><li>☐ Понял, какие действия отнимают у меня энергию, и исключил их</li>\n</ul>\n<ul><li>☐ Заполняю календарь по КОМПАСу, фокусируясь только на ключевых задачах предпринимателя</li>\n</ul>\n<ul><li>☐ Прописал «Рекордный Я» (какой я, когда ставлю рекорды регулярно)</li>\n</ul>\n<ul><li><strong>2.</strong> «РЕКОРДНЫЙ ПРОДУКТ»</li>\n</ul>\n<ul><li>☐ Замерил NPS продукта и провел кастдевы</li>\n</ul>\n<ul><li>☐ Добавил премиальный продукт и повысил средний чек</li>\n</ul>\n<ul><li>☐ Внедрил «вау»-касания для запуска сарафанного радио</li>\n</ul>\n<ul><li><strong>3.</strong> «РЕКОРДНАЯ КОМАНДА»</li>\n</ul>\n<ul><li>☐ Оценил команду по 0,8 / 1 / 1,2 и принял решения по усилению</li>\n</ul>\n<ul><li>☐ Стал нанимать людей грамотно, а не интуитивно</li>\n</ul>\n<ul><li>☐ Договорился с командой о результате, а не о процессе</li>\n</ul>\n<ul><li><strong>4.</strong> «РЕКОРДНЫЙ ПОТОК КЛИЕНТОВ»</li>\n</ul>\n<ul><li>☐ Получил первую 1000 подписчиков органически</li>\n</ul>\n<ul><li>☐ Стал прокачивать личный бренд предпринимателя</li>\n</ul>\n<ul><li>☐ Посчитал unit-экономику и запас на маркетинг</li>\n</ul>\n<ul><li><strong>5.</strong> «РЕКОРДНЫЕ ПРОДАЖИ»</li>\n</ul>\n<ul><li>☐ Выделил сильный КЭВ и повысил конверсию в 2+ раза</li>\n</ul>\n<ul><li>☐ Нанял сильного РОПа, который регулярно выполняет план продаж отдела</li>\n</ul>\n<ul><li>☐ Запустил внутреннюю базу занятий для отдела продаж с инструментами (скрипт и т.д.)</li>\n</ul>\n---\n<hr>", "level": 4}]}, {"id": 4, "part": "ЧАСТЬ II. 8 НАВЫКОВ РЕКОРДНЫХ ПРОДАЖ", "partIdx": 1, "title": "Глава 4. Навык 1: Самоорганизация в продажах", "bodyHtml": "<p>Самоорганизация — первый и главный навык, который нужно освоить тем, кто хочет ставить рекорды в продажах.</p>\n<p>У каждого из нас он развит по-своему: кто-то уже выстроил отлаженную систему эффективных продаж, а кто-то, возможно, не совсем понимает, с чего начать.</p>\n<p>В это понятие я вкладываю два больших смысла:</p>\n<ul><li>Самоорганизация «внутри» — это управление своим состоянием: работа со страхами, выгоранием, правильная реакция на события. Все это напрямую влияет на профессиональную эффективность в сфере продаж, где высокая неопределенность и отказы — часть работы.</li>\n</ul>\n<ul><li>Самоорганизация «снаружи» — это то, как вы управляете вашим рабочим пространством, формируете окружение, ставите цели и анализируете происходящее вокруг.</li>\n</ul>\nВ этой главе мы разберемся, как продавец может работать со своими переживаниями. Эмоции — основа вашей самоорганизации. Не зря говорят, что сначала нужно навести порядок в своей голове, а потом в окружении. Иными словами, сначала нужно научиться контролировать свое внутреннее состояние и только потом размышлять, как эффективно организовать рабочий процесс, вести клиентскую базу и что говорить покупателю на встрече.", "sections": [{"title": "ОТ ХАОСА К ПОРЯДКУ ДЛЯ РЕКОРДОВ В ПРОДАЖАХ (НАВЫК", "html": "", "level": 3}, {"title": "САМООРГАНИЗАЦИИ): Самоорганизация «внутри»:", "html": "<ul><li>проработка страхов в продажах (эмоциональный настрой);</li>\n</ul>\n<ul><li>установки для рекордных продаж;</li>\n</ul>\n<ul><li>работа с выгоранием. Самоорганизация «снаружи»:</li>\n</ul>\n<ul><li>грамотное планирование для достижения рекордов (точка А — Б, анализ);</li>\n</ul>\n<ul><li>быстрое внедрение новых инструментов и подходов;</li>\n</ul>\n<ul><li>управление рабочим пространством (что считаешь, то и растет);</li>\n</ul>\n<ul><li>сильное окружение. Вы помните свои первые продажи? Какие у вас были эмоции? А если вы еще ничего не продавали, как думаете, вам будет страшно снять трубку и сделать звонок совершенно незнакомому человеку? Уверен, что да! Я тоже волновался, когда делал первые шаги.</li>\n</ul>\nКЛУБ, ЗИМА И ХОЛОДНЫЕ ПРОДАЖИ Однажды в 10 классе нам с другом предложили собрать массовку на вечернее шоу в одном из популярных ночных клубов Курска, откуда я родом. Предстояло нагнать зрителей, которые придут и посмотрят выступление. Если приведем достаточно людей, тогда и нам разрешат остаться. Представляете, школьники в клубе? Да это была мечта! Поэтому мы отправились на центральную улицу города и стали раздавать флаеры.\n<p>Я всегда был интровертом до мозга костей. И не то, что продажи, а в принципе общение с новыми людьми давалось мне очень тяжело. Даже позвонить кому-то было большим стрессом.</p>\n<p>Но подойти к незнакомому человеку, протянуть ему бумажку и сказать: «Хотите пойти на вечернее шоу?» — оказалось очень трудным. Именно тем зимним вечером я впервые ощутил на собственной шкуре опыт холодной коммуникации с клиентами. Когда страх и неуверенность смешиваются с чувством, как будто я напрашиваюсь и унижаюсь.</p>\n<p>Это было ужасно. Представьте, по заснеженной улице навстречу идет женщина. Мерзнет, прячет лицо в воротник шубы, и уже от одного ее взгляда бежит холодок по коже. «Нет, к этой лучше не подходить, слишком серьезная, еще пошлет куда подальше», — думал я, оправдывая свой страх подойти к человеку и заговорить с ним.</p>\n<p>Какое-то время мы с другом просто провожали взглядами спешащих мимо нас прохожих, но потом в один момент что-то внутри меня щелкнуло. Я осознал, что хуже уже не будет и решил, что начну обращаться ко всем подряд. Ну не соберем массовку, ну не пустят в клуб — просто попробую. После нескольких попыток и десятка отказов я почувствовал, что мне стало проще подходить к людям.</p>\n<p>Страх прошел, и меня охватил азарт: ну-ка, ну-ка, делаем ставки, согласится или нет?</p>\n<p>И после этого поменялось все! Я стал не просто зазывать прохожих в клуб, а говорить, что они отлично проведут время в одном из самых крутых заведений города и смогут задать участникам шоу интересующие вопросы. И как вишенка на торте — бесплатные напитки и закуски.</p>\n<p>В какой-то момент я задумался, почему мы предлагаем это бесплатно? Такие мероприятия точно должны стоить денег!</p>\n<p>Я так поверил в продукт, что забыл о странном и неудобном вопросе «А не хотите пойти на шоу?» и стал презентовать его абсолютно по-другому: «Здравствуйте! Сегодня в клубе „777&quot; организуют крутое событие. Соберутся спикеры, будет яркое выступление, а вас покажут по телевизору. Это будет отличный вечер!» В каждом слове чувствовалась внутренняя уверенность, что я делаю людям шикарное предложение.</p>\n<p>Вы уже догадались, как стали реагировать прохожие? Они соглашались пойти на шоу и даже тянулись за кошельком, чтобы купить билет. «Никаких оплат. У нас еще есть 10 бесплатных мест в зале. Давайте я запишу ваши контакты».</p>\n<p>Оказывается, все было так просто. Мы собрали зрителей и провели вечер в крутом клубе, куда наши одноклассники не смогли бы попасть. Это был первый опыт, когда умение убеждать других людей помогло мне достичь поставленной цели.</p>\n<p>Именно тогда я понял, как сильно эмоции и страх могут блокировать путь к нашим целям. Когда я сам поверил, что предлагаю людям что-то стоящее, мне стало все равно, как посмотрит на меня очередной прохожий. Как только вы меняете отношение к происходящему и начинаете действовать по-другому, наступает переломный момент, и вы тут же прокладываете маршрут к новым достижениям.</p>\n<p>СТРАШНО, АЖ ЖУТЬ Тема страхов в работе мне очень близка. Это то, что ограничивало мой рост многие месяцы. Я из-за них чуть не ушел из профессии раз и навсегда. Поэтому прекрасно понимаю, почему у многих работа с клиентами ассоциируется со стрессом и сомнениями. Неудивительно, ведь продажи — это взаимодействие с незнакомыми людьми, а значит выход из зоны комфорта и повышенная неопределенность.</p>\n<p>Это давит и вызывает тревогу. Если мы не разберемся со своими негативными эмоциями в самом начале, любой разговор с клиентом будет вызывать дискомфорт.</p>\n<p>И знаете, в чем большая проблема многих менеджеров, экспертов, предпринимателей? Их страхи могут быть спрятаны так глубоко, что они просто не осознают и не признают их.</p>\n<p>Вот как это может проявляться в общении (из ответов учеников): «Краснеют щеки, теряется интерес, потеют ладошки, считаешь себя никчемной». «Поведение и разговор меняются, я начинаю теряться, сложно сформулировать предложение, стараюсь как-то оправдаться». « Я боюсь, что не продам. Когда понимаю, что клиент не купит, я начинаю злиться и перехожу порой на повышенные тона». «Сердце бьется чаще или вообще замирает, начинаю тараторить без остановки. Знаю, что незаметно - проверяла. Стараюсь быть примером для отдела и тщательно скрывать свои страхи, считая это слабостью. Голос более мягкий, уступчивый становится, пытаюсь перенимать манеру пауз, фраз оппонента, использую технику „трех . Когда переступаю через свой страх, я собой горжусь — чувствую, как становлюсь опытнее».</p>\n<p>И это чувствуют не только новички в продажах, но и руководители с опытом, предприниматели. Давайте разберемся, как с этим работать.</p>\n<p>Прежде всего, определите свои страхи. С моими учениками мы делаем полезное упражнение: каждый выписывает три фразы, в которых проявляется его волнение на сделке. Ниже перед вами — основные примеры. Уверен, что-то подобное вы испытывали или испытываете до сих пор. «Я боюсь продавать». Это общий страх. Вы боитесь общения с клиентом и продаж в целом. «Я боюсь звонков». Вам становится некомфортно уже оттого, что нужно поднять трубку. Общению по телефону, и уж тем более вживую, вы предпочитаете переписку. «Я боюсь отказов». Когда вы слышите «нет», то вам кажется, что отвергают не продукт, который предлагаете, а лично вас. Такое отношение к отказам очень осложняет путь к успеху в продажах. « Я не смогу ответить на возражения или вопросы клиента». Частый страх новичков. Они долго готовятся к звонку, накручивают себя, думают, что могут ответить, если их о чем-то спросят. В итоге, когда клиент действительно задает вопрос или возражает, они впадают в ступор и не могут ничего сказать. «Я боюсь звонить в окружении коллег». Такое бывает, когда никто из окружающих не занят разговором по телефону, в офисе стоит полнейшая тишина, а вам нужно связаться с клиентом. Вы боитесь, что на вас будут смотреть, смеяться или шептаться за вашей спиной. «Я боюсь ехать на встречу». Другими словами, с общением по телефону у вас нет проблем, но вы на дух не переносите личные встречи. Боитесь, как на вас посмотрят и что о вас подумают. «Я боюсь озвучивать цену». Бывает, что клиент спрашивает о цене, а вы увиливаете или говорите, что вышлете прайс в коммерческом предложении. Вероятно, вы боитесь, что не отстоите стоимость продукта или не справитесь с возражениями. «Я боюсь, что сделка сорвется, если клиент попросит скидку, а я ее не дам». Вам кажется, что только снижение стоимости может привлечь вашего клиента. Вы не верите ни в свой продукт, ни в свою экспертность. «Я боюсь перезванивать». Почувствовав дискомфорт при первом контакте с клиентом, вы не хотите снова испытывать стресс и предпочитаете больше не звонить. «Я боюсь потерять клиента». Тут, наоборот, вам так страшно не выполнить план продаж, что вы перестаете контролировать себя и начинаете названивать без конца. «Я боюсь предлагать что-то». Вы считаете унизительным что-то предлагать, навязывать, «впаривать». Либо потому, что не верите в свой продукт, либо потому, что боитесь отказа. «Я боюсь продавать на большие чеки». Так происходит потому, что вы не верите ни в свои способности продать дорогой продукт, ни в его истинную ценность. «Я боюсь презентовать новый продукт». Было такое?</p>\n<p>Вышла новинка, вы в ней еще не до конца уверены, не знаете всей информации — и поэтому даже не говорите об этом. «Я боюсь, что клиент будет недоволен». То есть пытаетесь наперед додумать реакцию клиента. И так как уверенности в ценности продукта нет, вам кажется, что ваше предложение никому не понравится. «Я боюсь отправлять сообщение». Да, бывает и такое.</p>\n<p>Вы боитесь написать что-то не так, ошибиться в имени, цифрах или примерах в коммерческом предложении. Либо думаете, что нужно еще доработать текст, что он недостаточно хорош, и надо посоветоваться со старшими коллегами насчет содержания. «Я боюсь не выполнить план». Если цифра в плане по продажам, по вашему мнению, нереальная, то вам страшно даже начинать движение в сторону выполнения. «Я боюсь, что уволят». Вы боитесь сделать ошибку и остаться без работы. Поэтому вместо того, чтобы развиваться и пробовать новое, вы предпочитаете сидеть тихонько и не выделяться. «Я боюсь новой должности». Вы думаете, что не справитесь с новыми задачами, большим объемом работ. Боитесь, что перестанете выглядеть в глазах других профессионалом. « Я боюсь что-то уточнить у клиента». Вы считаете, что лучше лишний раз его не беспокоить и самому потратить кучу времени на поиск информации, чем показаться глупцом. «Я боюсь, что не понравлюсь клиенту». Ни внешним видом, ни тем, из какой компании пришли, ни тем, что предлагаете. «Я боюсь признать свое текущее положение». Вы стесняетесь признаться, в какой компании работаете, стесняетесь показать свое рабочее место или небольшой портфель клиентов. «Я боюсь проводить встречи в видеоформате». Клиент увидит, что вы работаете в обычной квартире, а не в элитном офисе. А еще у вас обязательно прервется связь, отключится интернет, случатся все катастрофы в мире, которые еще раз докажут клиенту, какой вы непрофессионал. «Я боюсь, что я хуже других, или у меня синдром самозванца». Вы не верите в себя. Внутренний критик говорит, что вы никогда не будете хорошо продавать, что есть те, кто гораздо лучше вас, и проще все прекратить, чем пытаться добиться успеха.</p>\n<p>Мой ученик Кирилл из Санкт-Петербурга работал в продажах восемь лет, но признался, что, несмотря на опыт и возраст (34 года), он до сих пор чувствует тревогу, неуверенность в себе и даже дошел до эмоциональных кризисов и выгорания. Все это держало его доход на уровне 60 тысяч рублей Как только мы проработали это, его заработок вырос почти в два раза: «Уже второй месяц подряд я получаю больше 100 тысяч рублей. Для меня очень важно, что я начал ассоциировать себя с профессией и проработал свои страхи», — рассказал Кирилл.</p>\n<p>У каждого из нас свои страхи. И их объединяет одно — все они становятся серьезными преградами на пути к нашим рекордам.</p>\n<p>Первое, что вы должны сделать, — это признать проблему и только потом начинать ее прорабатывать. Почему это важно? Например, менеджер боится звонить, но не признает этого. Говорит, что этот способ не работает, и лучше написать клиенту в мессенджер или на почту. Или боится продавать дороже и настаивает, что клиенты не согласятся покупать без скидок, и вообще, у конкурентов цена ниже.</p>\n<p>А иногда людям страшно выйти из зоны комфорта. Разговаривать с незнакомцами для них — настоящее испытание.</p>\n<p>Кажется, проще спрятаться за другими важными делами и отложить звонок на потом, вместо того чтобы преодолеть свои страхи и научиться комфортно общаться с клиентами В первом выпуске нашего проекта «Отдел продаж на прокачку» один из менеджеров утверждал, что его лимит — 10 звонков в день. Его аргумент: «Я уделяю максимум внимания подготовке к каждому разговору». Звучит впечатляюще, правда? Только вот результаты говорят сами за себя: за полмесяца — ни одной продажи. Неужели это результат «тщательного планирования»? Или, может быть, просто удобная отговорка, чтобы оправдать свою низкую продуктивность и избежать реальной работы?</p>\n<p>Прежде чем вы перейдете к техникам работы со страхами, подчеркните из списка выше те, что присущи вам, и уделите им самое пристальное внимание.</p>", "level": 3}, {"title": "МАСТЕР-КЛАСС ПО БЕССТРАШИЮ", "html": "<p>Техники, с которыми вы сейчас познакомитесь, помогли мне и многим моим ученикам справиться с напряжением, тревогой и негативным настроем в работе, а значит, выйти на совершенно другой уровень общения с клиентами и заключения сделок.</p>\n<p>Способ 1. Грамотная подготовка «Позвонить новому клиенту? Но что я скажу? Как лучше начать разговор? А в какой момент назвать цену? А если он не захочет покупать, что делать?» — такие вопросы повышают уровень тревоги и неопределенности. Они пугают и создают напряжение — это мешает действовать.</p>\n<p>Справиться с этим помогает грамотная подготовка. Например, когда у вас перед глазами будет схема разговора с примерами конкретных фраз, страх уменьшится.</p>\n<p>В следующих главах мы с вами рассмотрим сильные техники и приемы, которые вы сможете использовать для организации работы. Главное, не переусердствуйте. Используйте принцип 20/80, где 20% ваших усилий дают 80% результата.</p>\n<p>Способ 2. Разрешите себе ошибаться в вашем «идеальном сценарии» Со страхом сталкиваются и те эксперты, которые хорошо подготовились к разговору, продумали «идеальный сценарий общения». Проблема в том, что человек так сильно фокусируется на заготовленном тексте, что боится сбиться, сказать предложения не в том порядке. Из-за этого голос звучит неуверенно, и клиент это чувствует.</p>\n<p>Избавиться от такого страха довольно просто. Вспомните, замечаете ли вы момент, когда актер на сцене чуть-чуть меняет реплики, потому что забыл текст? Вот и клиент не заметит, если вы отклонитесь от заранее прописанного сценария разговора. Не старайтесь сказать все слово в слово — заученная речь не продает, а только отпугивает.</p>\n<p>Способ 3. Вдохновляйтесь людьми, у которых нет страха Если вы боитесь отказов, боитесь делать звонки, посмотрите на людей, которых это не пугает. Есть такие в вашем окружении? Это могут быть коллеги, на которых вы хотите равняться. Или, возможно, те, кто продает продукты и услуги вам, и вы в восторге от того, как они это делают.</p>\n<p>Еще можно посмотреть разные фильмы и сериалы о продажах. Например, сериал «Форс-мажоры», «Миллиарды», знаменитый «Волк с Уолл-Стрит», которые так или иначе раскрывают темы продаж, уверенности и работы со страхами.</p>\n<p>Способ 4. «Да - да. Нет - нет» Страх отказов помогает преодолеть простая техника «Да — да. Нет — нет». Когда вы общаетесь с клиентом, вы транслируете принцип: получится договориться о работе — хорошо, не получится — ничего страшного. Вы можете даже сказать: если идея понравится, можно запустить проект.</p>\n<p>Если нет — подберете другой вариант в будущем. В таком подходе чувствуется легкость, и клиент понимает, что вы — адекватный продавец, который не будет навязывать товар, если он не подойдет по каким-то параметрам.</p>\n<p>Способ 5. А что, если не получится? Задайте себе этот вопрос в ситуации, когда нужно снизить уровень тревожности. И представьте самый ужасный из возможных исходов. Например, вы боитесь звонить. Что самое страшное может случиться, если вы все же решитесь на это? Максимум — клиент откажется от вашего предложения, ну, может, еще нагрубит. Все. Скажется ли такая реакция на вашей жизни? Будет ли это важно через неделю, год, пять лет? Как правило, нет. Зачастую страх оказывается необоснованным и преувеличенным, и от этого возможный исход рисуется в вашей голове гораздо более пессимистичным, чем есть на самом деле.</p>\n<p>Способ 6. Не каждый клиент - ваш клиент В продажах есть одно замечательное слово, которое в корне меняет ваш настрой и ваши результаты. Это слово «Нет».</p>\n<p>Я имею в виду умение отказывать клиентам. Кто-то из вас, возможно, с удивлением возразит мне: «как можно отказывать заказчикам? Они сейчас на вес золота! Нужно продавать абсолютно каждому!» Если вы так считаете, работа будет для вас сплошным стрессом. Я сам когда-то так думал. Но теперь могу уверенно сказать, что это убеждение новичка, которое ограничивает ваш рост.</p>\n<p>В продажах есть понятие «целевой клиент». И как только вы начнете говорить «нет» нецелевым, вы сразу почувствуете легкость и уверенность. Вы будете продавать с удовольствием и начнете еще больше ценить ваш продукт. И самое главное, поймете, что не только клиенты выбирают вас, но и вы выбираете клиентов.</p>\n<p>А сейчас вспомните, сколько раз за последний месяц вы отказывали покупателям? Было ли такое? Или для вас это все еще психологически сложно?</p>\n<p>Способ 7. Загруженный календарь Это помогает уменьшать боязнь конкретного события.</p>\n<p>Меньше значимость — меньше страх. Если в календаре выделена только одна важная встреча, ваше внимание будет сосредоточено лишь на ней. Вы начнете заранее испытывать стресс, появится тревога. Чтобы этого не случилось, распишите в плане и другие задачи: рабочую рутину, время с семьей, обучение. В результате календарь будет насыщен делами, и значимость грядущей сделки существенно снизится. И даже по итогу все пройдет неудачно, у вас не останется времени слишком долго переживать по этому поводу, потому что нужно готовиться к следующим событиям.</p>\n<p>Способ 8. Вы — исследователь техник продаж Я люблю давать участникам своих тренингов практические упражнения прямо во время обучения. Причем мы не просто отрабатываем теоретические кейсы в группах, а сразу на чинаем продавать реальным клиентам. Это рискованное задание, на которое не решаются многие наставники. Методики могут не сработать, и тогда весь тренинг рассыпется как карточный домик. Но именно акцент на практику и результативность отличают мой подход.</p>\n<p>Многие ученики морально не готовы общаться с реальными клиентами по-новому и без какой-либо подготовки. Я вижу в их глазах страх и стеснение. И тогда я говорю: «Расслабьтесь.</p>\n<p>Представьте, что вы исследователи 40 техник закрытия сделок и собираете статистику, какой прием сработает, а какой — нет.</p>\n<p>Если какой-то способ провалился, это не вы плохо продаете, это я дал вам неподходящую методику. Давайте начнем!»</p>\n<p>Видели бы вы, с какой легкостью и азартом команда включается в процесс, забывая, что пять минут назад страх не давал им даже вдохнуть, не то, что звонить.</p>\n<p>Способ 9. Ведите статистику Я иногда получаю сообщения от менеджеров и участников моих тренингов, которые говорят, что у них много отказов. —  я не могу продавать! Клиенты все время отказывают! — «Все время» — это сколько в цифрах? — Ну не знаю... Очень много. Почти всегда! — Давайте посчитаем?</p>\n<p>Их можно понять. Когда сделка срывается несколько раз подряд, легко сделать вывод, что методика не работает.</p>\n<p>Но пытаться решать проблемы «на эмоциях» в продажах — это пустая трата времени. Поэтому каждый день фиксируйте количество звонков и выделяйте из них успешные.</p>\n<p>Если вы сделали 50 предложений, и 20 человек согласились купить ваш продукт, это очень хороший результат. Когда вы смотрите на цифры вот так, то вырываетесь из текущих эмоций, связанных с конкретным неудачным звонком. Важно понимать, что отказ — это не конец света, а просто очередная цифра в статистике.</p>\n<p>Способ 10. Действуйте! Когда вы начинаете действовать, страх уходит. Да, можно выделить время на подготовку и настроиться, но лучше приступать к делу сразу. Если все равно страшно, задайте себе пару вопросов, которые помогут добавить смелости. Например: «Я вот думаю, готовлюсь, а клиент может вообще не ответить на звонок. Так зачем тратить столько энергии? »</p>\n<p>Второй метод — сначала действуйте, а уже потом разбирайтесь с эмоциями. Помню, как мы в отпуске во Вьетнаме пошли на аттракционы и выбрали первый попавшийся.</p>\n<p>Он показался нам безобидным, но уже через минуту нас стало крутить, как в центрифуге. Рядом сидел вьетнамец, который вцепился мне в руку и кричал без остановки. Когда мы оттуда вышли, то выдохнули и потом вспоминали это с улыбкой. А если бы сначала посмотрели со стороны, как работает этот аттракцион, то, может, и вовсе не пошли бы на него.</p>\n<p>Еще один способ — действовать с целью получить тот результат, которого мы «боимся», например, нарваться на отказ. То есть вы поднимаете трубку, начинаете разговор, и ваша цель — получить как можно больше возражений. Это задание помогает преодолеть страх и понять, что слышать «нет» не страшно. Самое интересное, что, даже поставив такую цель, можно увидеть, что не все клиенты будут вам отказывать. Такое тоже бывает.</p>\n<p>Мы с учениками создали базу сильных фраз, цитат, афоризмов, которые помогают проработать страхи. Друзья, вы можете получить этот материал в подарок.</p>", "level": 3}, {"title": "ПРИНЦИПЫ ДЛЯ РЕКОРДНЫХ ПРОДАЖ", "html": "<p>Французский драматург и киносценарист Марсель Ашар как-то сказал: «Считают, что успех приходит к тем, кто рано встает. Нет: успех приходит к тем, кто встает в хорошем настроении». И я полностью с ним согласен. Вы можете без запинки проговаривать нужные скрипты продаж, идеально презентовать коммерческое предложение клиенту, но, если вы испытываете дискомфорт от того, что делаете, результатов будет мало. Почему так происходит? Потому что ваш эмоциональный настрой оставляет желать лучшего.</p>\n<p>Думаю, многие из вас натыкались на «унылых продавцов» и тех, кто общается с клиентами через «одолжение» — разговаривает без настроения, да и в целом не любит свою работу.</p>\n<p>Вероятно, вы терялись и не знали, как реагировать на такое равнодушие. А может, и вовсе хотелось скорее закончить диалог и бежать куда подальше от такого менеджера. Знакомая история?</p>\n<p>Да, такие ситуации часто встречаются в продажах, но их легко можно избежать с помощью проработки своего отношения к задачам и эмоционального настроя. Вот несколько принципов, которые помогают сделать коммуникацию с клиентом продуктивной и закрывать больше сделок.</p>\n<p>Принцип 1. Продажа начинается не с продукта или скрипта, а с вашего состояния Даже лучшие методы продаж не сработают, если вы действуете из состояния нужды.</p>\n<p>Когда вы испытываете выгорание или страх, это моментально передается вашим клиентам.</p>\n<p>Я работал с менеджером, который постоянно находился в состоянии стресса из-за планов и финансовых трудностей.</p>\n<p>Он говорил: «Мне нужно заключить эту сделку, иначе у меня будут серьезные проблемы». Это состояние нужды буквально разрушало его переговоры. Клиенты чувствовали давление, и заказы часто срывались, даже когда были вполне реальны.</p>\n<p>Если вы хотите ставить рекорды в продажах, начните с себя. Найдите способы, которые помогут вам повысить уровень энергии и мотивации, обрести уверенность и спокойствие перед каждым звонком или встречей. Если работа перестанет быть стрессом, результат придет как естественное продолжение вашего настроя и действий.</p>\n<p>Принцип 2. Польза для клиента — основа ваших рекордов Большие продажи строятся вокруг пользы для клиента. Причем сейчас я имею в виду не только то, что это важно показать во время презентации. Я имею в виду ваше отношение — понимаете ли вы сами, какую выгоду покупатели получают от вашего продукта? Действительно ли их жизнь станет хотя бы немного лучше после того, как вы закроете сделку?</p>\n<p>Многие менеджеры выгорают уже после первых незакрытых сделок, потому что чувствуют бесполезность своего предложения. Это порождает неуверенность, страхи и блокирует путь к рекордам.</p>\n<p>Продажа — это передача клиенту вашей веры в продукт. Поэтому вы сами должны доверять ему на 100%. Спросите себя, посоветуете ли вы купить его близким? Если вы предлагаете товар или услугу только незнакомым людям, а друзьям говорите: «Нет, лучше возьми в другой компании», вы обманываете себя. Задумайтесь: возможно, вам нужно продавать что-то другое?</p>\n<p>При этом ваше предложение не обязано быть лучшим из лучших: на рынке много похожих товаров и, возможно, найдутся те, кто делает более качественно. Но вам важно быть уверенным, что продукт полезен целевым клиентам, и найти такую аудиторию, для которой именно ваш вариант будет оптимальным выбором. Почему это так важно?</p>\n<p>Когда человек верит в то, что говорит, он максимально убедителен. Спросите любого продавца о продукте, который ему нравится и интересен, и он взахлеб будет рассказывать о его фишках и преимуществах. То есть он в него верит, а значит, в него поверят и другие.</p>\n<p>Когда я работал руководителем в банке, одним из продуктов в моем плане продаж была премиальная карта с высокой стоимостью обслуживания. Мои коллеги обычно оформляли клиентам карты попроще или вовсе выбирали бесплатные варианты. Каждый из них искренне недоумевал, зачем переплачивать. Но для меня было важно понять, почему это столько стоит? Я изучил все преимущества и понял, что это действительно классное предложение, которое оправдывает свою стоимость.</p>\n<p>Однажды я подошел к операционисту и сказал: — Оформи мне, пожалуйста, эту премиальную карту.</p>\n<p>Все специалисты отдела посмотрели на меня в недоумении. — Но она же дорогая? Зачем?</p>\n<p>В тот момент я четко понимал преимущества продукта — я поверил в него и стал искренне и увлеченно рассказывать о нем клиентам и коллегам. Через несколько месяцев я стал лидером по продаже этой банковской карты.</p>\n<p>Но клиент может получать пользу не только от вашего решения его ситуации, но и от взаимодействия с вами.</p>\n<p>Представляете, сам факт общения имеет ценность! Вот это высший уровень продаж. Спросите себя: получает ли человек положительные эмоции от общения со мной? Не от продукта, а именно от разговора. Что он чувствует после того, как побеседовал с вами: позитив, легкость и поддержку или ж
