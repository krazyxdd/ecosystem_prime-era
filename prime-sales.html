 &quot;Свершившийся факт&quot; | | | | | | | | | | | | | | | | | | | | | | | | 5 | &quot;Смещение фокуса&quot; | | | | | | | | | | | | | | | | | | | | | | | | 6 | &quot;Да-да. Нет-нет&quot; | | | | | | | | | | | | | | | | | | | | | | | | 7 | &quot;Техника ТО&quot; | | | | | | | | | | | | | | | | | | | | | | | | 8 | &quot;Пробный период&quot; | | | | | | | | | | | | | | | | | | | | | | | | 9 | &quot;Что вы теряете?&quot; | | | | | | | | | | | | | | | | | | | | | | | | 10 | &quot;Техника ВРЭД&quot; | | | | | | | | | | | | | | | | | | | | | | | | 11 | &quot;Внешние обстоятельства&quot; | | | | | | | | | | | | | | | | | | | | | | | | 12 | &quot;Потерянное время&quot; | | | | | | | | | | | | | | | | | | | | | | | | 13 | &quot;Гарантия&quot; | | | | | | | | | | | | | | | | | | | | | | | | 14 | &quot;Мнение клиента&quot; | | | | | | | | | | | | | | | | | | | | | | | | 15 | &quot;Сделать для вас?&quot; | | | | | | | | | | | | | | | | | | | | | | | | 16 | &quot;Отсечь ненужное&quot; | | | | | | | | | | | | | | | | | | | | | | | | 17 | &quot;Цветочки и ягодки&quot; | | | | | | | | | | | | | | | | | | | | | | | | 18 | Техника &quot;Крайний срок&quot; | | | | | | | | | | | | | | | | | | | | | | | | 19 | &quot;Дефицит&quot; | | | | | | | | | | | | | | | | | | | | | | | | 20 | &quot;Ажиотаж&quot; | | | | | | | | | | | | | | | | | | | | | | | | 21 | &quot;А Вы везунчик!&quot; | | | | | | | | | | | | | | | | | | | | | | | | 22 | &quot;Запланированная уступка&quot; | | | | | | | | | | | | | | | | | | | | | | | | 23 | &quot;Заполненный договор&quot; | | | | | | | | | | | | | | | | | | | | | | | | 24 | &quot;Обратный отсчет&quot; | | | | | | | | | | | | | | | | | | | | | | |</p>\n<hr>\n<hr>", "level": 4}]}, {"id": 11, "part": "ЧАСТЬ II. 8 НАВЫКОВ РЕКОРДНЫХ ПРОДАЖ", "partIdx": 1, "title": "Глава 11. Навык 8: Развитие отношений с клиентом", "bodyHtml": "<p>«Всегда закрывай сделку!» — принцип, который годами транслировался в разных книгах и фильмах о бизнесе и прочно вошел в сознание многих продавцов и руководителей. Все свои силы они направляют именно на этот этап продажи и считают, раз клиент поставил свою подпись в договоре, то дело сделано. Дальше можно ставить галочку в базе и больше особо не думать по поводу поддержания контакта.</p>\n<p>Я не согласен с таким подходом. Более того, такое мышление считаю вредным для экспертов и предпринимателей.</p>\n<p>Мне нравится фраза, которую, на мой взгляд, должны помнить абсолютно все, кто работает в продажах: «Закрывая сделку с клиентом, вы открываете новый этап отношений».</p>\n<p>Эти отношения вы будете поддерживать и развивать после заключения соглашения, и именно это станет фундаментом ваших будущих рекордов. Давайте посмотрим, какие конкретные действия и техники помогут вам выстроить надежную связь с клиентами.</p>\n<p>Стивен Кови ввел понятие эмоционального банковского счета. Это система, которая определяет степень взаимопонимания между людьми. Чем больше «баланс», тем выше уровень доверия. Как и обычный банковский счет, эмоциональный вы тоже можете пополнять или делать снятия. Если вы умело используете инструменты взаимодействия с покупателями и бережно выстраиваете лояльные отношения с ними, то эмоциональный банковский счет будет содержать солидные накопления. В противном случае — может быстро оскудеть.</p>\n<p>При общении с клиентом важно вспомнить эту метафору и проанализировать: «Я пополняю сейчас наш счет отношений или нет? То, что я делаю, повышает доверие или, наоборот, снижает?» Такой регулярный самоконтроль приведет к тому, что заказчик с высокой долей вероятности захочет работать только с вами и будет охотно рекомендовать вашу компанию другим.</p>\n<p>Так покупатели становятся нашими промоутерами. И это третья часть аббревиатуры ППП. С первыми двумя — Привлечением и Продажами — мы разобрались в предыдущих главах, а теперь попробуем понять, как сделать так, чтобы ваши действующие клиенты рекомендовали вас новым.</p>\n<p>Есть формула, которой я хочу с вами поделиться. Она состоит из четырех компонентов: Промоутеры = ПС + NPS + WOW + M ПС — это «принцип семьи», который лежит в основе долгосрочных доверительных отношений.</p>\n<p>NPS — это индекс лояльности, наиболее популярная в мире система оценки отношения клиентов к вашей компании.</p>\n<p>NPS — азбука для всех сотрудников Apple и других гигантов мирового рынка. Мы подробно рассмотрим, что именно стоит за этим термином и как это можно применить в любом бизнесе, даже если вы сейчас самозанятый и делаете первые шаги в продажах.</p>\n<p>WOW — это тот самый WOW-эффект, который обязательно нужно создавать своим предложением. Ведь если ощущения от покупки превосходят все, даже самые смелые, ожидания покупателя, он будет вас рекламировать и приводить новых потребителей ваших услуг.</p>\n<p>М — мотивация. Чтобы клиенты-промоутеры вас рекомендовали, им нужна система стимулов.</p>\n<p>Все компоненты формулы выполнимы, и вы в состоянии на них влиять. Главное - понимать, что просто хорошо сделать свою работу не всегда достаточно. Это чаще всего воспринимается людьми как должное. И, естественно, невыполнение обязательств ведет к разочарованию — тут вы рискуете получить волну негатива в свой адрес и антирекламу ваших услуг. Важно, чтобы от того, какие решения вы предлагаете — у клиента щелкнул условный тумблер: «С ними можно иметь дело!» Только после этого он захочет передать ваши контакты тем, кто дорог для него самого.</p>\n<p>В продажах система отношений с клиентами строится по аналогии с семейными. Пока колечко покоится в коробке и готовится поехать в ЗАГС, обе стороны проявляют лучшие черты характера. Пока клиент не расплатился за товар или услугу — продавец показывает чудеса лояльности.</p>\n<p>Я видел компании, которые в своей работе явно следовали принципу «до покупки — ты клиент, после покупки — ты проблема». Представляете? Они делали все, лишь бы человек купил, и сразу после завершения сделки их интерес падал. Где звонки-напоминания? Где прошлая любезность и высокая скорость ответа? От них не осталось и следа!</p>\n<p>Улыбчивая невеста раздражается по пустякам, а некогда дружелюбный менеджер становится неприступным как скала. Почему так происходит? Потому что начинается быт.</p>\n<p>Рутинная, иногда даже неприятная работа, в которой возникают проблемные ситуации, требующие решения. Если на этом этапе вы не «сдулись» и не отмахнулись от клиента, поздравляю: это верный путь, который приведет к долгосрочной связи с покупателем. Рассмотрим этапы бизнес-отношений через эту призму более подробно.</p>\n<p>Знакомство. С него начинаются все отношения. Оно может закончиться ЗАГСом или разбитым сердцем. У вас с клиентом тоже есть период знакомства. Это — первая продажа. Как произвести хорошее впечатление во время первой встречи? Верно: показать, что покупателя в компании слышат и демонстрируют к его потребностям неподдельный интерес.</p>\n<p>Помолвка. Парень с девушкой рассказывают близким о желании пожениться. В части взаимодействия с заказчиком Это — стадия подписания договора. Как и в помолвке, здесь важно оказывать знаки внимания, учитывать малейшие нюансы и особенности ситуации, чтобы все прошло гладко и отношения перешли на следующий уровень. Помолвка или заключение договора — значимое событие, и оно достойно превращения в мини-праздник. Подумайте: какие вклады на эмоциональный банковский счет можно сделать на этом этапе? Возможно, есть варианты как-то поощрить клиента.</p>\n<p>Сделайте ему сюрприз или подарок. Человек обязательно это оценит, а ваша связь станет крепче.</p>\n<p>Свадьба. Это запуск проекта, выход отношений с клиентом на новый уровень. Именно здесь может быть масса подводных камней, от преодоления которых во многом зависит качество брака. Нужно быть внимательным к мелочам, стараться предугадывать возможные ожидания, чтобы начало сотрудничества прошло хорошо и уверенно.</p>\n<p>Медовый месяц. Звучит и выглядит сладко. Все друг друга любят и, безусловно, счастливы. Конечно, нельзя окончательно расслабляться и нужно иногда подкидывать дров в согревающий огонь семейного очага или партнерских отношений. Важно усилить то доверие, которое уже есть. Превратите вашу совместную деловую победу в событие. Можно отправить клиенту письмо о первых результатах проекта, дополнительные материалы. Не забывайте приглашать его на ваши мероприятия и откликайтесь, если позовут вас. Это абсолютно нормально: новоиспеченный муж с удовольствием приглашает жену в ресторан, а она ведет его в театр. Это всегда работает на укрепление отношений.</p>\n<p>Менеджеры моего отдела продаж связываются с заказчиками через один-два дня после покупки и уточняют, получилось ли зайти на платформу, все ли удалось открыть?</p>\n<p>Так вот, некоторые клиенты изначально к таким звонкам относятся с подозрением. Они ждут, что сейчас им начнут предлагать дополнительные услуги, и не сразу понимают, что наш звонок — обычное проявление заботы и нормального отношения к партнеру. Так и говорят: «Как приятно! Вы — первая школа, которая так делает. Я сколько всего покупал, сплошное равнодушие, никакой обратной связи. А вы просто хотите узнать, получилось у меня зайти на платформу или нет, и ничего не будете продавать?»</p>\n<p>Быт. Тот самый айсберг, о который разбиться проще, чем кажется. Возникают рутинные вопросы, вероятность конфликтных ситуаций может нарастать, так как на отношения могут влиять внешние обстоятельства и другие люди.</p>\n<p>Этот этап требует значительной работы, прежде всего над самим собой, чтобы сотрудничество было крепким, здоровым и комфортным для обеих сторон.</p>\n<p>Оказывайте клиенту небольшие услуги. Не стесняйтесь обращаться с просьбами. Многие ошибочно считают, что это неправильно, однако на самом деле люди любят выступать в роли эксперта и неважно, о какой области жизни идет речь. Это необязательно могут быть деловые вопросы: посоветуйтесь по поводу хобби или затроньте другие бытовые моменты. Конечно, делать это нужно в разумных пределах.</p>\n<p>Старайтесь использовать любую более-менее подходящую возможность для контакта с клиентом: ему будет приятно, что вы, например, помните о его дне рождения или другой важной дате.</p>\n<p>Вес в ребро. Это этап испытания отношений на прочность. Здесь очень важно повести себя грамотно в сложной ситуации, чтобы сохранить лояльность. Не нужно замалчивать конфликты: их лучше активно решать. Ведь проблемы — нормальная, неотъемлемая часть любой коммуникации, а попытки их избегать — это путь в никуда.</p>\n<p>Клиент может заинтересоваться вашими конкурентами и начать работать с ними. Такие моменты нельзя упускать, важно их обсуждать, проговаривать и разбирать ситуации, которые складываются не в вашу пользу.</p>\n<p>Возможно, деловому партнеру не хватает чего-то в вашем партнерстве, вероятно, он стремится что-то улучшить или чувствует, что его ожидания не оправдываются. Этот этап прекрасный шанс выявить причину недопониманий и их происхождение. Вы можете опираться на опыт завершенных проектов, апеллировать к прошлому, в котором все было отлично и работало. Да, сейчас есть определенные трудности, с ними реально справиться, ведь бывают разные периоды.</p>\n<p>С таким подходом вы сможете преодолеть даже этот непростой этап и укрепить ваши отношения.</p>\n<p>Не забывайте, что каждый клиент нуждается в вашей поддержке. Возможно, у него возникли проблемы, которые нужно решить. Убедитесь, что у него все в порядке и постарайтесь поддерживать связь. Проинформируйте заказчика, по каким каналам и в какое время он может обратиться к вам за помощью.</p>\n<p>Зрелые отношения. Кризисы позади, и можно направить усилия на развитие семьи и делового партнерства.</p>\n<p>Составьте чек-лист задач, которые нужно выполнить, чтобы укрепить отношения с клиентом. Когда вы начинаете думать о том, что именно нужно покупателю, то картина становится ясной. Это те самые точки роста, над которыми стоит хорошенько поработать, чтобы преуспеть.</p>\n<p>Итак, мы выяснили, что важно продолжать ведение партнеров после сделки и получать обратную связь. Именно это поможет выявить проблемные ситуации для того, чтобы их проработать. Кроме того, сам процесс получения обратной связи — это сигнал о том, что компания уверена в качестве своих услуг и ей не безразлично мнение тех, кто ими пользуется.</p>\n<p>Если вы будете экспертом, который внимательно слушает, подбирает лучшее решение, проявляет компетентность, то у вас есть все шансы повысить лояльность клиента. Это и будет тот самый WOW-эффект, который позволит рекомендовать вас как надежного специалиста.</p>\n<p>Вы же помните, что промоутеры появляются исключительно там, где работает принцип семьи? Выше я неоднократно упоминал эмоциональный банковский счет. Более подробно вы сможете прочитать о нем в книге Стивена Кови «Семь навыков высокоэффективных людей». Я же предлагаю разобраться на конкретных примерах, какие ваши действия на разных этапах взаимодействия с клиентом приводят к пополнению ЭБС, а какие — к снятиям.</p>\n<p>Примеры пополнения и снятий с ЭБС на разных этапах отношений с клиентом Этапы отношений - Пополнение - снятия.</p>\n<p>Продажа -  Быстро реагировать на загросы клиента быть внимательным к деталям, предоставлять точную и полную информацию о продукте. - Замалчивать потенциальные недостатки продукта.</p>\n<p>Задерживать ответы на вопросы. Заключение сделки (свадьба) - Лично поздравлять с заключением сделки. Предоставлять четкие прозрачные условия контракта. - Усложнять начало проекта, не выполнить обещания по согласованию договора.</p>\n<p>Игнорировать запросы на уточнение деталей. «Медовый месяц» (первый период сотрудничества) - Оперативно устранять начальные проблемы.</p>\n<p>Активно поддерживать клиента в первые дни после покупки. - Не выполнять первоначальные обещания.</p>\n<p>Игнорировать жалобы или запросы на поддержку. Быт (регулярная работа) - Регулярно информировать клиента о статусе работы.</p>\n<p>Поддерживать стабильно высокое качество обслуживания. - Обращаться к клиенту только с формальными уведомлениями.</p>\n<p>Не адаптировать продукт под изменяющиеся потребности клиента. Бес в ребро (неприятные моменты в сотрудничестве) - Открыто обсуждать проблемы и активно искать решения.</p>\n<p>Проявлять эмпатию и понимание к переживаниям клиента. - Избегать ответственности за проблемы. Обвинять клиента в возникших трудностях.</p>\n<p>Зрелые отношения (развитие отношений с клиентом) - Разрабатывать индивидуальные предложения для клиента. Вовлекать клиента в процесс улучшения продукта. - Пренебрегать мнением клиента при внесении изменений в продукт.</p>\n<p>Медлить с ответами на запросы. Подумайте, какие из этих вкладов вы можете сделать в общении с вашими клиентами? Что поможет вам лучше понимать их? Какие мелочи стоит учитывать для построения отношений? Какие обязательства вы в состоянии контролировать и выполнять вовремя?</p>\n<p>Чем больше вкладов на эмоциональный счет, тем выше доверие покупателя к вашей компании и шансы превзойти его ожидания. Ваш «баланс» может стать настолько большим, что клиенты с удовольствием будут с вами работать и рекомендовать ваши услуги. Вот так работает принцип семьи!</p>", "sections": [{"title": "МЕТОДИКА NPS ДЛЯ ОЦЕНКИ ЛОЯЛЬНОСТИ КЛИЕНТОВ", "html": "<p>NPS расшифровывается как Net Promoter Score, что в переводе означает: индекс потребительской лояльности. Если рассчитать его по определенной формуле — то можно получить конкретное число, которое покажет степень удовлетворенности покупателей или партнеров услугами вашего бизнеса. Методика NPS активно используется компаниями во всем мире.</p>\n<p>Суть довольно проста и подробно описана в книге «Искренняя лояльность» (Фред Райхельд, Роб Марки) — вы задаете клиентам несколько вопросов и в зависимости от их ответов делите базу на три группы: промоутеры, нейтралы, критики.</p>\n<p>Сейчас я расскажу вам, как я применяю методику NPS в отделах продаж. КАК ВЫГЛЯДИТ АЛГОРИТМ ОПРОСА NPS?</p>\n<p>Шаг первый: поблагодарите клиента за сотрудничество и доверие. Не нужно сразу задавать интересующие вас вопросы, постройте первую фразу примерно так: «Мы с вами давно работаем, я звоню вам как ключевому клиенту, хочу поблагодарить за работу, доверие, за то, что вы с нами».</p>\n<p>Шаг второй: скажите, что вы и дальше планируете работать над продуктом и сервисом: «Мы за последнее время внедрили много изменений, планируем усиливать наш продукт, чтобы он был вне конкуренции и оставался самым подходящим для вас». Так вы покажете, что обратная связь вам очень важна.</p>\n<p>Шаг третий: попросите разрешения задать несколько вопросов. Если клиент соглашается, можно переходить к первому вопросу. Он может выглядеть примерно так: «Насколько вероятно, что вы порекомендуете нас своим коллегам, друзьям, партнерам? Назовите число от нуля до десяти».</p>\n<p>Обратите внимание: формулировка должна включать точную информацию, а не общие фразы вроде «Насколько вам все понравилось». Ваша задача — получить от клиента конкретную оценку действий вашей компании. Да, некоторые могут говорить: «Мне нравится, все замечательно». Не надо воспринимать это как десятку и ставить себе высший балл, лучше еще раз уточнить определенную цифру.</p>\n<p>В зависимости от того, какую оценку поставил клиент, он относится к промоутерам, нейтралам или критикам.</p>\n<p>Критики — люди, которые ставят низкий балл (6 и ниже), оценивая качество ваших услуг. Они по каким-то причинам недовольны работой с вами, их ожидания не оправдались.</p>\n<p>Нейтралы — те, кто ставит вам 7-8 баллов. Они относятся к вам нормально. Открытых претензий не имеют, но и рекламировать вашу компанию тоже не будут. Они могут с легкостью уйти к конкурентам, если увидят более выгодное предложение.</p>\n<p>Промоутеры — эта категория клиентов ставит высокие оценки и активно рассказывает о вас целевой аудитории.</p>\n<p>По сути, они выступают внештатными маркетологами вашего бизнеса, ведь приводят новых клиентов, оставляют положительные отзывы, которые, кстати, вы можете использовать в соцсетях. Эти люди фактически работают на вас — они лояльны и довольны.</p>\n<p>В чем плюсы промоутеров?</p>\n<ul><li>они в четыре раза чаще остальных категорий совершают у вас повторные покупки;</li>\n</ul>\n<ul><li>терпимо относятся к вашим ошибкам;</li>\n</ul>\n<ul><li>намного активнее тестируют ваш продукт, обновления, подключаются к процессу. Промоутеры — замечательные люди, которые очень нужны компании, и вопрос о том, как приумножить их количество, актуален для всех, кто хочет добиваться высоких результатов.</li>\n</ul>\nВажная задача для эксперта — сделать так, чтобы промоутеров было как можно больше, а критиков практически не было.\n<p>Шаг четвертый: после озвученной оценки важно уточнить, почему клиент именно так отреагировал на вашу работу.</p>\n<p>Здесь могут прозвучать ключевые проблемы вашей компании, на которые стоит обратить особое внимание.</p>\n<p>Шаг пятый: выяснить, что необходимо изменить, чтобы оценка стала выше. Задавать ли этот вопрос, если клиент и так поставил высший балл? Конечно! Вы можете услышать новое и интересное мнение, которое поможет вам улучшить предлагаемые сервисы. Так вы поймете, что высший балл вам дали авансом и на самом деле есть к чему стремиться!</p>\n<p>После получения информации о поставленных оценках можно рассчитать индекс лояльности. Есть сайты, которые это делают просто и наглядно. И еще: не проводите опрос формально. Вы же не робот и звоните не для галочки. Ваша задача — выявить реальные потребности клиентов, поэтому будьте максимально внимательны к тому, что именно вам говорят, фиксируйте ответы и при необходимости задавайте уточняющие вопросы.</p>", "level": 3}, {"title": "Какие меры можно принять в отношении каждой группы", "html": "<p>ИЗ КАТЕГОРИЙ? Критики. Некоторые продавцы откровенно боятся с ними взаимодействовать. Это неправильная позиция, ведь на самом деле есть реальный шанс перевести клиента из критиков в нейтралы, а если постараться, то и в промоутеры.</p>\n<p>Критики готовы повысить свою оценку и лояльность, если вы сможете предложить адекватное решение вопроса, который их смутил и вызвал негативную реакцию.</p>\n<p>Например, покупатель не понимает, как работать с продуктом. Что вы можете сделать? Как вариант — дать подробную инструкцию, спросить, что конкретно не получается. Если клиенту не хватает какой-то опции, это тоже важно прояснить и данную опцию предоставить, чтобы он получил результат.</p>\n<p>Самое главное — не замыкаться, не замалчивать проблему, а общаться с такими клиентами, слышать их и принимать соответствующие решения.</p>\n<p>Нейтралы. Их слабое место — равнодушное отношение к вашей компании, из-за чего они могут в любой момент переметнуться к конкурентам. Иногда нейтралы и вовсе не помнят, что когда-то покупали что-то именно у вас. Таким клиентам вы можете предложить подарок и тем самым выйти на контакт. Так они станут более лояльными и, соответственно, захотят снова обратиться за услугами. Подать им идею, что именно купить, вы можете благодаря поддержанию постоянной связи — например, предложите клиенту подписку на аккаунты компании в соцсетях, в которых регулярно проводите стимулирующие мероприятия. Словом, если человек попал в этот сегмент, ему нужно периодически напоминать о себе, давать полезный контент, и все будет отлично.</p>\n<p>Промоутеры. Если вы думаете, что постоянные, лояльные покупатели не нуждаются в вашем внимании — вы ошибаетесь. Им ничто не помешает мигрировать в другие сегменты, если что-то пойдет не так. Важно запрашивать у них отзывы, благодарить за оценку работы вашей компании, дополнительно мотивировать. Давайте бонусы за лояльность, и тогда она будет все время оставаться на высоком уровне. Не забывайте рассказывать промоутерам об обновлениях проекта, новых продуктах, потому что именно они могут первыми среагировать на такую информацию и стать клиентами по новым направлениям.</p>", "level": 3}, {"title": "Ошибки при измерении лояльности", "html": "<p>Удивительно, но некоторые компании умудряются с помощью этой методики не повысить лояльность клиентов, а наоборот снизить. Однажды я был свидетелем, как предприниматель захотел внедрить алгоритм опроса NPS в свой бизнес. Менеджерам поставили задачу: связаться со всеми клиентами и собрать информацию. Да, они звонили, но общались так формально и безразлично, что это вызвало у меня искренний шок. — Здравствуйте, мы с вами как-то работали, какую оценку поставите. 5 из 10? Спасибо, до свидания.</p>\n<p>И это все? А где интерес к ответам? А где вовлеченность в разговор и желание узнать, почему оценка снижена, и что хотелось бы улучшить?</p>\n<p>Бывали в моей практике ситуации, когда клиент может и хотел поделиться мнением, но сотрудник своей интонацией давал понять, что мечтает побыстрее закончить разговор, так как других дел полно. И вообще, ему было все равно, какую оценку поставят. Главное — выполнить «бестолковое задание руководителя, который прошел новое обучение и теперь проверяет его эффективность». К зарплате эти эксперименты не сделают прибавки, так зачем напрягаться?</p>\n<p>Как думаете, что чувствует человек, когда с ним разговаривают с таким настроем? Станет ли выше его лояльность после такого опроса? Конечно, нет. Поэтому при внедрении этой методики важно внимательно слушать, погружаться в детали ответов, проявлять искренний интерес. Даже если клиент ответит, что работу с вами он оценивает на 5 или 4 из 10. Отлично! Выслушайте, проведите работу над ошибками и через время позвоните с улучшенным предложением.</p>\n<p>Скажите покупателю, что его обратная связь помогла вам устранить проблемы и сделать услугу еще эффективнее и круче. И все благодаря его отзыву! Его услышали. Вот увидите, как изменится отношение к вам. Потому что каждому приятно чувствовать себя значимым. Пользуйтесь этой техникой правильно, и рост продаж вам обеспечен. к грамотной работе с обратной связью можно также отнести публикацию положительных комментариев. Даже просьбу на разрешение опубликовать отклик клиента можно преподнести красиво: «Иван Иванович, посмотрите, какой яркий отзыв у нас сложился на основе опроса, мы можем его опубликовать? » Покупателю станет приятно, что вы так бережно отнеслись к его мнению, да еще и красиво его упаковали. Так вы снова получите тот самый WOW-эффект.</p>\n<p>Если же мы рассматриваем вариант негативной обратной связи, тоже важно показать, что вы провели работу над ошибками. Клиент обязательно оценит, что вы превзошли ожидания. И не забывайте, что жалобы — это настоящий подарок, ведь они показывают точки роста и демонстрируют моменты, которые нужно улучшить для развития компании.</p>\n<p>Приведу пример. Недавно моим знакомым что-то не понравилось в организации доставки одной популярной компании.</p>\n<p>Они оставили негативный отзыв. Сотрудники оперативно связались с ними, вернули стоимость доставки и извинились. Так мнение клиента из резко негативного перешло примерно в следующее: «Бывает, что-то пошло не так, но, в целом, я доволен. И я готов заказывать у этих поставщиков снова». Так выглядит грамотная работа с обратной связью.</p>\n<p>Если бы этот вопрос не решили, неизвестно, какие комментарии могли бы появиться, к примеру, в соцсетях. Поэтому старайтесь превосходить ожидания: даже если возникла негативная ситуация, можно сделать так, чтобы клиент остался доволен.</p>", "level": 3}, {"title": "НАСТРОЙСЯ НА ВОЛНУ САРАФАННОГО РАДИО", "html": "<p>Сарафанное радио — один из самых эффективных видов рекламы. Одно дело, когда про преимущества продукта рассказывает незнакомец из телевизора или интернета — и совсем другое, если его рекомендует друг или родной человек. Как же стать той компанией, к услугам которой не только хочется возвращаться, но и приводить знакомых? Правильно: нужно превзойти ожидания и произвести WOW-эффект.</p>\n<p>Важно понимать, что WOW-эффект — не одноразовая акция, он должен сохраняться на протяжении всего общения клиента с вами. После получения обратной связи, к примеру, опроса, проведенного в рамках NPS, обязательно показывайте, что вы услышали его пожелания, что-то улучшили или внедрили.</p>\n<p>Контакт устанавливает каждый продавец, но вы это делаете лучше. Все проводят сухую презентацию, а вы добавляете эмоции и факты, различные усилители — и вот ваше предложение уже производит WOW-эффект! Или, к примеру, работа с возражениями: все спорят, а вы их грамотно обрабатываете.</p>\n<p>Большинство знает один способ закрытия сделок, а вы вооружены 40 техниками, чтобы сделать это красиво! То есть вы на каждом этапе показываете себя WOW-продавцом.</p>\n<p>Как-то я запросил итоговый отчет за год на YouTube. Результат меня ошеломил — десятки тысяч подписчиков от органического роста, без какой-либо рекламы, только по сарафанному радио. Люди поделились с друзьями и знакомыми моим видеоконтентом просто потому, что он им зашел.</p>\n<p>В этом и есть мощный эффект сарафанки: делай классный продукт, и о нем будут говорить.</p>\n<p>Как еще можно запустить сарафанное радио?</p>\n<ul><li>Крутой сервис. Обслужите человека так, как он не ожидает. WOW-эффект не заставит себя долго ждать: о вас и вашей компании побегут рассказывать.</li>\n</ul>\n<ul><li>Мотивация. Вы просто спрашиваете: как покупателю ваши услуги? Если он доволен, предложите за рекомендацию или приведенного друга крутой бонус или возможность приобрести какой-то пакет продуктов по акции.</li>\n</ul>\nТак вы будете мотивировать людей оставлять отзывы. При этом новые клиенты будут видеть на вашем сайте или в соцсетях, что комментарии постоянно обновляются, и их пишут конкретные потребители.\n<p>Предлагаю простое упражнение для WOW-продукта.</p>\n<p>Поставьте себя на место клиента и ответьте на несколько вопросов:</p>\n<ul><li><strong>1.</strong> В каких случаях ваши ожидания были бы оправданы?</li>\n</ul>\n<ul><li><strong>2.</strong> В каких случаях продукт и услуга превзошли бы ваши ожидания?</li>\n</ul>\n<ul><li><strong>3.</strong> Какие выводы вы можете сделать, что нужно добавить в ваши продажи? После того как вы выполните эти пункты, систематизируйте полученную информацию и составьте на ее основе дальнейший план действий. Это поможет создать WOW-эффект и, как следствие, запустить сарафанное радио.</li>\n</ul>\n---\n<ul><li><strong>1.</strong> Навыки продаж — это то, что нужно прокачивать абсолютно каждому предпринимателю и эксперту для достижения рекордов. Невозможно уйти из этой сферы, потому что продажи — это вся наша жизнь. Это общение, умение слушать и убеждать, строить отношения и давать пользу другим людям. Чем раньше вы усвоите эту мысль, тем быстрее и увереннее вы достигнете новых высот! А если вы работаете в найме, то именно продажи позволят вам относительно быстро добиться успехов, вырасти в доходе и должности. Здесь все зависит от ваших усилий. Если вы способны показать высокую эффективность, то всегда будете востребованы. Ну кто откажется от сотрудника или руководителя, который приносит деньги? Ваши навыки — ваше золото.</li>\n</ul>\n<ul><li><strong>2.</strong> Даже если вы считаете себя интровертом, это не значит, что вы не сможете закрывать сделки больше всех. Продажи — это система, в основе которой лежат ваши способности и конкретные формулы. Освойте ее и продавайте красиво и легко!</li>\n</ul>\n<ul><li><strong>3.</strong> Продажи — это свобода. Если у вас развиты необходимые навыки, вы можете продавать что угодно: от готового бизнеса до шоколадных тортиков. Как предприниматель, вы получите возможность запускать разные проекты и не бояться, что «это никто не купит». А если вы менеджер или руководитель, то имеете шанс самостоятельно выбрать компанию, где хотите работать. Вы можете продавать из любой точки мира. И главное, делать это в удовольствие.</li>\n</ul>\nХочу сказать, что вы уже молодцы! У каждого из вас есть огромное преимущество перед другими предпринимателями и экспертами — система рекордных продаж, которая работает.\n<p>Даже если вам кажется, что продажи — это не ваше, просто попробуйте. Не зря же вам захотелось открыть и прочитать эту книгу. Значит, подсознательно вы чувствуете, что ваш интерес все же здесь. Вам любопытно, а что, если...</p>\n<p>Отлично! Искреннее внимание к чему-то — это самый главный показатель, что у вас есть силы и энергия, на то, чтобы добиться высот в этой сфере.</p>\n<p>Я надеюсь, моя книга даст вам мощный заряд мотивации к движению вперед и покажет, что успех не конечен и расти в своем деле можно всегда. Даже если вокруг кризисы, даже если многие говорят, что сейчас спад в экономике и добиться лучшей жизни невозможно — покажите на своем примере, что это не так. Изучайте, пробуйте, внедряйте. Преодолевайте свои страхи и сомнения. Главный помощник на этом пути уже с вами — мой опыт и моя система продаж, которая помогла мне и помогает тысячам моих учеников из разных уголков планеты. Берите ее на вооружение, адаптируйте под себя и приходите к самым высоким результатам в вашем направлении.</p>\n<p>Пусть эта книга станет одним из вкладов в ваше развитие, новым вектором, который покажет, в каком направлении двигаться дальше. главное, делайте это с любовью к своему делу, и тогда вы точно добьетесь успеха. Без ежедневного стресса, но с большим кайфом от того, что занимаетесь тем, что действительно зажигает ваше сердце. Добавьте в свою жизнь немного системности, и тогда хаос превратится в порядок.</p>\n<hr>", "level": 3}]}, {"id": 12, "part": "ЧАСТЬ III. СКРИПТЫ, КП И ПЕРЕПИСКА", "partIdx": 2, "title": "Глава 12. Скрипты звонков", "bodyHtml": "", "sections": [{"title": "Чек-лист продающего звонка (11 шагов)", "html": "<p>ШАГ 1. Поздоровайтесь с клиентом. Дождитесь ответной реакции.</p>\n<p>ШАГ 2. Скажите, как Вас зовут. Без слова «Беспокоит».</p>\n<p>ШАГ 3. Назовите вашу должность, компанию (трюк «Красивая должность») + технику «Интрига».</p>\n<p>ШАГ 4. Уточните возможность разговаривать (элементарный этикет)</p>\n<p>ШАГ 5. Скажите фразу о клиенте</p>\n<blockquote>Например, «ИО, звоню вам сейчас, потому что вы занимаетесь производством / продажей / созданием / в такой-то сфере…»</blockquote>\n<p>ШАГ 6. Скажите, что клиент может получить от Вас. Делайте акцент на высшую выгоду</p>\n<blockquote>«А у нас есть интересное решение / дополнение / идея или еще что-то, которое поможет клиенту решить часть его проблем в кратчайшие сроки»</blockquote>\n<p>ШАГ 7. Побудите к целевому действию!</p>\n<p>ШАГ 8. Ответьте на вопросы и возражения. Используйте для ответов</p>\n<p>сборник «275 готовых ответов на возражения»</p>\n<p>ШАГ 9. Согласуйте дальнейшие действия.</p>\n<p>ШАГ 10. Задайте дополнительные уточняющие (квалификационные вопросы) для подготовки к целевому действию.</p>\n<p>ШАГ 11. Поблагодарите клиента за разговор.</p>\n<hr>", "level": 4}, {"title": "Схема продающего звонка (16 шагов)", "html": "<p>Блок Вступление:</p>\n<p>Шаг 1. Скажите «Телефонную визитку»</p>\n<p>Шаг 2. Используйте «Интригу», чтобы зацепить внимание клиента.</p>\n<p>Шаг 3. Задайте вовлекающий вопрос.</p>\n<p>Блок Утепление:</p>\n<p>Шаг 4. Используйте технику «ПТС» (покажите точки соприкосновения)</p>\n<p>Шаг 5. Озвучьте высшую выгоду для клиента.</p>\n<p>Шаг 6. Задайте нейтральный вовлекающий вопрос.</p>\n<p>Блок Прояснение:</p>\n<p>Шаг 7. Используйте технику «Программирование»</p>\n<p>Шаг 8. Задайте вопросы (продающие)</p>\n<p>Шаг 9. Задайте вопросы (квалификационные)</p>\n<p>Блок Убуждение:</p>\n<p>Шаг 10. Используйте аргументы о сотрудничестве.</p>\n<p>Шаг 11. Используйте аргументы о целевом действии.</p>\n<p>Шаг 12. Используйте аргументы-мотиваторы.</p>\n<p>Блок Закрытие:</p>\n<p>Шаг 13. Озвучьте призыв к целевому действию (ПЦд).</p>\n<p>Шаг 14. Ответьте на вопросы и возражения. Используйте для ответов сборник «275 готовых ответов на возражения»</p>\n<p>Шаг 15. Подведите итоги. Зафиксируйте договоренности. (Резюме)</p>\n<p>Шаг 16. Усиленная диагностика.</p>\n<hr>", "level": 4}, {"title": "ТОП-10 ошибок на входящих звонках", "html": "<p>Проработайте все перечисленные ошибки,</p>\n<p>проверьте ваши скрипты продаж,</p>\n<p>потренируйтесь с сотрудниками в упражнениях.</p>\n<p>Ошибка №1 - Справочное бюро - Менеджер дает клиенту односложные ответы, говорит незаинтересованно, просто предоставляет информацию.</p>\n<p>Ошибка №2 - Печальный продавец - В голосе менеджера чувствуется усталость, безразличие, низкая энергетика, вздохи.</p>\n<p>Ошибка №3 - Нет имени и телефона - Менеджер не уточняет базовую информацию о клиенте. Например, имя клиента, контакты для связи.</p>\n<p>Ошибка №4 - Нет перехвата инициативы - Управляет разговором клиент: он задает вопросы, начинает и завершает разговор. Менеджер не перехватывает инициативу</p>\n<p>Ошибка №5 - Нет работы с возражениями - Даже простые возражения «Я подумаю», «У Вас дороже, чем у конкурента» не отрабатываются</p>\n<p>Ошибка №6 - Нет вопросов по ситуации - Менеджер не проявляет интереса к ситуации клиента, не задает вовлекающих, проясняющих вопросов.</p>\n<p>Ошибка №7 - Нет теста запроса клиента - Менеджер не тестирует запрос клиента (готов ли клиент рассматривать аналоги, другие сроки и тд).</p>\n<p>Ошибка №8 - Нет кросс-предложений - В процессе общения с клиентом менеджер не предлагает доп. продукты, которые могут быть полезны клиенту.</p>\n<p>Ошибка №9 - Нудная презентация - Презентация звучит монотонно, не цепляет клиента и не побуждает к действию.</p>\n<p>Ошибка №10 - Нет призыва к ЦД - В процессе общения менеджер не предлагает клиенту следующий шаг. Нет даже одной попытки.</p>\n<hr>\n<hr>", "level": 4}]}, {"id": 13, "part": "ЧАСТЬ III. СКРИПТЫ, КП И ПЕРЕПИСКА", "partIdx": 2, "title": "Глава 13. Коммерческое предложение (КП)", "bodyHtml": "", "sections": [{"title": "Как создать продающее КП: 9 блоков", "html": "<ul><li><strong>1.</strong> Правильные продающие смыслы</li>\n</ul>\n<ul><li>Заголовок</li>\n</ul>\n<ul><li>Проблемы ЦА / боль</li>\n</ul>\n<ul><li>Отстройка от конкурентов</li>\n</ul>\n<ul><li>Отстройка от аналогов решений</li>\n</ul>\n<ul><li>Повышение доверия (соц доказательство, отзывы, рейтинги, фото)</li>\n</ul>\n<ul><li>Персонализация</li>\n</ul>\n<ul><li>Сильный оффер</li>\n</ul>\n<ul><li>P.s. и тд</li>\n</ul>\n<ul><li><strong>2.</strong> Сильный визуал</li>\n</ul>\n---", "level": 4}, {"title": "Чек-лист проверки КП", "html": "<ul><li><strong>1.</strong> ПЕРСОНАЛИЗАЦИЯ - Проверьте, что ваше КП отправляется для конкретного клиента: есть обращение по имени, есть логотип компании, куда высылаете КП.</li>\n</ul>\n<ul><li><strong>2.</strong> НЕ ТАРИФЫ - Убедитесь, что вы высылаете именно продающее КП, а не банальные тарифы в таблице. КП должен показывать ценность работы с вами, а не просто стоимость товара.</li>\n</ul>\n<ul><li><strong>3.</strong> СТИЛЬНО - Ваше КП стильно оформлено? Вы разработали аккуратные слайды, или все написали на одном листе А4 шрифтом Times New Roman?.</li>\n</ul>\n<ul><li><strong>4.</strong> ЗАГОЛОВОК - Вашем КП есть сильный заголовок? Не начинается ли КП со стандартных фраз типа «Коммерческое предложение», «Предложение о сотрудничестве» и тд?</li>\n</ul>\n<ul><li><strong>5.</strong> ЕСТЬ PS В - PS - сильнейший элемент КП. На этот элемент Ваш клиент обращает внимание, поэтому обязательно напишите здесь что- то особенное!</li>\n</ul>\n<ul><li><strong>6.</strong> ПОЧЕМУ МЫ? -  Обязательно добавьте блок, который покажет клиенту четкие отличия от конкурентов. Не бойтесь конкретики и не пишите банальности!</li>\n</ul>\n<ul><li><strong>7.</strong> ПРЕИМУЩЕСТВА - Индивидуальный подход и гибкие цены - это не преимущества. Это то, что пишут абсолютно все. Напишите наиболее сильные преимущества и монетизируйте выгоды (покажите цифры).</li>\n</ul>\n<ul><li><strong>8.</strong> СИЛА ВИЗУАЛА - Сделайте презентацию визуальной. Используйте схемы, иконки, карты процессов и тд. Так вы донесете до клиента то, что важно!</li>\n</ul>\n<ul><li><strong>9.</strong> CTA! - Предложите клиенту простой и легкий шаг, от которого нет смысла отказываться.</li>\n</ul>\n---\n<hr>", "level": 4}]}, {"id": 14, "part": "ЧАСТЬ III. СКРИПТЫ, КП И ПЕРЕПИСКА", "partIdx": 2, "title": "Глава 14. Продажи в переписке и мессенджерах", "bodyHtml": "", "sections": [{"title": "Как повысить конверсию в переписке", "html": "<ul><li><strong>1.</strong> Первое сообщение без признаков спама - Короткое, с ПТС, с вопросом.</li>\n</ul>\n<ul><li>2. Польза + интрига для вовлечения.</li>\n</ul>\n<ul><li>3. Попытка вывода из переписки (с доп ценностью, срочностью)</li>\n</ul>\n<ul><li>4. Разные форматы сообщений (фото / аудио / видео)</li>\n</ul>\n---", "level": 4}, {"title": "7 приемов для увеличения продаж в мессенджерах", "html": "<p>Используйте эти приемы при работе с клиентами.</p>\n<p>в мессенджерах и закрывайте больше сделок!</p>\n<p>Прием Nº1. Замените точку на вопрос. Заканчивайте ваши сообщения не точкой, а вопросом. Это позволит вовлечь клиента в разговор, и существенно снизит вероятность «зависания разговора»</p>\n<p>Прием Nº2. Грамотно презентуйте цены.</p>\n<p>1 вариант презентации: Перевести общение в звонок и озвучить цену в разговоре, далее - вернуться в переписку.</p>\n<p>2 вариант презентации: Озвучить цену и сразу задать вовлекающий вопрос, чтобы избежать паузы.</p>\n<p>Прием Nº3. Переводите «ДМ - КД». Переведите ваше общение в переписках из «длинного монолога» в «короткий диалог». Не отправляйте огромные тексты, лучше разбейте их на короткие сообщения, вовлекающие клиента.</p>\n<p>Прием Nº4. Добавьте персонализацию. Если вы используете шаблоны - максимально адаптируйте их под сферу клиента. Делайте акцент на его ситуации, комментируйте ответы и стройте диалог на основе его ответов.</p>\n<p>Прием Nº5. Совмещайте чат и звонки. Если нужно узнать больше информации, что-то рассказать, донести больше ценности, обязательно пробуйте перевести общение в звонок, но не забудьте обосновать клиенту, для чего это нужно.</p>\n<p>Прием Nº6. Умно пользуйтесь «голосом». Как правильно использовать голосовые сообщения:</p>\n<ul><li><strong>1.</strong> Спросите разрешение у клиента (удобно ли ему)</li>\n</ul>\n<ul><li><strong>2.</strong> Поясните клиенту, почему именно голосовое будет полезно</li>\n</ul>\n<ul><li><strong>3.</strong> Используйте «надиктовывание», чтобы голосом «набирать» текст быстрее</li>\n</ul>\nПрием Nº7. Переписывайтесь «красиво». Правила красоты:\n<ul><li>Проверяйте текст на ошибки</li>\n</ul>\n<ul><li>Добавляйте умеренное количество смайлов</li>\n</ul>\n<ul><li>Разбивайте текст на списки и абзацы</li>\n</ul>\n<ul><li>Используйте форматирование текста (жирный, курсив и тд)</li>\n</ul>\n---", "level": 4}, {"title": "Разбор кейса: ошибки в переписке после отправки КП", "html": "<p>КАСАНИЕ №1:</p>\n<ul><li><strong>1.</strong> Сразу видна небрежность в оформлении (пропущена запятая).</li>\n</ul>\n<ul><li><strong>2.</strong> Менеджер не представился. Элементарный этикет нарушен.</li>\n</ul>\n<ul><li><strong>3.</strong> Менеджер не показал, что КП адаптировано под ситуацию клиента. Нет тезисов того, что обсуждали по телефону.</li>\n</ul>\n<ul><li><strong>4.</strong> Заголовок КП в файле (виден даже здесь) – «Коммерческое предложение». Это не продающий заголовок.</li>\n</ul>\n<ul><li><strong>5.</strong> Менеджер не использует вовлекающий вопрос для вовлечения клиента в переписку.</li>\n</ul>\n<ul><li><strong>6.</strong> Нет призыва к действию, закрытия на следующий шаг.</li>\n</ul>\nКАСАНИЕ №2\n<ul><li><strong>7.</strong> И снова небрежность в оформлении (пропущены запятые).</li>\n</ul>\n<ul><li><strong>8.</strong> Стиль общения не профессиональный («может вопросы будут»).</li>\n</ul>\n<ul><li><strong>9.</strong> Не добавляет ценность в касание клиента.</li>\n</ul>\n---\n<hr>", "level": 4}]}, {"id": 15, "part": "ЧАСТЬ IV. ПОСТРОЕНИЕ И УПРАВЛЕНИЕ ОТДЕЛОМ ПРОДАЖ", "partIdx": 3, "title": "Глава 15. Диагностика: ошибки в отделе продаж", "bodyHtml": "", "sections": [{"title": "10 грубых ошибок в отделе продаж", "html": "<ul><li><strong>1.</strong> Слабая и не продуманная мотивация- Унылая атмосфера в отделе продаж, сотрудники сами не верят в рост, в продукт.</li>\n</ul>\n<ul><li><strong>2.</strong> Нет продающих скриптов и КП - Каждый менеджер изобретает велосипед. Часто, к сожалению, это не дает результата.</li>\n</ul>\n<ul><li><strong>3.</strong> Нет регламентов и структуры - Менеджеры общаются с клиентами по личному телефону или вотсапу, клиентская база системно не ведется.</li>\n</ul>\n<ul><li><strong>4.</strong> Нет стратегии продаж - Нет стратегии развития продаж, позиционирования, отстройки от конкурентов, планов.</li>\n</ul>\n<ul><li><strong>5.</strong> Нет KPI и нормативов окупаемости - Не установлены промежуточные и целевые KPI. Нет расчета нормативов окупаемости для каждого сотрудника.</li>\n</ul>\n<ul><li><strong>6.</strong> Нет воронок продаж - Не выстроены процессы работы с потенциальными и действующими клиентами по этапам воронки продаж.</li>\n</ul>\n7.Слабая автоматизация - Отдел продаж не использует современные технологии, сервисы, CRM систему, чат-ботов и роботов.\n<ul><li><strong>8.</strong> Нет системы подбора и обучения - На подбор уходит много времени, риск ошибки высок. На обучение новичка вы тратите личное время.</li>\n</ul>\n<ul><li><strong>9.</strong> Нет системы кросс-продаж - Менеджеры не умеют предлагать другие продукты и повышать чек. Нет матрицы КП, речевых модулей.</li>\n</ul>\n<ul><li><strong>10.</strong> Нет системной работы с базой - Действующая база клиентов не анализируется, не выделяются сегменты и работа не ведется.</li>\n</ul>\n---", "level": 4}, {"title": "18 дыр в продажах", "html": "<p>Воронка продаж:</p>\n<ul><li><strong>1.</strong> БB — Бардак в воронке: статусы He актуализированы, этапы-отстойники.</li>\n</ul>\n<ul><li><strong>2.</strong> СК — Нет сильного конвертера (КЭВ): продают сразу «в лоб».</li>\n</ul>\n<ul><li><strong>3.</strong> ОСК — Есть конвертер, но нет оффера на него.</li>\n</ul>\n<ul><li><strong>4.</strong> СЛ — Слив входящих лидов на вопросе  «сколько стоит?»</li>\n</ul>\n<ul><li><strong>5.</strong> 3 — Сотни зависших сделок, с которыми никто не работает. Контакт с клиентом:</li>\n</ul>\n<ul><li><strong>6.</strong> ММ — Монолог менеджера: вопросов клиенту не задают.</li>\n</ul>\n<ul><li><strong>7.</strong> НК — Не каждый клиент ваш: время уходит не на тех.</li>\n</ul>\n<ul><li><strong>8.</strong> не ЛПР — Общаемся с TeM, кто решения не принимает.</li>\n</ul>\n<ul><li><strong>9.</strong> Шаблон — Один Ctrl+C/Ctrl+V для всех сегментов клиентов. Команда:</li>\n</ul>\n<ul><li><strong>10.</strong> Я = ОП — Собственник сам тащит 90% продаж.</li>\n</ul>\n<ul><li><strong>11.</strong> НА — Нет адаптации: менеджера учат 3 месяца продавать продукт за $8.</li>\n</ul>\n<ul><li><strong>12.</strong> Нет ответственного за весь план продаж.</li>\n</ul>\n<ul><li><strong>13.</strong> НВ — Нет веры команды в продукт = нет передачи веры клиенту Голова предпринимателя:</li>\n</ul>\n<ul><li><strong>14.</strong> СП — «У меня специфика, это не для нас». «А так можно?» — Низкая насмотренность в продажах. «Продажи — это плохо» — Избегают продаж, ассоциируют с впариванием.</li>\n</ul>\nДД — Нет «денежных дел»: занят, но выручка не растёт. ПВНВ — Переоцениваем внешнее, недооцениваем внутреннее.\n<p>Блок 1. Воронка продаж - Здесь начинаются продажи. И здесь же — больше всего потерь, которые предприниматель часто не видит. № 1 БВ - Бардак в воронке ~Статусы не актуализированы — непонятно, кто на каком этапе. ~Коммуникации в CRM нет: менеджер общается со своего телефона, нечего анализировать. ~ Этапы-отстойники типа «Думает» — где сделки висят с 2015 года. № 2 СК - нет сильного конвертера. ~Сильный конвертер (КЭВ) — этап, на который клиент легко соглашается и который ведёт к продаже.</p>\n<p>Окна — замер. Кружки —&gt; пробное занятие. Курсы -&gt; диагностика. Тренажёры -&gt; showroom ~На первой неделе реалити НИКТО из предпринимателей не назвал свой сильный конвертер точно. «Самый частый ответ — &quot;коммерческое предложение&quot;. КП это слабый конвертер. Не надо просто так отправлять КП». № 3 ОСК - Нет оффера на сильный конвертер. ~«Приходите на пробное» — это НЕ оффер. ~Оффер = упакованная ценность с визуализацией. ~Правило: оффер должен быть таким, чтобы клиент спросил «А сколько это CTOИT?» — а вы отвечаете «Бесплатно» № 4 СЛ - Слив входящих лидов. ~На вопрос «сколько стоит?» — менеджер просто называет цену —&gt; клиент уходит. ~Не задаются вопросы, HET повторных касаний‚ нет сильного конвертера.</p>\n<p>Действие на эту неделю: сделайте тайного покупателя у себя. Напишите, оставьте заявку. Скорее всего, увидите то, о чём даже не догадываетесь. № 5 З - Зависшие сделки. ~Сотни сделок висят на этапе «Отправлено КП» ~Решение: «Формула 100% закрытия сделки» (5 критериев) + 3 простых вопроса Результат: прирост закрытой выручки за 3 недели только за счёт работы с зависшими.</p>\n<p>Блок 2. Контакт с клиентом. - Дыры в коммуникации, из-за которых даже хорошие лиды не доходят до сделки. № 6 ММ- Монолог менеджера. ~Вопросов клиенту He задают — сразу презентация и рассказ о себе. ~Правило: никакой презентации, пока не задано минимум 5 вопросов. ~Подключите ИИ к анализу звонков — посчитайте, сколько вопросов реально задают.</p>\n<p>Техники: СОПРАНО, СПИН, продающие вопросы про опыт клиента — их особенно мало кто задаёт. № 7 НК- Не каждый клиент — ваш клиент. ~Пытаемся продать всем -&gt; теряем время, которое могли бы потратить на перспективных. ~Решение: предварительная диагностика на сильном конвертере.</p>\n<p>Золотое правило: «Мы работаем со всеми клиентами» — это не круто, это сигнал, что система продаж не продумана. № 8 не ЛПР - Общаемся не с тем, кто решает. ~Убеждаем месяцами не того человека. ~Простые вопросы для прояснения: «Расскажите, какие ещё согласования потребуются, чтобы запустить проект?»; «Сориентируйте, как принимается решение о закупке?»; С кем ещё необходимо обсудить наш проект перед запуском?». № 9 - Один шаблон для всех сегментов. ~Ctrl+C/ Ctrl+V — одно и то же сообщение, даже без имени ~Уточняем у клиента вопросы -&gt; отвечаем стандартным КП‚ He обыгрывая ero ответы.</p>\n<p>Сегодня даже ИИ персонализирует — менеджеру не позволительно этого не делать.</p>\n<p>Блок 3. Команда.\\ Для предпринимателей и руководителей — то, что тормозит рост и держит вас в роли «менеджера». № 10. Я=ОП - Собственник = весь отдел продаж. ~Предприниматель сам тащит большую часть продаж. ~Команда вокруг готова брать инициативу — а её не дают.</p>\n<p>Посчитайте сейчас: какая доля продаж компании приходится лично на вас? № 11 НА - Нет адаптации менеджеров. ~Менеджера учат 3 месяца продавать продукт за $8 — и считают это нормой. ~При нормальной системе адаптации цикл обучения = 1-2 недели. ~Возьмите за основу систему «5П» № 12 - Нет ответственного за план продаж. ~ECTb менеджеры, есть план — но никто не отвечает за весь план целиком. ~Не обязательно РОП — может быть старший менеджер.</p>\n<p>Не бойтесь саботажа. Реалити показало: люди отвечают «давайте, я готов». Хотят развиваться. Не додумывайте за команду. № 13. НВ - Нет веры команды в продукт. ~Продажа — это передача вашей веры B продукт клиенту. ~Менеджеры могут говорить «продукт хороший», но внутри не верить — клиент это чувствует по энергии.</p>\n<p>Блок 4. Голова предпринимателя - Самый важный блок. Все остальные дыры часто появляются именно отсюда. № 14 - «У меня специфика» ~«Это всё не про Hac, у нас особенный бизнес» — слышится много лет от каждого. ~Ни один предприниматель не пришёл со словами «у нас BCE стандартное»</p>\n<p>Специфика — это не повод сказать «не для меня». Это повод адаптировать инструменты под себя. № 15 - «А так можно было?» ~Низкая насмотренность в продажах — бизнес построен интуитивно. ~ 1% внимания собственника на продажи рождает столько идей‚ что можно перестроить систему с тем же продуктом и КОМАНДОЙ.</p>\n<p>Когда что-то не продаётся, мы думаем «надо менять продукт». A часто менять надо систему продаж. № 16 - «Продажи — это плохо. Я не продаю, я помогаю» ~Продажа = впаривание, навязывание —&gt; собственник избегает продаж. ~Реальность: продажа — это технология, экспертность и польза клиенту.</p>\n<p>Сколько предпринимателей с хорошим продуктом закрываются со словами «никому не нужно» — просто потому, что не умеют общаться с клиентом. -№ 17 дд - Нет «денежных дел» ~Предприниматель занят 24/7 — но выручка не растёт. ~Денежное мышление: оценивай каждое действие — оно влияет на выручку или нет? ~Денежные» действия: внимание ключевым клиентам, партнёрам‚ правильный контент, рассылки. №18 ПВНВ - Переоцениваем внешнее, недооцениваем внутреннее. ~«Кризис, экономика падает, у клиентов нет денег» — внешнее, на которое мы не влияем. ~Внутри — 17 дыр, которые мы можем закрыть сами и которые держат вашу выручку.</p>\n<p>Главный вывод КОНСПЕКТА: не вините кризис, пока эти 18 дыр в системе продаж не закрыты.</p>\n<hr>\n<hr>", "level": 4}]}, {"id": 16, "part": "ЧАСТЬ IV. ПОСТРОЕНИЕ И УПРАВЛЕНИЕ ОТДЕЛОМ ПРОДАЖ", "partIdx": 3, "title": "Глава 16. Структура и управление отделом продаж", "bodyHtml": "", "sections": [{"title": "Пример структуры отдела продаж", "html": "<p>Руководитель отдела продаж. ЦКП - выполненный отделом продаж план по целевым и промежуточным КРІ - Прописываем план РОПа (в том числе личные продажи).</p>\n<ul><li><strong>1.</strong> Колл-менеджер (квалификатор). удаленно. ЦКП - квалифицированные лиды и переданные в отдела продаж лиды (с заполнением нужных полей в CRM)</li>\n</ul>\n4 сотрудника.\n<p>План на 1 сотрудника - КРІ 1 &quot;Кол-во обработанных лидов&quot; 400. КРІ 2&quot; Кол-во переданных лидов&quot; 80.</p>\n<p>План на всех сотрудников -КРІ 1 &quot;Кол-во обработанных лидов&quot; 1600. КРІ 2 &quot; Кол-во переданных лидов&quot; 320.</p>\n<ul><li><strong>2.</strong> Менеджер по продажам (эксперт). в офисе. ЦКП - успешно закрытые сделки, выполнение плана продаж.</li>\n</ul>\n2 сотрудника.\n<p>План на 1 сотрудника - КРІ 1 &quot;Кол-во обработанных 160 заявок». КРІ 2 &quot;Сумма продаж 5000000».</p>\n<p>План на всех сотрудников КРІ 1 &quot;Кол-во обработанных 320 заявок». КРІ 2 &quot;Сумма продаж&quot; 10000000.</p>\n<ul><li><strong>3.</strong> Ассистент менеджера. в офисе. ЦКП - подготовленные качественно и в срок документы (договоры, КП, расчеты).</li>\n</ul>\n1 сотрудник.\n<p>План на 1 сотрудника - КРІ 1 &quot;Кол-во подготовленных документов 40». КРІ 2 &quot;Сумма продаж 4000000».</p>\n<p>План на всех сотрудников - КРІ 1 &quot;Кол-во подготовленных документов 40». КРІ 2 &quot;Сумма продаж 4000000».</p>\n<ul><li><strong>4.</strong> Аккаунт-менеджер (сопровождение). удаленно. ЦКП - повторные продажи действующим клиентами, поддержание выского NPS.</li>\n</ul>\n1 сотрудник.\n<p>План на 1 сотрудника - КРІ 1 «АКБ 80 ». КРІ 2 &quot;Сумма продаж 1000000».</p>\n<p>План на всех сотрудников - КРІ 1 «АКБ 80 ». КРІ 2 &quot;Сумма продаж 1000000».</p>\n<p>Сумма продаж 15000000.</p>\n<hr>", "level": 4}, {"title": "Контроль РОПа: система из 4 элементов", "html": "<p>Ошибки при работе с РОПом:</p>\n<ul><li><strong>1.</strong> нет системы, в которой должен работать РОП(часто систему поручают создать РОПу)</li>\n</ul>\n1.1.нет согласованных KPI и задач.\n<p>1.2. не определены формы контроля, отчетности и периодичность.</p>\n<p>1.3. контроль излишне сильный, эмоциональный, а результатов нет.</p>\n<p>1.4. нет оперативной информации у ВБ. Все нужно выгружать РОПу под запрос.</p>\n<p>1.5. нет возможности проверить данные РОПа (особенно в части промежуточных KPI).</p>\n<ul><li><strong>2.</strong> есть лишь один источник поступления информации владельцу бизнеса – сам РОП.</li>\n</ul>\n<ul><li><strong>3.</strong> нет строгости в работе с РОПом (например, нет ответственности за регулярное невыполнение плана и KPI)</li>\n</ul>\n<ul><li><strong>2.</strong> Система из 4 элементов для контроля РОПа:</li>\n</ul>\n<ul><li><strong>1.</strong> конкретные цели и KPI (срок, результат, прогноз) - все прозрачно (удобные отчеты, адаптированные для владельца бизнеса)</li>\n</ul>\n<ul><li><strong>2.</strong> единое пространство для учета всех активностей РОПа.</li>\n</ul>\n2.1. планерки – записи на портал.\n<p>2.2. отчеты – выгрузки на портал.</p>\n<p>2.3. проанализированные звонки – записи на портале.</p>\n<ul><li><strong>3.</strong> система планерок (периодичность, формат)</li>\n</ul>\n<ul><li><strong>4.</strong> независимая оценка работы РОПа.</li>\n</ul>\n4.1. ОКК (не подчиняется РОПу)\n<p>4.2. внешний консультант, который действует в интересах владельца бизнеса</p>\n<p>4.3. обратная связь от клиентов (замер NPS, автоматизация для ВБ)</p>\n<p>4.4 личное участие владельца бизнеса (контроль в срм и тд)</p>\n<hr>\n<hr>", "level": 4}]}, {"id": 17, "part": "ЧАСТЬ IV. ПОСТРОЕНИЕ И УПРАВЛЕНИЕ ОТДЕЛОМ ПРОДАЖ", "partIdx": 3, "title": "Глава 17. Памятка новичку в продажах", "bodyHtml": "<p>Сформируйте правильное отношение!</p>\n<ul><li><strong>1.</strong> Продажи – это не унизительно!</li>\n</ul>\nЭто общение с клиентом на равных. Это умение выстроить систему личных продаж и донести ценность вашего предложения до клиента. Это благодарные клиенты, которые покупают снова и снова!\n<ul><li><strong>2.</strong> Продажи – это не дар. Это технологии!</li>\n</ul>\nЛюбые навыки можно развивать путем повторений, тренировок. Изучайте разные подходы, технологии продаж, адаптируйте под свою ситуацию, и вы получите результат!\n<ul><li><strong>3.</strong> Продажи – это не впаривание, навязывание или обман!</li>\n</ul>\nБудьте более внимательны к клиентам, задавайте больше вопросов, ищите целевых клиентов, которые будут ценить работу с вами и ваши продукты / услуги. Не предлагайте всем подряд, не наделяйте продукт несуществующими характеристиками ради закрытия сделки. Будьте честными, прокачивайте экспертность.\n<p>1</p>\n<p>Сначала – количество.Потом – качество!</p>\n<ul><li>Делайте больше попыток на старте,</li>\n</ul>\n<ul><li>Не бойтесь ошибок и отказов,</li>\n</ul>\n<ul><li>Работайте с показателями, считайте свою конверсию!</li>\n</ul>\nТест, тест, и еще раз тест!\n<ul><li>Нет 100% технологий и приемов,</li>\n</ul>\n<ul><li>Бесконечно тестируйте разные, выбирайте лучшие. И снова тестируйте!</li>\n</ul>\nСистемное развитие по плану\n<ul><li>Не останавливайтесь в развитии!</li>\n</ul>\n<ul><li>Составьте план прокачки навыков,</li>\n</ul>\n<ul><li>Используйте систему.</li>\n</ul>\n---\n<hr>", "sections": []}, {"id": 18, "part": "ЧАСТЬ V. ПРАКТИЧЕСКИЕ ИНСТРУМЕНТЫ", "partIdx": 4, "title": "Глава 18. Рабочая тетрадь и чек-листы", "bodyHtml": "", "sections": [{"title": "20 рекомендаций по итогам разборов", "html": "<p>РАБОТА С ВОЗРАЖЕНИЯМИ И ДОВЕРИЕМ</p>\n<ul><li><strong>1.</strong> Не спорьте с возражением — присоединяйтесь (Клиент говорит «сейчас не время» — согласитесь с его логикой, а затем поверните её в свою пользу. Спор включает защиту, присоединение открывает диалог.)</li>\n</ul>\n<ul><li><strong>2.</strong> Проверяйте сделку по формуле 100% закрытия (Пять критериев: финансовая возможность, осознанная потребность, доверие, выход на ЛПР, причина действовать сейчас. Не закрыт хоть один — сделка сорвётся.)</li>\n</ul>\n<ul><li><strong>3.</strong> Зашейте формулу в CRM отдельными полями (Пока менеджер не заполнит оценку по каждому критерию — сделка не двигается по этапу. Хаотичный процесс становится управляемым.)</li>\n</ul>\n<ul><li><strong>4.</strong> Считайте доверие по составляющим (Доверие = экспертность + эмпатия + честность + общее. Не хватает — работайте адресно: кейсы, гарантии, отзывы, рекомендации.)</li>\n</ul>\n<ul><li><strong>5.</strong> Давайте гарантии там, где можете (Самый быстрый способ поднять доверие, когда клиент сомневается в результате, а не в цене.)</li>\n</ul>\nОФФЕР И ПЕРВЫЕ ПРОДАЖИ\n<ul><li><strong>6.</strong> Продавайте эффект в деньгах, а не функцию (Клиенту не нужно «приложение» или «материал» — нужен рост выручки, возврат клиентов, снижение издержек. Переведите свойства в деньги клиента.)</li>\n</ul>\n<ul><li><strong>7.</strong> Нет кейсов — сделайте первый бесплатно (Выберите целевого клиента и дайте результат бесплатно. Один твёрдый упакованный кейс откроет двери ко всем остальным.)</li>\n</ul>\n<ul><li><strong>8.</strong> Не держитесь за входной порог на старте (Высокая цена без кейсов тормозит продажи. Сначала результат и доказательство, потом цена.)</li>\n</ul>\n<ul><li><strong>9.</strong> Провоцируйте возражение по цене сами (Клиент молчит про цену — не значит, что всё устраивает. Вскройте возражение, пока можете на него ответить.)10. Спрашивайте оценку от 0 до 10 после оффера (Озвучили предложение — попросите оценить и зафиксируйте в CRM. Не 10 — уточните, чего не хватает. Так вскрывается реальная причина отказа.)</li>\n</ul>\nДОЛГИЕ B2B-СДЕЛКИ\n<ul><li><strong>11.</strong> Составьте список болей клиента до встречи (Выпишите, что может болеть в работе с текущим поставщиком. Не додумывайте на встрече — приходите с гипотезами и проверяйте вопросами.)</li>\n</ul>\n<ul><li><strong>12.</strong> Стройте доверие лично к себе (В долгих сделках решение принимают о человеке. Клиент должен видеть эксперта, понимающего его рынок, а не менеджера с прайсом.)</li>\n</ul>\n<ul><li><strong>13.</strong> Делайте касания полезными, а не напоминающими (Вместо «ну что, подумали?» — присылайте то, что интересно клиенту: аналитику рынка, решения его задач, контакты.)</li>\n</ul>\n<ul><li><strong>14.</strong> Обучайте клиента — и не придётся продавать (Объясните, как устроен рынок и на что смотреть при выборе, — клиент сам придёт к нужному решению.)</li>\n</ul>\n<ul><li><strong>15.</strong> Отстраивайтесь через то, чего боится клиент (На рынке с обманом ваша честность — инструмент продаж. Дайте критерии, по которым клиент отличит добросовестного поставщика.)</li>\n</ul>\nХОЛОДНЫЕ ЗАХОДЫ И ВЫХОД НА ЛПР\n<ul><li><strong>16.</strong> Секретарю давайте корректное мини-поручение (Спокойная уверенная фраза без оправдательной интонации проходит фильтр. Тон и подача решают больше, чем текст.)</li>\n</ul>\n<ul><li><strong>17.</strong> Не обманывайте при проходе секретаря (Работать можно честно. Обман в первом контакте закладывает недоверие во всю дальнейшую сделку.)</li>\n</ul>\n<ul><li><strong>18.</strong> Начинайте разговор с вовлекающего вопроса (Не вываливайте презентацию сразу. Вопрос — ответ — присоединение, и только потом предложение.)</li>\n</ul>\n---", "level": 4}, {"title": "Как улучшить продажи за 5 минут: главные действия", "html": "<ul><li><strong>1.</strong> Начните делать больше активностей. Активность х2.</li>\n</ul>\n1.1. измерьте активности сейчас: звонки, встречи, отправленные КП. Период - 1 день, не неделя и не месяц.\n<p>1.2. Оцените, на сколько вы можете повысить активность? На 10-20% или в 2 раза?</p>\n<p>1.3 Поставьте новые планы по активностям на видное место (визуал). Пусть это будет для вас &quot;челлендж».</p>\n<ul><li><strong>2.</strong> Более глубокая проработка каждого контакта.</li>\n</ul>\n2.1 сколько сейчас сделок в работе?\n<p>2.2 работайте с &quot;потерями&quot; на каждом этапе воронки продаж: почему клиент не купил? Что вы могли бы сделать дополнительно, чтобы повысить шансы на успешную сделку? (проанализируйте минимум 10 сделок по формуле 100% сделки)</p>\n<p>2.3. сколько касаний вы делаете по некупившим клиентам? Обычно 2-4 касания. План - минимум 7, лучше 15-20 ( для кризисных ситуаций)</p>\n<ul><li><strong>3.</strong> Разбудите спящих клиентов.</li>\n</ul>\n3.1. сколько клиентов у вас &quot;спят&quot;? То есть покупали когда-то, но по каким-то причинам перестали это делать. 3.2. проанализируйте базу спящих клиентов. Желательно сделать ABCXYZ анализ и запланировать мероприятия по сегментам.\n<p>3.3 придумайте предложение, сценарий разговора с такими клиентами.</p>\n<p>3.4. поставьте отдельный план по количеству контактов со спящими клиентами. Например, за эту неделю связаться с 50 клиентами</p>\n<ul><li><strong>4.</strong> Предлагайте больше каждого клиенту.</li>\n</ul>\n4.1. Проанализируйте продажи за последний месяц / квартал. Сколько продуктов в среднем покупают у вас клиенты? 4.2. Что вы могли бы предложить дополнительно вашим клиентам? Что им могло бы быть полезно?\n<ul><li>4.3. Проработайте upsell, cross-sale.</li>\n</ul>\n<ul><li><strong>5.</strong> Создайте супермощный оффер.</li>\n</ul>\n5.1. Мощный оффер = 50% успеха.\n<p>5.2. Напишите, какой оффер используете сейчас?</p>\n<p>5.3. Как вы могли бы усилить оффер? (бонусы;скидки (адекватные); отраслевое решение; антикризисное решение; быстрый эффект для клиента; доп. гарантии).</p>\n<hr>", "level": 4}, {"title": "Рабочая тетрадь «12 навыков» (часть 1)", "html": "<p>===================================================== --- РАЗДЕЛ 1: САМОАНАЛИЗ: 12 НАВЫКОВ ЛИЧНЫХ ПРОДАЖ</p>\n<ul><li><strong>1.</strong> Навык самоорганизации Описание: У вас есть четкое понимание, как организовать и планировать свой рост в продажах. Вы грамотно определили цели и провели декомпозицию, внедрили системные инструменты для достижения целей. 1 балл: После рабочего дня выжат как лимон 10 баллов: Чувствую полное удовлетворение раб. днем Оценка: ___</li>\n</ul>\n<ul><li><strong>2.</strong> Навык эмоционального настроя Описание: Вы проработали свои страхи в продажах, научились с помощью специальных приемов быть в нужном эмоциональном состоянии, овладели техниками реагирования на сложности и изменения. Вы чувствуете прилив сил и желание развиваться в области продаж, готовы продавать больше! 1 балл: Продажи это не мое, это стресс 10 баллов: Горжусь профессией, кайфую от процесса Оценка: ___</li>\n</ul>\n<ul><li><strong>3.</strong> Навык быстрого внедрения Описание: У вас есть система быстрого внедрения новых инструментов. Вы открыты новому и действуете быстрее конкурентов. Передовые инструменты продаж работают на вас. 1 балл: Редко внедряю что-то новое 10 баллов: Минимум раз в неделю тестирую новинки Оценка: ___</li>\n</ul>\n<ul><li><strong>4.</strong> Навык анализа и самоанализа Описание: Вы можете адекватно и объективно оценить текущую ситуацию, поведение клиента, статус сделки, свои реакции и эмоции. Это поможет принимать правильные решения и в разы ускорит ваш рост. 1 балл: Ну, вроде я нормально продаю, а что не так? 10 баллов: Слушаю свои звонки, знаю слабые стороны Оценка: ___</li>\n</ul>\n<ul><li><strong>5.</strong> Навык поиска клиентов Описание: Вы выстроили систему поиска новых клиентов, прокачали навыки нетворкинга и овладели приемами для выхода на ЛПР в компаниях разного уровня. 1 балл: Если клиенты сами придут, я буду рад 10 баллов: Обхожу секретарей, выхожу на ЛПР, регулярно знакомлюсь с потенциальными клиентами на мероприятиях, в соцсетях Оценка: ___</li>\n</ul>\n<ul><li><strong>6.</strong> Навык формирования доверия Описание: Вы применяете формулу доверия, понимаете, что именно нужно сделать, чтобы доверие клиента к вам было максимальным. Вы научились демонстрировать экспертность и выделяться этим на фоне конкурентов. Больше доверия к вам — больше продаж!</li>\n</ul>\nФормула доверия: Д = Э + Э + Ч + О\n<ul><li>Э — Эмпатия: Чувствует ли клиент, что вы ему сопереживаете?</li>\n</ul>\n<ul><li>Э — Экспертность: Видят ли клиенты в вас эксперта в своем деле?</li>\n</ul>\n<ul><li>Ч — Честность: Клиенты уверены, что вы честны с ними?</li>\n</ul>\n<ul><li>О — Общее: Чувствуют ли клиенты, что у вас есть «что-то общее»? Оцените себя (1–10) по каждой букве формулы, средний балл перенесите в графу «оценка».</li>\n</ul>\nОценка: ___\n<ul><li><strong>7.</strong> Навык прояснения ситуации Описание: У вас есть конкретная подборка вопросов для продаж. Вы умеете прояснять ситуацию клиента наиболее полно. Четко распознаете потребности клиента. Владеете техниками активного слушания и умеете задавать продающие вопросы. 1 балл: Больше говорю, чем слушаю 10 баллов: Умею делать так, чтобы клиент рассказывал о том, что для него важно Оценка: ___</li>\n</ul>\n<ul><li><strong>8.</strong> Навык презентации решения Описание: Вы научились презентовать решение таким образом, что у клиента сразу возникает желание действовать. Прокачали убедительность, и теперь ваши презентации стали продающими. 1 балл: Рассказываю обо всех преимуществах нашего продукта 10 баллов: Не начинаю презентацию, пока не проясню ситуацию клиента. Презентую решение на примере конкретной ситуации клиента Оценка: ___</li>\n</ul>\n<ul><li><strong>9.</strong> Навык отработки возражений Описание: Вы грамотно реагируете на любые возражения, применяете авторские техники отработки возражений, можете легко аргументировать свою позицию и убедить клиента. Меньше возражений — больше закрытых сделок! 1 балл: Боюсь возражений, это отказы… 10 баллов: Отвечаю на возражения еще до возникновения Оценка: ___</li>\n</ul>\n<ul><li><strong>10.</strong> Навык кросс-продаж Описание: Вы знаете разные технологии увеличения среднего чека и можете красиво, максимально адекватно перейти от продажи основного продукта к дополнительному. Вы увеличили свой средний чек. 1 балл: Не делаю кросс-продажи вообще 10 баллов: Есть кросс-матрица, фразы, вопросы-переходы Оценка: ___</li>\n</ul>\n<ul><li><strong>11.</strong> Навык закрытия сделки Описание: Вы научились важнейшему навыку в продажах — навыку закрытия сделок. Вы четко понимаете, как работать с зависшими клиентами, используете более 40 техник закрытия сделок. 1 балл: Клиенты покупают как созреют 10 баллов: Улавливаю сигналы готовности и закрываю Оценка: ___</li>\n</ul>\n<ul><li><strong>12.</strong> Навык развития отношений с клиентами Описание: У вас есть четкий план работы с клиентом после того, как он купил. Вы знаете, как развивать и поддерживать отношения, чтобы клиент возвращался к вам и рекомендовал вас. 1 балл: После продажи забываю о клиентах 10 баллов: После продажи моя воронка только начинается!</li>\n</ul>\nОценка: ___ ---  ИДЕИ НА ВНЕДРЕНИЕ ---\n<ul><li><strong>1.</strong> Навык самоорганизации ☐ Поставить цель (точки А и Б) ☐ Провести декомпозицию цели ☐ Составить и вести карту дня ☐ Составить матрицу приоритетов ☐ Подобрать новые сервисы для организации работы (mindmap, CRM, notion, мессенджеры, таймтрекер)</li>\n</ul>\n<ul><li><strong>2.</strong> Навык эмоционального настроя ☐ Изучить «правило 4 секунд» для эмоциональной реакции ☐ Понять свои мотиваторы и настраиваться с их помощью на работу ☐ Изучить способы работы с выгоранием ☐ Создать «место силы» (собрать в одном месте то, что вас заряжает: награды, отзывы, чеки сделок, фотографии) и время от времени заглядывать в него</li>\n</ul>\n<ul><li><strong>3.</strong> Навык быстрого внедрения ☐ Протестировать 4 новых IT-сервиса на ваш выбор ☐ Базово настроить CRM для ведения базы (если ее еще нет) ☐ Настроить запись звонков для самоанализа</li>\n</ul>\n<ul><li><strong>4.</strong> Навык анализа и самоанализа ☐ Регулярно делать выводы из записей звонков ☐ Проанализировать базу по ABCXYZ ☐ Адекватно оценить свои навыки продаж</li>\n</ul>\n<ul><li><strong>5.</strong> Навык поиска новых клиентов ☐ Изучить техники обхода секретаря (на канале) ☐ Посетить мероприятия, где могут собираться потенциальные клиенты ☐ Провести личную упаковку (соцсети, письма, одежда и т.д.) ☐ Написать 10 потенциальным клиентам в соцсетях</li>\n</ul>\n<ul><li><strong>6.</strong> Навык формирования доверия, экспертность ☐ Проанализировать свои звонки по формуле ЭЭЧО ☐ Изучить продукт и рынок, в котором вы работаете, чтобы в дальнейшем помогать клиентам с выбором, давать советы, демонстрируя опыт, экспертность</li>\n</ul>\n<ul><li><strong>7.</strong> Навык прояснения ситуации — идеи: ☐ Еще до встречи собирайте максимум информации ☐ Изучите техники СПИН, СОПРАНО ☐ Изучите прием «активное слушание»</li>\n</ul>\n<ul><li><strong>8.</strong> Навык презентации решения — идеи: ☐ Изучить подстройки по психотипу «DISC» ☐ Изучить формулу ФХВЭ ☐ Найти усилители презентации ☐ В презентации говорить о возможных возражениях, страхах клиента и развеивать их</li>\n</ul>\n<ul><li><strong>9.</strong> Навык обработки возражений — идеи: ☐ Изучить алгоритм «НЕ СПОРЬ» ☐ Составить банк возражений (частые возражения + стратегии + речевые заготовки ответов) ☐ Изучить сборник «165 готовых ответов на возражения»</li>\n</ul>\n<ul><li><strong>10.</strong> Навык кросс-продаж — идеи: ☐ Составить матрицу кросс-продаж ☐ Относиться к кросс-продажам как к полезному для клиента действию (а не впариванию) ☐ Подготовить вопросы для перехода от основного продукта к дополнительному</li>\n</ul>\n<ul><li><strong>11.</strong> Навык закрытия сделки — идеи: ☐ Изучить формулу 100% закрытия сделки ☐ Использовать техники продаж, а не пытаться закрыть случайным образом</li>\n</ul>\n<ul><li><strong>12.</strong> Навык развития отношений — идеи: ☐ Построить алгоритм, какие шаги вы будете пред function renderList() {
  const totalSec = DATA.reduce((s,c) => s + c.sections.length, 0);
  let filtered = DATA;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = DATA.filter(ch => ch.title.toLowerCase().includes(q) || ch.sections.some(s => s.title.toLowerCase().includes(q)));
  }
  let h = `
    <div class="header">
      <h1>Система продаж Прайм</h1>
      <p>Полная база знаний — ${DATA.length} глав, ${totalSec} разделов</p>
    </div>
    ${renderTabs()}
    <div class="search-box">
      <input type="text" placeholder="Поиск по главам и разделам..." value="${searchQuery}" oninput="onSearch(this.value)">
    </div>
    <div class="content">`;
  
  const grouped = {};
  filtered.forEach(ch => { if(!grouped[ch.part]) grouped[ch.part]=[]; grouped[ch.part].push(ch); });
  
  for (const [pt, chs] of Object.entries(grouped)) {
    h += `<div class="part-card"><div class="part-title">${pt}</div>`;
    chs.forEach(ch => {
      const num = ch.title.match(/Глава (\d+)/)?.[1] || '';
      const title = ch.title.replace(/^Глава \d+\.\s*/, '');
      h += `<div class="ch-card" onclick="openChapter(${ch.id})">
        <span class="ch-num">${num}</span>
        <span class="ch-title">${title}</span>
        <span class="ch-count">${ch.sections.length} разд.</span>
        <span class="arrow">›</span>
      </div>`;
    });
    h += `</div>`;
  }
  h += `</div>`;
  app.innerHTML = h;
}

      <div style="text-align:center;margin-bottom:20px;">
        <span style="color:var(--accent);cursor:pointer;font-size:13px;" onclick="toggleIntro()">Развернуть текст главы ▼</span>
      </div>`;
  }
  
  if (ch.sections.length) {
    h += `<div style="font-size:13px;color:var(--text2);margin-bottom:12px;">${ch.sections.length} разделов:</div>`;
    ch.sections.forEach((s, idx) => {
      h += `<div class="sec-card ${s.level===4?'level-4':''}" onclick="openSection(${idx})">
        <span class="sec-dot"></span><span class="sec-title">${s.title}</span><span class="arrow">›</span>
      </div>`;
    });
  }
  h += `</div>`;
  app.innerHTML = h;
  window.scrollTo(0,0);
}

function renderSection() {
  const ch = currentChapter, s = currentSection;
  const idx = ch.sections.indexOf(s);
  let h = `
    <div class="breadcrumb">
      <span onclick="goHome()">Главная</span><span class="sep">›</span>
      <span onclick="openChapter(${ch.id})">${ch.title}</span><span class="sep">›</span>
      <span class="current">${s.title.substring(0,50)}${s.title.length>50?'…':''}</span>
    </div>
    <div class="content">
      <div class="back-btn" onclick="openChapter(${ch.id})">← ${ch.title}</div>
      <h2 style="margin-bottom:20px;font-size:18px;">${s.title}</h2>
      <div class="text-content">${s.html || '<p style="color:var(--text2)">Содержание в основном тексте главы.</p>'}</div>
      <div style="display:flex;justify-content:space-between;margin-top:24px;">`;
  if (idx > 0) h += `<span class="back-btn" onclick="openSection(${idx-1})">← Пред.</span>`;
  else h += `<span></span>`;
  if (idx < ch.sections.length-1) h += `<span class="back-btn" onclick="openSection(${idx+1})">След. →</span>`;
  h += `</div></div>`;
  app.innerHTML = h;
  window.scrollTo(0,0);
}

function goHome() { view='home'; currentChapter=null; currentSection=null; render(); }
function openChapter(id) { currentChapter=DATA.find(c=>c.id===id); view='chapter'; currentSection=null; render(); }
function openSection(idx) { currentSection=currentChapter.sections[idx]; view='section'; render(); }
function switchTab(t) { activeTab=t; view='home'; render(); }
function toggleIntro() { const e=document.getElementById('chIntro'); if(e) e.classList.toggle('expanded'); }
function onSearch(v) { searchQuery=v; render(); }
document.addEventListener('keydown', e => {
  if(e.key==='Escape') { if(view==='section') openChapter(currentChapter.id); else if(view==='chapter') goHome(); }
});

render();
</script>
</body>
</html>
