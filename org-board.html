<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оргсхема · Prime Era</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/pe-core.css?v=202610010244">
<script src="assets/pe-core.js?v=202610010244" data-module="org-board"></script>
<link rel="stylesheet" href="assets/fonts.css?v=202610010244">
<style>
:root{
  color-scheme:light;
  --bg:#eceef4; --paper:#ffffff; --ink:#1b2030; --soft:#596075; --faint:#8a90a3; --line:#dde0e9;
  --accent:#2d4fd6; --accent-soft:#e6ebfd; --danger:#b3261e; --ok:#1f7a3a; --wire:#5d6475;
  --display:"Prata", Georgia, "Times New Roman", serif;
  --body:"Onest", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:58px;resize:vertical;line-height:1.4}
input[type=text],input[type=search]{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{font-size:11.5px;padding:3px 8px;border-radius:7px}
.btn[disabled]{opacity:.4;cursor:default}
.topbar{position:sticky;top:0;z-index:30;min-height:48px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .brand{font-family:var(--display);font-size:20px;margin-right:6px;white-space:nowrap}
.topbar .sp{flex:1}
.topbar select{max-width:280px}
.zoomval{font-family:var(--mono);font-size:12px;min-width:46px;text-align:center}
.status{font-size:12px;color:var(--soft)}

/* canvas */
.viewport{position:relative;overflow:hidden;height:calc(100vh - var(--tb,48px));background-color:#f4f5f9;background-image:radial-gradient(#d6d9e3 1px,transparent 1px);background-size:22px 22px;cursor:grab;touch-action:none;user-select:none}
.viewport.panning{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:2}
#wires path{fill:none;stroke:var(--wire);stroke-width:1.6}
.chart{position:relative;display:inline-block;padding:18px 16px 40px}
.chart-title{font-family:var(--display);font-size:46px;text-align:center;margin-bottom:26px;line-height:1.1}
.tn{display:flex;flex-direction:column;align-items:center}
.kids{display:flex;align-items:stretch;gap:14px;position:relative;padding-top:24px}
.kids::before{content:"";position:absolute;top:0;left:50%;height:24px;border-left:1.6px solid var(--wire)}
.kids > .kid{position:relative;padding-top:24px}
.kids > .kid::before{content:"";position:absolute;top:0;left:-7px;right:-7px;border-top:1.6px solid var(--wire)}
.kids > .kid:first-child::before{left:50%}
.kids > .kid:last-child::before{right:50%}
.kids > .kid:only-child::before{display:none}
.kids > .kid::after{content:"";position:absolute;top:0;left:50%;height:24px;border-left:1.6px solid var(--wire)}
.kids > .kid > *{position:relative;z-index:1}
.tn.dv[data-drop]::before{content:"";position:absolute;left:50%;bottom:100%;height:var(--dh,0px);border-left:1.6px solid var(--wire)}
.kids.inner{padding-top:10px;gap:10px}
.kids.inner::before,.kids.inner > .kid::before,.kids.inner > .kid::after{display:none}
.kids.inner > .kid{padding-top:0}
.kid{display:flex;flex-direction:column;align-items:center}
.kid > .tn{flex:1}
.kid > .dcol,.kid > .post.pcol{flex:1}

.box{position:relative;cursor:pointer}
.exec{width:310px;background:var(--b,#fff);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.exec .t{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.exec .s{font-size:11.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.ckpl{font-size:11.8px;line-height:1.45;color:var(--ink)}
.ckpl b{font-weight:800}
.exec .ckpl{color:var(--soft)}

.tn.dv{align-self:stretch}
.col{flex:1;display:flex;flex-direction:column;gap:8px;background:var(--b);border-radius:14px;padding:8px;border:1.5px solid var(--hb,#9aa0b0)}
.col.stacked{width:var(--colw)}
.dhead{position:relative;background:var(--h);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center}
.dhead .corner{position:absolute;left:12px;top:8px;font-family:var(--display);font-size:22px;line-height:1;opacity:.55}
.dhead .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.85}
.dhead .num{font-family:var(--display);font-size:38px;line-height:1}
.dhead .t{font-family:var(--display);font-size:19px;line-height:1.15}
.dhead .s{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.about{font-size:11.8px;line-height:1.5;padding:2px 6px}
.statl{font-size:11.3px;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.7);border:1px dashed rgba(0,0,0,.12)}
.statl ul{margin:2px 0 0;padding-left:16px}
.stack{display:flex;flex-direction:column;gap:8px;flex:1}
.col.split > .kids.inner{flex:1}
.foot{background:var(--h);border-radius:10px;padding:10px 12px;font-size:11.3px;text-transform:uppercase;letter-spacing:.02em;line-height:1.45}
.foot b{font-weight:800}
.tgl{border:0;background:rgba(255,255,255,.65);border-radius:7px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink)}
.tgl:hover{background:#fff}

.dcol{width:var(--colw);display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.07);border-radius:12px;padding:8px}
.kids.top-depts > .kid > .dcol{background:var(--b);border:0}
.dcard{background:var(--paper);border-radius:10px;padding:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dhdr{display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;padding:4px 2px 6px;border-bottom:1px solid rgba(0,0,0,.08)}
.dcard .dhdr{align-items:flex-start;text-align:left;border-bottom:0;padding:0}
.dhdr .row1{display:flex;gap:8px;align-items:baseline}
.dno{font-family:var(--display);font-size:17px;background:var(--h);padding:1px 8px;border-radius:6px;flex:none;line-height:1.3}
.dcol > .dhdr .dno{font-size:20px;background:var(--h);padding:1px 8px}
.dname{font-weight:800;font-size:12.5px;line-height:1.25;text-transform:uppercase;letter-spacing:.02em}
.dsub{font-size:10.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.posts{display:flex;flex-direction:column;gap:2px}
.dcol .foot{margin-top:auto}

.post{border-radius:8px;padding:7px 6px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.post + .post{border-top:1px solid rgba(0,0,0,.08);border-radius:0}
.post:hover{background:rgba(45,79,214,.05)}
.post .pt{font-size:11.2px;text-transform:uppercase;font-weight:800;letter-spacing:.02em;line-height:1.3}
.post .pr{font-size:10.3px;text-transform:uppercase;color:var(--soft);letter-spacing:.04em}
.post .sub{margin-left:12px;padding-left:8px;border-left:2px solid var(--h);display:flex;flex-direction:column;gap:2px;margin-top:2px}
.post.pcol{width:var(--colw);background:var(--paper);border:1px solid var(--line);border-radius:10px}
.addph{border:1px dashed var(--line);border-radius:7px;width:40px;height:26px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);font-size:16px;background:rgba(255,255,255,.6)}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addbtn{border:1px dashed var(--faint);background:rgba(255,255,255,.6);border-radius:8px;padding:4px 8px;font-size:11.5px;cursor:pointer;color:var(--soft)}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}

/* people chips */
.hold{display:flex;flex-direction:column;gap:4px;align-items:inherit}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 2px;font-size:11.8px;font-weight:700;background:var(--paper);border:1px solid var(--line);max-width:100%;text-transform:none;letter-spacing:0}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .tag{font-weight:600;font-size:10.5px;color:var(--soft)}
.av{width:24px;height:24px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;flex:none;background-size:cover;background-position:center}
.chip.vac{border:1.5px dashed #aeb4c4;color:var(--soft);padding:2px 10px}
.chip.pool{border:1.5px dotted #aeb4c4;color:var(--soft);padding:2px 10px}
.chip.out,.chip.held{background:transparent;color:var(--soft);font-weight:600;padding:2px 10px}
.chip.held{border-style:dotted}
.assist{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10.5px;color:var(--soft)}
.assist .chip{font-size:10.8px;padding:1px 8px 1px 1px}
.assist .av{width:18px;height:18px;font-size:8px}

/* selection and drop */
body.edit [data-node]{cursor:pointer}
.sel{outline:2.5px solid var(--accent)!important;outline-offset:2px}
.drop{outline:2.5px dashed var(--ok)!important;outline-offset:2px}

/* below chart */
.below{padding:28px 16px 60px;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.below h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.flow li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:5px solid var(--h)}
.flow .fn{font-family:var(--mono);font-size:11px;color:var(--soft)}
.flow b{font-size:13.5px}
.flow span{font-size:12.5px;color:var(--soft)}

/* drawer */
.drawer{position:fixed;right:0;top:var(--tb,48px);bottom:0;width:min(440px,100vw);background:var(--paper);border-left:1px solid var(--line);z-index:35;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.dr-head{padding:16px 18px;background:var(--h,#eee);display:flex;flex-direction:column;gap:6px;position:sticky;top:0}
.dr-head .ty{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.8}
.dr-head h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.2}
.dr-body{padding:14px 18px 40px;display:flex;flex-direction:column;gap:14px;font-size:13.5px}
.dr-sec h4{margin:0 0 5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.dr-sec ul,.dr-sec ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.dr-sec .main{font-weight:700}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file a{color:var(--accent);font-weight:700;text-decoration:none}
.muted{color:var(--faint);font-size:12.5px}

/* editor layout */
.editor{display:grid;grid-template-columns:300px minmax(0,1fr) 380px;height:calc(100vh - var(--tb,48px))}
.editor .viewport{height:100%}
.left,.right{background:var(--paper);overflow:auto;border-right:1px solid var(--line)}
.right{border-right:0;border-left:1px solid var(--line)}
.ltabs{display:flex;flex-wrap:wrap;gap:2px;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.ltab{border:0;background:transparent;padding:6px 9px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--soft);cursor:pointer}
.ltab[aria-pressed="true"]{background:var(--ink);color:#fff}
.lbody{padding:10px 12px 40px;display:flex;flex-direction:column;gap:8px}
.lgroup{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:800;margin-top:8px;display:flex;gap:6px;align-items:center}
.litem{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:#fafbfd;font-size:12.5px;cursor:grab;user-select:none}
.litem:hover{border-color:var(--faint)}
.litem.on{border-color:var(--accent);background:var(--accent-soft)}
.litem .nm{flex:1;min-width:0}
.sw{width:11px;height:11px;border-radius:3px;flex:none;background:var(--h,#ccc);display:inline-block}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.st1{background:#128a7e}.st2{background:#b7791f}.st3{background:#c2416b}
details.grp > summary{cursor:pointer;font-size:12.5px;font-weight:700;padding:4px 0}
.insp{padding:14px 16px 60px;display:flex;flex-direction:column;gap:12px}
.insp h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--soft);font-weight:600}
.fld > span{display:flex;justify-content:space-between;gap:6px}
.fld small{font-weight:500;color:var(--faint)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec2{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.sec2 > h4{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);display:flex;justify-content:space-between;align-items:center}
.lrow{display:flex;gap:6px;align-items:flex-start}
.lrow > :first-child{flex:1}
.hrow{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fafbfd}
.hrow .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note{font-size:11.5px;color:var(--faint)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.swatch{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;background:var(--h)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.avbig{width:64px;height:64px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}

.modal{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.modal .box2{background:var(--paper);border-radius:16px;padding:18px 20px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.pick{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.pick button{text-align:left;border:1px solid var(--line);background:#fafbfd;border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px}
.pick button:hover{border-color:var(--accent)}

@media (max-width:1100px){.editor{grid-template-columns:250px minmax(0,1fr) 320px}}
@media (max-width:820px){.editor{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}.left,.right{max-height:none}}

/* print */
@media print{
  body{background:#fff}
  body.printing .topbar,body.printing .below,body.printing .drawer,body.printing .left,body.printing .right,body.printing .modal{display:none!important}
  body.printing .editor{display:block;height:auto}
  body.printing .viewport{height:auto;overflow:visible;background:none}
  body.printing .stage{position:relative}
  body.printing .sel,body.printing .drop{outline:none!important}
  body.printing .tgl,body.printing .addbtn,body.printing .addph{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.dul{font-size:11px;line-height:1.4}
.dul ul{margin:2px 0 0;padding-left:15px}
.dcard .dhdr .dul,.dcol .dhdr .dul{text-align:left;align-self:stretch}

.info{background:var(--paper);border:1px solid var(--hb,#9aa0b0);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.info .about{padding:0}
.info .statl,.dcard .statl,.post .statl,.exec .statl{background:transparent;border:0;border-top:1px dashed rgba(0,0,0,.12);border-radius:0;padding:6px 0 0}
.info > :first-child{border-top:0!important;padding-top:0!important}
.dcard .ckpl,.post .ckpl,.dcol > .dhdr ~ .ckpl{background:var(--hl,#f1f2f6);border-radius:7px;padding:5px 8px}
.exec .ckpl{background:#f1f2f6;border-radius:7px;padding:5px 8px}
.tgs{display:inline-flex;gap:4px;flex-wrap:wrap}
.btn.tg.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.exec .statl,.exec .dul{text-align:left;align-self:stretch}

.ntg{display:inline-flex;gap:4px;flex-wrap:wrap;align-self:inherit}
.nb{border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.7);border-radius:999px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--soft);cursor:pointer;line-height:1.6}
.nb:hover{border-color:var(--accent);color:var(--accent)}
.nb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.post .ntg{align-self:flex-start}
.post .ckpl{background:transparent!important;color:var(--soft);padding:0 0 0 8px!important;border-left:2px solid var(--hb,#9aa0b0);border-radius:0!important}
.post .ckpl b{font-weight:700}
.dckp{border-top:1.5px solid var(--hb,#9aa0b0);padding-top:8px;margin-top:2px}
.dgroup{display:flex;flex-direction:column;gap:10px;height:100%}
.dgroup > .dcol{flex:1}
.dgroup > .dcol:not(:last-child){flex:0 0 auto}
.stkrow{display:flex;justify-content:flex-end}
body.view .stkrow{display:none}
.flowbox{margin-top:60px;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:12px}
.flowbox h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.flowbox .flow{grid-template-columns:repeat(5,minmax(0,1fr))}
@media print{.nb,.ntg{display:none!important}}

.exec,.dcard,.dcol,.post{position:relative}
.ntg{position:absolute;top:6px;right:6px;display:flex;gap:3px;z-index:3}
.nb{width:22px;height:22px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.75);color:var(--soft);opacity:.55;cursor:pointer;line-height:1}
.nb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.box:hover .nb,.dcard:hover .nb,.post:hover > .ntg .nb,.nb.on,.nb:focus-visible{opacity:1}
.nb:hover{border-color:var(--accent);color:var(--accent)}
.nb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.post .ntg{top:5px;right:4px}
.post .nb{width:19px;height:19px}.post .nb svg{width:12px;height:12px}
.exec > .t,.dhead > .t,.dhead > .lab{padding-inline:56px}
.post > .pt{padding-right:46px}
.dcard > .dhdr,.dcol > .dhdr{padding-right:60px}
.dcard .kids.inner{padding-top:4px}
.dcard .kids.inner .post.pcol{width:190px}
.stkrow{padding-right:70px}
@media print{.ntg{display:none!important}}

.dcol.dsplit{width:auto;min-width:var(--colw)}
.dsplit > .kids.inner{align-items:stretch}
.dsplit > .kids.inner > .kid > .post.pcol{width:210px;height:100%}
.col.stacked:has(.dcard.dsplit){width:auto;min-width:var(--colw)}

body.pdfing .ntg,body.pdfing .stkrow,body.pdfing .addrow,body.pdfing .addph{display:none!important}
body.pdfing .sel,body.pdfing .drop{outline:none!important}
body.pdfing *{box-shadow:none!important;text-shadow:none!important}

.spick{position:relative}
.spick-btn{min-width:220px;max-width:320px;justify-content:space-between}
.spick-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spick-ar{font-size:11px;color:var(--soft)}
.spick-list{position:absolute;left:0;top:calc(100% + 6px);z-index:50;width:300px;max-height:min(70vh,560px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,24,40,.16);padding:6px;display:flex;flex-direction:column;gap:2px}
.spick-g{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:800;padding:8px 8px 4px}
.spick-o{text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.spick-o:hover{background:var(--bg)}
.spick-o.on{background:var(--accent-soft);color:var(--accent);font-weight:700}

.kids{--kdx:0px}
.kids::before{left:calc(50% + var(--kdx))}
.kids > .kid{--pdx:0px}
.kids > .kid::after{left:calc(50% + var(--pdx))}
.kids > .kid:first-child::before{left:calc(50% + var(--pdx))}
.kids > .kid:last-child::before{right:calc(50% - var(--pdx))}
.kids > .kid.pso::before{display:block;left:var(--pl);right:var(--pr)}

.dcol > .dhdr{align-items:flex-start;text-align:left}
.dcol > .dhdr .row1{align-items:center}
.dcol > .dhdr .hold{align-self:flex-start}

.mk{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 7px;line-height:1.6;vertical-align:middle;white-space:nowrap}
.mk-new{background:#d6f5dd;color:#146c2e;border:1px solid #8fd6a2}
.mk-chg{background:#fff0c7;color:#8a5a00;border:1px solid #efc865}
.exec > .mk,.dhead > .mk{align-self:center}
.post > .mk{align-self:flex-start;margin-bottom:1px}
.dhdr .mk{margin-bottom:2px}
.notesbox{max-width:1100px;margin:0 auto 34px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 22px}
.notesbox h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 8px}
.notesbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45}
.notesbox li{padding-left:2px}
.notesbox li.n-h{font-weight:800;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:6px}

.hidb{border:0;background:transparent;padding:0 2px;margin-left:4px;vertical-align:middle;cursor:pointer;color:var(--faint);opacity:.35;display:inline-flex}
.hidb svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
li:hover > .hidb,b + .hidb:hover,.ckpl:hover > .hidb,.foot:hover > .hidb,.hidb:focus-visible{opacity:1;color:var(--danger)}
body.pdfing .hidb{display:none!important}
@media print{.hidb{display:none!important}}

.visbox{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--paper);cursor:pointer;flex:none}
.visbox input{margin:0;width:15px;height:15px;cursor:pointer}
.lrow.rowoff textarea,.lrow.rowoff input[type=text]{opacity:.45;text-decoration:line-through}
.hrow .lrow{align-items:center}
.kid.offkid > *,.post:has(> .mk-off),.dcard:has(> .dhdr .mk-off){opacity:.45}
.mk-off{background:#eceef3;color:#5a6075;border:1px dashed #9aa0b0}
.nb.off{color:var(--danger);border-color:var(--danger);background:#fff}
body.pdfing .kid.offkid,body.pdfing .mk-off{display:none!important}
@media print{.kid.offkid,.mk-off{display:none!important}}
.offnode{opacity:.45}
body.pdfing .offnode{display:none!important}
@media print{.offnode{display:none!important}}

.visbox{color:var(--accent);padding:0}
.visbox svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.visbox.isoff{color:var(--danger);border-color:var(--danger);background:#fff5f4}
.visbox:hover{border-color:var(--faint)}

.notesbox{position:relative}
.draggable-notes{cursor:grab;outline:1.5px dashed transparent}
.draggable-notes:hover{outline-color:var(--accent)}
.notes-bar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:-6px -8px 4px 0}
.notes-grip{margin-right:auto;font-size:11px;color:var(--soft);font-weight:700;letter-spacing:.04em;cursor:grab;user-select:none}
.notes-bar .visbox{width:26px;height:26px}
.notesbox li .visbox{width:20px;height:20px;border:0;background:transparent;display:inline-flex;vertical-align:middle;margin-left:6px;opacity:.35}
.notesbox li .visbox svg{width:13px;height:13px}
.notesbox li:hover .visbox,.notesbox li .visbox.isoff{opacity:1}
.notesbox li.n-off{opacity:.45;text-decoration:line-through}
.nb-offbox{opacity:.5}
body.pdfing .notes-bar,body.pdfing .notesbox li .visbox{display:none!important}
body.pdfing .notesbox li.n-off,body.pdfing .nb-offbox{display:none!important}
@media print{.notes-bar,.notesbox li .visbox,.notesbox li.n-off,.nb-offbox{display:none!important}}

.cards-top{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:0 auto 34px}
.cards-top > .notesbox{margin:0;flex:0 1 auto;min-width:320px}
.cards-add{position:absolute;right:16px;top:12px}
.notes-bar .visbox[data-act="card-edit"]{font-size:13px;color:var(--soft)}
body.pdfing .cards-add{display:none!important}
@media print{.cards-add{display:none!important}}

.chip.staff{background:#eef1f6;color:#3e4558;padding:2px 10px;border-color:#d6dbe6}


/* ---------- внутри экосистемы: сверху фиксированное меню экосистемы (56px) ---------- */
html.pe2-has-nav body{padding-top:var(--pe-nav-h,0px)}
html.pe2-has-nav .topbar{top:var(--pe-nav-h,0px)}
html.pe2-has-nav .viewport{height:calc(100vh - var(--tb,48px) - var(--pe-nav-h,0px))}
html.pe2-has-nav .editor{height:calc(100vh - var(--tb,48px) - var(--pe-nav-h,0px))}
html.pe2-has-nav .editor .viewport{height:100%}
html.pe2-has-nav .drawer{top:calc(var(--tb,48px) + var(--pe-nav-h,0px))}
@media (max-width:820px){html.pe2-has-nav .editor{height:auto}}
.modal{z-index:950}
.eco-note{font-size:12px;color:var(--soft);line-height:1.45;margin:0}
.ver-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.ver-row .grow{flex:1}
@media print{.pe2-nav{display:none!important}html.pe2-has-nav body{padding-top:0}}

    if(!m&&p.id==="A"&&PE.meta&&PE.meta.ownerUid&&PE.userById(PE.meta.ownerUid))m="u:"+PE.meta.ownerUid;
    if(m)map[p.id]=m;});
  if(!Object.keys(map).length)return;
  function fix(root){walk(root,function(n){(n.holders||[]).forEach(function(h){if(map[h.p])h.p=map[h.p];h.assist=(h.assist||[]).map(function(a){return map[a]||a;});});});}
  st.schemes.forEach(function(sc){fix(sc.root);});
  if(st.pristine)Object.keys(st.pristine).forEach(function(k){if(st.pristine[k]&&st.pristine[k].root)fix(st.pristine[k].root);});
  st.people=st.people.filter(function(p){return !map[p.id];});
}

/* ---------- экосистема: хранение ---------- */
function loadRemote(){
  return Promise.all([PE.fb("GET","orgchart/doc"),PE.fb("GET","orgchart/rev")]).then(function(r){
    var doc=r[0],rev=r[1]||{};
    if(doc&&doc.json){S=JSON.parse(doc.json);baseAt=doc.at||0;lastJson=doc.json;baseBy=doc.by||"";baseByName=rev.byName||"";}
    else{S=defaultState();baseAt=rev.at||0;lastJson=null;}
    remoteReady=true;statusMsg="";
  }).catch(function(){
    S=S||defaultState();remoteReady=false;statusMsg="Нет доступа к базе оргсхемы — показан шаблон";
    if(CAN_EDIT)PE.toast("Оргсхема показана из шаблона: нет доступа к базе (orgchart). Нужно опубликовать правила базы.","err");
  });
}
function dirtyRemote(){return editSeq!==savedSeq;}
/* перед первой записью за сеанс кладём прошлую версию в историю (последние 15) */
function snapshot(){
  snapDone=true;var id="h"+baseAt;
  return PE.fb("PUT","orgchart/hist/"+id,{json:lastJson,at:baseAt,by:baseBy}).then(function(){
    return PE.fb("PUT","orgchart/histIndex/"+id,{at:baseAt,by:baseBy,byName:baseByName,kb:Math.round(lastJson.length/1024)});
  }).then(function(){return PE.fb("GET","orgchart/histIndex");}).then(function(ix){
    ix=ix||{};var keys=Object.keys(ix).sort(function(a,b){return (ix[a].at||0)-(ix[b].at||0);});
    return Promise.all(keys.slice(0,Math.max(0,keys.length-15)).map(function(k){return PE.fb("DELETE","orgchart/hist/"+k).then(function(){return PE.fb("DELETE","orgchart/histIndex/"+k);});}));
  }).catch(function(){});
}
function saveRemote(force){
  if(saving){againSave=true;return;}
  var json=JSON.stringify(S),seq=editSeq;
  if(json.length>9000000){setStatus("Схема слишком большая для базы — уберите крупные файлы");PE.toast("Оргсхема не сохранилась: больше 9 МБ. Уберите крупные файлы.","err");return;}
  saving=true;setStatus("Сохраняю…");
  PE.fb("GET","orgchart/rev").then(function(rev){
    if(!force&&rev&&rev.at&&rev.at!==baseAt){var e=new Error("conflict");e.rev=rev;throw e;}
    return (!snapDone&&lastJson&&lastJson!==json)?snapshot():null;
  }).then(function(){
    var at=Date.now(),u=PE.user||{};
    return PE.fb("PATCH","orgchart",{doc:{json:json,at:at,by:u.id||""},rev:{at:at,by:u.id||"",byName:PE.fullName(u)}}).then(function(){
      baseAt=at;lastJson=json;baseBy=u.id||"";baseByName=PE.fullName(u);savedSeq=seq;
      if(!auditDone){auditDone=true;PE.audit("org.save","orgchart","оргсхема");}
    });
  }).then(function(){
    saving=false;setStatus(dirtyRemote()?"Есть несохранённые правки…":"Сохранено в экосистеме");
    if(againSave){againSave=false;saveRemote(false);}
  },function(e){
    saving=false;againSave=false;
    if(e&&e.message==="conflict"){setStatus("Не сохранено: схему изменил другой человек");conflictModal(e.rev);}
    else{setStatus("Не сохранилось — нет связи или прав. Повторю при следующей правке");PE.toast("Оргсхема не сохранилась: нет связи с базой или прав","err");}
  });
}

  openModal('<h3>Оргсхему только что изменили</h3><p class="note">'+esc(w)+' сохранил(а) свою версию'+(t?" ("+esc(t)+")":"")+'. Ваши последние правки ещё не сохранены — выберите, что делать.</p><div style="display:flex;flex-direction:column;gap:8px">'+
    '<button class="btn" data-act="cf-theirs">Загрузить их версию (мои несохранённые правки пропадут)</button>'+
    '<button class="btn primary" data-act="cf-mine">Сохранить мою версию поверх</button>'+
    '<button class="btn" data-act="export-json">Сначала скачать мою копию (JSON)</button></div>');

function reloadRemote(){

      if(!doc||!doc.json)return false;
      S=JSON.parse(doc.json);baseAt=doc.at||0;lastJson=doc.json;baseBy=doc.by||"";baseByName=(rev&&rev.byName)||"";snapDone=false;savedSeq=editSeq;

function alignDrops(){
  var chart=document.getElementById("chart"),stage=document.getElementById("stage");if(!chart)return;
  var inStage=stage&&stage.contains(chart),prevT=inStage?stage.style.transform:"";if(inStage)stage.style.transform="none";
  var cr=chart.getBoundingClientRect();
  function Y(el){return el.getBoundingClientRect().top-cr.top;}
  function B(el){return el.getBoundingClientRect().bottom-cr.top;}
  var all=[].slice.call(chart.querySelectorAll(".tn.dv"));
  all.forEach(function(d){d.style.minHeight="";if(d.hasAttribute("data-drop")){d.style.marginTop="0px";d.style.setProperty("--dh","0px");}});
  var drops=all.filter(function(d){return d.hasAttribute("data-drop");});
  if(drops.length){
    var heads=all.filter(function(d){return !d.hasAttribute("data-drop");}).map(function(d){var h=d.querySelector(".dhead");return h?Y(h):0;});
    var target=heads.length?Math.max.apply(null,heads):0;
    drops.forEach(function(d){var h=d.querySelector(".dhead");if(!h)return;var t=Y(h);if(target>t){d.style.marginTop=(target-t)+"px";d.style.setProperty("--dh",(target-t)+"px");}});
  }
  chart.querySelectorAll(".kids").forEach(function(k){k.style.minHeight="";});
  var top=all.filter(function(d){return !d.parentElement.closest(".tn.dv");});
  var rows=[];top.forEach(function(d){var k=d.parentElement&&d.parentElement.parentElement;if(k&&k.classList.contains("kids")&&rows.indexOf(k)<0)rows.push(k);});
  for(var it=0;it<3&&rows.length>1;it++){
    var bots=rows.map(function(k){return B(k);}),mb=Math.max.apply(null,bots),done=true;
    rows.forEach(function(k,i){var diff=mb-bots[i];if(diff>0.5){done=false;k.style.minHeight=(k.getBoundingClientRect().height+diff)+"px";}});
    if(done)break;
  }
  if(inStage)stage.style.transform=prevT;
}

/* ---------- binding ---------- */
function resolve(bind){
  var p=bind.split(":"),kind=p[0],id=p[1],rest=p.slice(2),o;
  if(kind==="node"){var f=find(id);o=f&&f.node;}
  else if(kind==="hat") o=S.lib[id];
  else if(kind==="person") o=person(id);
  else if(kind==="scheme") o=schemeById(id);
  else if(kind==="flow") o=FL()[+id];
  else if(kind==="meta") o=S.meta;
  if(!o) return null;
  for(var i=0;i<rest.length-1;i++){if(o[rest[i]]==null)o[rest[i]]=/^\d+$/.test(rest[i+1])?[]:{};o=o[rest[i]];}
  return {obj:o,key:rest[rest.length-1]};
}
function getArr(bind){var r=resolve(bind+":_");if(!r)return null;if(!Array.isArray(r.obj))return null;return r.obj;}
function arrAt(bind){var p=bind.split(":"),key=p.pop(),r=resolve(p.join(":")+":"+key);if(!r)return null;if(!Array.isArray(r.obj[r.key]))r.obj[r.key]=[];return r.obj[r.key];}
var histOnFocus=false;
document.addEventListener("focusin",function(e){if(e.target.matches&&e.target.matches("[data-bind]"))histOnFocus=true;});
function onBind(t){
  var r=resolve(t.getAttribute("data-bind"));if(!r)return;
  if(histOnFocus){pushHist();histOnFocus=false;}
  var v=t.type==="checkbox"?t.checked:t.value;
  if(t.dataset.num) v=parseFloat(v)||0;
  if(r.key==="dept"&&t.tagName==="SELECT") v=(v==="top"||v.charAt(0)==="d")?v:+v;
  if(r.key==="mode"){var hd=r.obj;hd.mode=v;if(v!=="vac"&&v!=="staff")hd.n=1;save();renderInsp();renderChart();return;}
  r.obj[r.key]=v; save();
  if(t.tagName==="SELECT"||t.type==="checkbox"||t.type==="color"){renderChart();if(t.getAttribute("data-bind").indexOf("person:")===0||t.getAttribute("data-bind").indexOf("hat:")===0)renderLeft();}
  else scheduleChart();
  if(t.getAttribute("data-bind").indexOf(":name")>0&&t.getAttribute("data-bind").indexOf("scheme:")===0){var sn=document.querySelector(".spick-nm");if(sn)sn.textContent=sch().name;}
}
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="hatq"){hatQ=t.value;document.getElementById("hatlist").innerHTML=hatListHTML();return;}
  if(t.id==="pickq"){document.getElementById("picklist").innerHTML=pickList(t.value);return;}
  if(t.matches&&t.matches("[data-bind]")&&t.tagName!=="SELECT"&&t.type!=="checkbox") onBind(t);
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="schemeSel"){S.current=t.value;sel=null;selHat=null;selPerson=null;drawerId=null;save();render();setTimeout(fitWidth,30);return;}
  if(t.matches&&t.matches("select[data-bind],input[type=checkbox][data-bind],input[type=color][data-bind]")){onBind(t);return;}
  if(t.dataset&&t.dataset.actChange==="hiderow"){pushHist();var nr=find(t.dataset.id).node;nr.hid=nr.hid||{};var rk=nr.hid[t.dataset.k]=nr.hid[t.dataset.k]||{};rk.i=rk.i||{};if(t.checked)delete rk.i[t.dataset.i];else rk.i[t.dataset.i]=1;save();renderChart();var row=t.closest(".lrow");if(row)row.classList.toggle("rowoff",!t.checked);return;}
  if(t.dataset&&t.dataset.actChange==="offnode"){pushHist();find(t.dataset.id).node.off=!t.checked;save();renderChart();return;}
  if(t.dataset&&t.dataset.actChange==="hidegrp"){pushHist();var nh=find(t.dataset.id).node;nh.hid=nh.hid||{};var gk=nh.hid[t.dataset.k]=nh.hid[t.dataset.k]||{};gk.all=!t.checked;save();renderChart();renderInsp();return;}
  if(t.dataset&&t.dataset.actChange==="drop"){pushHist();find(t.dataset.id).node.lift=t.checked?"drop":0;save();renderChart();renderInsp();return;}
  if(t.dataset&&t.dataset.actChange==="assist-add"&&t.value){pushHist();var n=find(t.dataset.id).node,hd=n.holders[+t.dataset.k];(hd.assist=hd.assist||[]).push(t.value);save();renderInsp();renderChart();return;}
  if(t.dataset&&t.dataset.upload&&t.files&&t.files.length){uploadFiles(t.dataset.upload,t.files);return;}
  if(t.dataset&&t.dataset.photo&&t.files&&t.files[0]){loadPhoto(t.dataset.photo,t.files[0]);return;}
});

/* ---------- files and photos ---------- */
function uploadFiles(bind,files){
  var p=bind.split(":"),target=p[0]==="hat"?S.lib[p[1]]:find(p[1]).node;
  pushHist();target.files=target.files||[];
  var todo=files.length,big=false,skipped=0;
  Array.prototype.forEach.call(files,function(f){
    if(HAS_PE&&f.size>5*1048576){skipped++;if(--todo===0){save();renderInsp();}setStatus("Файл «"+f.name+"» больше 5 МБ — в экосистему не загружен");return;}
    if(f.size>25*1048576) big=true;
    var r=new FileReader();r.onload=function(){var id=uid("f");S.files[id]={name:f.name,type:f.type,size:f.size,data:r.result};target.files.push(id);if(--todo===0){save();renderInsp();setStatus(big?"Файлы прикреплены. Крупные файлы сильно увеличат HTML.":"Файлы прикреплены");}};r.readAsDataURL(f);
  });
}
function loadPhoto(pid,file){
  var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var s=160,c=document.createElement("canvas");c.width=c.height=s;var g=c.getContext("2d");var m=Math.min(img.width,img.height);g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);pushHist();person(pid).photo=c.toDataURL("image/jpeg",0.86);save();render();};img.src=r.result;};r.readAsDataURL(file);
}

var CAN={exec:["exec","div","dept","post"],div:["dept","post"],dept:["post"],post:["post"]};
function place(src,target){
  var tf=find(target);if(!tf)return false;var t=tf.node;
  if(src.type===t.type&&tf.parent){tf.parent.children.splice(tf.index,0,src);return true;}
  if(CAN[t.type].indexOf(src.type)>=0){t.children.push(src);return true;}
  if(tf.parent&&CAN[tf.parent.type].indexOf(src.type)>=0){tf.parent.children.splice(tf.index+1,0,src);return true;}
  return false;
}

    /* поменялись люди экосистемы (имя, фото, новые) — перерисовать */
    PE.onUsers(function(){
      if(!booted)return;var sig=JSON.stringify(ecoPeople());if(sig===peopleSig)return;peopleSig=sig;
      var ce=!!(PE.perm?PE.perm("org_edit"):PE.isAdmin());
      if(ce!==CAN_EDIT){CAN_EDIT=ce;if(!ce&&mode==="edit")mode="view";render();return;}
      renderChart();if(mode==="edit"){renderLeft();if(selPerson&&String(selPerson).indexOf("u:")===0)renderInsp();}
    });
    setInterval(checkRemote,60000);
    window.addEventListener("focus",checkRemote);
    window.addEventListener("beforeunload",function(e){if(saving||dirtyRemote()){e.preventDefault();e.returnValue="";}});
  });
} else dbGet(KEY).then(function(saved){
  S=(saved&&saved.base===EMBED.meta.rev&&saved.state)?saved.state:JSON.parse(EMBED_TEXT);
  if(saved&&saved.base===EMBED.meta.rev) statusMsg="Загружены ваши изменения из этого браузера";
  boot();
});
})();
</script>
