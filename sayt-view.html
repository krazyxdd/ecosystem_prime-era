<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Прототип сайта</title>
<link rel="icon" href="assets/favicon.png">
<style>
html,body{margin:0;height:100%;background:#f6f5f1;color:#1b1b1f;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.msg{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.msg b{display:block;font-size:18px;margin-bottom:6px}
.msg span{color:#5b5b63}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #e4e2dc;border-top-color:#0b6bcb;animation:r .8s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="msg" id="msg"><div><div class="spin"></div><span>Открываю прототип…</span></div></div>
<script>
/* Просмотр прототипа по ссылке из «Редактора сайта»: без входа, только чтение.
   Снимок страницы лежит в базе в ecosystem-v2/sitekonpub/<ключ> кусками c0…c{n-1}.
   Читать можно только по точному ключу из ссылки — списка ссылок база не отдаёт. */
(function(){
  if(/github\.io$/.test(location.hostname)){ location.replace('https://prime-era.website/sayt-view.html'+location.search+location.hash); return; }   /* переехали на свой хостинг */
  var FB=/github\.io$/.test(location.hostname) ? 'https://prime-era-glossary-default-rtdb.firebaseio.com/ecosystem-v2/sitekonpub/'
    : location.href.replace(/[?#].*$/,'').replace(/[^\/]*$/,'')+'api/db/ecosystem-v2/sitekonpub/';   /* на хостинге — своя серверная часть */
  var t=(location.search.match(/[?&]p=([a-z0-9]{8,40})/i)||[])[1];
  function fail(title, text){ document.getElementById('msg').innerHTML='<div><b>'+title+'</b><span>'+text+'</span></div>'; }
  if(!t){ fail('Ссылка неполная','Попросите отправить ссылку на прототип ещё раз.'); return; }
  function show(d){
    if(!d||!d.n){ fail('Прототип не найден','Ссылку отключили или она устарела. Попросите новую.'); return; }
    var html=''; for(var i=0;i<d.n;i++) html+=d['c'+i]||'';
    document.open(); document.write(html); document.close();
  }
  var mock=null; try{ if(localStorage.getItem('pe2_backend')==='mock') mock=JSON.parse(localStorage.getItem('pe2_mockdb')||'{}'); }catch(e){}
  // тестовый режим экосистемы (?pe2=mock); показ — после загрузки, иначе document.open() игнорируется
  if(mock){ var d=mock.sitekonpub&&mock.sitekonpub[t]; setTimeout(function(){ show(d); }, 0); return; }
  fetch(FB+encodeURIComponent(t)+'.json').then(function(r){ if(!r.ok) throw r.status; return r.json(); })
    .then(show, function(){ fail('Не удалось открыть','Проверьте интернет и обновите страницу.'); });
})();
</script>
</body>
</html>
