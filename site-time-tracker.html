<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хронометраж — учёт времени по проектам</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/remote-sync.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#14161a;
  --bg-elev:#1c1f24;
  --bg-elev-2:#22262c;
  --bg-elev-3:#282c33;
  --border:#2c3038;
  --border-soft:#23262c;
  --text:#edeef0;
  --text-dim:#9aa0a8;
  --text-faint:#5f636c;
  --accent:#f2a93b;
  --accent-dim:#8a6a2e;
  --accent-2:#5ecfc0;
  --danger:#e2645a;
  --danger-dim:#4a2b28;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --font-d:'IBM Plex Sans',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,monospace;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-d);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#1a1305;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:14px 28px;border-bottom:1px solid var(--border-soft);
  background:rgba(20,22,26,.9);backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:none;background:none;padding:4px;}
.brand-mark{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:conic-gradient(from 220deg, var(--accent), var(--accent-2), var(--accent));
  position:relative;
}
.brand-mark::after{content:'';position:absolute;inset:4px;background:var(--bg-elev);border-radius:5px;}
.brand-name{font-weight:600;font-size:14.5px;color:var(--text);}

.topbar-spacer{flex:1;}

.rec-pill{
  display:flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:20px;
  background:var(--bg-elev-2);border:1px solid var(--border);cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--text);
  transition:border-color .15s ease;
}
.rec-pill:hover{border-color:var(--text-faint);}
.rec-pill .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.rec-pill .dot.live{animation:pulse 1.6s ease-in-out infinite;}
.rec-pill .time{font-family:var(--font-m);color:var(--text-dim);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.stats-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev-2);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.stats-btn svg{width:17px;height:17px;}
.stats-btn:hover{border-color:var(--text-faint);color:var(--text);}
.stats-btn.active{background:var(--accent);border-color:var(--accent);color:#1c1305;}

/* ---------- views ---------- */
.view{display:none;padding:34px 32px 70px 32px;max-width:1160px;margin:0 auto;}
.view.active{display:block;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:600;margin:0;}
.page-title-sub{color:var(--text-faint);font-size:13px;margin-top:5px;}

.back-link{
  display:inline-flex;align-items:center;gap:6px;color:var(--text-faint);background:none;border:none;
  cursor:pointer;font-size:13px;font-weight:600;padding:6px 2px;margin-bottom:14px;
  transition:color .15s ease;
}
.back-link svg{width:15px;height:15px;}
.back-link:hover{color:var(--text);}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius-s);
  border:1px solid var(--border);background:var(--bg-elev-2);color:var(--text);
  font-size:13.5px;font-weight:600;cursor:pointer;
  transition:transform .1s ease, border-color .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn svg{width:14px;height:14px;}
.btn:hover{border-color:var(--text-faint);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#1c1305;}
.btn-primary:hover{background:#f6b854;border-color:#f6b854;}
.btn-ghost{background:transparent;}
.btn-danger{color:var(--danger);}
.btn-danger:hover{border-color:var(--danger);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg-elev-2);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  transition:border-color .15s ease,color .15s ease;
}
.icon-btn:hover{border-color:var(--text-faint);color:var(--text);}
.icon-btn svg{width:15px;height:15px;}

/* ---------- home / project grid ---------- */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.toolbar .select{margin-left:auto;}
.select{
  background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);
  padding:9px 13px;border-radius:var(--radius-s);font-size:13.5px;font-family:inherit;font-weight:500;
  cursor:pointer;
}

.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}

.pcard{
  background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius-m);
  padding:26px 24px 22px 24px;cursor:pointer;transition:border-color .15s ease, transform .1s ease;
  min-height:172px;display:flex;flex-direction:column;
}
.pcard:hover{border-color:var(--border);transform:translateY(-2px);}
.pcard:active{transform:translateY(0);}
.pcard[draggable="true"]{cursor:grab;}
.pcard.drag-over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.pcard-top{display:flex;align-items:center;gap:11px;margin-bottom:18px;}
.pcard-dot{width:12px;height:12px;border-radius:5px;flex:0 0 auto;}
.pcard-dot.live{animation:pulse 1.6s ease-in-out infinite;}
.pcard-name{font-weight:600;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pcard-time{font-family:var(--font-m);font-size:30px;font-weight:500;margin-bottom:4px;}
.pcard-meta{font-size:12.5px;color:var(--text-faint);margin-bottom:16px;}
.pcard-meta.live-label{color:var(--accent);font-weight:600;}
.pcard .segbar{height:9px;border-radius:5px;margin-top:auto;}

.pcard-add{
  border:2px dashed var(--border);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  color:var(--text-faint);min-height:172px;cursor:pointer;
  transition:border-color .15s ease,color .15s ease;
}
.pcard-add:hover{border-color:var(--accent-dim);color:var(--text);}
.pcard-add .plus-circle{
  width:42px;height:42px;border-radius:50%;background:var(--bg-elev-2);
  display:flex;align-items:center;justify-content:center;
}
.pcard-add .plus-circle svg{width:18px;height:18px;}
.pcard-add span{font-size:13.5px;font-weight:600;}

.empty-state{margin-top:70px;text-align:center;color:var(--text-dim);}
.empty-state h2{font-size:17px;color:var(--text);font-weight:600;margin-bottom:8px;}
.empty-state p{font-size:13.5px;color:var(--text-faint);margin-bottom:22px;}

/* ---------- project view layout ---------- */
.project-head-row{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
.project-head-dot{width:15px;height:15px;border-radius:6px;flex:0 0 auto;}
.project-head-name{font-size:29px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.project-layout{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:start;}
@media (max-width:860px){ .project-layout{grid-template-columns:1fr;} }

.project-side{
  background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius-m);
  padding:18px;position:sticky;top:84px;
}
@media (max-width:860px){ .project-side{position:static;} }
.side-add-stage{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 14px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--bg-elev-2);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;
  transition:border-color .15s ease,transform .1s ease;margin-bottom:16px;
}
.side-add-stage:hover{border-color:var(--text-faint);}
.side-add-stage:active{transform:scale(.98);}
.side-add-stage:disabled{opacity:.4;cursor:not-allowed;}
.side-add-stage svg{width:14px;height:14px;}

.side-label{font-size:11.5px;font-weight:600;color:var(--text-faint);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px;}

.stage-chip-list{display:flex;flex-direction:column;gap:8px;}
.stage-chip{
  background:var(--bg-elev-2);border:1px solid var(--border-soft);border-radius:10px;
  padding:10px 12px;cursor:grab;transition:border-color .12s ease, background .12s ease;
  position:relative;
}
.stage-chip:active{cursor:grabbing;}
.stage-chip.drop-before{box-shadow:inset 0 2px 0 var(--accent);}
.stage-chip.drop-after{box-shadow:inset 0 -2px 0 var(--accent);}
.stage-chip.drop-merge{background:var(--accent-dim);border-color:var(--accent);}
.chip-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.chip-top .swatch{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.chip-name{font-size:13.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.chip-time{font-family:var(--font-m);font-size:18px;font-weight:500;color:var(--text-dim);letter-spacing:.3px;}

.project-main{min-width:0;}

.timer-card{
  background:var(--bg-elev);border:1px solid var(--border-soft);
  border-radius:var(--radius-l);
  padding:28px 26px 24px 26px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.timer-card::before{
  content:'';position:absolute;top:-40%;right:-15%;width:60%;height:180%;
  background:radial-gradient(circle, color-mix(in srgb, var(--stage-color, var(--accent)) 14%, transparent) 0%, transparent 70%);
  pointer-events:none;transition:background .4s ease;
}
.timer-stage-label{
  font-size:12px;color:var(--accent);letter-spacing:.2px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;
}
.timer-stage-name{font-size:15px;font-weight:600;margin-bottom:18px;color:var(--text);}
.timer-digits{
  font-family:var(--font-m);font-size:clamp(34px,6vw,52px);font-weight:500;
  letter-spacing:1px;line-height:1;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.digits-frac{font-size:.42em;color:var(--text-faint);}
.timer-total{margin-top:12px;font-size:12.5px;color:var(--text-faint);font-family:var(--font-m);}
.timer-total b{color:var(--text-dim);font-weight:600;}

.timer-controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:22px;}
.tc-main{
  width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:#1c1305;transition:transform .1s ease, background .15s ease;
}
.tc-main:hover{background:#f6b854;}
.tc-main:active{transform:scale(.94);}
.tc-main svg{width:21px;height:21px;}
.tc-main.is-running{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);}
.tc-main:disabled{opacity:.4;cursor:not-allowed;}
.tc-side{
  height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--border);
  background:var(--bg-elev-2);color:var(--text);font-weight:600;font-size:13px;
  display:flex;align-items:center;gap:7px;cursor:pointer;
  transition:border-color .15s ease, transform .1s ease;
}
.tc-side:hover{border-color:var(--text-faint);}
.tc-side:active{transform:scale(.97);}
.tc-side:disabled{opacity:.35;cursor:not-allowed;}
.tc-side svg{width:14px;height:14px;}
.tc-side.finish{color:var(--danger);}
.tc-side.finish:hover{border-color:var(--danger);}

.session-block{margin-top:26px;}
.session-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.session-block-head span{font-size:12.5px;color:var(--text-faint);font-weight:600;}
.segbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--bg-elev-2);border:1px solid var(--border-soft);}
.segbar > i{display:block;height:100%;}
.seg-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;}
.seg-legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-dim);}
.seg-legend-item .swatch{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.seg-legend-item b{font-family:var(--font-m);color:var(--text);font-weight:500;margin-left:2px;}

.empty-row{text-align:center;padding:26px 0;color:var(--text-faint);font-size:13px;}

.stat-row{display:flex;gap:26px;margin:26px 0 26px 0;padding-bottom:26px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
.stat-item b{display:block;font-family:var(--font-m);font-size:19px;font-weight:500;}
.stat-item span{font-size:11.5px;color:var(--text-faint);}

.section-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-faint);margin:26px 0 14px 0;}

.stage-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.stage-row .swatch{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.stage-row .name{font-size:13px;flex:0 0 130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim);}
.stage-row .bar-track{flex:1;height:8px;background:var(--bg-elev-2);border-radius:5px;overflow:hidden;}
.stage-row .bar-fill{height:100%;border-radius:5px;}
.stage-row .val{font-family:var(--font-m);font-size:12px;color:var(--text-dim);flex:0 0 auto;width:64px;text-align:right;}

.hist-day{margin-bottom:16px;}
.hist-day-date{font-size:12px;font-weight:600;color:var(--text-faint);margin-bottom:8px;}
.hist-entry{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
  background:var(--bg-elev-2);margin-bottom:6px;
}
.hist-entry .swatch{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.hist-entry .name{flex:1;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-entry .val{font-family:var(--font-m);font-size:12px;color:var(--text-dim);}
.hist-entry .row-btn{
  background:none;border:none;color:var(--text-faint);cursor:pointer;padding:3px 4px;
  display:flex;align-items:center;opacity:.55;transition:opacity .15s ease,color .15s ease;
}
.hist-entry .row-btn:hover{opacity:1;}
.hist-entry .row-btn.del:hover{color:var(--danger);}
.hist-entry .row-btn.edit:hover{color:var(--accent);}
.hist-entry .row-btn svg{width:13px;height:13px;}
.hist-entry.editing{background:var(--bg-elev-3);border:1px solid var(--border);}
.hist-entry .edit-name{
  flex:1;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
  padding:6px 9px;border-radius:6px;font-size:12.5px;font-family:inherit;min-width:0;
}
.hist-entry .edit-time{
  width:88px;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
  padding:6px 9px;border-radius:6px;font-size:12px;font-family:var(--font-m);text-align:center;
}

.add-manual{
  display:flex;align-items:center;gap:7px;background:none;border:none;color:var(--text-faint);
  font-size:12.5px;font-weight:600;cursor:pointer;padding:8px 2px;margin-top:2px;
  transition:color .15s ease;
}
.add-manual:hover{color:var(--accent);}
.add-manual svg{width:14px;height:14px;}

/* ---------- stats page ---------- */
.hero-time{font-family:var(--font-m);font-size:46px;font-weight:500;line-height:1;}
.hero-sub{font-size:12.5px;color:var(--text-faint);margin-top:6px;}

.rank-row{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:10px 12px;border-radius:9px;
  cursor:pointer;transition:background .15s ease;
}
.rank-row:hover{background:var(--bg-elev-2);}
.rank-row .swatch{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.rank-row .name{font-size:13.5px;font-weight:500;flex:0 0 150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-row .bar-track{flex:1;height:9px;background:var(--bg-elev-2);border-radius:5px;overflow:hidden;}
.rank-row .bar-fill{height:100%;border-radius:5px;}
.rank-row .val{font-family:var(--font-m);font-size:12.5px;color:var(--text-dim);flex:0 0 auto;width:66px;text-align:right;}

.daychart{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px;}
.daychart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.daychart .bar{width:100%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:3px;}
.daychart .bar-col span{font-size:10.5px;color:var(--text-faint);}
.daychart .bar-col.today .bar{background:var(--accent-2);}
.daychart .bar-col.today span{color:var(--text-dim);font-weight:600;}

/* ---------- modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(10,11,13,.6);
  display:none;align-items:center;justify-content:center;z-index:60;padding:20px;
}
.modal-bg.show{display:flex;}
.modal{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-m);
  width:100%;max-width:380px;padding:24px;
  animation:modalIn .16s cubic-bezier(.2,.8,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
.modal h3{margin:0 0 18px 0;font-size:16px;font-weight:600;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--text-faint);margin-bottom:7px;font-weight:600;}
.field input[type=text],.field input[type=date]{
  width:100%;background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:var(--radius-s);font-size:14px;font-family:inherit;
}
.field input:focus{border-color:var(--accent-dim);}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch-opt{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:transform .1s ease;}
.swatch-opt:hover{transform:scale(1.08);}
.swatch-opt.sel{border-color:var(--text);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{
  background:var(--bg-elev-3);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:var(--radius-s);font-size:13px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  animation:toastIn .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

@media (max-width:640px){
  .topbar{padding:12px 16px;}
  .brand-name{display:none;}
  .view{padding:22px 16px 60px 16px;}
  .stage-row .name{flex-basis:90px;}
  .rank-row .name{flex-basis:100px;}
  .timer-card{padding:24px 18px 20px 18px;}
  .project-head-name{font-size:22px;}
}
</style>
</head>
<body>
<script src="assets/memory.js"></script>

<header class="topbar">
  <button class="brand" id="btnHome">
    <div class="brand-mark"></div>
    <div class="brand-name">Хронометраж</div>
  </button>
  <div class="topbar-spacer"></div>
  <div class="rec-pill" id="recPill" style="display:none">
    <span class="dot live" id="recDot"></span>
    <span id="recLabel">Проект</span>

<div class="toast-wrap" id="toastWrap"></div>

<script>
(function(){
"use strict";

/* ================= storage ================= */
var STORE_KEY = 'sitetime_tracker_v1';
var TIMER_KEY = 'sitetime_timer_v1';

var STAGE_COLORS = ['#f2a93b','#5ecfc0','#8b7fe8','#e2645a','#6fb1e8','#c9d96b','#e88bc0','#4fd1a5','#e8a0f2','#d9a86c'];
var PROJECT_COLORS = ['#f2a93b','#5ecfc0','#8b7fe8','#e2645a','#6fb1e8','#c9d96b','#e88bc0','#4fd1a5'];

function loadDB(){
  try{ var raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { projects: [], entries: [] };
}
function saveDB(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }catch(e){} }
function loadTimer(){
  try{ var raw = localStorage.getItem(TIMER_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveTimer(){
  try{
    if(!timer.running){ localStorage.removeItem(TIMER_KEY); return; }
    localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
  }catch(e){}
}

var db = loadDB();
var timer = loadTimer() || {
  running:false, paused:false, projectId:null, stage:'',
  stageAccum:0, stageSince:null, sessionStages:[], sessionStart:null
};

/* ================= helpers ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
function stageColor(name){ return STAGE_COLORS[hashStr(name||'')%STAGE_COLORS.length]; }

function fmtHMS(totalSeconds){
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  var h = Math.floor(totalSeconds/3600);
  var m = Math.floor((totalSeconds%3600)/60);
  var s = totalSeconds%60;
  function p(n){ return (n<10?'0':'')+n; }
  return p(h)+':'+p(m)+':'+p(s);
}
function fmtHMSTenths(totalSeconds){
  var clamped = Math.max(0, totalSeconds);
  var whole = Math.floor(clamped);
  var tenths = Math.floor((clamped-whole)*10);
  return fmtHMS(whole)+'<span class="digits-frac">.'+tenths+'</span>';
}
function fmtHuman(totalSeconds){
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  var h = Math.floor(totalSeconds/3600);
  var m = Math.floor((totalSeconds%3600)/60);
  if(h>0) return h+'ч '+m+'м';
  var s = totalSeconds%60;
  if(m>0) return m+'м '+s+'с';
  return s+'с';
}
function parseDurationStr(s){
  if(!s) return null;
  s = s.trim();
  if(!s) return null;
  var parts = s.split(':').map(function(x){ return x.trim(); });
  if(parts.some(function(p){ return p==='' || isNaN(Number(p)); })) return null;
  var secs=0;
  if(parts.length===3){ secs=(+parts[0])*3600+(+parts[1])*60+(+parts[2]); }
  else if(parts.length===2){ secs=(+parts[0])*60+(+parts[1]); }
  else if(parts.length===1){ secs=(+parts[0])*60; }
  else return null;
  if(secs<0 || !isFinite(secs)) return null;
  return Math.round(secs);
}
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateStrOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDateLabel(dateStr){
  var today = todayStr();
  var d = new Date(dateStr+'T00:00:00');
  var yestD = new Date(); yestD.setDate(yestD.getDate()-1);
  var yest = dateStrOf(yestD);
  if(dateStr===today) return 'Сегодня';
  if(dateStr===yest) return 'Вчера';
  var months=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}
function relativeActivity(dateStr){
  if(!dateStr) return 'ещё не начинали';
  var today = todayStr();
  if(dateStr===today) return 'сегодня';
  var d1 = new Date(dateStr+'T00:00:00'), d2 = new Date(today+'T00:00:00');
  var days = Math.round((d2-d1)/86400000);
  if(days===1) return 'вчера';
  if(days<7) return days+' дн. назад';
  return fmtDateLabel(dateStr);
}
function pluralDays(n){
  var mod10=n%10, mod100=n%100;
  if(mod10===1 && mod100!==11) return 'день';
  if([2,3,4].indexOf(mod10)!==-1 && [12,13,14].indexOf(mod100)===-1) return 'дня';
  return 'дней';
}
function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toast(msg){
  var wrap = document.getElementById('toastWrap');
  var el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function(){
    el.style.transition='opacity .25s ease, transform .25s ease';
    el.style.opacity='0'; el.style.transform='translateY(6px)';
    setTimeout(function(){ el.remove(); },260);
  },2200);
}

/* ================= data queries ================= */
function projectEntries(pid){ return db.entries.filter(function(e){ return e.projectId===pid; }); }
function projectTotal(pid){ return projectEntries(pid).reduce(function(a,e){ return a+e.seconds; },0); }
function projectLastDate(pid){
  var es = projectEntries(pid);
  if(!es.length) return null;
  return es.reduce(function(a,e){ return e.date>a?e.date:a; }, es[0].date);
}
function projectStageBreakdown(pid){
  var map = {};
  projectEntries(pid).forEach(function(e){ map[e.stage] = (map[e.stage]||0) + e.seconds; });
  return Object.keys(map).map(function(k){ return {stage:k, seconds:map[k]}; })
    .sort(function(a,b){ return b.seconds-a.seconds; });
}
function projectSessionDates(pid){
  var set = {}; projectEntries(pid).forEach(function(e){ set[e.date]=1; });
  return Object.keys(set);
}
function project(pid){ return db.projects.find(function(p){ return p.id===pid; }); }

function ensureStageOrder(p){
  var names = projectStageBreakdown(p.id).map(function(s){ return s.stage; });
  if(!p.stageOrder) p.stageOrder=[];
  var changed=false;
  var filtered = p.stageOrder.filter(function(n){ return names.indexOf(n)!==-1; });
  if(filtered.length!==p.stageOrder.length){ p.stageOrder=filtered; changed=true; }
  names.forEach(function(n){ if(p.stageOrder.indexOf(n)===-1){ p.stageOrder.push(n); changed=true; } });
  if(changed) saveDB();
  return p.stageOrder;
}
function mergeStages(pid, fromName, toName){
  db.entries.forEach(function(e){ if(e.projectId===pid && e.stage===fromName) e.stage=toName; });
  var p = project(pid);
  if(p && p.stageOrder){ p.stageOrder = p.stageOrder.filter(function(n){ return n!==fromName; }); }
  saveDB();
}
function reorderStage(p, dragName, targetName, mode){
  var arr = p.stageOrder;
  var from = arr.indexOf(dragName);
  if(from===-1) return;
  arr.splice(from,1);
  var to = arr.indexOf(targetName);
  if(to===-1){ arr.push(dragName); }
  else{ arr.splice(mode==='after'?to+1:to, 0, dragName); }
  saveDB();
}

/* ================= view routing ================= */
var view = 'home';
var activeProjectId = null;

function setView(name){
  view = name;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById('view-'+name).classList.add('active');
  document.getElementById('btnStats').classList.toggle('active', name==='stats');
  window.scrollTo(0,0);
}
function goHome(){ activeProjectId=null; setView('home'); renderHome(); renderRecPill(); }
function openProject(pid){
  var p = project(pid);
  if(!p) return goHome();
  activeProjectId = pid;
  setView('project');
  renderProjectView();
  renderRecPill();
}
function openStats(){ setView('stats'); renderStats(); renderRecPill(); }

document.getElementById('btnHome').addEventListener('click', goHome);
document.getElementById('btnBackFromProject').addEventListener('click', goHome);
document.getElementById('btnBackFromStats').addEventListener('click', goHome);
document.getElementById('btnStats').addEventListener('click', openStats);

/* ================= recording pill ================= */
function renderRecPill(){
  var pill = document.getElementById('recPill');
  if(!timer.running || (view==='project' && activeProjectId===timer.projectId)){
    pill.style.display='none'; return;
  }
  var p = project(timer.projectId);
  pill.style.display='flex';
  document.getElementById('recDot').style.background = p ? p.color : 'var(--accent)';
  document.getElementById('recDot').classList.toggle('live', !timer.paused);
  document.getElementById('recLabel').textContent = p ? p.name : 'Проект';
  document.getElementById('recTime').textContent = fmtHMS(sessionElapsedTotal());
}
document.getElementById('recPill').addEventListener('click', function(){
  if(timer.projectId) openProject(timer.projectId);
});

/* ================= project modal (add / rename) ================= */
var modalProjectMode = 'add';
var modalProjectTarget = null;
var selectedColor = PROJECT_COLORS[0];

function buildColorSwatches(){
  var wrap = document.getElementById('colorSwatches');
  wrap.innerHTML='';
  PROJECT_COLORS.forEach(function(c){
    var d = document.createElement('div');
    d.className='swatch-opt'+(c===selectedColor?' sel':'');
    d.style.background=c;
    d.addEventListener('click', function(){ selectedColor=c; buildColorSwatches(); });
    wrap.appendChild(d);
  });
}
function openProjectModal(mode, proj){
  modalProjectMode = mode;
  modalProjectTarget = proj || null;
  document.getElementById('modalProjectTitle').textContent = mode==='add' ? 'Новый проект' : 'Переименовать проект';
  document.getElementById('inpProjectName').value = proj ? proj.name : '';
  selectedColor = proj ? proj.color : PROJECT_COLORS[db.projects.length % PROJECT_COLORS.length];
  buildColorSwatches();
  document.getElementById('modalProject').classList.add('show');
  setTimeout(function(){ document.getElementById('inpProjectName').focus(); }, 30);
}
function closeProjectModal(){ document.getElementById('modalProject').classList.remove('show'); }
document.getElementById('btnCancelProject').addEventListener('click', closeProjectModal);
document.getElementById('modalProject').addEventListener('click', function(e){ if(e.target.id==='modalProject') closeProjectModal(); });
document.getElementById('btnSaveProject').addEventListener('click', function(){
  var name = document.getElementById('inpProjectName').value.trim();
  if(!name){ toast('Введите название проекта'); return; }
  if(modalProjectMode==='add'){
    var p = { id: uid(), name: name, color: selectedColor, createdAt: Date.now(), stageOrder: [] };
    db.projects.push(p); saveDB();
    closeProjectModal();
    toast('Проект добавлен');
    openProject(p.id);
  } else {
    modalProjectTarget.name = name;
    modalProjectTarget.color = selectedColor;
    saveDB();
    closeProjectModal();
    toast('Изменения сохранены');
    if(view==='project') renderProjectView();
  }
});
document.getElementById('inpProjectName').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('btnSaveProject').click(); });

/* ================= stage name modal ================= */
var stageModalResolve = null;
function askStageName(prefill){
  return new Promise(function(resolve){
    stageModalResolve = resolve;
    document.getElementById('inpStageName').value = prefill || '';
    document.getElementById('modalStage').classList.add('show');
    setTimeout(function(){ var inp=document.getElementById('inpStageName'); inp.focus(); inp.select(); },30);
  });
}
function closeStageModal(cancelled){
  document.getElementById('modalStage').classList.remove('show');
  if(stageModalResolve){
    var name = document.getElementById('inpStageName').value.trim();
    stageModalResolve(cancelled ? null : (name || 'Этап'));
    stageModalResolve = null;
  }
}
document.getElementById('btnSaveStage').addEventListener('click', function(){ closeStageModal(false); });
document.getElementById('btnCancelStage').addEventListener('click', function(){ closeStageModal(true); });
document.getElementById('inpStageName').addEventListener('keydown', function(e){ if(e.key==='Enter') closeStageModal(false); });

/* ================= manual entry modal ================= */
function openManualModal(){
  document.getElementById('inpManualStage').value='';
  document.getElementById('inpManualTime').value='';
  document.getElementById('inpManualDate').value = todayStr();
  document.getElementById('modalManual').classList.add('show');
  setTimeout(function(){ document.getElementById('inpManualStage').focus(); },30);
}
function closeManualModal(){ document.getElementById('modalManual').classList.remove('show'); }
document.getElementById('btnAddManual').addEventListener('click', openManualModal);
document.getElementById('btnCancelManual').addEventListener('click', closeManualModal);
document.getElementById('modalManual').addEventListener('click', function(e){ if(e.target.id==='modalManual') closeManualModal(); });
document.getElementById('btnSaveManual').addEventListener('click', function(){
  var name = document.getElementById('inpManualStage').value.trim();
  var secs = parseDurationStr(document.getElementById('inpManualTime').value);
  var date = document.getElementById('inpManualDate').value || todayStr();
  if(!name){ toast('Введите название этапа'); return; }
  if(secs===null || secs<=0){ toast('Формат времени: ч:мм:сс'); return; }
  db.entries.push({ id:uid(), projectId:activeProjectId, stage:name, seconds:secs, date:date });
  saveDB();
  closeManualModal();
  toast('Запись добавлена');
  renderProjectView();
});

/* ================= confirm modal ================= */
function askConfirm(title, text){
  return new Promise(function(resolve){
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text||'';
    var modal = document.getElementById('modalConfirm');
    modal.classList.add('show');
    var okBtn = document.getElementById('btnConfirmOk');
    var cancelBtn = document.getElementById('btnConfirmCancel');
    function cleanup(v){ modal.classList.remove('show'); okBtn.removeEventListener('click', onOk); cancelBtn.removeEventListener('click', onCancel); resolve(v); }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

/* ================= timer logic ================= */
function currentStageElapsed(){
  var extra = (timer.running && !timer.paused && timer.stageSince) ? (Date.now()-timer.stageSince)/1000 : 0;
  return timer.stageAccum + extra;
}
function sessionElapsedTotal(){
  var prior = timer.sessionStages.reduce(function(a,s){ return a+s.seconds; },0);
  return prior + currentStageElapsed();
}

function renderTimerUI(){
  var running = timer.running && timer.projectId===activeProjectId;
  var runningElsewhere = timer.running && timer.projectId!==activeProjectId;
  document.getElementById('btnNextStage').disabled = !running;
  document.getElementById('btnFinish').disabled = !running;
  document.getElementById('btnMainToggle').disabled = runningElsewhere;

  var mainIconPlay = document.getElementById('iconPlay');
  var mainIconPause = document.getElementById('iconPause');
  var mainBtn = document.getElementById('btnMainToggle');
  var label = document.getElementById('preStartLabel');

  if(!running){
    mainIconPlay.style.display='block'; mainIconPause.style.display='none';
    mainBtn.classList.remove('is-running');
    if(runningElsewhere){ label.style.display='flex'; label.textContent='Таймер идёт в другом проекте'; }
    else { label.style.display='none'; label.textContent=''; }
    document.getElementById('stageName').textContent='—';
    document.getElementById('timerDigits').innerHTML = fmtHMSTenths(0);
    document.getElementById('timerTotal').style.visibility='hidden';
    document.getElementById('sessionBlock').style.display='none';
    document.getElementById('timerCard').style.setProperty('--stage-color','var(--accent)');
  } else {
    label.style.display='none'; label.textContent='';
    document.getElementById('stageName').textContent = timer.stage;
    var col = stageColor(timer.stage);
    document.getElementById('timerCard').style.setProperty('--stage-color', col);
    document.getElementById('timerDigits').innerHTML = fmtHMSTenths(currentStageElapsed());
    document.getElementById('timerTotal').style.visibility='visible';
    document.getElementById('timerTotal').innerHTML = 'Всего за сессию: <b>'+fmtHMS(sessionElapsedTotal())+'</b>';
    if(timer.paused){ mainIconPlay.style.display='block'; mainIconPause.style.display='none'; mainBtn.classList.add('is-running'); }
    else { mainIconPlay.style.display='none'; mainIconPause.style.display='block'; mainBtn.classList.remove('is-running'); }
    document.getElementById('sessionBlock').style.display = 'block';
    renderSessionSeg();
  }
}
function renderSessionSeg(){
  var stages = timer.sessionStages.slice();
  stages.push({stage:timer.stage, seconds: currentStageElapsed()});
  var total = stages.reduce(function(a,s){return a+s.seconds;},0) || 1;
  var bar = document.getElementById('sessionSegbar');
  bar.innerHTML='';
  stages.forEach(function(s){
    var i = document.createElement('i');
    i.style.width = (s.seconds/total*100)+'%';
    i.style.background = stageColor(s.stage);
    i.title = s.stage+' — '+fmtHuman(s.seconds);
    bar.appendChild(i);
  });
  var legend = document.getElementById('sessionLegend');
  legend.innerHTML='';
  var byName = {};
  stages.forEach(function(s){ byName[s.stage]=(byName[s.stage]||0)+s.seconds; });
  Object.keys(byName).forEach(function(name){
    var item = document.createElement('div');
    item.className='seg-legend-item';
    item.innerHTML = '<span class="swatch" style="background:'+stageColor(name)+'"></span>'+escapeHtml(name)+' <b>'+fmtHuman(byName[name])+'</b>';
    legend.appendChild(item);
  });
}

document.getElementById('btnMainToggle').addEventListener('click', function(){
  if(timer.running && timer.projectId!==activeProjectId) return;
  if(!timer.running){
    var proj = project(activeProjectId);
    if(!proj) return;
    askStageName('').then(function(name){
      if(name===null) return;
      timer.running=true; timer.paused=false;
      timer.projectId=proj.id;
      timer.stage=name;
      timer.stageAccum=0; timer.stageSince=Date.now();
      timer.sessionStages=[]; timer.sessionStart=Date.now();
      saveTimer(); renderTimerUI(); renderRecPill();
    });
  } else if(timer.paused){
    timer.paused=false; timer.stageSince=Date.now();
    saveTimer(); renderTimerUI(); renderRecPill();
  } else {
    timer.stageAccum = currentStageElapsed();
    timer.stageSince = null;
    timer.paused=true;
    saveTimer(); renderTimerUI(); renderRecPill();
  }
});
document.getElementById('btnNextStage').addEventListener('click', function(){
  if(!timer.running || timer.projectId!==activeProjectId) return;
  askStageName('').then(function(name){
    if(name===null) return;
    var elapsed = currentStageElapsed();
    if(elapsed>=1) timer.sessionStages.push({stage:timer.stage, seconds:elapsed});
    timer.stage = name;
    timer.stageAccum = 0;
    timer.stageSince = timer.paused ? null : Date.now();
    saveTimer(); renderTimerUI();
  });
});
document.getElementById('btnFinish').addEventListener('click', function(){
  if(!timer.running || timer.projectId!==activeProjectId) return;
  var elapsed = currentStageElapsed();
  if(elapsed>=1) timer.sessionStages.push({stage:timer.stage, seconds:elapsed});
  var pid = timer.projectId;
  var date = todayStr();
  var finalTotal = sessionElapsedTotal();
  timer.sessionStages.forEach(function(s){
    db.entries.push({ id:uid(), projectId:pid, stage:s.stage, seconds:Math.round(s.seconds), date:date });
  });
  saveDB();
  toast('Сессия сохранена — '+fmtHuman(finalTotal));
  timer = { running:false, paused:false, projectId:null, stage:'', stageAccum:0, stageSince:null, sessionStages:[], sessionStart:null };
  saveTimer();
  renderProjectView();
  renderRecPill();
});

/* live tick: digits every 100ms, heavier bits every ~1s */
var tickCounter = 0;
setInterval(function(){
  if(!timer.running || timer.paused) return;
  tickCounter++;
  if(view==='project' && activeProjectId===timer.projectId){
    document.getElementById('timerDigits').innerHTML = fmtHMSTenths(currentStageElapsed());
    if(tickCounter%10===0){
      document.getElementById('timerTotal').innerHTML = 'Всего за сессию: <b>'+fmtHMS(sessionElapsedTotal())+'</b>';
      renderSessionSeg();
    }
  } else if(tickCounter%10===0){
    renderRecPill();
  }
}, 100);

/* ================= home page (draggable project tiles) ================= */
var draggingProjectId = null;

function renderHome(){
  var has = db.projects.length>0;
  document.getElementById('homeToolbar').style.display = has?'flex':'none';
  var grid = document.getElementById('projectGrid');
  grid.innerHTML='';

  var sortMode = document.getElementById('sortSelect').value;

  var addTile = document.createElement('div');
  addTile.className='pcard-add';
  addTile.innerHTML = '<div class="plus-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div><span>Добавить проект</span>';
  addTile.addEventListener('click', function(){ openProjectModal('add'); });
  addTile.addEventListener('dragover', function(e){ if(sortMode==='manual' && draggingProjectId) e.preventDefault(); });
  addTile.addEventListener('drop', function(e){
    if(sortMode!=='manual' || !draggingProjectId) return;
    e.preventDefault();
    var arr = db.projects;
    var from = arr.findIndex(function(x){return x.id===draggingProjectId;});
    if(from===-1) return;
    var item = arr.splice(from,1)[0];
    arr.push(item);
    saveDB(); draggingProjectId=null; renderHome();
  });
  grid.appendChild(addTile);

  if(!has) return;

  var list = db.projects.slice();
  if(sortMode==='time'){ list.sort(function(a,b){ return projectTotal(b.id)-projectTotal(a.id); }); }
  else if(sortMode==='name'){ list.sort(function(a,b){ return a.name.localeCompare(b.name,'ru'); }); }
  else if(sortMode==='recent'){
    list.sort(function(a,b){
      var da = projectLastDate(a.id)||'0', db_ = projectLastDate(b.id)||'0';
      return db_.localeCompare(da);
    });
  }
  // sortMode==='manual' -> keep stored db.projects order as-is

  list.forEach(function(p){
    var total = projectTotal(p.id);
    var last = projectLastDate(p.id);
    var breakdown = projectStageBreakdown(p.id);
    var isLive = timer.running && timer.projectId===p.id;
    var card = document.createElement('div');
    card.className='pcard';
    card.innerHTML =
      '<div class="pcard-top"><span class="pcard-dot'+(isLive?' live':'')+'" style="background:'+p.color+'"></span><span class="pcard-name">'+escapeHtml(p.name)+'</span></div>'+
      '<div class="pcard-time" style="color:'+(total>0?'var(--text)':'var(--text-faint)')+'">'+(total>0?fmtHuman(total):'—')+'</div>'+
      '<div class="pcard-meta'+(isLive?' live-label':'')+'">'+(isLive?'Идёт запись':relativeActivity(last)+' · '+projectSessionDates(p.id).length+' '+pluralDays(projectSessionDates(p.id).length))+'</div>'+
      '<div class="segbar"></div>';
    var bar = card.querySelector('.segbar');
    var tot = breakdown.reduce(function(a,s){return a+s.seconds;},0) || 1;
    if(breakdown.length){
      breakdown.forEach(function(s){
        var i=document.createElement('i');
        i.style.width=(s.seconds/tot*100)+'%'; i.style.background=stageColor(s.stage);
        i.title=s.stage+' — '+fmtHuman(s.seconds);
        bar.appendChild(i);
      });
    } else {
      var i=document.createElement('i'); i.style.width='100%'; i.style.background='var(--border)'; bar.appendChild(i);
    }
    card.addEventListener('click', function(){ if(!card.classList.contains('was-dragged')) openProject(p.id); });

    if(sortMode==='manual'){
      card.draggable = true;
      card.addEventListener('dragstart', function(e){ draggingProjectId = p.id; e.dataTransfer.effectAllowed='move'; });
      card.addEventListener('dragover', function(e){ e.preventDefault(); if(draggingProjectId && draggingProjectId!==p.id) card.classList.add('drag-over'); });
      card.addEventListener('dragleave', function(){ card.classList.remove('drag-over'); });
      card.addEventListener('drop', function(e){
        e.preventDefault();
        card.classList.remove('drag-over');
        if(!draggingProjectId || draggingProjectId===p.id) return;
        var arr = db.projects;
        var from = arr.findIndex(function(x){return x.id===draggingProjectId;});
        var to = arr.findIndex(function(x){return x.id===p.id;});
        if(from===-1||to===-1) return;
        var item = arr.splice(from,1)[0];
        arr.splice(to,0,item);
        saveDB(); draggingProjectId=null;
        renderHome();
      });
      card.addEventListener('dragend', function(){ card.classList.remove('drag-over'); draggingProjectId=null; });
    }
    grid.appendChild(card);
  });
}
document.getElementById('sortSelect').addEventListener('change', renderHome);

/* ================= project view ================= */
var editingEntryId = null;
var draggingStageName = null;

function renderProjectView(){
  var p = project(activeProjectId);
  if(!p) return goHome();

  document.getElementById('projHeadDot').style.background = p.color;
  document.getElementById('projHeadName').textContent = p.name;
  document.getElementById('projHeadName').style.color = p.color;

  renderTimerUI();
  renderStageChips(p);

  var total = projectTotal(p.id);
  var sessions = projectSessionDates(p.id);
  var breakdown = projectStageBreakdown(p.id);
  var avg = sessions.length ? total/sessions.length : 0;

  document.getElementById('projStatRow').innerHTML =
    '<div class="stat-item"><b>'+(total>0?fmtHuman(total):'0м')+'</b><span>всего времени</span></div>'+
    '<div class="stat-item"><b>'+sessions.length+'</b><span>'+pluralDays(sessions.length)+' работы</span></div>'+
    '<div class="stat-item"><b>'+fmtHuman(avg)+'</b><span>в среднем за день</span></div>'+
    '<div class="stat-item"><b>'+breakdown.length+'</b><span>видов этапов</span></div>';

  renderProjectHistory(p);
}

function clearChipDropClasses(host){
  host.querySelectorAll('.stage-chip').forEach(function(c){ c.classList.remove('drop-before','drop-after','drop-merge'); });
}

function renderStageChips(p){
  var order = ensureStageOrder(p);
  var totals = {};
  projectStageBreakdown(p.id).forEach(function(s){ totals[s.stage]=s.seconds; });
  var host = document.getElementById('stageChips');
  if(!order.length){
    host.innerHTML = '<div class="empty-row">Пока нет этапов</div>';
    return;
  }
  host.innerHTML = order.map(function(name){
    return '<div class="stage-chip" draggable="true" data-stage="'+escapeHtml(name)+'">'+
      '<div class="chip-top"><span class="swatch" style="background:'+stageColor(name)+'"></span><span class="chip-name" title="'+escapeHtml(name)+'">'+escapeHtml(name)+'</span></div>'+
      '<div class="chip-time">'+fmtHMS(totals[name]||0)+'</div>'+
    '</div>';
  }).join('');

  host.querySelectorAll('.stage-chip').forEach(function(chip){
    chip.addEventListener('dragstart', function(e){
      draggingStageName = chip.dataset.stage;
      e.dataTransfer.effectAllowed='move';
    });
    chip.addEventListener('dragover', function(e){
      e.preventDefault();
      if(!draggingStageName || draggingStageName===chip.dataset.stage) return;
      var rect = chip.getBoundingClientRect();
      var ratio = (e.clientY-rect.top)/rect.height;
      clearChipDropClasses(host);
      if(ratio<0.25) chip.classList.add('drop-before');
      else if(ratio>0.75) chip.classList.add('drop-after');
      else chip.classList.add('drop-merge');
    });
    chip.addEventListener('dragleave', function(){ chip.classList.remove('drop-before','drop-after','drop-merge'); });
    chip.addEventListener('drop', function(e){
      e.preventDefault();
      var targetName = chip.dataset.stage;
      var mode = chip.classList.contains('drop-merge') ? 'merge' : (chip.classList.contains('drop-before') ? 'before' : 'after');
      clearChipDropClasses(host);
      var dragName = draggingStageName;
      draggingStageName = null;
      if(!dragName || dragName===targetName) return;
      if(mode==='merge'){
        askConfirm('Объединить этапы?', 'Все записи «'+dragName+'» будут переименованы в «'+targetName+'».').then(function(ok){
          if(ok){ mergeStages(p.id, dragName, targetName); renderProjectView(); toast('Этапы объединены'); }
        });
      } else {
        reorderStage(p, dragName, targetName, mode);
        renderStageChips(p);
      }
    });
    chip.addEventListener('dragend', function(){ clearChipDropClasses(host); draggingStageName=null; });
  });
}

function renderProjectHistory(p){
  var host = document.getElementById('projHistory');
  var entries = projectEntries(p.id).slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  if(!entries.length){
    host.innerHTML = '<div class="empty-row">Здесь появится история по мере работы</div>';
    return;
  }
  var byDate = {};
  entries.forEach(function(e){ (byDate[e.date] = byDate[e.date]||[]).push(e); });
  var html='';
  Object.keys(byDate).sort().reverse().forEach(function(date){
    html += '<div class="hist-day"><div class="hist-day-date">'+fmtDateLabel(date)+'</div>';
    byDate[date].forEach(function(e){
      if(e.id===editingEntryId){
        html += '<div class="hist-entry editing" data-eid="'+e.id+'">'+
          '<span class="swatch" style="background:'+stageColor(e.stage)+'"></span>'+
          '<input type="text" class="edit-name" id="editName_'+e.id+'" value="'+escapeHtml(e.stage)+'" maxlength="40">'+
          '<input type="text" class="edit-time" id="editTime_'+e.id+'" value="'+fmtHMS(e.seconds)+'">'+
          '<button class="row-btn save" data-eid="'+e.id+'" title="Сохранить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></button>'+
          '<button class="row-btn cancel" data-eid="'+e.id+'" title="Отмена"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'+
        '</div>';
      } else {
        html += '<div class="hist-entry" data-eid="'+e.id+'">'+
          '<span class="swatch" style="background:'+stageColor(e.stage)+'"></span>'+
          '<span class="name">'+escapeHtml(e.stage)+'</span>'+
          '<span class="val">'+fmtHuman(e.seconds)+'</span>'+
          '<button class="row-btn edit" data-eid="'+e.id+'" title="Редактировать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'+
          '<button class="row-btn del" data-eid="'+e.id+'" title="Удалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'+
        '</div>';
      }
    });
    html += '</div>';
  });
  host.innerHTML = html;

  host.querySelectorAll('.row-btn.edit').forEach(function(btn){
    btn.addEventListener('click', function(){ editingEntryId = btn.dataset.eid; renderProjectHistory(p); setTimeout(function(){ var inp=document.getElementById('editName_'+editingEntryId); if(inp){ inp.focus(); inp.select(); } },20); });
  });
  host.querySelectorAll('.row-btn.cancel').forEach(function(btn){
    btn.addEventListener('click', function(){ editingEntryId = null; renderProjectHistory(p); });
  });
  host.querySelectorAll('.row-btn.save').forEach(function(btn){
    btn.addEventListener('click', function(){
      var eid = btn.dataset.eid;
      var nameInp = document.getElementById('editName_'+eid);
      var timeInp = document.getElementById('editTime_'+eid);
      var name = nameInp.value.trim();
      var secs = parseDurationStr(timeInp.value);
      if(!name){ toast('Название не может быть пустым'); return; }
      if(secs===null || secs<0){ toast('Формат времени: ч:мм:сс'); return; }
      var entry = db.entries.find(function(x){ return x.id===eid; });
      if(entry){ entry.stage=name; entry.seconds=secs; saveDB(); }
      editingEntryId = null;
      renderProjectView();
      toast('Запись обновлена');
    });
  });
  host.querySelectorAll('.row-btn.del').forEach(function(btn){
    btn.addEventListener('click', function(){
      var eid = btn.dataset.eid;
      askConfirm('Удалить запись?', 'Это действие нельзя отменить.').then(function(ok){
        if(!ok) return;
        db.entries = db.entries.filter(function(en){ return en.id!==eid; });
        saveDB();
        renderProjectView();
      });
    });
  });
}

document.getElementById('btnRenameProject').addEventListener('click', function(){
  var p = project(activeProjectId);
  if(p) openProjectModal('rename', p);
});
document.getElementById('btnDeleteProject').addEventListener('click', function(){
  var p = project(activeProjectId);
  if(!p) return;
  askConfirm('Удалить проект «'+p.name+'»?', 'Вся история времени по этому проекту будет удалена без возможности восстановления.').then(function(ok){
    if(!ok) return;
    db.projects = db.projects.filter(function(x){return x.id!==p.id;});
    db.entries = db.entries.filter(function(e){return e.projectId!==p.id;});
    if(timer.running && timer.projectId===p.id){
      timer = { running:false, paused:false, projectId:null, stage:'', stageAccum:0, stageSince:null, sessionStages:[], sessionStart:null };
      saveTimer();
    }
    saveDB();
    toast('Проект удалён');
    goHome();
  });
});

/* ================= stats page ================= */
function renderStats(){
  var host = document.getElementById('statsBody');
  var allTotal = db.entries.reduce(function(a,e){ return a+e.seconds; },0);
  var allDates = {}; db.entries.forEach(function(e){ allDates[e.date]=1; });
  var dateCount = Object.keys(allDates).length;

  var html = '';
  html += '<div class="hero-time" style="color:'+(allTotal>0?'var(--text)':'var(--text-faint)')+'">'+(allTotal>0?fmtHuman(allTotal):'0м')+'</div>';
  html += '<div class="hero-sub">суммарно по всем проектам</div>';
  html += '<div class="stat-row">'+
    '<div class="stat-item"><b>'+db.projects.length+'</b><span>проектов</span></div>'+
    '<div class="stat-item"><b>'+dateCount+'</b><span>'+pluralDays(dateCount)+' с записями</span></div>'+
    '<div class="stat-item"><b>'+db.entries.length+'</b><span>записей этапов</span></div>'+
  '</div>';

  html += '<div class="section-label"><span>По проектам</span></div>';
  if(!db.projects.length){
    html += '<div class="empty-row">Пока нет проектов</div>';
  } else {
    var ranked = db.projects.map(function(p){ return {p:p, total: projectTotal(p.id)}; }).sort(function(a,b){ return b.total-a.total; });
    var maxTotal = Math.max.apply(null, ranked.map(function(r){ return r.total; })) || 1;
    html += ranked.map(function(r){
      return '<div class="rank-row" data-pid="'+r.p.id+'">'+
        '<span class="swatch" style="background:'+r.p.color+'"></span>'+
        '<span class="name">'+escapeHtml(r.p.name)+'</span>'+
        '<span class="bar-track"><span class="bar-fill" style="width:'+(r.total/maxTotal*100)+'%;background:'+r.p.color+'"></span></span>'+
        '<span class="val">'+(r.total>0?fmtHuman(r.total):'—')+'</span>'+
      '</div>';
    }).join('');
  }

  html += '<div class="section-label"><span>По типам этапов</span></div>';
  var stageMap = {};
  db.entries.forEach(function(e){ stageMap[e.stage]=(stageMap[e.stage]||0)+e.seconds; });
  var stageList = Object.keys(stageMap).map(function(k){ return {stage:k, seconds:stageMap[k]}; }).sort(function(a,b){ return b.seconds-a.seconds; });
  if(!stageList.length){
    html += '<div class="empty-row">Пока нет данных по этапам</div>';
  } else {
    var maxStage = stageList[0].seconds;
    html += stageList.map(function(s){
      return '<div class="stage-row">'+
        '<span class="swatch" style="background:'+stageColor(s.stage)+'"></span>'+
        '<span class="name" title="'+escapeHtml(s.stage)+'">'+escapeHtml(s.stage)+'</span>'+
        '<span class="bar-track"><span class="bar-fill" style="width:'+(s.seconds/maxStage*100)+'%;background:'+stageColor(s.stage)+'"></span></span>'+
        '<span class="val">'+fmtHuman(s.seconds)+'</span>'+
      '</div>';
    }).join('');
  }

  html += '<div class="section-label"><span>Активность за 14 дней</span></div>';
  var days = [];
  for(var i=13;i>=0;i--){
    var d = new Date(); d.setDate(d.getDate()-i);
    days.push(dateStrOf(d));
  }
  var perDay = days.map(function(ds){
    return db.entries.filter(function(e){ return e.date===ds; }).reduce(function(a,e){ return a+e.seconds; },0);
  });
  var maxDay = Math.max.apply(null, perDay) || 1;
  var today = todayStr();
  html += '<div class="daychart">' + days.map(function(ds, idx){
    var d = new Date(ds+'T00:00:00');
    var h = Math.max(3, Math.round(perDay[idx]/maxDay*100));
    return '<div class="bar-col'+(ds===today?' today':'')+'">'+
      '<div class="bar" style="height:'+h+'%" title="'+fmtDateLabel(ds)+' — '+fmtHuman(perDay[idx])+'"></div>'+
      '<span>'+d.getDate()+'</span>'+
    '</div>';
  }).join('') + '</div>';

  host.innerHTML = html;
  host.querySelectorAll('.rank-row').forEach(function(row){
    row.addEventListener('click', function(){ openProject(row.dataset.pid); });
  });
}

/* ================= init ================= */
if(timer.running && project(timer.projectId)){
  openProject(timer.projectId);
} else {
  goHome();
}

window.addEventListener('beforeunload', function(){ saveTimer(); });

})();
