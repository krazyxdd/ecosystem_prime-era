<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Era — экосистема</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts.css?v=202610010017">
<link rel="stylesheet" href="assets/pe-core.css?v=202610010017">
<script src="assets/pe-core.js?v=202610010017" data-module="home"></script>
<style>
  html,body{ margin:0; background:#050506; color:#fff; font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  *{ box-sizing:border-box; }
  .grid-lines{ position:fixed; inset:0 24px; display:flex; justify-content:space-between; pointer-events:none; z-index:0; }
  .grid-lines i{ width:1px; height:100%; background:rgba(255,255,255,.06); }
  .grid-lines i:nth-child(even){ background:rgba(0,140,255,.12); }
  .page{ position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:calc(var(--pe-nav-h) + 48px) 20px 60px; }
  @media(max-width:600px){ .page{ padding-top:calc(var(--pe-nav-h) + 28px); } .grid-lines{ inset:0 10px; } }

  .hello{ display:flex; align-items:center; gap:16px; margin-bottom:34px; }
  .hello .pe2-av{ box-shadow:0 0 0 3px rgba(255,255,255,.08); }
  .hello h1{ margin:0; font-size:clamp(22px,3.6vw,32px); font-weight:700; letter-spacing:-.01em; line-height:1.2; }
  .hello h1 span{ color:#4DB2FF; }
  .hello p{ margin:6px 0 0; font:500 12px 'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.42); }

  .banner{ display:flex; gap:14px; align-items:center; background:rgba(255,176,32,.1); border:1px solid rgba(255,176,32,.35); border-radius:14px; padding:14px 16px; margin-bottom:22px; font-size:14px; line-height:1.5; color:#FFE3AE; }
  .banner a, .banner button{ margin-left:auto; flex:none; }
  .banner.info{ background:rgba(0,140,255,.1); border-color:rgba(0,140,255,.35); color:#CFE8FF; }
  @media(max-width:600px){ .banner{ flex-direction:column; align-items:flex-start; } .banner a, .banner button{ margin-left:0; } }

  .section-h{ font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.4); margin:0 0 14px; }
  .tools{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:38px; }
  @media(max-width:880px){ .tools{ grid-template-columns:1fr 1fr; } }
  @media(max-width:560px){ .tools{ grid-template-columns:1fr; } }
  .tool{
    position:relative; display:flex; flex-direction:column; gap:12px; padding:22px 20px 20px; border-radius:18px; text-decoration:none;
    background:#FBFBFC; color:#0A0A0B; border:1px solid rgba(228,228,230,.7); overflow:hidden; isolation:isolate; min-height:190px;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
  }
  a.tool:hover{ transform:translateY(-3px); box-shadow:0 12px 28px rgba(0,0,0,.25); }
  a.tool:focus-visible{ outline:3px solid #4DB2FF; outline-offset:3px; }
  .tool .ic{ width:38px; height:38px; border-radius:10px; background:#008CFF; color:#fff; display:flex; align-items:center; justify-content:center; }
  .tool h2{ margin:0; font-size:17px; font-weight:600; }
  .tool p{ margin:0; font-size:13.5px; line-height:1.55; color:#6B6B70; }
  .tool .go{ margin-top:auto; font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.05em; text-transform:uppercase; color:#008CFF; display:flex; align-items:center; gap:8px; }
  .tool.locked{ background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.1); color:#fff; }
  .tool.locked .ic{ background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); }
  .tool.locked p{ color:rgba(255,255,255,.5); }
  .tool.locked .go{ color:rgba(255,255,255,.55); }
  .tool .lock-badge{ position:absolute; top:16px; right:16px; color:rgba(255,255,255,.45); }
  .tool .req-btn{ align-self:flex-start; margin-top:auto; font:600 13px 'IBM Plex Sans',sans-serif; background:#fff; color:#0A0A0B; border:none; border-radius:999px; padding:8px 14px; cursor:pointer; }
  .tool .req-btn:hover{ background:#DCEEFF; }
  .tool .sent{ margin-top:auto; font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.05em; text-transform:uppercase; color:#FFB020; display:flex; gap:7px; align-items:center; }
  .tool .off-badge{ position:absolute; top:14px; right:14px; font:700 10px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; background:#F2F2F3; color:#8A8A8F; padding:4px 7px; border-radius:6px; }
  .tool .guest-badge{ position:absolute; top:14px; right:14px; font:700 10px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; background:#E6F4EC; color:#1A8A4B; padding:4px 7px; border-radius:6px; }

  .team{ display:flex; flex-wrap:wrap; gap:10px; }
  .mate{ display:flex; align-items:center; gap:10px; padding:8px 14px 8px 8px; border:1px solid rgba(255,255,255,.1); border-radius:999px; background:rgba(255,255,255,.03); }
  .mate b{ display:block; font-size:13.5px; font-weight:600; }
  .mate span{ display:block; font-size:12px; color:rgba(255,255,255,.45); }
  .mate .on{ width:8px; height:8px; border-radius:50%; background:#2BC37A; margin-left:4px; box-shadow:0 0 0 3px rgba(43,195,122,.18); }
  .foot{ margin-top:48px; text-align:center; font:500 11.5px 'IBM Plex Mono',monospace; color:rgba(255,255,255,.28); }
</style>
</head>
<body>
<div class="grid-lines"><i></i><i></i><i></i><i></i></div>
<main class="page" id="page"></main>
<script>
PE.onReady(function(){
  var esc=PE.esc;
  function greet(){ var h=new Date().getHours(); return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'; }
  function lockedCard(m){
    var sent=PE.myOpenRequest(m.id);
    var g=PE.isGuest ? PE.guestRequests().filter(function(r){ return r.modules && r.modules.indexOf(m.id)>=0; }).sort(function(a,b){ return b.at-a.at; })[0] : null;
    var status = g && g.status==='approved' ? '<span class="sent" style="color:#2BC37A">✓ Одобрено — владелец пришлёт логин и пароль</span>'
      : g && g.status==='rejected' ? '<span class="sent" style="color:#FF8A84">Заявку отклонили</span>' : '';
    return '<div class="tool locked"><span class="lock-badge">'+PE.icon('lock',16)+'</span>'+
      '<div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+m.icon+'</svg></div>'+
      '<h2>'+esc(m.name)+'</h2><p>'+esc(m.desc)+'</p>'+
      (sent ? '<span class="sent">'+PE.icon('clock',13)+'Запрос отправлен — ждёт решения</span>' : status && g.status==='approved' ? status : (status?status.replace('margin-top:auto','')+' ':'')+'<button class="req-btn" data-req="'+m.id+'">Запросить доступ</button>')+'</div>';
  }
  function render(){
    var u=PE.user, guest=PE.isGuest, admin=PE.isAdmin();
    var h='';
    if(u){
      h+='<div class="hello">'+PE.avatar(u,58)+'<div><h1>'+greet()+', <span>'+esc(u.first)+'</span></h1><p>'+esc(u.position||PE.ROLE_NAMES[u.role])+' · Prime Era Ecosystem</p></div></div>';
    } else {
      h+='<div class="hello"><div><h1>Экосистема <span>инструментов</span> студии</h1><p>Гостевой просмотр'+(PE.session.guestName?' · '+esc(PE.session.guestName):'')+'</p></div></div>';
      h+='<div class="banner info"><span>Вы в гостевом режиме. Инструменты с замком доступны по запросу — владелец рассмотрит заявку. Работаете в студии? Зарегистрируйтесь, чтобы появились аватарка, задачи и личный прогресс.</span><button class="pe2-btn sm primary" data-register>Зарегистрироваться</button></div>';
    }
    if(PE.pendingCount()){
      h+='<div class="banner"><span><b>'+PE.pendingCount()+'</b> '+plural(PE.pendingCount(),'заявка ждёт','заявки ждут','заявок ждут')+' вашего решения.</span><a class="pe2-btn sm" href="admin.html">Открыть админку</a></div>';
    }
    var open=[], locked=[];
    PE.MODULES.forEach(function(m){
      var conf=PE.modConf(m.id);
      if(!conf.enabled && !admin) return;
      if(!conf.home) return;   /* плашку скрыли с главной в админке → «Модули» */
      (PE.can(m.id) ? open : locked).push(m);
    });
    h+='<div class="section-h">'+(open.length?'Ваши инструменты':'Инструменты')+'</div><div class="tools">';
    h+=open.map(function(m){
      var conf=PE.modConf(m.id);
      return '<a class="tool" href="'+m.href+'">'+(!conf.enabled?'<span class="off-badge">выключен</span>':guest?'<span class="guest-badge">для гостей</span>':'')+
        '<div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+m.icon+'</svg></div>'+
        '<h2>'+esc(m.name)+'</h2><p>'+esc(m.desc)+'</p><span class="go">Открыть →</span></a>';
    }).join('');
    h+=locked.map(lockedCard).join('');
    if(!open.length && !locked.length) h+='<div class="banner info">Пока ни один модуль не включён.</div>';
    h+='</div>';

    if(u){
      var mates=PE.team().filter(function(x){ return x.id!==u.id; });
      if(mates.length){
        h+='<div class="section-h">Команда</div><div class="team">'+mates.map(function(x){
          var online=x.lastSeen && Date.now()-x.lastSeen<10*60000;
          return '<div class="mate" title="'+esc(online?'Был(а) в экосистеме недавно':'Последний визит: '+PE.relTime(x.lastSeen))+'">'+PE.avatar(x,36)+'<div><b>'+esc(PE.fullName(x))+'</b><span>'+esc(x.position||PE.ROLE_NAMES[x.role])+'</span></div>'+(online?'<i class="on"></i>':'')+'</div>';
        }).join('')+'</div>';
      }
    }
    h+='<div class="foot">PRIME ERA — студия веб-дизайна · экосистема v2</div>';
    document.getElementById('page').innerHTML=h;
  }
  function plural(n,a,b,c){ var m=n%10,h=n%100; if(m===1&&h!==11) return a; if(m>=2&&m<=4&&(h<10||h>=20)) return b; return c; }
  document.getElementById('page').addEventListener('click', function(e){
    var b=e.target.closest('[data-req]'); if(b){ PE.requestAccess([b.dataset.req]); return; }
    if(e.target.closest('[data-register]')){ localStorage.removeItem('pe2_session_'+(PE.CFG.MOCK?'mock':PE.CFG.ROOT)); location.hash='register'; location.reload(); }
  });
  PE.onRequestSent=render;
  PE.onUsers(render);
  if(PE.isGuest) PE.refreshGuestRequests().then(render);
  render();
});
</script>
</body>
</html>
