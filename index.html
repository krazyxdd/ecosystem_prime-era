<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Era — экосистема</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts.css?v=202610030209">
<link rel="stylesheet" href="assets/pe-core.css?v=202610030209">
<script src="assets/pe-core.js?v=202610030209" data-module="home"></script>
<style>
  /* Главная — «рабочий стол». Только токены дизайн-системы (var(--pe-…)), тема работает сама. */
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--pe-bg-2); color:var(--pe-ink); font-family:var(--pe-font); -webkit-font-smoothing:antialiased; }
  .page{ max-width:1200px; margin:0 auto; padding:calc(var(--pe-nav-h) + 40px) 28px 60px; }
  @media(max-width:700px){ .page{ padding:calc(var(--pe-nav-h) + 22px) 14px 40px; } }

  /* приветствие */
  .hero{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:28px; }
  .hero .date{ font:600 11px var(--pe-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--pe-ink-3); margin-bottom:10px; }
  .hero-me{ display:flex; align-items:center; gap:20px; }
  .hero-me .pe2-av{ box-shadow:0 0 0 4px var(--pe-card), 0 0 0 5px var(--pe-line); }
  @media(max-width:600px){ .hero-me .pe2-av{ width:52px !important; height:52px !important; } }
  .hero h1{ margin:0; font:300 clamp(30px,4.4vw,46px)/1.08 var(--pe-font); letter-spacing:-.02em; }
  .hero h1 b{ font-weight:500; }
  .hero .sub{ margin-top:10px; font:500 12px var(--pe-mono); letter-spacing:.04em; color:var(--pe-ink-2); }
  .hero-acts{ display:flex; gap:8px; flex-wrap:wrap; }

  /* виджеты */
  /* раскладка: задачи (шире) + команда рядом, изменения — строкой ниже; без пустых дыр */
  /* раскладка: задачи слева на всю высоту, справа узкая колонка — команда и журнал */
  .desk{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; margin-bottom:36px; align-items:start; }
  .desk > .w.tasks{ grid-row:span 2; }
  @media(max-width:860px){ .desk{ grid-template-columns:1fr; } .desk > .w.tasks{ grid-row:auto; } }
  .w{ background:var(--pe-card); border:1px solid var(--pe-line); border-radius:var(--pe-r); padding:18px 18px 16px; display:flex; flex-direction:column; min-height:180px; }
  .w.full{ grid-column:1 / -1; min-height:0; }
  .desk > .w{ align-self:stretch; }
  .w-h{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .w-h h2{ margin:0; font:600 11px var(--pe-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--pe-ink-2); flex:1; }
  .w-h a{ font:600 11px var(--pe-mono); letter-spacing:.04em; text-transform:uppercase; color:var(--pe-accent); text-decoration:none; }
  .w-h a:hover{ text-decoration:underline; }
  .w-empty{ margin:auto 0; color:var(--pe-ink-3); font-size:13.5px; line-height:1.5; }

  .kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .kpi{ border-radius:var(--pe-r-md); background:var(--pe-sunk); padding:12px 14px; text-decoration:none; color:inherit; transition:background .15s; }
  .kpi:hover{ background:var(--pe-hover); }
  .kpi b{ display:block; font:500 28px/1 var(--pe-font); letter-spacing:-.02em; }
  .kpi span{ display:block; margin-top:6px; font:600 10.5px var(--pe-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--pe-ink-2); }
  .kpi.bad b{ color:var(--pe-danger); } .kpi.acc b{ color:var(--pe-accent); }

  .tl{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .tl a{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; padding:9px 4px; border-top:1px solid var(--pe-line-2); text-decoration:none; color:var(--pe-ink); border-radius:8px; }
  .tl li:first-child a{ border-top:none; }
  .tl a:hover{ background:var(--pe-hover); }
  .tl .num{ font:500 11.5px var(--pe-mono); color:var(--pe-ink-3); min-width:34px; }
  .tl .t{ font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .due{ font:600 10.5px var(--pe-mono); letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--pe-sunk); color:var(--pe-ink-2); white-space:nowrap; }
  .due.over{ background:var(--pe-danger-t); color:var(--pe-danger); }
  .due.today{ background:var(--pe-accent-t); color:var(--pe-accent-ink); }

  .big{ font:300 44px/1 var(--pe-font); letter-spacing:-.03em; margin:0 0 12px; }
  .big.hot{ color:var(--pe-danger); }
  .who-list{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .who-row{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
  .who-row span{ color:var(--pe-ink-2); font-size:12px; margin-left:auto; font-family:var(--pe-mono); }

  .team{ display:flex; flex-direction:column; gap:10px; }
  .mate{ display:flex; align-items:center; gap:10px; }
  .mate .av{ position:relative; }
  .mate .dot{ position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; background:var(--pe-ok); border:2px solid var(--pe-card); }
  .mate b{ display:block; font-size:13.5px; font-weight:500; }
  .mate small{ display:block; font:500 11px var(--pe-mono); color:var(--pe-ink-3); }

  .log{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .log li{ display:grid; grid-template-columns:auto 1fr; gap:10px; font-size:12.5px; line-height:1.4; }
  .log li > div{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .w.log-w, .desk > .w:not(.tasks){ min-height:0; }
  .log time{ font:500 11px var(--pe-mono); color:var(--pe-ink-3); min-width:52px; padding-top:1px; }
  .log b{ font-weight:500; }
  .log span{ color:var(--pe-ink-2); }

  /* инструменты */
  .tools{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  @media(max-width:980px){ .tools{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:520px){ .tools{ grid-template-columns:1fr; } }
  .tool{ position:relative; display:flex; flex-direction:column; gap:10px; padding:16px; border-radius:var(--pe-r); background:var(--pe-card); border:1px solid var(--pe-line);
    text-decoration:none; color:var(--pe-ink); transition:border-color .15s, transform .15s, box-shadow .15s; min-height:132px; }
  a.tool:hover{ border-color:var(--mc, var(--pe-accent)); box-shadow:var(--pe-shadow); transform:translateY(-2px); }
  a.tool:focus-visible{ outline:2px solid var(--pe-accent); outline-offset:2px; }
  .tool .ic{ width:40px; height:40px; border-radius:12px; background:color-mix(in srgb, var(--mc, var(--pe-accent)) 14%, transparent); color:var(--mc, var(--pe-accent)); display:flex; align-items:center; justify-content:center; }
  .tool h3 .sl{ color:var(--mc, var(--pe-ink-3)); font-weight:400; }
  .tool h3{ margin:0; font:700 14px var(--pe-mono); letter-spacing:.02em; text-transform:uppercase; }
  .tool p{ margin:0; font-size:12.5px; line-height:1.45; color:var(--pe-ink-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tool .badge{ position:absolute; top:14px; right:14px; font:700 9.5px var(--pe-mono); letter-spacing:.06em; text-transform:uppercase; padding:3px 7px; border-radius:6px; background:var(--pe-sunk); color:var(--pe-ink-2); }
  .tool.locked{ background:transparent; border-style:dashed; }
  .tool.locked .ic{ background:var(--pe-sunk); color:var(--pe-ink-3); }
  .tool .req{ margin-top:auto; align-self:flex-start; }
  .tool .sent{ margin-top:auto; font:600 10.5px var(--pe-mono); letter-spacing:.04em; text-transform:uppercase; color:var(--pe-warn); }

  .notice{ display:flex; align-items:center; gap:10px; margin:-14px 0 22px; padding:9px 14px; border-radius:999px; background:var(--pe-card); border:1px solid var(--pe-line);
    text-decoration:none; color:var(--pe-ink); font-size:13px; width:max-content; max-width:100%; transition:border-color .15s; }
  .notice:hover{ border-color:var(--pe-accent); }
  .notice i{ width:8px; height:8px; border-radius:50%; background:var(--pe-danger); flex:none; box-shadow:0 0 0 4px var(--pe-danger-t); }
  .notice span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .notice em{ font:600 10.5px var(--pe-mono); font-style:normal; letter-spacing:.04em; text-transform:uppercase; color:var(--pe-accent); flex:none; }
  .banner{ display:flex; gap:14px; align-items:center; background:var(--pe-accent-t); border-radius:var(--pe-r-md); padding:14px 16px; margin-bottom:22px; font-size:14px; line-height:1.5; color:var(--pe-ink); }
  .banner .pe-btn{ margin-left:auto; flex:none; }
  @media(max-width:600px){ .banner{ flex-direction:column; align-items:flex-start; } .banner .pe-btn{ margin-left:0; } }
  .foot{ margin-top:40px; text-align:center; font:500 11px var(--pe-mono); letter-spacing:.06em; color:var(--pe-ink-3); }
</style>
</head>
<body>
<main class="page" id="page"></main>
<script>
PE.onReady(function(){
  var esc=PE.esc, page=document.getElementById('page');
  var TASKS=null, AUDIT=null;
  var TCACHE='pe-home-tasks-cache';   // «…-cache» — хранится в браузере, в облако не уходит

  function greet(){ var h=new Date().getHours(); return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'; }
  function plural(n,a,b,c){ var m=n%10,h=n%100; if(m===1&&h!==11) return a; if(m>=2&&m<=4&&(h<10||h>=20)) return b; return c; }
  function icon(m, s){ return '<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+m.icon+'</svg>'; }
  function arr(x){ if(!x) return []; if(Array.isArray(x)) return x.filter(function(v){ return v!=null; }); return Object.keys(x).map(function(k){ return x[k]; }); }
  function pad(n){ return (n<10?'0':'')+n; }
  function dayKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtDue(k){ var p=k.split('-'), d=new Date(+p[0], +p[1]-1, +p[2]); return d.toLocaleDateString('ru-RU',{ day:'numeric', month:'short' }).replace('.',''); }

  /* ---------- данные ---------- */
  function loadTasks(){
    if(!PE.can('tasks')) return;
    try{ TASKS=JSON.parse(localStorage.getItem(TCACHE)||'null'); }catch(e){}
    PE.fb('GET','tasks/items').then(function(d){
      var list=arr(d).map(function(t){ return { id:t.id, num:t.num, title:t.title, status:t.status||(t.done?'done':'new'), end:t.end||t.start||'', a:arr(t.assignees), p:t.parent||null, db:t.doneBy||null }; });
      TASKS=list; try{ localStorage.setItem(TCACHE, JSON.stringify(list)); }catch(e){}
      render();
    }).catch(function(){});
  }
  function loadAudit(){
    if(!PE.perm('audit')) return;
    var q = PE.CFG.MOCK ? PE.fb('GET','audit')
      : fetch(PE.CFG.FB+'/'+PE.CFG.ROOT+'/audit.json?orderBy=%22at%22&limitToLast=12').then(function(r){ return r.ok?r.json():null; });
    q.then(function(d){ AUDIT=Object.keys(d||{}).map(function(k){ return d[k]; }).sort(function(a,b){ return b.at-a.at; }).slice(0,12); render(); }).catch(function(){});
  }

  /* ---------- виджеты ---------- */
  function wTasks(u){
    var h='<section class="w tasks"><div class="w-h"><h2>Мои задачи</h2><a href="tasks.html">Доска →</a></div>';
    if(!TASKS) return h+'<div class="w-empty">Загружаю задачи…</div></section>';
    var today=dayKey(new Date());
    var mine=TASKS.filter(function(t){ return t.a.indexOf(u.id)>=0 && t.status!=='done' && t.status!=='postponed' && !(t.db && t.db[u.id]); });   // свою часть уже сделал — не показываем
    var over=mine.filter(function(t){ return t.end && t.end<today; }), tod=mine.filter(function(t){ return t.end===today; }), prog=mine.filter(function(t){ return t.status==='progress'; });
    h+='<div class="kpis"><a class="kpi'+(over.length?' bad':'')+'" href="tasks.html"><b>'+over.length+'</b><span>просрочено</span></a>'+
      '<a class="kpi acc" href="tasks.html"><b>'+tod.length+'</b><span>на сегодня</span></a>'+
      '<a class="kpi" href="tasks.html"><b>'+prog.length+'</b><span>в работе</span></a></div>';
    var list=mine.slice().sort(function(a,b){ return (a.end||'9999')<(b.end||'9999')?-1:(a.end||'9999')>(b.end||'9999')?1:0; }).slice(0,6);
    if(!list.length) return h+'<div class="w-empty">Открытых задач нет — отличный момент взять новую.</div></section>';
    h+='<ul class="tl">'+list.map(function(t){
      var cls=!t.end?'':t.end<today?'over':t.end===today?'today':'';
      var lab=!t.end?'без срока':t.end<today?'просрочено · '+fmtDue(t.end):t.end===today?'сегодня':fmtDue(t.end);
      return '<li><a href="tasks.html'+(t.num?'#task-'+esc(t.num):'')+'"><span class="num">#'+esc(t.num||'')+'</span><span class="t">'+esc(t.title||'Без названия')+'</span><span class="due '+cls+'">'+esc(lab)+'</span></a></li>';
    }).join('')+'</ul></section>';
    return h;
  }
  /* заявки — не карточка, а тонкая полоска над приветствием, только когда они есть */
  function reqNotice(){
    var R=PE.requests||{}, reqs=Object.keys(R).map(function(k){ return R[k]; }).filter(function(r){ return r && r.status==='new'; });
    var pend=Object.keys(PE.users).map(function(k){ return PE.users[k]; }).filter(function(u){ return u.status==='pending'; });
    var items=pend.map(function(u){ return esc(PE.fullName(u))+' — регистрация'; })
      .concat(reqs.map(function(r){ var u=r.uid&&PE.userById(r.uid); return esc(u?PE.fullName(u):(r.name||'Гость'))+' — '+(r.type==='guest'?'гость':'доступ'); }));
    if(!items.length) return '';
    return '<a class="notice" href="admin.html"><i></i><span><b>'+items.length+' '+plural(items.length,'заявка','заявки','заявок')+'</b> · '+items.slice(0,2).join(', ')+(items.length>2?' и ещё '+(items.length-2):'')+'</span><em>Открыть →</em></a>';
  }
  function wTeam(u, alone){
    var mates=PE.team().filter(function(x){ return x.id!==u.id; });
    var online=mates.filter(function(x){ return x.lastSeen && Date.now()-x.lastSeen<10*60000; });
    var h='<section class="w'+(alone?' full':'')+'"><div class="w-h"><h2>Команда</h2><span class="pe-chip">'+online.length+' в сети</span></div>';
    if(!mates.length) return h+'<div class="w-empty">Пока вы здесь один.</div></section>';
    mates.sort(function(a,b){ return (b.lastSeen||0)-(a.lastSeen||0); });
    return h+'<div class="team">'+mates.slice(0,6).map(function(x){
      var on=x.lastSeen && Date.now()-x.lastSeen<10*60000;
      return '<div class="mate"><span class="av">'+PE.avatar(x,32)+(on?'<i class="dot"></i>':'')+'</span><div><b>'+esc(PE.fullName(x))+'</b><small>'+esc(on?'в сети':x.lastSeen?('был(а) '+PE.relTime(x.lastSeen)):'ещё не заходил(а)')+'</small></div></div>';
    }).join('')+'</div></section>';
  }
  var ACT={ login:'вошёл(ла)', 'saleskb.edit':'правка раздела продаж', 'saleskb.delete':'удалён раздел продаж', 'saleskb.tree':'правка схемы продаж', 'saleskb.file':'файлы продаж',
    'calc.config':'правка прайса', 'org.save':'правка оргсхемы', approve:'одобрил(а) регистрацию', create:'создан аккаунт', edit:'правка профиля/доступа', module:'настройки модулей', perms:'права ролей', grant:'выдан доступ', revoke:'закрыт доступ' };
  function wLog(){
    var h='<section class="w log-w"><div class="w-h"><h2>Изменения</h2><a href="admin.html#log">Журнал →</a></div>';
    if(!AUDIT) return h+'<div class="w-empty">Загружаю журнал…</div></section>';
    var list=AUDIT.filter(function(e){ return e.action!=='login'; }).slice(0,4);
    if(!list.length) return h+'<div class="w-empty">Изменений пока не было.</div></section>';
    return h+'<ul class="log">'+list.map(function(e){
      var w=PE.userById(e.by), d=new Date(e.at);
      var t=(Date.now()-e.at<86400000) ? d.toLocaleTimeString('ru-RU',{ hour:'2-digit', minute:'2-digit' }) : d.toLocaleDateString('ru-RU',{ day:'numeric', month:'short' });
      return '<li><time>'+esc(t)+'</time><div><b>'+esc(w?PE.shortName(w):(e.byName||'—'))+'</b> <span>'+esc(ACT[e.action]||e.action)+(e.details?' — '+esc(String(e.details).slice(0,90)):'')+'</span></div></li>';
    }).join('')+'</ul></section>';
  }

  /* ---------- инструменты ---------- */
  function lockedTool(m){
    var sent=PE.myOpenRequest(m.id);
    var g=PE.isGuest ? PE.guestRequests().filter(function(r){ return r.modules && r.modules.indexOf(m.id)>=0; }).sort(function(a,b){ return b.at-a.at; })[0] : null;
    var st = g && g.status==='approved' ? '<span class="sent" style="color:var(--pe-ok)">Одобрено — пришлют логин</span>'
      : g && g.status==='rejected' ? '<span class="sent" style="color:var(--pe-danger)">Заявку отклонили</span>' : '';
    return '<div class="tool locked" data-id="'+m.id+'"><span class="badge">'+PE.icon('lock',11)+'</span><div class="ic">'+icon(m)+'</div><h3><span class="sl">/</span> '+esc(m.name)+'</h3><p>'+esc(m.desc)+'</p>'+
      (sent ? '<span class="sent">Запрос отправлен</span>' : st && g.status==='approved' ? st : (st||'')+'<button class="pe-btn sm req" data-req="'+m.id+'">Запросить доступ</button>')+'</div>';
  }
  function toolsHtml(){
    var admin=PE.isAdmin(), open=[], locked=[];
    PE.MODULES.forEach(function(m){
      var c=PE.modConf(m.id);
      if(!c.enabled && !admin) return;
      if(!c.home) return;                     // плашку скрыли с главной в админке → «Модули»
      (PE.can(m.id) ? open : locked).push(m);
    });
    if(!open.length && !locked.length) return '<div class="banner">Пока ни один модуль не включён.</div>';
    return '<div class="pe-h">'+(open.length?'Инструменты':'Инструменты студии')+'</div><div class="tools">'+
      open.map(function(m){ var c=PE.modConf(m.id);
        return '<a class="tool" href="'+m.href+'" data-id="'+m.id+'" draggable="false" style="--mc:'+(m.color||'var(--pe-accent)')+'">'+(!c.enabled?'<span class="badge">выключен</span>':PE.isGuest?'<span class="badge">для гостей</span>':'')+'<div class="ic">'+icon(m)+'</div><h3><span class="sl">/</span> '+esc(m.name)+'</h3><p>'+esc(m.desc)+'</p></a>';
      }).join('')+locked.map(lockedTool).join('')+'</div>';
  }

  function render(){
    var u=PE.user, h='';
    var date=new Date().toLocaleDateString('ru-RU',{ weekday:'long', day:'numeric', month:'long' });
    if(u){
      if(PE.isStaff() && PE.perm('requests')) h+=reqNotice();
      h+='<div class="hero"><div class="hero-me">'+PE.avatar(u,76)+'<div><div class="date">'+esc(date)+'</div><h1>'+greet()+', <b>'+esc(u.first)+'</b></h1><div class="sub">'+esc(u.position||PE.ROLE_NAMES[u.role])+' · P\\E ecosystem</div></div></div>'+
        '</div>';
      h+='<div class="desk">';
      if(PE.can('tasks')) h+=wTasks(u);
      h+=wTeam(u, !PE.can('tasks'));
      if(PE.perm('audit')) h+=wLog();
      h+='</div>';
    } else {
      h+='<div class="hero"><div><div class="date">'+esc(date)+'</div><h1>Экосистема <b>Prime Era</b></h1><div class="sub">Гостевой просмотр'+(PE.session.guestName?' · '+esc(PE.session.guestName):'')+'</div></div></div>';
      h+='<div class="banner"><span>Вы в гостевом режиме. Инструменты с замком открываются по запросу. Работаете в студии? Зарегистрируйтесь — владелец одобрит аккаунт.</span><button class="pe-btn" data-register>Регистрация</button></div>';
    }
    h+=toolsHtml();
    h+='<div class="foot">PRIME ERA · студия веб-дизайна · P\\E ecosystem</div>';
    page.innerHTML=h;
  }

  page.addEventListener('click', function(e){
    var b=e.target.closest('[data-req]'); if(b){ PE.requestAccess([b.dataset.req]); return; }
    if(e.target.closest('[data-register]')){ localStorage.removeItem('pe2_session_'+(PE.CFG.MOCK?'mock':PE.CFG.ROOT)); location.hash='register'; location.reload(); }
  });
  /* порядок плиток (он же порядок меню) — перетаскиванием, у кого есть право «Настройки модулей» */
  PE.sortable(page, { item:'.tool[data-id]', axis:'x', enabled:function(){ return PE.perm('modules') && !PE.previewUser(); }, onDrop:function(ids){ PE.saveModuleOrder(ids); } });
  PE.onRequestSent=render;
  PE.onUsers(render);
  if(PE.isGuest) PE.refreshGuestRequests().then(render);
  render(); loadTasks(); loadAudit();
});
</script>
</body>
</html>
