<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Возражения — Prime Era</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shell.css">
<style>
  :root{
    --ink: #0A0A0B;
    --ink-soft: #3A3A3E;
    --ink-faint: #6B6B70;
    --bg: #FBFBFC;
    --bg-off: #FAFAFA;
    --line: rgba(228,228,230,0.7);
    --line-soft: rgba(238,238,239,0.6);
    --accent: #008CFF;
    --accent-dim: rgba(232,244,255,0.85);
    --radius: 16px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:transparent;
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--accent-dim);color:var(--ink);}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header.topbar{
    background:none;
    padding:22px 0 24px;
  }
  .topbar-inner{
    max-width:920px;
    margin:0 auto;
    padding:0 24px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .brand-mark canvas{ display:inline-block; vertical-align:middle; cursor:default; }
  .brand-mark{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:18px;
    letter-spacing:0.02em;
    color:var(--ink);
    background:none;
    border:none;
    display:inline-flex;
    align-items:center;
    padding:0;
  }
  .brand-mark:hover{color:var(--accent);}
  .brand-mark::before{content:"[ "; color:var(--ink-faint);}
  .brand-mark::after{content:" ]"; color:var(--ink-faint);}
  .brand-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:17px;
    color:var(--ink-faint);
    letter-spacing:0.01em;
  }
  h1.title{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;
    font-size:36px;
    line-height:1.14;
    margin:0 0 20px;
    letter-spacing:-0.02em;
    color:var(--ink);
    display:inline-block;
    background:var(--bg-off);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    backdrop-filter:blur(16px) saturate(160%);
    padding:14px 20px;
    border-radius:14px;
  }
  @media(max-width:620px){ h1.title{font-size:27px;} }
  h1.title span{color:var(--accent);}

  /* ---- shared animated hero header (same treatment as the glossary page) ---- */
  .eco-hero{
    position:relative;
    overflow:hidden;
    text-align:center;
    background:var(--bg-off);
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px 22px 26px;
    margin-bottom:22px;
    isolation:isolate;
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    backdrop-filter:blur(16px) saturate(160%);
  }
  .eco-hero-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(38px);
    opacity:.38;
    pointer-events:none;
    z-index:0;
  }
  .eco-hero-orb.a{ width:190px;height:190px;background:var(--accent);top:-70px;left:-50px;animation:glossaryOrbFloat 9s ease-in-out infinite; }
  .eco-hero-orb.b{ width:160px;height:160px;background:#7C5CFF;bottom:-60px;right:-40px;animation:glossaryOrbFloat 11s ease-in-out infinite reverse; }
  .eco-hero-orb.c{ width:120px;height:120px;background:#00B8A9;top:10px;right:20%;opacity:.22;animation:glossaryOrbFloat 13s ease-in-out infinite; }
  .eco-hero-title{
    position:relative;
    z-index:1;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:800;
    font-size:clamp(26px, 5vw, 38px);
    line-height:1.18;
    letter-spacing:-0.02em;
    margin:0 0 10px;
    background:linear-gradient(100deg, var(--ink) 0%, var(--accent) 32%, #7C5CFF 55%, var(--ink) 82%);
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:glossaryShimmer 6s linear infinite;
  }
  @media(max-width:620px){ .eco-hero-title{ line-height:1.22; } }
  .eco-hero-sub{
    position:relative;
    z-index:1;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--ink);
  }

  /* search bar row: breadcrumb plate + search field share one line, same width as the category grid below */
  .search-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .search-wrap{ position:relative; flex:1 1 240px; min-width:0; overflow:hidden; isolation:isolate; border-radius:10px; }
  .search-wrap input{
    width:100%;
    background:var(--bg-off);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px 12px 42px;
    color:var(--ink);
    font-size:14.5px;
    font-family:'IBM Plex Mono',monospace;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  .search-wrap input::placeholder{color:var(--ink-faint);}
  .search-wrap input:focus{background:var(--bg); border-color:var(--accent);}
  .search-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; color:var(--ink-faint); pointer-events:none;
  }
  .search-clear{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none;border:none;color:var(--ink-faint); cursor:pointer;
    padding:6px; display:none; line-height:0;
  }
  .search-clear.show{display:block;}
  .search-clear:hover{color:var(--ink);}

  .crumbs{
    position:relative;
    overflow:hidden;
    isolation:isolate;
    display:inline-flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
    max-width:100%;
    margin:0;
    padding:12px 14px;
    background:var(--bg-off);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    backdrop-filter:blur(16px) saturate(160%);
    border:1px solid var(--line);
    border-radius:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    flex-wrap:wrap;
    transition:border-color .15s ease;
  }
  .crumbs:empty{ display:none; }
  .crumbs button{
    background:none;border:none;cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    color:var(--ink-faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    padding:2px 0;
    position:relative;
    z-index:1;
  }
  .crumbs button:hover{color:var(--accent);}
  .crumbs .current{color:var(--ink); font-weight:600; position:relative; z-index:1;}
  .crumbs .sep{color:var(--line-soft); position:relative; z-index:1;}
  @media(max-width:620px){
    .search-row{ flex-direction:column; align-items:stretch; }
    .crumbs{ order:1; }
    .search-wrap{ order:0; flex-basis:auto; }
  }

  main{
    max-width:920px;
    margin:0 auto;
    padding:28px 24px 90px;
  }

  .cat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  @media(max-width:620px){ .cat-grid{grid-template-columns:1fr;} }
  @media(max-width:820px){
    .primera-layout{ grid-template-columns:1fr; }
    .primera-filters{
      position:static;
      flex-direction:row;
      overflow-x:auto;
      padding-bottom:6px;
      -webkit-overflow-scrolling:touch;
    }
    .primera-filter-btn{ flex-shrink:0; white-space:nowrap; }
  }

  .cat-card{
    background:var(--bg);
    border:none;
    padding:24px 22px 22px;
    cursor:pointer;
    text-align:left;
    transition:background .18s ease, transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
    display:flex;
    flex-direction:column;
    gap:16px;
    position:relative;
    overflow:hidden;
    z-index:0;
  }
  .cat-card::before,
  .crumbs::before,
  .search-wrap::before,
  .raw-search-wrap::before,
  .primera-filter-btn::before{
    content:"";
    position:absolute;
    top:0; left:-140%;
    width:70%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(0,140,255,0.30), rgba(124,92,255,0.22), transparent);
    transform:skewX(-20deg);
    transition:left .5s ease;
    z-index:0;
    pointer-events:none;
  }
  .cat-card:hover::before,
  .crumbs:hover::before,
  .search-wrap:hover::before,
  .raw-search-wrap:hover::before,
  .primera-filter-btn:hover::before{ left:140%; }
  .cat-card:hover{
    background:var(--bg-off);
    transform:translateY(-3px);
    box-shadow:0 10px 26px rgba(10,10,11,0.08);
    z-index:1;
  }
  .cat-card:active{ transform:translateY(-1px) scale(0.98); }
  .cat-card:hover .cat-name{color:var(--accent);}
  .cat-card:hover .cat-icon{ transform:scale(1.1) rotate(-4deg); box-shadow:0 6px 16px rgba(0,140,255,0.25); }
  .cat-icon{
    width:34px;height:34px;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease;
  }
  .cat-icon svg{width:17px;height:17px;}
  .cat-name{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:17px;
    line-height:1.3;
    color:var(--ink);
    transition:color .15s ease;
  }
  .cat-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-faint);
    letter-spacing:0.02em;
  }
  .cat-count::before{content:"[ "; }
  .cat-count::after{content:" ]"; }

  .tip-banner{
    background:var(--bg-off);
    border:1px solid var(--line);
    border-left:2px solid var(--ink-faint);
    border-radius:8px;
    padding:14px 16px;
    margin:24px 0 12px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .tip-banner:first-child{margin-top:0;}
  .tip-banner .tip-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    display:block;
    margin-bottom:6px;
  }

  .obj-item{
    background:var(--bg);
    border:1.5px solid #D3D3D6;
    border-left:3px solid var(--accent);
    border-radius:var(--radius-sm);
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:0 1px 4px rgba(10,10,11,0.05);
    transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .obj-item:hover{
    border-color:var(--accent);
    box-shadow:0 6px 18px rgba(0,140,255,0.14);
    transform:translateX(2px);
  }
  .obj-item.jump-flash{
    animation:jumpFlash .9s ease;
  }
  @keyframes jumpFlash{
    0%{ box-shadow:0 0 0 4px rgba(0,140,255,0.35); border-color:var(--accent); }
    100%{ box-shadow:0 1px 4px rgba(10,10,11,0.05); }
  }
  .obj-header{
    width:100%;
    background:none;
    border:none;
    cursor:pointer;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .obj-quote{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:20px;
    color:var(--accent);
    line-height:1;
    flex-shrink:0;
  }
  .obj-question{
    flex:1;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    line-height:1.4;
  }
  .obj-question .hl{background:var(--accent-dim); border-radius:3px; color:var(--ink);}
  .obj-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    white-space:nowrap;
    flex-shrink:0;
  }
  .obj-chevron{
    width:16px;height:16px;
    color:var(--ink-faint);
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .obj-item.open .obj-chevron{transform:rotate(180deg); color:var(--accent);}

  .obj-answers{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .obj-item.open .obj-answers{ max-height:none; }
  .obj-answers-inner{
    padding:2px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .ans-card{
    background:var(--bg-off);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:13px 14px;
    font-size:14px;
    line-height:1.6;
    color:var(--ink);
    cursor:pointer;
    position:relative;
    padding-right:38px;
    transition:background .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .ans-card:hover{ background:var(--accent-dim); border-color:var(--accent); transform:translateX(3px); box-shadow:-3px 0 0 var(--accent); }
  .ans-card.niche{
    background:var(--accent-dim);
    border:1.5px solid #A9D8FF;
  }
  .ans-card.niche:hover{ border-color:var(--accent); }
  .ans-card.tpl{
    background:#FFF6E5;
    border:1.5px solid #F5CD7E;
  }
  .ans-card.tpl:hover{ border-color:#D99A1B; }
  .ans-card .hl{background:#FCEFC5; border-radius:3px;}
  .ans-copy-icon{
    position:absolute;
    right:12px;
    top:13px;
    width:15px;
    height:15px;
    color:var(--ink-faint);
  }
  .ans-card:hover .ans-copy-icon{color:var(--accent);}
  .ans-card.copied{ background:#0A0A0B; border-color:#0A0A0B; color:#fff; }
  .ans-card.copied .ans-copy-icon{color:#7FD98A;}
  .ans-card.copied .ans-tag{color:rgba(255,255,255,0.5);}

  .ans-tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:7px;
  }
  .ans-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:500;
    letter-spacing:0.01em;
    color:var(--ink-faint);
  }
  .ans-tag::before{content:"["; }
  .ans-tag::after{content:"]"; }
  .ans-tag.accent{color:var(--accent);}
  .ans-tag.niche{
    color:#fff;
    background:var(--accent);
    padding:2px 6px;
    border-radius:4px;
    font-weight:600;
  }
  .ans-tag.niche::before, .ans-tag.niche::after{ content:""; }
  .ans-tag.template{
    color:#7A4B00;
    background:#FFD98A;
    padding:2px 7px;
    border-radius:4px;
    font-weight:700;
  }
  .ans-tag.template::before, .ans-tag.template::after{ content:""; }

  .search-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    margin-bottom:18px;
  }
  .search-group-title{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--accent);
    margin:28px 0 10px;
  }
  .raw-group-count{ color:var(--ink-faint); font-weight:400; text-transform:none; letter-spacing:0; white-space:nowrap; }
  .search-group-title:first-child{margin-top:0;}
  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-faint);
  }
  .empty-state svg{width:36px;height:36px; color:var(--line); margin-bottom:14px;}
  .empty-state p{font-size:14px; font-family:'IBM Plex Mono',monospace;}

  #toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    font-size:13.5px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:9px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:100;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast svg{width:15px;height:15px;color:#7FD98A;flex-shrink:0;}

  /* ---- Prime Era raw page + objections page: category sidebar (shared) ---- */
  /* ---- shared: category "jump to question" sidebar on the objections page ---- */
  .primera-layout{
    display:grid;
    grid-template-columns:200px 1fr;
    gap:26px;
    align-items:start;
  }
  .primera-filters{
    position:sticky;
    top:calc(var(--nav-h) + 100px);
    display:flex;
    flex-direction:column;
    gap:6px;
    width:200px;
    min-width:0;
    max-height:calc(100vh - var(--nav-h) - 120px);
    overflow-y:auto;
  }
  .primera-filter-btn{
    text-align:left;
    background:var(--bg-off);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
    display:flex;
    justify-content:space-between;
    gap:6px;
    overflow-wrap:anywhere;
    position:relative;
    overflow:hidden;
    isolation:isolate;
  }
  .primera-filter-btn .n{ font-family:'IBM Plex Mono',monospace; font-weight:500; color:var(--ink-faint); font-size:11px; white-space:nowrap; flex-shrink:0; position:relative; z-index:1; }
  .primera-filter-btn:hover{ border-color:var(--accent); }
  .primera-filter-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .primera-filter-btn.active .n{ color:rgba(255,255,255,0.75); }

  .primera-content{ min-width:0; }
  .primera-anim{ animation:primeraFadeIn .32s cubic-bezier(.2,.8,.3,1); }
  @keyframes primeraFadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .raw-card{
    background:var(--bg);
    border:1px solid #D3D3D6;
    border-radius:var(--radius-sm);
    margin-bottom:14px;
    overflow:hidden;
  }
  .raw-card-head{
    background:var(--bg-off);
    padding:13px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .raw-card-head .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .raw-question{
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    line-height:1.3;
  }
  .raw-card-body{ padding:14px 16px 16px; }
  .raw-message{
    background:var(--accent-dim);
    border:1.5px solid #A9D8FF;
    border-radius:8px;
    padding:12px 14px;
    padding-right:36px;
    font-size:14px;
    line-height:1.6;
    color:var(--ink);
    cursor:pointer;
    position:relative;
    margin-bottom:10px;
    transition:border-color .12s ease;
  }
  .raw-message:hover{ border-color:var(--accent); }
  .raw-message .ans-copy-icon{ top:12px; }
  .raw-message.copied{ background:#0A0A0B; border-color:#0A0A0B; color:#fff; }
  .raw-message.copied .ans-copy-icon{ color:#7FD98A; }
  .raw-explain{
    font-size:13px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .raw-explain-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
    display:block;
    margin-bottom:4px;
  }

  /* ---- light glass treatment for all translucent panels/plashки ---- */
  .cat-card, .obj-item, .ans-card, .raw-card, .raw-card-head,
  .primera-filter-btn, .tip-banner, .search-wrap input, .raw-search-wrap input,
  .brand{
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    backdrop-filter:blur(16px) saturate(160%);
  }
  .brand{
    display:inline-flex;
    background:var(--bg-off);
    border-radius:12px;
    padding:9px 16px;
    margin-bottom:18px;
  }
</style>
</head>
<body>

<div class="pe-grid-lines">
  <div class="pe-grid-line"></div>
  <div class="pe-grid-line accent"></div>

<script id="objections-data" type="application/json">[{"name": "Топ 5", "subgroups": [{"title": "__niche__", "tip": "Фразы для предвосхищения возражения — используйте на старте разговора / в первом сообщении, до того как клиент успеет возразить.", "objections": [{"question": "Мне не актуально / ничего не нужно", "answers": [{"text": "Скорее всего, вы сейчас не искали подрядчика по сайтам — я пишу первым, и это ок. Именно поэтому не предлагаю ничего заказывать: за 10 минут на созвоне покажу, за счёт чего продающая структура даёт заявки, а вы сами решите, актуально это вам или нет. Идёт?", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche-preempt", "tactic": "На опережение"}]}, {"question": "У вас нет кейсов в моей нише", "answers": [{"text": "Сразу честно: мы работаем с разными сферами, и кейса именно из вашей может пока не быть — сейчас как раз заходим в узкое нишевание. Именно поэтому предлагаю смотреть не на отрасль в портфолио, а на подход: продающая структура работает по единым принципам. На созвоне покажу, как соберу её под вашу задачу.", "tag": "Через пример", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche-preempt", "tactic": "На опережение"}]}, {"question": "Я передам руководителю / будем иметь в виду", "answers": [{"text": "Понимаю, решение не всегда за одним человеком, и это нормально. Именно поэтому, чтобы передать не „сайт за 80к“, а конкретную выгоду, давайте я за 10 минут на созвоне подготовлю короткое понимание под ваш бизнес — так руководителю будет что оценить по делу. Когда удобно?", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "niche-preempt", "tactic": "На опережение"}]}]}]}, {"name": "Возражения по цене", "subgroups": [{"title": "Скриншот 1 (Стр. 02–03)", "tip": "Возражение «Дорого» намного проще предотвратить (принцип «Пятна на рубашке» из «Школы личных продаж: система КЛОУЗЕР»), чем потом пытаться переубедить клиента. Часто я рекомендую не ждать, пока клиент озвучит возражение, а действовать на опережение — Вы можете сами озвучить наиболее вероятное будущее возражение клиента и сразу дать аргументированный ответ. Если не получилось предотвратить, используйте предложенные варианты ответов.", "objections": [{"question": "У Вас дорого!", "answers": [{"text": "Мы не просто дизайн — это полный цикл: структура, копирайтинг, сборка, запуск. Поэтому чек включает результат, а не только картинку. Давайте на созвоне покажу, из чего складывается цена и что именно вы получаете.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Цена = полный цикл"}, {"text": "Понимаю, цена важна. Давайте прикинем: если сайт приносит хотя бы 2–3 заявки в месяц в вашей нише, за какой срок он окупает вложение? Продающий лендинг обычно отбивается быстрее, чем кажется.", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "niche", "tactic": "Окупаемость"}, {"text": "Цену стоит смотреть не отдельно, а против результата: сайт, который не продаёт, — вот это дорого при любой сумме. Что для вас важнее — цена или заявки с сайта?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Цена vs. ценность"}, {"text": "[Имя Отчество], я назвал примерную цену. А вообще по цене могут быть варианты разные, в зависимости от наполнения / комплектации. Например, есть такой вариант (презентуем альтернативы)", "tag": "Через пример", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "[Имя Отчество], \"дорого\" по сравнению с другими аналогичными предложениями или вообще за эту услугу?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Цена — вопрос важный. При этом не самый главный, т. к. по цене мы с клиентами почти всегда договариваемся. Скажите, в целом Вам продукт / решение подходит?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Цену устанавливает производитель / разработчик. Поэтому она не будет существенно отличаться у других продавцов. Или для Вас такая цена в принципе высокая и нужно рассмотреть другие варианты?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "[Имя Отчество], конечно, такая услуга в такой комплектации стоит денег. При этом, чтобы Вы понимали, за что именно Вы платите, смотрите (кратко презентуем наполнение и результаты). Как видите, то, что Вы получите в итоге, перекрывает инвестиции", "tag": "Альтернатива", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Сейчас, возможно, есть единоразовая трата. Но давайте посчитаем, сколько получится сэкономить за год? А за три? Если сотрудники будут работать без чёткой системы, сколько можете потерять?", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "[Имя Отчество], в нашей ситуации, наверное, главный вопрос не \"Сколько стоит?\", а \"Стоит ли это того?\". Давайте ещё раз посмотрим, как быстро это должно окупиться", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 2 (Стр. 04)", "tip": "Я отношусь к возражениям как к «звоночку» — скорее всего, на предыдущих этапах взаимодействия с клиентом менеджер сделал что-то не так. Не прояснил до конца ситуацию клиента, не установил с ним контакт, не смог убедительно выступить в роли эксперта, да и презентация его была не на высоте. Хорошая новость в том, что критических возражений, способных на корню срубить сделку, не больше десятка. И если вы научитесь грамотно с ними работать, то сможете в большинстве случаев выходить на закрытие сделки.", "objections": [{"question": "Это высокая цена. В рекламе была меньше!", "answers": [{"text": "Действительно, цена в рекламе является базовой, и некоторые клиенты приобретают наш продукт именно за такую цену. Тут важно определиться по функционалу, что Вам действительно нужно. И насколько базовый комплект Вам подходит. Скажите, как...", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Да, такой вариант тоже есть / возможен. Как правило, мы с клиентами обсуждаем различные варианты и выбираем уже тот, который клиенту удобнее и (в итоге) выгоднее", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}, {"question": "Нет денег", "answers": [{"text": "Ок, тема в планах — это уже хорошо. „В будущем“ — это ближе к какому-то событию (сезон, запуск, рост), или просто пока не заложен бюджет?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Фиксация горизонта"}, {"text": "Раз в планах есть, предлагаю не терять время: на бесплатном созвоне накидаю, каким должен быть ваш сайт под задачу. К моменту бюджета у вас уже будет готовое ТЗ и понимание.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Полезный старт"}, {"text": "Нет денег в этом месяце или вообще пока не видите смысла покупать этот продукт?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Вопрос с оплатой мы с клиентами обычно решаем, договариваемся. Сейчас важно понять, нужна ли Вам вообще эта услуга или пока нет?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Да, сейчас такое время)) Давайте определимся, а нужен ли Вам этот продукт вообще", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "[Имя Отчество], а вообще деньги в этом направлении периодически выделяете (на рекламу, на обучение сотрудников и т. д.)? В таком случае мы можем так поступить: сделать пилотный проект и оценить, насколько работа с нами будет выгодна, сколько Вы сможете заработать, сэкономить? А потом будем принимать решение", "tag": "С цифрами", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 3 (Стр. 05)", "tip": "Смотрели фильм «Волк с Уолл-Стрит» с Леонардо Ди Каприо? В основе этого фильма лежит история Джордана Белфорта, который заработал состояние на продаже по телефону акций дешёвых компаний. Мне очень запомнилась фраза с тренинга Джордана Белфорта: «Продажи — это процесс передачи Вашей веры в продукт Вашему клиенту». А Вы верите в свой продукт? Сможете передать веру клиенту? Если да, Вы легко будете справляться с любыми возражениями и отговорками.", "objections": [{"question": "У Вас подозрительно дёшево", "answers": [{"text": "[Имя Отчество], после первых сделок наши клиенты обычно говорят: \"Спасибо! А мы думали, такой продукт стоит гораздо дороже!\". Мы знаем, как выстроить процесс, чтобы избавить Вас от ненужных переплат. При этом у нас есть гарантия, и Вы можете быть уверены в...", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Вы правильно заметили, что наши цены ниже среднерыночных, и вот почему: (большие корпоративные скидки, прямые поставки, надёжные партнёры и т. д.)", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "А какая цена была бы для Вас оптимальной? Уверен, тут я смогу договориться со своим руководством))", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}, {"question": "У Вас нет отсрочки платежа", "answers": [{"text": "Действительно, базовые условия её не предполагают. Скажите, насколько для Вас это принципиальный момент?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Чем именно Вам это неудобно? Какую отсрочку Вы бы сами хотели?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Мы готовы сделать Вам отсрочку, при условии (большого заказа, либо своевременной оплаты 3 заказов и т. д.), готовы так работать?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 4 (Стр. 06)", "tip": "Я всегда стараюсь передавать менеджерам такую мысль — при работе с ценой помните, что большинство клиентов не хотят самых дешёвых вещей. Они хотят получить максимально выгодную сделку с учётом всех параметров, а не только цены. Вот Вы хотите «самое дешёвое»? Телефон и часы подешёвле? Автомобиль подешёвле или туфли? Разве Вы выбираете по принципу самое дешёвое? Уверен, что нет. Так и клиенты. Не спешите сразу предлагать самое дешёвое, давать скидки и т. д. Продавать можно и без скидок.", "objections": [{"question": "Я не готов платить до оказания услуги / поставки продукта", "answers": [{"text": "Вы рассматриваете оплату после поставки, потому что сейчас нет возможности сделать предоплату или потому что хотите сначала убедиться, что товар качественный, и сразу после этого оплатить?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Понимаю, что важно подобрать комфортную форму расчёта. Почему для Вас именно постоплата важна?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Мы знаем, что постоплата удобна многим нашим клиентам, поэтому работаем в таком формате после первых 3-х заказов. Это предусмотрено у нас программой лояльности. Давайте сделаем расчёт...", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Дайте мне скидку 20%", "answers": [{"text": "Мы можем обсуждать индивидуальные условия в каждом проекте. Давайте посмотрим, за счёт чего можно снизить стоимость в нашей ситуации (смотрим наполнение, показываем ценность и обоснованность цены. Часто клиенты передумывают просить скидку и покупают по полной цене)", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Почему именно 20%? У Вас есть жёсткий бюджет или Вы ориентируетесь на какой-то вариант конкурентов?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "У Вас есть жёсткое ограничение по бюджету? Давайте посмотрим другие тарифы, чтобы выбрать лучший вариант в рамках существующего бюджета, хорошо?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 5 (Стр. 07)", "tip": "Когда клиент спрашивает: \"Сколько стоит?\", недостаточно просто назвать цену. Цену нужно не называть, а презентовать. Презентовать — это прежде всего донести ценность предложения, показать окупаемость Вашего решения и дать клиенту чёткую причину, почему именно у Вас ему выгоднее покупать. Если Вы будете презентовать цену — Вы легко предвосхитите возражения по цене.", "objections": [{"question": "Я буду искать более низкую цену на рынке", "answers": [{"text": "Понимаю. По цене на рынке есть много предложений. А что для Вас важно при выборе этого продукта помимо цены?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "У Вас есть какой-то строгий бюджет или Вы планируете в целом оценить рынок и найти более выгодный вариант?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Если составить список из 3-х важнейших для Вас критериев при покупке этого продукта, в эту тройку точно войдёт цена, правильно понимаю? И что ещё, кроме цены?", "tag": "С цифрами", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Сориентируйте, а в какие сроки Вам важно, чтобы всё было готово (установлено, настроено, работало на Вас)? Уже смотрели какие-то варианты по цене? Какие там плюсы / минусы?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "Подожду, пока у Вас будет акция", "answers": [{"text": "То есть Вы уже точно понимаете, что именно этот вариант подходит лучше всего, и хочется дождаться более выгодных условий? Сейчас я расскажу, как можно получить бонусы / подарки сегодня...", "tag": "Альтернатива", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Акции у нас бывают, при этом довольно редко. А почему для Вас важно акции дождаться? Часто бывает, что клиентам выгоднее уже сейчас купить и начать пользоваться, чем ждать акций и терять время. Вы когда планируете начать использовать?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Иногда у нас бывают акции, которые позволяют получить дополнительные бонусы, подарки или небольшие скидки. Вы хотели бы скидку или бонус получить?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 6 (Стр. 08)", "tip": "Главное правило при работе со скидками звучит очень просто — не давайте скидок просто так. Да, клиенты могут спрашивать \"А есть ли у Вас скидки?\", но это не означает, что такие скидки нужно сразу давать. Это не означает, что клиент не готов купить по полной цене. Можно ли давать клиентам скидки? Можно, но не просто так. Понимаете? Как только клиент поймёт, что любая скидка должна быть обоснованной, Ваше предложение в его глазах будет выглядеть ещё сильнее.", "objections": [{"question": "Я рассчитывал на более низкую цену", "answers": [{"text": "У Вас есть жёсткий бюджет, в который нужно уложиться, или просто рассчитывали, что такие услуги должны стоить дешевле?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Вы уже смотрели аналогичные варианты по ценам, функционалу? Какие преимущества видите в нашем предложении?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "По цене у нас есть несколько вариантов. Давайте обсудим их через пару минут. А сейчас по функционалу / наполнению — скажите, это то, что Вам нужно?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "А скидки есть какие-нибудь?", "answers": [{"text": "У нас есть система лояльности, которая предусматривает бонусы, подарки и скидки при определённых условиях. Например, на каждый второй заказ мы предоставляем...", "tag": "Через пример", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Да, у нас есть скидки при определённых условиях: например, полная предоплата в течение 2 дней или заказ 3-х и более услуг. Скажите, пожалуйста, у Вас бывают в бизнесе... (перечисляем ситуации, в которых могут быть нужны наши доп. услуги. Повышаем средний чек)", "tag": "С цифрами", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Данный продукт является премиальным, поэтому скидок на него не предоставляем. Наоборот — цены периодически повышаются. Давайте оценим, насколько это окупается и выгодно для Вас на текущих условиях?", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}]}, {"name": "Возражения по продукту", "subgroups": [{"title": "Скриншот 7 (Стр. 09)", "tip": "Задавайте вовлекающий вопрос после озвучивания цены. Например, Вы озвучили клиенту, что кондиционер, который ему понравился, стоит 100 000 рублей, тут же продолжите: «Сейчас в наличии на складе 5 штук. Вы сейчас просто присматриваетесь или уже хотели бы установить в ближайшее время?». Такой подход позволяет не оставить продажу после озвучивания цены, а продолжить диалог и с большей вероятностью закрыть сделку.", "objections": [{"question": "У Вас очень неудобные сроки поставки (функционал и т.д.)", "answers": [{"text": "Расскажите, какие сроки были бы для Вас приемлемы? Подумаем, что можно сделать", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Скажите, в чём именно для Вас неудобство наших сроков? Давайте попробуем построить работу так, чтобы решить этот вопрос", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Вашу программу / услугу слишком долго настраивать", "answers": [{"text": "Настройка и интеграция действительно очень важны. Поэтому мы продумали её до мельчайших шагов. Скажите, в какие сроки хотели бы уложиться? Подумаем, что можно сделать", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Скажите, если обучение и интеграцию мы полностью возьмём на себя, от Вас только принципиальное согласие, так подойдёт?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Другими словами, Вас смущает технический момент, связанный с интеграцией. Это единственное, что останавливает?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Скажите, Вас тут что больше смущает: собственные усилия или время на интеграцию? Тут фактически всё зависит от нас с Вами, насколько мы точно оценим ресурсы на старте и договоримся. И хорошо, что мы это сейчас можем с Вами открыто обсуждать. Давайте посмотрим наше предложение по настройке", "tag": "Альтернатива", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 8 (Стр. 10)", "tip": "Что значит работать с возражениями? Если вы хотите продавать больше, Вам нужно освоить две вещи. Первое — предвосхищать возражения. То есть выстраивать продажу так, чтобы возражения вообще не появлялись. И второй момент — использовать проверенные стратегии и речевые приёмы для эффективной обработки возражений, которые всё же возникли во время разговора с клиентом.", "objections": [{"question": "Ваш продукт нам не подходит (нужен другой формат, функционал)", "answers": [{"text": "Понял, а какой для Вас идеальный вариант? У нас есть разные варианты комплектации / наполнения, поэтому мы можем подобрать тот вариант, который подойдёт именно Вам", "tag": "Альтернатива", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Расскажите, пожалуйста, какой формат или функционал Вам нужен? Возможно, у нас получится максимально адаптировать под Вас этот продукт или подобрать альтернативу", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Вы имеете в виду, что функционал избыточный для Вашей ситуации, или наоборот, чего-то не хватает?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "Ваш продукт быстро устаревает, мне нужно всё новое!", "answers": [{"text": "Сейчас рынок меняется очень быстро, согласен с Вами. Именно поэтому у нас есть регулярные обновления продукта. Смотрите, как это выглядит...", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Согласен, что в этой сфере всё очень быстро меняется. Поэтому наш продукт создан так, чтобы долгое время выполнять главные задачи и давать вам результат. Я же правильно понимаю, что текущая версия продукта решает Ваши задачи?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Хорошо, что Вы следите за новинками. Наш продукт действительно может не быть последней моделью через год, но мы гарантируем его актуальность и эффективность на протяжении всего срока службы. У нас предусмотрены регулярные обновления, вот пример...", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 9 (Стр. 11)", "tip": "Используйте технику «АнтиСПАМ». Забудьте о банальных и набивших всем оскомину формулировках. Услышав такие сочетания, как «хорошее предложение», «взаимовыгодное сотрудничество» или «стратегическое партнёрство», секретарь или ЛПР отмахнётся от вас, как от назойливой мухи: «Спасибо, я подумаю, вышлите коммерческое предложение...». Исключите из своей речи банальные СПАМ-слова, и клиенты чаще будут говорить вам \"Да!\"", "objections": [{"question": "Ваше оборудование очень дорогое в обслуживании", "answers": [{"text": "Я понимаю, насколько важно, чтобы оборудование работало бесперебойно, без простоев. Именно поэтому мы особое внимание уделяем обслуживанию, регулярным проверкам и быстрому устранению любых проблем. Именно такое обслуживание даёт максимальную окупаемость в короткие сроки. Давайте посчитаем...", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "Вы сравниваете с каким-то конкретным оборудованием или в целом рассчитывали на меньшую стоимость обслуживания?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Да, обслуживание стоит денег, при этом стоимость обслуживания составляет всего несколько процентов от стоимости самого оборудования, и самое главное — за счёт грамотного обслуживания оборудование окупается за счёт долговечности и стабильной работы. В итоге это приносит гораздо больше денег", "tag": "С цифрами", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}, {"question": "Я не чувствую, что Ваше предложение — лучшее для меня", "answers": [{"text": "Понятно, что хочется выбрать самое выгодное. А что именно вызывает сомнения? Давайте посмотрим, что можно сделать лучше", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Если по 10-балльной шкале оценить наше предложение, сколько бы Вы поставили? Почему именно такой балл? Что больше всего нравится и что хотели бы улучшить?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 1 (Стр. 18 из 62)", "tip": "Используйте позитивные формулировки во время презентации. Я часто вижу, как продавцы сами притягивают возражения, когда рассказывают о продукте. Например, «доставка этого товара возможна, но будет через 3 логистических центра и может занять 2 недели...». Даже эта вырванная из контекста фраза заставляет клиента напрячься и провоцирует на возражения. А ведь продавец мог использовать позитивную формулировку: «Доставка этого товара возможна, уже через 2 недели будет у Вас. Это самый быстрый способ на сегодняшний день».", "objections": [{"question": "Ваш продукт не учитывает нашу специфику", "answers": [{"text": "Согласен, что в каждом проекте есть специфика. Поэтому у нас есть опыт адаптации нашего продукта под разные задачи. Расскажите, какая у Вас специфика, и мы найдём решение", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Вы имеете в виду региональную специфику, отраслевую или ...? Расскажите, пожалуйста, это важный момент — мы всегда учитываем специфику каждого проекта, так как это прямо влияет на результат", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Мы знаем, насколько важно учитывать специфику в каждом проекте. Поэтому наша работа начинается с анализа Вашей ситуации. У нас есть отраслевой опросник для выявления всех нюансов, который помогает грамотно выстроить работу. Кстати, из Вашей отрасли у нас также есть кейсы. Хотите посмотреть?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "Мне не нравится Ваш функционал / дизайн / материалы / состав", "answers": [{"text": "Да, понял, дизайн / доп. функционал можем обсудить отдельно, это решаемый вопрос. Главное понять, а в целом этот продукт решает Ваши главные задачи?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Скажите, а что бы Вы хотели увидеть в идеале? Есть примеры, как это может выглядеть?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "__niche__", "tip": "", "objections": [{"question": "Сайт за 2 часа конвертит, а дорогой — нет", "answers": [{"text": "Так бывает — и это как раз показывает, что дело не в бюджете, а в структуре и трафике. Дорогой сайт без продающей логики тоже не выстрелит. Давайте на созвоне разберём, почему один конвертит, а другой нет — покажу, что реально влияет на заявки.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Разбор причины"}]}, {"question": "Мне нужна другая CMS, не Tilda", "answers": [{"text": "Понял. А почему принципиально не Tilda — есть конкретные требования (интеграции, нагрузка, каталог)? Иногда за этим стоит миф, а иногда реальная задача. Расскажите — подскажу, подойдём мы вам или честно скажу, что нет.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "niche", "tactic": "Уточнение задачи"}]}, {"question": "Я не гоню рекламу, сайт бесполезен / вы не делаете рекламу", "answers": [{"text": "Справедливо — без трафика любой сайт молчит. Именно поэтому продающий сайт и запуск трафика работают в связке. Давайте разберём, как выстроить это вместе, чтобы вложение в сайт не простаивало. С какого канала планируете вести людей?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Логика связки"}, {"text": "Верно, рекламу мы не ведём — наша зона это продающий сайт, который превращает трафик в заявки. Если сайт не продаёт, реклама сливает бюджет. Давайте сделаем так, чтобы посадочная работала, а по трафику подскажу проверенных подрядчиков.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Честность о зоне ответственности"}]}]}]}, {"name": "Возражения при отсутствии потребности", "subgroups": [{"title": "Скриншот 2 (Стр. 20 из 62)", "tip": "На мой взгляд, для преодоления такого возражения важно понять, что за ним стоит: клиент работает с другими и не хочет ничего менять, его всё устраивает, и он не планирует пользоваться таким продуктом; для него это не актуально именно в данный момент, а в будущем потребность может появиться и т. д. Именно поэтому я предлагаю варианты ответов, направленные на прояснение ситуации. Как только Вы поймёте, по какой причине предложение неактуально, Вы сможете преодолеть это возражение.", "objections": [{"question": "Нам неинтересно, не актуально", "answers": [{"text": "Понял, не буду отнимать время. Один вопрос напоследок: тема сайтов вообще не в фокусе, или просто сейчас неудачный момент? Пойму любой ответ.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "niche", "tactic": "Уважительный выход"}, {"text": "Понял. Не актуально, потому что сайт уже есть и всё устраивает, или потому что это направление сейчас вообще не в приоритете?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Уточнение сути"}, {"text": "Согласен, навязывать сайт смысла нет. Именно поэтому вопрос проще: заявки сейчас идут стабильно, или основной поток из других каналов?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "niche", "tactic": "Вход через задачу"}, {"text": "Вам это не нужно сейчас, или Вы вообще не пользуетесь такими услугами?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Вы уже всё купили, или у Вас израсходован бюджет? Вы имеете в виду, что работаете уже с другими или сейчас у Вас несезон?..", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Возможно, Вам ничего не нужно сейчас, при этом, учитывая, что Ваша компания постоянно развивается и растёт, наше предложение может быть очень актуально уже в ближайшее время. Скажите, у Вас бывает такое (вопрос по ситуации клиента с целью вовлечения)?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "Нам ничего не нужно", "answers": [{"text": "Не нужно, потому что уже работаете с другими или потому что вообще не пользуетесь такими услугами?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Не нужно именно сейчас или вообще не планируете развивать это направление?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Скажите, а у Вас бывают такие ситуации, когда [проблема]?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Я согласен, что если нет выгоды, то нет и смысла пользоваться сервисом / продуктом. [Имя Отчество], я же правильно понимаю, что у Вас есть менеджеры в отделе продаж? По нашему опыту, менеджеры начинают продавать больше при использовании скриптов продаж. Я хотел показать Вам варианты скриптов для Вашей ситуации. Когда будет удобно обсудить?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 3 (Стр. 21 из 62)", "tip": "Как думаете, что может означать фраза «Замолчи! И начни, наконец, продавать!»? Многие думают, что хорошие продавцы много и красиво говорят. Это не совсем так. Да, в некоторые моменты действительно нужно красиво говорить. Но лишь в некоторые моменты. А в остальное время нужно слушать. Задавать вопросы и снова слушать. Если клиент озвучивает негатив, делится прошлым опытом, не спешите говорить: «А у нас по-другому!». Просто послушайте клиента и покажите, что услышали его.", "objections": [{"question": "Я не пользуюсь этим принципиально", "answers": [{"text": "Вы имеете в виду нашу компанию, или Вы вообще не пользуетесь такими услугами?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "[Имя Отчество], скажите, пожалуйста, не нужно, потому что Вы этим вообще не пользуетесь или потому что работаете с другими поставщиками?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "[Имя Отчество], а Вы пробовали раньше пользоваться этим? Как результаты?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "Мы уже пробовали. Не понравилось", "answers": [{"text": "Не понравилась работа поставщика или сам продукт не дал нужного эффекта?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "О! А что случилось? Можете рассказать подробности? А если бы не этот момент, в остальном Вам как?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Скажите, а как давно это было? Для чего покупали, какие задачи были?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Знаете, по опыту, внедрение чего-то нового редко на старте делает всех довольными и счастливыми. Понятно, что это проект, с планируемыми преимуществами и выгодой, но, как правило, через какое-то время. Давайте попробуем прояснить, где в прошлый раз возникли сложности и как заранее обойти этот момент", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 4 (Стр. 22 из 62)", "tip": "Однажды мой сотрудник делал звонок в компанию, чтобы пригласить менеджеров на обучение в школу продаж. Ответ руководителя был очень суровым и категоричным: «Зачем их обучать? Они сами кого хочешь могут обучить! До свидания!». И клиентов с таким мышлением немало. Мы всё знаем. Мы всё умеем. Мы всё сделаем сами. В большинстве случаев, как Вы понимаете, это просто слова человека, не погружённого в детали, которому кажется, что всё просто и легко. Погружайте клиента в детали проекта, показывайте экспертность и сложность, чтобы они поняли: без Вас — никак!", "objections": [{"question": "Мне уже предлагали это. Я отказался (по телефону)", "answers": [{"text": "А для чего рассматривали покупку? Почему решили отказаться? Смотрите, время идёт, ситуация меняется, продукт сам по себе тоже реагирует на рынок. Я предлагаю обсудить детали и оценить, насколько в текущей ситуации это может Вам подойти", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "[Имя Отчество], понимаю, что Вы уже рассматривали ранее такую услугу. При этом многое уже поменялось. Причём в лучшую сторону. Смотрите, какие появились возможности", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}, {"question": "Я лучше сделаю это своими силами (сайт, обучение сотрудников, настройка CRM и т.д.)", "answers": [{"text": "Здорово, что есть кому заниматься. Дизайнер делает красиво — а мы делаем так, чтобы сайт продавал: структура, офферы, копирайтинг под заявку. Это разные задачи. Сколько заявок сейчас даёт сайт?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Дизайн ≠ продажи"}, {"text": "Нейросеть реально помогает — мы сами ими пользуемся в работе. Но ИИ выдаёт шаблон, а не продающую структуру под ваш бизнес, офферы и путь клиента. Именно поэтому сайты „из ИИ“ красивы, но часто не конвертят. Вам важна картинка или заявки?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Инструмент ≠ результат"}, {"text": "[Имя Отчество], понятно, что многое можно сделать самому, погрузившись в тему, изучив и разобравшись, как это делается. Попробовав раз-два, с третьего-то что-то выйдет. Вопрос в другом: сколько времени это займёт, и какие есть риски?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Хорошо, [Имя Отчество], когда планируете этим заняться? Спрашиваю, потому что, как говорится, время — деньги. Может быть, с нами Вы сделаете быстрее и уже через месяц получите первые результаты. Давайте посчитаем?", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "[Имя Отчество], кстати, Ваш вклад здесь в любом случае нужен, даже если Вы закажете услугу у нас. Смотрите, как выглядит процесс и какие моменты важно учесть", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "\"Лучше своими силами?\" А почему лучше? Это качественнее, быстрее? Или вопрос в цене?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 5 (Стр. 23 из 62)", "tip": "По моему опыту, слово «кризис» часто используется менеджерами и руководителями, чтобы оправдать падение продаж, невыполнение планов, и, самое главное, отсутствие чёткой стратегии развития компании в период спада экономики страны / мира. Да, в кризис рынок сужается во многих отраслях, но значит ли это, что клиенты вообще перестают покупать? Конечно, нет. Клиентам нужен товар, который Вы реализуете. Вопрос лишь в том, купят ли они у Вас или у тех, кто лучше подготовился к кризису и разработал «антикризисные предложения», от которых глупо отказываться.", "objections": [{"question": "Сейчас кризис, надо экономить и затянуть пояса, не покупать лишнего", "answers": [{"text": "Согласен, [Имя Отчество], что кризис лучше переждать. Особенно если знать, когда и чем он закончится 🙃. А учитывая, что мы этого не знаем, давайте посмотрим, как в условиях кризиса можно улучшить процессы благодаря нашему продукту...", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "[Имя Отчество], есть мнение, что кризис лучше переждать не высовываясь, в режиме максимального сохранения энергии. Если бы только знать точно, когда он закончится. А поскольку мы с Вами не знаем, когда он закончится и чем закончится, важно принимать взвешенные решения", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Насчёт экономии согласен с Вами. Именно это я и хотел обсудить, так как по нашему опыту внедрив продукт / сервис, Вы будете экономить 20% расходов на рекламу. Какой у Вас примерный бюджет на рекламу?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "Когда будет нужно — сам обращусь к Вам", "answers": [{"text": "[Имя Отчество], скажите, а сейчас как решаете эту [проблему]?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "[Имя Отчество], хорошо, отметил себе. Кстати, чтобы у Вас было представление, что это даст в Вашей ситуации и сколько может стоить, давайте сделаем [бесплатный первый шаг]", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "А вообще у Вас бывают сейчас такие ситуации, когда [ситуация, в которой возникает потребность в Вашем продукте]...?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 6 (Стр. 24 из 62)", "tip": "Я помню, как читал отчёт тайного покупателя и прослушивал записи переговоров, и в строке «Как менеджер ответил на возражения» было написано следующее: никак. Менеджер проигнорировал возражения клиента, оставил без ответа. Такое бывает, когда у сотрудника нет аргументов для ответа. Это говорит о слабой подготовке эксперта. Ни одно из возражений клиента не должно остаться незамеченным. Это правило.", "objections": [{"question": "Мы решим эту задачу другим способом, без Вашего продукта", "answers": [{"text": "Вы имеете в виду \"своими силами\" или \"с другой компанией\"? Да, есть разные способы решения, давайте оценим плюсы и минусы каждого...", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Понимаю. Клиенты часто рассматривают минимум 3 варианта решения, поэтому я подготовил сравнительную таблицу с нюансами. Давайте посмотрим...", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "А почему решили рассматривать альтернативы? Как Вам наш продукт по функционалу? По цене?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "В моей ситуации это не сработает!", "answers": [{"text": "Я понимаю, что есть сомнения. А какие нюансы видите именно в Вашей ситуации? Что важно учесть, чтобы всё сработало, на Ваш взгляд?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "А какое идеальное решение видите с учётом Вашего опыта и специфики ситуации?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "У нас были случаи, когда люди думали так же при обсуждении условий проекта. При этом, когда мы разработали детальный план проекта, мы согласовали все детали и успешно реализовали проект", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Чтобы всё прошло успешно, очень важен Ваш настрой. Я дам Вам контакты наших клиентов из такой же сферы — обсудите с ними, как это сработало. И если Ваш настрой изменится — согласуем детали проекта. Как считаете?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 7 (Стр. 25 из 62)", "tip": "Большая ошибка — обесценить позицию клиента фразами «Вы не правы, я лучше знаю, Вы просто не разбираетесь...». Даже если менеджер найдёт сильный аргумент в свою пользу и приведёт его клиенту, как думаете, как отреагирует последний? Скажет ли он: «Ну точно, так и есть, согласен с Вами!»? Это большая редкость. Никто не любит быть побеждённым в споре. Поэтому, скорее всего, покупатель скажет: «Ну не знаю. Ладно, спасибо, всего доброго».", "objections": [{"question": "Спасибо, я просто смотрю! Покупать пока не планирую", "answers": [{"text": "Да, пожалуйста. У нас есть бесплатный каталог с обзором всей продукции / услуг для разных ситуаций, выслать Вам в мессенджер или на e-mail?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Понимаю, поэтому буду рад ответить на вопросы, если они появятся, и рассказать про актуальные акции, хорошо?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Хорошо! Пока Вы смотрите основное, я сейчас покажу Вам некоторые новинки и предложение месяца, чтобы у Вас было полное представление...", "tag": "Альтернатива", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "__niche__", "tip": "", "objections": [{"question": "Мы только что обновили сайт", "answers": [{"text": "Отлично, что занимались этим. Уточню один момент: после обновления заявок стало ощутимо больше? Иногда обновляют визуал, а продающая логика остаётся прежней — и заявки не растут.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "niche", "tactic": "Проверка через результат"}]}]}]}, {"name": "Возражения из-за сомнений, недоверия", "subgroups": [{"title": "Скриншот 8 (Стр. 26 из 62)", "tip": "Представьте ситуацию: клиент выдаёт какое-то возражение, менеджер как настоящий профи легко на него отвечает, а потом замолкает и просто смотрит на покупателя. Менеджеры думают, что клиенту ничего не остаётся, как ответить: «Да, я покупаю». Но этого не происходит. Цель продавца — не просто ответить, а добиться прогресса в сделке. Поэтому спросите клиента, остались ли ещё какие-то вопросы, и предложите ему следующий шаг. Не допускайте выхода клиента из разговора, когда он скажет, что всё понял и будет думать.", "objections": [{"question": "Я хотел бы работать с более надёжной компанией", "answers": [{"text": "[Имя Отчество], понимаю, надёжность сейчас для многих компаний важнее, чем цена. Скажите, какие гарантии мы можем дать дополнительно, чтобы работать с Вами?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "А Вы рассматриваете рекомендации (наших клиентов, или компаний из той же отрасли)?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "[Имя Отчество], по опыту, когда клиенты говорят о надёжности, очень часто имеют в виду наш опыт, реализованные проекты и отзывы от клиентов. А что для вас было бы важно, чтобы убедиться, что наша компания — это серьёзный партнёр, с которым можно и нужно работать?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "[Имя Отчество], надёжность контрагентов очень важна, мы это понимаем, поэтому со своей стороны готовы предоставить все необходимые материалы. Что могло бы Вам помочь в принятии решения?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "У Вас много негативных отзывов", "answers": [{"text": "А какие именно отзывы Вы имеете в виду? [Имя Отчество], мы же с Вами понимаем, кто и зачем может быть заинтересован в такой информации о крупной и давно работающей компании (на высококонкурентном рынке)", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Да, я тоже сталкивался с негативными оценками. И, к сожалению, люди пишут негативные отзывы гораздо легче, чем положительные. Тут важно понимать, что у компании много клиентов и много отзывов. И отзывов разных. Готов Вас познакомить с благодарственными письмами и рекомендациями от клиентов", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "[Имя Отчество], репутация в наше время — это всё. Поэтому мы особое внимание уделяем тому, чтобы клиенты получали то, что хотели. Какие отзывы Вы имеете в виду? Давайте разберёмся", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 9 (Стр. 27 из 62)", "tip": "Можно ли научиться продавать или это врождённый навык: кому-то дано, кому-то — нет? Я искренне считаю, что продажи — это навык, который развивается. Когда-то я сам думал, что в силу своего характера я никогда не смогу продавать, а тем более продавать на «холодных звонках». А сегодня мои видео с холодными звонками являются наиболее просматриваемыми на Youtube. Более того, я считаю навык продаж важнейшим в повседневной жизни: ведь мы продаём наши навыки и опыт работодателям, продаём идеи друзьям, коллегам и руководству, продаём товары, услуги, бизнес. Этот навык напрямую влияет на наш доход! Развитые навыки продаж помогают нам убеждать людей и добиваться гораздо большего практически в любых проектах. Прокачивайте свои навыки продаж!", "objections": [{"question": "Никогда раньше о Вас не слышал", "answers": [{"text": "С большинством наших клиентов мы начинали сотрудничать ровно с этой же фразы, давайте смотреть друг на друга в деле", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Да, есть компании, которые у многих на слуху, рекламируются по ТВ и радио. Мы из другой ниши, долгое время специализировались на услугах для государственных корпораций и крупных компаний и хорошо себя в этом зарекомендовали, на текущий момент прорабатываем новые ниши, в связи с чем активно работаем с предпринимателями и готовы давать более выгодные условия", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Скорее всего, Вы слышали о наших проектах (перечисляем). Ранее работали только с крупными заказчиками и застройщиками (например, ___), с этого года развиваем новое / розничное направление", "tag": "Через пример", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}, {"question": "У Вас мало опыта! Вы молодая компания!", "answers": [{"text": "Если смотреть на саму компанию, то да — нам всего 1–2 года. При этом если посмотреть на опыт и реализованные проекты наших сотрудников, видно, что команда готова справиться с большинством задач. Давайте посмотрим по Вашей ситуации", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "[Имя Отчество], мы молодая компания, это так. При этом наши специалисты имеют суммарный опыт в сфере более 20 лет. И что ещё важно — мы понимаем, что нам для развития нужны Ваши положительные отзывы и результаты. Мы сделаем всё, чтобы Вы получили результат. Попробуем?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 10 (Стр. 28 из 62)", "tip": "Как создать банк возражений? Для начала выпишите все возражения, с которыми Вы чаще всего сталкиваетесь при общении с клиентами, с учётом вашей специфики, опыта, продукта, региона и так далее. Рядом с каждым возражением запишите не конкретный ответ, а стратегию работы с ним. То есть, Ваша цель — в первую очередь проработать логику общения с клиентом в целом, а после этого — подобрать конкретные формулировки для ответов на возражения.", "objections": [{"question": "У Вас нет кейсов с моей спецификой / Вы не разбираетесь в моём бизнесе", "answers": [{"text": "Как раз наоборот — мы специализируемся на сайтах для [ЖК/автосалонов]. Мы знаем, что в вашей сфере покупатель смотрит [конкретика ниши], и строим сайт под это. Покажу кейсы именно из вашей отрасли на созвоне.", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche-template", "tactic": "Нишевая специализация"}, {"text": "Спасибо за честность. А что именно смущает — визуал, отсутствие кейса из вашей сферы или что-то ещё?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "niche", "tactic": "Уточнение"}, {"text": "Наш сайт мы сейчас как раз переделываем — новый уже с сильным продающим копирайтингом. Именно поэтому предлагаю оценивать не старые скрины, а логику: на созвоне покажу, как построю структуру под вашу задачу.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Подход важнее картинок"}, {"text": "Действительно, именно с таким бизнесом мы не работали. При этом мы работали уже со 100+ разными бизнесами, в каждом есть своя специфика, и мы понимаем, насколько важно это учитывать для эффективной работы. Вы продаёте услуги / товары, а мы работали с десятками компаний, которые тоже продают услуги / товары. Давайте рассмотрим специфику Вашего проекта и согласуем план работы с учётом всех нюансов", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "Конечно, мы не разбираемся в Вашем продукте так глубоко, как Вы. При этом мы разбираемся в своей области. И когда мы запускаем проект, мы всегда проводим встречи с Вами, чтобы разобраться в специфике и учесть все нюансы. Например, у нас есть похожие кейсы из других сфер, смотрите...", "tag": "Через пример", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Слишком хорошо, чтобы быть правдой. В чём подвох?", "answers": [{"text": "Предложение действительно выгодное. Мы даже проводили опросы покупателей, чтобы разработать именно такой продукт. Кстати, Вы уже видели кейсы наших клиентов?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Спасибо, что так оценили. Мы изучили рынок, конкурентов, спрос покупателей, что позволило нам организовать работу ещё лучше и сделать такое предложение. Давайте обсудим план проекта в деталях?", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 1 (Стр. 29 из 62 / Нумерация книги: 22)", "tip": "Никогда не притворяйтесь, что что-то знаете, если Вы этого не знаете. Это особенно касается новичков, которые хотят впечатлить клиента своей «экспертностью». Если не знаете ответ на сложный вопрос, лучше сказать честно: «Пока затрудняюсь ответить, но я уточню информацию по этому вопросу и обязательно свяжусь с Вами». Ничего в этом страшного нет. ### Полезные ссылки Смотрите разбор для собственников бизнеса: КАК ПРОДАВАТЬ ДОРОГО, когда все требуют скидку и рынок поделен? [Смотреть видео]", "objections": [{"question": "Я покупал такое раньше — это не работает! Пустая трата денег!", "answers": [{"text": "Понимаю, если прошлый опыт разочаровал — доверия к сайтам мало. Скорее всего, делали красиво, но без продающей логики или без трафика. Давайте разберём, что тогда пошло не так, — покажу, чем наш подход отличается.", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Ведёт дальше", "source": "niche", "tactic": "Разбор негативного опыта"}, {"text": "Жаль слышать, что так вышло. Что именно Вы покупали? Это вообще не сработало или какой-то эффект все-таки был?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Понял Вас. Я знаю нескольких клиентов, которые раньше уже пробовали это у других поставщиков, но эффекта не было. Когда мы с ними погружались в детали — сразу понимали причину. Давайте разберем Вашу ситуацию?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Я знаю, насколько важно, чтобы Ваши инвестиции окупились. Поэтому у нас есть таблица для расчета окупаемости и детальная схема работы с учетом Вашей специфики. Давайте посмотрим, чтобы избежать ошибок и получить нужный результат", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "У Вас нет гарантии результатов!", "answers": [{"text": "Справедливо — гарантировать конкретные цифры до анализа было бы нечестно, они зависят и от трафика. Что мы даём точно — продающую структуру по принципам, которые работают. На созвоне покажу на вашем текущем сайте, где теряются заявки и что изменится.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Честность + логика"}, {"text": "Да, гарантии важны, и хочется быть уверенным, что результат точно будет. При этом мы всегда говорим клиентам, что на конечный результат влияет не только наш продукт, но и то, как сам клиент это внедряет, использует, соблюдает инструкции и так далее. Мы гарантируем качество продукта и не даем ложных обещаний по результатам клиента", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "У нас есть гарантии качества продукта (услуги) и репутация на рынке — за 10 лет мы реализовали сотни проектов. Такая репутация формируется годами, поэтому мы не даем тех гарантий, которые звучат красиво, но юридически нереализуемы. Вы же согласны, что для результата Вам самостоятельно нужно грамотно использовать продукт и выполнять конкретные задачи?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 2 (Стр. 30 из 62 / Нумерация книги: 23)", "tip": "Не искажайте факты и не преувеличивайте. Если продукт не обладает каким-то свойством или на его доставку требуется больше времени, так и скажите. Вводить клиента в заблуждение — это краткосрочная выгода, которая в конечном итоге только навредит Вашей репутации. Предупреждайте о возможных рисках. Это показывает не только Вашу осведомленность в теме и экспертность, но и демонстрирует искреннее желание провести сделку максимально открыто и честно. ### Полезные ссылки Посмотрите видео \"18 ДЫР В ПРОДАЖАХ. Хватит продавать ТАК в 2026!\" и проверьте вашу систему. [Смотреть видео]", "objections": [{"question": "Я сейчас оплачу, а вдруг потом результата не будет / не буду это использовать в работе", "answers": [{"text": "Вы же все равно планируете в этом направлении развиваться? И наш продукт поможет Вам быстрее получить результат. Это подтверждают многие кейсы. Давайте согласуем план проекта, чтобы понять, что Вам точно это будет полезно, хорошо?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Если Вы не будете это использовать, то, конечно, это отразится на результатах. Поэтому перед покупкой важно определиться, точно ли это нужно именно сейчас и закрывает ли это Ваши задачи. Давайте сверимся...", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "Давайте просчитаем потенциальный эффект от внедрения для Вашей ситуации? Если увидим, что есть смысл — то Вы запланируете оплату, как считаете?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "О Вас нет отрицательных отзывов! Это подозрительно — Вы их удаляете!", "answers": [{"text": "Мы не удаляем отзывы, просто стараемся работать так, чтобы клиенты оставались довольны. Показать Вам примеры сложных ситуаций, которые мы успешно решили?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "У нас действительно положительная репутация, потому что мы на каждом этапе работы собираем обратную связь клиентов. И если видим, что что-то может пойти не так — оперативно реагируем. Это позволяет нам не получать негативных отзывов", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Понимаю, почему это может казаться странным. Негативных отзывов нет, потому что мы работаем над тем, чтобы каждый клиент был счастлив. Это главное для нас", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 3 (Стр. 31 из 62 / Нумерация книги: 24)", "tip": "Обещайте меньше, делайте больше. Не наоборот. Это формирует долгосрочное доверие и лояльность, делая Вас надежным партнёром в глазах клиента. Многие продавцы в погоне за разовыми сделками склонны обещать слишком много, лишь бы закрыть сделку. Такой подход дает лишь временный эффект и быстро портит Вашу репутацию на рынке. Вы перечеркиваете свои отношения с клиентами. Репутация сегодня — это все! ### Полезные ссылки 12 причин, почему не удается выйти на доход от 200 тыс. руб. в мес. в продажах [Читать пост]", "objections": [{"question": "Это Китай! Не доверяю этой продукции!", "answers": [{"text": "К производству в Китае действительно раньше было много вопросов. При этом сейчас даже многие известные бренды производят свои товары там и контролируют качество на каждом этапе. У нас тоже есть несколько этапов контроля качества, благодаря чему вопросов по качеству не возникает. Видели отзывы наших клиентов?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Для нас качество сборки очень важно, так как это напрямую влияет на нашу репутацию. Именно поэтому мы регулярно выезжаем на производство в Китай, обсуждаем стандарты качества. Плюс у нас есть свой отдел контроля на территории производителя — это позволяет каждый день держать руку на пульсе, оценивать качество и внедрять пожелания наших клиентов", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Не доверяете из-за страны производства или из-за конкретного бренда / производителя данной продукции?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "__niche__", "tip": "", "objections": [{"question": "Вы делаете сайты всем подряд", "answers": [{"text": "Нет, мы сознательно работаем только с [нишей]. Именно поэтому не набиваем шишки на вашем проекте, а сразу используем то, что уже сработало у похожих компаний в вашей сфере.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "niche-template", "tactic": "Фокус = экспертность"}]}]}]}, {"name": "Возражения по конкурентам", "subgroups": [{"title": "Скриншот 4 (Стр. 33 из 62 / Нумерация книги: 25)", "tip": "У клиента уже есть поставщик — это хорошо или плохо для Вас? В начале своей карьеры менеджера я думал, что это очень плохо. Ведь клиент сразу говорит, что его все устраивает, и менять он ничего не будет. Практически безвыходная ситуация. На самом деле нет. Выход есть. Более того, когда клиент уже покупает аналогичный товар у конкурента, с ним еще легче вести переговоры. У него уже сформирована потребность, ему нужен Ваш товар. Убедите клиента работать с Вами с помощью приема «Вы все равно это делаете» из курса «Клоузер». ### Экскурсия в ПРОКАЧКУ с ИИ За ~60 минут я покажу, как сотни компаний прямо сейчас закрывают больше сделок — и что конкретно нужно изменить в вашей системе продаж. [Смотреть экскурсию]", "objections": [{"question": "Мы уже работаем с другими (уже есть поставщик)", "answers": [{"text": "Понимаю, менять подрядчика на ходу незачем. Именно поэтому не предлагаю ничего рушить — давайте я сделаю бесплатный разбор текущего сайта: покажу 2–3 точки роста. Будет с чем сравнить, а решение за вами.", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "niche", "tactic": "Без слома текущего"}, {"text": "Отлично. Именно поэтому я Вам и позвонил. Мы как раз в приоритете начинаем работать с теми компаниями, которые уже имеют опыт подобного сотрудничества. Скажите, Вы принципиально работаете только с этим поставщиком, или готовы рассматривать другие варианты?", "tag": "Вопрос в ответ", "tone": "По делу"
