    6: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
    7: '<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 7h6M9 11h6M9 15h3"/>',
    8: '<path d="M4 13a8 8 0 0 1 16 0"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19v1a3 3 0 0 1-3 3h-2"/>',
    9: '<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 4 2 5 5 0 0 1 4-2h2a5 5 0 0 1 5 5v1"/>',
    10: '<path d="M6 3h12M6 21h12M8 3c0 4 8 4 8 8s-8 4-8 8M16 3c0 4-8 4-8 8s8 4 8 8"/>',
    11: '<rect x="5" y="2" width="14" height="20" rx="1.5"/><path d="M8 7h8M8 11h8M8 15h4"/>',
    'return': '<path d="M9 10l-5 5 5 5"/><path d="M4 15h11a5 5 0 0 0 5-5V4"/>'
  };

  function iconFor(cat, i){
    if(cat.name === 'Топ 5') return ICONS['top5'];
    if(cat.name === 'Возвращение к диалогу') return ICONS['return'];
    return ICONS[i] || '';
  }

  var state = {
    view: 'categories',
    catIndex: null,
    openObj: null,
    query: ''
  };

  var mainEl = document.getElementById('main');
  var crumbsEl = document.getElementById('crumbs');
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var toastEl = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var toastTimer = null;

  function esc(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function gtext(s){
    return window.peGenderTransform ? window.peGenderTransform(s||'') : (s||'');
  }

  function highlight(text, q){
    var e = esc(text);
    if(!q) return e;
    var eq = esc(q);
    try{
      var re = new RegExp('(' + eq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
      return e.replace(re, '<span class="hl">$1</span>');
    }catch(err){ return e; }
  }

  function countObjections(cat){
    var n = 0;
    cat.subgroups.forEach(function(s){ n += s.objections.length; });
    return n;
  }

  function hasPlaceholder(text){
    return /[\(\[][^\)\]]{2,60}[\)\]]/.test(text);
  }

  function tagRow(a){
    var parts = [];
    if(a.source === 'niche' || a.source === 'niche-preempt'){
      parts.push('<span class="ans-tag niche">ниша' + (a.tactic ? ': '+esc(a.tactic) : '') + '</span>');
    }
    if(a.source === 'niche-template'){
      parts.push('<span class="ans-tag template">&#9888; шаблон — впишите нишу</span>');
    }
    parts.push('<span class="ans-tag accent">' + esc(a.tag) + '</span>');
    parts.push('<span class="ans-tag">' + esc(a.tone) + '</span>');
    parts.push('<span class="ans-tag">' + esc(a.goal) + '</span>');
    if(hasPlaceholder(a.text) && a.source !== 'niche-template'){
      parts.push('<span class="ans-tag">правка перед отправкой</span>');
    }
    return '<div class="ans-tags">' + parts.join('') + '</div>';
  }

  function cardClass(a){
    if(a.source === 'niche-template') return ' tpl';
    if(a.source === 'niche' || a.source === 'niche-preempt') return ' niche';
    return '';
  }

  function render(){
    if(state.query.trim().length > 0){
      renderSearch();
    } else if(state.view === 'category' && state.catIndex !== null){
      renderCategory();
    } else {
      renderCategories();
    }
    renderCrumbs();
  }

  function renderCrumbs(){
    var html = '';
    if(state.query.trim().length > 0){
      html += '<button data-nav="home">все категории</button><span class="sep">/</span><span class="current">результаты поиска</span>';
    } else if(state.view === 'category' && state.catIndex !== null){
      html += '<button data-nav="home">все категории</button><span class="sep">/</span><span class="current">' + esc(DATA[state.catIndex].name) + '</span>';
    } else {
      html += '<span class="current">все категории</span>';
    }
    crumbsEl.innerHTML = html;
  }

  function pluralObj(n){
    var mod10 = n%10, mod100 = n%100;
    if(mod10===1 && mod100!==11) return 'е';
    if([2,3,4].indexOf(mod10)!==-1 && [12,13,14].indexOf(mod100)===-1) return 'я';
    return 'й';
  }

  function renderCategories(){
    var html = '<div class="cat-grid">';
    DATA.forEach(function(cat, i){
      var n = countObjections(cat);
      html += '' +
        '<button class="cat-card" data-cat="'+i+'">' +
          '<div class="cat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + iconFor(cat, i) + '</svg></div>' +
          '<div>' +
            '<div class="cat-name">' + esc(cat.name) + '</div>' +
            '<div class="cat-count">' + n + ' возражени' + pluralObj(n) + '</div>' +
          '</div>' +
        '</button>';
    });
    html += '</div>';
    mainEl.innerHTML = html;
  }

  function renderCategory(){
    var cat = DATA[state.catIndex];
    var jumpHtml = '<div class="primera-filters">';
    cat.subgroups.forEach(function(sub, si){
      sub.objections.forEach(function(obj, oi){
        var key = si + '-' + oi;
        var label = obj.question.length > 36 ? obj.question.slice(0,36) + '…' : obj.question;
        jumpHtml += '<button class="primera-filter-btn" data-jump="'+key+'">' + esc(label) + '</button>';
      });
    });
    jumpHtml += '</div>';

    var contentHtml = '';
    cat.subgroups.forEach(function(sub, si){
      if(sub.tip){
        contentHtml += '<div class="tip-banner"><span class="tip-label">от автора</span>' + esc(sub.tip) + '</div>';
      }
      sub.objections.forEach(function(obj, oi){
        var key = si + '-' + oi;
        var isOpen = state.openObj === key;
        contentHtml += '' +
          '<div class="obj-item'+(isOpen?' open':'')+'" data-key="'+key+'">' +
            '<button class="obj-header" data-toggle="'+key+'">' +
              '<span class="obj-quote">&#8220;</span>' +
              '<span class="obj-question">' + esc(obj.question) + '</span>' +
              '<span class="obj-meta">' + obj.answers.length + ' отв.</span>' +
              '<svg class="obj-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
            '</button>' +
            '<div class="obj-answers"><div class="obj-answers-inner">' +
              obj.answers.map(function(a, ai){
                return '<div class="ans-card'+cardClass(a)+'" data-copy="'+si+'-'+oi+'-'+ai+'">' +
                  tagRow(a) + esc(gtext(a.text)) +
                  '<svg class="ans-copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>' +
                '</div>';
              }).join('') +
            '</div></div>' +
          '</div>';
      });
    });

    mainEl.innerHTML = '<div class="primera-layout">' + jumpHtml + '<div class="primera-content" id="catContent">' + contentHtml + '</div></div>';
  }

  function renderSearch(){
    var q = state.query.trim().toLowerCase();
    var results = [];
    DATA.forEach(function(cat, ci){
      cat.subgroups.forEach(function(sub, si){
        sub.objections.forEach(function(obj, oi){
          var qMatch = obj.question.toLowerCase().indexOf(q) !== -1;
          var matchedAnswers = [];
          obj.answers.forEach(function(a, ai){
            if(qMatch || a.text.toLowerCase().indexOf(q) !== -1){
              matchedAnswers.push({text:a.text, tag:a.tag, tone:a.tone, goal:a.goal, source:a.source, tactic:a.tactic, idx:ai});
            }
          });
          if(matchedAnswers.length){
            results.push({catName:cat.name, ci:ci, si:si, oi:oi, question:obj.question, answers:matchedAnswers});
          }
        });
      });
    });

    var html = '';
    if(!results.length){
      html += '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
        '<p>ничего не найдено по запросу «' + esc(state.query) + '»</p>' +
        '</div>';
    } else {
      html += '<div class="search-meta">найдено: ' + results.length + '</div>';
      var lastCat = null;
      results.forEach(function(r){
        if(r.catName !== lastCat){
          html += '<div class="search-group-title">' + esc(r.catName) + '</div>';
          lastCat = r.catName;
        }
        html += '' +
          '<div class="obj-item open">' +
            '<div class="obj-header" style="cursor:default;">' +
              '<span class="obj-quote">&#8220;</span>' +
              '<span class="obj-question">' + highlight(r.question, state.query) + '</span>' +
            '</div>' +
            '<div class="obj-answers"><div class="obj-answers-inner">' +
              r.answers.map(function(a){
                return '<div class="ans-card'+cardClass(a)+'" data-copy="'+r.si+'-'+r.oi+'-'+a.idx+'" data-cat="'+r.ci+'">' +
                  tagRow(a) + highlight(gtext(a.text), state.query) +
                  '<svg class="ans-copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>' +
                '</div>';
              }).join('') +
            '</div></div>' +
          '</div>';
      });
    }
    mainEl.innerHTML = html;
  }

  function copyText(text, el){
    if(window.peGenderTransform){ text = window.peGenderTransform(text); }
    var done = function(ok){
      if(ok){
        el.classList.add('copied');
        setTimeout(function(){ el.classList.remove('copied'); }, 1400);
        showToast('ответ скопирован — вставляйте в чат');
      } else {
        showToast('не удалось скопировать, выделите текст вручную');
      }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){done(true);}).catch(function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, cb){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      cb(ok);
    }catch(e){
      cb(false);
    }
  }

  function showToast(msg){
    toastText.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
  }

  mainEl.addEventListener('click', function(e){
    var catBtn = e.target.closest('[data-cat]');
    var toggleBtn = e.target.closest('[data-toggle]');
    var copyEl = e.target.closest('[data-copy]');
    var jumpBtn = e.target.closest('[data-jump]');

    if(jumpBtn){
      var jkey = jumpBtn.getAttribute('data-jump');
      state.openObj = jkey;
      renderCategory();
      var target = mainEl.querySelector('.obj-item[data-key="'+jkey+'"]');
      if(target){
        target.scrollIntoView({block:'center', behavior:'smooth'});
        target.classList.add('jump-flash');
        setTimeout(function(){ target.classList.remove('jump-flash'); }, 900);
      }
      return;
    }
    if(copyEl){
      var parts = copyEl.getAttribute('data-copy').split('-');
      var ci = copyEl.hasAttribute('data-cat') ? parseInt(copyEl.getAttribute('data-cat'),10) : state.catIndex;
      var si = parseInt(parts[0],10), oi = parseInt(parts[1],10), ai = parseInt(parts[2],10);
      var text = DATA[ci].subgroups[si].objections[oi].answers[ai].text;
      copyText(text, copyEl);
      return;
    }
    if(toggleBtn){
      var key = toggleBtn.getAttribute('data-toggle');
      state.openObj = (state.openObj === key) ? null : key;
      renderCategory();
      return;
    }
    if(catBtn){
      state.catIndex = parseInt(catBtn.getAttribute('data-cat'),10);
      state.view = 'category';
      state.openObj = null;
      render();
      window.scrollTo(0,0);
      return;
    }
  });

  crumbsEl.addEventListener('click', function(e){
    var btn = e.target.closest('[data-nav]');
    if(btn && btn.getAttribute('data-nav')==='home'){
      state.view = 'categories';
      state.catIndex = null;
      state.query = '';
      searchInput.value = '';
      searchClear.classList.remove('show');
      render();
      window.scrollTo(0,0);
    }
  });

  var searchDebounce = null;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchDebounce);
    var val = searchInput.value;
    searchClear.classList.toggle('show', val.length > 0);
    searchDebounce = setTimeout(function(){
      state.query = val;
      render();
    }, 120);
  });

  searchClear.addEventListener('click', function(){
    searchInput.value = '';
    state.query = '';
    searchClear.classList.remove('show');
    searchInput.focus();
    render();
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.query){
      searchInput.value = '';
      state.query = '';
      searchClear.classList.remove('show');
      render();
    }
  });

  window.peRerenderObjections = function(){
    render();
  };

  render();
})();
</script>
</body>
</html>
