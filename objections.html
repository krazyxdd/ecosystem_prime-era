, "goal": "Уточняет", "source": "book"}, {"text": "ИО, скажите, Вы только с этим поставщиком планируете работать, или можете рассмотреть и другие предложения, если они будут более интересные?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "ИО, как Вы смотрите на то, чтобы просто сравнить условия Вашего поставщика с нашими? Ведь для бизнеса такое сравнение может быть полезно, так ведь?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "ИО, когда я первый раз общаюсь с руководителем компании, я часто слышу, что поставщики есть, и схема работы отлажена. При этом, когда мы делаем сравнение, часто видим, что есть моменты, которые можно улучшить. Именно поэтому я не предлагаю сразу ничего менять, я предлагаю сравнить то, что у Вас есть, с нашими условиями. Если увидим зоны роста, будем двигаться дальше. Что скажете?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Все устраивает. Менять ничего не буду", "answers": [{"text": "Здорово, если работает. Уточню: сколько заявок в месяц даёт сайт сейчас? Иногда „устраивает“ — это привычка, а не потолок, и там есть что усилить.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "niche", "tactic": "Проверка через результат"}, {"text": "Именно поэтому предлагаю быстрый бесплатный разбор: покажу 2–3 точки, где теряются заявки. Ничего не найдём — честно скажу, что менять не нужно.", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Бесплатный аудит"}, {"text": "Конечно, какой смысл менять что-то, если не видна выгода. Я просто хотел понять, если мы сейчас увидим, что у нас будет ощутимо выгоднее для Вас, можем обсуждать дальше?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Скажите, а Вы у этого поставщика заказываете и ТОВАР А, и ТОВАР Б и С? Бывает такое, что у нас намного выгоднее заказывать, к примеру, ТОВАР Б. Вы его используете?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 5 (Стр. 34 из 62 / Нумерация книги: 26)", "tip": "Представьте, что Вы продаете огнетушитель. Как думаете, какой клиент купит быстрее всего и даже не будет сравнивать Вас с конкурентами? Правильно! Быстрее купит клиент, у которого шляпа горит! Ему нужно настолько быстро избавиться от проблемы, что времени на сравнение практически нет. Он купит сразу же! А какие клиенты готовы максимально быстро купить Ваш продукт? Вы знаете где их искать или продаете всем подряд? Продумайте стратегию продаж и Вы удивитесь, как снизится количество возражений. ### Полезные ссылки Лекция \"Лучшие фишки продаж\" с Олегом Шевелевым. Топ-3 инструмента для быстрого роста [Зарегистрироваться]", "objections": [{"question": "У конкурентов дешевле", "answers": [{"text": "В вашей сфере важна не просто цена, а то, что подрядчик понимает [специфику ниши] и не переделывает сайт трижды. Мы это уже прошли на похожих проектах. Что для вас критично, кроме цены?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche-template", "tactic": "Понимание специфики"}, {"text": "Понимаю, на рынке разброс большой. А вы сравниваете по одинаковому объёму — продающая структура, копирайтинг, полный цикл под ключ? Часто за низкой ценой скрыт шаблон без проработки. Что для вас в приоритете, кроме цены?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "niche", "tactic": "Сравнение по сути"}, {"text": "Бывает такое, что цена на некоторые услуги отличается. Давайте сравним стоимость и функционал. Скажите, а у них данная опция есть? Это сильно влияет на цену. Без этого у нас не 90, а 85", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "А комплектация такая же? А сроки? А сервис какой предлагают? Гарантия тоже 1 год? Производитель? Очень подозрительно, ведь цена ниже рынка. У меня был клиент, который... (история)", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Вы знаете, как это бывает, каждая компания делает на чем-то акцент и может предложить по определенной категории цену ниже, а по другим — наоборот все будет дороже. Давайте сравним в целом стоимость проекта", "tag": "Альтернатива", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Я знаю, что некоторые конкуренты заявляют более низкую цену, и вот почему: 1) ___, 2) ___", "tag": "С цифрами", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}, {"question": "У конкурентов условия лучше (поставки, сроки)", "answers": [{"text": "Скажите, пожалуйста, на какие варианты ориентируетесь?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "ИО, учитывая, что условий в целом много, скажите, какие из них для Вас самые важные: сроки, цена, поддержка, гарантия?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "ИО, я понимаю, что сроки очень важны, иногда даже важнее, чем остальные условия по продукту... Именно поэтому я со своей стороны сделаю все возможное, чтобы сократить сроки и, кроме этого, я буду держать Вас в курсе работы над Вашей заявкой. Я знаю, что это для Вас важно, и мы это учтем в работе", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 6 (Стр. 35 из 62 / Нумерация книги: 27)", "tip": "«Я работаю со СБЕРом и буду век ему верна» — дословный ответ потенциального клиента на мое предложение работать с другим банком. Такие преданные клиенты не редкость на рынке B2B и B2C услуг. Как быть? Прежде всего отметьте такую преданность. Говорите не о продукте, не переубеждайте клиента. Для начала просто скажите о человеческих качествах. Ведь такая преданность — это очень ценно. ### Полезные ссылки Что контролировать предпринимателю в отделе продаж, если погружаться во все детали нет ни времени, ни сил, ни желания? [Смотреть видео]", "objections": [{"question": "Мы работаем с постоянным поставщиком уже 10 лет!", "answers": [{"text": "Я знаю, что Вы давно на рынке. За это время Вы же хотя бы одного поставщика или партнера поменяли? Потому что Вам это было выгоднее. Сейчас я не предлагаю менять, я предлагаю сравнить и сделать выводы", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "ИО, именно поэтому я сразу ничего не стал предлагать. Я понимаю, что в такой ситуации должна быть существенная выгода, чтобы Вы решили сменить поставщика. Давайте обсудим", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "Очень Вас понимаю, сами ценим постоянных партнеров, с которыми нас уже многое связывает. При этом рынок меняется и сейчас такое время, когда полезно иметь несколько вариантов: можно не только сэкономить, но и подстраховаться", "tag": "С цифрами", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Понимаю, поэтому не предлагаю отказываться от проверенного временем поставщика. Мы можем просто сравнить тарифы поставщика с нашими. И если увидим существенную экономию, Вы можете либо получить скидку у существующего поставщика, либо начать работать с нами по некоторым направлениям", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Другие компании работают быстрее Вас!", "answers": [{"text": "Скажите пожалуйста, а с какими компаниями Вы сравниваете? Какие именно работы обещают сделать в такие сроки?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Скажите, а на какие сроки ориентируетесь?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Да, мы знаем, что есть компании, которые делают это быстрее, при этом мы до сих пор говорим клиентам, что сделаем это за неделю. А знаете почему? (рассказываем подробно о плане работы по продукту)", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 7 (Стр. 36 из 62 / Нумерация книги: 28)", "tip": "Клиенты скептически относятся к продуктам, в которых «все гладко и сладко». Сразу хочется найти какой-то подвох, согласны? Чтобы показать, что Ваше предложение реальное, а не из рубрики «фантастика», разбавьте плюсы продукта парой несущественных недостатков, которые не умаляют основных преимуществ. Такие мини-недостатки демонстрируют вашу честность, снимают напряжение у клиента, который пытается найти минусы в Вашем предложении. ### Полезные ссылки Простой способ создать МОЩНЫЙ СКРИПТ ПРОДАЖ с помощью ChatGPT [Смотреть видео]", "objections": [{"question": "У конкурентов доставка / поддержка бесплатно, а у вас нет!", "answers": [{"text": "Поддержка и доставка, конечно, влияют на Ваши расходы. Поэтому давайте комплексно оценим все плюсы и минусы. Многие клиенты после сравнения видят, что несмотря на то, что у нас доставка и поддержка не бесплатные — с нами в итоге получается выгоднее. Посчитаем?", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "У нас есть разные варианты сотрудничества, в том числе и с бесплатной доставкой / поддержкой. Давайте выберем лучший тариф для Вас...", "tag": "Альтернатива", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Да, я знаю, что некоторые компании закладывают стоимость \"доставки и поддержки\" в стоимость продукта, и говорят, что они \"бесплатные\". Мы так не делаем и сообщаем клиенту только стоимость продукта. Остальное Вы можете докупить самостоятельно: например, воспользоваться своей службой доставки. Давайте в целом оценим, насколько наше предложение выгодное...", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 8 (Стр. 37 из 62 / Нумерация книги: 29)", "tip": "Как стать для клиента своим? Ваша задача как человека, который продает, найти хоть что-то, что вас может связать с клиентом. Даже если на первый взгляд кажется, что между вашими интересами пропасть. Это может быть общий знакомый, чья-то рекомендация или какой-то другой фактор, создающий связь между вами. Искать общее — тоже навык. Не всегда точки соприкосновения лежат на поверхности, но если вы их найдете, расположите этим к себе потенциального покупателя еще больше. ### Полезные ссылки Посмотрите видео о том, как правильно собирать продающие отзывы, которые действительно будут помогать больше продавать в будущем [Смотреть видео]", "objections": [{"question": "У конкурентов дороже, но у них больше кейсов!", "answers": [{"text": "Понятно, что кейсы важны. При этом важно, чтобы кейсы были достоверными и подтверждали ту экспертность, которая нужна именно в Вашей ситуации. Давайте я покажу конкретные кейсы, и Вы увидите, как качественно мы прорабатываем все ситуации. Кстати, так как у нас все кейсы подтвержденные, я смогу по согласованию с клиентом дать Вам его контакт, чтобы Вы напрямую уточнили все вопросы, как Вам?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Мы моложе, чем конкуренты, при этом сейчас хорошо растем и особое внимание уделяем кейсам. У нас есть подборка кейсов с таким запросом, как у Вас — давайте посмотрим их. Если у Вас останутся вопросы по нашей экспертности, я с удовольствием дам Вам дополнительную информацию", "tag": "Через пример", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Я понимаю, что Вы сравниваете разные варианты. Не могу ничего сказать про кейсы конкурентов. Я готов показать Вам наши кейсы в аналогичных проектах, и Вы увидите, насколько качественно мы прорабатываем все ситуации. Также давайте составим конкретный план действий по Вашему проекту, и, если Вас все устроит, начнем работу", "tag": "Через пример", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 9 (Стр. 38 из 62 / Нумерация книги: 30)", "tip": "При звонке в стоматологическую клинику можно сказать: «Звоню Вам, так как у нас есть успешный опыт работы с клиниками Вашего профиля, включая проекты, реализованные в нашем и соседних регионах». Получается интересный заход, когда контакт вроде холодный, но Вы создаете впечатление, что не только знакомы со спецификой клиента, но и имеете конкретные достижения в его сфере. И с Вами уже интереснее разговаривать. Естественно, всё вышеперечисленное работает, когда это действительно так. ### Полезные ссылки Клиент просит счет и пропадает. Что делать? Смотрите видео, как работать с такими кейсами [Смотреть видео]", "objections": [{"question": "Мои знакомые покупали у Ваших конкурентов и рекомендуют их", "answers": [{"text": "Понятно, что мнения друзей важны. А Вы уже смотрели предложения конкурентов? Как Вы лично оцениваете их?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Понимаю Вас. А что для них было самое ценное? Почему рекомендуют их? А что им не понравилось?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Я сам часто прислушиваюсь к рекомендациям. При этом бывают ситуации, когда важно непредвзято оценить все предложения. Ведь, если мы еще не работали с Вашим знакомым, это не значит, что у нас предложение и продукт хуже. Давайте взвесим все \"за и против\"...", "tag": "Альтернатива", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Я сначала соберу все варианты от конкурентов, а потом решу. Вы не одни!", "answers": [{"text": "Хорошо, мне приятно, что мое предложение тоже будете рассматривать. Скажите, пожалуйста, а какие у Вас основные параметры при выборе, чтобы я сделал на этом акцент в предложении?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Понимаю, а что для Вас ключевое при выборе? А что помимо цены?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "При сборе предложений в нашей сфере можно столкнуться с тем, что довольно сложно объективно их сравнить. Не все поставщики раскрывают в предложении все условия. Давайте я сразу выделю то, что для Вас наиболее важно. Расскажите, на что будете в первую очередь смотреть (помимо цены)?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 10 (Стр. 39 из 62 / Нумерация книги: 31)", "tip": "Продавать — это не про подвешенный язык, как многие считают, и не про впаривание, а про умение слушать других и понимать, что они хотят. С самого начала работы в продажах я внимательно относился к клиентам и вел учет отношений с каждым из них в CRM-системе (специальной программе, в которой менеджер может посмотреть всю историю взаимодействия с клиентом). Эта программа была моим главным активом. В карточках клиентов я указывал телефоны, адреса электронной почты, историю и анализ проведенных сделок. Даже дни рождения клиентов записывал. ### Полезные ссылки Смотрите короткое видео \"Клиенты уходят в ИГНОР. Что делать?\" [Смотреть видео]", "objections": [{"question": "Я покупаю только у компаний из ТОП-3 — Вы не подходите!", "answers": [{"text": "Да, ТОП-3 — это компании лидеры рынка. А по каким рейтингам или критериям будет ТОП-3?", "tag": "С цифрами", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Хорошо. А какие еще параметры, кроме \"ТОП-3\", для Вас важны? Сроки? Гарантия? Цена? Мы подготовим бесплатно продуманный вариант реализации Вашего проекта с учетом специфики. В любом случае наше предложение усилит Ваши позиции в переговорах с ТОП-3...", "tag": "С цифрами", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Вы имеете в виду работу по всем проектам или есть какие-то направления, где \"ТОП-3\" не является категоричным параметром, и Вы можете рассматривать более выгодные варианты?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "Уже выбрали другого поставщика, спасибо!", "answers": [{"text": "Хорошо, спасибо за честность. Дайте, пожалуйста, обратную связь, как наше предложение смотрелось на фоне другого? Чего не хватило? Будем учитывать это в будущем!", "tag": "Альтернатива", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Ок, понял! То есть уже подписали договор и сделали оплату, или только планируете это делать?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "То есть Вы определились с услугами по настройке CRM у этого поставщика? А по подбору команды менеджеров ОП что думаете? У нас сейчас есть в базе несколько кандидатов с опытом в Вашей сфере, посмотрим их?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Понял вас. Спасибо, что рассматривали нас. Давайте будем на связи — я Вам вышлю подарок по теме...", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "__niche__", "tip": "", "objections": [{"question": "Закажу у фрилансера за 10к вместо 80к", "answers": [{"text": "Фрилансер за 10к реально дешевле — тут не поспоришь. Именно поэтому вопрос в другом: кто отвечает за результат, сроки и правки, если человек пропадёт? У нас команда из 4 человек на полный цикл, проект не встанет. Насколько для вас критично, чтобы сайт довели до конца и он продавал?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Риск против экономии"}]}, {"question": "Чем вы лучше студии, которая тоже делает сайты для вашей ниши?", "answers": [{"text": "Хороший вопрос. Наше отличие — [конкретный элемент: скорость, копирайтинг, кейс с цифрами по нише]. Давайте на созвоне сравним по делу, а вы выберете, что ближе.", "tag": "Через пример", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche-template", "tactic": "Конкретное отличие"}]}]}]}, {"name": "Возражения по полномочиям решения", "subgroups": [{"title": "Скриншот 1 (Стр. 41 из 62 / Нумерация книги: 32)", "tip": "Если окончательное решение принимает руководитель / Москва / комитет, это не значит, что тот сотрудник, который нам озвучивает это возражение, не может влиять на решение руководства. Не спешите брать контакты руководства (хотя, конечно, это нужно сделать) и завершать разговор. Попробуйте узнать подробности у этого сотрудника, поинтересуйтесь его мнением и в идеале, добейтесь того, чтобы этот сотрудник стал Вашим сторонником. Это не просто, но возможно! ### Полезные ссылки 3 мощных коротких видео для собственников бизнеса, которые хотят усилить свой отдел продаж: [Пошаговый план прокачки системы продаж] [Два усилителя для отдела продаж] [Как находить лучших сотрудников. 2 критерия.]", "objections": [{"question": "Я не решаю (решает руководство, головной офис)", "answers": [{"text": "А лично Вам как? Какой вариант / формат работы больше подходит?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Скажите, а на Ваш взгляд, это вообще может быть интересно Вашему руководству? Такая проблема бывает? Если мы сейчас обсудим и увидим, что это Вам в целом полезно, Вы сможете дать обратную связь руководству?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Конечно, в любом случае принимает решение руководитель. При этом, очень часто он обращается к своим сотрудникам при принятии решения. Как Вам наше предложение? Что можно улучшить, чтобы Вы могли нас порекомендовать?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}]}, {"question": "Нужно посоветоваться", "answers": [{"text": "Конечно, советуйтесь. А Вас лично продукт сейчас полностью устраивает или что-то не подходит?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Я понимаю, что в компании, скорее всего, решение по таким вопросам принимает несколько человек. Но я слышал (мне сказали), что для начала важно с Вами определиться, подходит это Вам или нет (повышаем статус клиента)", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Опыт показывает, что 70 % продуманных предложений профессиональное руководство одобряет. Давайте вместе встретимся с Вашим директором, чтобы обсудить детали", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 2 (Стр. 42 из 62 / Нумерация книги: 33)", "tip": "Работая руководителем блока продаж, я пытался договориться о сотрудничестве с руководителем крупного автосалона в течение 5-ти месяцев! Я постоянно напоминал о себе, и почти каждую неделю слышал «Думаю», «Рассматриваю», «Советуемся». Если бы я продолжал использовать банальные подходы («Посмотрели?», «Надумали?»), это бы вряд ли привело к успеху. Действуйте нестандартно: используйте разные каналы связи и разные предлоги к возобновлению диалога (новости из сферы клиента, полезные материалы, приглашения на мероприятия и т.д.) ### Полезные ссылки Как найти СИЛЬНЫХ продавцов? Смотрите короткое видео: [Смотреть видео]", "objections": [{"question": "Поговорите для начала с...", "answers": [{"text": "А они сами эти вопросы решают, или все же вместе с Вами?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Я понимаю, что Вы цените свое время. Именно поэтому я хотел у Вас, как у руководителя, сразу уточнить, что для Вас является наиболее важным при выборе компании?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "ИО, конечно, давайте запишу контакт. Скажите, а для Вас, как для руководителя, что наиболее важно при работе с такими компаниями?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Мне нужно получить одобрение специалиста (подчиненного), чтобы перейти к договору и оплате", "answers": [{"text": "Понимаю, что детали нужно согласовать с ответственным специалистом, но сама идея этого продукта / проекта – как Вам, как руководителю?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Да, сейчас у нас стратегическая встреча, чтобы понять, насколько это вписывается в развитие Вашей компании. Если да, то детали мы можем обсудить и согласовать со специалистом и потом вернуться к Вам для финального утверждения, хорошо?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 3 (Стр. 43 из 62 / Нумерация книги: 34)", "tip": "До любой презентации узнавайте ситуацию клиента. Говорите меньше, больше слушайте. В ответах покупателя будет все то, на чем вы позже построите грамотное предложение. Первое, о чем вы должны поинтересоваться: зачем вообще человеку этот продукт? Какие потребности он хочет закрыть этой покупкой? Ваша задача не просто продать, а стать стратегом, вникающим в самую суть потребностей клиента — вот главный навык любого продавца. ### Полезные ссылки Смотрите короткое видео и прокачивайтесь в работе с возражениями. Простейший способ обойти любое возражение. [Смотреть видео]", "objections": [{"question": "Мы должны провести совещание с командой и обсудить Ваше предложение", "answers": [{"text": "Понимаю, совещание с командой позволяет всесторонне обсудить предложение. Обычно мы тоже к таким встречам подключаемся и сразу даем необходимую информацию всем участникам (по ИТ, безопасности, юристам и т.д.). Когда планируете такую встречу провести?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "Это отлично. Давайте, чтобы сэкономить время команды, я отправлю Вам тезисы для обсуждения и сам презентую эту программу – у нас есть буквально 3 слайда как раз для командных встреч. После этого смогу ответить на вопросы команды. Что думаете?", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Я просто собираю предложения от разных компаний, чтобы передать руководителю", "answers": [{"text": "Понимаю, решает руководитель. Именно поэтому, чтобы он увидел не „сайт за 80к“, а выгоду для бизнеса, давайте на коротком созвоне соберём понимание под вашу задачу — так предложение дойдёт по сути, а не потеряется в почте. Когда удобно?", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "niche", "tactic": "Помощь с передачей"}, {"text": "Хорошо. А я могу у Вас предварительно несколько вопросов уточнить по ситуации, чтобы подготовить для Вашего руководства конкретное предложение? Можем с Вами обсудить или напрямую связаться с руководителем?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "О, понимаю. Раз Вы занимаетесь этим вопросом, скорее всего, знаете, какие критерии наиболее важны для руководителя, помимо цены?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Да, сейчас Вы просто собираете предложения, но потом руководитель может столкнуться с проблемой – довольно сложно будет объективно сравнить предложения разных поставщиков, так как многие не прописывают нюансы в предложении. Давайте подготовим максимально конкретный расчет, хорошо? Есть несколько вопросов...", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 4 (Стр. 44 из 62 / Нумерация книги: 35)", "tip": "Многие менеджеры не задают вопросы клиенту, потому что думают, что и так знают, что ему нужно. А потом в компанию приходит новичок и «уделывает» более опытных коллег по количеству закрытых сделок. «Новичкам везет!» — оправдывают свои промахи продавцы-неудачники. Но дело не в везении, а в том, что многие новички стараются соблюдать стандарты продаж и поэтому задают больше вопросов клиентам. Больше вопросов – лучше понимание ситуации клиента. А значит более сильная презентация и рост закрытых сделок. ### Полезные ссылки Тысячи учеников обучаются в \"Школе личных продаж\", развивают навыки и ставят личные рекорды в продажах и в доходе. Мы собрали несколько историй, они могут стать сильной мотивацией к изменениям: [Смотреть видео]", "objections": [{"question": "Как скажет мой специалист (ИТ, бухгалтер, юрист и тд) – так я и сделаю. Не хочу погружаться в детали Вашего предложения", "answers": [{"text": "Согласен, что это зона ответственности специалиста. При этом, так как это влияет на деньги компании, я хотел в первую очередь уточнить у Вас, готовы Вы ли стратегически этот вопрос обсуждать? Если да, то детали обсужу со специалистом, и мы вернемся к Вам за финальным подтверждением...", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Давайте я Вам вышлю тезисы – это информация именно для руководителя. А детали обсужу с Вашим специалистом, хорошо?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Я передал счет в бухгалтерию на оплату. Скоро должны оплатить", "answers": [{"text": "Рад, что процесс запущен. Как мне связаться с бухгалтерией для подтверждения платежа и подготовки документооборота?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Хорошо. А для Вас важно в какие даты стартовать проект? Я свяжусь с бухгалтером, чтобы держать вопрос на контроле", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "А все остальные этапы согласования пройдены? Юристы и другие специалисты? Отлично! Буду на связи с бухгалтерией", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}]}]}, {"name": "Возражения по времени, готовности", "subgroups": [{"title": "Скриншот 5 (Стр. 45 из 62 / Нумерация книги: 36)", "tip": "Часто возражение «Я подумаю» – это лишь повод побыстрее закончить разговор с продавцом. Именно поэтому важно понять истинную причину возражения. Данные ответы помогут Вам определить реальную готовность клиента работать с Вами, будут способствовать продвижению на следующий этап сделки. ### Полезные ссылки Посмотрите короткое видео о том, как работать с возражением \"Я подумаю\" [Смотреть видео]", "objections": [{"question": "Я подумаю", "answers": [{"text": "Понимаю, хочется взвесить. Именно поэтому давайте сразу разберём главные вопросы, из-за которых обычно берут паузу. Что для вас сейчас основной — цена, сроки или результат?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Ведёт дальше", "source": "niche", "tactic": "Разбор до раздумий"}, {"text": "ИО, в целом для Вас это актуальный вопрос? Тогда давайте попробуем [альтернатива] (продвижение вперед)", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "ИО, Вы же все равно планируете в ближайшее время покупать / устанавливать, давайте я Вас запишу (сделаю, установлю, проведем и т.д.)", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "ИО, а в целом подходит / нравится предложение, или есть моменты, которые смущают?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Конечно, надо все взвесить. Только у меня такое чувство (ощущение), что Вас что-то смущает. Что мы можем изменить, улучшить?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Кстати, если Вы будете сравнивать (для полноты картины), еще такой момент надо учесть... (говорим о рисках для клиента, повышаем экспертность)", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Конечно, подумайте. Единственный нюанс – возможно, при обдумывании встанет вопрос по датам / окончательным ценам...", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "А другие варианты уже смотрели? (ответ) Кстати, есть нюанс, иначе – риск (негатив)", "tag": "Альтернатива", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Кстати, ИО, многие компании, которым нужно (для которых важно) [задача], уделяют особое внимание [детали], потому что [влияние на окупаемость]", "tag": "С цифрами", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Можно и позже начать, но, если честно, здесь есть некоторые риски. Смотрите...", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Хорошо, смотрите, ИО, мы с Вами это обсуждаем 2 месяца, фактически, если бы сразу приняли решение, уже сейчас бы у Вас были (первые клиенты, обратная связь, возможность управления и т.д.)", "tag": "С цифрами", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 6 (Стр. 46 из 62 / Нумерация книги: 37)", "tip": "Вы можете воспользоваться в своей презентации таким интересным ходом, как монетизация выгоды. Покажите, как именно вложения в Ваш товар или услугу окупятся – клиенты это оценят. Потому что для них важно не что покупать, а как эта покупка экономически отразится на их ситуации. Особенно рекомендую этот прием тем, кто продает по цене выше рынка. ### Полезные ссылки Возражения про кризис: \"СЕЙЧАС КРИЗИС! Не до Вас!\" Как продавать? Продажи в кризис. [Смотреть видео]", "objections": [{"question": "Оплачу позже!", "answers": [{"text": "Ок, можно и потом оплатить. Важно уже сейчас определиться, что Вам действительно нужно и подходит", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Можно и позже, единственный нюанс – сами видите, доллар пошел вверх, цена может измениться, поэтому предлагаю сейчас зафиксировать цену предоплатой / заявкой", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Впереди праздники, сложности, кризис. Не до Вас!", "answers": [{"text": "ИО, в нашей стране праздники почти каждый день)) Сейчас важно понять, подходит ли Вам в целом такой вариант работы, а детали можно обсуждать потом. Скажите, как у Вас...", "tag": "Альтернатива", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Хорошо. У меня есть к Вам просьба. Для обратной связи можете оценить по 10-балльной шкале мое предложение? (Если клиент ответил, то спрашиваем, почему не 10 и работаем с истинным возражением)", "tag": "С цифрами", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Понимаю, что сейчас много забот, поэтому предлагаю даже не обсуждать детали, а определиться в целом, насколько это Вам подходит. И если принципиальное \"да\", то всю остальную рутину мы берем на себя", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "ИО, возможно, выглядит так, что процесс займет много времени и лучше его отложить. При этом именно сейчас в праздники / кризис выгоднее всего это сделать. Вот почему...", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 7 (Стр. 47 из 62 / Нумерация книги: 38)", "tip": "Вы не задумывались, почему клиенты часто тянут время, откладывают принятие решения о работе с Вами? Я это прочувствовал на собственном опыте, когда стал предпринимателем и занимался несколькими бизнесами. Если я понимал, что вопрос не срочный, что выгода от решения этого вопроса сейчас сомнительна, я его откладывал до лучших времен и концентрировался на более приоритетных вопросах. Так действуют большинство предпринимателей. Ваша задача – показать клиенту, почему Вашим решением надо воспользоваться именно сейчас. Иначе Вы регулярно будете слышать: «Давайте позже!». ### Полезные ссылки Смотрите видео про презентацию цены \"СКОЛЬКО СТОИТ? Мощные ответы для продаж.\" [Смотреть видео]", "objections": [{"question": "Давайте обсудим позже", "answers": [{"text": "Ок, тема на потом — это нормально. „Позже“ — это примерно через месяц-два или ближе к событию (сезон, запуск)?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Фиксация срока"}, {"text": "ИО, хорошо, а вообще этот вопрос для Вас актуален сейчас?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Можно и позже обсуждать, при этом здесь есть некоторые риски и нюансы. Смотрите...", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Хорошо. Сам [основной проект] можем обсудить позже, а пока можем записать Вас / запланировать пробную партию / тест на этой неделе. Это поможет принять решение", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Я занят, у меня мало времени (на встрече)", "answers": [{"text": "Понял, в таком случае можем поступить так: 1) Верхнеуровнево обсуждаем с Вами вопрос за 10 минут, а далее обсуждаю детали с Вашим заместителем или 2) переносим встречу, чтобы более предметно все обсудить. Как поступим?", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "ИО, я подготовился к нашей встрече и рассчитываю, что 20 минут нам хватит, чтобы понять, сможем мы быть полезны друг другу или нет. 20 минут у Вас есть?", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Я понимаю Вас, аврал и все такое. Предлагаю назначить другой день, когда у Вас получится в спокойной обстановке все обсудить", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 8 (Стр. 48 из 62 / Нумерация книги: 39)", "tip": "Люди покупают у тех, кому доверяют. Когда клиент доверяет Вам, он быстрее принимает решение о покупке, он задает вопросы, которые его действительно беспокоят, а не прикрывается ложными возражениями. А что Вы делаете, чтобы клиент начал Вам доверять? Я выделяю 4 компонента для установления доверия: Э – эмпатия. Э – экспертность. Ч – честность. О – общее (то, что Вас связывает с клиентом). ### Полезные ссылки Как лучше выявлять потребность, чтобы презентовать и продавать лучше. Простые вопросы помогают закрывать сделки. [Смотреть видео]", "objections": [{"question": "У меня нет времени это обсуждать (по телефону)", "answers": [{"text": "Я понимаю, что Вы не планировали со мной общаться и не ожидали моего звонка. Поэтому буду краток – всего 2 вопроса, чтобы понять, имеет ли смысл дальше общаться или нет. Скажите...", "tag": "С цифрами", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Хорошо, ИО, я перезвоню Вам позже. Скажите, пожалуйста, сегодня после обеда будет 10 минут для разговора?", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "ИО, Вы извините за звонок без предупреждения. Я хотел уточнить всего 2 вопроса насчет работы сайта, это не больше 2-х минут. Хорошо?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "ИО, я буду краток и задам буквально 2 вопроса, чтобы понять, есть ли смысл общаться дальше и назначать встречу или нет. Скажите...", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Мне некогда заниматься оформлением, внедрением...", "answers": [{"text": "Понимаю, со многими работаем, знаем, насколько руководителям не хочется во все это вникать, поэтому уже подготовили подробную схему работы, чтобы с минимальным погружением установить, внедрить", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "ИО, что касается оформления – от Вас только принципиальное \"да\", а всю рутину мы берем на себя. Не первый год занимаемся, это уже отлажено", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 9 (Стр. 49 из 62 / Нумерация книги: 40)", "tip": "Умение находить в возражениях клиента то, с чем можно согласиться (без ущерба для своей позиции) – это залог успешной работы с возражениями. На обучении мы называем этот этап «Условное согласие», (или «Амортизация», «Присоединение»). Важно понимать, что соглашаться надо не во всем. Например, на возражение «Высокая цена» недопустимо отвечать «Да, у нас цена высокая, но...». Лучше «согласиться» так: «Понимаю, что цена важна и, по сравнению с товаром Б, она действительно выше. При этом обратите внимание, что...» ### Полезные ссылки Смотрите короткое видео, чтобы научиться лучше работать с презентацией цены. Лучший момент озвучивания цены – это 3-ее сообщение. [Смотреть видео]", "objections": [{"question": "Давайте встретимся еще раз...", "answers": [{"text": "Конечно, мы с удовольствием встретимся с Вами еще раз, при этом обратите внимание, что те условия, которые мы обсуждаем сейчас, могут поменяться. Поэтому лучше сегодня их забронировать / зарезервировать / подать предварительную заявку (т.е. зацепить клиента и сразу посмотреть его реальную готовность к сотрудничеству)", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Итак, ИО, мы же сегодня 10-ый раз встречаемся, и я чувствую, что мы уже близки к сотрудничеству, но что-то нам мешает окончательно договориться. Давайте сейчас обсудим, что это, чтобы мы могли скорректировать наше предложение и договориться с Вами уже завтра / послезавтра...", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Конечно. И чтобы следующая встреча была более предметной, давайте сейчас обсудим вопрос / заполним заявку и т.д.", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}, {"question": "Пришлите коммерческое предложение, подробные материалы (на встрече)", "answers": [{"text": "Скину, конечно. Только портфолио без привязки к вашей задаче мало что скажет. Давайте я подберу 1–2 кейса именно под вашу ситуацию — так будет полезнее. Расскажите пару слов о бизнесе?", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Мягкий возврат к диалогу"}, {"text": "Конечно, вышлю Вам предложение. Сориентируйте, что для Вас наиболее важно при работе с (Ваша сфера) компаниями?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Хорошо, я подготовлю предложение, а в целом как Вам такой формат работы?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Хорошо, подготовлю. Кстати, у нас есть 3 варианта реализации проекта. Вам какой больше подходит?", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}]}, {"title": "Скриншот 10 (Стр. 50 из 62 / Нумерация книги: 41)", "tip": "Несмотря на то, что у меня есть отдельный курс по написанию эффективных коммерческих предложений, я скажу честно, что я - не сторонник использования КП. Да, иногда без КП не обойтись, ибо такова процедура согласования в некоторых компаниях. Но в большинстве случаев отправка КП – это малоэффективный и никому не нужный шаг. Именно поэтому, работая в разных компаниях и на разных должностях, я часто использовал варианты ответов, которое помогают получить \"Да\" даже без КП. ### Полезные ссылки Смотрите видео \"РЕАЛЬНЫЕ звонки и ПРОДАЖИ в переписке. Разборы сделок по методике Олега Шевелева.\" [Смотреть видео]", "objections": [{"question": "Пока решили не оплачивать счет", "answers": [{"text": "Хорошо. Скажите, а что изменилось? А в целом «проблема / задача» осталась? В таком случае, можно поступить так...", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "ИО, Вы планируете его оплатить чуть позже или передумали оплачивать?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "Пришлите коммерческое предложение, подробные материалы (по телефону)", "answers": [{"text": "Правильно понимаю, что принципиальный интерес к самой услуге есть? В таком случае скажите, пожалуйста... (задаем вопросы + призыв к целевому действию)", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "ИО, я ценю и Ваше, и свое время, поэтому прежде чем высылать предложение я хотел бы убедиться, что Вам оно будет действительно выгодно. Для этого мне надо понять пару моментов по бизнесу. Их можно обсудить на встрече минут за 20, и сразу все посчитаем. Что скажете? Завтра будет минут 20?", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "ИО, ну зачем Вам общее типовое предложение, где нет конкретики? Давайте предварительно обсудим Вашу ситуацию, я задам несколько вопросов по бизнесу и сделаю конкретный расчет, из которого мы увидим, выгодное это предложение для Вас или нет. Завтра могу подъехать?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Вы знаете, я даже не использую КП, т.к. в принципе программа достаточно прозрачная. Я позвонил Вам поинтересоваться – актуальный это для Вас вопрос или нет. Если да, то давайте обсудим его подробнее (можно, на встрече) и далее определимся, в каком формате работать", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 1 (Стр. 51 из 62 / Нумерация книги: 42)", "tip": "Для многих людей решиться на сделку, особенно, если это крупный заказ или дорогостоящая покупка, — большой стресс. Клиент может переживать, что вложенные деньги не окупятся. Правда ли, все то, что вы ему сказали о товаре или услуге? Действительно ли они помогут закрыть потребности клиента? Ваша цель — дать почувствовать покупателю, что он в безопасности, нет никакого риска, и он спокойно может соглашаться на Ваше предложение. ### Полезные ссылки Смотрите короткое видео, чтобы научиться заключать больше сделок. 3 конкретных действия. [Смотреть видео]", "objections": [{"question": "Куплю в следующий раз (следующий месяц, поток, набор, группу)", "answers": [{"text": "В следующий раз, потому что сейчас нет времени на это или по другим причинам?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "То есть вопрос с покупкой все еще актуален, просто сейчас по каким-то причинам не получается? Расскажите, пожалуйста, почему думаете отложить?", "tag": "С цифрами", "tone": "Мягко", "goal": "Уточняет", "source": "book"}, {"text": "Хорошо, что в целом рассматриваете покупку. При этом, сами видите, ситуация быстро меняется, и это влияет на стоимость, наличие. Если Вы понимаете, что Вам все равно это понадобится через пару месяцев, то есть ли смысл откладывать это? Давайте еще раз оценим окупаемость...", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Хорошо, а сколько раз Вы уже переносили покупку? Уже полгода? Представляете, если бы полгода назад приобрели, уже бы сегодня Вы чувствовали эффект. Вы же все равно планируете развивать бизнес? Давайте взвесим все \"за и против\": возможно, именно сейчас лучшее время для покупки...", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 2 (Стр. 52 из 62 / Нумерация книги: 43)", "tip": "Знаменитый баскетболист Майкл Джордан как-то сказал: «Я могу принять неудачу, у всех они бывают. Но я не могу понять, когда кто-то даже не пытается». Так и Вы не ждите, когда клиент попросит Вас перейти к заключению сделки, берите инициативу в свои руки. Если все предыдущие шаги проведены грамотно, для клиента нет смысла отказываться от сделки. Просто спросите: — Оформляем? Берете? Забронировать для вас? Планируем старт проекта? ### Полезные ссылки \"Эти 5 фраз срывают сделки. Не используйте их...\" Смотрите короткое видео и избегайте этих ошибок. [Смотреть видео]", "objections": [{"question": "Сейчас сезон, не будем покупать", "answers": [{"text": "Да, в сезон нагрузка очень высокая, и часто нет времени на другие задачи. Именно поэтому я совсем коротко хотел уточнить – для Вас же эта покупка будет актуальна позже, как считаете? У нас есть программа бронирования, чтобы Вы избежали будущего повышения цен (в сезон цены повышаются). Смотрите, сколько можно сэкономить...", "tag": "С цифрами", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Я понимаю, что сейчас у Вас сезон. Именно поэтому связался с Вами. Если запустить этот проект сейчас, можно получить максимальный эффект как раз за счет высокого сезона. Для запуска нужно минимум времени – я все подготовил и рассчитал, смотрите...", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}, {"question": "Сейчас несезон, не будем покупать", "answers": [{"text": "Да, я посчитал, что до начала сезона осталось пару месяцев. И подготовил для Вас предложение с выгодными условиями – как раз к началу сезона все успеем сделать, чтобы эффект был у Вас максимальный и быстрый...", "tag": "С цифрами", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Именно поэтому и позвонил Вам. Есть несколько идей для \"несезона\", которые помогают получить эффект очень быстро. Смотрите...", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 3 (Стр. 53 из 62 / Нумерация книги: 44)", "tip": "Вспомните пословицу — лучше один раз увидеть, чем сто раз услышать. Дайте клиенту возможность лучше почувствовать Ваш продукт, и он не сможет от него отказаться. В продажах есть техника «Щенок напрокат». Суть ее в том, чтобы вызвать у покупателя чувство привязанности к продукту. Такое же чувство вы испытываете, когда Вам дают подержать на руках милого щенка. Эта концепция широко применяется в продажах: чтобы усилить желание клиента приобрести товар, ему дают возможность «протестировать» продукт перед покупкой. ### Полезные ссылки Изучите короткое видео, чтобы закрывать сделки быстрее. Две неочевидные ошибки. [Смотреть видео]", "objections": [{"question": "Я хочу подождать и посмотреть, как изменится рынок, и потом принимать решение", "answers": [{"text": "Да, я тоже думал об этом. У меня есть 2 сценария о том, что может происходить на рынке в ближайшее время. Давайте обсудим, чтобы понять, как лучше действовать сейчас...", "tag": "С цифрами", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "Согласен, что сейчас высокая неопределенность. Именно поэтому я подготовил проект / расчет / схему реализации проекта, чтобы Вы могли принять взвешенное решение с учетом рисков в этой отрасли...", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Хорошо, а какие риски Вы видите? Какие изменения для Вас были бы позитивными и негативными?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}]}, {"question": "Я сейчас сосредоточен на другом проекте. Завершим его – и вернемся к обсуждению с Вами", "answers": [{"text": "Хорошо, в детали сможем погрузиться позже. А сейчас хотя бы предварительно скажите, как Вам идея нашего продукта? Как это может отразиться на бизнесе?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Я понимаю, насколько важно руководителю сфокусироваться на ключевых проектах. Поэтому сейчас не предлагаю Вам переключаться на наш проект. Хочу понять в целом, насколько это стратегически Вам подходит. И если да, то детали я могу обсудить с Вашим специалистами...", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}]}]}, {"title": "Скриншот 4 (Стр. 54 из 62 / Нумерация книги: 45)", "tip": "Не бойтесь возражений, не боритесь с ними, а пытайтесь предвосхитить. Если не получилось, попытайтесь не просто обработать реакции клиента, а копнуть чуть глубже — понять, что стоит за ними? Слушайте покупателя внимательно, выясняйте, что именно ему не подходит и имейте в арсенале много разных стратегий по работе с возражениями. Когда Вы с блеском справитесь с этим шагом, останет ом", "answers": [{"text": "Да, я знаю, поэтому и звоню. Соедините с руководителем", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Да, мне уже передали. Есть один принципиальный момент, хотел его обсудить с руководителем. Лично", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Я поэтому и звоню. Есть важная информация для руководителя по стоимости работ", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Я знаю, что Вы работаете по товару А. А у меня вопрос, который актуален для руководства по товару Б. Соедините, пожалуйста", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}, {"question": "Руководитель сам Вам перезвонит", "answers": [{"text": "У нас многоканальный телефон, поэтому вряд ли руководитель позвонится мне напрямую, я сам перезвоню. Когда он будет на месте?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Понимаю, человек занятой. Смотрите, я готовлю схему работы / поставок для Вашей компании, фактически нужно получить информацию по двум принципиальным вопросам. В какое время сегодня перезвонить?", "tag": "Вопрос в ответ", "tone": "Мягко", "goal": "Ведёт дальше", "source": "book"}, {"text": "Хорошо, вот мой номер. Единственный момент, могу быть на встрече. Удобно, если перезвоню сам ближе к пяти?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "book"}, {"text": "Мария, еще подскажите, кроме руководителя, с кем еще я могу обсудить этот вопрос?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Поэтому и перезваниваю, что-то на линии, оборвалось", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 7 (Стр. 58 из 62 / Нумерация книги: 48)", "tip": "Один из моих любимых ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Скажите, пожалуйста, что это ВАШЕ ИМЯ насчет поставок черепицы в сентябре", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Скажите просто, что это ВАШЕ ИМЯ ОТЧЕСТВО, из банка / агентства / компании", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 8 (Стр. 59 из 62 / Нумерация книги: 49)", "tip": "Старайтесь в процессе презентации и уже при закрытии сделки спросить мнение клиента в целом, как ему тот вариант, который Вы предлагаете? Даже если человек, с которым Вы общаетесь, не принимает окончательного решения и говорит, что будет советоваться с генеральным директором, Ваш интерес к его мнению создаёт атмосферу доверия. Кроме того, это даст Вам бесценную обратную связь, которую можно использовать для доработки предложения, если оно потребуется. ### Полезные ссылки Обход секретаря. 4 техники для скрипта продаж. Реальные примеры преодоления и выхода на ЛПР [Смотреть видео]", "objections": [{"question": "Вы уже общались ранее?", "answers": [{"text": "В прошлом месяце планировали обсудить проект по поставкам, но сроки сдвинулись. Хотелось бы вернуться к этому вопросу. Соедините, пожалуйста", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Да, заочно уже знакомы", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}, {"text": "Вот держу его визитку, похоже где-то пересекались. На выставке, наверное. Он сейчас на месте?", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "book"}, {"text": "Да, звоню по рекомендации от коллег из торгово-промышленной палаты.", "tag": "Согласие + переход", "tone": "Мягко", "goal": "Снимает возражение", "source": "book"}]}, {"question": "По какому вопросу?", "answers": [{"text": "Возникли вопросы по договору №17025513/2, соедините", "tag": "С цифрами", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Возникли вопросы по программе развития продаж, хотел это обсудить с руководителем. Соедините", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "Просто передайте, что это ВАШЕ ИМЯ ФАМИЛИЯ", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "По процедуре согласования подрядных организаций по [проекту]. Соедините...", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "У меня личное приглашение на тематическое мероприятие, нужно обсудить детали", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}, {"text": "По вопросу финансовой санации, лидогенерации, PR-кампании (сложная терминология)", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "book"}]}]}, {"title": "Скриншот 9 (Стр. 60 из 62 / Нумерация книги: 50)", "tip": "", "objections": []}, {"title": "Скриншот 10 (Стр. 61 из 62 / Нумерация книги: 50)", "tip": "", "objections": []}]}, {"name": "Возражения при работе через посредника", "subgroups": [{"title": "Клиент передаёт решение руководителю", "tip": "Часто на связи не ЛПР, а сотрудник-посредник, который должен «согласовать с руководителем». Это не тупик: вооружайте посредника готовыми аргументами, уточняйте реальные критерии ЛПР, договаривайтесь о конкретном сроке возврата и, где уместно, аккуратно предлагайте прямой контакт с руководителем.", "objections": [{"question": "«Мне нужно согласовать с руководителем» (и потом тишина)", "answers": [{"text": "«Понял, решение за руководителем. Помогу вам его презентовать: подготовлю короткое КП с выгодами и цифрами — чтобы вы передали не „сайт за N“, а конкретную пользу. Так согласовать проще. Скинуть?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Вооружи посредника"}]}, {"question": "«Надо согласовать с руководителем»", "answers": [{"text": "«ИО, чтобы попасть в точку — подскажите, что для руководителя обычно решающее: цена, сроки, результат или примеры работ? Соберу материалы именно под это, чтобы согласовать было легче.»", "tag": "Через пример", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Уточни критерии ЛПР"}]}, {"question": "«Надо согласовать»", "answers": [{"text": "«Понял, согласуйте спокойно. Давайте наметим, когда мне вернуться, чтобы не потеряться: в [день] будет удобно узнать реакцию руководителя?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Договорись о возврате"}]}, {"question": "Сотрудник не может внятно объяснить проект ЛПР", "answers": [{"text": "«ИО, чтобы ничего не потерялось при пересказе — может, подключим руководителя на короткий созвон на 10 минут? Я всё покажу сам, вам не придётся отвечать за детали. Как удобнее организовать?»", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Предложи прямой контакт"}]}, {"question": "Сотрудник не может объяснить проект", "answers": [{"text": "«ИО, давайте так: подготовлю вам короткую выжимку в 3 пунктах — что делаем, что даст, сколько стоит. Вам останется просто переслать руководителю, ничего расписывать не придётся.»", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Дай готовую подачу"}]}, {"question": "Сотрудник не может объяснить проект", "answers": [{"text": "«ИО, могу записать короткое видео на 2 минуты, где сам покажу проект и выгоды. Вы просто перешлёте руководителю — он увидит всё как есть, без искажений. Прислать?»", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Запиши мини-презентацию"}]}, {"question": "«Руководитель пока не смотрел / не решил»", "answers": [{"text": "«Понимаю, у руководителя загрузка. Облегчу задачу: соберу всё на одной странице — суть, выгода, цена, сроки. Ему хватит минуты, чтобы принять решение. Подготовить?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Помоги сдвинуть"}]}, {"question": "«Руководитель не решил»", "answers": [{"text": "«ИО, если у руководителя остались вопросы — я готов ответить на них напрямую, письменно или на коротком созвоне. Часто пара уточнений и решает. Организуем?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Предложи снять вопросы"}]}, {"question": "ЛПР недоступен, посредник тянет неделями", "answers": [{"text": "«ИО, чтобы вы не потеряли текущие условия и место в графике — наметим срок, к которому получится показать руководителю? Придержу за вами цену до этой даты.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Мягкий дедлайн через ценность"}]}, {"question": "ЛПР недоступен", "answers": [{"text": "«ИО, пока руководитель недоступен — давайте не терять связь. Скину пару идей по вашему сайту, чтобы, когда дойдёт до решения, было что показать. Ок?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Держи контакт полезным"}]}, {"question": "Посредник сам «за», но боится выносить наверх", "answers": [{"text": "«ИО, вижу, вам самому идея близка — спасибо. Чтобы вам было спокойно выносить её руководителю, подготовлю всё так, чтобы вы выглядели молодцом: с цифрами и обоснованием. Помогу с любым вопросом от него.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Сними его риск"}]}, {"question": "Посредник «за», но боится", "answers": [{"text": "«ИО, давайте так: вы просто передаёте материалы, а если у руководителя вопросы — переключаете на меня, и я отвечаю сам. Никакой ответственности за детали на вас. Спокойнее так?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Раздели ответственность"}]}]}]}, {"name": "Клиент пропадает во время работы над сайтом", "subgroups": [{"title": "Молчание на этапе макета, материалов, созвона", "tip": "Клиент может замолчать на любом рабочем этапе — после макета, при сборе текстов и доступов, перед созвоном. Чаще всего дело не в отказе, а в перегрузе и неловкости сказать об этом сразу. Упрощайте ответ до одного слова, снимайте часть работы с клиента и всегда фиксируйте конкретную дату возврата к разговору.", "objections": [{"question": "Не отвечает после отправки макета / правок на согласование", "answers": [{"text": "«ИО, отправлял макет на согласование. Чтобы вам было проще — скажите одним словом: „ок, идём дальше“ или „есть правки“? Если правки — накидайте, что поменять.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Упрости ответ"}]}, {"question": "Не отвечает после макета", "answers": [{"text": "«ИО, посмотрите, пожалуйста, [первый экран / блок с ценами] — там ключевое. Всё ок или что-то поправить? От вашего ответа зависит, двигаемся ли дальше.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Направь внимание"}]}, {"question": "Не отвечает после макета", "answers": [{"text": "«ИО, если по макету проще обсудить голосом — давайте на 10 минут созвонимся, пройдёмся по экранам и сразу зафиксируем правки. Когда удобно?»", "tag": "С цифрами", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Предложи созвон-разбор"}]}, {"question": "Пропал на этапе сбора материалов (тексты, фото, доступы)", "answers": [{"text": "«ИО, работа готова двигаться, ждём от вас [материалы]. Понимаю, собрать бывает некогда. Помогу: подскажу, что именно нужно, или созвонимся и соберём вместе за 10 минут?»", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Сними барьер"}]}, {"question": "Пропал на этапе сбора материалов", "answers": [{"text": "«ИО, чтобы вам не гадать, что присылать, — вот короткий список: [1) …, 2) …, 3) …]. Отметьте, что готово, а с остальным помогу. Так быстрее закроем этап.»", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Дай чек-лист"}]}, {"question": "Пропал на этапе сбора материалов", "answers": [{"text": "«ИО, если со сбором совсем никак — можем часть взять на себя: тексты напишем сами, фото подберём из стоков под вашу нишу. От вас только правки. Так удобнее?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Возьми на себя"}]}, {"question": "«Занят, напишу позже» — и тишина", "answers": [{"text": "«ИО, понимаю, загрузка. Чтобы проект не завис — наметим ориентир: вернёмся к нему на этой неделе или лучше на следующей? Подстроюсь под вас.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Мягко верни к дате"}]}, {"question": "«Занят, напишу позже»", "answers": [{"text": "«ИО, давайте я сам напомню, чтобы вам не держать в голове. Написать в [день] или лучше на следующей неделе? Как удобно.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Возьми инициативу"}]}, {"question": "Сорвал назначенный созвон, не выходит на связь", "answers": [{"text": "«ИО, созвон не состоялся — ничего страшного, у всех бывает. Давайте перенесём. Когда удобнее — [вариант 1] или [вариант 2]?»", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Без упрёка, новый слот"}]}, {"question": "Сорвал созвон", "answers": [{"text": "«ИО, если созвон сложно вписать в график — можем всё решить в переписке, без звонка. Напишу вопросы по пунктам, ответите, когда удобно. Так подойдёт?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Предложи переписку"}]}, {"question": "Отвечает односложно и тянет («ок», «угу», «позже»)", "answers": [{"text": "«ИО, чтобы двигаться предметно: что сейчас основное — определиться с бюджетом, сроками или ещё присматриваетесь? От этого зависит, что предложу.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Задай конкретный вопрос"}]}, {"question": "Отвечает односложно", "answers": [{"text": "«ИО, скажу честно — по коротким ответам сложно понять, в ту ли сторону идём. Тема сайта сейчас в приоритете или лучше вернуться позже? Пойму любой ответ.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Проверь актуальность прямо"}]}]}]}, {"name": "Проблемы с оплатой счёта", "subgroups": [{"title": "Клиент не оплачивает выставленный счёт", "tip": "Молчание после выставленного счёта почти никогда не означает отказ — чаще это вопрос удобства, сроков или банальной технической загвоздки. Не дожимайте напрямую, а предлагайте гибкость: рассрочку, старт с небольшого этапа, привязку оплаты к событию или к результату.", "objections": [{"question": "Не отвечает после выставленного счёта", "answers": [{"text": "«ИО, выставил вам счёт. Подскажите — оплата планируется в этот срок? Или удобнее сдвинуть / разбить на части? Подстроюсь, как вам комфортнее.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Помоги с оплатой"}]}, {"question": "Не отвечает после выставленного счёта", "answers": [{"text": "«ИО, подскажите — счёт дошёл нормально, реквизиты открылись? Если что-то не так с оплатой или нужен другой способ (карта / рассрочка) — скажите, пришлю.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Убери техбарьер"}]}, {"question": "Не отвечает после выставленного счёта", "answers": [{"text": "«ИО, как только счёт пройдёт — сразу стартуем и вы получите [первый этап / прототип] к [срок]. Не хочу, чтобы старт сдвигался. Оплата в силе?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Напомни, что ждёт после"}]}, {"question": "Клиент не оплачивает счёт (срок подходит/прошёл)", "answers": [{"text": "«ИО, вижу, счёт пока не прошёл. Всё в силе? Если что-то поменялось или нужна отсрочка — скажите честно, найдём решение.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Уточни причину без давления"}]}, {"question": "Клиент не оплачивает счёт", "answers": [{"text": "«ИО, чтобы понимать, как быть: удобнее оплатить полностью сейчас или разбить — часть сейчас, часть к сдаче? Оба варианта рабочие, скажите, как вам.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Дай выбор"}]}, {"question": "«Нет денег прямо сейчас, оплачу позже»", "answers": [{"text": "«Понял, бывает. Чтобы придержать за вами условия и место в графике — „позже“ это примерно когда? И если удобнее разбить на части — тоже можем.»", "tag": "Через пример", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Зафиксируй срок + гибкость"}]}, {"question": "«Нет денег прямо сейчас»", "answers": [{"text": "«Понимаю. Тогда можем начать с небольшого этапа — [прототип / структура], это недорого. Увидите подход в деле, а основную оплату — когда будете готовы. Как вам?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Стартуй с малого"}]}, {"question": "«Оплачу со следующего поступления / после оплаты от клиентов»", "answers": [{"text": "«Понимаю, ждёте поступление. Давайте так: закреплю за вами цену и старт, а вы напишете, как деньги придут. Ориентир по срокам есть?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Привяжись к событию"}]}, {"question": "«Оплачу с поступления»", "answers": [{"text": "«Отлично, тогда, пока ждёте поступление, давайте не терять время: соберу структуру и план, чтобы в день оплаты сразу стартовать. Так к запуску придём быстрее. Ок?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Подготовь всё заранее"}]}, {"question": "Просит отсрочку / рассрочку", "answers": [{"text": "«Без проблем, многие так стартуют. Можем разбить: часть сейчас — запускаем работу, остаток к сдаче. Так комфортнее? Подстрою под бюджет.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Предложи формат"}]}, {"question": "Просит рассрочку", "answers": [{"text": "«Давайте привяжем оплату к этапам: [оплата 1 → структура и прототип], [оплата 2 → сборка], [оплата 3 → запуск]. Платите за то, что уже видите. Честно для обеих сторон.»", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Раздели по этапам"}]}, {"question": "«Оплачу, когда увижу первый результат»", "answers": [{"text": "«Понимаю, хочется уверенности. Именно поэтому работаем по этапам: вносите часть — показываю первый блок / прототип. Видите результат — двигаемся дальше. Ок?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Раздели этапы"}]}, {"question": "«Оплачу по результату»", "answers": [{"text": "«ИО, чтобы вам было спокойно: первый макет покажу до финальной оплаты, и правки на этом этапе входят в работу. Увидите, что делаем именно то, что нужно. Так подойдёт?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Дай гарантию правок"}]}, {"question": "Оспаривает сумму в счёте после согласования", "answers": [{"text": "«Понял. Давайте сверимся — счёт собран ровно по тому, что согласовали: [состав]. Если что-то поменялось в задаче — скажите, пересчитаю честно. Что именно смущает?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Верни к договорённости"}]}, {"question": "Оспаривает сумму", "answers": [{"text": "«ИО, давайте разложу, из чего сумма: [структура + копирайтинг + сборка + запуск]. Так видно, за что платите. Если какой-то блок сейчас не нужен — уберём и цена снизится.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Разложи на составляющие"}]}]}]}, {"name": "Возвращение к диалогу", "subgroups": [{"title": "__niche__", "tip": "Это не отработка возражения, а повторные касания — когда клиент замолчал. Тон здесь мягче: без давления, с лёгким выходом, чтобы не растерять контакт.", "objections": [{"question": "Клиент не ответил на первое холодное сообщение", "answers": [{"text": "ИО, добрый день! Возможно, сообщение потерялось. Пишу коротко: помогаем бизнесам делать продающие сайты на Tilda. Если тема неактуальна — просто скажите, не буду беспокоить.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "niche", "tactic": "Мягкий повторный заход"}]}, {"question": "Клиент пропал в середине диалога", "answers": [{"text": "ИО, вижу, диалог подвис — понимаю, дел хватает. Подскажите одним словом: вопрос ещё актуален или сейчас не время? Пойму любой ответ.", "tag": "Прямой ответ", "tone": "Мягко", "goal": "Снимает возражение", "source": "niche", "tactic": "Возвращение без упрёка"}]}, {"question": "Клиент не отвечает после КП", "answers": [{"text": "ИО, отправлял КП по сайту. Не тороплю с решением — подскажите, вопросы по нему появились или что-то смутило? Разберу любой момент.", "tag": "Прямой ответ", "tone": "По делу", "goal": "Снимает возражение", "source": "niche", "tactic": "Ценностный дожим-мягко"}]}]}, {"title": "Детальный разбор: первое сообщение, дозвон, КП, реанимация", "tip": "Развёрнутый набор формулировок на каждый момент, когда клиент замолкает — от самого первого холодного сообщения до полной тишины после нескольких касаний и «спящих» клиентов. Тон везде мягкий, без напора и с лёгким выходом, если тема действительно неактуальна.", "objections": [{"question": "Не ответил на первое приветственное сообщение", "answers": [{"text": "«ИО, добрый день! Возможно, сообщение потерялось. Коротко: делаем продающие сайты на Tilda. Если неактуально — просто скажите, больше не побеспокою.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Мягкий повтор"}]}, {"question": "Не ответил на первое приветственное сообщение", "answers": [{"text": "«ИО, здравствуйте! Не буду с порога ничего предлагать. Скажите только: сайт для [ниша клиента] у вас сейчас есть и он приносит заявки? От этого зависит, есть ли смысл общаться.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Заход с пользой"}]}, {"question": "Не ответил на первое приветственное сообщение", "answers": [{"text": "«ИО, добрый день! Смотрел ваш [сайт / профиль] — есть пара идей, как получать больше заявок с той же аудитории. Интересно, если покажу? Или сейчас не до этого?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Конкретный крючок"}]}, {"question": "Не отвечает после дозвона (созвон был, тишина)", "answers": [{"text": "«ИО, спасибо за созвон! Как договаривались — готовлю [КП / варианты]. Подскажите, к [дата] актуально? Или сроки сдвинулись?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Резюме + шаг"}]}, {"question": "Не отвечает после дозвона", "answers": [{"text": "«ИО, по итогу нашего разговора главное, что решаемо у вас — [боль клиента, которую озвучил]. Не хочу, чтобы задача зависла. Двигаемся дальше?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Напомни ценность"}]}, {"question": "Не отвечает после дозвона", "answers": [{"text": "«ИО, вижу, после созвона тишина — бывает, планы меняются. Скажите честно: тема ещё живая или отложили? Пойму любой ответ.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Лёгкий выход"}]}, {"question": "Не отвечает после КП", "answers": [{"text": "«ИО, отправлял вам КП по сайту. Не тороплю с решением. Скажите — вопросы появились? Или что-то смутило? Разберу любой момент.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Спроси обратную связь"}]}, {"question": "Не отвечает после КП", "answers": [{"text": "«ИО, чтобы не гадать: после КП людей обычно тормозит цена, сроки или сомнение „а точно сработает“. Что ближе к вам? Помогу разобраться без обязательств.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Сними частые сомнения"}]}, {"question": "Не отвечает после КП", "answers": [{"text": "«ИО, подскажите — КП в таком виде вам удобно смотреть? Могу собрать короче, только суть и цифры, если так нагляднее. Как лучше?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Уточни формат"}]}, {"question": "Не отвечает после нескольких касаний (2–3 сообщения)", "answers": [{"text": "«ИО, не хочу быть навязчивым — это последнее сообщение по теме. Если сайт неактуален, всё пойму. Появится задача — просто напишите, помогу быстро. Хорошего дня!»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Финальное деликатное касание"}]}, {"question": "Не отвечает после нескольких касаний", "answers": [{"text": "«ИО, возможно, я не туда захожу. Скажите прямо: вопрос в деньгах, во времени или сайт вообще не в приоритете сейчас? Подстроюсь под реальную ситуацию.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Смена угла"}]}, {"question": "Пропал в середине диалога", "answers": [{"text": "«ИО, вижу, диалог подвис — понимаю, дел хватает. Скажите одним словом: тема ещё актуальна? Или сейчас не время? Пойму любой ответ.»", "tag": "Прямой ответ", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Вернись без упрёка"}]}, {"question": "Пропал (долгая тишина, реанимация)", "answers": [{"text": "«ИО, добрый день! Не по продаже — просто полезное: собрал 3 ошибки, из-за которых сайт не приносит заявки. Скинуть? Вдруг пригодится.»", "tag": "С цифрами", "tone": "По делу", "goal": "Ведёт дальше", "source": "niche", "tactic": "Заход через пользу"}]}, {"question": "Пропал (долгая тишина)", "answers": [{"text": "«ИО, здравствуйте! Вспомнил про вашу задачу — у нас как раз [новый кейс в вашей сфере / решение]. Подумал, вам может быть в тему. Актуально ещё?»", "tag": "Вопрос в ответ", "tone": "По делу", "goal": "Уточняет", "source": "niche", "tactic": "Новость как повод"}]}]}]}]

<script>
(function(){
  "use strict";

  var DATA = JSON.parse(document.getElementById('objections-data').textContent);

  var ICONS = {
    'top5': '<path d="M12 2l2.9 6.6 7.1.7-5.4 4.9 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.9 7.1-.7z"/>',

    1: '<rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M3 11h18M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
    2: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2-2.4 3.7" /><circle cx="12" cy="16.3" r="0.6" fill="currentColor" stroke="none"/>',
    3: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>',
    4: '<path d="M4 3v18M4 4h11l-2 3.5L15 11H4"/>',
