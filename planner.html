<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планировщик месяца</title>
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/user-scope.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FFFFFF;
    --surface: #FFFFFF;
    --ink: #121212;
    --ink-soft: #7A7A7A;
    --ink-faint: #ABABAB;
    --line: #E4E4E4;
    --line-soft: #EEEEEE;
    --divider-strong: #D6D6D6;
    --accent: #2563EB;
    --accent-ink: #FFFFFF;
    --accent-tint: #E9F0FE;
    --today-ring: #2563EB;
    --today-tint: rgba(37,99,235,0.09);
    --today-tint-strong: rgba(37,99,235,0.16);
    --danger: #A8402F;
    --danger-tint: #FBEAE7;
    --select-tint: rgba(37,99,235,0.10);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  button, input, textarea { font-family: inherit; }
  .app{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap:22px;
    max-width:1900px;
    width:100%;
    min-height:100vh;
    margin:0 auto;
    padding:26px 32px 32px;
  }
  @media (max-width: 880px){
    .app{ grid-template-columns: 1fr; padding:18px 14px 40px; }
    .sidebar{ order:2; }
    .board{ order:1; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar{ display:flex; flex-direction:column; gap:16px; height:100%; }
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 14px;
  }
  .panel-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:4px;
  }
  .panel-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.95rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .panel-title::before{ content:"/ "; color:var(--ink-faint); font-weight:400; }
  .panel-sub{
    font-size:0.74rem;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .week-list{ flex:1 1 auto; overflow-y:auto; margin:0 -4px; padding:0 4px; min-height:0; }
  .panel-week{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  .day-group{ padding:11px 8px; border-bottom:4px solid var(--divider-strong); border-radius:6px; }
  .day-group:last-child{ border-bottom:none; }
  .day-group.is-today{ background:var(--today-tint-strong); }
  .day-group-head{
    display:flex; align-items:center; gap:10px;
    font-size:0.74rem; color:var(--ink-soft);
    margin-bottom:6px;
  }
  .day-group-head .dg-num{
    width:auto; height:auto;
    display:flex; align-items:center; justify-content:center;
    font-size:2.3rem;
    font-weight:800;
    line-height:1;
    color:var(--ink);
    flex:none;
  }
  .day-group.is-today .dg-num{ background:none; color:var(--today-ring); font-weight:800; }
  .day-group.is-today .dg-weekday{ color:var(--ink); font-weight:700; }

  .task-row{
    display:flex; align-items:flex-start; gap:6px;
    padding:5px 3px;
    border-radius:10px;
    border:2px solid transparent;
    box-sizing:border-box;
  }
  .task-row.drag-over{ background:var(--accent-tint); }
  .task-row.dragging{ opacity:0.4; }
  .task-row.is-overdue{ animation: pulse-red 1.3s ease-in-out infinite alternate; border-color:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.18); padding:5px 5px; }
  .task-row[draggable="true"]{ cursor:grab; }
  .row-check{
    appearance:none; -webkit-appearance:none;
    width:16px; height:16px; margin-top:2px;
    border:1.5px solid var(--ink-faint);
    border-radius:5px;
    cursor:pointer;
    flex:none;
    position:relative;
    transition: background .12s ease, border-color .12s ease;
  }
  .row-check:checked{ background:var(--accent); border-color:var(--accent); }
  .row-check:checked::after{
    content:"";
    position:absolute; left:4.5px; top:1px;
    width:4px; height:7px;
    border:solid white; border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .row-body{ min-width:0; flex:1; }
  .row-title{
    font-size:0.82rem; line-height:1.35;
    white-space:normal; overflow-wrap:anywhere; word-break:break-word;
    cursor:pointer;
    display:flex; align-items:flex-start; flex-wrap:wrap;
  }
  .row-time{
    color:var(--accent);
    font-weight:700;
    margin-right:5px;
    flex:none;
  }
  .is-overdue .row-time{ color:#fff; }
  .row-desc{
    font-size:0.72rem; color:var(--ink-soft);
    white-space:normal; overflow-wrap:anywhere; word-break:break-word;
  }
  .task-row.is-overdue .row-desc{ color:#fff; opacity:0.95; }
  .task-row.is-done .row-title{ color:var(--ink-faint); text-decoration:line-through; }
  .task-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; flex:none; margin-top:5px; }
  .empty-note{ font-size:0.76rem; color:var(--ink-faint); font-style:italic; padding-left:20px; }

  .overdue-panel{
    background:var(--danger-tint);
    border:1px solid #E3B0A6;
  }
  .overdue-panel .panel-title{ color:var(--danger); }
  .overdue-panel .panel-title::before{ content:""; }
  .overdue-panel .task-row{ background:#fff; margin-bottom:5px; }

  @keyframes pulse-red{
    0%   { background:#FF4433; }
    100% { background:#C81E1E; }
  }
  @keyframes pulse-red-bar{
    0%   { filter:brightness(1); box-shadow:0 0 0 2px #E8544A inset; }
    100% { filter:brightness(0.82); box-shadow:0 0 0 2px #8f2318 inset; }
  }
  @keyframes scan-red{
    0%   { left:0; }
    100% { left:calc(100% - 7px); }
  }

  /* ---------- Board ---------- */
  .board{ min-width:0; display:flex; flex-direction:column; }
  .board-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
    gap:12px; flex-wrap:wrap;
  }
  .nav-group{ display:flex; align-items:center; gap:12px; }
  .month-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:0.01em;
    text-transform:uppercase;
    padding:0 12px;
  }
  .nav-cluster{
    display:flex; align-items:center; gap:2px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
  }
  .now-badge{
    display:flex; align-items:center;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:0.01em;
    color:var(--accent);
    background:var(--accent-tint);
    font-variant-numeric:tabular-nums;
  }
  .icon-btn{
    width:32px; height:32px;
    border-radius:999px;
    border:none;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:1rem;
    transition: background .12s ease;
  }
  .icon-btn:hover{ background:var(--accent-tint); }
  .btn{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:9px 16px;
    border-radius:999px;
    font-size:0.82rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .btn:hover{ background:var(--accent-tint); border-color:var(--accent); }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{ background:#1d4fc4; }
  .header-actions{ display:flex; gap:8px; align-items:center; }
  .hint{ font-size:0.73rem; color:var(--ink-faint); margin:-10px 0 14px; }

  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    padding:0 2px 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }
  .weekday-row span{
    font-size:0.75rem;
    color:var(--ink-soft);
    text-align:left;
    padding-left:4px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .calendar{ display:flex; flex-direction:column; user-select:none; flex:1 1 auto; min-height:0; }
  .week{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    position:relative;
    border-bottom:1px solid var(--line-soft);
    flex:1 1 0;
    min-height:0;
  }
  .day-bg{
    grid-row:1/-1;
    border-left:1px solid var(--line-soft);
    cursor:pointer;
    min-height:70px;
    height:100%;
    transition: background .1s ease;
  }
  .day-bg:hover{ background:#F1EEE3; }
  .day-bg.other-month{ background:repeating-linear-gradient(135deg, rgba(0,0,0,0.015) 0 6px, transparent 6px 12px); }
  .day-bg.other-month:hover{ background-color:#EDEAE0; }
  .day-bg.is-today-cell{ background:var(--today-tint); }
  .day-bg.is-today-cell:hover{ background:var(--today-tint-strong); }
  .day-bg.is-selecting{ background:var(--select-tint) !important; }
  .week > .day-bg:first-child{ border-left:none; }

  .day-num{
    grid-row:1;
    padding:7px 7px 4px;
    font-size:0.8rem;
    color:var(--ink);
    pointer-events:none;
    display:flex;
  }
  .day-num .num-circle{
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
  }
  .day-num.other-month{ color:var(--ink-faint); }
  .day-num.today .num-circle{
    background:var(--today-ring);
    color:#fff;
    font-weight:700;
  }
  .day-num.current-week .num-circle{ font-weight:800; }

  .bar{
    position:relative;
    margin:0 3px 3px;
    height:23px;
    border-radius:6px;
    display:flex; align-items:center;
    gap:5px;
    padding:0 8px;
    cursor:grab;
    box-shadow: 0 1px 1px rgba(0,0,0,0.05);
    min-width:0;
  }
  .bar:active{ cursor:grabbing; }
  .bar.round-l{ border-top-left-radius:11px; border-bottom-left-radius:11px; margin-left:3px; }
  .bar.round-r{ border-top-right-radius:11px; border-bottom-right-radius:11px; margin-right:3px; }
  .bar.is-done{ opacity:0.5; }
  .bar.is-overdue{ animation: pulse-red-bar 1.1s ease-in-out infinite alternate; overflow:hidden; }
  .bar.is-overdue::after{
    content:"";
    position:absolute;
    top:-70%; bottom:-70%;
    width:7px;
    border-radius:3px;
    background:#ff3b30;
    opacity:0.55;
    box-shadow:0 0 9px 2px rgba(255,59,48,0.5);
    transform:rotate(45deg);
    animation: scan-red 1.5s linear infinite alternate;
    pointer-events:none;
  }
  .bar.is-dragging-source{ opacity:0.32; }
  .bar.swap-target{ outline:2px dashed #fff; outline-offset:-3px; }
  .bar-time{
    color:#fff;
    font-weight:700;
    font-size:0.68rem;
    background:rgba(0,0,0,0.2);
    padding:1px 5px;
    border-radius:4px;
    flex:none;
    pointer-events:none;
  }
  .bar-label{
    color:#fff;
    font-size:0.72rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
    flex:1;
    pointer-events:none;
  }
  .bar.is-done .bar-label{ text-decoration:line-through; }
  .bar-handle{
    position:absolute; top:0; bottom:0; width:9px;
    cursor:ew-resize;
    z-index:2;
  }
  .bar-handle.left{ left:0; }
  .bar-handle.right{ right:0; }

  .drag-ghost{
    position:fixed;
    z-index:300;
    pointer-events:none;
    color:#fff;
    font-size:0.74rem;
    font-weight:600;
    padding:6px 12px;
    border-radius:7px;
    box-shadow:0 10px 22px rgba(0,0,0,0.32);
    max-width:220px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transform:rotate(-1.5deg);
  }

  /* ---------- Tooltip ---------- */
  .task-tooltip{
    position:fixed;
    z-index:200;
    background:var(--ink);
    color:#fff;
    padding:10px 13px;
    border-radius:14px;
    font-size:0.76rem;
    max-width:260px;
    line-height:1.45;
    pointer-events:none;
    box-shadow:0 8px 22px rgba(0,0,0,0.22);
    overflow-wrap:anywhere;
    word-break:break-word;
  }
  .task-tooltip.hidden{ display:none; }
  .tt-title{ font-weight:600; margin-bottom:3px; font-size:0.82rem; overflow-wrap:anywhere; word-break:break-word; }
  .tt-desc{ color:#DAD8CE; margin-bottom:6px; overflow-wrap:anywhere; word-break:break-word; }
  .tt-meta{ color:#AFB3A6; font-size:0.7rem; overflow-wrap:anywhere; word-break:break-word; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(30,30,25,0.35);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay.hidden{ display:none; }
  .modal{
    background:var(--surface);
    border-radius:22px;
    width:100%; max-width:600px;
    padding:24px 24px 20px;
    border:1px solid var(--line);
    max-height:92vh;
    overflow-y:auto;
  }
  .modal h2{
    font-family:'IBM Plex Mono', monospace;
    font-size:1.1rem;
    margin:0 0 16px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:0.74rem;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input[type=text], .field textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:12px;
    font-size:0.88rem;
    background:#fff;
    color:var(--ink);
    resize:vertical;
  }
  .field textarea{ min-height:52px; font-size:0.82rem; line-height:1.4; }
  .field input:focus, .field textarea:focus{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .row-3{ display:flex; gap:10px; }
  .row-3 .field{ flex:1; }
  .field input[type=date]{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:12px;
    font-size:0.82rem;
    background:#fff;
    color:var(--ink);
  }
  .time-field-btn{
    width:100%;
    text-align:left;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:var(--ink);
    font-size:0.82rem;
    cursor:pointer;
    font-family:inherit;
  }
  .time-field-btn:hover{ background:var(--accent-tint); border-color:var(--accent); }

  .palette-grid{
    display:grid;
    grid-template-columns:repeat(20, 1fr);
    gap:3px;
    width:100%;
  }
  .swatch{
    width:100%;
    aspect-ratio:1/1;
    border-radius:3px;
    cursor:pointer;
    border:1.5px solid transparent;
    position:relative;
  }
  .swatch.selected{ border-color:var(--ink); transform:scale(1.2); }
  .palette-foot{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:8px;
  }
  .link-plain{
    background:none; border:none; color:var(--accent);
    font-size:0.76rem; cursor:pointer; padding:2px;
    text-decoration:underline;
    font-family:inherit;
  }
  .recur-box{
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .recur-toggle{
    display:flex; align-items:center; gap:8px;
    font-size:0.82rem;
    cursor:pointer;
  }
  .recur-toggle input{ width:15px; height:15px; }
  .recur-fields{ display:flex; gap:10px; margin-top:10px; }
  .recur-fields .field{ flex:1; margin-bottom:0; }
  .recur-fields select{
    width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:8px;
    font-size:0.8rem; background:#fff; color:var(--ink); font-family:inherit;
  }
  .modal-actions{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:18px;
    gap:8px; flex-wrap:wrap;
  }
  .modal-actions .left{ display:flex; gap:12px; }
  .modal-actions .right{ display:flex; gap:8px; }
  .link-danger{
    background:none; border:none; color:var(--danger);
    font-size:0.8rem; cursor:pointer; padding:6px 2px;
    font-family:inherit;
  }
  .link-danger:hover{ text-decoration:underline; }
  .link-muted{
    background:none; border:none; color:var(--ink-soft);
    font-size:0.8rem; cursor:pointer; padding:6px 2px;
    font-family:inherit;
  }
  .link-muted:hover{ text-decoration:underline; color:var(--ink); }
  .hidden{ display:none !important; }

  /* ---------- Time popover ---------- */
  .time-popover{
    position:fixed;
    z-index:210;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:8px;
    box-shadow:0 10px 26px rgba(0,0,0,0.14);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .tp-clear{
    font-size:0.74rem; color:var(--accent); cursor:pointer;
    text-align:center; padding:4px; border-bottom:1px solid var(--line-soft);
  }
  .tp-clear:hover{ text-decoration:underline; }
  .tp-cols{ display:flex; gap:14px; }
  .tp-col{
    display:grid;
    gap:3px;
  }
  .tp-col.tp-hours{ grid-template-columns:repeat(6, 27px); }
  .tp-col.tp-minutes{ grid-template-columns:repeat(3, 30px); align-content:start; }
  .tp-col-label{
    grid-column:1/-1;
    font-size:0.66rem;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:2px;
  }
  .tp-item{
    padding:6px 0; border-radius:8px; cursor:pointer;
    font-size:0.76rem; text-align:center;
  }
  .tp-item:hover{ background:var(--accent-tint); }
  .tp-item.selected{ background:var(--accent); color:#fff; }

  /* ---------- Date popover ---------- */
  .date-popover{
    position:fixed;
    z-index:210;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    box-shadow:0 14px 32px rgba(0,0,0,0.16);
    width:320px;
  }
  .dp-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .dp-head .dp-label{
    font-size:0.95rem; font-weight:700;
    text-transform:uppercase; letter-spacing:0.02em;
  }
  .dp-nav{
    width:30px; height:30px; border-radius:999px;
    border:1px solid var(--line);
    background:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:0.95rem;
  }
  .dp-nav:hover{ background:var(--accent-tint); }
  .dp-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr);
    margin-bottom:4px;
  }
  .dp-weekdays span{
    text-align:center; font-size:0.68rem; color:var(--ink-soft);
    text-transform:uppercase;
  }
  .dp-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:2px;
  }
  .dp-day{
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    font-size:0.86rem;
    cursor:pointer;
  }
  .dp-day:hover{ background:var(--accent-tint); }
  .dp-day.dp-other{ color:var(--ink-faint); }
  .dp-day.dp-today{ font-weight:700; color:var(--today-ring); }
  .dp-day.dp-selected{ background:var(--accent); color:#fff; font-weight:700; }
</style>
</head>
<body>
<script src="assets/memory.js"></script>

<div class="app">
  <aside class="sidebar">
    <div class="panel overdue-panel hidden" id="overdue-panel">
      <div class="panel-head">
        <span class="panel-title">⚠ Просрочено</span>
      </div>
      <div id="overdue-list"></div>
    </div>
    <div class="panel panel-week" id="week-panel">
      <div class="panel-head">
        <span class="panel-title">Неделя</span>
      </div>
      <div class="panel-sub" id="week-range"></div>
      <div class="week-list" id="week-list"></div>
    </div>
  </aside>

  <main class="board">
    <div class="board-header">
      <div class="nav-group">
        <div class="nav-cluster">

<div class="task-tooltip hidden" id="task-tooltip"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'month-planner-v4';
  var MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  var WEEKDAY_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  // ---------- 10x10 generated color palette ----------
  function hslToHex(h,s,l){
    s/=100; l/=100;
    var c=(1-Math.abs(2*l-1))*s;
    var x=c*(1-Math.abs((h/60)%2-1));
    var m=l-c/2;
    var r,g,b;
    if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
    else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    function toHex(v){ var n=Math.round((v+m)*255); var s2=n.toString(16); return s2.length<2?'0'+s2:s2; }
    return '#'+toHex(r)+toHex(g)+toHex(b);
  }
  var PALETTE_GRID = [];
  for(var row=0; row<10; row++){
    for(var col=0; col<20; col++){
      var hue = col*18;
      var light = 30 + row*3.2;
      var sat = 42 + (row%3)*9;
      PALETTE_GRID.push(hslToHex(hue, sat, light));
    }
  }
  function randomColor(){ return PALETTE_GRID[Math.floor(Math.random()*PALETTE_GRID.length)]; }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseKey(k){ var p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function addDays(d,n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function addMonthsSafe(d,n){ var r = new Date(d); var day = r.getDate(); r.setDate(1); r.setMonth(r.getMonth()+n); var last = new Date(r.getFullYear(), r.getMonth()+1, 0).getDate(); r.setDate(Math.min(day,last)); return r; }
  function sameDay(a,b){ return keyOf(a)===keyOf(b); }
  function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function mondayOf(d){ var off=(d.getDay()+6)%7; return addDays(d,-off); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function todayKey(){ return keyOf(startOfDay(new Date())); }

  // ---------- state ----------
  var state = loadState();
  var view = { year: new Date().getFullYear(), month: new Date().getMonth() };
  var editingId = null;
  var selectedColor = randomColor();
  var selectedTime = '';
  var selectedTimeEnd = '';

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ return JSON.parse(raw); }
    }catch(e){}
    return { tasks: [] };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function findTask(id){
    for(var i=0;i<state.tasks.length;i++){ if(state.tasks[i].id===id) return state.tasks[i]; }
    return null;
  }
  function taskColor(t){ return t.color || PALETTE_GRID[0]; }
  function nextOrderValue(){
    var max = -1;
    state.tasks.forEach(function(t){ if(typeof t.order === 'number' && t.order > max) max = t.order; });
    return max + 1;
  }
  function formatDateDisplay(key){
    var p = key.split('-');
    return p[2] + '.' + p[1] + '.' + p[0];
  }
  function formatRange(t){
    return t.start === t.end ? formatDateDisplay(t.start) : (formatDateDisplay(t.start) + ' — ' + formatDateDisplay(t.end));
  }
  function isOverdue(t){
    if(t.done) return false;
    var tk = todayKey();
    if(t.end < tk) return true;
    if(t.end === tk){
      var cutoff = t.timeEnd || t.time;
      if(cutoff){
        var now = new Date();
        var nowHM = pad(now.getHours()) + ':' + pad(now.getMinutes());
        if(nowHM > cutoff) return true;
      }
    }
    return false;
  }
  function timeRangeText(t){
    if(t.time && t.timeEnd) return t.time + '–' + t.timeEnd;
    if(t.time) return t.time;
    return '';
  }

  function daySortCompare(a,b){
    var at = a.time || '99:99', bt = b.time || '99:99';
    if(at !== bt) return at < bt ? -1 : 1;
    return (a.order||0) - (b.order||0);
  }

  // ---------- tooltip ----------
  var tooltipEl = document.getElementById('task-tooltip');
  function showTooltip(task, x, y){
    var html = '<div class="tt-title">' + escapeHtml(task.title) + '</div>';
    if(task.description){ html += '<div class="tt-desc">' + escapeHtml(task.description) + '</div>'; }
    html += '<div class="tt-meta">' + escapeHtml(formatRange(task)) + (timeRangeText(task) ? ' · ' + escapeHtml(timeRangeText(task)) : '') + '</div>';
    tooltipEl.innerHTML = html;
    tooltipEl.classList.remove('hidden');
    positionTooltip(x,y);
  }
  function positionTooltip(x,y){
    var padDist = 16;
    tooltipEl.style.left = '0px'; tooltipEl.style.top='0px';
    var rect = tooltipEl.getBoundingClientRect();
    var left = x + padDist, top = y + padDist;
    if(left + rect.width > window.innerWidth - 8) left = x - rect.width - padDist;
    if(top + rect.height > window.innerHeight - 8) top = y - rect.height - padDist;
    tooltipEl.style.left = Math.max(8,left) + 'px';
    tooltipEl.style.top = Math.max(8,top) + 'px';
  }
  function hideTooltip(){ tooltipEl.classList.add('hidden'); }

  // ---------- overdue panel ----------
  function refreshOverduePanel(){
    var list = state.tasks.filter(isOverdue).sort(function(a,b){ return a.end < b.end ? -1 : 1; });
    var panel = document.getElementById('overdue-panel');
    var listEl = document.getElementById('overdue-list');
    listEl.innerHTML = '';
    if(list.length === 0){ panel.classList.add('hidden'); return; }
    panel.classList.remove('hidden');
    list.forEach(function(t){
      var row = buildTaskRow(t, t.end, true);
      row.classList.add('is-overdue');
      listEl.appendChild(row);
    });
  }

  // ---------- shared task row builder (used by week list + overdue panel) ----------
  function buildTaskRow(t, dayKeyForDrag, draggable){
    var row = document.createElement('div');
    row.className = 'task-row' + (t.done ? ' is-done' : '');

    if(draggable){
      row.draggable = true;
      row.dataset.taskId = t.id;
      row.addEventListener('dragstart', function(e){
        sidebarDrag = { taskId: t.id, dayKey: dayKeyForDrag };
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      row.addEventListener('dragend', function(){
        row.classList.remove('dragging');
        row.classList.remove('drag-over');
        sidebarDrag = null;
      });
      row.addEventListener('dragover', function(e){
        e.preventDefault();
        if(sidebarDrag) row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', function(){ row.classList.remove('drag-over'); });
      row.addEventListener('drop', function(e){
        e.preventDefault();
        e.stopPropagation();
        row.classList.remove('drag-over');
        if(sidebarDrag && sidebarDrag.taskId !== t.id){
          if(sidebarDrag.dayKey === dayKeyForDrag){
            reorderWithinDay(dayKeyForDrag, sidebarDrag.taskId, t.id);
          } else {
            moveTaskToDay(sidebarDrag.taskId, sidebarDrag.dayKey, dayKeyForDrag, t.id);
          }
        }
        sidebarDrag = null;
      });
    }

    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'row-check';
    cb.checked = !!t.done;
    var cbId = 'wcb-' + (dayKeyForDrag||'ov') + '-' + t.id;
    cb.id = cbId;
    cb.addEventListener('change', function(){
      t.done = cb.checked;
      saveState();
      renderCalendar();
      refreshSidebar();
    });

    var body = document.createElement('div');
    body.className = 'row-body';

    var title = document.createElement('label');
    title.setAttribute('for', cbId);
    title.className = 'row-title';
    var dot = document.createElement('span');
    dot.className = 'task-dot';
    dot.style.background = taskColor(t);
    title.appendChild(dot);
    if(t.time){
      var timeSpan = document.createElement('span');
      timeSpan.className = 'row-time';
      timeSpan.textContent = timeRangeText(t);
      title.appendChild(timeSpan);
    }
    title.appendChild(document.createTextNode(t.title));
    title.addEventListener('mouseenter', function(e){ showTooltip(t, e.clientX, e.clientY); });
    title.addEventListener('mousemove', function(e){ positionTooltip(e.clientX, e.clientY); });
    title.addEventListener('mouseleave', hideTooltip);
    title.addEventListener('click', function(e){ e.preventDefault(); openModal(t.id, null); });

    body.appendChild(title);
    if(t.description){
      var desc = document.createElement('div');
      desc.className = 'row-desc';
      desc.textContent = t.description;
      body.appendChild(desc);
    }

    row.appendChild(cb);
    row.appendChild(body);
    return row;
  }

  // ---------- sidebar: week list ----------
  var sidebarDrag = null;

  function tasksForDaySorted(dKey){
    return state.tasks.filter(function(t){ return t.start <= dKey && dKey <= t.end; }).sort(daySortCompare);
  }

  function reorderWithinDay(dKey, draggedId, targetId){
    var list = tasksForDaySorted(dKey);
    var orders = list.map(function(t){ return t.order || 0; });
    var fromIdx = list.findIndex(function(t){ return t.id === draggedId; });
    var toIdx = list.findIndex(function(t){ return t.id === targetId; });
    if(fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;
    var moved = list.splice(fromIdx,1)[0];
    list.splice(toIdx,0,moved);
    list.forEach(function(t,i){ t.order = orders[i]; });
    saveState();
    refreshSidebar();
    renderCalendar();
  }

  function moveTaskToDay(taskId, fromDayKey, toDayKey, targetTaskId){
    var task = findTask(taskId);
    if(!task || fromDayKey === toDayKey) return;
    var deltaDays = Math.round((parseKey(toDayKey) - parseKey(fromDayKey)) / 86400000);
    task.start = keyOf(addDays(parseKey(task.start), deltaDays));
    task.end = keyOf(addDays(parseKey(task.end), deltaDays));
    if(targetTaskId){
      reorderWithinDay(toDayKey, taskId, targetTaskId);
    } else {
      saveState();
      renderCalendar();
      refreshSidebar();
    }
  }

  function refreshSidebar(){
    refreshOverduePanel();

    var today = startOfDay(new Date());
    var weekStart = mondayOf(today);
    var days = [];
    for(var i=0;i<7;i++){ days.push(addDays(weekStart,i)); }

    document.getElementById('week-range').textContent =
      formatShort(days[0]) + ' — ' + formatShort(days[6]);

    var listEl = document.getElementById('week-list');
    listEl.innerHTML = '';

    days.forEach(function(d, idx){
      var dKey = keyOf(d);
      var isToday = sameDay(d, today);
      var group = document.createElement('div');
      group.className = 'day-group' + (isToday ? ' is-today' : '');
      group.addEventListener('dragover', function(e){
        if(sidebarDrag) e.preventDefault();
      });
      group.addEventListener('drop', function(dropDayKey){
        return function(e){
          e.preventDefault();
          if(sidebarDrag && sidebarDrag.dayKey !== dropDayKey){
            moveTaskToDay(sidebarDrag.taskId, sidebarDrag.dayKey, dropDayKey, null);
          }
          sidebarDrag = null;
        };
      }(dKey));

      var head = document.createElement('div');
      head.className = 'day-group-head';
      var num = document.createElement('span');
      num.className = 'dg-num';
      num.textContent = d.getDate();
      var wd = document.createElement('span');
      wd.className = 'dg-weekday';
      wd.textContent = WEEKDAY_SHORT[idx] + (isToday ? ' · сегодня' : '');
      head.appendChild(num);
      head.appendChild(wd);
      group.appendChild(head);

      var tasks = tasksForDaySorted(dKey);

      if(tasks.length === 0){
        var empty = document.createElement('div');
        empty.className = 'empty-note';
        empty.textContent = 'Нет задач';
        group.appendChild(empty);
      } else {
        tasks.forEach(function(t){
          var row = buildTaskRow(t, dKey, true);
          if(isOverdue(t)) row.classList.add('is-overdue');
          group.appendChild(row);
        });
      }
      listEl.appendChild(group);
    });
  }

  function formatShort(d){
    return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3);
  }

  // ---------- calendar geometry helpers (for drag) ----------
  var weekRows = [];
  var dayBgMap = {};

  function dateFromPoint(clientX, clientY){
    if(weekRows.length === 0) return startOfDay(new Date());
    var row = null;
    for(var i=0;i<weekRows.length;i++){
      var r = weekRows[i].el.getBoundingClientRect();
      if(clientY >= r.top && clientY <= r.bottom){ row = weekRows[i]; break; }
    }
    if(!row){
      row = clientY < weekRows[0].el.getBoundingClientRect().top ? weekRows[0] : weekRows[weekRows.length-1];
    }
    var rect = row.el.getBoundingClientRect();
    var colW = rect.width / 7;
    var col = Math.floor((clientX - rect.left) / colW);
    if(col < 0) col = 0; if(col > 6) col = 6;
    return addDays(row.start, col);
  }

  function clearSelectionHighlight(){
    Object.keys(dayBgMap).forEach(function(k){ dayBgMap[k].classList.remove('is-selecting'); });
  }
  function highlightRange(fromDate, toDate){
    clearSelectionHighlight();
    var a = fromDate < toDate ? fromDate : toDate;
    var b = fromDate < toDate ? toDate : fromDate;
    var cur = new Date(a);
    while(cur <= b){
      var el = dayBgMap[keyOf(cur)];
      if(el) el.classList.add('is-selecting');
      cur = addDays(cur,1);
    }
  }

  // ---------- calendar rendering ----------
  function buildGridRange(year, month){
    var first = new Date(year, month, 1);
    var last = new Date(year, month+1, 0);
    var startOffset = (first.getDay() + 6) % 7;
    var endOffset = (last.getDay() + 6) % 7;
    var gridStart = addDays(first, -startOffset);
    var gridEnd = addDays(last, 6 - endOffset);
    return { gridStart: gridStart, gridEnd: gridEnd };
  }

  var renderQueued = false;
  function queueRender(){
    if(renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(function(){ renderQueued = false; renderCalendar(); });
  }

  function renderCalendar(){
    document.getElementById('month-title').textContent =
      MONTHS[view.month].charAt(0).toUpperCase() + MONTHS[view.month].slice(1) + ' ' + view.year;

    var range = buildGridRange(view.year, view.month);
    var gridStart = range.gridStart, gridEnd = range.gridEnd;
    var totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;
    var weekCount = totalDays / 7;

    var startKey = keyOf(gridStart), endKey = keyOf(gridEnd);
    var visibleTasks = state.tasks.filter(function(t){
      return t.start <= endKey && t.end >= startKey;
    }).sort(function(a,b){
      if(a.start !== b.start) return a.start < b.start ? -1 : 1;
      var at = a.time || '99:99', bt = b.time || '99:99';
      if(at !== bt) return at < bt ? -1 : 1;
      return (a.order||0) - (b.order||0);
    });

    var laneEnds = [];
    var laneOf = {};
    visibleTasks.forEach(function(t){
      var placed = false;
      for(var i=0;i<laneEnds.length;i++){
        if(laneEnds[i] < t.start){ laneEnds[i] = t.end; laneOf[t.id] = i; placed = true; break; }
      }
      if(!placed){ laneEnds.push(t.end); laneOf[t.id] = laneEnds.length - 1; }
    });

    var calEl = document.getElementById('calendar');
    calEl.innerHTML = '';
    weekRows = [];
    dayBgMap = {};
    var today = startOfDay(new Date());
    var curWeekStart = mondayOf(today);
    var currentWeekKeys = {};
    for(var cw=0; cw<7; cw++){ currentWeekKeys[keyOf(addDays(curWeekStart,cw))] = true; }

    for(var w=0; w<weekCount; w++){
      var weekStart = addDays(gridStart, w*7);
      var weekDays = [];
      for(var i=0;i<7;i++){ weekDays.push(addDays(weekStart, i)); }
      var weekStartKey = keyOf(weekDays[0]);
      var weekEndKey = keyOf(weekDays[6]);

      var weekBars = [];
      var maxLaneUsed = -1;
      visibleTasks.forEach(function(t){
        if(t.start <= weekEndKey && t.end >= weekStartKey){
          var segStartKey = t.start > weekStartKey ? t.start : weekStartKey;
          var segEndKey = t.end < weekEndKey ? t.end : weekEndKey;
          var startCol = weekDays.findIndex(function(d){ return keyOf(d) === segStartKey; });
          var endCol = weekDays.findIndex(function(d){ return keyOf(d) === segEndKey; });
          var lane = laneOf[t.id];
          maxLaneUsed = Math.max(maxLaneUsed, lane);
          weekBars.push({ task:t, startCol:startCol, endCol:endCol, lane:lane,
            roundL: segStartKey === t.start, roundR: segEndKey === t.end });
        }
      });

      var weekEl = document.createElement('div');
      weekEl.className = 'week';
      weekEl.style.gridTemplateRows = 'auto ' + 'repeat(' + Math.max(maxLaneUsed+1,0) + ', 25px)' + ' 1fr';
      weekRows.push({ el: weekEl, start: weekDays[0] });

      weekDays.forEach(function(d, colIdx){
        var isOtherMonth = d.getMonth() !== view.month;
        var isToday = sameDay(d, today);
        var dKey = keyOf(d);

        var bg = document.createElement('div');
        bg.className = 'day-bg' + (isOtherMonth ? ' other-month' : '') + (isToday ? ' is-today-cell' : '');
        bg.style.gridColumn = (colIdx+1) + ' / ' + (colIdx+2);
        bg.dataset.date = dKey;
        dayBgMap[dKey] = bg;
        bg.addEventListener('pointerdown', onDayPointerDown);
        weekEl.appendChild(bg);

        var num = document.createElement('div');
        num.className = 'day-num' + (isOtherMonth ? ' other-month' : '') + (isToday ? ' today' : '') + (currentWeekKeys[dKey] ? ' current-week' : '');
        num.style.gridColumn = (colIdx+1) + ' / ' + (colIdx+2);
        var circle = document.createElement('span');
        circle.className = 'num-circle';
        circle.textContent = d.getDate();
        num.appendChild(circle);
        weekEl.appendChild(num);
      });

      weekBars.forEach(function(b){
        var el = document.createElement('div');
        el.className = 'bar' + (b.roundL ? ' round-l' : '') + (b.roundR ? ' round-r' : '');
        el.dataset.taskId = b.task.id;
        if(b.task.done) el.classList.add('is-done');
        if(isOverdue(b.task)) el.classList.add('is-overdue');
        if(dragInfo && dragInfo.mode==='move' && dragInfo.taskId===b.task.id) el.classList.add('is-dragging-source');
        if(dragInfo && dragInfo.mode==='move' && dragInfo.swapTargetId===b.task.id) el.classList.add('swap-target');
        el.style.background = taskColor(b.task);
        el.style.gridColumn = (b.startCol+1) + ' / ' + (b.endCol+2);
        el.style.gridRow = (b.lane+2) + ' / ' + (b.lane+3);

        el.addEventListener('mouseenter', function(task){
          return function(e){ showTooltip(task, e.clientX, e.clientY); };
        }(b.task));
        el.addEventListener('mousemove', function(e){ positionTooltip(e.clientX, e.clientY); });
        el.addEventListener('mouseleave', hideTooltip);

        if(b.roundL){
          var lh = document.createElement('div');
          lh.className = 'bar-handle left';
          lh.addEventListener('pointerdown', function(taskId){
            return function(e){ startDrag(e, taskId, 'resize-left'); };
          }(b.task.id));
          el.appendChild(lh);
        }

        if(b.task.time){
          var timeEl = document.createElement('span');
          timeEl.className = 'bar-time';
          timeEl.textContent = timeRangeText(b.task);
          el.appendChild(timeEl);
        }

        var label = document.createElement('span');
        label.className = 'bar-label';
        label.textContent = b.task.title;
        el.appendChild(label);

        if(b.roundR){
          var rh = document.createElement('div');
          rh.className = 'bar-handle right';
          rh.addEventListener('pointerdown', function(taskId){
            return function(e){ startDrag(e, taskId, 'resize-right'); };
          }(b.task.id));
          el.appendChild(rh);
        }

        el.addEventListener('pointerdown', function(taskId){
          return function(e){
            if(e.target.classList.contains('bar-handle')) return;
            hideTooltip();
            startDrag(e, taskId, 'move');
          };
        }(b.task.id));

        weekEl.appendChild(el);
      });

      calEl.appendChild(weekEl);
    }
  }

  // ---------- drag: move / resize existing task ----------
  var dragInfo = null;

  function positionGhost(x,y){
    if(dragInfo && dragInfo.ghostEl){
      dragInfo.ghostEl.style.left = (x+16)+'px';
      dragInfo.ghostEl.style.top = (y+16)+'px';
    }
  }

  function startDrag(e, taskId, mode){
    e.preventDefault();
    e.stopPropagation();
    hideTooltip();
    var task = findTask(taskId);
    dragInfo = {
      mode: mode,
      taskId: taskId,
      origStart: task.start,
      origEnd: task.end,
      anchor: dateFromPoint(e.clientX, e.clientY),
      moved: false,
      swapTargetId: null,
      ghostEl: null
    };
    if(mode === 'move'){
      var ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.style.background = taskColor(task);
      ghost.textContent = (task.time ? timeRangeText(task) + ' · ' : '') + task.title;
      document.body.appendChild(ghost);
      dragInfo.ghostEl = ghost;
      positionGhost(e.clientX, e.clientY);
    }
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
  }

  function onDragMove(e){
    if(!dragInfo) return;
    positionGhost(e.clientX, e.clientY);
    var cur = dateFromPoint(e.clientX, e.clientY);
    if(!sameDay(cur, dragInfo.anchor)) dragInfo.moved = true;
    var t = findTask(dragInfo.taskId);
    if(!t) return;

    if(dragInfo.mode === 'move'){
      var deltaDays = Math.round((cur - dragInfo.anchor) / 86400000);
      t.start = keyOf(addDays(parseKey(dragInfo.origStart), deltaDays));
      t.end = keyOf(addDays(parseKey(dragInfo.origEnd), deltaDays));

      var hoverEl = document.elementFromPoint(e.clientX, e.clientY);
      var hoverBar = hoverEl ? hoverEl.closest('.bar') : null;
      if(hoverBar && hoverBar.dataset.taskId && hoverBar.dataset.taskId !== dragInfo.taskId){
        dragInfo.swapTargetId = hoverBar.dataset.taskId;
        dragInfo.moved = true;
      } else {
        dragInfo.swapTargetId = null;
      }
    } else if(dragInfo.mode === 'resize-left'){
      var ks = keyOf(cur);
      if(ks <= dragInfo.origEnd) t.start = ks;
    } else if(dragInfo.mode === 'resize-right'){
      var ke = keyOf(cur);
      if(ke >= dragInfo.origStart) t.end = ke;
    }
    queueRender();
  }

  function onDragEnd(e){
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    if(!dragInfo) return;
    var info = dragInfo;
    if(info.ghostEl) info.ghostEl.remove();
    dragInfo = null;

    var t = findTask(info.taskId);
    if(info.mode === 'move' && info.swapTargetId && t){
      var t2 = findTask(info.swapTargetId);
      if(t2){
        var tmp = t.order || 0;
        t.order = t2.order || 0;
        t2.order = tmp;
      }
    }

    saveState();
    renderCalendar();
    refreshSidebar();
    if(!info.moved){
      openModal(info.taskId, null);
    }
  }

  // ---------- drag: select empty days to create a task ----------
  var selectInfo = null;

  function onDayPointerDown(e){
    var startDate = parseKey(e.currentTarget.dataset.date);
    selectInfo = { anchor: startDate, moved: false };
    document.addEventListener('pointermove', onSelectMove);
    document.addEventListener('pointerup', onSelectEnd);
  }

  function onSelectMove(e){
    if(!selectInfo) return;
    var cur = dateFromPoint(e.clientX, e.clientY);
    if(!sameDay(cur, selectInfo.anchor)) selectInfo.moved = true;
    highlightRange(selectInfo.anchor, cur);
  }

  function onSelectEnd(e){
    document.removeEventListener('pointermove', onSelectMove);
    document.removeEventListener('pointerup', onSelectEnd);
    if(!selectInfo) return;
    var cur = dateFromPoint(e.clientX, e.clientY);
    clearSelectionHighlight();
    var a = selectInfo.anchor < cur ? selectInfo.anchor : cur;
    var b = selectInfo.anchor < cur ? cur : selectInfo.anchor;
    selectInfo = null;
    openModal(null, a, b);
  }

  // ---------- time popover ----------
  var activeTimeField = 'start';
  function closeTimePopover(){
    var pop = document.getElementById('time-popover');
    if(pop) pop.remove();
    document.removeEventListener('mousedown', outsideTimeClick, true);
  }
  function outsideTimeClick(e){
    var pop = document.getElementById('time-popover');
    if(pop && !pop.contains(e.target) && e.target.id !== 'f-time-btn' && e.target.id !== 'f-time-end-btn'){
      closeTimePopover();
    }
  }
  function updateTimeBtn(){
    document.getElementById('f-time-btn').textContent = selectedTime || 'Без времени';
    document.getElementById('f-time-end-btn').textContent = selectedTimeEnd || 'Без времени';
  }
  function openTimePopover(field){
    activeTimeField = field;
    closeTimePopover();
    var anchorEl = document.getElementById(field === 'end' ? 'f-time-end-btn' : 'f-time-btn');
    var current = field === 'end' ? selectedTimeEnd : selectedTime;
    var pop = document.createElement('div');
    pop.className = 'time-popover';
    pop.id = 'time-popover';

    var clear = document.createElement('div');
    clear.className = 'tp-clear';
    clear.textContent = 'Без времени';
    clear.addEventListener('click', function(){
      if(field === 'end'){ selectedTimeEnd = ''; } else { selectedTime = ''; }
      updateTimeBtn(); closeTimePopover();
    });
    pop.appendChild(clear);

    var cols = document.createElement('div');
    cols.className = 'tp-cols';

    var curH = current ? current.split(':')[0] : null;
    var curM = current ? current.split(':')[1] : null;

    var hoursCol = document.createElement('div');
    hoursCol.className = 'tp-col tp-hours';
    var hoursLabel = document.createElement('div');
    hoursLabel.className = 'tp-col-label';
    hoursLabel.textContent = 'Часы';
    hoursCol.appendChild(hoursLabel);
    for(var h=0; h<24; h++){
      var hh = pad(h);
      var item = document.createElement('div');
      item.className = 'tp-item' + (curH === hh ? ' selected' : '');
      item.textContent = hh;
      item.addEventListener('click', function(hhVal){
        return function(){
          var cur2 = field === 'end' ? selectedTimeEnd : selectedTime;
          var mm = cur2 ? cur2.split(':')[1] : '00';
          var val = hhVal + ':' + mm;
          if(field === 'end'){ selectedTimeEnd = val; } else { selectedTime = val; }
          updateTimeBtn();
          openTimePopover(field);
        };
      }(hh));
      hoursCol.appendChild(item);
    }
    cols.appendChild(hoursCol);

    var minCol = document.createElement('div');
    minCol.className = 'tp-col tp-minutes';
    var minLabel = document.createElement('div');
    minLabel.className = 'tp-col-label';
    minLabel.textContent = 'Минуты';
    minCol.appendChild(minLabel);
    ['00','05','10','15','20','25','30','35','40','45','50','55'].forEach(function(mm){
      var item = document.createElement('div');
      item.className = 'tp-item' + (curM === mm ? ' selected' : '');
      item.textContent = mm;
      item.addEventListener('click', function(mmVal){
        return function(){
          var cur2 = field === 'end' ? selectedTimeEnd : selectedTime;
          var hh = cur2 ? cur2.split(':')[0] : '09';
          var val = hh + ':' + mmVal;
          if(field === 'end'){ selectedTimeEnd = val; } else { selectedTime = val; }
          updateTimeBtn();
          closeTimePopover();
        };
      }(mm));
      minCol.appendChild(item);
    });
    cols.appendChild(minCol);

    pop.appendChild(cols);
    document.body.appendChild(pop);

    var rect = anchorEl.getBoundingClientRect();
    var popRect = pop.getBoundingClientRect();
    var left = rect.left, top = rect.bottom + 6;
    if(left + popRect.width > window.innerWidth - 8) left = window.innerWidth - popRect.width - 8;
    if(top + popRect.height > window.innerHeight - 8) top = rect.top - popRect.height - 6;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';

    setTimeout(function(){ document.addEventListener('mousedown', outsideTimeClick, true); }, 0);
  }
  document.getElementById('f-time-btn').addEventListener('click', function(){ openTimePopover('start'); });
  document.getElementById('f-time-end-btn').addEventListener('click', function(){ openTimePopover('end'); });

  // ---------- modal ----------
  var overlay = document.getElementById('modal-overlay');
  var fTitle = document.getElementById('f-title');
  var fDesc = document.getElementById('f-desc');
  var fStartBtn = document.getElementById('f-start-btn');
  var fEndBtn = document.getElementById('f-end-btn');
  var fDelete = document.getElementById('f-delete');
  var fDuplicate = document.getElementById('f-duplicate');
  var fRecurOn = document.getElementById('f-recur-on');
  var fRecurFields = document.getElementById('recur-fields');
  var fRecurFreq = document.getElementById('f-recur-freq');
  var fRecurUntil = document.getElementById('f-recur-until');
  var selectedStart = '';
  var selectedEnd = '';
  var RU_MONTHS_SHORT = MONTHS;

  fRecurOn.addEventListener('change', function(){
    fRecurFields.classList.toggle('hidden', !fRecurOn.checked);
  });

  function renderPalette(){
    var el = document.getElementById('f-palette');
    el.innerHTML = '';
    PALETTE_GRID.forEach(function(hex){
      var sw = document.createElement('div');
      sw.className = 'swatch' + (hex === selectedColor ? ' selected' : '');
      sw.style.background = hex;
      sw.addEventListener('click', function(){ selectedColor = hex; renderPalette(); });
      el.appendChild(sw);
    });
  }

  document.getElementById('f-randomize').addEventListener('click', function(){
    selectedColor = randomColor();
    renderPalette();
  });

  function updateDateBtns(){
    fStartBtn.textContent = selectedStart || '—';
    fEndBtn.textContent = selectedEnd || '—';
  }

  // ---------- date popover ----------
  var datePopState = { field: 'start', year: 0, month: 0 };
  function closeDatePopover(){
    var pop = document.getElementById('date-popover');
    if(pop) pop.remove();
    document.removeEventListener('mousedown', outsideDateClick, true);
  }
  function outsideDateClick(e){
    var pop = document.getElementById('date-popover');
    if(pop && !pop.contains(e.target) && e.target.id !== 'f-start-btn' && e.target.id !== 'f-end-btn'){
      closeDatePopover();
    }
  }
  function openDatePopover(field){
    datePopState.field = field;
    var current = field === 'end' ? selectedEnd : selectedStart;
    var base = current ? parseKey(current) : new Date();
    datePopState.year = base.getFullYear();
    datePopState.month = base.getMonth();
    renderDatePopover();
  }
  function renderDatePopover(){
    closeDatePopover();
    var field = datePopState.field;
    var anchorEl = document.getElementById(field === 'end' ? 'f-end-btn' : 'f-start-btn');
    var pop = document.createElement('div');
    pop.className = 'date-popover';
    pop.id = 'date-popover';

    var head = document.createElement('div');
    head.className = 'dp-head';
    var prevBtn = document.createElement('div');
    prevBtn.className = 'dp-nav';
    prevBtn.textContent = '‹';
    prevBtn.addEventListener('click', function(){
      datePopState.month--; if(datePopState.month < 0){ datePopState.month = 11; datePopState.year--; }
      renderDatePopover();
    });
    var label = document.createElement('div');
    label.className = 'dp-label';
    label.textContent = RU_MONTHS_SHORT[datePopState.month] + ' ' + datePopState.year;
    var nextBtn = document.createElement('div');
    nextBtn.className = 'dp-nav';
    nextBtn.textContent = '›';
    nextBtn.addEventListener('click', function(){
      datePopState.month++; if(datePopState.month > 11){ datePopState.month = 0; datePopState.year++; }
      renderDatePopover();
    });
    head.appendChild(prevBtn); head.appendChild(label); head.appendChild(nextBtn);
    pop.appendChild(head);

    var wd = document.createElement('div');
    wd.className = 'dp-weekdays';
    WEEKDAY_SHORT.forEach(function(w){ var s=document.createElement('span'); s.textContent=w; wd.appendChild(s); });
    pop.appendChild(wd);

    var grid = document.createElement('div');
    grid.className = 'dp-grid';
    var range = buildGridRange(datePopState.year, datePopState.month);
    var totalDays = Math.round((range.gridEnd - range.gridStart) / 86400000) + 1;
    var todK = todayKey();
    var current = field === 'end' ? selectedEnd : selectedStart;
    for(var i=0;i<totalDays;i++){
      var d = addDays(range.gridStart, i);
      var dKey = keyOf(d);
      var cell = document.createElement('div');
      cell.className = 'dp-day';
      if(d.getMonth() !== datePopState.month) cell.classList.add('dp-other');
      if(dKey === todK) cell.classList.add('dp-today');
      if(dKey === current) cell.classList.add('dp-selected');
      cell.textContent = d.getDate();
      cell.addEventListener('click', function(pickedKey){
        return function(){
          if(field === 'start'){
            selectedStart = pickedKey;
            if(selectedEnd && selectedEnd < selectedStart) selectedEnd = selectedStart;
          } else {
            selectedEnd = pickedKey;
            if(selectedStart && selectedEnd < selectedStart) selectedStart = selectedEnd;
          }
          updateDateBtns();
          closeDatePopover();
        };
      }(dKey));
      grid.appendChild(cell);
    }
    pop.appendChild(grid);
    document.body.appendChild(pop);

    var rect = anchorEl.getBoundingClientRect();
    var popRect = pop.getBoundingClientRect();
    var left = rect.left, top = rect.bottom + 6;
    if(left + popRect.width > window.innerWidth - 8) left = window.innerWidth - popRect.width - 8;
    if(top + popRect.height > window.innerHeight - 8) top = rect.top - popRect.height - 6;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';

    setTimeout(function(){ document.addEventListener('mousedown', outsideDateClick, true); }, 0);
  }
  fStartBtn.addEventListener('click', function(){ openDatePopover('start'); });
  fEndBtn.addEventListener('click', function(){ openDatePopover('end'); });

  function openModal(taskId, defaultStart, defaultEnd){
    editingId = taskId;
    var task = taskId ? findTask(taskId) : null;

    document.getElementById('modal-title').textContent = task ? 'Изменить задачу' : 'Новая задача';
    fDelete.classList.toggle('hidden', !task);
    fDuplicate.classList.toggle('hidden', !task);
    document.getElementById('recur-box').classList.toggle('hidden', !!task);
    fRecurOn.checked = false;
    fRecurFields.classList.add('hidden');

    if(task){
      fTitle.value = task.title;
      fDesc.value = task.description || '';
      selectedStart = task.start;
      selectedEnd = task.end;
      selectedTime = task.time || '';
      selectedTimeEnd = task.timeEnd || '';
      selectedColor = task.color;
    } else {
      var s = defaultStart ? keyOf(defaultStart) : keyOf(new Date());
      var eD = defaultEnd ? keyOf(defaultEnd) : s;
      fTitle.value = '';
      fDesc.value = '';
      selectedStart = s;
      selectedEnd = eD;
      selectedTime = '';
      selectedTimeEnd = '';
      selectedColor = randomColor();
      fRecurUntil.value = keyOf(addDays(parseKey(s), 60));
      fRecurFreq.value = 'weekly';
    }
    updateDateBtns();
    updateTimeBtn();
    renderPalette();
    overlay.classList.remove('hidden');
    setTimeout(function(){ fTitle.focus(); }, 30);
  }

  function closeModal(){
    overlay.classList.add('hidden');
    closeTimePopover();
    closeDatePopover();
    editingId = null;
  }

  document.getElementById('f-cancel').addEventListener('click', closeModal);
  fTitle.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('f-save').click(); }
  });
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !overlay.classList.contains('hidden')) closeModal();
  });

  document.getElementById('add-recurring-btn').addEventListener('click', function(){
    openModal(null, new Date());
    fRecurOn.checked = true;
    fRecurFields.classList.remove('hidden');
  });

  document.getElementById('f-save').addEventListener('click', function(){
    var title = fTitle.value.trim();
    if(!title){ fTitle.focus(); return; }
    var description = fDesc.value.trim();
    var start = selectedStart;
    var end = selectedEnd < start ? start : selectedEnd;
    var time = selectedTime || '';
    var timeEnd = selectedTimeEnd || '';

    if(editingId){
      var t = findTask(editingId);
      t.title = title; t.description = description; t.start = start; t.end = end;
      t.color = selectedColor; t.time = time; t.timeEnd = timeEnd;
    } else {
      var span = Math.round((parseKey(end) - parseKey(start)) / 86400000);
      var occurrences = [{ start: start, end: end }];

      if(fRecurOn.checked && fRecurUntil.value){
        var freq = fRecurFreq.value;
        var untilDate = parseKey(fRecurUntil.value);
        var curStart = parseKey(start);
        var safety = 0;
        while(safety < 200){
          safety++;
          var nextStart = freq === 'daily' ? addDays(curStart,1) :
                           freq === 'weekly' ? addDays(curStart,7) :
                           addMonthsSafe(curStart,1);
          if(nextStart > untilDate) break;
          var nextEnd = addDays(nextStart, span);
          occurrences.push({ start: keyOf(nextStart), end: keyOf(nextEnd) });
          curStart = nextStart;
        }
      }

      occurrences.forEach(function(occ, idx){
        state.tasks.push({
          id: 't' + Date.now() + Math.floor(Math.random()*100000) + '_' + idx,
          title: title, description: description, start: occ.start, end: occ.end,
          color: selectedColor, time: time, timeEnd: timeEnd, done: false, order: nextOrderValue()
        });
      });
    }
    saveState();
    closeModal();
    renderCalendar();
    refreshSidebar();
  });

  fDelete.addEventListener('click', function(){
    if(!editingId) return;
    state.tasks = state.tasks.filter(function(t){ return t.id !== editingId; });
    saveState();
    closeModal();
    renderCalendar();
    refreshSidebar();
  });

  fDuplicate.addEventListener('click', function(){
    if(!editingId) return;
    var t = findTask(editingId);
    var copy = Object.assign({}, t, {
      id: 't' + Date.now() + Math.floor(Math.random()*1000),
      order: nextOrderValue()
    });
    state.tasks.push(copy);
    saveState();
    closeModal();
    renderCalendar();
    refreshSidebar();
    openModal(copy.id, null);
  });

  // ---------- nav ----------
  document.getElementById('prev-month').addEventListener('click', function(){
    view.month--; if(view.month < 0){ view.month = 11; view.year--; }
    renderCalendar();
  });
  document.getElementById('next-month').addEventListener('click', function(){
    view.month++; if(view.month > 11){ view.month = 0; view.year++; }
    renderCalendar();
  });
  document.getElementById('today-btn').addEventListener('click', function(){
    var n = new Date(); view.year = n.getFullYear(); view.month = n.getMonth();
    renderCalendar();
  });
  document.getElementById('add-task-btn').addEventListener('click', function(){
    openModal(null, new Date());
  });

  // ---------- init / seed ----------
  if(state.tasks.length === 0){
    var t0 = startOfDay(new Date());
    state.tasks.push(
      { id:'seed1', title:'Согласовать бюджет с финансовым отделом на третий квартал', description:'Проверить цифры перед отправкой директору', start: keyOf(addDays(t0,-2)), end: keyOf(addDays(t0,-1)), color: randomColor(), time:'10:00', timeEnd:'11:00', done:false, order:0 },
      { id:'seed2', title:'Забрать посылку', description:'Пункт выдачи у метро', start: keyOf(addDays(t0,1)), end: keyOf(addDays(t0,1)), color: randomColor(), time:'18:30', timeEnd:'', done:false, order:1 },
      { id:'seed3', title:'Спринт-ревью', description:'', start: keyOf(addDays(t0,3)), end: keyOf(addDays(t0,5)), color: randomColor(), time:'', timeEnd:'', done:false, order:2 },
      { id:'seed4', title:'Финансовое планирование', description:'Еженедельный обзор бюджета', start: keyOf(t0), end: keyOf(t0), color: randomColor(), time:'09:00', timeEnd:'09:30', done:false, order:3 }
    );
    saveState();
  }

  renderCalendar();
  refreshSidebar();

  // ---------- live clock + time-based overdue refresh ----------
  function updateNowBadge(){
    var d = new Date();
    document.getElementById('now-badge').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  updateNowBadge();
  setInterval(updateNowBadge, 1000);
  setInterval(function(){
    if(!dragInfo && !selectInfo && overlay.classList.contains('hidden')){
      renderCalendar();
      refreshSidebar();
    }
  }, 20000);
})();
</script>
</body>
